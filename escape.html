<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><!--pt--><script src="playtime.js" data-app="escape"></script><!--/pt-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Treehouse Escape · הבריחה מבית העץ</title><script src="safe.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%91%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
body{font-family:"Varela Round","Fredoka","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#4a2c6b;background:linear-gradient(#ffe9a8,#ffc7d9);user-select:none;-webkit-user-select:none}
body.sea{background:linear-gradient(#bfe9ff,#7cc7e8)}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{position:fixed;top:0;left:0;right:0;height:calc(100dvh - 40px);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.screen{display:none;width:100%;height:100%;flex-direction:column;align-items:center}
.screen.on{display:flex}
.iconbtn{width:46px;height:46px;min-width:46px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 rgba(74,44,107,.25);font-size:22px;display:flex;align-items:center;justify-content:center;padding:0}
.big{display:block;width:100%;min-height:52px;border:none;border-radius:999px;background:#ff7a3d;color:#fff;font-size:clamp(18px,5vw,22px);font-weight:700;box-shadow:0 5px 0 #b84c1c;padding:8px 14px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b84c1c}
.big.alt{background:#7c5cff;box-shadow:0 5px 0 #4b33b8}
.big.soft{background:#fff;color:#4a2c6b;box-shadow:0 5px 0 rgba(74,44,107,.25)}
.langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.langs button{min-height:46px;min-width:64px;border-radius:999px;border:3px solid #fff;background:rgba(255,255,255,.6);font-size:16px;font-weight:700;padding:4px 12px}
.langs button.sel{background:#7c5cff;color:#fff;border-color:#7c5cff}
.link{background:none;border:none;text-decoration:underline;font-size:15px;min-height:44px;padding:6px 10px;color:#4a2c6b}
/* start */
#start{justify-content:center;padding:56px 18px 10px;gap:clamp(6px,1.6vh,14px);text-align:center}
#start .tig{height:clamp(90px,24vh,200px);animation:wig 1.2s ease-in-out infinite}
#start h1{margin:0;font-size:clamp(24px,7vw,40px);color:#ff7a3d;line-height:1.1;text-shadow:0 2px 0 #fff}
#start h1 small{display:block;font-size:.55em;color:#4a2c6b}
#start p{margin:0;font-size:clamp(15px,4.2vw,19px);max-width:440px;line-height:1.35}
#start .btns{width:min(100%,380px);display:flex;flex-direction:column;gap:10px}
#start .paws{font-weight:700;font-size:16px}
.corner{position:absolute;top:8px;inset-inline-end:8px}
/* game */
#game{max-width:640px}
.top{width:100%;display:flex;align-items:center;gap:8px;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));min-height:58px}
.top .info{flex:1;min-width:0}
.top .rname{font-weight:700;font-size:clamp(14px,4vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .rnum{font-size:12px;font-weight:700;opacity:.8}
.bar{display:flex;gap:4px;margin-top:3px}
.bar span{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.7)}
.bar span.d{background:#ff7a3d}
.starspill{background:#fff;border-radius:999px;padding:6px 10px;font-size:20px;font-weight:700;white-space:nowrap;box-shadow:0 3px 0 rgba(74,44,107,.2);direction:ltr}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:0 6px}
.box{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(74,44,107,.3);direction:ltr}
.box img{width:100%;height:100%;display:block;pointer-events:none}
.hot{position:absolute;min-width:46px;min-height:46px;border-radius:22px;border:3px dashed rgba(255,214,79,.75);background:rgba(255,255,255,.05);animation:pulse 1.8s ease-in-out infinite;padding:0}
.hot:active{background:rgba(255,214,79,.45)}
.hot.got{border-color:rgba(124,92,255,.0);animation:none;background:none}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.say{width:100%;display:flex;align-items:flex-end;gap:6px;padding:6px 8px 4px;height:clamp(86px,15vh,110px)}
.say img{height:100%;max-height:96px;aspect-ratio:1;animation:wig 1.2s ease-in-out infinite;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.bubble{flex:1;min-width:0;align-self:stretch;background:#fffaf0;border:3px solid #ff7a3d;border-radius:20px;padding:6px 10px;font-size:clamp(14px,3.9vw,17px);font-weight:600;line-height:1.3;display:flex;align-items:center;overflow:hidden}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
/* overlays */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:rgba(53,30,80,.55);z-index:10}
.ov.on{display:flex}
.card{width:min(100%,420px);max-height:100%;overflow:auto;background:#fffaf0;border:6px solid #ffd64f;border-radius:28px;padding:clamp(10px,2.4vh,20px) 14px;text-align:center;animation:pop .35s cubic-bezier(.3,1.6,.6,1);display:flex;flex-direction:column;gap:clamp(6px,1.3vh,12px)}
.card>*{flex-shrink:0}
.card h2{margin:0;font-size:clamp(20px,5.8vw,28px);color:#ff7a3d}
.card p{margin:0}
.q{font-size:clamp(17px,4.8vw,22px);font-weight:700;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px)}
.opts .big{min-height:50px}
.opts .big.no{background:#cbbbd9;box-shadow:0 5px 0 #9b88ad}
.msg{font-size:16px;font-weight:700;color:#d2462b;min-height:0}
.hintbtn{min-height:48px;border-radius:999px;border:3px solid #ff7a3d;background:#ffd64f;font-size:17px;font-weight:700;padding:4px 12px}
.hint{background:#fff1b8;border-radius:16px;padding:8px 10px;font-size:16px;line-height:1.35;animation:pop .35s}
.custom{font-size:12px;font-weight:700;color:#7c5cff}
.winbig{font-size:clamp(40px,10vh,64px);line-height:1}
.menu{display:flex;flex-direction:column;gap:10px}
.conf{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.conf i{position:absolute;top:-20px;font-style:normal;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* editor */
#ed .card{width:min(100%,460px);text-align:start;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;min-height:44px;min-width:44px;border-radius:14px;border:2px solid #7c5cff;background:#fff;font-weight:700;font-size:15px;padding:2px 6px}
.tabs button.sel{background:#7c5cff;color:#fff}
#ed textarea,#ed input[type=text]{width:100%;font-family:inherit;font-size:16px;border:2px solid #ffb38f;border-radius:12px;padding:8px;color:#4a2c6b;background:#fff;user-select:text;-webkit-user-select:text}
#ed textarea{resize:none;height:64px}
@media (max-height:660px){#edIntro{display:none}}
@media (max-height:700px){#ed .card{gap:5px;padding:9px 12px}#ed .note{font-size:12px}#ed textarea{height:54px}.edrow .big{min-height:48px}}
.optrow{display:flex;align-items:center;gap:8px}
.optrow label{width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center}
.optrow input[type=radio]{width:26px;height:26px;accent-color:#ff7a3d;margin:0}
.edrow{display:flex;gap:8px}
.edrow .big{font-size:17px}
.err{color:#d2462b;font-size:14px;font-weight:700}
.note{font-size:13px;opacity:.8}

/*landscape-fit*/@media (orientation:landscape) and (max-height:500px){#pause{overflow-y:auto!important;align-items:safe center!important;justify-content:safe center!important}#pause>*{max-height:none!important;margin:auto}}
</style>
<!--pwa--><link rel="manifest" href="manifests/escape.webmanifest"><meta name="theme-color" content="#ffd6b8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="בית העץ"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/escape-apple-180.png"><script src="pwa.js" data-app="escape" data-slots='[["#langS", "after"], ["#pause .card", "append"]]' defer></script><script src="nav.js" data-menuslot="#langS" data-pauseslot="#pause .card" data-relabel="#paHome" defer></script><!--/pwa-->
</head>
<body>
<div class="app" id="app">
  <section class="screen on" id="start">
    <button class="iconbtn corner" id="muteS" aria-label="sound">🔊</button>
    <img class="tig" id="tigS" alt="Tigero">
    <h1><small id="sSub"></small><span id="sTitle"></span></h1>
    <p id="sIntro"></p>
    <div class="langs" id="langS"></div>
    <div class="paws" id="sPaws"></div>
    <div class="btns"><button class="big" id="goBtn"></button><button class="big soft" id="againBtn"></button></div>
  </section>
  <section class="screen" id="game">
    <div class="top">
      <button class="iconbtn" id="pauseBtn" aria-label="pause">⏸️</button>
      <div class="info"><div class="rnum" id="rNum"></div><div class="rname" id="rName"></div><div class="bar" id="bar"><span></span><span></span><span></span><span></span></div></div>
      <div class="starspill" id="stars">☆☆☆</div>
    </div>
    <div class="stage" id="stage"><div class="box" id="box"><img id="scene" alt=""></div></div>
    <div class="say"><img id="tigG" alt="Tigero"><div class="bubble" id="bubble"></div></div>
  </section>

  <div class="ov" id="puz"><div class="card">
    <div class="custom" id="pCustom"></div>
    <div class="q" id="pQ"></div>
    <div class="opts" id="pOpts"></div>
    <div class="msg" id="pMsg"></div>
    <button class="hintbtn" id="hintBtn"></button>
    <div class="hint" id="pHint" style="display:none"></div>
    <button class="link" id="pClose"></button>
  </div></div>

  <div class="ov" id="won"><div class="card">
    <div class="winbig">🎉🐯🎉</div>
    <h2 id="wT"></h2>
    <p id="wP" style="font-size:17px"></p>
    <button class="big" id="wBtn"></button>
    <button class="link" id="wHome"></button>
  </div></div>

  <div class="ov" id="pause"><div class="card">
    <h2 id="paT"></h2>
    <div class="langs" id="langP"></div>
    <div class="menu">
      <button class="big" id="paResume"></button>
      <button class="big alt" id="paRestart"></button>
      <button class="big soft" id="paSound"></button>
      <button class="big soft" id="paHome"></button>
    </div>
    <button class="link" id="paGrown"></button>
  </div></div>

  <div class="ov" id="ed"><div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 id="edT" style="margin:0"></h2><button class="iconbtn" id="edX" aria-label="close">✖️</button></div>
    <p class="note" id="edIntro"></p>
    <div class="tabs" id="edRooms"></div>
    <div class="tabs" id="edSlots"></div>
    <textarea id="edQ" maxlength="200"></textarea>
    <div id="edOpts"></div>
    <div class="err" id="edErr"></div>
    <div class="edrow"><button class="big" id="edSave"></button></div>
    <div class="edrow"><button class="big soft" id="edReset"></button></div>
    <p class="note" id="edNote"></p>
  </div></div>
  <div class="conf" id="conf"></div>
</div>

// ---------- custom (grown-up) questions ----------
function loadCustom(){try{const c=JSON.parse(localStorage.getItem(CKEY)||'{}');return (c&&typeof c==='object')?c:{};}catch(e){return {};}}
function validP(p){if(!p||typeof p.q!=='string'||!Array.isArray(p.options))return false;const o=p.options.map(s=>String(s).trim()).filter(Boolean);return p.q.trim().length>0&&o.length>=2&&o.length<=4&&new Set(o).size===o.length&&o.includes(String(p.answer||'').trim());}
function getPuzzle(r,slot){
  const c=loadCustom(); const cp=c[r]&&c[r][slot];
  if(validP(cp)){const o=cp.options.map(s=>String(s).trim()).filter(Boolean);return {q:cp.q.trim(),opts:o,ans:o.indexOf(cp.answer.trim()),win:T[lang].customWin,hint:T[lang].customHint,custom:true};}
  const p=PUZ[r][slot][lang];return {q:p[0],opts:p[1],ans:p[2],win:p[3],hint:p[4],custom:false};
}

// ---------- sound ----------
let ctx=null;
function sfx(kind){ if(muted) return; try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended')ctx.resume();
  const notes={tap:[[660,.08]],wrong:[[300,.15],[220,.25]],win:[[523,.12],[659,.12],[784,.12],[1046,.3]],roar:[[120,.5]],key:[[880,.08],[1175,.08],[1568,.2]]}[kind]||[];
  let t=ctx.currentTime; for(const [f,d] of notes){const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='roar'?'sawtooth':'triangle';o.frequency.setValueAtTime(f,t);if(kind==='roar')o.frequency.exponentialRampToValueAtTime(60,t+d);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d);t+=d;}
 }catch(e){} }
const VLANG={he:'he',fr:'fr',en:'en'};
function speak(text){ try{ if(muted||!('speechSynthesis' in window))return; const ss=window.speechSynthesis; ss.cancel();
  const v=ss.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(VLANG[lang]) ); if(!v) return;
  const u=new SpeechSynthesisUtterance(text.replace(/[\p{Extended_Pictographic}\u2B50\u2606\uFE0F]/gu,'').replace(/___/g,'…'));u.voice=v;u.lang=v.lang;u.rate=.95;u.pitch=1.3;ss.speak(u);}catch(e){} }
function stopSpeak(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}

// ---------- state ----------
let prog=(()=>{try{const p=JSON.parse(localStorage.getItem(PKEY)||'{}');return {completed:Math.min(4,Math.max(0,p.completed|0))};}catch(e){return {completed:0};}})();
function saveProg(){try{localStorage.setItem(PKEY,JSON.stringify(prog));}catch(e){}}
const S={room:0,stars:[],key:false,puzzle:null,sayKey:'sayStart',sayArg:null,wrong:false,hint:false,wonOpen:false};

function sayText(){const t=T[lang];const v=t[S.sayKey];if(typeof v==='function')return v(S.sayArg);if(v!==undefined)return v;
  if(S.sayKey==='win'){return getPuzzle(S.room,S.sayArg).win;} return '';}
function say(key,arg){S.sayKey=key;S.sayArg=arg;const b=$('bubble');b.textContent=sayText();b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');speak(b.textContent);}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));['puz','won','pause','ed'].forEach(o=>$(o).classList.remove('on'));$('conf').innerHTML='';
  document.body.classList.toggle('sea',id==='game'&&SCENES[S.room]==='coral'); if(id==='game')layout();}

// ---------- i18n ----------
function langButtons(el){el.innerHTML='';for(const k of ['he','fr','en']){const b=document.createElement('button');b.textContent=T[k].name;b.dataset.lang=k;b.className=k===lang?'sel':'';b.onclick=()=>{setLang(k);sfx('tap');};el.appendChild(b);}}
function setLang(k){lang=k;localStorage.setItem(LKEY,k);applyLang();}
function applyLang(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=t.dir;
  langButtons($('langS'));langButtons($('langP'));
  $('sSub').textContent=t.sub;$('sTitle').textContent=t.title;$('sIntro').textContent=t.intro;
  const c=prog.completed; $('sPaws').textContent=c?t.paws(c):'';$('sPaws').style.display=c?'':'none';
  if(c>0&&c<4){$('goBtn').textContent=t.cont(c+1);$('againBtn').style.display='';$('againBtn').textContent=t.again;}
  else{$('goBtn').textContent=c>=4?t.playAgain:t.go;$('againBtn').style.display='none';}
  $('hintBtn').textContent=t.hintBtn;$('pClose').textContent=t.close;
  $('paT').textContent=t.paused;$('paResume').textContent=t.resume;$('paRestart').textContent=t.restart;$('paHome').textContent=t.home;$('paGrown').textContent=t.grown;
  $('wHome').textContent=t.home;
  updateSound();renderHUD();$('bubble').textContent=sayText();
  if(S.puzzle)renderPuzzle(); if(S.wonOpen)renderWon(); if($('ed').classList.contains('on'))renderEd();
  document.title=t.title+' · Annabelle';}
function updateSound(){const t=T[lang];$('muteS').textContent=muted?'🔇':'🔊';$('paSound').textContent=muted?t.soundOff:t.soundOn;}
function toggleMute(){muted=!muted;localStorage.setItem(MKEY,muted?'1':'0');if(muted)stopSpeak();updateSound();sfx('tap');}

// ---------- game ----------
function renderHUD(){const t=T[lang];$('rNum').textContent=t.room(S.room+1);$('rName').textContent=t.rooms[S.room];
  [...$('bar').children].forEach((s,i)=>s.classList.toggle('d',i<prog.completed));
  $('stars').textContent=[0,1,2].map(i=>i<S.stars.length?'⭐':'☆').join('')+(S.key?' 🔑':'');}
function buildRoom(){const sc=SCENES[S.room];$('scene').src=IMG[sc];$('scene').alt=T[lang].rooms[S.room];
  const box=$('box');box.querySelectorAll('.hot').forEach(h=>h.remove());
  for(const [id,[l,tp,w,h]] of Object.entries(HS[sc])){const b=document.createElement('button');b.className='hot';b.dataset.spot=id;b.setAttribute('aria-label',LABEL[id]);
    b.style.left=l+'%';b.style.top=tp+'%';b.style.width=w+'%';b.style.height=h+'%';b.onclick=()=>tap(id);box.appendChild(b);}
  renderHUD();}
function layout(){const st=$('stage'),box=$('box');if(!st.clientHeight)return;const W=st.clientWidth-12,H=st.clientHeight-4,ar=768/1344;let w=W,h=w/ar;if(h>H){h=H;w=h*ar;}box.style.width=Math.floor(w)+'px';box.style.height=Math.floor(h)+'px';}
function startRoom(r,first){S.room=r;S.stars=[];S.key=false;S.puzzle=null;S.wonOpen=false;buildRoom();show('game');
  if(first&&r===0)say('sayStart');else say('welcome',T[lang].rooms[r]);}
function tap(id){sfx(id==='door'&&S.key?'roar':'tap');
  if(id==='monkey')return say('monkey');
  if(id==='chest'){if(S.key)return say('chestEmpty');if(S.stars.length<3)return say('chestNeed',S.stars.length);S.key=true;sfx('key');renderHUD();return say('chestKey');}
  if(id==='door'){if(!S.key)return say('doorLocked');prog.completed=Math.max(prog.completed,S.room+1);saveProg();return openWon();}
  if(S.stars.includes(id))return say('already');
  S.puzzle=id;S.wrong=false;S.hint=false;S.no=[];renderPuzzle();$('puz').classList.add('on');speak(getPuzzle(S.room,id).q);}
function renderPuzzle(){const p=getPuzzle(S.room,S.puzzle),t=T[lang];$('pCustom').textContent=p.custom?t.customTag:'';$('pCustom').style.display=p.custom?'':'none';
  $('pQ').textContent=p.q;const o=$('pOpts');o.innerHTML='';
  p.opts.forEach((txt,i)=>{const b=document.createElement('button');b.className='big'+(S.no.includes(i)?' no':'');b.textContent=txt;b.dataset.i=i;b.onclick=()=>answer(i);o.appendChild(b);});
  $('pMsg').textContent=S.wrong?t.wrong:'';$('pMsg').style.display=S.wrong?'':'none';
  $('pHint').textContent=p.hint;$('pHint').style.display=S.hint?'':'none';$('hintBtn').style.display=S.hint?'none':'';}
function answer(i){const p=getPuzzle(S.room,S.puzzle);
  if(i===p.ans){sfx('win');S.stars.push(S.puzzle);const slot=S.puzzle;S.puzzle=null;$('puz').classList.remove('on');renderHUD();markGot();
    if(p.custom){S.sayKey='customWin';S.sayArg=null;say('customWin');}else say('win',slot);}
  else{sfx('wrong');S.wrong=true;if(!S.no.includes(i))S.no.push(i);renderPuzzle();speak(T[lang].wrong);}}
function markGot(){$('box').querySelectorAll('.hot').forEach(h=>h.classList.toggle('got',S.stars.includes(h.dataset.spot)));}
function openWon(){S.wonOpen=true;renderWon();$('won').classList.add('on');sfx('win');confetti();renderHUD();
  if(prog.completed>=4&&S.room===3)speak(T[lang].final);}
function renderWon(){const t=T[lang],all=S.room===3;$('wT').textContent=all?t.allWon:t.roomWon(S.room+1);$('wP').textContent=all?t.final:t.wonP(prog.completed);
  $('wBtn').textContent=all?t.playAgain:t.next;}
function confetti(){const c=$('conf');c.innerHTML='';const em=['⭐','🐯','🎉','💛','🌟','🐾'];for(let i=0;i<34;i++){const e=document.createElement('i');e.textContent=em[i%em.length];e.style.left=Math.random()*100+'%';e.style.animationDuration=(1.6+Math.random()*1.6)+'s';e.style.animationDelay=(Math.random()*.6)+'s';c.appendChild(e);}setTimeout(()=>{c.innerHTML='';},4000);}

// ---------- editor ----------
const E={room:0,slot:'parrot',d:null,saved:false};
function edLoad(){const c=loadCustom();const cp=c[E.room]&&c[E.room][E.slot];let q,o,a;
  if(validP(cp)){q=cp.q;o=cp.options.slice();a=cp.answer;}else{const p=PUZ[E.room][E.slot][lang];q=p[0];o=p[1].slice();a=p[1][p[2]];}
  while(o.length<4)o.push('');E.d={q,o:o.slice(0,4),a};E.saved=false;}
function edPuzzle(){return {q:E.d.q.trim().slice(0,200),options:E.d.o.map(s=>s.trim().slice(0,40)).filter(Boolean),answer:E.d.a.trim()};}
function renderEd(){const t=T[lang];$('edT').textContent=t.edT;$('edIntro').textContent=t.edIntro;$('edNote').textContent=t.edNote;$('edReset').textContent=t.edReset;
  const R=$('edRooms');R.innerHTML='';for(let i=0;i<4;i++){const b=document.createElement('button');b.textContent=t.edRoom+' '+(i+1);b.className=i===E.room?'sel':'';b.onclick=()=>{E.room=i;edLoad();renderEd();};R.appendChild(b);}
  const Sl=$('edSlots');Sl.innerHTML='';SLOTS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=t.slots[i];b.className=s===E.slot?'sel':'';b.onclick=()=>{E.slot=s;edLoad();renderEd();};Sl.appendChild(b);});
  const q=$('edQ');q.value=E.d.q;q.placeholder=t.edQ;
  const O=$('edOpts');O.innerHTML='';E.d.o.forEach((v,i)=>{const row=document.createElement('div');row.className='optrow';
    const lb=document.createElement('label');const r=document.createElement('input');r.type='radio';r.name='edans';r.checked=v.trim()!==''&&v.trim()===E.d.a.trim();r.setAttribute('aria-label','✓ '+(i+1));
    r.onchange=()=>{E.d.a=E.d.o[i];E.saved=false;edValidate();};lb.appendChild(r);
    const inp=document.createElement('input');inp.type='text';inp.maxLength=40;inp.value=v;inp.placeholder=t.edOpt(i+1);
    inp.oninput=()=>{const was=E.d.o[i].trim()!==''&&E.d.o[i].trim()===E.d.a.trim();E.d.o[i]=inp.value;if(was)E.d.a=inp.value;E.saved=false;edValidate();};
    row.appendChild(lb);row.appendChild(inp);O.appendChild(row);});
  edValidate();}
function edValidate(){const t=T[lang],ok=validP(edPuzzle());$('edErr').textContent=ok?'':t.edErr;$('edSave').disabled=!ok;$('edSave').style.opacity=ok?1:.5;$('edSave').textContent=E.saved?t.edSaved:t.edSave;}
$('edQ').oninput=()=>{E.d.q=$('edQ').value;E.saved=false;edValidate();};
$('edSave').onclick=()=>{const p=edPuzzle();if(!validP(p))return;const c=loadCustom();c[E.room]=c[E.room]||{};c[E.room][E.slot]=p;localStorage.setItem(CKEY,JSON.stringify(c));E.saved=true;edValidate();sfx('win');};
$('edReset').onclick=()=>{const c=loadCustom();if(c[E.room]){delete c[E.room][E.slot];if(!Object.keys(c[E.room]).length)delete c[E.room];}localStorage.setItem(CKEY,JSON.stringify(c));edLoad();E.saved=true;renderEd();sfx('tap');};
$('edX').onclick=()=>{$('ed').classList.remove('on');$('pause').classList.add('on');sfx('tap');};

// ---------- wiring ----------
$('tigS').src=IMG.tiger;$('tigG').src=IMG.tiger;
$('muteS').onclick=toggleMute;$('paSound').onclick=toggleMute;
$('goBtn').onclick=()=>{sfx('roar');const c=prog.completed;if(c>=4){prog.completed=0;saveProg();applyLang();startRoom(0,true);}else startRoom(c,c===0);};
$('againBtn').onclick=()=>{sfx('tap');prog.completed=0;saveProg();applyLang();startRoom(0,true);};
$('pauseBtn').onclick=()=>{sfx('tap');stopSpeak();$('pause').classList.add('on');};
$('paResume').onclick=()=>{sfx('tap');$('pause').classList.remove('on');};
$('paRestart').onclick=()=>{sfx('tap');startRoom(S.room,false);};
$('paHome').onclick=()=>{sfx('tap');stopSpeak();applyLang();show('start');};
$('paGrown').onclick=()=>{sfx('tap');E.room=S.room;E.slot='parrot';edLoad();renderEd();$('pause').classList.remove('on');$('ed').classList.add('on');};
$('hintBtn').onclick=()=>{sfx('tap');S.hint=true;renderPuzzle();speak(getPuzzle(S.room,S.puzzle).hint);};
$('pClose').onclick=()=>{sfx('tap');S.puzzle=null;$('puz').classList.remove('on');stopSpeak();};
$('wBtn').onclick=()=>{sfx('tap');S.wonOpen=false;if(S.room===3){prog.completed=0;saveProg();startRoom(0,true);}else startRoom(S.room+1,false);};
$('wHome').onclick=()=>{sfx('tap');S.wonOpen=false;stopSpeak();applyLang();show('start');};
window.addEventListener('resize',layout);
if(window.visualViewport)visualViewport.addEventListener('resize',layout);
applyLang();
// test hook (read-only helpers)
window.__esc={state:S,prog:()=>prog,answer:(slot)=>getPuzzle(S.room,slot).ans,puzzle:(r,slot)=>getPuzzle(r,slot),all:()=>PUZ};
</script>
