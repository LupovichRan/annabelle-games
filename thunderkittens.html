<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1633;font-family:"Rubik","Varela Round",Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}
#menu{justify-content:safe center;gap:10px;padding:10px;overflow:auto;background:radial-gradient(circle at 50% 20%,#4b2a8c,#1b1633 70%)}
h1{margin:0;font-size:clamp(28px,8vw,48px);color:#ffe14d;text-shadow:0 3px 0 #b65f10,0 0 24px #ffe14d88;text-align:center;letter-spacing:.02em}
.sub{opacity:.85;font-size:15px;text-align:center}
.heads{font-size:40px;line-height:1}
.langs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.lang{min-height:44px;padding:4px 14px;border-radius:999px;border:2px solid #ffe14d;background:#2c2150;font:800 16px Rubik,Arial;color:#fff}
.lang.sel{background:#ffe14d;color:#2c2150}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{min-height:56px;min-width:150px;padding:8px 18px;border-radius:18px;border:none;background:linear-gradient(#ffb35c,#f08a24);color:#fff;font:800 19px Rubik,Arial;box-shadow:0 4px 0 #b65f10}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b65f10}
.big.p{background:linear-gradient(#c58cf0,#9050c8);box-shadow:0 4px 0 #5e2e8a}
.big.g{background:linear-gradient(#5fd38d,#2fb36a);box-shadow:0 4px 0 #1d7c48}
.big.s{background:linear-gradient(#b8c1cc,#7d8794);box-shadow:0 4px 0 #555e69}
.rules{max-width:480px;background:#ffffff14;border-radius:16px;padding:8px 12px;font-size:15px;line-height:1.35}
.rules p{margin:3px 0}
.lbl2{font-weight:800;font-size:16px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:2px solid #ffe14d;background:#2c2150;color:#fff;font-size:22px;flex:0 0 auto}
.corner{position:fixed;top:8px;left:8px;z-index:10}
/* character select */
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px}
.cc{width:120px;border-radius:16px;border:3px solid #ffffff44;background:#2c2150;padding:6px;text-align:center;font:800 15px Rubik,Arial;color:#fff}
.cc canvas{width:100%;height:auto;display:block}
.cc.p1{border-color:#ffe14d;box-shadow:0 0 14px #ffe14d88}.cc.p2{border-color:#4ad0ff;box-shadow:0 0 14px #4ad0ff88}
.cc small{display:block;font-weight:600;opacity:.8;font-size:12px}
#game{background:#0e0b1c}
#wrap{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:0}
.padon #wrap{align-items:flex-end}   /* arena sits right above the touch controls */
canvas#cv{display:block;max-width:100%;max-height:100%;touch-action:none}
.bar{display:flex;align-items:center;gap:6px;width:100%;max-width:900px;padding:4px 6px;flex:0 0 auto}
.bar .sp{flex:1}
/* touch pad (outside the arena): analog stick on the left, 3+2 buttons on the right - the thumbs stay near the bottom corners */
#pad{display:none;width:100%;max-width:560px;justify-content:space-between;align-items:center;padding:6px 14px calc(var(--sab,8px) + 8px);flex:0 0 auto;direction:ltr;touch-action:none}
.padon #pad{display:flex}
#stick{position:relative;width:142px;height:142px;border-radius:50%;background:radial-gradient(#5b46a8,#2a1f66);border:4px solid #ffffff55;box-shadow:0 6px 0 #120c33,inset 0 0 22px #0008;touch-action:none;flex:0 0 auto}
#stick::before{content:"";position:absolute;inset:16px;border-radius:50%;border:3px dashed #ffffff30}
#stick .arr{position:absolute;font-size:15px;color:#fff;opacity:.55;pointer-events:none}
#thumb{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:linear-gradient(#ffb35c,#f08a24);border:3px solid #fff;box-shadow:0 5px 0 #b65f10;pointer-events:none;transition:transform .07s}
#thumb.drag{transition:none}
.pgrid{display:grid;grid-template-columns:repeat(2,76px);grid-auto-rows:76px;gap:10px;flex:0 0 auto}
.pb{width:76px;height:76px;border-radius:50%;border:3px solid #fff8;background:linear-gradient(#5b46a8,#33267a);color:#fff;font:900 26px Rubik,Arial;box-shadow:0 5px 0 #1a1244;touch-action:none;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.pb.on{transform:translateY(3px);box-shadow:0 2px 0 #1a1244;background:linear-gradient(#ffb35c,#f08a24)}
.pb.sp2{background:linear-gradient(#ffe14d,#f2a900);color:#4a3300;box-shadow:0 5px 0 #a87400;font-size:30px}
.pb.sp2.on{background:linear-gradient(#ffd54a,#e09800)}
.pb.latched{background:linear-gradient(#9fe0ff,#3a8fd0);box-shadow:0 0 0 4px #9fe0ff66,0 5px 0 #1a4a7a;animation:glow 1.2s infinite alternate}@keyframes glow{to{box-shadow:0 0 0 8px #9fe0ff22,0 5px 0 #1a4a7a}}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:20}
#over.on{display:flex}
#over .card{background:#2c2150;border:3px solid #ffe14d;border-radius:22px;padding:16px;text-align:center;max-width:90vw;display:flex;flex-direction:column;gap:10px;align-items:center}
#over h2{margin:0;font-size:28px;color:#ffe14d}
#fin{position:fixed;left:50%;bottom:26%;transform:translateX(-50%);z-index:15;display:none}
#fin.on{display:block;animation:fp .5s infinite alternate}@keyframes fp{to{transform:translateX(-50%) scale(1.1)}}
#hint{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:13px;background:#000a;border-radius:999px;padding:3px 12px;pointer-events:none;display:none;white-space:nowrap;color:#fff}
.desk #hint{display:block}#hint:empty{display:none!important}
kbd{background:#ffffff22;border:1px solid #fff6;border-radius:5px;padding:0 5px;font:700 12px monospace}

/* online */
.lobpane{display:none;flex-direction:column;align-items:center;gap:10px}.lobpane.on{display:flex}
#lobby{justify-content:safe center;gap:12px;padding:10px;overflow:auto;background:radial-gradient(circle at 50% 20%,#4b2a8c,#1b1633 70%)}
#lobCode{font-size:clamp(40px,13vw,72px);font-weight:900;letter-spacing:.12em;color:#ffe14d;direction:ltr;text-shadow:0 4px 0 #0006;line-height:1}
#lobIn{width:min(80vw,300px);height:70px;border-radius:18px;border:3px solid #ffe14d;background:#fff;text-align:center;font:900 34px Rubik,Arial;color:#2c2150;letter-spacing:.12em;direction:ltr;user-select:text;-webkit-user-select:text}
#lobCd{font-weight:900;font-size:26px;color:#9fe0ff;direction:ltr;min-height:32px}#lobCd.low{color:#ff7a7a;animation:pulse2 .6s infinite alternate}@keyframes pulse2{to{transform:scale(1.12)}}
#lobStatus,#lobWait{font-weight:800;font-size:18px;text-align:center;min-height:24px;max-width:90vw}
a.big{display:flex;align-items:center;justify-content:center;text-decoration:none}
#weak{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#fff8dc;color:#4a3300;border:2px solid #f2a900;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;z-index:15;pointer-events:none;display:none;white-space:nowrap;box-shadow:0 2px 0 #0002;animation:wk 1.6s infinite alternate}
#weak.on{display:block}@keyframes wk{from{opacity:.75}to{opacity:1}}
#appr,#npause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008}#appr{z-index:45}#npause{z-index:40}#appr.on,#npause.on{display:flex}
#appr .card,#npause .card{background:#2c2150;border:3px solid #ffe14d;border-radius:22px;padding:18px;text-align:center;max-width:90vw;display:flex;flex-direction:column;gap:10px;align-items:center}#appr h2,#npause h2{margin:0;font-size:22px;color:#ffe14d}#apprN{font-size:64px;font-weight:900;color:#ffe14d;letter-spacing:.1em;direction:ltr;line-height:1}
.dance{display:inline-block;animation:dn .6s infinite alternate}@keyframes dn{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#netDot{display:none;width:14px;height:14px;border-radius:50%;flex:0 0 auto;border:2px solid #fff;box-shadow:0 1px 0 #0003;transition:background .4s}

/* big laptop / desktop windows: scale menus up */
@media (hover:hover) and (pointer:fine) and (min-width:1100px) and (min-height:760px){#menu,#pick,#lobby{zoom:1.2}}
@media (hover:hover) and (pointer:fine) and (min-width:1600px) and (min-height:930px){#menu,#pick,#lobby{zoom:1.4}}

 g.shake=Math.max(0,g.shake-dt*3);g.flash=Math.max(0,g.flash-dt*2);g.msgT-=dt;g.bolt-=dt;if(Math.random()<dt*.18)g.bolt=.18;
 if(!NET.paused&&sb.length&&g.off!==null){
  const tgt=Math.max(DELAY,Math.min(220,DELAY+g.jit*1.3));g.dly+=Math.max(-dt*20,Math.min(dt*80,tgt-g.dly));
  const rt=now-g.off-g.dly;let ai=0;
  for(let i=0;i<sb.length;i++){if(sb[i].ht<=rt)ai=i;else break}
  for(let i=0;i<=ai;i++){const s=sb[i];if(!s.fired&&s.ht<=rt){s.fired=true;applyDiscrete(s,rt-s.ht>1200)}}
  const A=sb[ai],B=sb[ai+1];let f=0,ex=0;
  if(B&&B.ht>A.ht&&rt>A.ht)f=Math.min(1,(rt-A.ht)/(B.ht-A.ht));
  if(!B&&rt>A.ht)ex=Math.min(.25,(rt-A.ht)/1000);
  for(let i=0;i<2;i++){const o=g.fs[i],a=A.f[i],b=B?B.f[i]:a,jump=Math.abs(b[0]-a[0])>250||Math.abs(b[1]-a[1])>260,k=jump?0:f;
   o.x=L1(a[0],b[0],k)+(B?0:a[2]*ex);o.y=Math.min(GY,L1(a[1],b[1],k));o.vx=a[2];o.face=a[3];o.st=STC[a[4]];o.t=a[4]===b[4]?L1(a[5],b[5],k):a[5];
   o.atk=a[6]?{k:a[6]===2?"kick":"punch",dur:ATK[a[6]===2?"kick":"punch"].dur}:(o.st==="atk"?{k:"punch",dur:.3}:null);
   o.hp=a[7];o.meter=a[8];o.wins=a[9];o.gs=a[10];o.gl=a[11];o.flash=a[12];
   o.anim+=dt*((o.st==="walk"||(o.st==="block"&&Math.abs(o.vx)>20))?9:3)}
  g.proj=A.pr.map(p=>({x:p[0],y:p[1],r:p[2]}));
  if(A.y){const l=g.fs[A.y[3]];g.yarn={x:A.y[0],y:A.y[1],rot:A.y[2],col:CHARS[l.ch].col,f:l}}else g.yarn=null;
  if(ai>3)sb.splice(0,ai-3);
 }
 fx(dt);guestInput(now);
}
function guestInput(now){ // my held buttons -> a bit mask (+ the presses since the last message); a keep-alive every 200 ms
 if(!NET.conn||!NET.conn.open||NET.paused||G.over)return;
 const f=G.fs[1];let m=0;for(const k of BITK)if(f.inp[k])m|=BIT[k];
 if(((m!==NET.lm||NET.ie)&&now-NET.lt>=30)||now-NET.lt>=200){
  const dc=NET.conn.dataChannel;if(dc&&dc.bufferedAmount>20000)return;
  netSend({t:"in",m,e:NET.ie,q:++NET.iq});NET.lm=m;NET.ie=0;NET.lt=now}
}

function onNetData(d){

 }
 else if(d.t==="snap"&&!NET.host&&G&&G.guest&&!G.over){const cs=cleanSnap(d);if(cs){if(NET.paused&&NET.conn)netResume();rxSnap(cs)}}
 else if(d.t==="in"&&NET.host&&G&&G.online&&!G.guest&&!G.over)onInput(d);

 else if(d.t==="fin"&&NET.host&&G&&G.online&&!G.guest&&!G.over)doFinish(true);
 else if(d.t==="over"&&!NET.host&&G&&G.guest&&!G.over&&int(d.w,-1,1)&&int(d.a,0,2)&&int(d.b,0,2)){

// --- connection trouble: forgiving tiers. 0-4 s quiet: nothing visible. 4-20 s: "weak connection" pill, the match keeps running (host: the friend's kitten keeps its last input, then stops; guest: last snapshot is extrapolated a little).
//     20 s+: hard pause with a Leave button. Meanwhile we reconnect quietly; any valid data / a re-authenticated connection clears everything at once.
function onNetClose(){ // the connection itself is gone (closed / ICE failed): reconnect quietly; the clock decides when it becomes a hard pause
 if(!G||!G.online){if(NET.conn||NET.peer)lobFail();return}
 const c=NET.conn;NET.conn=null;try{c&&c.close()}catch(e){}
 if(G.over){netClose();showLeft();return}
 startRecover();
}
function startRecover(){if(!G||!G.online||G.over)return;NET.rec=true;if(NET.host)hostLoop();else guestLoop()}
function hardLost(){setPaused(true);weakHide(true);if(NET.conn)onNetClose();else if(!NET.rec)startRecover()}
function netResume(){ // data is flowing again after a hard pause that never closed the connection
 if(!NET.paused)return;setPaused(false);NET.rec=false;weakHide(true);
 if(G.guest){G.sb=[];G.off=null;G.lastN=0}else{NET.lastSnap=0;hostSnapNow()}
}

function guestLoop(){
 clearTimeout(NET.rt);if(!NET.rec||NET.host||!G||!G.online)return;const gen=NET.gen;
 function tryConnect(){if(gen!==NET.gen||!NET.rec||!NET.peer)return;if(NET.conn&&NET.conn.open)return;
  if(NET.conn){const o=NET.conn;NET.conn=null;try{o.close()}catch(e){}}
  try{attach(NET.peer.connect(PID+NET.code,{reliable:true}),gen)}catch(e){}}
 function go(){if(gen!==NET.gen||!NET.rec)return;const p=NET.peer;
  if(!p||p.destroyed||p.disconnected||!p.open){
   try{p&&p.destroy()}catch(e){}
   loadPeer().then(()=>{if(gen!==NET.gen||!NET.rec)return;const np=new Peer(undefined,PEER_CFG);NET.peer=np;
    np.on("open",()=>{if(gen===NET.gen&&NET.rec)tryConnect()});np.on("error",()=>{})}).catch(()=>{});
  }else tryConnect();
  NET.rt=setTimeout(go,4500)}
 go();
}
function hostLoop(){ // keep the room's peer alive so the friend can come back with the secret
 clearTimeout(NET.rt);if(!NET.rec||!NET.host||!G||!G.online)return;const gen=NET.gen;
 (function go(){if(gen!==NET.gen||!NET.rec)return;const p=NET.peer;
  if(!p||p.destroyed){loadPeer().then(()=>{if(gen===NET.gen&&NET.rec&&(!NET.peer||NET.peer.destroyed))hostPeer(NET.code,gen,true)}).catch(()=>{})}
  else if(p.disconnected){try{p.reconnect()}catch(e){}}
  NET.rt=setTimeout(go,4500)})();
}
function netKick(){ // phone woke up / network is back: retry right away
 if(NET.waitCode&&!(G&&G.online)){hostRecover();return}
 if(!G||!G.online)return;
 if(NET.rec){if(NET.host){const p=NET.peer;if(p&&p.disconnected&&!p.destroyed)try{p.reconnect()}catch(e){}}else guestLoop()}
 else netSend({t:"ping"});
}
function netQ(){ // connection quality dot: green = data flowing, amber = quiet for a few seconds, red = hard pause
 const d=$("netDot");if(!d)return;if(!G||!G.online){d.style.display="none";return}
 const a=NET.paused?9e9:Date.now()-NET.last;d.style.display="";d.style.background=a<SOFT?"#2fb36a":a<HARD?"#f2c94c":"#e23b3b";d.title=a<SOFT?"🟢":a<HARD?"🟡":"🔴"}
let hbN=0;
setInterval(()=>{const now=Date.now();
 if(NET.tickAt&&now-NET.tickAt>3000)NET.last=now;                   // OUR timers were frozen (phone asleep / app in background): that says nothing about the friend

},500);
