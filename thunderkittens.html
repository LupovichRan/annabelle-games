.lang.sel{background:#ffe14d;color:#2c2150}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{min-height:56px;min-width:150px;padding:8px 18px;border-radius:18px;border:none;background:linear-gradient(#ffb35c,#f08a24);color:#fff;font:800 19px Rubik,Arial;box-shadow:0 4px 0 #b65f10}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b65f10}
.big.p{background:linear-gradient(#c58cf0,#9050c8);box-shadow:0 4px 0 #5e2e8a}
.big.g{background:linear-gradient(#5fd38d,#2fb36a);box-shadow:0 4px 0 #1d7c48}
.big.s{background:linear-gradient(#b8c1cc,#7d8794);box-shadow:0 4px 0 #555e69}
.rules{max-width:480px;background:#ffffff14;border-radius:16px;padding:8px 12px;font-size:15px;line-height:1.35}
.rules p{margin:3px 0}
.lbl2{font-weight:800;font-size:16px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:2px solid #ffe14d;background:#2c2150;color:#fff;font-size:22px;flex:0 0 auto}
.corner{position:fixed;top:8px;left:8px;z-index:10}

.cc{width:120px;border-radius:16px;border:3px solid #ffffff44;background:#2c2150;padding:6px;text-align:center;font:800 15px Rubik,Arial;color:#fff}

.cc.p1{border-color:#ffe14d;box-shadow:0 0 14px #ffe14d88}.cc.p2{border-color:#4ad0ff;box-shadow:0 0 14px #4ad0ff88}

#game{background:#0e0b1c}
#wrap{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:0}
.padon #wrap{align-items:flex-end}   /* arena sits right above the touch controls */
canvas#cv{display:block;max-width:100%;max-height:100%;touch-action:none}
.bar{display:flex;align-items:center;gap:6px;width:100%;max-width:900px;padding:4px 6px;flex:0 0 auto}
.bar .sp{flex:1}

.padon #pad{display:flex}

.pb{width:68px;height:68px;border-radius:50%;border:3px solid #fff8;background:linear-gradient(#5b46a8,#33267a);color:#fff;font:900 26px Rubik,Arial;box-shadow:0 5px 0 #1a1244;touch-action:none;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}

.pb.sp2{grid-column:2 / span 2;width:100%;border-radius:34px;background:linear-gradient(#ffe14d,#f2a900);color:#4a3300;box-shadow:0 5px 0 #a87400;font-size:30px}
.pb.sp2.on{background:linear-gradient(#ffd54a,#e09800)}
.pgrid .pb[data-k="block"]{grid-column:1}

.desk #hint{display:block}#hint:empty{display:none!important}
kbd{background:#ffffff22;border:1px solid #fff6;border-radius:5px;padding:0 5px;font:700 12px monospace}

function ai(f,o,dt){
 const P=G.P,inp=f.inp,C=CHARS[f.ch];f.aiT-=0;
 if(f.st==="ko"||f.st==="hurt"){Object.keys(inp).forEach(k=>inp[k]=0);return}
 f.aiN=(f.aiN||0)-dt;
 if(f.aiN<=0){f.aiN=P.aiReact*rr(.7,1.4);
  const d=Math.abs(o.x-f.x),dir=o.x>f.x?1:-1;Object.keys(inp).forEach(k=>inp[k]=0);
  const oAtk=o.st==="atk"||o.st==="sp";
  if(oAtk&&d<130&&Math.random()<P.aiBlock){inp.block=1;f.aiN=.28}
  else if(d>150){if(Math.random()<.8){dir>0?inp.r=1:inp.l=1}if(f.meter>=50&&d>200&&Math.random()<P.aiSpecial*.5)inp.sp=1}
  else if(d<=150){const r=Math.random();
   if(r<P.aiAgg)(Math.random()<.55?inp.punch=1:inp.kick=1);
   else if(r<P.aiAgg+.12)(dir>0?inp.l=1:inp.r=1);   // step back
   else if(r<P.aiAgg+.18&&f.y>=GY)inp.u=1;
   if(f.meter>=50&&Math.random()<P.aiSpecial*.4)inp.sp=1;}
  if(f.y<GY&&d<120&&Math.random()<.4)inp.kick=1;
  f.aiBurst=inp.punch||inp.kick||inp.sp||inp.u;
 }
 // a press lasts only one tick so the next decision can press again
 if(f.aiBurst&&f.prev&&(f.prev.punch||f.prev.kick||f.prev.sp||f.prev.u)){inp.punch=inp.kick=inp.sp=inp.u=0;f.aiBurst=0}
}
