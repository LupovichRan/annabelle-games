<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><!--pt--><script src="playtime.js" data-app="hiddencats"></script><!--/pt-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מצאי את החתולים</title><script src="safe.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<style>
:root{--bg1:#ffe9a8;--bg2:#ffc7d9;--ink:#4a2c6b;--accent:#ff7a3d;--accent2:#7c5cff;--ok:#34c47c;--pink:#ff4d8d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none}
body{font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;color:var(--ink);
 background:radial-gradient(circle at 20% 15%,#fff6d6 0 12%,transparent 13%),radial-gradient(circle at 85% 80%,#ffe0ee 0 10%,transparent 11%),linear-gradient(135deg,var(--bg1),var(--bg2));
 user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
.app{position:fixed;top:0;left:0;right:0;height:100dvh;overflow:hidden}
html.aired .app{height:calc(100dvh - 40px)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px 6px}
.screen.active{display:flex}
.iconbtn{width:48px;height:48px;min-width:48px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #0002;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .1s}
.iconbtn:active,.big:active,.card:active{transform:translateY(3px)}
.big{min-height:54px;padding:10px 22px;border-radius:999px;font-size:clamp(20px,5.4vw,26px);font-weight:900;color:#fff;background:linear-gradient(#ff9a5c,var(--accent));box-shadow:0 5px 0 #c4501a;display:flex;align-items:center;justify-content:center;gap:10px;width:min(86vw,340px)}
.big.alt{background:linear-gradient(#a68bff,var(--accent2));box-shadow:0 5px 0 #4f37b8}
.big.soft{background:#fff;color:var(--ink);box-shadow:0 5px 0 #0002}
.title{font-size:clamp(30px,min(9vw,7vh),64px);font-weight:900;margin:0;text-align:center;color:#fff;text-shadow:0 4px 0 var(--accent),0 8px 0 #0002;line-height:1.1}
.sub{font-size:clamp(16px,min(4.4vw,2.6vh),22px);font-weight:700;text-align:center;margin:0;opacity:.9;max-width:520px}
.langs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lang{min-height:46px;padding:8px 16px;border-radius:999px;background:#fff8;font-size:18px;font-weight:800;box-shadow:0 3px 0 #0001}
.lang.sel{background:#fff;box-shadow:0 0 0 4px var(--accent2),0 4px 0 #0002}
#menu{align-items:center;justify-content:space-evenly;gap:6px;padding-top:max(60px,env(safe-area-inset-top))}
.heads{display:flex;gap:2vw;justify-content:center;flex:1 1 auto;min-height:0;max-height:150px;align-items:center}
.heads svg{height:100%;max-height:min(120px,16vh);max-width:21vw;width:auto;animation:bob 2.4s ease-in-out infinite}
.heads svg:nth-child(2){animation-delay:.3s}.heads svg:nth-child(3){animation-delay:.6s}.heads svg:nth-child(4){animation-delay:.9s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.corner{position:absolute;top:max(8px,env(safe-area-inset-top));inset-inline-end:10px;z-index:5}
.totals{font-weight:800;font-size:18px;opacity:.85}
/* levels */
#levels{gap:8px}
.lvhead{display:flex;align-items:center;gap:10px;flex:none}
.lvhead h2{margin:0;font-size:clamp(22px,6vw,32px);font-weight:900;flex:1;text-align:center}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:10px;padding:4px 2px 2px;max-width:820px;width:100%;margin:0 auto}
@media (min-aspect-ratio:1/1){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;border-radius:22px;background:#fff;box-shadow:0 5px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;min-height:0;overflow:hidden}
.card .ic{font-size:clamp(30px,min(10vw,7vh),56px);line-height:1}
.card .nm{font-weight:900;font-size:clamp(15px,min(4.2vw,2.6vh),21px);text-align:center;line-height:1.15}
.card .no{position:absolute;top:6px;inset-inline-start:10px;font-weight:900;opacity:.45}
.card .st{font-size:clamp(16px,min(4.6vw,3vh),24px);letter-spacing:2px}
.card.locked{background:#ffffffa0}.card.locked>*:not(.lk){opacity:.35}
.card .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}
/* game */
#game{padding:max(6px,env(safe-area-inset-top)) 6px 4px;gap:4px}
.bar{display:flex;align-items:center;gap:8px;flex:none;height:52px}
.bar .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.bar .lvname{font-size:13px;font-weight:800;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar .count{font-size:22px;font-weight:900;direction:ltr}
.timer{font-size:13px;font-weight:700;opacity:.6;direction:ltr;min-width:38px;text-align:center}
.hintbtn{height:48px;min-width:64px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:0 4px 0 #0002;font-size:20px;font-weight:900;display:flex;align-items:center;gap:4px;direction:ltr}
.hintbtn:disabled{opacity:.45}
.paws{flex:1;min-width:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 3px;font-size:clamp(14px,4vw,20px);direction:ltr;line-height:1.1}
.paws span{opacity:.25;filter:grayscale(1);transition:all .3s}.paws span.on{opacity:1;filter:none;transform:scale(1.15)}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#3a2a4a22;box-shadow:inset 0 0 0 3px #fff8;touch-action:none;cursor:pointer}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world svg{display:block;width:100%;height:100%}
.tools{position:relative;margin-bottom:var(--sab,0px);display:flex;align-items:center;gap:8px;flex:none;height:52px;direction:ltr}
.tools .iconbtn{font-size:28px;font-weight:900}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #c2185b,0 0 6px #0006;transform:translate(-50%,-50%);animation:fl 1.1s ease-out forwards;white-space:nowrap;z-index:4}
.float.miss{font-size:28px;text-shadow:0 2px 4px #0005}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.toast{position:absolute;left:56px;right:56px;top:2px;bottom:2px;display:flex;align-items:center;justify-content:center;background:#fffe;border-radius:16px;padding:2px 10px;font-weight:800;font-size:clamp(12px,3.7vw,16px);line-height:1.15;box-shadow:0 3px 0 #0002;z-index:4;text-align:center;pointer-events:none;transition:opacity .4s;overflow:hidden}
.toast.one{white-space:nowrap}
.toast.hide{opacity:0}
/* overlays */
.ov{position:absolute;inset:0;background:#2b164a88;display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
.ov.active{display:flex}
.panel{background:linear-gradient(#fffaf0,#ffeef5);border-radius:28px;padding:14px 16px;box-shadow:0 10px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,12px);width:min(94vw,420px);max-height:100%}
.panel h2{margin:0;font-size:clamp(26px,7vw,36px);font-weight:900;text-align:center;color:var(--accent)}
.panel .big{width:100%}
.stars{font-size:clamp(34px,9vw,48px);letter-spacing:4px}
.stars .off{filter:grayscale(1);opacity:.3}
.row2{display:flex;gap:10px;width:100%}.row2 .big{flex:1;padding:10px 8px;font-size:clamp(17px,4.6vw,21px)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:21}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.found-ring{animation:ring .5s ease-out}
@keyframes ring{0%{opacity:0}100%{opacity:1}}
.sparkle{animation:sp .6s ease-in-out infinite alternate}
@keyframes sp{0%{opacity:.35}100%{opacity:1}}

/*landscape-fit*/@media (orientation:landscape) and (max-height:500px){#pauseOv{overflow-y:auto!important;align-items:safe center!important;justify-content:safe center!important}#pauseOv>*{max-height:none!important;margin:auto}}
</style>
<!--pwa--><link rel="manifest" href="manifests/hiddencats.webmanifest"><meta name="theme-color" content="#ffe3c4"><meta name="apple-mobile-web-app-title" content="מצאי חתולים"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/hiddencats-apple-180.png"><script src="pwa.js" data-app="hiddencats" data-slots='[["#langs1", "after"], ["#pauseOv .panel", "append"]]' defer></script><script src="nav.js" data-menuslot="#langs1" data-pauseslot="#pauseOv .panel" data-relabel="#pMenu" defer></script><script src="share.js" data-slot="#langs1" defer></script><!--/pwa-->
</head>
<body>
<div class="app" id="app">

<section class="screen active" id="menu">
  <button class="iconbtn corner" id="muteMenu" aria-label="sound">🔊</button>
  <h1 class="title" data-t="title"></h1>
  <p class="sub" data-t="tagline"></p>
  <div class="heads" id="menuHeads"></div>
  <div class="langs" id="langs1"></div>
  <button class="big" id="playBtn"><span>▶</span><span data-t="play"></span></button>
  <button class="big alt" id="levelsBtn"><span>🗺️</span><span data-t="levels"></span></button>
  <div class="totals" id="totals"></div>
</section>

<section class="screen" id="levels">
  <div class="lvhead">
    <button class="iconbtn" id="lvBack" aria-label="back">🏠</button>
    <h2 data-t="levels"></h2>
    <div style="width:48px"></div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section class="screen" id="game">
  <div class="bar">
    <button class="iconbtn" id="pauseBtn" aria-label="pause">⏸</button>
    <div class="timer" id="timer">0:00</div>
    <div class="mid"><div class="lvname" id="lvname"></div><div class="count" id="count">🐾 0/0</div></div>
    <button class="hintbtn" id="hintBtn" aria-label="hint">💡<span id="hintsLeft">3</span></button>
  </div>
  <div class="stage" id="stage">
    <div class="world" id="world"></div>
  </div>
  <div class="tools"><button class="iconbtn" id="zout" aria-label="zoom out">－</button><div class="paws" id="paws"></div><button class="iconbtn" id="zin" aria-label="zoom in">＋</button><div class="toast hide" id="toast"></div></div>
</section>

<div class="ov" id="pauseOv"><div class="panel">
  <h2 data-t="paused"></h2>
  <div class="langs" id="langs2"></div>
  <button class="big soft" id="muteBtn2"></button>
  <button class="big" id="resumeBtn"><span>▶</span><span data-t="resume"></span></button>
  <div class="row2"><button class="big alt" id="restartBtn"><span>🔄</span><span data-t="restart"></span></button><button class="big alt" id="pLevels"><span>🗺️</span><span data-t="levels"></span></button></div>
  <button class="big soft" id="pMenu"><span>🏠</span><span data-t="menu"></span></button>
</div></div>

<div class="ov" id="winOv"><div class="panel">
  <h2 data-t="welldone"></h2>
  <div id="winHeads" style="height:min(90px,12vh);display:flex;gap:8px;justify-content:center"></div>
  <p class="sub" id="winText"></p>
  <div class="stars" id="winStars"></div>
  <p class="sub" id="winTime" style="font-size:16px;opacity:.75"></p>
  <button class="big" id="nextBtn"><span data-t="next"></span><span>➜</span></button>
  <div class="row2"><button class="big alt" id="againBtn"><span>🔄</span><span data-t="again"></span></button><button class="big alt" id="wLevels"><span>🗺️</span><span data-t="levels"></span></button></div>
</div></div>
<div class="confetti" id="confetti"></div>
</div>

function env(g,t0,a,d,v){ g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); }
function tone(f,dur,type="sine",vol=.15,delay=0,f2=null){ if(muted) return; const c=ac(); if(!c) return; const t0=c.currentTime+delay;
 const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);

function meow(base=520,len=.55,vol=.22){ if(muted) return; const c=ac(); if(!c) return; const t0=c.currentTime;
 const o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(); o.type="sawtooth";
 o.frequency.setValueAtTime(base*.85,t0); o.frequency.linearRampToValueAtTime(base*1.35,t0+len*.3); o.frequency.exponentialRampToValueAtTime(base*.7,t0+len);
 f.type="bandpass"; f.Q.value=5; f.frequency.setValueAtTime(900,t0); f.frequency.linearRampToValueAtTime(2200,t0+len*.3); f.frequency.linearRampToValueAtTime(800,t0+len);

 o.connect(f).connect(g).connect(c.destination); o.start(t0); o.stop(t0+len+.05); }

const MIN_S=.84; // head ~42 scene units wide -> >=22px on a 360px phone
function catScale(sp,sc,kind){ return Math.max(sp.s*sc.f,MIN_S)*(kind==="cub"||kind==="lcub"?.92:1); }
function buildLevel(i,rnd,extra){
 if(i===0) return {w:GARDEN.w,h:GARDEN.h,oy:0,svg:`<image href="${GARDEN_IMG}" x="0" y="0" width="570" height="572"/>`,cats:GARDEN.cats.map(c=>({...c,found:false}))};
 const sc=SCENES[i], r=rng(1000+i*77); const S={bg:[],fg:[],top:[],tint:[],spots:[],spot(x,y,rot,s,pose,above){ this.spots.push({x,y,rot:rot||0,s:s||1,pose:pose||"peek",above:!!above}); }};
 sc.build(S,r);
 const rr=rnd||Math.random; const order=S.spots.map((_,k)=>k); for(let k=order.length-1;k>0;k--){ const j=Math.floor(rr()*(k+1)); [order[k],order[j]]=[order[j],order[k]]; }
 const pick=[]; for(const k of order){ if(pick.length>=sc.n) break; const sp=S.spots[k]; if(pick.some(q=>Math.hypot(S.spots[q].x-sp.x,S.spots[q].y-sp.y)<62)) continue; pick.push(k); }
 const cats=pick.map(k=>{ const sp=S.spots[k]; const kind=sc.kinds[Math.floor(rr()*sc.kinds.length)];
  let col; if(kind==="cat"){ const pool=sc.pref?(rr()<.6?sc.pref:CATCOL.map((_,j)=>j)):CATCOL.map((_,j)=>j); col=CATCOL[pool[Math.floor(rr()*pool.length)]]; } else col=KINDCOL[kind];
  const s=catScale(sp,sc,kind);
  return {x:sp.x,y:sp.y,rot:sp.rot,s,pose:sp.pose,above:sp.above,dim:!!sc.dim,kind,col,spot:k,r:Math.max(26,36*s),found:false}; });
 const ex=Math.max(0,Math.round(extra||0)), T=Math.round(ex/2), B=ex-T;
 const lv={w:600,h:800+ex,oy:-T,cats,spots:S.spots,parts:{ext:EXT[i]?EXT[i](T,B,r):"",bg:S.bg.join(""),fg:S.fg.join(""),top:S.top.join(""),tint:S.tint.join("")}};
 lv.svg=compose(lv); return lv;
}
function compose(lv,ti,mode){ const P=lv.parts;
 if(mode==="alone") return DEFS+animalSvg(lv.cats[ti],"flat");
 const an=(c,k)=>animalSvg(c,k===ti?mode:null);
 const below=lv.cats.map((c,k)=>c.above?"":an(c,k)).join(""), ab=lv.cats.map((c,k)=>c.above?an(c,k):"").join("");
 return DEFS+P.ext+P.bg+below+P.fg+ab+P.top+(mode?"":P.tint); }
function stageExtra(){ const R=stage.getBoundingClientRect(); if(!R.width||!R.height) return 0; return Math.max(0,Math.min(380,600*R.height/R.width-800)); }

function totalStars(){ return Object.values(save.stars).reduce((a,b)=>a+b,0); }
function renderMenu(){ $("menuHeads").innerHTML=headIcon("cat",CATCOL[0])+headIcon("tiger")+headIcon("lion")+headIcon("cat",CATCOL[3]);

$("grid").onclick=e=>{ const c=e.target.closest(".card"); if(!c) return; const i=+c.dataset.lv; if(i+1>save.unlocked){ SFX.miss(); return; } SFX.click(); startLevel(i); };

let G=null; const world=$("world"), stage=$("stage");
const view={base:1,z:1,tx:0,ty:0};
function fmt(ms){ const s=Math.floor(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function startLevel(i){
 $("confetti").innerHTML=""; document.querySelectorAll(".float").forEach(n=>n.remove()); $("pauseOv").classList.remove("active"); $("winOv").classList.remove("active"); show("game");
 const lv=buildLevel(i,window.__seedRnd||null,stageExtra()); G={i,lv,hints:3,used:0,elapsed:0,last:performance.now(),paused:false,done:false,lastMiss:null};
 world.style.width=lv.w+"px"; world.style.height=lv.h+"px";
 world.innerHTML=`<svg viewBox="0 ${lv.oy} ${lv.w} ${lv.h}" xmlns="http://www.w3.org/2000/svg">${lv.svg}<g id="marks"></g></svg>`;
 $("lvname").textContent=`${i+1}. ${t().names[i]}`; $("hintsLeft").textContent=3; $("hintBtn").disabled=false;
 $("paws").innerHTML=lv.cats.map(()=>"<span>🐾</span>").join(""); updateCount();
 $("pauseOv").classList.remove("active"); $("winOv").classList.remove("active");
 fit(); toast((i===0?t().dad+" ":"")+t().find(lv.cats.length),3000);
 clearTimeout(tipT); if(!tipShown){ tipShown=true; tipT=setTimeout(()=>{ if(G&&!G.done&&G.i===i) toast(t().zoomTip,3000,true); },3100); }
}
function updateCount(){ const n=G.lv.cats.filter(c=>c.found).length; $("count").textContent=`🐾 ${n}/${G.lv.cats.length}`; [...$("paws").children].forEach((p,k)=>p.classList.toggle("on",k<n)); }
function fit(){ const R=stage.getBoundingClientRect(); view.base=Math.min(R.width/G.lv.w,R.height/G.lv.h); view.z=1; clamp(); apply(); }
function clamp(){ const R=stage.getBoundingClientRect(), s=view.base*view.z, W=G.lv.w*s, H=G.lv.h*s;
 view.tx=W<=R.width?(R.width-W)/2:Math.min(0,Math.max(R.width-W,view.tx)); view.ty=H<=R.height?(R.height-H)/2:Math.min(0,Math.max(R.height-H,view.ty)); }
function apply(){ world.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.base*view.z})`; }
function zoomAt(px,py,nz){ nz=Math.max(1,Math.min(5,nz)); const s0=view.base*view.z, s1=view.base*nz; const sx=(px-view.tx)/s0, sy=(py-view.ty)/s0; view.z=nz; view.tx=px-sx*s1; view.ty=py-sy*s1; clamp(); apply(); }
function toScene(px,py){ const s=view.base*view.z; return [(px-view.tx)/s,(py-view.ty)/s+G.lv.oy]; }
function toScreen(x,y){ const R=stage.getBoundingClientRect(), s=view.base*view.z; return [R.left+view.tx+x*s, R.top+view.ty+(y-G.lv.oy)*s]; }
window.addEventListener("resize",()=>{ if(G&&$("game").classList.contains("active")){ const R=stage.getBoundingClientRect(); const z=view.z; view.base=Math.min(R.width/G.lv.w,R.height/G.lv.h); view.z=z; clamp(); apply(); } });
$("zin").onclick=e=>{ e.stopPropagation(); const R=stage.getBoundingClientRect(); SFX.click(); zoomAt(R.width/2,R.height/2,view.z*1.6); };
$("zout").onclick=e=>{ e.stopPropagation(); const R=stage.getBoundingClientRect(); SFX.click(); zoomAt(R.width/2,R.height/2,view.z/1.6); };
// pointer: tap / drag / pinch / wheel
const P=new Map(); let gest=null;
stage.addEventListener("pointerdown",e=>{ hideTips(); stage.setPointerCapture(e.pointerId); const R=stage.getBoundingClientRect();
 P.set(e.pointerId,{x:e.clientX-R.left,y:e.clientY-R.top});
 if(P.size===1) gest={type:"tap",sx:e.clientX-R.left,sy:e.clientY-R.top,tx:view.tx,ty:view.ty,t:performance.now()};
 else if(P.size===2){ const [a,b]=[...P.values()]; gest={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:view.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,tx:view.tx,ty:view.ty}; } });
stage.addEventListener("pointermove",e=>{ if(!P.has(e.pointerId)||!gest) return; const R=stage.getBoundingClientRect(); P.set(e.pointerId,{x:e.clientX-R.left,y:e.clientY-R.top});
 if(gest.type==="pinch"&&P.size>=2){ const [a,b]=[...P.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const s0=view.base*gest.z0, sx=(gest.mx-gest.tx)/s0, sy=(gest.my-gest.ty)/s0; view.z=Math.max(1,Math.min(5,gest.z0*d/gest.d0)); const s1=view.base*view.z; view.tx=mx-sx*s1; view.ty=my-sy*s1; clamp(); apply(); }
 else if(gest.type==="tap"||gest.type==="drag"){ const p=P.get(e.pointerId), dx=p.x-gest.sx, dy=p.y-gest.sy; if(gest.type==="tap"&&Math.hypot(dx,dy)>10) gest.type="drag"; if(gest.type==="drag"){ view.tx=gest.tx+dx; view.ty=gest.ty+dy; clamp(); apply(); } } });
function endPtr(e){ if(!P.has(e.pointerId)) return; const p=P.get(e.pointerId); P.delete(e.pointerId);
 if(gest&&gest.type==="tap"&&P.size===0&&e.type==="pointerup") onTap(p.x,p.y);
 if(P.size===0) gest=null; else if(gest&&gest.type==="pinch") gest={type:"none"}; }
stage.addEventListener("pointerup",endPtr); stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("wheel",e=>{ e.preventDefault(); const R=stage.getBoundingClientRect(); zoomAt(e.clientX-R.left,e.clientY-R.top,view.z*(e.deltaY<0?1.15:1/1.15)); },{passive:false});
function floatText(px,py,txt,cls){ const d=document.createElement("div"); d.className="float"+(cls?" "+cls:""); d.textContent=txt; d.style.left=px+"px"; d.style.top=py+"px"; stage.appendChild(d); setTimeout(()=>d.remove(),1150); }
function onTap(px,py){ if(!G||G.done||G.paused) return; const [x,y]=toScene(px,py); const s=view.base*view.z, minR=26/s;
 let best=null,bd=1e9; for(const c of G.lv.cats){ const rr=Math.max(c.r,minR), d=Math.hypot(c.x-x,c.y-y)/rr; if(d<=1&&d<bd&&!(c.found&&best&&!best.found)){ if(!c.found||!best){ best=c; bd=d; } } }
 // prefer an unfound cat over an already found one
 const unf=G.lv.cats.filter(c=>!c.found&&Math.hypot(c.x-x,c.y-y)<=Math.max(c.r,minR)).sort((a,b)=>Math.hypot(a.x-x,a.y-y)/Math.max(a.r,minR)-Math.hypot(b.x-x,b.y-y)/Math.max(b.r,minR));
 if(unf.length) best=unf[0];
 if(best&&!best.found){ found(best,px,py); G.lastMiss=null; return; }
 if(best&&best.found){ floatText(px,py,t().already,"miss"); SFX.click(); return; }
 const now=performance.now();
 if(G.lastMiss&&now-G.lastMiss.t<380&&Math.hypot(G.lastMiss.x-px,G.lastMiss.y-py)<40){ zoomAt(px,py,view.z<2?2.5:1); G.lastMiss=null; return; }
 G.lastMiss={t:now,x:px,y:py}; SFX.miss(); floatText(px,py,["🍃","❓","🌸","🙈"][Math.floor(Math.random()*4)],"miss");
}
function found(c,px,py){ c.found=true; const k=c.kind; if(k==="tiger"||k==="lion") SFX.big(); else if(k==="cub"||k==="lcub") SFX.cub(); else SFX.cat();
 const m=document.getElementById("marks"); const rr=c.kind==="white"?c.r*.95:Math.max(c.r*.9,24);
 m.querySelectorAll(`[data-hint="${G.lv.cats.indexOf(c)}"]`).forEach(n=>n.remove());
 m.insertAdjacentHTML("beforeend",`<g class="found-ring"><circle cx="${c.x}" cy="${c.y}" r="${rr}" fill="#ff4d8d22" stroke="#fff" stroke-width="7" vector-effect="non-scaling-stroke"/><circle cx="${c.x}" cy="${c.y}" r="${rr}" fill="none" stroke="#ff2d7a" stroke-width="4" vector-effect="non-scaling-stroke"/></g>`);
 floatText(px,py,(t().kinds[k]||t().kinds.cat)+" 💖"); updateCount();
 if(G.lv.cats.every(c=>c.found)) win(); }
$("hintBtn").onclick=e=>{ e.stopPropagation(); if(!G||G.done) return; if(G.hints<=0){ toast(t().noHints,1500); return; }
 const left=G.lv.cats.filter(c=>!c.found); if(!left.length) return; const c=left[Math.floor(Math.random()*left.length)], ci=G.lv.cats.indexOf(c);
 G.hints--; G.used++; $("hintsLeft").textContent=G.hints; $("hintBtn").disabled=G.hints<=0; SFX.hint();
 const R=stage.getBoundingClientRect(), s=view.base*view.z; if(view.z>1){ view.tx=R.width/2-c.x*s; view.ty=R.height/2-(c.y-G.lv.oy)*s; clamp(); apply(); }
 const rr=Math.max(c.r*1.25,40); const m=document.getElementById("marks");
 m.insertAdjacentHTML("beforeend",`<g data-hint="${ci}" class="sparkle"><circle cx="${c.x}" cy="${c.y}" r="${rr}" fill="#fff36b33" stroke="#ffd23f" stroke-width="5" stroke-dasharray="10 8" vector-effect="non-scaling-stroke"/><text x="${c.x+rr*.7}" y="${c.y-rr*.7}" font-size="${Math.max(30,rr*.6)}">✨</text><text x="${c.x-rr*1.05}" y="${c.y+rr*.95}" font-size="${Math.max(24,rr*.45)}">✨</text></g>`);
 setTimeout(()=>{ m.querySelectorAll(`[data-hint="${ci}"]`).forEach(n=>n.remove()); },4000); };
let toastT=null, tipT=null, tipShown=false; function toast(msg,ms,one){ const el=$("toast"); el.textContent=msg; el.dir=lang==="he"?"rtl":"ltr"; el.classList.toggle("one",!!one); el.classList.remove("hide"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.add("hide"),ms||2000); }
function hideTips(){ clearTimeout(tipT); clearTimeout(toastT); $("toast").classList.add("hide"); }
function tick(){ if(G&&!G.paused&&!G.done&&$("game").classList.contains("active")){ const now=performance.now(); G.elapsed+=now-G.last; G.last=now; $("timer").textContent=fmt(G.elapsed); } else if(G) G.last=performance.now(); requestAnimationFrame(tick); }
requestAnimationFrame(tick);
$("pauseBtn").onclick=()=>{ if(!G||G.done) return; SFX.click(); G.paused=true; $("pauseOv").classList.add("active"); };
$("resumeBtn").onclick=()=>{ SFX.click(); G.paused=false; G.last=performance.now(); $("pauseOv").classList.remove("active"); };
$("restartBtn").onclick=()=>{ SFX.click(); startLevel(G.i); };
$("pLevels").onclick=$("wLevels").onclick=()=>{ SFX.click(); $("pauseOv").classList.remove("active"); $("winOv").classList.remove("active"); renderLevels(); show("levels"); };
$("pMenu").onclick=()=>{ SFX.click(); $("pauseOv").classList.remove("active"); renderMenu(); show("menu"); };
$("againBtn").onclick=()=>{ SFX.click(); startLevel(G.i); };
$("nextBtn").onclick=()=>{ SFX.click(); if(G.i<5) startLevel(G.i+1); else { $("winOv").classList.remove("active"); renderLevels(); show("levels"); } };
function win(){ G.done=true; const i=G.i, stars=Math.max(1,3-G.used);
 save.stars[i]=Math.max(save.stars[i]||0,stars); const prevBest=save.best[i]; if(!prevBest||G.elapsed<prevBest) save.best[i]=Math.round(G.elapsed); save.unlocked=Math.max(save.unlocked,Math.min(6,i+2)); persist();
 setTimeout(()=>{ if(!G||G.i!==i) return; SFX.win(); const L=t();
  $("winText").textContent=L.found(G.lv.cats.length)+(i===5&&Object.keys(save.stars).length>=6?" "+L.allDone:"");
  $("winStars").innerHTML=[0,1,2].map(k=>`<span class="${k<stars?"":"off"}">⭐</span>`).join("");
  $("winTime").textContent=L.time(fmt(G.elapsed))+" · "+L.best(fmt(save.best[i]));
  const kinds=[...new Set(G.lv.cats.map(c=>c.kind))].slice(0,3); $("winHeads").innerHTML=kinds.map(k=>headIcon(k==="white"?"cat":k,k==="white"?CATCOL[3]:k==="cat"?CATCOL[Math.floor(Math.random()*6)]:undefined)).join("");
  $("nextBtn").style.display=""; $("nextBtn").firstElementChild.textContent=i<5?L.next:L.levels;
  $("winOv").classList.add("active"); confetti(); },800); }
function confetti(){ const c=$("confetti"); c.innerHTML=""; const em=["🐱","⭐","💖","🐾","🌸","🐯","🦁"]; for(let k=0;k<26;k++){ const s=document.createElement("span"); s.textContent=em[k%em.length]; s.style.left=(Math.random()*100)+"%"; s.style.animationDuration=(2.2+Math.random()*2)+"s"; s.style.animationDelay=(Math.random()*.8)+"s"; c.appendChild(s); } setTimeout(()=>c.innerHTML="",5000); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&G&&$("game").classList.contains("active")&&!G.done){ G.paused?$("resumeBtn").click():$("pauseBtn").click(); } });
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&G&&!G.done&&$("game").classList.contains("active")&&!G.paused) $("pauseBtn").click(); });
// test hooks
window.__hc={get G(){return G;},toScreen,start:startLevel,save:()=>save,build:buildLevel,compose,rng,stageExtra,catScale,scenes:SCENES,KINDCOL,CATCOL};
applyLang();
</script>
