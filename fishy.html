function makeDecor(wi,R){

  else if(kind==="ship")tp=["rock","kelp","tube","bone","yarn","branch"][R()*6|0];
  else if(kind==="glow")tp=["mush","crystal","mush","tube","crystal","fan"][R()*6|0];

  d.push({t:tp,x,s:.7+R()*.9,c:R()*6|0,ph:R()*6,l:R()<.35?0:1})}

function effSize(f){let s=f.size*(1+.9*f.inf);if(G.P.shrT>0&&s>G.P.sz*1.08&&f.beh!=="urchin"&&f.beh!=="jelly")s*=.5;return s}
function rel(f){const e=effSize(f),p=G.P.sz;if(f.hz||f.beh==="giant"&&false)return -2;if(e<p*.92)return 1;if(e>p*1.08)return -1;return 0}
/* ============ update ============ */
const SP0=250;
function pSpeed(){const P=G.P;return SP0*(1+.035*P.tier)*(P.speedT>0?1.55:1)}
function inputVec(){
 if(window.__fishyIn)return window.__fishyIn;
 let x=0,y=0;
 if(keys.ArrowLeft||keys.KeyA)x-=1;if(keys.ArrowRight||keys.KeyD)x+=1;if(keys.ArrowUp||keys.KeyW)y-=1;if(keys.ArrowDown||keys.KeyS)y+=1;
 if(x||y){const l=Math.hypot(x,y);return[x/l,y/l,1]}
 if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),R=58;if(d<6)return[0,0,0];const s=Math.min(1,d/R);return[dx/d,dy/d,s]}
 if(mouse.in&&!joy.on){const {S}=camView(),sx=W/2+(G.P.x-G.camX)*G.camS,sy=H/2+(G.P.y-G.camY)*G.camS,dx=mouse.x-sx,dy=mouse.y-sy,d=Math.hypot(dx,dy);if(d>16){const s=Math.min(1,(d-16)/110);return[dx/d,dy/d,s]}}
 return[0,0,0]}
function say(txt,ms=900,big){const c=$("cap");c.textContent=txt;c.classList.add("on");G.capT=ms/1000}
function addPop(x,y,txt,col){G.pops.push({x,y,txt,col:col||"#fff",l:1})}
function burst(x,y,n,col,spd=120,r=4){for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(.3,1)*spd;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,l:rnd(.4,.8),m:.8,r:rnd(r*.6,r*1.4),c:col,bub:Math.random()<.5})}}
function update(dt){
 if(!G||G.state!=="play")return;
 const P=G.P;G.t+=dt;idleT+=dt;
 if(G.fin>0){P.inv=Math.max(P.inv,.25);G.fin-=dt;if(G.fin<=0){G.fin=0;return finish(true)}}
 if(G.capT>0){G.capT-=dt;if(G.capT<=0)$("cap").classList.remove("on")}
 if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0){G.combo=0;$("combo").classList.remove("on")}}
 P.inv=Math.max(0,P.inv-dt);P.speedT=Math.max(0,P.speedT-dt);P.magT=Math.max(0,P.magT-dt);P.flash=Math.max(0,P.flash-dt);P.mouth=Math.max(0,P.mouth-dt*4);
 if(P.shrT>0){P.shrT-=dt}
 P.sz+=(PS[P.tier]-P.sz)*Math.min(1,dt*3);if(Math.abs(P.sz-PS[P.tier])<.05)P.sz=PS[P.tier];
 // timers / goals
 if(G.stage){const gl=G.stage.goal;
  if(gl.k==="survive"){G.timeLeft-=dt;G.gp=Math.min(G.goalTot,G.goalTot-Math.max(0,G.timeLeft));if(G.timeLeft<=0)return finish(true)}
  else if(G.limit){G.timeLeft-=dt;if(G.timeLeft<=0)return finish(false,"timeout")}
  if(gl.k==="size"){G.gp=P.tier;if(P.tier>=gl.v)return finish(true)}
 }
 // player
 if(P.gulp>0){P.gulp-=dt;if(P.gulp<=0){if(G.hearts<=0)return finish(false);respawnPlayer()}}
 else{
  const [ix,iy,is]=inputVec(),sp=pSpeed(),tx=ix*sp*is,ty=iy*sp*is,k=Math.min(1,dt*6);
  P.vx+=(tx-P.vx)*k;P.vy+=(ty-P.vy)*k;P.x+=P.vx*dt;P.y+=P.vy*dt;
  const m=P.sz*.45;P.x=clamp(P.x,m,WW-m);P.y=clamp(P.y,m+34,WH-m*.6);
  if(Math.abs(P.vx)>25)P.dir=P.vx>0?1:-1;
  P.ang+=((clamp(P.vy/sp,-1,1)*.35*P.dir)-P.ang)*Math.min(1,dt*6);
  if(Math.random()<dt*2)G.parts.push({x:P.x-P.dir*P.sz*.4,y:P.y,vx:rnd(-8,8),vy:-30,l:.8,m:.8,r:rnd(2,4),c:"#ffffffaa",bub:true});
 }
 // fish
 const sight=360*G.D.sight,fl=G.fish;
 for(let i=fl.length-1;i>=0;i--){const f=fl[i];
  if(!f.alive){fl.splice(i,1);continue}
  f.t+=dt;f.shr+=((P.shrT>0&&effSize({...f,inf:f.inf})<f.size*(1+.9*f.inf)?.6:1)-f.shr)*Math.min(1,dt*5);
  if(f.eat>0){f.eat-=dt*7;const d=Math.max(0,f.eat);f.x+=(P.x+P.dir*P.sz*.35-f.x)*Math.min(1,dt*14);f.y+=(P.y-f.y)*Math.min(1,dt*14);f.shr=d;if(f.eat<=0)f.alive=false;continue}
  moveFish(f,dt,sight);
  if(P.gulp>0)continue;
  collide(f,dt);
 }
 // magnet
 if(P.magT>0)for(const f of fl){if(f.eat>0||f.hz||f.tag==="gold")continue;if(rel(f)===1&&f.size<P.sz*.9){const dx=P.x-f.x,dy=P.y-f.y,d=Math.hypot(dx,dy);if(d<300&&d>1){const pull=240*(1-d/300);f.x+=dx/d*pull*dt;f.y+=dy/d*pull*dt}}}
 // pearls
 for(const pr of G.pearls){if(pr.got||P.gulp>0)continue;pr.ph+=dt;if(Math.hypot(pr.x-P.x,pr.y-P.y)<P.sz*.5+16*K){pr.got=true;G.gp++;SFX.cheer();burst(pr.x,pr.y,14,"#ffffff",150,4);addPop(pr.x,pr.y-20,"💎","#fff");if(G.stage&&G.gp>=G.goalTot)return finish(true)}}
 // items
 for(let i=G.items.length-1;i>=0;i--){const it=G.items[i];it.t+=dt;it.l-=dt;if(it.l<=0){G.items.splice(i,1);continue}
  it.y+=Math.sin(it.t*2+it.ph)*10*dt;if(P.gulp<=0&&Math.hypot(it.x-P.x,it.y-P.y)<P.sz*.5+22*K*.9){takeItem(it);G.items.splice(i,1)}}
 // spawning
 G.hzT-=dt;G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=.22;manage()}
 G.itemT-=dt;if(G.itemT<=0){G.itemT=rnd(11,17);if(G.items.length<2){const q=randPos(40);G.items.push({x:q.x,y:q.y,k:G.end&&G.D.esc>0&&G.hearts<G.maxHearts&&Math.random()<.5?"heart":pick(["speed","magnet","shield","shrink"]),t:0,ph:rnd(0,6),l:22})}}
 const gl2=G.stage&&G.stage.goal;
 if(gl2&&gl2.k==="golden"||G.end&&false){G.goldT-=dt;if(G.goldT<=0&&!G.fish.some(f=>f.tag==="gold"&&f.alive)){const sz=Math.max(14*K,P.sz*.62),q=offscreenPos(sz),f=mk("golden",sz,q.x,q.y);f.tag="gold";f.gl=22;G.fish.push(f);say(t("gold"),1200);G.goldT=6}}
 if(G.end&&G.t>20&&G.t%40<dt&&!G.fish.some(f=>f.tag==="gold")){const sz=Math.max(14*K,P.sz*.62),q=offscreenPos(sz),f=mk("golden",sz,q.x,q.y);f.tag="gold";f.gl=20;G.fish.push(f)}
 // endless score time
 // particles
 for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.l-=dt;if(p.l<=0){G.parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=(p.bub?40:-60)*dt;p.vx*=.98}
 for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];p.l-=dt*1.1;p.y-=40*dt;if(p.l<=0)G.pops.splice(i,1)}
 for(const b of G.bubbles){b.y-=b.v*dt;b.x+=Math.sin(G.t+b.ph)*10*dt;if(b.y<-10){b.y=WH+10;b.x=rnd(0,WW)}}
 // camera
 const {VH,S}=camView();G.camS+=(S-G.camS)*Math.min(1,dt*3);
 const VW=W/G.camS,VHn=H/G.camS;
 let tx2=P.x+P.vx*.25,ty2=P.y+P.vy*.2;
 G.camX+=(tx2-G.camX)*Math.min(1,dt*4);G.camY+=(ty2-G.camY)*Math.min(1,dt*4);
 G.shake=Math.max(0,G.shake-dt*3);
 if(G.boss&&!G.bossSeen&&P.tier>=G.stage.bneed){G.bossSeen=true;say(t("boss"),1800);SFX.power()}
 // hint
 if(G.stage&&G.stage.hint!=null&&G.t>1&&G.t<5&&!G.hintShown){G.hintShown=true;say(t("hint"+G.stage.hint),3200)}
 if(G.stage&&G.stage.i===0&&G.t>1&&!G.hintShown){G.hintShown=true;say(t("hint0"),3600)}
 if(G.end&&G.t>0.5&&!G.hintShown){G.hintShown=true;say(t("hint0"),3000)}
 if(G.end&&G.D.esc>0){const w=Math.floor(G.t/20);if(w>G.wave){G.wave=w;if(w<=8){say(t("wave").replace("{n}",w+1),1200);SFX.siren()}}}
}
function camClamp(){const VW=W/G.camS,VH=H/G.camS;let x=G.camX,y=G.camY;
 x=VW>=WW?WW/2:clamp(x,VW/2,WW-VW/2);y=VH>=WH+160?(WH-160)/2:clamp(y,VH/2-150,WH-VH/2+10);return[x,y]}
function respawnPlayer(){
 const P=G.P;let best=null,bd=-1;
 for(let k=0;k<10;k++){const x=rnd(WW*.15,WW*.85),y=rnd(WH*.2,WH*.7);let md=1e9;for(const f of G.fish){if(f.beh==="pred"||f.hz||f.boss){const d=Math.hypot(f.x-x,f.y-y);if(d<md)md=d}}if(md>bd){bd=md;best={x,y}}}
 P.x=best.x;P.y=best.y;P.vx=P.vy=0;P.inv=2.4;G.camX=P.x;G.camY=P.y;burst(P.x,P.y,12,"#ffffff",110,4)}
function hurt(kind,src){
 const P=G.P;if(P.inv>0||P.gulp>0)return false;
 if(P.shield>0){P.shield=0;P.inv=1.2;SFX.pop();burst(P.x,P.y,16,"#9fe9ff",160,5);say(t("shield"),700);return true}
 G.hearts--;G.hits++;G.shake=.5;
 if(kind==="gulp"){P.gulp=.9;P.inv=.9;SFX.gulp();burst(P.x,P.y,22,"#ffffff",150,5);say(t("gulp"),900);if(src){src.cool=4;src.rest=1.2}}
 else{P.inv=1.5;SFX.sting();if(src){const dx=P.x-src.x,dy=P.y-src.y,d=Math.hypot(dx,dy)||1;P.vx=dx/d*420;P.vy=dy/d*420}burst(P.x,P.y,12,"#ff8fb8",140,4);say(t("sting"),900);P.flash=.4;if(G.hearts<=0){P.gulp=.6}}
 G.combo=0;$("combo").classList.remove("on");
 return true}
function eatFish(f){
 const P=G.P;f.eat=1;P.mouth=1;G.eaten++;G.combo++;G.comboT=2.3;G.maxCombo=Math.max(G.maxCombo||0,G.combo);
 const gain=Math.max(.15,Math.min(1.25,f.size/P.sz*1.25))*(f.tag==="gold"?3:1);
 const pts=Math.round(f.size*(1+Math.min(G.combo,10)*.15));G.score+=pts;
 SFX.nom(G.combo);burst(f.x,f.y,8,"#ffe14d",100,3);addPop(f.x,f.y-10,"+"+pts,"#ffe14d");
 if(G.combo>=2){const c=$("combo");c.textContent="x"+G.combo;c.classList.add("on")}
 if(G.combo===3||G.combo===5||G.combo===8||G.combo===12){say(t("cheers")[Math.min(6,G.combo<=3?3:G.combo<=5?4:G.combo<=8?5:6)],700);SFX.cheer()}
 if(f.shr<.9&&f.size>P.sz*1.08){say(t("revenge"),800)}
 if(P.tier<TIERS_MAX())P.meter+=gain;
 while(P.tier<TIERS_MAX()&&P.meter>=NEED[P.tier]){P.meter-=NEED[P.tier];P.tier++;SFX.grow();say(t("grow"),1100);burst(P.x,P.y,26,"#ffd23f",200,5)}
 if(P.tier>=TIERS_MAX())P.meter=Math.min(P.meter,NEED[5]*.999);
 // goals
 const gl=G.stage&&G.stage.goal;
 if(gl){
  if(gl.k==="eat"&&f.kind===gl.kind){G.gp++}
  else if(gl.k==="golden"&&f.tag==="gold"){G.gp++;burst(f.x,f.y,30,"#ffd23f",220,5);SFX.win()}
  else if(gl.k==="school"&&f.tag==="goal"){G.gp++}
  else if(gl.k==="boss"&&f.boss){G.gp=1;burst(f.x,f.y,40,"#ffffff",260,6)}
  if(gl.k!=="size"&&gl.k!=="survive"&&gl.k!=="pearls"&&G.gp>=(gl.k==="boss"?1:G.goalTot)){G.fin=.7;P.inv=Math.max(P.inv,1.5)}}
}
const TIERS_MAX=()=>PS.length-1;
function collide(f,dt){
 const P=G.P;if(f.eat>0)return;
 const dx=f.x-P.x,dy=f.y-P.y;
 const rp=P.sz*.42,e=effSize(f),rf=e*.4*(f.beh==="urchin"?1.15:1);
 const d=Math.hypot(dx,dy);
 if(f.hz){
  if(f.beh==="jelly"){if(d<rf*1.0+rp*.55&&P.inv<=0)hurt("sting",f)}
  else if(f.beh==="urchin"){if(d<rf*.95+rp*.5&&P.inv<=0)hurt("sting",f)}
  if(d<rf+rp*.8&&P.inv>0){const k=.4;P.x-=dx/(d||1)*k*60*dt;P.y-=dy/(d||1)*k*60*dt}
  return}
 const r=rel(f);
 if(f.kind==="puff"&&f.inf>.55&&d<rf+rp*.7){if(P.inv<=0)hurt("sting",f);return}
 if(r===1&&d<rp+rf*.62){eatFish(f);return}
 if(r===-1&&d<rp*.45+rf*.82){
  if(f.beh==="giant"||f.beh==="bosswhale"&&false){const k=1;P.x-=dx/(d||1)*80*dt;P.y-=dy/(d||1)*80*dt;return}
  if(f.cool>0&&f.rest>0)return;
  if(P.inv>0){P.x-=dx/(d||1)*140*dt;P.y-=dy/(d||1)*140*dt;return}
  if(f.beh==="pred"||f.beh==="bosswhale"||f.boss)hurt("gulp",f);else if(f.beh==="giant"){}
  return}
 if(r===0&&d<rp+rf*.8){const k=(rp+rf*.8-d)/(d||1);P.x-=dx*k*.5;P.y-=dy*k*.5;f.x+=dx*k*.5;f.y+=dy*k*.5;if(!f.bumpT||G.t-f.bumpT>.5){f.bumpT=G.t;SFX.bump();addPop(f.x,f.y-f.size*.5,"≈","#cfe9ff")}}
}
function steer(f,tx,ty,spd,dt,acc=2.5){
 const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy)||1,k=Math.min(1,dt*acc);
 f.vx+=(dx/d*spd-f.vx)*k;f.vy+=(dy/d*spd-f.vy)*k}
function moveFish(f,dt,sight){
 const P=G.P,pg=P.gulp>0,pd=Math.hypot(P.x-f.x,P.y-f.y),m=Math.max(20,f.size*.5);
 let spd=f.sp,tx=f.tx,ty=f.ty;
 f.cool=Math.max(0,f.cool-dt);f.rest=Math.max(0,f.rest-dt);
 switch(f.beh){
  case"drift":{if(f.wt<=0){f.wt=rnd(2,5);f.tx=f.x+rnd(-80,80);f.ty=f.y+rnd(-60,60)}f.wt-=dt;steer(f,f.tx,f.ty,f.sp,dt,1);break}
  case"crab":{f.y=WH-f.size*.35-8;if(f.wt<=0){f.wt=rnd(1.5,4);f.vx=(Math.random()<.5?-1:1)*f.sp}f.wt-=dt;
   if(!pg&&pd<f.size*2+80&&P.sz>f.size*1.08){f.vx=(f.x>P.x?1:-1)*f.sp*1.7}
   f.x+=f.vx*dt;f.vy=0;if(f.x<m||f.x>WW-m){f.vx=-f.vx;f.x=clamp(f.x,m,WW-m)}f.dir=f.vx>=0?1:-1;f.t+=dt*3;return}
  case"jelly":{f.y=f.base+Math.sin(f.t*.7)*f.amp;f.x+=Math.sin(f.t*.35+f.id)*14*dt;f.vx=f.vy=0;f.x=clamp(f.x,60,WW-60);return}
  case"urchin":{f.vx=f.vy=0;return}
  case"golden":{
   if(f.gl!=null){f.gl-=dt;if(f.gl<=0){f.alive=false;return}}
   if(!pg&&pd<420){const a=Math.atan2(f.y-P.y,f.x-P.x);steer(f,f.x+Math.cos(a)*300,f.y+Math.sin(a)*300,f.sp*(pd<260?1.15:.9)*(G.D===DIFFS.hard?1.1:G.D.xp?1.2:1),dt,3.2)}
   else{if(f.wt<=0){f.wt=rnd(1,2.4);f.tx=rnd(100,WW-100);f.ty=rnd(120,WH-120)}f.wt-=dt;steer(f,f.tx,f.ty,f.sp*.55,dt,2)}
   break}
  case"giant":{if(f.wt<=0){f.wt=rnd(4,8);f.tx=rnd(200,WW-200);f.ty=rnd(120,WH-300)}f.wt-=dt;steer(f,f.tx,f.ty,f.sp,dt,.8);break}
  case"bosswhale":
  case"pred":{
   const strong=G.boss===f&&P.tier>=G.stage.bneed;
   const dang=!pg&&rel(f)===-1&&!strong;
   if(f.beh==="bosswhale"){spd=f.sp}
   if(strong&&!pg&&pd<sight*1.3){const a=Math.atan2(f.y-P.y,f.x-P.x);steer(f,f.x+Math.cos(a)*300,f.y+Math.sin(a)*300,f.sp*.75*G.D.spd,dt,1.6);break}
   if(dang&&pd<sight&&f.cool<=0&&f.rest<=0){f.chase+=dt;
    steer(f,P.x,P.y,pSpeed()*(G.boss===f?.7:.8)*G.D.spd*(f.size>110?.8:1)*(1+Math.min(.3,lvE()*.025)),dt,1.6);
    if(f.chase>5.2){f.cool=3.2;f.chase=0;f.yawn=1}
   }else{f.chase=Math.max(0,f.chase-dt*.5);if(f.wt<=0){f.wt=rnd(2.5,6);f.tx=rnd(150,WW-150);f.ty=rnd(120,WH-160)}f.wt-=dt;steer(f,f.tx,f.ty,f.sp*.5*(f.cool>0?.5:1),dt,1.2)}
   break}
  default:{ // prey / wanderers (incl. puffers)
   let flee=false;
   if(f.beh!=="school"||f.sch&&f.sch.lead===f||!f.sch){}
   const prey=!pg&&effSize(f)<P.sz*.95&&f.tag!=="goal"||!pg&&f.tag==="goal"&&P.sz>f.size;
   if(prey&&pd<f.size*2.4+70&&f.kind!=="plankton"){flee=true;const a=Math.atan2(f.y-P.y,f.x-P.x);steer(f,f.x+Math.cos(a)*300,f.y+Math.sin(a)*300,f.sp*(f.tag==="goal"?1.15:.95)*(G.D===DIFFS.easy?.8:1),dt,3)}
   if(f.kind==="puff"){const near=!pg&&pd<f.size*2.3+60;f.inf+=((near&&!f.boss||near&&f.boss&&false)?1-f.inf:-f.inf)*Math.min(1,dt*(near?5:1.2));if(near&&f.inf<.1&&!f.hopped){f.hopped=true;if(f.size>=P.sz*.45&&G.t>3)addPop(f.x,f.y-f.size,"💥","#fff")}if(!near)f.hopped=false}
   if(!flee){
    if(f.sch&&f.off){let L=f.sch.lead;if(!L||!L.alive||L.eat>0){L=null;for(const o of G.fish)if(o.sch===f.sch&&o.alive&&o.eat<=0){L=o;break}f.sch.lead=L}
     if(L&&L!==f){steer(f,L.x+f.off.x,L.y+f.off.y,Math.max(f.sp,Math.hypot(L.vx,L.vy)*1.2+20),dt,3);break}}
    if(f.wt<=0){f.wt=rnd(2,5);f.tx=rnd(120,WW-120);f.ty=rnd(100,WH-120)}f.wt-=dt;
    if(Math.hypot(f.tx-f.x,f.ty-f.y)<50)f.wt=0;steer(f,f.tx,f.ty,f.sp*.6,dt,1.2)}
   break}
 }
 f.x+=f.vx*dt;f.y+=f.vy*dt;
 if(f.x<m){f.x=m;f.vx=Math.abs(f.vx);f.tx=rnd(WW*.3,WW*.7)}if(f.x>WW-m){f.x=WW-m;f.vx=-Math.abs(f.vx);f.tx=rnd(WW*.3,WW*.7)}
 if(f.y<m+30){f.y=m+30;f.vy=Math.abs(f.vy);f.ty=rnd(WH*.3,WH*.7)}if(f.y>WH-m*.6){f.y=WH-m*.6;f.vy=-Math.abs(f.vy);f.ty=rnd(WH*.3,WH*.7)}
 if(Math.abs(f.vx)>8)f.dir=f.vx>0?1:-1;f.face+=(f.dir-f.face)*Math.min(1,dt*8);
}
function manage(){
 const P=G.P;let ne=0,nm=0,np=0,nh=0,npl=0,nKind=0,viewFar=0;
 for(const f of G.fish){if(!f.alive||f.eat>0)continue;
  if(f.hz){nh++;continue}
  if(f.kind==="plankton"){npl++;continue}
  if(f.boss||f.tag==="gold"||f.tag==="goal")continue;
  const r=rel(f);if(r===1)ne++;else if(r===0)nm++;else np++;
  if(G.stage&&G.stage.goal.kind===f.kind)nKind++}
 if(G.end&&G.D.esc>0&&nh<hazTarget()&&G.hzT<=0){spawnHazard(true);G.hzT=3}

 const pt=$("pTime");if(G.end){pt.classList.remove("hide");const sec=Math.floor(G.t);setT(pt,"⏱ "+(sec/60|0)+":"+String(sec%60).padStart(2,"0"),"time")}else if(G.limit&&gl&&gl.k!=="survive"){pt.classList.remove("hide");setT(pt,"⏱ "+Math.max(0,Math.ceil(G.timeLeft)),"time")}else pt.classList.add("hide");

  s+=`<button class="sb${st.goal.k==="boss"?" boss":""}${ok?"":" lock"}" data-st="${i}" ${ok?"":"disabled"}>${ok?(st.goal.k==="boss"?"👑":(w+1)+"-"+(n+1)):"🔒"}<small>${ok?stars(sv):""}</small>${store.xc[i]?"<i class=\"xf\">🔥</i>":""}</button>`}

 const D=DIFFS[store.diff];$("bH").textContent=t("hearts")+" ×"+D.hearts+" · "+t("dEasy").slice(0,0)+({easy:t("dEasy"),normal:t("dNorm"),hard:t("dHard"),expert:t("dExp")})[store.diff];show("brief")}

function showOver(){
 if(!G||G.state=="play")return;mode="over";const win=G.state==="win";document.body.classList.remove("play");$("cap").classList.remove("on");
 const e=G.end;$("oT").textContent=win?t("win"):G.why==="timeout"?t("timeout"):e?t("endS").split("·")[0].slice(0,0)+t("lose"):t("lose");

let confRaf=0;
function confetti(){const cf=$("conf"),c=cf.getContext("2d"),Wc=cf.width,Hc=cf.height,cols=["#ffd23f","#ff6f91","#5fd38d","#5cc8ff","#a58bff","#ff9a3c"];confP=[];for(let i=0;i<110;i++)confP.push({x:Math.random()*Wc,y:-Math.random()*Hc*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:5+Math.random()*7,c:cols[i%6],a:Math.random()*6,k:i%3});
 const end=performance.now()+3200;cancelAnimationFrame(confRaf);(function f(){c.clearRect(0,0,Wc,Hc);confP.forEach(p=>{p.x+=p.vx*dpr;p.y+=p.vy*dpr;p.a+=.15;c.fillStyle=p.c;c.save();c.translate(p.x,p.y);c.rotate(p.a);if(p.k===1){c.beginPath();for(let q=0;q<10;q++){const rr=q%2?p.r*.45:p.r*1.3,an=q*Math.PI/5;c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}c.fill()}else if(p.k===2){c.beginPath();c.arc(0,0,p.r*.7,0,6.3);c.fill()}else c.fillRect(-p.r,-p.r/2,p.r*2,p.r);c.restore()});if(performance.now()<end)confRaf=requestAnimationFrame(f);else c.clearRect(0,0,Wc,Hc)})()}
