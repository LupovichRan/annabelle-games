let cfA=0;function confetti(n=70){const cv=$("conf");cv.width=innerWidth;cv.height=innerHeight;const x=cv.getContext("2d");const C=["#ff5c93","#ffd24a","#5fd38d","#5aa9ff","#b57cff"];const P=[];for(let i=0;i<n;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*6,c:C[i%5],a:Math.random()*6,k:i%3});const end=Date.now()+2600;cancelAnimationFrame(cfA);(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);if(p.k===1){x.beginPath();for(let q=0;q<10;q++){const rr=q%2?p.r*.45:p.r*1.3,an=q*Math.PI/5;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}x.fill()}else if(p.k===2){x.beginPath();x.arc(0,0,p.r*.7,0,6.3);x.fill()}else x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(Date.now()<end)cfA=requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})()}
