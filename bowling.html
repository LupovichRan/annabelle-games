function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type="sine",v=.2,f2,delay=0){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.05)}

/* ================= scoring ================= */
function scoreGame(rolls){
 const frames=[];let i=0,total=0,ok=true;
 for(let f=0;f<10;f++){
  const fr={m:[],cum:null};
  if(f<9){
   const a=rolls[i];
   if(a===undefined){ok=false;frames.push(fr);continue}
   if(a===10){fr.m=["X"];const b1=rolls[i+1],b2=rolls[i+2];if(b1!==undefined&&b2!==undefined&&ok){total+=10+b1+b2;fr.cum=total}else ok=false;i+=1}
   else{fr.m=[a];const b=rolls[i+1];
    if(b===undefined)ok=false;
    else{fr.m.push(a+b===10?"/":b);
     if(a+b===10){const c=rolls[i+2];if(c!==undefined&&ok){total+=10+c;fr.cum=total}else ok=false}
     else if(ok){total+=a+b;fr.cum=total}}
    i+=2}
  }else{
   const a=rolls[i],b=rolls[i+1],c=rolls[i+2];
   if(a!==undefined)fr.m.push(a===10?"X":a);
   if(b!==undefined)fr.m.push(a===10?(b===10?"X":b):(a+b===10?"/":b));
   if(c!==undefined)fr.m.push(c===10?"X":(a===10&&b!==10&&b+c===10)?"/":c);
   const need=(a!==undefined&&b!==undefined&&(a===10||a+b>=10))?3:2;
   const have=[a,b,c].filter(x=>x!==undefined).length;
   if(have>=need&&ok){total+=(a||0)+(b||0)+(c||0);fr.cum=total}else ok=false;
  }
  frames.push(fr)}
 return{frames,total:frames.reduce((m,f)=>f.cum!=null?f.cum:m,0)};
}

}

  else if(fr.length===2){if(fr[0]===10){if(k===10)reset=true}else{if(fr[0]+k===10)reset=true;else end=true}}

 }else if(G.phase==="result"){G.timer+=dt;if(G.timer>1.5){G.phase="sweep";G.timer=0;SFX.sweep()}}
 else if(G.phase==="sweep"){G.timer+=dt;G.sweepA=Math.max(0,1-G.timer/.7);if(G.timer>.8){advance()}}
 const tz=(G.phase==="roll"&&G.P&&G.P.ball.y>1.1||G.phase==="result"||G.phase==="sweep")?1.2:1;G.z+=(tz-G.z)*Math.min(1,dt*3.5);
}
/* ================= drawing ================= */
const Lay={W0:300,yB:0,yT:0,Hh:0,K:.95,s1:0};
function layout(){
 const tb=$("top").getBoundingClientRect(),cb=$("ctl").getBoundingClientRect();
 const ty=tb.bottom+44,by=cb.top-2;
 Lay.yB=by-72;Lay.yT=ty+8;Lay.Hh=Math.max(120,Lay.yB-Lay.yT);Lay.W0=Math.min(W*.8,Lay.Hh*.95,380);Lay.s1=1/(1+Lay.K);
 $("turn").style.top=(tb.bottom+3)+"px"}
function proj(x,y){const u=Math.max(-.2,Math.min(1.3,y/(L+.35))),s=1/(1+Lay.K*u);return{x:W/2+x*Lay.W0*s,y:Lay.yB-Lay.Hh*(1-s)/(1-Lay.s1),s}}
function draw(dt){
 layout();
 cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
 // room
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#3a1d6e");g.addColorStop(.55,"#5a2a9a");g.addColorStop(1,"#2a1458");cx.fillStyle=g;cx.fillRect(0,0,W,H);
 const tt=G.time;for(let i=0;i<9;i++){const px=(i+.5)/9*W,py=Lay.yT-6+Math.sin(tt*1.5+i)*4;cx.fillStyle=["#ff5d8f88","#ffd23f88","#4dc3ff88","#7ddc6a88"][i%4];cx.beginPath();cx.arc(px,py+10,10+Math.sin(tt*2+i*1.7)*3,0,7);cx.fill()}
 cx.save();const pvy=proj(0,PY0-.12).y;cx.translate(W/2,pvy);cx.scale(G.z,G.z);cx.translate(-W/2,-pvy);
 drawLane();
 // pins / ball sorted far-first
 const items=[];
 if(G.phase==="aim"||G.phase==="meter"){for(const p of PIN0)if(G.standing.has(p.id))items.push({y:p.y0,k:"pin",p:{id:p.id,x:p.x0,y:p.y0,up:true,ang:0,z:0}})}
 else if(G.P){for(const p of G.P.pins)items.push({y:p.y,k:"pin",p});if(!G.P.ball.out||G.phase==="roll")items.push({y:G.P.ball.y,k:"ball"})}
 if(G.phase==="aim"||G.phase==="meter")items.push({y:0,k:"aimball"});
 items.sort((a,b)=>b.y-a.y);
 for(const it of items){if(it.k==="pin")drawPin(it.p);else if(it.k==="ball")drawBall(G.P.ball,G.P.c.rb);else drawBall({x:G.aim.x,y:0,roll:0,gut:false},cfg().rb)}
 if(G.phase==="aim"||G.phase==="meter")drawGuide();
 cx.restore();
 drawKitten(dt);
 // confetti
 for(const c of G.conf){cx.save();cx.translate(c.x,c.y);cx.rotate(c.r);cx.fillStyle=c.c;cx.globalAlpha=Math.min(1,c.life);cx.fillRect(-4,-2,8,4);cx.restore()}
}
function drawLane(){
 const a=proj(0,-.2),b=proj(0,L+.35);
 const poly=(x0,x1,col)=>{const p0=proj(x0,-.2),p1=proj(x1,-.2),q0=proj(x0,L+.35),q1=proj(x1,L+.35);cx.fillStyle=col;cx.beginPath();cx.moveTo(p0.x,p0.y);cx.lineTo(p1.x,p1.y);cx.lineTo(q1.x,q1.y);cx.lineTo(q0.x,q0.y);cx.closePath();cx.fill()};
 poly(-.66,.66,"#1a0d36");
 poly(-.62,-.5,"#241046");poly(.5,.62,"#241046");
 const wg=cx.createLinearGradient(0,b.y,0,a.y);wg.addColorStop(0,"#e8b06a");wg.addColorStop(1,"#c98a45");
 poly(-.5,.5,wg);
 // boards
 cx.strokeStyle="#00000018";cx.lineWidth=1;for(let i=-4;i<=4;i++){const p=proj(i/8,-.2),q=proj(i/8,L+.35);cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}
 // arrows
 cx.fillStyle="#a2501a88";for(let i=-3;i<=3;i++){const p=proj(i*.1,.9+Math.abs(i)*.06),w=7*p.s*Lay.W0/300*1.6;cx.beginPath();cx.moveTo(p.x,p.y-w*1.6);cx.lineTo(p.x-w,p.y+w*.6);cx.lineTo(p.x+w,p.y+w*.6);cx.closePath();cx.fill()}
 // foul line
 const f0=proj(-.5,0),f1=proj(.5,0);cx.strokeStyle="#ff4d6d";cx.lineWidth=3;cx.beginPath();cx.moveTo(f0.x,f0.y);cx.lineTo(f1.x,f1.y);cx.stroke();
 // pit
 const p0=proj(-.62,L+.12),p1=proj(.62,L+.12),q0=proj(-.62,L+.35),q1=proj(.62,L+.35);cx.fillStyle="#08031a";cx.beginPath();cx.moveTo(p0.x,p0.y);cx.lineTo(p1.x,p1.y);cx.lineTo(q1.x,q1.y);cx.lineTo(q0.x,q0.y);cx.closePath();cx.fill();
 // bumpers (easy)
 if(diff==="easy"){for(const sg of[-1,1]){const p=proj(sg*.5,-.2),q=proj(sg*.5,L+.35),h=14;
  cx.strokeStyle=sg<0?"#ff5d8f":"#4dc3ff";cx.lineWidth=Math.max(4,10*p.s*Lay.W0/300);cx.lineCap="round";cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
 else{cx.strokeStyle="#ffffff30";cx.lineWidth=2;for(const sg of[-1,1]){const p=proj(sg*.5,-.2),q=proj(sg*.5,L+.35);cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
}
function drawGuide(){
 const a=G.aim,vy=3,vx0=vy*Math.tan(a.ang),ax=a.spin*.5;cx.fillStyle="#ffe14d";
 for(let y=.2;y<L*.93;y+=.17){const tm=y/vy,x=a.x+vx0*tm+.5*ax*tm*tm;if(Math.abs(x)>.5)break;const p=proj(x,y);cx.globalAlpha=.95-y/L*.5;cx.beginPath();cx.arc(p.x,p.y,Math.max(2,4.5*p.s),0,7);cx.fill()}
 cx.globalAlpha=1}
const PINC=["#fff3e0","#ffc067","#d9dde5","#4a4a60","#ffd6e0"];
function drawPin(p){
 const q=proj(p.x,p.y),U=Lay.W0*q.s,fade=G.phase==="sweep"&&!p.up?G.sweepA:1;
 if(fade<=0)return;
 const col=PINC[p.id%5],h=.33*U,w=.145*U,rot=p.ang||0,z=(p.z||0)*U*.25;
 cx.save();cx.globalAlpha=fade;
 cx.fillStyle="#0004";cx.beginPath();cx.ellipse(q.x,q.y+1,w*.8,w*.28,0,0,7);cx.fill();
 cx.translate(q.x,q.y-z);cx.rotate(rot);
 // body
 cx.fillStyle=col;cx.strokeStyle="#00000055";cx.lineWidth=Math.max(1,U*.008);
 cx.beginPath();cx.moveTo(-w*.5,0);cx.quadraticCurveTo(-w*.62,-h*.35,-w*.28,-h*.62);cx.lineTo(w*.28,-h*.62);cx.quadraticCurveTo(w*.62,-h*.35,w*.5,0);cx.closePath();cx.fill();cx.stroke();
 // head
 const hr=w*.46,hy=-h*.8;
 cx.beginPath();cx.moveTo(-hr*.95,hy-hr*.4);cx.lineTo(-hr*.75,hy-hr*1.5);cx.lineTo(-hr*.1,hy-hr*.85);cx.closePath();cx.fill();cx.stroke();
 cx.beginPath();cx.moveTo(hr*.95,hy-hr*.4);cx.lineTo(hr*.75,hy-hr*1.5);cx.lineTo(hr*.1,hy-hr*.85);cx.closePath();cx.fill();cx.stroke();
 cx.beginPath();cx.arc(0,hy,hr,0,7);cx.fill();cx.stroke();
 // collar
 cx.fillStyle="#e23b3b";cx.fillRect(-w*.3,-h*.66,w*.6,h*.07);
 // face
 const ex=hr*.38,ey=hy-hr*.05;
 if(p.up){cx.fillStyle="#222";cx.beginPath();cx.arc(-ex,ey,hr*.15,0,7);cx.arc(ex,ey,hr*.15,0,7);cx.fill()}
 else{cx.strokeStyle="#222";cx.lineWidth=Math.max(1,hr*.12);cx.beginPath();for(const s of[-1,1]){cx.moveTo(s*ex-hr*.14,ey-hr*.14);cx.lineTo(s*ex+hr*.14,ey+hr*.14);cx.moveTo(s*ex+hr*.14,ey-hr*.14);cx.lineTo(s*ex-hr*.14,ey+hr*.14)}cx.stroke()}
 cx.fillStyle="#ff6f91";cx.beginPath();cx.moveTo(-hr*.12,hy+hr*.18);cx.lineTo(hr*.12,hy+hr*.18);cx.lineTo(0,hy+hr*.32);cx.fill();
 if(!p.up){cx.fillStyle="#7a1f2b";cx.beginPath();cx.ellipse(0,hy+hr*.52,hr*.16,hr*.2,0,0,7);cx.fill()}
 cx.restore()}
function drawBall(b,rb){
 const q=proj(b.x,Math.max(0,b.y)),U=Lay.W0*q.s,r=Math.max(5,rb*U),yy=q.y-r*(b.gut?-.1:.95);
 cx.save();cx.fillStyle="#0005";cx.beginPath();cx.ellipse(q.x+r*.15,q.y,r*.95,r*.3,0,0,7);cx.fill();
 cx.translate(q.x,yy);
 const gr=cx.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r);gr.addColorStop(0,b.gut?"#a05a85":"#ff9ec7");gr.addColorStop(1,b.gut?"#4a1f40":"#c2306f");cx.fillStyle=gr;cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();
 cx.rotate(b.roll*2.2);cx.fillStyle="#6a1740";cx.beginPath();cx.ellipse(0,r*.15,r*.3,r*.24,0,0,7);cx.fill();
 for(const [dx,dy] of[[-.42,-.22],[-.15,-.5],[.15,-.5],[.42,-.22]]){cx.beginPath();cx.ellipse(r*dx,r*dy,r*.12,r*.15,0,0,7);cx.fill()}
 cx.restore()}
function kittenPose(dt){return G.react.t>0?G.react.k:"idle"}
function drawKitten(dt){
 const p=cur(),pal=p.col,k=kittenPose(),tt=G.time;
 const sz=Math.min(54,(H-Lay.yB)*.6),bx=(G.aim.x||0)>0?sz*.9:W-sz*.9;
 let bx2=bx,by=Lay.yB+sz*.9+6;
 if(k==="dance")bx2+=Math.sin(tt*9)*sz*.5;
 cx.save();cx.translate(bx2,by);
 if(k==="dance")cx.rotate(Math.sin(tt*9)*.25);
 let bob=k==="cheer"||k==="dance"?-Math.abs(Math.sin(tt*10))*sz*.35:0;cx.translate(0,bob);
 const r=sz*.5;
 // body & shirt
 cx.fillStyle=pal.shirt;cx.beginPath();cx.ellipse(0,r*1.15,r*.85,r*.8,0,0,7);cx.fill();
 // arms
 cx.strokeStyle=pal.fur;cx.lineWidth=r*.38;cx.lineCap="round";
 if(k==="cheer"||k==="dance"){cx.beginPath();cx.moveTo(-r*.7,r*.8);cx.lineTo(-r*1.2,-r*.7+Math.sin(tt*14)*r*.15);cx.moveTo(r*.7,r*.8);cx.lineTo(r*1.2,-r*.7-Math.sin(tt*14)*r*.15);cx.stroke()}
 else if(k==="sad"){cx.beginPath();cx.moveTo(-r*.7,r*.8);cx.lineTo(-r*.5,r*.1);cx.stroke()}
 else{cx.beginPath();cx.moveTo(-r*.7,r*.8);cx.lineTo(-r*.5,r*1.5);cx.moveTo(r*.7,r*.8);cx.lineTo(r*.5,r*1.5);cx.stroke()}
 // ears
 cx.fillStyle=pal.fur;cx.strokeStyle=pal.dk;cx.lineWidth=2.5;cx.lineJoin="round";
 cx.beginPath();cx.moveTo(-r*.95,-r*.2);cx.lineTo(-r*.7,-r*1.35);cx.lineTo(-r*.05,-r*.8);cx.closePath();cx.fill();cx.stroke();
 cx.beginPath();cx.moveTo(r*.95,-r*.2);cx.lineTo(r*.7,-r*1.35);cx.lineTo(r*.05,-r*.8);cx.closePath();cx.fill();cx.stroke();
 cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();cx.stroke();
 // face
 const blink=(tt%3.2)<.12;
 cx.fillStyle="#222";cx.strokeStyle="#222";cx.lineWidth=2.5;
 if(k==="cheer"||k==="dance"){for(const s of[-1,1]){cx.beginPath();cx.arc(s*r*.38,-r*.05,r*.17,Math.PI,0);cx.stroke()}}
 else if(k==="sad"){for(const s of[-1,1]){cx.beginPath();cx.moveTo(s*r*.38-r*.15,-r*.12);cx.lineTo(s*r*.38+r*.15,r*.04);cx.moveTo(s*r*.38+r*.15,-r*.12);cx.lineTo(s*r*.38-r*.15,r*.04);cx.stroke()}}
 else if(blink){for(const s of[-1,1]){cx.beginPath();cx.moveTo(s*r*.38-r*.15,-r*.05);cx.lineTo(s*r*.38+r*.15,-r*.05);cx.stroke()}}
 else{cx.fillStyle="#fff";for(const s of[-1,1]){cx.beginPath();cx.ellipse(s*r*.38,-r*.05,r*.17,r*.23,0,0,7);cx.fill()}cx.fillStyle="#222";for(const s of[-1,1]){cx.beginPath();cx.ellipse(s*r*.38+r*.03,-r*.03,r*.09,r*.15,0,0,7);cx.fill()}}
 cx.fillStyle="#ff6f91";cx.beginPath();cx.moveTo(-r*.1,r*.2);cx.lineTo(r*.1,r*.2);cx.lineTo(0,r*.32);cx.fill();
 cx.strokeStyle="#222";cx.lineWidth=2;cx.beginPath();
 if(k==="cheer"||k==="dance"){cx.fillStyle="#7a1f2b";cx.arc(0,r*.42,r*.2,0,Math.PI);cx.fill()}
 else if(k==="sad"){cx.arc(0,r*.62,r*.18,Math.PI,0);cx.stroke()}
 else{cx.moveTo(0,r*.32);cx.quadraticCurveTo(-r*.1,r*.5,-r*.25,r*.4);cx.moveTo(0,r*.32);cx.quadraticCurveTo(r*.1,r*.5,r*.25,r*.4);cx.stroke()}
 if(k==="sad"){cx.fillStyle="#7fd8ff";cx.beginPath();cx.ellipse(r*.95,-r*.1+((tt*40)%14),r*.08,r*.14,0,0,7);cx.fill();cx.fillStyle=pal.fur;cx.strokeStyle=pal.dk;cx.lineWidth=2;cx.beginPath();cx.ellipse(-r*.45,-r*.05,r*.3,r*.22,.3,0,7);cx.fill();cx.stroke()}
 cx.restore();
}
/* ================= test hooks ================= */
window.__bw={scoreGame,simRoll,PIN0,get G(){return G},forceRoll(k){if(!G)return;G.P=null;finishRoll(k);G.phase="result";advance();},setDiff(d){diff=d}};
/* ================= init ================= */
drawMenu();
