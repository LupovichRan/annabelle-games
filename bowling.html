function scoreGame(rolls){
 const frames=[];let i=0,total=0,ok=true;
 for(let f=0;f<10;f++){
  const fr={m:[],cum:null};
  if(f<9){
   const a=rolls[i];
   if(a===undefined){ok=false;frames.push(fr);continue}
   if(a===10){fr.m=["X"];const b1=rolls[i+1],b2=rolls[i+2];if(b1!==undefined&&b2!==undefined&&ok){total+=10+b1+b2;fr.cum=total}else ok=false;i+=1}
   else{fr.m=[a];const b=rolls[i+1];
    if(b===undefined)ok=false;
    else{fr.m.push(a+b===10?"/":b);
     if(a+b===10){const c=rolls[i+2];if(c!==undefined&&ok){total+=10+c;fr.cum=total}else ok=false}
     else if(ok){total+=a+b;fr.cum=total}}
    i+=2}
  }else{
   const a=rolls[i],b=rolls[i+1],c=rolls[i+2];
   if(a!==undefined)fr.m.push(a===10?"X":a);
   if(b!==undefined)fr.m.push(a===10?(b===10?"X":b):(a+b===10?"/":b));
   if(c!==undefined)fr.m.push(c===10?"X":(a===10&&b!==10&&b+c===10)?"/":c);
   const need=(a!==undefined&&b!==undefined&&(a===10||a+b>=10))?3:2;
   const have=[a,b,c].filter(x=>x!==undefined).length;
   if(have>=need&&ok){total+=(a||0)+(b||0)+(c||0);fr.cum=total}else ok=false;
  }
  frames.push(fr)}
 return{frames,total:frames.reduce((m,f)=>f.cum!=null?f.cum:m,0)};
}

function update(dt){
 G.time+=dt;
 if(G.react.t>0)G.react.t-=dt;
 for(const c of G.conf){c.vy+=420*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;c.life-=dt}G.conf=G.conf.filter(c=>c.life>0&&c.y<H+20);

   if(G.aiT>1.9){G.meter.v=pl.power;throwBall(pl.power)}ui()}
  else if(myTurn()){

   if(mv){G.manualX=true;G.aim.x=Math.max(-m,Math.min(m,G.aim.x+mv*.45*dt))}
   let av=0;if(keys.KeyQ)av-=1;if(keys.KeyE)av+=1;if(av){G.aim.ang=Math.max(-.25,Math.min(.25,G.aim.ang+av*.25*dt));$("ang").value=G.aim.ang/.25*100}}
 }else if(G.phase==="pos"&&myTurn()){
  const sp=(diff==="easy"?.85:diff==="expert"?1.7:1.25)*spdMul();G.pos.v+=G.pos.dir*sp*dt;if(G.pos.v>=1){G.pos.v=1;G.pos.dir=-1}else if(G.pos.v<=0){G.pos.v=0;G.pos.dir=1}

 else if(G.phase==="meter"&&myTurn()){
  const sp=(diff==="easy"?1.15:diff==="expert"?2.1:1.6)*spdMul();G.meter.v+=G.meter.dir*sp*dt;if(G.meter.v>=1){G.meter.v=1;G.meter.dir=-1}else if(G.meter.v<=0){G.meter.v=0;G.meter.dir=1}

 else if(G.phase==="roll"){
  const P=G.P;G.acc=(G.acc||0)+dt;let guard=0;while(G.acc>=1/120&&guard++<20){stepRoll(P,1/120);G.acc-=1/120}

  P.ev.length=0;

   if(G.online&&G.guest){if(G.pendRes)applyRes();else if(G.pendSync){G.phase="wait2";applySync()}else{G.phase="wait2"}}

 else{cx.moveTo(0,r*.32);cx.quadraticCurveTo(-r*.1,r*.5,-r*.25,r*.4);cx.moveTo(0,r*.32);cx.quadraticCurveTo(r*.1,r*.5,r*.25,r*.4);cx.stroke()}
 if(k==="sad"){cx.fillStyle="#7fd8ff";cx.beginPath();cx.ellipse(r*.95,-r*.1+((tt*40)%14),r*.08,r*.14,0,0,7);cx.fill();cx.fillStyle=pal.fur;cx.strokeStyle=pal.dk;cx.lineWidth=2;cx.beginPath();cx.ellipse(-r*.45,-r*.05,r*.3,r*.22,.3,0,7);cx.fill();cx.stroke()}
 cx.restore();
}
/* ================= online 1-vs-1: the shared module net1v1.js does the connection (room code + secret link, host approval, HMAC reconnect, lobby);
   this page only keeps its own game messages. The host runs the rules; the guest sends its throw and plays the same (seeded) roll. ================= */
const TXO={"he": {"shareTxt": "בואו לשחק איתי באולינג חתולים! 🎳🐱", "friendN": kidG("[[חברה|חבר|חברים]] 🐾"), "theirTurn": kidG("התור של [[החברה|החבר|החברים]]… ⏳"), "yourTurn": "התור שלך! 🎳", "online": "🌐 אונליין"}, "fr": {"shareTxt": "Viens jouer au Bowling des Chats avec moi ! 🎳🐱", "friendN": "Ami(e) 🐾", "theirTurn": "Au tour de ton ami… ⏳", "yourTurn": "C'est ton tour ! 🎳", "online": "🌐 En ligne"}, "en": {"shareTxt": "Come bowl with me in Bowling Cats! 🎳🐱", "friendN": "Friend 🐾", "theirTurn": "Friend's turn… ⏳", "yourTurn": "Your turn! 🎳", "online": "🌐 Online"}};
// --- validation: every number / array from the network is checked and rebuilt, never used as-is ---
const int=(x,lo,hi)=>Number.isInteger(x)&&x>=lo&&x<=hi;
const num=(x,lo,hi)=>typeof x==="number"&&x>=lo&&x<=hi;          // NaN and Infinity fail
const cleanCfg=d=>d&&typeof d==="object"&&(d.df==="easy"||d.df==="normal")?{df:d.df}:null;
const idList=(a,max)=>{if(!Array.isArray(a)||a.length>max)return null;const o=[],seen=new Set();for(const x of a){if(!int(x,1,10)||seen.has(x))return null;seen.add(x);o.push(x)}return o};
function cleanSync(d){
 if(!int(d.n,1,1e4)||!int(d.c,0,1)||!int(d.o,0,1)||!Array.isArray(d.pl)||d.pl.length!==2)return null;
 const st=idList(d.st,10);if(!st)return null;const pl=[];
 for(const q of d.pl){if(!q||typeof q!=="object"||!Array.isArray(q.r)||q.r.length>21||!Array.isArray(q.b)||q.b.length>3||!int(q.f,0,10)||!int(q.d,0,1))return null;
  for(const x of q.r.concat(q.b))if(!int(x,0,10))return null;pl.push({r:q.r.slice(),b:q.b.slice(),f:q.f,d:q.d})}
 return{n:d.n,cur:d.c,over:d.o,st,pl}}
function cleanGo(d){if(!int(d.n,1,1e4)||!num(d.x,-.45,.45)||!num(d.a,-.26,.26)||![-1,0,1].includes(d.s)||!num(d.p,0,1)||!int(d.sd,0,4294967295))return null;return{n:d.n,x:d.x,a:d.a,s:d.s,p:d.p,sd:d.sd}}
function cleanTh(d){if(!int(d.n,1,1e4)||!num(d.x,-.45,.45)||!num(d.a,-.26,.26)||![-1,0,1].includes(d.s)||!num(d.p,0,1))return null;return{n:d.n,x:d.x,a:d.a,s:d.s,p:d.p}}
// --- match flow ---
var NT=null;
function netSend(o){if(NT)NT.send(o)}
function showLobby(){if(!NT)return;if(diff==="expert")diff="normal";NT.showLobby()}
function resendState(){if(!G||!G.online||G.guest)return;if(G.syncMsg)netSend(G.syncMsg);if(G.goMsg)netSend(G.goMsg);if(G.resMsg)netSend(G.resMsg)}
function sendSync(over){const g=G;g.syncMsg={t:"sync",n:g.tn,c:g.cur,o:over?1:0,st:[...g.standing],pl:g.players.map(p=>({r:p.rolls.slice(),b:p.fr.slice(),f:p.frame,d:p.done?1:0}))};netSend(g.syncMsg)}
function applySync(){
 const s=G.pendSync;if(!s||s.n<=G.tn)return;G.pendSync=null;
 G.players.forEach((p,i)=>{const q=s.pl[i];p.rolls=q.r;p.fr=q.b;p.frame=q.f;p.done=!!q.d});
 G.standing=new Set(s.st);G.cur=s.cur;G.tn=s.n;G.goN=0;G.resN=0;G.pendRes=null;G.P=null;
 if(s.over)endGame();else beginTurn()}
function applyRes(){const r=G.pendRes;if(!r)return;G.pendRes=null;G.resN=r.n;
 if(G.P)for(const p of G.P.pins){const dn=r.ids.includes(p.id);if(dn&&p.up){p.up=false;p.ang=p.tgt=1.4}else if(!dn&&!p.up){p.up=true;p.ang=p.tgt=0;p.z=p.vz=0}}   // both screens agree with the host's count
 finishRoll(r.ids);showResult()}
function showLeft(){if(!G)return;G.over=true;G.netp=false;$("pause").classList.remove("show");$("oT").textContent=NT.t("left");$("oS").textContent="👋";$("oB").textContent="";$("againBtn").style.display="none";$("over").classList.add("show")}
function onNetData(d){ // only after net1v1 authenticated the friend; still treated as hostile: types, ranges, whose turn, who is the host
 if(!d||typeof d!=="object"||!G||!G.online||G.over)return;const host=NT.host;
 if(d.t==="sync"&&!host&&G.guest){const s=cleanSync(d);if(s&&s.n>G.tn){G.pendSync=s;if(!["roll","result","sweep"].includes(G.phase))applySync()}}
 else if(d.t==="go"&&!host&&G.guest){const g=cleanGo(d);if(g&&g.n===G.tn&&G.goN!==g.n&&["aim","pos","meter","wait"].includes(G.phase)){G.aim={x:g.x,ang:g.a,spin:g.s};G.seed=g.sd;launch(g.p)}}
 else if(d.t==="res"&&!host&&G.guest){const ids=idList(d.ids,10);if(ids&&int(d.n,1,1e4)&&d.n===G.tn&&G.resN!==d.n){G.pendRes={n:d.n,ids};if(G.phase==="wait2")applyRes()}}
 else if(d.t==="th"&&host&&!G.guest){const g=cleanTh(d);if(!g||g.n!==G.tn||G.cur!==1)return;
  if(G.goN===G.tn){if(G.goMsg)netSend(G.goMsg)}
  else if(G.phase==="aim"){G.aim={x:g.x,ang:g.a,spin:g.s};G.seed=(crypto.getRandomValues(new Uint32Array(1))[0])>>>0;launch(g.p)}}
}
NT=window.Net1v1?Net1v1({pid:"annabelle-bowling-",shareTxt:{he:TXO.he.shareTxt,fr:TXO.fr.shareTxt,en:TXO.en.shareTxt},
 sfx:{join:()=>SFX.join(),click:()=>SFX.click(),drop:()=>SFX.drop(),back:()=>SFX.back(),huh:()=>SFX.huh()},
 hideMenu(){$("menu").classList.remove("show")},showMenu(){toMenu()},onLink(){mode="online"},
 makeStart(){return {df:diff}},cleanStart:cleanCfg,
 onHostStart(){$("over").classList.remove("show");mode="online";startGame(true,0)},
 onGuestStart(c){diff=c.df;$("over").classList.remove("show");mode="online";startGame(true,1)},
 onResume(){resendState()},   // host: the friend is back - the last sync / throw / result again (each carries its turn number, so a repeat changes nothing)
 onData:onNetData,onLeft:showLeft,
 onPause(on){if(G)G.netp=!!on;if(!on)last=performance.now()}}):null;

window.__bw={scoreGame,simRoll,PIN0,setMode(m){mode=m},rushScore,get G(){return G},get NET(){return NT&&NT.NET},get NT(){return NT},startGame,forceRoll(k){if(!G)return;G.P=null;finishRoll([...G.standing].slice(0,k));G.phase="result";advance();},setDiff(d){diff=d}};
