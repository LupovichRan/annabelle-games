   if(b!==undefined)fr.m.push(a===10?(b===10?"X":b):(a+b===10?"/":b));
   if(c!==undefined)fr.m.push(c===10?"X":(a===10&&b!==10&&b+c===10)?"/":c);

// --- what comes from the network is checked and rebuilt, never used as-is ---
const cleanCfg=d=>d&&typeof d==="object"&&(d.df==="easy"||d.df==="normal")?{df:d.df}:null;
const idList=(a,max)=>{if(!Array.isArray(a)||a.length>max)return null;const o=[],seen=new Set();for(const x of a){if(!int(x,1,10)||seen.has(x))return null;seen.add(x);o.push(x)}return o};
function cleanSync(d){
 if(!int(d.n,1,1e4)||!int(d.c,0,1)||!int(d.o,0,1)||!Array.isArray(d.pl)||d.pl.length!==2)return null;
 const st=idList(d.st,10);if(!st)return null;const pl=[];
 for(const q of d.pl){if(!q||typeof q!=="object"||!Array.isArray(q.r)||q.r.length>21||!Array.isArray(q.b)||q.b.length>3||!int(q.f,0,10)||!int(q.d,0,1))return null;
  for(const x of q.r.concat(q.b))if(!int(x,0,10))return null;pl.push({r:q.r.slice(),b:q.b.slice(),f:q.f,d:q.d})}
 return{n:d.n,cur:d.c,over:d.o,st,pl}}
function cleanGo(d){if(!int(d.n,1,1e4)||!num(d.x,-.45,.45)||!num(d.a,-.26,.26)||![-1,0,1].includes(d.s)||!num(d.p,0,1)||!int(d.sd,0,4294967295))return null;return{n:d.n,x:d.x,a:d.a,s:d.s,p:d.p,sd:d.sd}}
function cleanTh(d){if(!int(d.n,1,1e4)||!num(d.x,-.45,.45)||!num(d.a,-.26,.26)||![-1,0,1].includes(d.s)||!num(d.p,0,1))return null;return{n:d.n,x:d.x,a:d.a,s:d.s,p:d.p}}
// --- match flow: the host runs the rules; the guest only sends its throw and plays the same (seeded) roll ---
const startMsg=r=>({t:"start",k:NET.key,df:diff,r});
function startOnlineHost(){stopCd();NET.waitCode=null;SFX.join();if(!NET.key)NET.key=rnd(16);hideLob();$("over").classList.remove("show");mode="online";startGame(true,0);netSend(startMsg(0))}
function hostResume(){weakHide();setPaused(false);netSend(startMsg(1));resendState()}
function resendState(){if(!G||!G.online||G.guest)return;if(G.syncMsg)netSend(G.syncMsg);if(G.goMsg)netSend(G.goMsg);if(G.resMsg)netSend(G.resMsg)}
function maybeRematch(){if(NET.host&&NET.myRe&&NET.oppRe&&NET.conn){NET.myRe=NET.oppRe=false;startOnlineHost()}}
function sendSync(over){const g=G;g.syncMsg={t:"sync",n:g.tn,c:g.cur,o:over?1:0,st:[...g.standing],pl:g.players.map(p=>({r:p.rolls.slice(),b:p.fr.slice(),f:p.frame,d:p.done?1:0}))};netSend(g.syncMsg)}
function applySync(){
 const s=G.pendSync;if(!s||s.n<=G.tn)return;G.pendSync=null;
 G.players.forEach((p,i)=>{const q=s.pl[i];p.rolls=q.r;p.fr=q.b;p.frame=q.f;p.done=!!q.d});
 G.standing=new Set(s.st);G.cur=s.cur;G.tn=s.n;G.goN=0;G.resN=0;G.pendRes=null;G.P=null;
 if(s.over)endGame();else beginTurn()}
function applyRes(){const r=G.pendRes;if(!r)return;G.pendRes=null;G.resN=r.n;
 if(G.P)for(const p of G.P.pins){const dn=r.ids.includes(p.id);if(dn&&p.up){p.up=false;p.ang=p.tgt=1.4}else if(!dn&&!p.up){p.up=true;p.ang=p.tgt=0;p.z=p.vz=0}}   // both screens agree with the host's count
 finishRoll(r.ids);showResult()}
function showLeft(){if(!G)return;G.over=true;setPaused(false);$("pause").classList.remove("show");$("oT").textContent=t("left");$("oS").textContent="👋";$("oB").textContent="";$("againBtn").style.display="none";$("over").classList.add("show")}
function onNetData(d){
 if(!d||typeof d!=="object")return;
 if(d.t==="start"&&!NET.host){
  const c=cleanCfg(d);if(!c||d.k!==NET.key)return;
  if(d.r===1&&G&&G.guest&&!G.over){weakHide();setPaused(false)}
  else{SFX.join();setPaused(false);diff=c.df;hideLob();$("over").classList.remove("show");mode="online";startGame(true,1)}}
 else if(d.t==="sync"&&!NET.host&&G&&G.guest&&!G.over){const s=cleanSync(d);if(s&&s.n>G.tn){G.pendSync=s;if(!["roll","result","sweep"].includes(G.phase))applySync()}}
 else if(d.t==="go"&&!NET.host&&G&&G.guest&&!G.over){const g=cleanGo(d);if(g&&g.n===G.tn&&G.goN!==g.n&&["aim","pos","meter","wait"].includes(G.phase)){G.aim={x:g.x,ang:g.a,spin:g.s};G.seed=g.sd;launch(g.p)}}
 else if(d.t==="res"&&!NET.host&&G&&G.guest&&!G.over){const ids=idList(d.ids,10);if(ids&&int(d.n,1,1e4)&&d.n===G.tn&&G.resN!==d.n){G.pendRes={n:d.n,ids};if(G.phase==="wait2")applyRes()}}
 else if(d.t==="th"&&NET.host&&G&&G.online&&!G.guest&&!G.over){const g=cleanTh(d);if(!g||g.n!==G.tn||G.cur!==1)return;
  if(G.goN===G.tn){if(G.goMsg)netSend(G.goMsg)}
  else if(G.phase==="aim"){G.aim={x:g.x,ang:g.a,spin:g.s};G.seed=(crypto.getRandomValues(new Uint32Array(1))[0])>>>0;launch(g.p)}}
 else if(d.t==="rematch"&&G&&G.online&&G.over){SFX.click();NET.oppRe=true;maybeRematch()}
 else if(d.t==="bye"){const had=G&&G.online;if(had)SFX.drop();netClose();setPaused(false);if(had)showLeft();else lobFail()}
}
// --- connection trouble: forgiving tiers. 0-4 s quiet: nothing visible. 4-20 s: "weak connection" pill, the match keeps running (host: the friend's kitten keeps its last input, then stops; guest: last snapshot is extrapolated a little).
//     20 s+: hard pause with a Leave button. Meanwhile we reconnect quietly; any valid data / a re-authenticated connection clears everything at once.
function onNetClose(){ // the connection itself is gone (closed / ICE failed): reconnect quietly; the clock decides when it becomes a hard pause
 if(!G||!G.online){if(NET.conn||NET.peer)lobFail();return}
 const c=NET.conn;NET.conn=null;try{c&&c.close()}catch(e){}
 if(G.over){netClose();showLeft();return}
 startRecover();
}
function startRecover(){if(!G||!G.online||G.over)return;NET.rec=true;if(NET.host)hostLoop();else guestLoop()}
function hardLost(){setPaused(true);weakHide(true);if(NET.conn)onNetClose();else if(!NET.rec)startRecover()}
function netResume(){ // data is flowing again after a hard pause that never closed the connection
 if(!NET.paused)return;setPaused(false);NET.rec=false;weakHide(true);
 if(!G.guest)resendState()
}
function weakLine(){const L=t("weakL");NET.wi=(NET.wi+1+Math.random()*(L.length-1)|0)%L.length;const e=$("weak"),r=cv.getBoundingClientRect();e.textContent=L[NET.wi];
 if(r.width>0){e.style.top=(r.top+r.height*.075)+"px";e.style.left=(r.left+r.width/2)+"px"}e.style.maxWidth=Math.max(160,(r.width||innerWidth)-16)+"px"}
function weakSet(on){if(!G||on===!!G.weak)return;G.weak=on;if(on){weakLine();$("weak").classList.add("on");clearInterval(NET.wt);NET.wt=setInterval(weakLine,3500);SFX.huh()}else weakHide()}
function weakHide(keepFlag){clearInterval(NET.wt);NET.wt=null;$("weak").classList.remove("on");if(G)G.weak=false}
function guestLoop(){
 clearTimeout(NET.rt);if(!NET.rec||NET.host||!G||!G.online)return;const gen=NET.gen;
 function tryConnect(){if(gen!==NET.gen||!NET.rec||!NET.peer)return;if(NET.conn&&NET.conn.open)return;
  if(NET.conn){const o=NET.conn;NET.conn=null;try{o.close()}catch(e){}}
  try{attach(NET.peer.connect(PID+NET.code,{reliable:true}),gen)}catch(e){}}
 function go(){if(gen!==NET.gen||!NET.rec)return;const p=NET.peer;
  if(!p||p.destroyed||p.disconnected||!p.open){
   try{p&&p.destroy()}catch(e){}
   loadPeer().then(()=>{if(gen!==NET.gen||!NET.rec)return;const np=new Peer(undefined,PEER_CFG);NET.peer=np;
    np.on("open",()=>{if(gen===NET.gen&&NET.rec)tryConnect()});np.on("error",()=>{})}).catch(()=>{});
  }else tryConnect();
  NET.rt=setTimeout(go,4500)}
 go();
}
function hostLoop(){ // keep the room's peer alive so the friend can come back with the secret
 clearTimeout(NET.rt);if(!NET.rec||!NET.host||!G||!G.online)return;const gen=NET.gen;
 (function go(){if(gen!==NET.gen||!NET.rec)return;const p=NET.peer;
  if(!p||p.destroyed){loadPeer().then(()=>{if(gen===NET.gen&&NET.rec&&(!NET.peer||NET.peer.destroyed))hostPeer(NET.code,gen,true)}).catch(()=>{})}
  else if(p.disconnected){try{p.reconnect()}catch(e){}}
  NET.rt=setTimeout(go,4500)})();
}
function netKick(){ // phone woke up / network is back: retry right away
 if(NET.waitCode&&!(G&&G.online)){hostRecover();return}
 if(!G||!G.online)return;
 if(NET.rec){if(NET.host){const p=NET.peer;if(p&&p.disconnected&&!p.destroyed)try{p.reconnect()}catch(e){}}else guestLoop()}
 else netSend({t:"ping"});
}
function netQ(){ // connection quality dot: green = data flowing, amber = quiet for a few seconds, red = hard pause
 const d=$("netDot");if(!d)return;if(!G||!G.online){d.style.display="none";return}
 const a=NET.paused?9e9:Date.now()-NET.last;d.style.display="";d.style.background=a<SOFT?"#2fb36a":a<HARD?"#f2c94c":"#e23b3b";d.title=a<SOFT?"🟢":a<HARD?"🟡":"🔴"}
let hbN=0;
setInterval(()=>{const now=Date.now();
 if(NET.tickAt&&now-NET.tickAt>3000)NET.last=now;                   // OUR timers were frozen (phone asleep / app in background): that says nothing about the friend
 NET.tickAt=now;netQ();
 if(!G||!G.online){weakHide();return}
 if(++hbN%4===0)netSend({t:"ping"});
 if(document.hidden||G.over)return;
 const q=now-NET.last;
 if(NET.paused){if(NET.conn&&NET.conn.open&&q<2500)netResume();return}
 if(q>HARD)hardLost();else weakSet(q>SOFT);
},500);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){NET.last=Date.now();NET.tickAt=Date.now();netKick()}});addEventListener("online",netKick);addEventListener("pageshow",netKick);addEventListener("focus",netKick);

$("lobIn").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,6)});

{const U=new URLSearchParams(location.search),q=U.get("room")||"",sc=/^[0-9a-f]{32}$/.test(U.get("s")||"")?U.get("s"):null;
 if(q||U.has("s"))try{history.replaceState(null,"",location.pathname)}catch(e){}
 if(/^\d{6}$/.test(q))setTimeout(()=>{mode="online";showLob();lobPane("none");joinRoom(q,sc)},0)}
