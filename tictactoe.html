.big{min-width:200px;min-height:64px;border-radius:22px;font:900 25px Rubik,Arial;padding:8px 24px;box-shadow:0 6px 0 #0005;color:#fff;width:100%}

.mt:not(.sel){filter:saturate(.7) brightness(.88)}
.desc{font-size:15px;font-weight:700;line-height:1.3;text-shadow:0 2px 0 #000a;min-height:40px;max-width:420px}

function doPause(on){if(phase==="menu"||phase==="over")return;paused=on;$("pause").classList.toggle("show",on)}
/* ============ confetti (2D overlay) ============ */
const cf=$("conf"),cx=cf.getContext("2d");let P=[],cfRun=false;
function confetti(){const w=cf.width=innerWidth,h=cf.height=innerHeight;P=[];const cols=["#ff5d73","#ffd23f","#5fd38d","#4aa8ff","#b07cff","#ff9f43"];for(let i=0;i<140;i++)P.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.45,vx:(Math.random()-.5)*14,vy:-6-Math.random()*10,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6]});if(!cfRun){cfRun=true;requestAnimationFrame(cfStep)}}
function cfStep(){cx.clearRect(0,0,cf.width,cf.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});P=P.filter(p=>p.y<cf.height+20);if(P.length)requestAnimationFrame(cfStep);else{cfRun=false;cx.clearRect(0,0,cf.width,cf.height)}}

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
function tileAt(e){ptr.set(e.clientX/vw*2-1,-(e.clientY/vh)*2+1);ray.setFromCamera(ptr,cam);const hit=ray.intersectObjects(tiles.slice(0,N*N).map(x=>x.hit),false)[0];return hit?hit.object.userData.tile:-1}
function humanTurn(){return phase==="play"&&!paused&&!cpuIs(turn)}
function tileClick(i){if(!humanTurn()||busy>0)return false;if(tg){resolveTarget(i);return true}return place(i,false)}

cvEl.addEventListener("pointermove",e=>{if(e.pointerType==="touch"||!humanTurn())return;const i=tileAt(e);if(i>=0&&i!==sel){sel=i;selKb=false;if(board[i]===null)SFX.hover()}else if(i<0)sel=-1});
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||(window.AnnabelleDesk&&AnnabelleDesk.typing(e)))return;
 if(e.code==="KeyM"){muted=!muted;ls.set("annabelle-muted",muted?"1":"0");updMute();return}
 if(e.code==="Escape"||e.code==="KeyP"){e.preventDefault();if(phase==="menu")return;if(phase==="over"){toMenu();return}if(tg){cancelTarget();return}doPause(!paused);return}
 const btn=e.target&&e.target.closest&&e.target.closest("button");
 if(phase==="menu"){if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();cfg.start="me";startMatch()}return}
 if(phase==="over"){if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();$("againBtn").click()}return}
 if(!humanTurn())return;idle=0;if(sleeping){sleeping=false;mood="idle";moodT=0}
 if(N===3&&/^[1-9]$/.test(e.key)){e.preventDefault();const d=+e.key-1,row=2-Math.floor(d/3),col=d%3;sel=row*3+col;selKb=true;humanPlace(sel);return}
 const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
 if(mv){e.preventDefault();if(sel<0||sel>=N*N)sel=Math.floor(N*N/2);else{let r=Math.floor(sel/N)+mv[1],c=sel%N+mv[0];r=(r+N)%N;c=(c+N)%N;sel=r*N+c}selKb=true;SFX.hover();return}
 if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();if(sel<0||sel>=N*N)sel=Math.floor(N*N/2);humanPlace(sel)}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&phase==="play"&&!paused)doPause(true)});

for(let i=0;i<25;i++){const b=document.createElement("button");b.dataset.i=i;b.setAttribute("aria-label",i+1);b.onclick=()=>{ac();humanPlace(i)};flat.appendChild(b)}
function flatBuild(){flat.style.gridTemplateColumns="repeat("+N+",1fr)";flat.style.gridTemplateRows="repeat("+N+",1fr)";[...flat.children].forEach((b,i)=>b.style.display=i<N*N?"":"none")}
function updFlat(){if(glOK)return;[...flat.children].forEach((b,i)=>{b.textContent=board[i]===0?"🐟":board[i]===1?"🧶":frozen[i]>0?"🐭":"";b.classList.toggle("win",!!(res&&res.line&&res.line.includes(i)))})}

 hist=h?[h[0].slice(),h[1].slice()]:[[],[]];if(!h)for(let i=0;i<b.length;i++)if(b[i]!==null)hist[b[i]].push(i);updFlat()}

 state(){return{phase,turn,board:[...board],scores:[...scores],res:res&&{who:res.who,line:res.line},cfg:{...cfg},busy,paused,mood,sleeping,tris:glOK?R.info.render.triangles:0,calls:glOK?R.info.render.calls:0,glOK,N,K,hist:hist.map(h=>[...h]),frozen:frozen.slice(0,N*N),shielded:shielded.slice(0,N*N),pw:pw.map(o=>({...o})),extra,tg:tg&&{...tg},chaosT,chaosRun:!!chaos,ply,stats:JSON.parse(JSON.stringify(stats)),tilesVisible:tiles.filter(x=>x.g.visible).length,lines:LINES.length,blink:[...(ENDLESS()?hist.filter(h=>h.length>=3).map(h=>h[0]):[])]}},
