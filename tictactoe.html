function humanPlace(i){if(!humanTurn()||busy>0)return;if(place(i,false)){}}
cvEl.addEventListener("pointerdown",e=>{ac();if(phase!=="play"||paused)return;const i=tileAt(e);if(i>=0){e.preventDefault();sel=i;selKb=false;humanPlace(i)}});
cvEl.addEventListener("pointermove",e=>{if(e.pointerType==="touch"||!humanTurn())return;const i=tileAt(e);if(i>=0&&i!==sel){sel=i;selKb=false;if(board[i]===null)SFX.hover()}else if(i<0)sel=-1});
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||(window.AnnabelleDesk&&AnnabelleDesk.typing(e)))return;
 if(e.code==="KeyM"){muted=!muted;ls.set("annabelle-muted",muted?"1":"0");updMute();return}
 if(e.code==="Escape"||e.code==="KeyP"){e.preventDefault();if(phase==="menu")return;if(phase==="over"){toMenu();return}doPause(!paused);return}
 const btn=e.target&&e.target.closest&&e.target.closest("button");
 if(phase==="menu"){if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();startMatch()}return}
 if(phase==="over"){if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();$("againBtn").click()}return}
 if(!humanTurn())return;idle=0;if(sleeping){sleeping=false;mood="idle";moodT=0}
 if(/^[1-9]$/.test(e.key)){e.preventDefault();const d=+e.key-1,row=2-Math.floor(d/3),col=d%3;sel=row*3+col;selKb=true;humanPlace(sel);return}
 const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
 if(mv){e.preventDefault();if(sel<0)sel=4;else{let r=Math.floor(sel/3)+mv[1],c=sel%3+mv[0];r=(r+3)%3;c=(c+3)%3;sel=r*3+c}selKb=true;SFX.hover();return}
 if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();if(sel<0)sel=4;humanPlace(sel)}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&phase==="play"&&!paused)doPause(true)});
/* ============ 2D fallback board ============ */
const flat=$("flat");
for(let i=0;i<9;i++){const b=document.createElement("button");b.dataset.i=i;b.setAttribute("aria-label",i+1);b.onclick=()=>{ac();humanPlace(i)};flat.appendChild(b)}
function updFlat(){if(glOK)return;[...flat.children].forEach((b,i)=>{b.textContent=board[i]===0?"🐟":board[i]===1?"🧶":"";b.classList.toggle("win",!!(res&&res.line&&res.line.includes(i)))})}
/* ============ test hooks ============ */
window.__ttt={step(sec){const n=Math.ceil(sec*30);for(let i=0;i<n;i++)tick(1/30);if(glOK)R.render(scene,cam)},
 state(){return{phase,turn,board:[...board],scores:[...scores],res:res&&{who:res.who,line:res.line},cfg:{...cfg},busy,paused,mood,sleeping,tris:glOK?R.info.render.triangles:0,calls:glOK?R.info.render.calls:0,glOK}},
 play:i=>place(i,false),playAs(i){return place(i,true)},setBlunder(p){blunderOverride=p},cpuPick,start(o){Object.assign(cfg,o||{});startMatch()},toMenu,newRound,showOver,judge,bestMoves,doPause,cap:()=>$("cap").textContent};
updMute();drawTexts();toMenu();
</script>
