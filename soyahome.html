<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><!--pt--><script src="playtime.js" data-app="soyahome"></script><!--/pt-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd6b8">
<title>סויה בבית</title><script src="safe.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{height:100dvh;font-family:"Rubik","Varela Round",Arial,sans-serif;color:#4a2c6b;background:#fbeee0;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(#ffe2c8,#ffd6b8);box-shadow:0 3px 0 #0001;z-index:20}
.iconbtn{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #0002;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
#score{font-weight:900;font-size:20px;min-width:64px;text-align:center;background:#fff;border-radius:20px;padding:6px 10px;box-shadow:0 3px 0 #0002;flex:none}
#timeWrap{flex:1;min-width:40px;height:14px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 3px #0002}
@media (max-width:400px){#hud{gap:5px;padding-left:6px;padding-right:6px}.iconbtn{width:40px;height:40px;font-size:19px}#hearts{font-size:16px;letter-spacing:0}#score{font-size:17px;min-width:50px;padding:5px 8px}#timeWrap{min-width:28px}}
#timeBar{height:100%;width:0;background:linear-gradient(90deg,#5fd38d,#ffd34d);border-radius:10px}
#hearts{font-size:20px;flex:none;letter-spacing:1px}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none}
#room{position:absolute;inset:0;width:100%;height:100%}
.thing{position:absolute;left:0;top:0;will-change:transform}
#pot,#foot,#soya{pointer-events:auto}
#pot{pointer-events:none}
#cup,#fish,#roll{position:absolute;left:0;top:0;line-height:1;text-align:center;transition:transform .12s linear;filter:drop-shadow(0 3px 2px #0003)}
#cup.fall{transition:transform .45s cubic-bezier(.5,0,1,1)}
#fish,#roll{pointer-events:none}
#cup.warn,#roll.warn,#fish.warn{animation:wob .35s ease-in-out infinite alternate}
@keyframes wob{to{filter:drop-shadow(0 0 8px #ff4d4d)}}
#foot{transition:transform .16s ease-out;cursor:pointer;z-index:2000}
#foot svg,#pot svg,#soya svg{width:100%;height:100%;display:block;overflow:visible}
#foot.bit .footInner{animation:shake .12s 6}
#foot .toes{transform-box:fill-box;transform-origin:50% 100%;animation:toewig 1.6s ease-in-out infinite}
#foot.bit .toes circle.t{fill:#ff8f8f}
@keyframes toewig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
#soya{cursor:grab}
#soya .flip{width:100%;height:100%;transition:none}
#soya.glow svg{filter:drop-shadow(0 0 5px #fff9) drop-shadow(0 0 2px #fff)}
.peb{position:absolute;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;display:flex;align-items:center;justify-content:center;z-index:3000;cursor:pointer;will-change:transform}
.peb .ring{position:absolute;width:40px;height:40px;border-radius:50%;-webkit-mask:radial-gradient(circle,#0000 13px,#000 14px);mask:radial-gradient(circle,#0000 13px,#000 14px)}
.peb svg{width:26px;height:20px;position:relative}
.peb.fly .ring,.peb.back .ring{display:none}
.peb.lost{transition:opacity .5s,transform .5s;opacity:0}
#alert{position:absolute;left:0;top:0;z-index:3500;font-size:30px;pointer-events:none;display:none;animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{from{margin-top:0}to{margin-top:-8px}}
#chewRing{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;z-index:3500;pointer-events:none;display:none;background:#fff;box-shadow:0 2px 6px #0003}
#chewRing::after{content:attr(data-i);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;border-radius:50%;margin:6px}
#dark{position:absolute;inset:0;background:#0d0c1c;opacity:0;pointer-events:none;z-index:4000}
#dark.flick{animation:flick 1.1s linear}
@keyframes flick{0%{opacity:0}10%{opacity:.75}20%{opacity:.1}32%{opacity:.8}45%{opacity:.2}60%{opacity:.7}80%{opacity:.15}100%{opacity:0}}
#stage.shake{animation:shake .1s 4}
.pop{position:absolute;left:0;top:0;z-index:4500;pointer-events:none;font-weight:900;white-space:nowrap;color:#fff;-webkit-text-stroke:1px #4a2c6b;text-shadow:0 3px 0 #4a2c6b;font-size:22px;animation:pop 1.2s ease-out forwards;transform:translate(-50%,-50%)}
.pop.big{font-size:clamp(28px,8vw,44px);color:#ffeb3b;text-shadow:0 4px 0 #c8306f}
@keyframes pop{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:-60px}}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4600;background:#fff;border-radius:18px;padding:8px 14px;font-weight:800;font-size:clamp(15px,4.2vw,20px);box-shadow:0 4px 0 #0002;pointer-events:none;opacity:0;transition:opacity .25s;max-width:92%;text-align:center}
#hint.show{opacity:1}
.ov{position:absolute;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;padding:12px;background:#ffe9a8f0}
.ov.show{display:flex}
#menu{background:linear-gradient(160deg,#ffe9a8,#ffc7d9);flex-direction:column;justify-content:space-evenly;text-align:center;gap:6px;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,var(--sab,env(safe-area-inset-bottom)))}
#langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lang{padding:8px 12px;min-height:44px;border-radius:20px;background:#fff8;font-weight:800;font-size:15px}
.lang.on{background:#fff;box-shadow:0 3px 0 #0002;color:#c8306f}
#menu h1{margin:0;font-size:clamp(32px,10vw,60px);color:#fff;text-shadow:0 4px 0 #ff7a3d,0 7px 0 #0002;line-height:1.05}
#menu .sub{font-weight:800;font-size:clamp(15px,4.3vw,22px);margin:0}
#menuArt{height:clamp(90px,24dvh,230px);display:flex;justify-content:center;align-items:flex-end;gap:0}
#menuArt svg{height:100%;width:auto}
#how{list-style:none;margin:0 auto;padding:0;display:flex;flex-direction:column;gap:5px;max-width:520px;width:100%}
#how li{background:#fff9;border-radius:14px;padding:6px 10px;font-weight:700;font-size:clamp(13px,3.6vw,17px);text-align:start;line-height:1.25}
.big{min-height:56px;padding:12px 26px;border-radius:30px;font-size:clamp(22px,6vw,30px);font-weight:900;color:#fff;box-shadow:0 6px 0 #0003}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.go{background:linear-gradient(#5fd38d,#2fb36a)} .pu{background:linear-gradient(#b48bff,#7c5cff)} .pk{background:linear-gradient(#ff8fb8,#ff4d8d)}
#best{font-weight:800;font-size:16px}
.card{background:#fff;border-radius:28px;padding:20px 22px;box-shadow:0 8px 0 #0002;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;width:min(92vw,420px);max-height:96%;overflow:hidden}
.card h2{margin:0;font-size:clamp(26px,7vw,36px)}
.card p{margin:0;font-weight:700;font-size:clamp(15px,4.2vw,19px)}
.card .emo{font-size:clamp(44px,13vw,70px);line-height:1}
.card .tip{background:#fff3c4;border-radius:14px;padding:8px 12px;font-size:15px}
.card .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#endScore{font-size:clamp(22px,6vw,30px);font-weight:900;color:#c8306f}

/*landscape-fit*/@media (orientation:landscape) and (max-height:500px){.ov{overflow-y:auto;justify-content:safe center;-webkit-overflow-scrolling:touch}}
</style>
<!--pwa--><link rel="manifest" href="manifests/soyahome.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" type="image/png" sizes="192x192" href="icons/soyahome-192.png"><meta name="apple-mobile-web-app-title" content="סויה בבית"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/soyahome-apple-180.png"><script src="pwa.js" data-app="soyahome" data-slots='[["#langs", "after"], ["#pause .card", "append"]]' defer></script><script src="nav.js" data-menuslot="#langs" data-pauseslot="#pause .card" data-relabel="[id$=MenuBtn],#homeBtn" defer></script><!--/pwa-->
</head>
<body>
<div id="app">
 <header id="hud">
  <button class="iconbtn" id="homeBtn" aria-label="home">🏠</button>
  <div id="score">⭐ 0</div>
  <div id="timeWrap"><div id="timeBar"></div></div>
  <div id="hearts">❤️❤️❤️</div>
  <button class="iconbtn" id="pauseBtn" aria-label="pause">⏸️</button>
  <button class="iconbtn" id="muteBtn" aria-label="sound">🔊</button>
 </header>
 <div id="stage">
  <svg id="room" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="thing" id="pot"></div>
  <div class="thing" id="cup">🥛</div><div class="thing" id="fish">🐟</div><div class="thing" id="roll">🧻</div>
  <div class="thing" id="foot"></div>
  <div class="thing" id="soya"><div class="flip"></div></div>
  <div id="alert">❗</div>
  <div id="chewRing" data-i="🔌"></div>
  <div id="dark"></div>
  <div id="hint"></div>
 </div>

 <section class="ov show" id="menu">
  <div id="langs"></div>
  <h1 id="mTitle">סויה בבית</h1>
  <p class="sub" id="mSub"></p>
  <div id="menuArt"></div>
  <ul id="how"></ul>
  <div id="best"></div>
  <div><button class="big go" id="playBtn"></button></div>
 </section>

 <section class="ov" id="pause">
  <div class="card">
   <div class="emo">😺</div>
   <h2 id="pTitle"></h2>
   <div class="btns"><button class="big go" id="resumeBtn"></button></div>
   <div class="btns"><button class="big pu" id="restartBtn"></button><button class="big pk" id="pMenuBtn"></button></div>
  </div>
 </section>

 <section class="ov" id="end">
  <div class="card">
   <div class="emo" id="endEmo">🏆</div>
   <h2 id="endTitle"></h2>
   <p id="endSub"></p>
   <div id="endScore"></div>
   <p id="endBest"></p>
   <p class="tip" id="endTip"></p>
   <div class="btns"><button class="big go" id="againBtn"></button><button class="big pk" id="eMenuBtn"></button></div>
  </div>
 </section>
</div>

<script>
/* ============ Soya: the fluffy black kitten (same drawing as soya.html) ============ */
const CONFIG={fur:'#19151c',furLite:'#3a2f36',outline:'#5b5064',earInner:'#ff9fbf',pads:'#ff9fb4',eye:'#b9e84a',eyeRing:'#6cae1e',pupil:'#07060a',nose:'#2e2129',whisker:'#f6f6f6',blush:'#ff8fb4'};
function fluffE(cx,cy,rx,ry,cls='fur'){ return `<ellipse class="${cls}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/><ellipse class="tuft" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`; }
function tail(d,cls=''){ return `<g class="tailG ${cls}"><path class="tailO" d="${d}"/><path class="tailF" d="${d}"/><path class="tailM" d="${d}"/><path class="tailP" d="${d}"/></g>`; }
function limb(x1,y1,x2,y2,cls=''){ return `<g class="${cls}"><path class="limbO" d="M${x1},${y1} L${x2},${y2}"/><path class="limbM" d="M${x1},${y1} L${x2},${y2}"/></g>`; }
function legR(x,y,h,cls){ return `<g class="${cls}"><rect class="fur" x="${x}" y="${y}" width="14" height="${h}" rx="7"/><ellipse class="fur" cx="${x+7}" cy="${y+h-3}" rx="9.5" ry="6"/></g>`; }
function eye(x){ return `<g class="eo"><ellipse class="iris" cx="${x}" cy="-3" rx="12.5" ry="13.5"/><ellipse class="pupil" cx="${x}" cy="-2" rx="4.6" ry="9.5"/><circle class="shine" cx="${x+4.5}" cy="-8" r="3.6"/><circle class="shine" cx="${x-4}" cy="3" r="1.6"/><path class="lid" d="M${x-14},-4 Q${x},-20 ${x+14},-4 L${x+14},-17 L${x-14},-17Z"/></g>
 <path class="eh" d="M${x-10},0 Q${x},-12 ${x+10},0"/><path class="ec" d="M${x-10},-3 Q${x},6 ${x+10},-3"/>`; }
function headSVG(){ return `<g id="HEAD">
  <g class="acc acc-mane"><circle cx="0" cy="2" r="60" fill="#e9a43c"/><circle cx="0" cy="2" r="60" fill="none" stroke="#c97a22" stroke-width="16" stroke-dasharray="2 11" stroke-linecap="round"/><circle cx="0" cy="2" r="50" fill="#f3bb55"/></g>
  <path class="fur" d="M-40,-10 L-36,-68 L-4,-34Z"/><path class="ear" d="M-32,-20 L-31,-56 L-12,-34Z"/>
  <path class="fur" d="M40,-10 L36,-68 L4,-34Z"/><path class="ear" d="M32,-20 L31,-56 L12,-34Z"/>
  ${fluffE(0,0,46,38)}
  <path class="lite" d="M-46,6 l-8,4 l7,3 l-7,5 l9,1 M46,6 l8,4 l-7,3 l7,5 l-9,1" />
  <ellipse class="blush" cx="-31" cy="14" rx="7" ry="4"/><ellipse class="blush" cx="31" cy="14" rx="7" ry="4"/>
  ${eye(-17)}${eye(17)}
  <path class="nose" d="M-5,9 L5,9 L0,15Z"/>
  <path class="mouth" d="M-8,19 Q-4,24 0,18 Q4,24 8,19"/>
  <ellipse class="mo" cx="0" cy="23" rx="5.5" ry="6.5"/>
  <ellipse class="tg" cx="0" cy="25" rx="4" ry="5"/>
  <g class="wh"><path d="M-22,14 L-60,4 M-22,17 L-62,16 M-22,20 L-58,28 M22,14 L60,4 M22,17 L62,16 M22,20 L58,28"/></g>
  <g class="acc acc-glasses"><rect x="-32" y="-15" width="27" height="22" rx="9" fill="#1d1d2b" stroke="#ff4d8d" stroke-width="3"/><rect x="5" y="-15" width="27" height="22" rx="9" fill="#1d1d2b" stroke="#ff4d8d" stroke-width="3"/><path d="M-5,-6 L5,-6" stroke="#ff4d8d" stroke-width="3"/><path d="M-27,-10 l8,0 M10,-10 l8,0" stroke="#fff8" stroke-width="3" stroke-linecap="round"/></g>
  <g class="acc acc-bow"><path d="M22,-40 L6,-50 L8,-30Z M22,-40 L38,-50 L36,-30Z" fill="#ff5fa2" stroke="#c8306f" stroke-width="2"/><circle cx="22" cy="-40" r="5" fill="#ff8cc0" stroke="#c8306f" stroke-width="2"/></g>
  <g class="acc acc-flower"><g transform="translate(-26,-40)"><circle cx="0" cy="-7" r="6" fill="#fff36b"/><circle cx="7" cy="-2" r="6" fill="#fff36b"/><circle cx="4" cy="6" r="6" fill="#fff36b"/><circle cx="-4" cy="6" r="6" fill="#fff36b"/><circle cx="-7" cy="-2" r="6" fill="#fff36b"/><circle r="5" fill="#ff8a1f"/></g></g>
  <g class="acc acc-party"><path d="M-16,-34 L16,-34 L4,-92Z" fill="#5ac8ff" stroke="#2a6fd0" stroke-width="2"/><path d="M-10,-48 L12,-50 M-6,-64 L9,-66 M-2,-79 L6,-80" stroke="#ffe066" stroke-width="5" stroke-linecap="round"/><circle cx="4" cy="-93" r="7" fill="#ff4d8d"/></g>
  <g class="acc acc-crown"><path d="M-24,-34 L-28,-62 L-13,-48 L0,-70 L13,-48 L28,-62 L24,-34Z" fill="#ffd34d" stroke="#d89a12" stroke-width="2.5" stroke-linejoin="round"/><circle cx="0" cy="-44" r="4.5" fill="#ff4d8d"/><circle cx="-14" cy="-41" r="3" fill="#5ac8ff"/><circle cx="14" cy="-41" r="3" fill="#5fd38d"/></g>
  <g class="acc acc-bell"><path d="M-26,34 Q0,46 26,34" fill="none" stroke="#e8364f" stroke-width="7" stroke-linecap="round"/><circle cx="0" cy="45" r="7.5" fill="#ffd34d" stroke="#c48a0a" stroke-width="2"/><path d="M-3,47 L3,47" stroke="#8a5a00" stroke-width="2"/></g>
</g>`; }
const CAT_STYLE = `.soyaSvg .fur{fill:var(--fur);stroke:var(--outline);stroke-width:1.6;stroke-linejoin:round}
.soyaSvg .tuft{fill:none;stroke:var(--fur);stroke-width:7;stroke-dasharray:.5 6.5;stroke-linecap:round}
.soyaSvg .lite{fill:var(--furLite);stroke:var(--furLite);stroke-width:1.5;stroke-linejoin:round}
.soyaSvg .ear{fill:var(--earInner)}
.soyaSvg .pad{fill:var(--pads)}
.soyaSvg .iris{fill:var(--eye);stroke:var(--eyeRing);stroke-width:1.6}
.soyaSvg .pupil{fill:var(--pupil);transform-box:fill-box;transform-origin:center;transition:transform .2s}
.soyaSvg .shine{fill:#fff}
.soyaSvg .lid{fill:var(--fur);display:none}
.soyaSvg .eh{fill:none;stroke:var(--eye);stroke-width:4.5;stroke-linecap:round;display:none}
.soyaSvg .ec{fill:none;stroke:#a89cb4;stroke-width:3.5;stroke-linecap:round;display:none}
.soyaSvg .blush{fill:var(--blush);opacity:.55}
.soyaSvg .nose{fill:var(--nose);stroke:#8d6f7d;stroke-width:1.4;stroke-linejoin:round}
.soyaSvg .mouth{fill:none;stroke:#a89cb4;stroke-width:2;stroke-linecap:round}
.soyaSvg .mo{fill:#ff7aa0;stroke:#a89cb4;stroke-width:1.5;display:none}
.soyaSvg .tg{fill:#ff8fb0;display:none}
.soyaSvg .wh path{stroke:var(--whisker);stroke-width:1.6;stroke-linecap:round;fill:none}
.soyaSvg .tailO{fill:none;stroke:var(--outline);stroke-width:23;stroke-linecap:round}
.soyaSvg .tailF{fill:none;stroke:var(--fur);stroke-width:31;stroke-linecap:round;stroke-dasharray:1 8}
.soyaSvg .tailM{fill:none;stroke:var(--fur);stroke-width:20;stroke-linecap:round}
.soyaSvg .tailP{fill:none;stroke:var(--furLite);stroke-width:3;stroke-linecap:round;stroke-dasharray:4 14;opacity:.7}
.soyaSvg .limbO{fill:none;stroke:var(--outline);stroke-width:16;stroke-linecap:round}
.soyaSvg .limbM{fill:none;stroke:var(--fur);stroke-width:13;stroke-linecap:round}
.soyaSvg .pose{display:none}
.soyaSvg.p-sit .sit,.soyaSvg.p-eat .sit,.soyaSvg.p-held .sit,.soyaSvg.p-stand .stand,.soyaSvg.p-sleep .sleep,.soyaSvg.p-belly .belly,.soyaSvg.p-lie .lie{display:inline}
.soyaSvg .acc{display:none}
.soyaSvg.w-mane .acc-mane,.soyaSvg.w-glasses .acc-glasses,.soyaSvg.w-bow .acc-bow,.soyaSvg.w-flower .acc-flower,.soyaSvg.w-party .acc-party,.soyaSvg.w-crown .acc-crown,.soyaSvg.w-bell .acc-bell{display:inline}
.soyaSvg.e-happy .eo,.soyaSvg.e-closed .eo,.soyaSvg.blink .eo{display:none}
.soyaSvg.e-happy .eh{display:inline} .soyaSvg.e-closed .ec,.soyaSvg.blink .ec{display:inline}
.soyaSvg.e-happy.blink .eh{display:inline} .soyaSvg.e-happy.blink .ec{display:none}
.soyaSvg.e-wide .pupil{transform:scale(2.1,1.15)}
.soyaSvg.sleepy .lid{display:inline}
.soyaSvg.m-open .mo{display:inline} .soyaSvg.m-open .mouth{display:none}
.soyaSvg.m-tongue .tg{display:inline}
.soyaSvg .tailG{transform-box:fill-box;animation:wag 2.6s ease-in-out infinite}
.soyaSvg .sit .tailG{transform-origin:0% 100%} .soyaSvg .stand .tailG{transform-origin:100% 100%} .soyaSvg .lie .tailG,.soyaSvg .belly .tailG{transform-origin:0% 100%}
.soyaSvg .sleep .tailG{animation-duration:5s}
@keyframes wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
.soyaSvg .legA,.soyaSvg .legB{transform-box:fill-box;transform-origin:50% 0%}
.soyaSvg.walking .legA{animation:step .42s ease-in-out infinite}
.soyaSvg.walking .legB{animation:step .42s ease-in-out infinite reverse}
@keyframes step{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.soyaSvg .up{transform-box:fill-box;transform-origin:50% 100%;animation:paddle 1s ease-in-out infinite}
.soyaSvg .up2{animation-delay:-.5s}
@keyframes paddle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.soyaSvg.p-held .sit .legs{transform:scaleY(1.12);transform-box:fill-box;transform-origin:50% 0}
.soyaSvg #HEAD{transition:transform .35s}`;
function catSVG(id){ return `<svg xmlns="http://www.w3.org/2000/svg" id="${id}" class="soyaSvg p-sit" viewBox="0 0 200 220"><style>${CAT_STYLE}</style>
<g class="pose sit">
  ${tail('M136,198 C176,198 188,152 172,120 C164,104 172,88 184,84')}

/* ================= Game state ================= */
const ROUND=120, MAXMISS=3;
let G=null, running=false, paused=false, ending=false;
let soyaSvg=null, lastCls='';
function newGame(){
 pebs.forEach(p=>p.el.remove()); pebs=[];
 G={t:0,score:0,miss:0,count:{peb:0,toe:0,cable:0,glass:0,paper:0,steal:0},hist:[],next:['peb','toe','cable'],
  s:{x:L.W*.5,y:L.floorY+(L.H-L.floorY)*.5,face:1,st:'idle',t:1.6,pose:'sit'},
  foot:{out:true,rt:0,bit:0}};
 footEl.classList.remove('bit'); G.cup=0; G.cupFall=0; G.paperOut=0; clearWarn(); $('cup').classList.remove('fall'); $('fish').style.opacity=1; placeThings(); $('dark').className=''; placeFoot(); setCat('sit'); placeSoya(); hud();
}
function D(){ return Math.min(1,G.t/ROUND); }
const P={
 idle:()=>lerp(2.3,.7,D())*rnd(.8,1.2),
 warn:()=>lerp(1.9,1.05,D()),
 peb:()=>lerp(8,4.8,D()),
 nPeb:()=>1+(D()>.3)+(D()>.65),
 chew:()=>lerp(4.2,2.4,D()),
 push:()=>lerp(4,2.6,D()),
 speed:()=>lerp(46,76,D())*L.u
};

/* ================= Soya rendering ================= */
function setCat(pose,extra=''){ G.s.pose=pose; const c=`soyaSvg p-${pose} ${extra}`.trim(); if(c!==lastCls){ soyaSvg.setAttribute('class',c); lastCls=c; soyaSvg.querySelector('#HEAD').setAttribute('transform',HEADPOS[pose]); } }
function placeSoya(){ const s=G.s; soyaEl.style.transform=`translate(${s.x-L.S/2}px,${s.y-L.h+(s.jump||0)}px)`; soyaEl.style.zIndex=Math.round(s.y)+(s.st==='held'?5000:0);
 soyaEl.firstElementChild.style.transform=s.face<0?'scaleX(-1)':'none';
 const al=$('alert'); if(s.st==='warn'){ al.style.display='block'; al.style.transform=`translate(${s.x-12}px,${s.y-L.h*1.15}px)`; } else al.style.display='none';
 const cr=$('chewRing'); if(s.st==='chew'||s.st==='push'){ cr.dataset.i={glass:'🥛',paper:'🧻',steal:'🐟'}[s.type]||'🔌'; cr.style.display='block'; cr.style.transform=`translate(${s.x}px,${s.y-L.h*1.05}px)`; const f=1-s.t/s.t0; cr.style.background=`conic-gradient(#ff4d4d ${f*360}deg,#ffe0e0 0)`; } else cr.style.display='none';
}
function placeFoot(){ const f=G?G.foot:{out:true}; footEl.style.transform=`translate(${L.foot.x-L.foot.w/2}px,${L.foot.top+(f.out?0:L.foot.h*.78)}px)`; }

/* ================= Helpers ================= */
const stageRect=()=>stage.getBoundingClientRect();
function pop(x,y,txt,big){ const d=document.createElement('div'); d.className='pop'+(big?' big':''); d.textContent=txt; d.style.left=clamp(x,70,L.W-70)+'px'; d.style.top=clamp(y,30,L.H-20)+'px'; stage.appendChild(d); setTimeout(()=>d.remove(),1250); }
let hintTO=0; function hint(k){ const h=$('hint'); h.textContent=T[lang][k]; h.classList.add('show'); clearTimeout(hintTO); hintTO=setTimeout(()=>h.classList.remove('show'),2600); }
function addScore(n,x,y){ G.score+=n; pop(x,y,'+'+n); hud(); }
function hud(){ $('score').textContent='⭐ '+G.score; $('hearts').textContent='❤️'.repeat(MAXMISS-G.miss)+'🤍'.repeat(G.miss); $('timeBar').style.width=(Math.min(1,G.t/ROUND)*100)+'%'; }
function mistake(){ G.miss++; hud(); stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake'); if(G.miss>=MAXMISS){ ending=true; setTimeout(()=>finish(false),900); } }
function randFloor(avoid){ for(let i=0;i<30;i++){ const p={x:rnd(L.W*.08,L.W*.92),y:rnd(L.minY+L.h*.3,L.maxY-L.foot.h*.2)}; if(Math.abs(p.x-L.pot.x)<L.pot.w*.6&&p.y<L.pot.base+L.h*.3) continue; if(Math.hypot(p.x-L.cable.mid.x,p.y-L.cable.mid.y)<L.W*.2) continue; if(Math.abs(p.x-L.foot.x)<L.foot.w&&p.y>L.H-L.foot.h) continue; if(avoid&&Math.hypot(p.x-avoid.x,p.y-avoid.y)<L.W*.2) continue; if(L.table&&Math.abs(p.x-L.table.x)<L.table.w*.7&&p.y<L.table.floor+L.h*.4) continue; if(L.roll&&Math.hypot(p.x-L.roll.x,p.y-L.roll.y)<L.W*.15) continue; return p; } return {x:L.W*.35,y:(L.minY+L.maxY)/2}; }
function spot(type){
 if(type==='peb') return {x:L.pot.x+L.pot.w*.5+L.S*.35,y:L.pot.base+L.h*.12,face:-1};
 if(type==='toe') return {x:L.foot.x-L.foot.w*.55-L.S*.5,y:Math.min(L.maxY,L.foot.toes.y+L.h*.35),face:1};
 if(type==='glass'||type==='steal') return {x:L.table.x+L.table.w*.5+L.S*.35,y:L.table.floor+L.h*.28,face:-1};
 if(type==='paper') return {x:L.roll.x+L.S*.6,y:L.roll.y+L.h*.15,face:-1};
 return {x:L.cable.mid.x+L.S*.24,y:L.cable.mid.y+L.h*.31,face:1};
}

/* ================= Soya brain ================= */
function walkTo(p,cb){ const s=G.s; s.st='walk'; s.tx=p.x; s.ty=clamp(p.y,L.minY,L.maxY+L.h*.3); s.cb=cb; s.tface=p.face; }
function goIdle(t){ const s=G.s; s.st='idle'; s.t=t==null?P.idle():t; s.jump=0; setCat('sit',s.happy?'e-happy':''); }
function chooseType(){
 if(G.next.length) return G.next.shift();
 let opts=['peb','toe','cable','glass',L.RM===1?'steal':'paper']; if(G.t<12) opts=opts.filter(o=>o!=='glass'&&o!=='paper'&&o!=='steal');
 if(pebs.filter(p=>p.state==='floor').length>=4) opts=opts.filter(o=>o!=='peb');
 const h=G.hist; if(h.length>=2&&h[h.length-1]===h[h.length-2]) opts=opts.filter(o=>o!==h[h.length-1]);
 return pick(opts);
}
function startMischief(){ const type=chooseType(); G.hist.push(type); const p=spot(type); G.s.happy=false;
 if(Math.random()<.3&&G.t>10){ walkTo(randFloor(G.s),()=>walkTo(p,()=>startWarn(type))); } else walkTo(p,()=>startWarn(type)); }
function startWarn(type){ const s=G.s; s.st='warn'; s.type=type; s.t=P.warn(); s.wait=0; s.face=spot(type).face; G.count[type]++;
 if(type==='peb') setCat('stand','wiggle crouch');
 else setCat('stand','wiggle crouch flat');
 if(type==='cable'){ s.x=L.cable.mid.x-L.S*.55; s.y=L.cable.mid.y+L.h*.25; }
 if(G.count[type]<=2) hint({peb:'hPeb',toe:'hToe',cable:'hCable',glass:'hGlass',paper:'hPaper',steal:'hSteal'}[type]);
 if(type==='glass') $('cup').classList.add('warn'); if(type==='paper') $('roll').classList.add('warn'); if(type==='steal') $('fish').classList.add('warn');
 tone('triangle',300,240,.12,.08);
}
function act(){ const s=G.s;
 if(s.type==='peb'){ s.st='flick'; s.n=P.nPeb(); s.k=0; s.t=.15; setCat('sit','e-wide'); }
 else if(s.type==='toe'){ s.st='pounce'; s.pt=0; s.from={x:s.x,y:s.y}; s.to={x:L.foot.x-L.foot.w*.35-L.S*.25,y:s.y}; s.hit=G.foot.out; setCat('stand','e-wide flat'); SFX.pounce(); }
 else if(s.type==='glass'){ s.st='push'; s.t0=s.t=P.push(); s.ct=0; setCat('stand','e-wide'); }
 else if(s.type==='paper'||s.type==='steal'){ s.st='chew'; s.t0=s.t=P.chew()*1.15; s.ct=0; if(s.type==='steal'){ s.jump=-L.h*.42; } setCat('stand','e-wide'); }
 else { s.st='chew'; s.t0=s.t=P.chew(); s.ct=0; s.x=L.cable.mid.x+L.S*.24; s.y=L.cable.mid.y+L.h*.31; s.face=1; setCat('lie','chew m-open flat'); }
}
function shoo(dragged){ const s=G.s; const was=s.st, type=s.type;
 addScore(was==='chew'?25:20,s.x,s.y-L.h); pop(s.x,s.y-L.h*.6,type==='glass'?T[lang].svGlass:type==='paper'?T[lang].svPaper:type==='steal'?T[lang].svSteal:was==='chew'?T[lang].saved:T[lang].shoo); clearWarn(); if(type==='glass'){ G.cup=0; placeThings(); } SFX.good(); mrrp();
 if(!dragged){ const p=randFloor(L.cable.mid); s.st='hop'; s.pt=0; s.from={x:s.x,y:s.y}; s.to=p; s.face=p.x>s.x?1:-1; setCat('stand','e-wide'); }
 else { s.st='sheep'; s.t=1; s.happy=true; setCat('sit','e-happy'); }
}
function updateSoya(dt){ const s=G.s;
 switch(s.st){
  case 'idle': s.t-=dt; if(s.t<=0) startMischief(); break;
  case 'walk': { const dx=s.tx-s.x, dy=s.ty-s.y, d=Math.hypot(dx,dy), v=P.speed()*dt;
   if(d<=v){ s.x=s.tx; s.y=s.ty; if(s.tface) s.face=s.tface; const cb=s.cb; s.cb=null; cb&&cb(); }
   else { s.x+=dx/d*v; s.y+=dy/d*v; if(Math.abs(dx)>2) s.face=dx>0?1:-1; setCat('stand','walking'); } break; }
  case 'warn':
   if(s.type==='toe'&&!G.foot.out&&!s.dodging){ s.wait+=dt; setCat('sit',''); if(s.wait>3){ goIdle(); } break; }
   if(s.type==='toe'&&!s.dodging) setCat('stand','wiggle crouch flat');
   s.t-=dt; if(s.t<=0) act(); break;
  case 'flick': s.t-=dt; if(s.t<=0){ if(s.k<s.n){ flickPeb(); s.k++; s.t=.32; } else { s.st='bat'; s.t=1.1; s.bt=.1; } } break;
  case 'bat': s.t-=dt; s.bt-=dt; if(s.bt<=0){ batPeb(); s.bt=.6; } if(s.t<=0){ s.st='rest'; s.t=.4; setCat('sit',''); } break;
  case 'chew': s.t-=dt; s.ct-=dt; if(s.ct<=0){ if(s.type==='paper') SFX.rustle(); else SFX.chew(); s.ct=.38; } if(s.type==='paper') G.paperOut=1-s.t/s.t0; if(s.t<=0){ if(s.type==='cable') cableFail(); else otherFail(); } if(s.type==='paper') placeThings(); break;
  case 'push': s.t-=dt; G.cup=1-Math.max(0,s.t)/s.t0; if(s.ct==null||(s.ct-=dt)<=0){ SFX.tok(); s.ct=.5; } placeThings(); if(s.t<=0) glassFail(); break;
  case 'pounce': { s.pt+=dt/.38; const k=Math.min(1,s.pt); s.x=lerp(s.from.x,s.to.x,k); s.y=lerp(s.from.y,s.to.y,k); s.jump=-Math.sin(k*Math.PI)*L.h*.35;
   if(k>=1){ s.jump=0; s.dodging=false;
    if(G.foot.out){ bite(); s.st='rest'; s.t=.9; setCat('sit','e-happy m-open'); }
    else { addScore(20,L.foot.x,L.foot.top); pop(s.x,s.y-L.h*.7,T[lang].dodge,true); SFX.miss(); s.st='rest'; s.t=1; setCat('lie','e-wide'); s.face=-1; } } break; }
  case 'hop': { s.pt+=dt/.45; const k=Math.min(1,s.pt); s.x=lerp(s.from.x,s.to.x,k); s.y=lerp(s.from.y,s.to.y,k); s.jump=-Math.sin(k*Math.PI)*L.h*.3;
   if(k>=1){ s.jump=0; s.st='sheep'; s.t=1; s.happy=true; setCat('sit','e-happy'); } break; }
  case 'flee': { s.pt+=dt/.5; const k=Math.min(1,s.pt); s.x=lerp(s.from.x,s.to.x,k); s.y=lerp(s.from.y,s.to.y,k); s.jump=-Math.sin(k*Math.PI)*L.h*.5;
   if(k>=1){ s.jump=0; s.st='rest'; s.t=1; setCat('sit','e-wide flat'); } break; }
  case 'rest': case 'sheep': s.t-=dt; if(s.t<=0){ goIdle(); s.happy=false; } break;
  case 'held': break;
 }
 placeSoya();
}
function bite(){ const f=G.foot; footEl.classList.remove('bit'); void footEl.offsetWidth; footEl.classList.add('bit'); f.bit=1.1; SFX.ouch();
 pop(L.foot.x,L.foot.top-20,T[lang].bite,true); mistake(); setTimeout(()=>{ if(G){ G.foot.out=false; G.foot.rt=1.4; placeFoot(); } },500); }
function cableFail(){ const s=G.s; $('dark').className=''; void $('dark').offsetWidth; $('dark').className='flick'; SFX.buzz(); meow(1.5,.3,.35);
 pop(L.W/2,L.H*.3,T[lang].flicker,true); mistake();
 s.st='flee'; s.pt=0; s.from={x:s.x,y:s.y}; s.to=randFloor(L.cable.mid); s.face=s.to.x>s.x?1:-1; setCat('stand','e-wide flat'); }

function clearWarn(){ ['cup','roll','fish'].forEach(i=>$(i).classList.remove('warn')); }
function glassFail(){ const s=G.s; clearWarn(); const c=$('cup'); c.classList.add('fall'); G.cupFall=1; placeThings(); SFX.crash();
 setTimeout(()=>{ pop(L.table.x-L.table.w*.6,L.table.floor+20,'💥',true); },420);
 pop(L.W/2,L.H*.3,T[lang].crash,true); mistake(); s.st='flee'; s.pt=0; s.from={x:s.x,y:s.y}; s.to=randFloor(L.table); s.face=s.to.x>s.x?1:-1; setCat('stand','e-wide flat');
 setTimeout(()=>{ if(!G) return; c.classList.remove('fall'); G.cupFall=0; G.cup=0; c.style.opacity=0; placeThings(); setTimeout(()=>c.style.opacity=1,300); },1600); }
