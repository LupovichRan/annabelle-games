  }
  // head
  {const to=G.snake[0],from=G.prev[0]||to,p=lerpP(from,to,k),px=p.x*C+C/2,py=p.y*C+C/2,a=Math.atan2(G.dir.y,G.dir.x)+Math.PI/2;
   const blink=G.inv>0&&Math.floor(G.inv*10)%2===0;
   if(!blink){
    cx.save();cx.translate(px,py);cx.rotate(a);
    if(G.power>0){cx.fillStyle='#ffe35a88';cx.fillRect(-22,-22,44,44)}
    cx.fillStyle='#000';cx.fillRect(-17,-16,34,32);cx.fillRect(-18,-20,10,10);cx.fillRect(8,-20,10,10);
    cx.fillStyle='#ff9a2e';cx.fillRect(-15,-14,30,28);cx.fillRect(-16,-18,8,8);cx.fillRect(8,-18,8,8);
    cx.fillStyle='#ff8fb8';cx.fillRect(-14,-16,4,4);cx.fillRect(10,-16,4,4);
    cx.fillStyle='#2a1a10';cx.fillRect(-3,-14,6,5);cx.fillRect(-9,-14,3,3);cx.fillRect(6,-14,3,3);cx.fillRect(-15,-2,5,3);cx.fillRect(10,-2,5,3);
    cx.fillStyle='#fff';cx.fillRect(-10,-6,7,7);cx.fillRect(3,-6,7,7);cx.fillStyle='#000';cx.fillRect(-8,-6,3,5);cx.fillRect(5,-6,3,5);
    cx.fillStyle='#ff5a8a';cx.fillRect(-3,4,6,4);cx.fillStyle='#fff';cx.fillRect(-7,9,3,3);cx.fillRect(4,9,3,3);
    cx.restore();
   }}
  // gremlins
  G.grem.forEach(g=>{if(g.respawn>0)return;const x=g.x*C+C/2,y=g.y*C+C/2+Math.sin(T*7+g.x)*2;drawGremlin(x,y,1)});
  if(G.boss){const b=G.boss,x=(b.x+1)*C,y=(b.y+1)*C+Math.sin(T*4)*3;cx.save();if(b.stun>0){cx.globalAlpha=.5+.5*Math.sin(T*30)}drawGremlin(x,y,2.3);cx.restore();
    for(let i=0;i<3;i++){cx.fillStyle='#000';cx.fillRect(x-33+i*24,y-C*1.25-2,20,12);cx.fillStyle=i<b.hp?'#ff4a4a':'#555';cx.fillRect(x-31+i*24,y-C*1.25,16,8)}}
  // particles
  G.parts.forEach(p=>{if(p.e){cx.globalAlpha=Math.min(1,p.life*2);emo(p.e,p.x,p.y,18);cx.globalAlpha=1}else{cx.fillStyle=p.c;cx.fillRect(p.x|0,p.y|0,p.s,p.s)}});
  if(G.power>0){cx.fillStyle='#fff';cx.font='bold 14px monospace';cx.textAlign='left';cx.fillText('⭐ '+Math.ceil(G.power)+'s',6,H*C-12)}
  cx.restore();
}
function drawGremlin(x,y,s){
  cx.save();cx.translate(x,y);cx.scale(s,s);
  cx.fillStyle='#000';cx.fillRect(-14,-14,28,28);cx.fillRect(-18,-18,8,8);cx.fillRect(10,-18,8,8);
  cx.fillStyle='#5a9a3a';cx.fillRect(-12,-12,24,24);cx.fillRect(-16,-16,6,6);cx.fillRect(10,-16,6,6);
  cx.fillStyle='#3a6a28';cx.fillRect(-12,4,24,8);
  cx.fillStyle='#fff';cx.fillRect(-9,-8,7,8);cx.fillRect(2,-8,7,8);cx.fillStyle='#c01818';cx.fillRect(-6,-6,4,5);cx.fillRect(5,-6,4,5);
  cx.fillStyle='#000';cx.fillRect(-7,5,14,3);cx.fillStyle='#fff';cx.fillRect(-5,5,3,3);cx.fillRect(2,5,3,3);
  cx.fillStyle='#8a6a3a';cx.fillRect(10,10,6,5);cx.fillStyle='#ddd';cx.fillRect(-16,9,5,6);
  cx.restore();
}
/* ---------------- HUD / toast ---------------- */
let toastT=null;
function toast(s,ms){const e=$('toast');e.textContent=s;e.style.whiteSpace='pre-line';e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||1500)}
function toastOff(){clearTimeout(toastT);$('toast').classList.remove('on')}
function hud(){
  $('sHearts').textContent='❤️'.repeat(Math.max(0,G.hearts))+'🖤'.repeat(Math.max(0,3-G.hearts));
  $('sFood').textContent=(LV[G.lvl]?LV[G.lvl].f:'🐟')+' '+Math.min(G.foodGot,G.need)+'/'+G.need;
  $('sBab').textContent='🐾 '+G.bab.length+'/'+G.babTotal;
  $('sScore').textContent='⭐ '+G.score;
}
/* ---------------- flow ---------------- */
function closeAll(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'))}
function pause(){
  if(G.mode!=='play'&&G.mode!=='ready')return;
  G.modeBefore=G.mode;G.mode='paused';
  $('cPause').innerHTML='<h2>⏸ '+t('pause')+'</h2><button class="btn" id="bRes">▶ '+t('resume')+'</button><button class="btn alt" id="bRst">🔄 '+t('restart')+'</button><button class="btn alt" id="bMenu">🏠 '+t('menu')+'</button>';
  $('ovPause').classList.add('on');
  $('bRes').onclick=resume;$('bRst').onclick=()=>startLevel(G.lvl);$('bMenu').onclick=showMenu;
}
function resume(){if(G.mode!=='paused')return;G.mode=G.modeBefore||'play';$('ovPause').classList.remove('on');G.acc=0}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('blur',()=>{if(G.mode==='play')pause()});
$('pauseBtn').onclick=()=>{ac();if(G.mode==='paused')resume();else pause()};
function applyMute(){$('muteBtn').textContent=muted?'🔇':'🔊';$('musBtn').classList.toggle('off',!music||muted)}
function toggleMute(){muted=!muted;ls.set('annabelle-muted',muted?'1':'0');applyMute();if(!muted)SFX.click()}
$('muteBtn').onclick=()=>{ac();toggleMute()};
$('musBtn').onclick=()=>{ac();music=!music;ls.set(KEY+'-music',music?'1':'0');applyMute()};
function loseHearts(){}
function softLose(){
  if(G.mode==='result')return;
  G.mode='result';SFX.lose();
  $('cRes').innerHTML='<div class="big">🐯💤</div><h2>'+t('oops')+'</h2><p>'+t('oops2')+'</p><button class="btn" id="bR1">🔄 '+t('retry')+'</button><button class="btn alt" id="bM1">🏠 '+t('menu')+'</button>';
  $('ovRes').classList.add('on');
  $('bR1').onclick=()=>startLevel(G.lvl);$('bM1').onclick=showMenu;
}
function clearLevel(){
  if(G.mode==='result')return;
  G.mode='result';SFX.win();
  const L=LV[G.lvl],num=G.lvl+1,stars=G.hearts>=3?3:G.hearts>=2?2:1,prevS=SV.stars[num]||0;
  G.stars=stars;
  if(stars>prevS)SV.stars[num]=stars;
  SV.best[num]=Math.max(SV.best[num]||0,G.score);
  if(num<10)SV.unlocked=Math.max(SV.unlocked,num+1);
  const last=num===10;
  const ids=L.bab.slice();if(last)ids.push('tiger');
  addZoo(ids);
  try{
    const R=window.AnnabelleRewards;
    if(R){R.award({game:'snake',event:'levelClear',level:num,score:G.score});
      if(stars>prevS)R.award({game:'snake',event:'star',stars:stars-prevS});
      if(L.boss||last)R.award({game:'snake',event:'win',level:num});
      R.award({game:'snake',event:'score',score:G.score});R.flush&&R.flush()}
  }catch(e){}
  burst(W*C/2,H*C/2,'🎉',20);
  const rescued=ids.map(id=>EM[id]).join(' ');
  let html='<div class="big pop">'+(last?'🏆':'🎉')+'</div><h2>'+(last?t('end'):t('cleared'))+'</h2><div class="stars">'+'⭐'.repeat(stars)+'<span style="opacity:.25">'+'⭐'.repeat(3-stars)+'</span></div>'+
    '<p>'+t('rescued')+':</p><div class="big" style="font-size:44px">'+rescued+'</div><p>⭐ '+G.score+'</p>';
  if(last)html+='<p>'+t('end2')+'</p>';
  html+=(last?'':'<button class="btn" id="bN">▶ '+t('nextLv')+'</button>')+'<button class="btn alt" id="bA">🔄 '+t('again')+'</button><button class="btn alt" id="bZ">🐾 '+t('zoo')+'</button><button class="btn alt" id="bH">🏠 '+t('menu')+'</button>';
  setTimeout(()=>{if(G.mode!=='result')return;$('cRes').innerHTML=html;$('ovRes').classList.add('on');
    if($('bN'))$('bN').onclick=()=>startLevel(G.lvl+1);$('bA').onclick=()=>startLevel(G.lvl);$('bZ').onclick=()=>showZoo();$('bH').onclick=showMenu},500);
}
/* ---------------- menus ---------------- */
function setLang(l){lang=l;ls.set('annabelle-lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.title=t('title')}
function langRow(){return '<div class="row">'+['he','fr','en'].map(l=>'<button class="chip'+(l===lang?' sel':'')+'" data-l="'+l+'">'+({he:'עברית',fr:'Français',en:'English'})[l]+'</button>').join('')+'</div>'}
function showMenu(){
  G.mode='menu';closeAll();
  const hasProg=SV.unlocked>1;
  let h='<div class="big">🐯</div><h1>'+t('title')+'</h1><p>'+t('sub')+'</p>'+
   '<button class="btn" id="mPlay">▶ '+(hasProg?t('cont'):t('play'))+(hasProg?' ('+Math.min(10,SV.unlocked)+')':'')+'</button>'+
   '<div class="row">'+['easy','normal','hard'].map(d=>'<button class="chip'+(SV.diff===d?' sel':'')+'" data-d="'+d+'">'+t(d)+'</button>').join('')+'</div>';
  if(SV.diff==='easy')h+='<div class="row" style="margin-top:8px"><button class="chip'+(SV.wrap?' sel':'')+'" id="mWrap">🔁 '+t('wrap')+': '+(SV.wrap?t('on'):t('off'))+'</button></div>';
  h+='<div class="row" style="margin-top:6px"><button class="btn sm alt" id="mLv">🗺️ '+t('levels')+'</button><button class="btn sm alt" id="mZoo">🐾 '+t('zoo')+'</button><button class="btn sm alt" id="mSt">📖 '+t('story')+'</button></div>'+langRow();
  $('cMenu').innerHTML=h;$('ovMenu').classList.add('on');
  $('mPlay').onclick=()=>{ac();startMusic();if(!SV.seen){showIntro(()=>startLevel(Math.min(9,SV.unlocked-1),SV.diff))}else startLevel(Math.min(9,SV.unlocked-1),SV.diff)};
  document.querySelectorAll('#cMenu [data-d]').forEach(b=>b.onclick=()=>{SV.diff=b.dataset.d;G.diff=SV.diff;save();SFX.click();showMenu()});
  if($('mWrap'))$('mWrap').onclick=()=>{SV.wrap=!SV.wrap;save();SFX.click();showMenu()};
  $('mLv').onclick=showLevels;$('mZoo').onclick=showZoo;$('mSt').onclick=()=>showIntro(showMenu);
  document.querySelectorAll('#cMenu [data-l]').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);showMenu()});
  hud();
}
function showIntro(done){
  G.mode='menu';closeAll();let i=0;
  const P=[['🐯🌳🏠',t('i1'),'#bfe8ff'],['🗑️👾🐰🦔',t('i2'),'#ffd3d3'],['🐟🐰🐢➡️🏠',t('i3'),'#d9ffd0']];
  const draw=()=>{
    $('cIntro').innerHTML='<div class="panel pop" style="background:'+P[i][2]+'"><div class="big" style="font-size:clamp(40px,13vw,70px)">'+P[i][0]+'</div><p>'+P[i][1]+'</p></div><div class="dots">'+P.map((p,j)=>j===i?'●':'○').join(' ')+'</div><button class="btn" id="iN">'+(i<2?t('next'):t('go'))+'</button><button class="btn alt" id="iS">'+t('skip')+'</button>';
    $('ovIntro').classList.add('on');
    $('iN').onclick=()=>{SFX.click();if(i<2){i++;draw()}else fin()};$('iS').onclick=fin;
  };
  const fin=()=>{SV.seen=true;save();$('ovIntro').classList.remove('on');done&&done()};
  draw();
}
function showLevels(){
  closeAll();
  let h='<h2>🗺️ '+t('levels')+'</h2><div class="lvgrid">';
  for(let i=1;i<=10;i++){const lock=i>SV.unlocked,s=SV.stars[i]||0,boss=LV[i-1].boss;h+='<button class="lv'+(lock?' lock':'')+(boss?' boss':'')+'" data-i="'+i+'">'+(lock?'🔒':i)+(boss&&!lock?' 👾':'')+'<small>'+(s?'⭐'.repeat(s):'&nbsp;')+'</small></button>'}
  h+='</div><button class="btn alt" id="lB">◀ '+t('back')+'</button>';
  $('cLevels').innerHTML=h;$('ovLevels').classList.add('on');
  document.querySelectorAll('#cLevels .lv').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i>SV.unlocked)return;startLevel(i-1,SV.diff)});
  $('lB').onclick=showMenu;
}
function showZoo(){
  closeAll();
  let h='<h2>🐾 '+t('zoo')+' ('+SV.zoo.length+'/20)</h2><div class="zoo">';
  ANIMALS.forEach(a=>{const got=SV.zoo.includes(a);h+='<div class="za'+(got?'':' no')+'"><b>'+EM[a]+'</b>'+(got?nm(a):'?')+'</div>'});
  h+='</div><button class="btn alt" id="zB">◀ '+t('back')+'</button>';
  $('cZoo').innerHTML=h;$('ovZoo').classList.add('on');$('zB').onclick=showMenu;
}
/* ---------------- layout + loop ---------------- */
function fit(){
  const st=$('stage'),w=st.clientWidth-14,h=st.clientHeight-14;
  const sc=Math.max(.3,Math.min(w/(W*C),h/(H*C)));
  cv.style.width=Math.floor(W*C*sc)+'px';cv.style.height=Math.floor(H*C*sc)+'px';
}
addEventListener('resize',fit);
let last=0;
function loop(ts){
  const dt=Math.min(.1,(ts-last)/1000||0);last=ts;
  try{frame(dt);render()}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
/* ---------------- test hook ---------------- */
window.__snake={
  state(){return {mode:G.mode,lvl:G.lvl+1,diff:G.diff,hearts:G.hearts,head:G.snake[0],snake:G.snake.map(p=>({x:p.x,y:p.y})),dir:G.dir,foods:G.foods.map(f=>({x:f.x,y:f.y})),babies:G.babies.map(f=>({x:f.x,y:f.y,id:f.id})),rescued:G.bab.slice(),grem:G.grem.map(g=>({x:g.x,y:g.y})),boss:G.boss?{x:G.boss.x,y:G.boss.y,hp:G.boss.hp}:null,star:G.star,gate:G.gate,open:G.open,foodGot:G.foodGot,need:G.need,score:G.score,power:G.power,wrap:G.wrap,tailN:G.tailN,stars:G.stars,obst:Array.from(G.obst)}},
  start(l,d){startLevel((l||1)-1,d||SV.diff)},
  dir(n){setDir(DIRS[n])},
  tick(n){n=n||1;for(let i=0;i<n;i++)tick()},
  win(){if(G.mode==='ready')G.mode='play';clearLevel()},
  lose(){if(G.mode==='ready')G.mode='play';softLose()},
  hurt(){G.inv=0;hurt()},
  pause,resume,menu:showMenu,
  setPower(s){G.power=s},
  setLayout(h){G.snake=h.snake||G.snake},
  LV:LV.map(l=>l.map),save:()=>JSON.parse(JSON.stringify(SV))
};
/* ---------------- init ---------------- */
setLang(lang);applyMute();
G.diff=SV.diff;
startLevel(Math.min(9,SV.unlocked-1),SV.diff);G.mode='menu';boot=false;
fit();showMenu();
requestAnimationFrame(loop);
setTimeout(fit,60);
})();
</script>
