/* put the banner on a band of rows with no lost baby / cub / boss under it */
function placeBanner(){
  const bn=$('banner');if(bn.style.display!=='block')return;
  bn.style.width=Math.round(cv.clientWidth*.94)+'px';
  const bh=bn.offsetHeight,rows=Math.max(1,Math.min(H,Math.ceil((bh+6)/CS))),cost=new Float32Array(H);
  const add=(y,w)=>{if(y>=0&&y<H)cost[y]+=w};
  G.babies.forEach(b=>{add(b.y,100);add(b.y-1,100)});G.snake.forEach(s=>add(s.y,100));add(G.snake[0].y-1,60);add(G.snake[0].y+1,60);
  if(G.boss){[-1,0,1,2].forEach(d=>add(G.boss.y+d,d===2?25:40))}G.grem.forEach(g=>add(g.y,15));if(G.star)add(G.star.y,20);G.foods.forEach(f=>add(f.y,12));add(G.gate.y,8);
  let best=0,bc=1e9;for(let r=0;r+rows<=H;r++){let c=Math.abs(r-(H*.22))*.5;for(let i=0;i<rows;i++)c+=cost[r+i];if(c<bc){bc=c;best=r}}
