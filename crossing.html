<style>
:root{--ink:#3a2450;--bg:#1d1233;--pink:#ff6fae;--cyan:#38d6e8;--yel:#ffd54a;--cream:#fff4e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:var(--bg);font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew",Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation}
a{color:inherit;text-decoration:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 6px var(--sab,6px)}
#hud{display:flex;gap:6px;align-items:center;flex:none;padding-bottom:6px;direction:ltr;min-width:0}
.ib{width:46px;height:46px;border-radius:12px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 #0007;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;line-height:1;transition:transform .06s}
.ib:active{transform:translateY(3px) scale(1.06,.9);box-shadow:0 1px 0 #0007}
.ib.off{opacity:.55}
.pill{background:var(--cream);border:3px solid var(--ink);border-radius:12px;height:46px;padding:0 8px;display:flex;align-items:center;gap:4px;font-weight:900;font-size:clamp(13px,3.6vw,18px);white-space:nowrap;box-shadow:0 4px 0 #0007;min-width:0}
#hearts{letter-spacing:0;font-size:15px;padding:0 6px}
#lvl{flex:1;justify-content:center;overflow:hidden;direction:ltr}
#stage{position:relative;flex:1 1 auto;min-height:0;border-radius:14px;overflow:hidden;border:3px solid #000;background:#14092b}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000016 2px 3px);mix-blend-mode:multiply}
#dpad{flex:none;display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,56px);gap:6px;justify-content:center;padding-top:8px;direction:ltr}
#dpad button{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 #0007;font-size:26px;font-weight:900;color:var(--ink);touch-action:none;transition:transform .06s}
#dpad button:active{transform:translateY(3px) scale(1.06,.9);box-shadow:0 1px 0 #0007;background:var(--yel)}
#dpad .u{grid-column:2;grid-row:1}#dpad .l{grid-column:1;grid-row:2}#dpad .d{grid-column:2;grid-row:2}#dpad .r{grid-column:3;grid-row:2}
.desk #dpad{display:none}
#hint{position:absolute;left:8px;right:8px;top:8px;text-align:center;pointer-events:none;font-weight:900;font-size:14px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;z-index:2}
#hint:not(:empty){background:#1d1233cc;border-radius:10px;padding:5px 8px}
#sc{position:absolute;left:0;right:0;top:6px;text-align:center;pointer-events:none;z-index:2;direction:ltr;font:900 40px/1 "Courier New",monospace;color:#fff;text-shadow:0 3px 0 #2a1b2a,2px 0 0 #2a1b2a,-2px 0 0 #2a1b2a,0 -2px 0 #2a1b2a;display:none}
#sc small{display:block;font-size:14px;color:#ffe14a;margin-top:2px}
#sc.on{display:block}
#sc.bump b{display:inline-block;animation:scb .22s}
@keyframes scb{40%{transform:scale(1.35)}}
#pop{position:absolute;left:0;right:0;top:40%;text-align:center;pointer-events:none;font-weight:900;font-size:clamp(30px,9vw,52px);color:#ffe14a;-webkit-text-stroke:2px #2a1b2a;text-shadow:0 4px 0 #2a1b2a,0 0 18px #ff6fae;opacity:0;z-index:3}
#pop.go{animation:popA 1.15s ease-out both}
@keyframes popA{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.25) rotate(3deg)}30%{transform:scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}
#banner{position:absolute;left:0;right:0;top:30%;background:#2a1b4d;color:#fff;border-block:4px solid var(--yel);padding:10px 8px;font-weight:900;font-size:clamp(19px,5.6vw,30px);text-align:center;transform:translateX(110%);pointer-events:none;z-index:3;text-shadow:0 3px 0 #0008}
#banner.go{animation:banA 2.1s cubic-bezier(.2,.9,.3,1) both}
#banner.boss{background:#b3123a;border-color:#fff}
@keyframes banA{0%{transform:translateX(110%)}14%{transform:translateX(0)}80%{transform:translateX(0)}100%{transform:translateX(-110%)}}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,8,38,.82);z-index:20;padding:10px;overflow:auto}
.ov.on{display:flex}
#menu{background:radial-gradient(#ff6fae66 3px,#0000 4px) 0 0/60px 60px,radial-gradient(#38d6e866 2px,#0000 3px) 30px 30px/60px 60px,radial-gradient(#ffd54a55 2px,#0000 3px) 10px 40px/90px 90px,#221240;animation:drift 9s linear infinite}
@keyframes drift{to{background-position:60px 60px,150px 150px,100px -50px}}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 #000a,inset 0 0 0 3px #fff;padding:12px 12px 14px;max-width:460px;width:100%;max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:9px;align-items:center}
.ov.on .card{animation:cardIn .28s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{transform:translateY(30px) scale(.9);opacity:0}}
.card h1{margin:0;font-size:clamp(26px,7.5vw,36px);line-height:1.05;color:#d23a8a;text-shadow:2px 2px 0 var(--yel)}
.card h2{margin:0;font-size:clamp(20px,5.6vw,26px);color:var(--ink)}
.card p{margin:0;font-weight:700;font-size:clamp(14px,4vw,17px);line-height:1.3}
.big{font-size:84px;line-height:1}
.btn{min-height:52px;min-width:120px;padding:8px 16px;border-radius:14px;background:var(--pink);color:#fff;font-weight:900;font-size:19px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 #0004;transition:transform .06s}
.btn:active{transform:translateY(4px) scale(1.05,.9);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--cyan);color:var(--ink);text-shadow:none}
.btn.gr{background:#ddd;color:var(--ink);text-shadow:none}
.btn.arc{background:#7a4bff}
.btn.sm{min-height:46px;font-size:16px;min-width:0;flex:1;padding:6px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.row.two .btn{flex:1 1 0;min-width:0}
.seg button{flex:1;min-height:46px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:17px;transition:transform .06s}
.seg button:active{transform:scale(1.05,.9)}
.seg button.on{background:var(--yel);box-shadow:0 3px 0 var(--ink)}
.mcol{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;min-width:0}
#masc{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:96px;padding-top:12px;direction:ltr}
#mcat{width:72px;height:84px;image-rendering:pixelated;animation:bob 1.1s ease-in-out infinite}
#masc .mb{font-size:40px;line-height:1.1;animation:bob 1.1s ease-in-out infinite}

@keyframes bob{50%{transform:translateY(-9px) scale(.96,1.05)}}
#lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%}
#lvgrid button{min-height:50px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-size:20px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .06s}
#lvgrid button:active{transform:scale(1.06,.9)}
#lvgrid button small{font-size:10px;letter-spacing:-1px}
#lvgrid button.lock{opacity:.4}
#lvgrid button.cur{background:var(--yel);animation:bob 1.1s ease-in-out infinite}
.hi{width:100%;background:#1d1233;color:#9fffb0;border:3px solid var(--ink);border-radius:10px;padding:5px 8px;font:900 13px/1.3 "Courier New",monospace;direction:ltr;text-align:left}
.hiT{color:var(--yel);text-align:center;letter-spacing:2px}
.hiR{display:grid;grid-template-columns:22px 48px 26px 1fr;gap:4px}

.blink{animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.rec{color:#e2206a;font-weight:900;font-size:22px;letter-spacing:1px}
.rec:empty{display:none}
.scoreBig{font:900 54px/1 "Courier New",monospace;color:#d23a8a;text-shadow:3px 3px 0 var(--yel);direction:ltr}
.scoreLine{font:900 22px/1 "Courier New",monospace;color:var(--ink);direction:ltr}
.panel{width:100%;min-height:150px;border:4px solid var(--ink);border-radius:10px;background:linear-gradient(#bfe8ff,#bfe8ff 62%,#7fcf6a 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:54px}
.panel.n{background:linear-gradient(#5a3a8a,#2a1b4d)}
.panel>div:first-child{animation:bob 1.2s ease-in-out infinite}
.panel .cap{font-size:clamp(15px,4.2vw,18px);font-weight:900;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px 10px;color:var(--ink)}
#stars{font-size:46px;letter-spacing:6px;min-height:56px;direction:ltr}
#stars span{display:inline-block;animation:starIn .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}}
#zoo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
#zoo div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 2px;font-size:11px;font-weight:800;line-height:1.1;position:relative}
#zoo div b{display:block;font-size:34px;font-weight:400;line-height:1.2}
#zoo div.no b{filter:grayscale(1) brightness(.2);opacity:.5}
#zoo div.mine{background:#fff0a8}
#zoo div.mine::after{content:"⭐";position:absolute;top:-6px;inset-inline-end:-4px;font-size:14px}
#careAn{font-size:104px;line-height:1}
#careAn.hop,#rvEm.hop{animation:hp .4s}
@keyframes hp{40%{transform:translateY(-22px) scale(1.1)}}
#careAn.shk{animation:sk .35s}
@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#need{font-size:40px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:4px 18px;min-height:64px;display:flex;align-items:center;gap:8px}
#need small{font-size:20px;letter-spacing:3px}
#careBtns{display:flex;gap:10px;justify-content:center;direction:ltr}
#careBtns button{width:92px;height:92px;border-radius:18px;background:#fff;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .06s}
#careBtns button small{font-size:13px;font-weight:900;margin-top:2px}
#careBtns button:active{transform:translateY(5px) scale(1.05,.9);box-shadow:0 1px 0 var(--ink);background:var(--yel)}
#careBtns button.want{animation:want .7s ease-in-out infinite}
@keyframes want{50%{transform:translateY(-5px);box-shadow:0 11px 0 var(--ink)}}
#cprog{font-size:28px;letter-spacing:4px}
.hint2{font-size:14px;font-weight:800;opacity:.8}
.rays{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center;flex:none}
.rays::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#ffd54a 0 15deg,#ffd54a00 15deg 30deg);animation:spin 7s linear infinite;-webkit-mask:radial-gradient(#000 35%,#0000 70%);mask:radial-gradient(#000 35%,#0000 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
#rvEm{position:relative;font-size:112px;line-height:1;animation:starIn .6s cubic-bezier(.2,1.6,.4,1) both}
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.langs button{min-height:44px;min-width:56px;border-radius:10px;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:15px}
.langs button.on{background:var(--yel)}
@media (max-height:700px){.big{font-size:60px}.panel{min-height:110px;font-size:40px}#careAn{font-size:72px}#careBtns button{width:80px;height:80px}.card{gap:7px;padding:10px}.rays{width:140px;height:140px}#rvEm{font-size:84px}.scoreBig{font-size:42px}#stars{font-size:38px;min-height:46px}}
@media (min-aspect-ratio:1/1){
 #app,.ov{max-width:calc(var(--app-h,100vh)*.92);margin-inline:auto}
 #menuCard{max-width:none;flex-direction:row;align-items:center;gap:12px}
 #menuCard .mcol{flex:1 1 0}
}
.btn.net{background:#2fb36a;color:#fff;width:100%}
#emoBar{position:absolute;left:50%;transform:translateX(-50%);top:14px;display:none;gap:5px;z-index:7;direction:ltr}
body.net #emoBar{display:flex}
body.net #pauseBtn{display:none}
body.net #hint{top:62px}
#emoBar button{width:38px;height:38px;border-radius:12px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 #0007;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .07s,opacity .2s}
#emoBar button:active{transform:translateY(2px) scale(.94)}
#emoBar.cool button{opacity:.45}
.nres{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.nr{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 4px;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.nr.me{background:#ffe0ee}.nr.fr{background:#d8f6fb}.nr.win{box-shadow:0 0 0 3px var(--yel)}
.nr b{font-size:15px}.nr span{font-family:"Courier New",monospace;font-weight:900;font-size:36px;line-height:1.05}
</style>

function fillLane(LL,mk){

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt}
  parts=parts.filter(p=>p.t<p.life);
  for(const f of floats)f.t+=dt;
  floats=floats.filter(f=>f.t<1.2);
  if(!G||screen!=="play")return;
  G.t+=dt;G.sq+=dt;
  if(G.inv>0)G.inv-=dt;
  if(G.net)netTick(dt);
  if(G.arc){G.camT=Math.max(G.camT,G.maxR-3);G.cam+=(G.camT-G.cam)*Math.min(1,dt*7);genRows(Math.ceil(G.cam+H/S)+3)}
  const v0=Math.max(0,Math.floor(G.cam)-1),v1=Math.min(G.rows.length-1,Math.ceil(G.cam+H/S)+1);
  for(let i=v0;i<=v1&&!G.net;i++){
    const row=G.rows[i];
    if(row.slow>0)row.slow-=dt;if(row.hk>0)row.hk-=dt;
    if(row.t==="w")row.dist+=row.speed*dt;
    else if(row.t==="r"){
      let mul=1;
      if(row.slow>0)mul=.3;
      else if(G.state==="play"&&(G.hop?G.hop.r1===i:G.r===i)){
        const pc=pxf()+.5;
        for(const o of row.objs){const x=objX(row,o),ahead=row.dir>0?pc-(x+o.w):x-pc;if(ahead>-.2&&ahead<1.8){mul=DIFF[G.diff].brake;if(row.hk<=0&&G.inv<=0){row.hk=1.4;tone(392,.09,"square",.05);say("!",OX+(row.dir>0?x+o.w:x)*S,rowY(i)+S*.1,"#ffd54a")}break}}
      }
      row.dist+=row.speed*mul*dt;
    }
    if(row.t==="t"){
      if(row.state==="idle"){row.timer-=dt;if(row.timer<=0){row.state="warn";row.timer=DIFF[G.diff].warn;SFX.ding();row._d=0}}
      else if(row.state==="warn"){row.timer-=dt;row._d+=dt;if(row._d>.45){row._d=0;SFX.ding()}if(row.timer<=0){row.state="go";row.x=row.dir>0?-row.len:COLS+1;SFX.whoosh()}}
      else if(row.state==="go"){row.x+=row.dir*row.speed*dt;if((row.dir>0&&row.x>COLS+1)||(row.dir<0&&row.x<-row.len-1)){row.state="idle";row.timer=rnd(2.8,5)*(G.diff==="easy"?1.4:1)}}
    }
    if(row.t==="b"&&!row.gone){
      if(row.def!=null){row.def+=dt;if(Math.random()<.6){const d=row.def;parts.push({x:OX+row.x*S+S+Math.sin(d*16)*S*.7*d,y:rowY(row.r)+S/2-d*d*S*3.2,vx:rnd(-40,40),vy:rnd(0,60),life:.7,t:0,c:CONF[(Math.random()*6)|0],s:rnd(3,6),g:200})}if(row.def>1.3)row.gone=true}
      else{row.x+=row.v*dt;if(row.x<0){row.x=0;row.v=Math.abs(row.v)}if(row.x>COLS-row.w){row.x=COLS-row.w;row.v=-Math.abs(row.v)}}
    }
  }
  if(G.state==="play"){
    if(G.hop){
      G.hop.t+=dt/HOPT;
      if(G.hop.t>=1){G.hop.t=1;if(G.hop.back){G.px=G.hop.x1;G.r=G.hop.r1;G.hop=null;G.sq=0}else land()}
    }else if(G.rows[G.r].t==="w"){
      const row=G.rows[G.r];G.px+=row.dir*row.speed*(G.net?G.dc:dt);
      if(G.px<-.45||G.px>COLS-.55)doSplash();
      else if(!platformAt(row,G.px+.5))doSplash();
    }
    if(G.state==="play"&&G.inv<=0&&!(G.hop&&G.hop.back)){
      const rr=G.hop?(G.hop.t>.5?G.hop.r1:G.hop.r0):G.r,row=G.rows[rr],cx=pxf()+.5;
      if(row.t==="r"){
        for(const o of row.objs){const x=objX(row,o);if(cx>x-.03&&cx<x+o.w+.03){bump(row);break}}
      }else if(row.t==="t"&&row.state==="go"){
        if(cx>row.x+.2&&cx<row.x+row.len-.2)bump(row);
      }else if(row.t==="b"&&!row.gone&&row.def==null){
        if(cx>row.x+.1&&cx<row.x+row.w-.1)bump(row);
      }
    }
    if(G.state==="play"&&G.hop===null&&G.buf){const b=G.buf;G.buf=null;hopDir(b)}
  }
  G.stateT+=dt;
  if(G.state==="splash"&&G.stateT>.55)respawn();
  if(G.state==="lost"&&G.stateT>.9){G.state="over";if(G.arc)arcadeOver();else showRetry()}
  if(G.state==="won"){
    const dc=(COLS-1)/2+G.ws;G.px+=(dc-G.px)*Math.min(1,dt*5);
    G.door=Math.min(1,Math.max(0,(G.stateT-.25)/.45));
    G.hT-=dt;if(G.hT<=0&&G.stateT>.5){G.hT=.1;heartsFx(OX+COLS*S/2,rowY(G.R-1)+S*.1,1)}
    G.cT-=dt;if(G.cT<=0){G.cT=.5;burst(OX+rnd(.15,.85)*COLS*S,rowY(G.R-1)+rnd(-S*.5,S*.5),18,CONF,190,120)}
    G.bfade=Math.max(0,Math.min(1,(2.1-G.stateT)/.35));
    if(G.stateT>2.3&&!G.net){G.state="care";startCare()}
  }
  // baby follower
  const k=Math.min(1,dt*10),rf=prf(),cur=G.rows[Math.round(rf)];let tx,ty,pgT=0;
  if(G.state==="won"){tx=(COLS-1)/2;ty=G.R-1+(G.stateT>.9?.42:0)}
  else if(cur&&cur.t==="w"){tx=pxf();ty=rf+.6;pgT=1}
  else{tx=pxf()-.72*G.face;if(tx<-.15||tx>COLS-.85)tx=pxf()+.72*G.face;ty=rf}
  G.bx+=(tx-G.bx)*k;G.by+=(ty-G.by)*k;G.pg+=(pgT-G.pg)*Math.min(1,dt*14);
  let lt=0;const brow=G.rows[Math.round(G.by)];
  if(brow&&brow.t==="r"&&G.state==="play"){const bc=G.bx+.5;for(const o of brow.objs){const x=objX(brow,o);if(bc>x-.45&&bc<x+o.w+.45){lt=1;break}}}
  G.bl+=(lt-G.bl)*Math.min(1,dt*16);
  if(hintT>0){hintT-=dt;if(hintT<=0)$("hint").textContent=""}
}

/* ---------- autopilot hint (used by tests: returns a suggested hop, the test presses the real key) ---------- */
function botSuggest(){
  if(!G||screen!=="play"||G.state!=="play"||G.hop||paused)return null;
  const r=G.r,cx=G.px+.5,cur=G.rows[r];if(G.arc)genRows(r+2);
  const up=G.rows[r+1],dn=r>minRow()?G.rows[r-1]:null;
  const carHit=(row,x,t0,t1)=>{for(const o of row.objs){const ox=objX(row,o);for(let k=0;k<=8;k++){const p=ox+row.dir*row.speed*(t0+(t1-t0)*k/8);if(x>p-.5&&x<p+o.w+.5)return true}}return false};
  const platOk=(row,x,tt)=>{for(const o of row.objs){const p=objX(row,o)+row.dir*row.speed*tt;if(x>p+.1&&x<p+o.w-.1)return true}return false};
  const safe=(row,x,stay)=>{
    if(!row)return false;
    if(row.t==="r")return!carHit(row,x,0,Math.min(stay,.4));
    if(row.t==="w")return platOk(row,x,.13)&&platOk(row,x,.22);
    if(row.t==="t")return row.state==="idle"||(row.state==="warn"&&row.timer>.8);
    if(row.t==="b"){if(row.gone||row.def!=null)return true;for(let k=0;k<=8;k++){let bx=row.x+row.v*stay*k/8;bx=Math.max(0,Math.min(COLS-row.w,bx));if(x>bx-.6&&x<bx+row.w+.6)return false}return true}
    return true};
  const rx=Math.max(0,Math.min(COLS-1,Math.round(G.px)))+.5;
  const xUp=up&&up.t==="w"?cx:rx;
  if(up&&safe(up,xUp,.7))return"u";
  let danger=false;
  if(cur.t==="r")danger=carHit(cur,cx,0,.5);
  else if(cur.t==="t")danger=cur.state==="go"||(cur.state==="warn"&&cur.timer<.6);
  else if(cur.t==="b")danger=!safe(cur,cx,.6);
  if(danger){
    if(dn&&dn.t!=="w"&&safe(dn,rx,.7))return"d";
    if(cur.t==="r"){const d=cur.dir>0?"r":"l",nx=cx+cur.dir;if(nx>0&&nx<COLS&&!carHit(cur,nx,0,.4))return d}
    if(cur.t==="b"){const away=cx<cur.x+1?-1:1,nx=cx+away;if(nx>0&&nx<COLS)return away>0?"r":"l"}
    return null;
  }
  if(cur.t==="w"){
    const v=cur.dir,edge=(v<0&&G.px<1.3)||(v>0&&G.px>COLS-2.3);
    if(edge||Math.abs(cx-COLS/2)>2){
      const s=cx>COLS/2?-1:1,nx=cx+s;
      if((edge?s===-v:true)&&nx>.2&&nx<COLS-.2&&platOk(cur,nx,.13)&&platOk(cur,nx,.22))return s>0?"r":"l";
      if(edge&&dn&&dn.t!=="w"&&safe(dn,rx,.6))return"d";
    }
  }
  return null;
}

  }else if(NG.phase==="rdone"&&NG.res&&NG.res.m>0&&G.clock>=NG.rdT)netMatchEnd(NG.res.m);
}
function netPos(){if(NT)NT.send({t:"p",x:Math.round(pxf()*100)/100,r:Math.round(prf()*100)/100,s:G.state==="splash"?2:G.inv>0?1:0})}
setInterval(()=>{if(NG.on&&document.hidden&&G&&G.net)netTick(0)},500); // the match keeps running (and the host keeps judging) while the tab is in the background
function netArrive(){ // I reached the clinic door
  if(!NG.on||NG.phase!=="race"||NG.fin[NG.role]!=null)return;
  const c=Math.max(0,Math.round(G.clock*1000)/1000);NG.fin[NG.role]=c;
  if(NG.role===0){if(NG.dec==null)NG.dec=G.clock+.35}
  else if(NT){netPos();NT.send({t:"fin",i:NG.rd,c})}
}
function netJudge(){ // host: first to the door wins; arrivals within 150 ms are a draw
  const a=NG.fin[0],b=NG.fin[1];let w;
  if(a!=null&&b!=null)w=Math.abs(a-b)<.15?2:a<b?0:1;else w=a!=null?0:1;
  const W2=NG.w.slice();if(w<2)W2[w]++;
  let m=0;if(W2[0]>=2)m=1;else if(W2[1]>=2)m=2;else if(NG.rd>=2)m=W2[0]>W2[1]?1:W2[1]>W2[0]?2:3;
  const ta=a==null?-1:Math.round(a*100)/100,tb=b==null?-1:Math.round(b*100)/100;
  if(NT)NT.send({t:"rr",i:NG.rd,w,a:W2[0],b:W2[1],m,ta,tb});
  netRoundEnd(w,W2[0],W2[1],m,ta,tb);
}
function netRoundEnd(w,a,b,m,ta,tb){
  if(!G||!G.net||NG.phase==="rdone"||NG.phase==="done")return;
  NG.phase="rdone";NG.w=[a,b];NG.res={w,m,ta,tb};NG.rdT=G.clock+3.2;
  if(G.state!=="won"){G.hop=null;G.buf=null;G.state="idle"}
  const me=NG.role,good=w===me,draw=w===2;
  banner(draw?t("rD"):good?t("rW"):t("rL"),good?"":"boss");
  if(good){SFX.fan();burst(pcx(),pcy(),30,CONF,200,120)}else if(draw)SFX.ding();else SFX.lose();
  $("hint").textContent="";updHud();
}
function netMatchEnd(m){
  if(!G||!G.net||NG.phase==="done")return;
  NG.phase="done";NG.over=true;NG.res=NG.res||{w:2,m,ta:-1,tb:-1};if(NT)NT.setOver(true);
  const me=NG.role,mw=NG.w[me],ow=NG.w[1-me],w=m===3?0:((m===1&&me===0)||(m===2&&me===1))?1:-1;
  if(NG.paid!==NG.mid){ // rewards for the local player only, once per match
    NG.paid=NG.mid;if(w>0)rw({event:"win"});rw({event:"score",score:Math.max(0,Math.min(30,mw*10+(w>0?5:0)))});rwFlush();
  }
  if(w>0){SFX.fan();burst(W/2,H*.4,50,CONF,230,140)}else if(w<0)SFX.lose();else SFX.ding();
  const c=$("netcard");
  c.innerHTML="<div class='big'>"+(w>0?"🏆":w<0?"😿":"🤝")+"</div><h2>"+(w>0?t("nWin"):w<0?t("nLose"):t("nDraw"))+"</h2>"+
    "<div class='nres'><div class='nr me"+(w>0?" win":"")+"'><b>"+t("you")+"</b><span>"+mw+"</span></div>"+
    "<div class='nr fr"+(w<0?" win":"")+"'><b>"+t("fr1")+"</b><span>"+ow+"</span></div></div>"+
    "<p id='nMsg'>"+(w>0?t("nWin2"):w<0?t("nLose2"):t("nDraw2"))+"</p>"+
    "<div class='row'><button class='btn gr' id='nHome'>🏠 "+t("menu")+"</button><button class='btn' id='nAgain'>🔁 "+t("reBtn")+"</button></div>";
  $("netov").classList.add("on");
  $("nAgain").onclick=()=>{if(!NT||!NG.on||NT.myRe)return;SFX.click();NT.rematch();$("nAgain").disabled=true;const mm=$("nMsg");if(mm)mm.textContent=NT.t("waitRe")};
  $("nHome").onclick=()=>{SFX.click();toMenu()};
  updHud();
}
function netLeft(){ // the friend left (or the link is gone for good): a kind card, never a frozen screen
  if(!(G&&G.net)||!NG.on)return;

  NG.over=true;NG.phase="done";G.state="idle";G.hop=null;G.buf=null;

    "<div class='row'><button class='btn net' id='nNew' style='width:auto'>🌐 "+t("newRoom")+"</button><button class='btn gr' id='nHome'>🏠 "+t("menu")+"</button></div>";

}

function showEmo(i,side){NG.emo.push({i,side,t:0});if(NG.emo.length>4)NG.emo.shift();if(side==="o")tone(880,.09,"triangle",.09,1320)}
function sendEmo(i){
  const now=performance.now();if(!NT||!NG.on||!G||!G.net||NG.phase==="done"||!iN(i,0,3)||now-NG.emT<1000)return;
  NG.emT=now;NT.send({t:"em",i});showEmo(i,"p");SFX.click();
  const bar=$("emoBar");bar.classList.add("cool");setTimeout(()=>bar.classList.remove("cool"),1000);
}
/* ---- messages from the friend (already authenticated by net1v1, still treated as hostile) ---- */
function netData(d){
  if(!NG.on||!d||typeof d!=="object"||typeof d.t!=="string"||!G||!G.net)return;
  const now=performance.now(),host=NG.role===0;
  switch(d.t){
  case"em":if(iN(d.i,0,3)&&now-NG.emRx>500){NG.emRx=now;showEmo(d.i,"o")}break;
  case"p":{
    if(!fN(d.x,-1.5,COLS+1.5)||!fN(d.r,0,G.R-1)||!iN(d.s,0,2))return;
    if(now-NG.pRx<60)return;NG.pRx=now;
    if(d.r>Math.max(0,G.clock)/.08+1.5)return; // nobody hops that fast
    const gh=NG.gh;gh.tx=d.x;gh.tr=d.r;gh.s=d.s;if(!gh.seen){gh.seen=true;gh.x=d.x;gh.r=d.r}
    if(host&&d.r>NG.gMax)NG.gMax=d.r;
    break}
  case"fin":{ // host only: the guest says she reached the door
    if(!host||NG.phase!=="race"||!iN(d.i,0,2)||d.i!==NG.rd||!fN(d.c,0,300)||NG.fin[1]!=null)return;
    if(d.c<(G.R-1)*.09||d.c>G.clock+.3||NG.gMax<G.R-3)return;
    NG.fin[1]=d.c;if(NG.dec==null)NG.dec=G.clock+.35;
    break}
  case"ra":{ // host only: the guest got the round start, measure the delay and align her clock
    if(!host||NG.phase!=="count"||NG.sy||G.clock>-.5)return;
    NG.sy=true;const lat=Math.max(0,Math.min(.6,(now-NG.rdAt)/2000));
    if(NT)NT.send({t:"sy",d:Math.round(lat*1000)/1000});
    break}
  case"sy":{
    if(host||NG.phase!=="count"||NG.sy||!fN(d.d,0,.6))return;
    NG.sy=true;NG.t0-=d.d*1000;break}
  case"rd":{ // guest only: a new round starts
    if(host||NG.phase==="done"||!iN(d.i,0,2)||d.i!==NG.nextRd)return;
    NG.nextRd=d.i+1;netRound(d.i);NG.phase="count";NG.t0=now+3000-NG.pAcc;G.clock=-3;
    if(NT)NT.send({t:"ra"});
    break}
  case"rr":{
    if(host||NG.phase==="done"||!iN(d.i,0,2)||d.i!==NG.rd||!iN(d.w,0,2)||!iN(d.a,0,3)||!iN(d.b,0,3)||!iN(d.m,0,3)||!fN(d.ta,-1,300)||!fN(d.tb,-1,300))return;
    netRoundEnd(d.w,d.a,d.b,d.m,d.ta,d.tb);break}
  case"full":{ // host after a connection pause: complete snapshot so both screens agree again
    if(host||NG.phase==="done"||!iN(d.i,0,2)||!iN(d.ph,0,4)||!fN(d.c,-5,300)||!iN(d.a,0,3)||!iN(d.b,0,3)||!iN(d.m,0,3)||!iN(d.w,-1,2)||!fN(d.ta,-1,300)||!fN(d.tb,-1,300))return;
    if(d.i!==NG.rd||!G.net){netRound(d.i);NG.nextRd=d.i+1}
    NG.w=[d.a,d.b];
    if(d.ph===1||d.ph===2){if(NG.phase!=="rdone"||d.i!==NG.rd){NG.phase=d.ph===1?"count":"race"}NG.t0=now-NG.pAcc-d.c*1000;G.clock=d.c;NG.sy=true;
      if(d.ph===2&&NG.fin[1]!=null&&NT)NT.send({t:"fin",i:NG.rd,c:NG.fin[1]})}
    else if(d.ph===3&&d.w>=0)netRoundEnd(d.w,d.a,d.b,d.m,d.ta,d.tb);
    else if(d.ph===4){NG.res={w:d.w,m:d.m,ta:d.ta,tb:d.tb};netMatchEnd(d.m)}
    break}
  }
}
function netFull(){ // host: after the connection is back, one complete snapshot
  if(!(G&&G.net&&NG.role===0&&NT))return;
  const ph={wait:0,count:1,race:2,rdone:3,done:4}[NG.phase]||0,r=NG.res||{w:-1,m:0,ta:-1,tb:-1};
  NT.send({t:"full",i:NG.rd,ph,c:Math.round(G.clock*1000)/1000,a:NG.w[0],b:NG.w[1],m:r.m,w:r.w,ta:r.ta,tb:r.tb});
}

function netTag(s,x,y,col){
