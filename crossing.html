      while(x<LL-3-1){const k=Math.random();const w=k<.2?2.3:k<.55?1.6:1.3;row.objs.push({x0:x+3,w,col:["#ff5a7a","#3aa8e8","#ffd54a","#7be05a","#b57cff"][(Math.random()*5)|0],truck:w>2});x+=w+(2.7+rnd(0,2.2)-.08*n)*D.gap}

/* ---------- player actions ---------- */

  if(d==="l"){nx=G.px-1;G.face=-1}else if(d==="r"){nx=G.px+1;G.face=1}else if(d==="u")nr=G.r+1;else if(d==="d")nr=G.r-1;

}

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt}
  parts=parts.filter(p=>p.t<p.life);
  for(const f of floats)f.t+=dt;
  floats=floats.filter(f=>f.t<1.2);
  if(!G||screen!=="play")return;
  G.t+=dt;
  if(G.inv>0)G.inv-=dt;
  for(const row of G.rows){
    if(row.slow>0)row.slow-=dt;
    if(row.t==="t"){
      if(row.state==="idle"){row.timer-=dt;if(row.timer<=0&&!G.rows.every(r=>r===row||true)){}if(row.timer<=0){row.state="warn";row.timer=DIFF[G.diff].warn;SFX.ding();row._d=0}}
      else if(row.state==="warn"){row.timer-=dt;row._d+=dt;if(row._d>.45){row._d=0;SFX.ding()}if(row.timer<=0){row.state="go";row.x=row.dir>0?-row.len:COLS+1;SFX.whoosh()}}
      else if(row.state==="go"){row.x+=row.dir*row.speed*dt;if((row.dir>0&&row.x>COLS+1)||(row.dir<0&&row.x<-row.len-1)){row.state="idle";row.timer=rnd(2.8,5)*(G.diff==="easy"?1.4:1)}}
    }

  }

    if(G.hop){
      G.hop.t+=dt/HOPT;
      if(G.hop.t>=1){G.hop.t=1;if(G.hop.back){G.px=G.hop.x1;G.r=G.hop.r1;G.hop=null;G.ride=null}else land()}
    }else if(G.rows[G.r].t==="w"){
      const row=G.rows[G.r];G.px+=row.dir*row.speed*dt;
      if(G.px<-.45||G.px>COLS-.55)doSplash();

    }
    // collisions
    if(G.state==="play"&&G.inv<=0&&!(G.hop&&G.hop.back)){
      const rr=G.hop?(G.hop.t>.5?G.hop.r1:G.hop.r0):G.r;
      const row=G.rows[rr];
      const cx=(G.hop?G.hop.x0+(G.hop.x1-G.hop.x0)*G.hop.t:G.px)+.5;
      if(row.t==="r"){

  }

  if(G.state==="lost"&&G.stateT>.9){G.state="over";showRetry()}

}

  R(pw-u,py+ph*.35,u,u*1.6,"#fff4a0");R(0,py+ph*.35,u,u*1.6,"#ff4040");
  R(pw*.15,py+ph-u,u*2.6,u*2,"#111");R(pw*.7,py+ph-u,u*2.6,u*2,"#111");
  ctx.restore();
}
function drawPlat(x,y,o){
  const px=OX+x*S,pw=o.w*S,u=Math.max(2,S/12);
  if(o.log){R(px,y+S*.2,pw,S*.6,"#8a5a2b");R(px,y+S*.2,pw,u*1.5,"#b07a40");R(px,y+S*.8-u*1.5,pw,u*1.5,"#5e3a18");for(let i=1;i<o.w*2;i++)R(px+i*S*.5,y+S*.35,u,S*.1,"#5e3a18");R(px-u,y+S*.25,u*2,S*.5,"#d9a066");R(px+pw-u,y+S*.25,u*2,S*.5,"#d9a066")}
  else{const cx=px+pw/2,cy=y+S/2;ctx.fillStyle="#46b34a";ctx.beginPath();ctx.ellipse(cx,cy,S*.42,S*.32,0,0,6.3);ctx.fill();ctx.fillStyle="#2f8f36";ctx.beginPath();ctx.ellipse(cx,cy+S*.05,S*.36,S*.2,0,0,6.3);ctx.fill();R(cx-u,cy-u*2,u*2,u*2,"#ff9ec4")}
}
function drawTrain(row,y){
  const px=OX+row.x*S,pw=row.len*S,u=Math.max(2,S/12);
  R(px,y+S*.12,pw,S*.76,"#d03a4a");R(px,y+S*.12,pw,u*1.4,"#ff8a98");R(px,y+S*.66,pw,u*1.4,"#8a1f2f");
  for(let i=0;i<row.len-1;i++){R(px+(i+.2)*S,y+S*.28,S*.55,S*.26,"#9fe0ff")}
  const fx=row.dir>0?px+pw-S*.5:px;R(fx,y+S*.15,S*.5,S*.7,"#a02a3a");R(fx+(row.dir>0?S*.35:0),y+S*.3,S*.12,S*.12,"#fff4a0");
}
function drawBoss(row,y){
  const bx=OX+row.x*S+S,by=y+S/2+Math.sin(time*6)*2;
  const cols=["#7be05a","#b57cff","#ff9a3c","#ff4a5a"],cc=cols[[3,6,9,10].indexOf(G.n+1)]||"#7be05a";
  ctx.fillStyle=cc;ctx.beginPath();ctx.arc(bx,by,S*.62,0,6.3);ctx.fill();ctx.strokeStyle="#2a1b2a";ctx.lineWidth=3;ctx.stroke();
  emoji("🤖",bx,by+2,S*1.0);
  if(G.n===9)emoji("👑",bx,by-S*.62,S*.5);

function drawBaby(){
  const sz=S*.62;const x=OX+G.bx*S+S/2,y=OY+(G.rows.length-1-G.by)*S+S*.6;
  const fl=G.state==="won"?Math.abs(Math.sin(G.stateT*8))*S*.4:0;
  ctx.globalAlpha=1;emoji(EMO[LV[G.n].an],x,y-fl,sz);
}
function draw(){
  if(!W)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle="#14092b";ctx.fillRect(0,0,W,H);
  if(!G){return}
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*8*shake*4,(Math.random()-.5)*8*shake*4);
  for(let r=0;r<G.rows.length;r++)drawRow(G.rows[r],r);
  // clinic building
  const cr=G.rows.length-1,cy0=rowY(cr);
  {const bx=OX+COLS*S/2,u=Math.max(2,S/10);
   R(bx-S*1.4,cy0+S*.08,S*2.8,S*.84,"#fff");R(bx-S*1.5,cy0+S*.0,S*3,u*2,"#ff6fae");
   R(bx-u*2,cy0+S*.2,u*4,u*10,"#e23a4a");R(bx-u*5,cy0+S*.2+u*3,u*10,u*4,"#e23a4a");
   R(bx-S*.35,cy0+S*.55,S*.7,S*.37,"#9fe0ff");R(bx-S*1.2,cy0+S*.3,S*.45,S*.3,"#9fe0ff");R(bx+S*.75,cy0+S*.3,S*.45,S*.3,"#9fe0ff");
   emoji("❤",bx-S*1.0,cy0+S*.78,S*.3);emoji("🌼",bx+S*1.0,cy0+S*.78,S*.3);}
  // play area clip
  ctx.save();ctx.beginPath();ctx.rect(OX,0,COLS*S,H);ctx.clip();
  for(let r=0;r<G.rows.length;r++){
    const row=G.rows[r],y=rowY(r);
    if(row.t==="w")for(const o of row.objs)drawPlat(objX(row,o),y,o);
  }
  for(let r=0;r<G.rows.length;r++){
    const row=G.rows[r],y=rowY(r);
    if(row.t==="r")for(const o of row.objs)drawCar(objX(row,o),y,o.w,o.col,row.dir,o.truck);
    else if(row.t==="t"&&row.state==="go")drawTrain(row,y);
    else if(row.t==="b"&&!row.gone)drawBoss(row,y);
  }
  // player
  if(G.state!=="splash"&&G.state!=="over"){
    const x=pcx(),yy=pcy(),hopA=G.hop?Math.sin(G.hop.t*Math.PI)*S*.3:0;
    const blink=G.inv>0&&Math.floor(G.t*14)%2===0;
    ctx.fillStyle="#0004";ctx.beginPath();ctx.ellipse(x,yy+S*.32,S*.3,S*.1,0,0,6.3);ctx.fill();
    drawBaby();
    if(!blink)drawCat(x,yy-hopA+S*.06,S*.78/12*1.0);
  }else if(G.state==="splash"){drawBaby()}
  // particles
  for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}
  ctx.globalAlpha=1;
  ctx.restore();
  // side dim
  ctx.fillStyle="rgba(20,9,43,.5)";ctx.fillRect(0,0,OX,H);ctx.fillRect(OX+COLS*S,0,W-OX-COLS*S,H);
  // floaters
  ctx.font="900 "+Math.floor(Math.max(14,S*.4))+"px Rubik,Arial,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  for(const f of floats){ctx.globalAlpha=Math.min(1,(1.2-f.t)*2);ctx.lineWidth=4;ctx.strokeStyle="#000";ctx.strokeText(f.txt,f.x,f.y-f.t*S*.8);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-f.t*S*.8)}
  ctx.globalAlpha=1;
  ctx.restore();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused&&!document.hidden)update(dt);
  draw();requestAnimationFrame(frame);
}

function storyPanels(){
  return[["🌳🐱🐱🐱🐯","bg"],["🤖🎈🚧💨🐰","n"],["🏥🐱🐢","bg"]].map((p,i)=>({em:p[0],cls:p[1],cap:t("st")[i]}));
}
let stI=0,stThen=null;

function renderStory(){

function endStory(){SV.seen=true;save();if(stThen){const f=stThen;stThen=null;f()}else toMenu()}
function openChapter(n){
  const L=LV[n];pendingLevel=n;
  $("chTitle").textContent=t("lvl")+" "+(n+1)+": "+t("ch")[n];

let pendingLevel=0;

/* ---------- care mini-game ---------- */
let care=null;
function startCare(){
  const L=LV[G.n];
  const kinds=["band","food","hug"].sort(()=>Math.random()-.5);
  const need={band:1,food:2,hug:3};
  care={i:0,c:0,list:kinds.map(k=>({k,n:need[k]})),done:false};
  $("careAn").textContent=EMO[L.an];$("careAn").className="";
  setScreen("care");renderCare();
}
const CE={band:"🩹",food:"🍎",hug:"💗"};
function renderCare(){
  if(!care)return;
  const cur=care.list[care.i];
  if(!cur){$("need").innerHTML="🥰";$("cprog").textContent="💗💗💗";return}
  $("need").innerHTML=CE[cur.k]+"<small>"+"●".repeat(cur.n-care.c)+"○".repeat(care.c)+"</small>";
  $("cprog").textContent="💗".repeat(care.i)+"🤍".repeat(3-care.i);
}
function careTap(k){
  if(screen!=="care"||!care||care.done)return;
  const cur=care.list[care.i];if(!cur)return;
  const an=$("careAn");
  if(k===cur.k){
    care.c++;an.className="";void an.offsetWidth;an.className="hop";SFX.good();
    if(care.c>=cur.n){care.i++;care.c=0;SFX.heart();
      if(care.i>=3){care.done=true;renderCare();SFX.fan();setTimeout(()=>{if(screen==="care")finishLevel()},900);return}}
    renderCare();
  }else{an.className="";void an.offsetWidth;an.className="shk";SFX.oops()}
}
function finishLevel(){
  const n=G.n,L=LV[n];
  const stars=G.hits===0?3:G.hits<=2?2:1;
  const first=!(SV.stars[n]>0);
  SV.stars[n]=Math.max(SV.stars[n]||0,stars);
  SV.unlocked=Math.max(SV.unlocked,Math.min(LV.length,n+2));
  const newOne=SV.rescued.indexOf(L.an)<0;
  if(newOne)SV.rescued.push(L.an);
  zooAdd(L.an);save();
  rw({event:"levelClear",level:n+1});rw({event:"star",level:n+1,stars});rw({event:"score",level:n+1,score:stars*100+G.hearts*10});
  if(n===LV.length-1)rw({event:"win",level:n+1,stars});
  $("rTitle").textContent=n===LV.length-1?t("rT")+" 🎉":t("rT");
  $("rEm").textContent=EMO[L.an];
  $("stars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
  $("rTxt").textContent=(newOne?t("newF")+" ":"")+(n===LV.length-1?t("fin"):t("rTxt").replace("{a}",EMO[L.an]+" "+t("an")[L.an]));
  $("rNext").textContent=n===LV.length-1?t("menu"):t("nextLv");
  setScreen("result");G.state="done";
  for(let i=0;i<stars;i++)setTimeout(()=>SFX.star(i),250+i*220);

let sanctBack="menu";
function openSanct(back){sanctBack=back||"menu";buildSanct();setScreen("sanct")}

/* ---------- pause ---------- */
function setPause(on){
  if(screen!=="play"&&!(on===false&&screen==="pause"))return;
  if(on){paused=true;screen="pause";$("pause").classList.add("on")}
  else{paused=false;screen="play";$("pause").classList.remove("on")}
}
let prevScreenForPause="play";
function pauseToggle(){
  if(screen==="play"){screen="pause";paused=true;$("pause").classList.add("on")}
  else if(screen==="pause"){screen="play";paused=false;$("pause").classList.remove("on")}
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&screen==="play")pauseToggle();if(AC&&document.hidden)AC.suspend&&AC.suspend().catch(()=>{})});

/* ---------- input ---------- */
const KM={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",KeyW:"u",KeyS:"d",KeyA:"l",KeyD:"r",Space:"u"};
document.addEventListener("keydown",e=>{
  if(window.AnnabelleDesk&&AnnabelleDesk.typing(e))return;
  if(e.code==="KeyM"){muted=!muted;ls.set("annabelle-muted",muted?"1":"0");updHud();$("muteBtn").textContent=muted?"🔇":"🔊";return}
  if(e.code==="KeyP"||e.code==="Escape"){if(screen==="play"||screen==="pause"){pauseToggle();e.preventDefault()}return}
  if(screen==="care"){const k={Digit1:"band",Digit2:"food",Digit3:"hug"}[e.code];if(k)careTap(k);return}
  if(screen==="play"&&KM[e.code]){e.preventDefault();hopDir(KM[e.code])}
});
let ptr=null;
cv.addEventListener("pointerdown",e=>{ac();ptr={x:e.clientX,y:e.clientY,t:performance.now()};try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
cv.addEventListener("pointerup",e=>{
  if(!ptr)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr=null;
  if(screen!=="play"||!G)return;
  if(Math.hypot(dx,dy)>26){hopDir(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"));return}
  const r=cv.getBoundingClientRect(),tx=e.clientX-r.left-pcx(),ty=e.clientY-r.top-pcy();
  if(Math.abs(tx)>Math.abs(ty)*1.15&&Math.abs(tx)>S*.3)hopDir(tx>0?"r":"l");else hopDir(ty>0&&Math.abs(ty)>S*.3?"d":"u");
});
cv.addEventListener("pointercancel",()=>{ptr=null});
document.querySelectorAll("#dpad button").forEach(b=>{

$("pauseBtn").onclick=()=>{SFX.click();if(screen==="play"||screen==="pause")pauseToggle()};
$("muteBtn").onclick=()=>{muted=!muted;ls.set("annabelle-muted",muted?"1":"0");$("muteBtn").textContent=muted?"🔇":"🔊";if(!muted)SFX.click()};
$("musBtn").onclick=()=>{SV.music=!SV.music;save();$("musBtn").classList.toggle("off",!SV.music);SFX.click()};

$("playBtn").onclick=()=>{ac();SFX.click();const go=()=>openChapter(Math.min(SV.unlocked,LV.length)-1);if(!SV.seen)showStory(go);else go()};
$("storyBtn").onclick=()=>{ac();SFX.click();showStory(null)};
$("sanctBtn").onclick=()=>{SFX.click();openSanct("menu")};

$("stSkip").onclick=()=>{SFX.click();endStory()};
$("chGo").onclick=()=>{ac();SFX.click();startLevel(pendingLevel,SV.diff);const L=LV[pendingLevel];const h=t("h")[pendingLevel+1];if(h){$("hint").textContent=h;hintT=5}};
$("rAgain").onclick=()=>{SFX.click();openChapter(G.n)};
$("rNext").onclick=()=>{SFX.click();if(G.n>=LV.length-1)toMenu();else openChapter(G.n+1)};

$("reGo").onclick=()=>{SFX.click();startLevel(G.n,G.diff)};
$("reMenu").onclick=()=>{SFX.click();toMenu()};
$("sBack").onclick=()=>{SFX.click();if(sanctBack==="result"&&G){setScreen("result")}else toMenu()};

/* ---------- test hook ---------- */
window.__crossing={
  state(){return{screen,paused,level:G?G.n+1:0,hearts:G?G.hearts:0,hits:G?G.hits:0,r:G?G.r:0,px:G?G.px:0,rows:G?G.rows.length:0,gstate:G?G.state:"",diff:G?G.diff:SV.diff,rescued:SV.rescued.slice(),unlocked:SV.unlocked,stars:SV.stars,types:G?G.rows.map(r=>r.t).join(""):"",S,careNeed:care&&care.list[care.i]?care.list[care.i].k:null}},
  start(n,diff){startLevel((n||1)-1,diff||SV.diff)},
  hop:hopDir,
  step(sec){const n=Math.max(1,Math.round(sec/.02));for(let i=0;i<n;i++)update(.02)},
  win(){if(G&&G.state==="play"){G.r=G.rows.length-1;G.hop=null;win()}},
  lose(){if(G){G.hearts=1;G.inv=0;G.hop=null;G.state="play";hurt()}},
  place(c,r){if(G){G.px=c;G.r=r;G.hop=null;G.ride=null;G.inv=0;G.state="play"}},
  rowInfo(r){return G&&G.rows[r]},
  putCarOnPlayer(){if(!G)return false;const row=G.rows[G.r];if(row.t!=="r")return false;const o=row.objs[0];const LL=COLS+6;o.x0=(((G.px-.2+3-row.dir*row.speed*time)%LL)+LL)%LL;G.inv=0;return true},
  putPlatformUnder(){if(!G)return false;const row=G.rows[G.r];if(row.t!=="w")return false;const o=row.objs[0];const LL=COLS+6;o.x0=(((G.px-.5+3-row.dir*row.speed*time)%LL)+LL)%LL;return true},
  clearPlatforms(r){if(G)G.rows[r].objs.length=0},
  careTap,careDone(){if(!care)return;const keys=care.list.slice();keys.forEach(c=>{for(let i=0;i<c.n;i++)careTap(c.k)})},
  openChapter,toMenu,openSanct,showStory,setPause:pauseToggle,zoo:zooGet,lang:l=>{lang=l;applyLang()},save:()=>SV
};

buildLangs();applyLang();resize();
