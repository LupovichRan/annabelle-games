*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Rubik",Arial,sans-serif;background:#eef3ff;color:#23263a;font-size:16px;line-height:1.4;padding:10px 10px calc(24px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
main{max-width:760px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 6px}
p{margin:4px 0}.sm{font-size:13px;color:#565b73}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:#fff;border:2px solid #23263a;border-radius:14px;padding:10px 12px;margin:10px 0;box-shadow:0 3px 0 rgba(35,38,58,.85)}
button,a.b{font:inherit;font-weight:800;min-height:44px;border:2px solid #23263a;border-radius:11px;background:#fff;color:#23263a;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 #23263a;touch-action:manipulation;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #23263a}
button.on{background:#ffd95a}button.go{background:#8fe3a2}button[disabled]{opacity:.45;box-shadow:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#voices{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
#voices td,#voices th{border-bottom:1px solid #d9def0;padding:4px 3px;text-align:start;vertical-align:top}
#voices tr.pick td{background:#fff3c4;font-weight:800}
.tblw{max-height:240px;overflow:auto;border:1px solid #d9def0;border-radius:8px}
.txt{font-size:22px;font-weight:700;line-height:1.7;margin:4px 0;padding:4px 8px;border-radius:8px;background:#f6f8ff}
.txt.pl{font-size:18px;color:#3c4160}
.txt .w.rd{background:#ffe27a;border-radius:6px;box-shadow:0 0 0 3px #ffe27a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{border:1px dashed #9aa3c7;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0}
.cell .play{width:100%;font-size:14px;padding:4px 6px}
.cell .v{display:flex;gap:5px}.cell .v button{flex:1;min-width:44px;padding:4px 2px;font-size:14px}
.sent{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#565b73;direction:rtl;unicode-bidi:plaintext;min-height:1em;margin-top:4px}
#sum{font-weight:800}
pre{white-space:pre-wrap;font-size:12px;background:#f6f8ff;border-radius:8px;padding:8px;margin:6px 0;max-height:220px;overflow:auto;direction:ltr;text-align:left}
[dir=ltr] .txt{direction:rtl;text-align:right}
.txt.lat{direction:ltr;text-align:left}
</style>
