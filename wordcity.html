.tile{min-width:54px;min-height:56px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);background:#ffe9a8;font-weight:900;font-size:28px;padding:2px 12px;transition:transform .06s;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;touch-action:none}

function toMenu(){clearTimeout(pendT);if(R)R.done=true;Q=null;TTS.stop();closeAll();$('banner').classList.remove('on');$('fx').textContent='';renderMenu();show('scMenu')}
window.toMenu=toMenu;
function openMap(){const g=$('mapGrid');g.textContent='';let curSet=false;
 for(let d=0;d<4;d++){const ids=NODES.filter(n=>(n.t==='p'&&(n.p/4|0)===d)||(n.t==='b'&&n.d===d)),sum=ids.reduce((a,n)=>a+starOf(n.id),0);
  const bl=h('div',{cls:'blds'});ids.forEach(nd=>{const i=NODES.indexOf(nd),un=unlocked(i),st=starOf(nd.id),boss=nd.t==='b',pk=boss?null:PACKS[nd.p];let cl='bld'+(boss?' boss':'')+(!un?' lock':st?' done':' todo');if(un&&!st&&!curSet){cl+=' cur';curSet=true}
   const stars=h('i',null,st?['★'.repeat(st),h('u',{text:'★'.repeat(3-st)})]:[un?'🚧':'🔒']);
   bl.appendChild(h('button',{cls:cl,'data-node':i,'aria-label':boss?t('boss'):pname(pk),click:()=>{gest=true;if(!un){SFX.bad();pop('🔒');banner(t('locked'));return}SFX.click();startRound('city',i)}},[h('b',{text:boss?(st?'🏆':'👾'):pk.e}),h('span',{text:boss?t('boss'):pname(pk)}),stars]))});
  g.appendChild(h('div',{cls:'dist'},[h('h3',null,[h('span',{text:t('dist')+' '+(d+1)}),h('span',{dir:'ltr',text:'⭐ '+sum+'/15'})]),bl]))}
 show('scMap');const c=g.querySelector('.cur');if(c&&c.scrollIntoView)try{c.scrollIntoView({block:'center'})}catch(e){}}
function openBook(){const l=$('bookList');l.textContent='';$('bookHead').textContent=t('bookC',{a:seenCount(),b:W.length});
 PACKS.forEach(pk=>{const n=pk.words.filter(w=>SV.m[w.w]).length,g=h('div',{cls:'wgrid'});
  pk.words.forEach(w=>{const r=SV.m[w.w],num=/^[0-9=½]+$/.test(w.e);if(!r){g.appendChild(h('div',{cls:'wchip un'},[h('b',{text:'❔'}),h('span',{text:'· · ·'})]));return}
   const b=h('button',{cls:'wchip',click:()=>{gest=true;TTS.say(w.w,true);[].forEach.call(l.querySelectorAll('.wchip.say'),x=>x.classList.remove('say'));b.classList.add('say');if(lang!=='en'&&!b.querySelector('small'))b.appendChild(h('small',{cls:'tr',dir:lang==='he'?'rtl':'ltr',text:w[lang]}))}},[h('b',{cls:num?'num':'',text:w.e}),en(w.w),h('i',null,['●'.repeat(r[0]+1),h('u',{text:'●'.repeat(4-r[0])})])]);g.appendChild(b)});
  l.appendChild(h('div',{cls:'bk'},[h('h3',null,[h('span',{text:pk.e+' '+pname(pk)}),h('span',{dir:'ltr',text:n+'/'+pk.words.length})]),g]))});
 show('scBook');l.scrollTop=0}
function renderRes(res){const c=$('cRes');c.textContent='';const sp=res.mode==='speed',boss=R.node&&R.node.t==='b';let next=-1;
 if(sp){c.appendChild(h('div',{cls:'huge',text:'⚡'}));c.appendChild(h('h2',{text:t('timeUp')}));const sc=h('p',{cls:'scl'});c.appendChild(sc);countUp(sc,res.score,'⭐ ');
  if(res.rec){c.appendChild(h('div',{cls:'rec',text:'★ '+t('newRec')+' ★'}))}
  let mark=false;c.appendChild(h('div',{cls:'hs'},[h('div',{cls:'hsT',text:t('hiT')})].concat(SV.hi.map((x,i)=>{const me=!mark&&x.s===res.score&&res.score>0;if(me)mark=true;return h('div',{cls:'hsR'+(me?' cur':'')},[h('span',{text:(i+1)+'.'}),h('span',{text:String(x.s)}),h('span',{text:x.d})])}))));
  if(res.rec||res.score>=100){SFX.win();confetti();flash()}}
 else{const st=res.st;c.appendChild(h('div',{cls:'huge',text:st<=0?'💪':boss?'🏆':res.mode==='daily'?'📅':PACKS[R.node.p].e}));
  c.appendChild(h('h2',{text:st<=0?t('r0'):t('r'+st)}));
  const sr=h('div',{cls:'stars'});for(let i=0;i<3;i++){const s=h('span',{cls:i<st?'':'off',text:'⭐'});s.style.animationDelay=(.25+i*.3)+'s';sr.appendChild(s);if(i<st)setTimeout(()=>SFX.star(i),250+i*300)}c.appendChild(sr);
  c.appendChild(h('p',{text:t('of',{a:res.first,b:res.n})+(res.nw?' · '+t('nw',{n:res.nw}):'')}));
  if(st>0){if(res.mode==='daily'){c.appendChild(h('p',{text:t('dailyDone')}));c.appendChild(h('p',{text:'🔥 '+(streakNow()>1?t('streak',{n:streakNow()}):'1')}))}else c.appendChild(h('p',{text:boss?t('bossWin'):res.firstClear?'🏗️ '+t('built'):''}));
   setTimeout(()=>{SFX.win();confetti();if(st===3||boss)flash()},350)}
  if(res.mode==='city'&&st>0&&R.ni+1<NODES.length)next=R.ni+1}
 if(next>=0)c.appendChild(h('button',{cls:'btn g',id:'rNext',text:t('next'),click:()=>{SFX.click();startRound('city',next)}}));
 c.appendChild(h('button',{cls:'btn'+(next>=0?' w':' g'),id:'rAgain',text:'↻ '+t('again'),click:()=>{SFX.click();startRound(R.mode,R.ni)}}));
 if(res.mode==='city')c.appendChild(h('button',{cls:'btn w',id:'rMap',text:'🏙️ '+t('map'),click:()=>{SFX.click();closeAll();openMap()}}));
 c.appendChild(h('button',{cls:'btn w',id:'rMenu',text:'☰ '+t('menu'),click:()=>{SFX.click();toMenu()}}));
 $('ovRes').classList.add('on')}
function pause(){if(!R||R.done||R.paused||cur!=='scPlay')return;R.paused=true;TTS.stop();const c=$('cPause');c.textContent='';c.appendChild(h('h2',{text:'⏸ '+t('paused')}));
 c.appendChild(h('button',{cls:'btn g',id:'pRes',text:'▶ '+t('resume'),click:()=>{SFX.click();resume()}}));c.appendChild(h('button',{cls:'btn w',id:'pQuit',text:'☰ '+t('quit'),click:()=>{SFX.click();toMenu()}}));c.appendChild(h('div',{id:'navSlot'}));$('ovPause').classList.add('on')}
function resume(){if(R)R.paused=false;$('ovPause').classList.remove('on')}
setInterval(()=>{if(!R||R.done||R.mode!=='speed'||R.paused||!Q||Q.done||teachOpen||cur!=='scPlay')return;R.time-=100;const p=$('pTime');if(p){p.textContent='⏱ '+Math.max(0,Math.ceil(R.time/1000));p.classList.toggle('low',R.time<=10000)}if(R.time<=0)finish()},100);

/* ---- input ---- */
$('bBack').onclick=()=>{gest=true;SFX.click();if(cur==='scPlay')pause();else toMenu()};
function applyMute(){$('bMute').textContent=muted?'🔇':'🔊';$('bMute').classList.toggle('off',muted);$('bMus').classList.toggle('off',!music||muted)}
$('bMute').onclick=()=>{gest=true;muted=!muted;ls.set('annabelle-muted',muted?'1':'0');if(muted)TTS.stop();applyMute();SFX.click()};
$('bMus').onclick=()=>{gest=true;music=!music;SV.mu=music?1:0;save();applyMute();SFX.click()};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{gest=true},true));
document.addEventListener('visibilitychange',()=>{if(document.hidden){TTS.stop();pause()}});
addEventListener('pagehide',()=>TTS.stop());
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key,inp=e.target&&e.target.tagName==='INPUT';
 if(k==='Escape'){if(R&&R.paused)resume();else if(cur==='scPlay')pause();return}
 if($('ovRes').classList.contains('on')||$('ovPause').classList.contains('on')){return}
 if(teachOpen){if(k==='Enter'||k===' '){e.preventDefault();nextQ()}return}
 if(cur!=='scPlay'||!Q||Q.done)return;
 if(Q.kind==='type'){if(k==='Enter'){e.preventDefault();checkType()}return}
 if(inp)return;
 if(Q.kind==='choice'){const n=+k;if(n>=1&&n<=Q.opts.length){e.preventDefault();choose(n-1)}else if((k==='p'||k==='P'))pause();return}
 if(Q.kind==='tiles'&&!Q.wordT&&k.length===1&&/[a-z]/i.test(k)){const b=Q.tileEls.filter(x=>!x.classList.contains('used')&&x._tx.toLowerCase()===k.toLowerCase())[0];if(b){e.preventDefault();tapTile(b)}}});

/* ---- test hook ---- */
function flushPend(){if(teachOpen||pendT){nextQ()}}
window.__wordcity={
 state(){return{screen:cur,lang:lang,level:EL(),base:baseLevel(),young:isYoung(),tts:TTS.ok,said:TTS.log,mode:R?R.mode:null,done:R?R.done:true,paused:R?R.paused:false,i:R?R.i:0,total:R?R.T.length:0,ok:R?R.ok:0,first:R?R.first:0,combo:R?R.combo:0,score:R?R.score:0,time:R?R.time:0,dif:R?R.dif:0,teach:teachOpen,res:R?R.res||null:null,stars:JSON.parse(JSON.stringify(SV.stars)),best:SV.best,hi:SV.hi.slice(),streak:SV.streak.slice(),words:Object.keys(SV.m).length}},
 start(mode,node){gest=true;if(mode==='city')startRound('city',node||0);else startRound(mode==='daily'?'daily':'speed');return true},
 item(){if(!Q)return null;const o={skill:Q.skill,kind:Q.kind,word:Q.w?Q.w.w:null,answer:Q.answer,level:Q.level,done:Q.done};if(Q.opts){o.options=Q.opts.map(x=>x.label);o.correct=Q.opts.findIndex(x=>x.ok)}if(Q.kind==='tiles'){o.units=Q.units.slice();o.tiles=Q.tiles.slice();o.pos=Q.pos}if(Q.kind==='pairs')o.pairs=Q.pairs.map(p=>[p.w.w,p.label]);if(Q.sent)o.sentence=Q.sent.en;return o},
 answer(ok){flushPend();if(!Q||Q.done||!R||R.done)return false;if(Q.kind==='choice'){const i=Q.opts.findIndex(x=>!!x.ok===!!ok);choose(i<0?0:i)}else{if(Q.kind==='pairs'&&ok!==false)Q.pairs.forEach(p=>{if(learn(p.w,true))R.nw++});resolve(!!ok)}return true},
 next(){flushPend()},
 win(){let g=0;while(R&&!R.done&&g++<300){flushPend();if(!R||R.done)break;if(R.mode==='speed'&&g>12){R.time=0;finish();break}this.answer(true)}flushPend();return R?R.res:null},
 lose(){if(!R||R.done)return null;clearTimeout(pendT);closeTeach();if(R.mode==='speed'){R.time=0}else{R.base=Math.max(R.base,R.n0);R.first=0}finish();return R.res},
 setTime(ms){if(R)R.time=ms}, pause:pause,resume:resume,toMenu:toMenu,openMap:openMap,openBook:openBook,setLang(l){setLang(l);renderMenu();hud()},
 cfg(o){for(const k in o)CFG[k]=o[k];TTS.scan();return CFG},
 gen(word,skill){const w=WMAP[word];return w?makeWordQ(w,{},skill):null},skills(word,ctx){const w=WMAP[word];return w?skillsFor(w,ctx||{}).map(x=>x[0]):[]},
 genPairs(pi){return makePairsQ(PACKS[pi].words)},genSent(i){return makeSentQ(SENT[i])},genGram(i){return makeGramQ(GRAM[i])},
 save(){return SV},reload(){SV=load();renderMenu()},
 data:{W:W,PACKS:PACKS,SENT:SENT,GRAM:GRAM,OPP:OPP,NODES:NODES}};

/* ---- boot ---- */
setLang(lang);applyMute();renderMenu();show('scMenu');
addEventListener('load',()=>{TTS.scan();if(cur==='scMenu')renderMenu()});
})();
