<style>
:root{--ink:#2b2140;--y:#ffe14d;--pk:#ff5fa2;--top:max(8px,env(safe-area-inset-top));--bot:max(12px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:#2f9e5a;font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew",Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button,a{font-family:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation;text-decoration:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.ib{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 4px 0 #0004;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;padding:0;transition:transform .06s}

.pill{background:#fffe;color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:900;font-size:clamp(15px,4.3vw,20px);box-shadow:0 3px 0 #0003;white-space:nowrap;height:40px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.pill:empty{display:none}
.grow{flex:1}
#posBox{position:absolute;top:calc(var(--top) + 54px);left:12px;font-weight:900;line-height:1;display:flex;align-items:baseline;gap:1px;transform-origin:left top}
#posBox.bump{animation:bump .35s}
body.tt #posBox{display:none}
@keyframes bump{40%{transform:scale(1.35) rotate(-6deg)}}
#posN{font-size:66px;color:var(--y);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 #0005}
#posOf{font-size:24px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#mini{position:absolute;top:calc(var(--top) + 54px);right:8px;width:104px;height:104px;border-radius:18px;background:#0005;border:2px solid #fff6}
.desk #mini{width:170px;height:170px}
#olBar{position:absolute;top:calc(var(--top) + 54px);left:50%;transform:translateX(-50%);display:none;background:#2b2140d9;border:2px solid #fff5;border-radius:999px;padding:3px 12px;font-weight:900;font-size:15px;white-space:nowrap;gap:6px;align-items:center}
body.ol #olBar{display:flex}
#olBar b{color:var(--y);font-size:19px;font-variant-numeric:tabular-nums}
body #n1Weak{top:calc(var(--top) + 96px)}
#endCd{position:absolute;top:calc(var(--top) + 130px);left:50%;transform:translateX(-50%);background:#e63946;border-radius:999px;padding:3px 12px;font-weight:900;font-size:15px;white-space:nowrap;display:none}
#endCd.on{display:block}
/* phones: the place number sits on the left and the mini-map on the right.  The score bar lives in the gap between them; the weak-connection pill
   (long sentences, 2-3 lines) takes that same slot while it shows (body.wk hides the score for those seconds); the red pill goes under the place number, left of the map.
   Online the place number "bumps" around its own centre and a little less, so that it never jumps onto these pills. */
@keyframes bumpS{40%{transform:scale(1.2) rotate(-6deg)}}
@media (max-width:699px){
#olBar{left:82px;right:116px;transform:none;margin:0 auto;width:fit-content;max-width:calc(100% - 198px);font-size:clamp(12px,3.8vw,15px)}
#olFr{min-width:0;overflow:hidden;text-overflow:ellipsis}
body.wk #olBar{display:none}
body #n1Weak{top:calc(var(--top) + 54px);left:82px;right:116px;transform:none;margin:0 auto;width:fit-content;font-size:clamp(12px,3.7vw,14px);line-height:1.25}
#endCd{top:calc(var(--top) + 132px);left:8px;right:120px;transform:none;margin:0 auto;width:fit-content;font-size:clamp(12px,3.4vw,15px);white-space:normal;text-align:center}
body.ol #posBox{transform-origin:center}body.ol #posBox.bump{animation-name:bumpS}
.desk #olBar,.desk body #n1Weak{right:182px}.desk #olBar{max-width:calc(100% - 264px)}.desk #endCd{right:186px}
}
@media (max-width:340px){#olBar{padding:3px 6px;gap:3px}#olBar b{font-size:16px}}

.steer{width:92px;height:92px;border-radius:28px;background:#fff3;border:3px solid #fffa;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;transition:transform .05s,background .05s;text-shadow:0 2px 0 #0006}
.steer.on{background:#ffe14de6;transform:scale(.92);color:var(--ink);text-shadow:none}
.desk .steer{display:none}.desk #ctl{justify-content:flex-end;padding:0 26px}
#itemWrap{display:flex;flex-direction:column;align-items:center;gap:8px}
#itemBtn{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe9a8);border:5px solid #ff9f1c;box-shadow:0 6px 0 #0006;font-size:46px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);position:relative;transition:transform .06s}

#emo{display:none;gap:4px}

@keyframes popA{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.18) rotate(3deg)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.05)}}
#cd{position:absolute;left:0;right:0;top:max(30%,calc(var(--top) + 240px));text-align:center;font-weight:900;font-size:clamp(110px,34vw,190px);line-height:1;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 #0006;pointer-events:none}

@keyframes cdA{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:.0;transform:scale(.7)}}
@keyframes cdG{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.25);opacity:1}70%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
#banner{position:absolute;left:50%;top:max(21.5%,calc(var(--top) + 166px));width:min(92%,420px);transform:translate(-50%,0) translateX(-130vw);background:linear-gradient(#fff,#fff0c9);color:var(--ink);border:4px solid var(--ink);box-shadow:0 6px 0 #0006;border-radius:20px;padding:8px 12px;text-align:center;font-weight:900;font-size:clamp(18px,5.4vw,26px);pointer-events:none}
#banner small{display:block;font-size:.68em;opacity:.8}
#banner.on{transition:transform .42s cubic-bezier(.2,1.3,.4,1);transform:translate(-50%,0)}

.desk #banner{top:11%}
html[lang=he] #banner,html[lang=he] #tip,html[lang=he] #pop,html[lang=he] #cd,html[lang=he] #endCd,html[lang=he] #wrong,html[lang=he] #olBar{direction:rtl}
#wrong{position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:900;font-size:30px;color:#fff;-webkit-text-stroke:2px #e63946;paint-order:stroke fill;display:none;animation:blink .5s infinite alternate}

@keyframes blink{to{opacity:.35}}
#tip{position:absolute;left:8px;right:8px;bottom:calc(var(--bot) + 104px);text-align:center;font-weight:800;font-size:14px;background:#2b2140d9;border-radius:16px;padding:6px 10px;line-height:1.35;display:none;max-width:520px;margin:0 auto}

.desk #tip,.desk body.ol #tip{left:16px;right:auto;bottom:16px;margin:0;max-width:430px}
#tip.on{display:block}
@media (orientation:landscape) and (max-height:520px){html:not(.desk) #tip,html:not(.desk) body.ol #tip{left:8px;right:auto;bottom:6px;max-width:34vw;font-size:10px;line-height:1.2;padding:3px 8px}html:not(.desk) #tip div:nth-child(2){display:none}} /* sideways phones: small corner note, never over the kart */
@media (max-height:600px) and (orientation:portrait){html:not(.desk) #tip,html:not(.desk) body.ol #tip{font-size:10.5px;line-height:1.2;padding:3px 8px;bottom:calc(var(--bot) + 96px)}html:not(.desk) #tip div:nth-child(2){display:none}}   /* 320x568: a short tip (the skid line is left out) that stays below the kart */
@media (max-height:789px) and (orientation:portrait){html:not(.desk) body.ol #tip{bottom:calc(var(--bot) + 104px)}html:not(.desk) body.ol #tip.on~#ctl #emo{display:none}html:not(.desk) body.ol #tip.on~#ctl #itemWrap{min-width:196px}}
#bub{position:absolute;left:0;top:0;font-size:44px;pointer-events:none;opacity:0;will-change:transform}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:9px;padding:var(--top) 10px var(--bot);z-index:40;overflow-y:auto;touch-action:pan-y;background:#1a1035a8;text-align:center}

#pause{z-index:41}

#menu{background:linear-gradient(#1a103566,#1a1035c4)}
h1{margin:0;font-size:clamp(30px,9.2vw,50px);line-height:1.05;color:var(--y);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 #0007;font-weight:900;animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px) rotate(-1.2deg)}}
#prev{width:230px;height:104px;flex:none}
.col{display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);flex:none}
.btn{min-height:54px;border-radius:18px;font-weight:900;font-size:clamp(18px,5.2vw,22px);padding:6px 14px;width:100%;color:#fff;background:linear-gradient(#ff9a3d,#f25c05);box-shadow:0 5px 0 #a33a00;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s;flex:none}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #a33a00}
.btn.g{background:linear-gradient(#5fd38d,#22a35a);box-shadow:0 5px 0 #14703b}.btn.g:active{box-shadow:0 1px 0 #14703b}
.btn.b{background:linear-gradient(#5db7ff,#2176d9);box-shadow:0 5px 0 #124f99}.btn.b:active{box-shadow:0 1px 0 #124f99}
.btn.p{background:linear-gradient(#b78bff,#7c4dff);box-shadow:0 5px 0 #4a27b0}.btn.p:active{box-shadow:0 1px 0 #4a27b0}
.btn.s{background:linear-gradient(#8f9bb3,#5d6b85);box-shadow:0 5px 0 #3c475c}.btn.s:active{box-shadow:0 1px 0 #3c475c}
.btn.sm{min-height:48px;font-size:17px}
.btn[disabled]{opacity:.5}
.seg{display:flex;gap:6px;width:min(92vw,380px);flex:none}
.seg button{flex:1;min-height:48px;border-radius:14px;background:#fff3;color:#fff;font-weight:900;font-size:clamp(13px,3.7vw,16px);border:2px solid #fff6;padding:2px 4px}
.seg button.on{background:var(--y);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 #0005}
.card .seg{width:100%}.card .seg button{background:#2b214018;color:var(--ink);border-color:#2b214044}.card .seg button.on{background:var(--y);border-color:var(--ink)}
#hiBox{width:min(92vw,380px);background:#150c2ecc;border:2px solid #fff3;border-radius:16px;padding:6px 10px;font-weight:800;font-size:14px;flex:none}
#hiBox h3,.hi h3{margin:0 0 3px;font-size:15px;color:var(--y);letter-spacing:.06em}
.hirow{display:flex;justify-content:space-between;gap:8px;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.5}
.hirow.new{color:#ff5fa2;animation:blink .4s infinite alternate}
.langs{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;flex:none}
#flags{display:flex;gap:6px}
#flags button{min-width:48px;height:48px;border-radius:14px;background:#fff;color:var(--ink);font-weight:900;font-size:14px;box-shadow:0 3px 0 #0004;padding:0 8px}
#flags button.on{background:var(--y);outline:3px solid var(--ink)}
.card{background:linear-gradient(#fff,#fff3d6);color:var(--ink);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 #0006;padding:12px;width:min(95vw,470px);display:flex;flex-direction:column;gap:8px;align-items:center;flex:none}
.card h2{margin:0;font-size:clamp(22px,6.4vw,30px);font-weight:900;line-height:1.1}
.card p{margin:0;font-weight:700;font-size:16px;line-height:1.35}
.big{font-size:64px;line-height:1}
.rowb{display:flex;gap:8px;width:100%}.rowb .btn{flex:1;width:auto;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.desk .tiles{grid-template-columns:repeat(3,1fr)}
.tile{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:14px;color:var(--ink);box-shadow:0 4px 0 #0003;min-height:48px;transition:transform .06s;position:relative}

.tile.on{background:#fff3b0;outline:3px solid #ff9f1c}
.cupc{width:100%;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:center;color:var(--ink);font-weight:900;font-size:19px;box-shadow:0 4px 0 #0003;transition:transform .06s}
.cupc:active{transform:translateY(3px) scale(.98)}
.cupc.lock{filter:grayscale(.9);opacity:.6}
.cupc .trs{display:flex;gap:6px;justify-content:center}
.cupc canvas{width:72px;height:72px;border-radius:10px}
.cupc small{font-size:13px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
.chips.d3{max-width:212px}.desk .chips.d3{max-width:none}
.chip{width:min(62px,calc((100% - 24px)/5));aspect-ratio:1;flex:none;border-radius:16px;background:#fff;border:3px solid #2b214055;padding:0;position:relative;display:flex;align-items:center;justify-content:center}

.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;width:100%;font-size:13px;font-weight:800;align-items:center}
.bars i{display:block;height:10px;border-radius:6px;background:#2b214022;overflow:hidden}.bars i b{display:block;height:100%;background:linear-gradient(90deg,#ff9f1c,#ff5fa2);border-radius:6px}
.rlist{width:100%;display:flex;flex-direction:column;gap:4px}
.rrow{display:flex;align-items:center;gap:8px;background:#2b214012;border-radius:12px;padding:4px 10px;font-weight:900;font-size:16px;direction:ltr}
.rrow.me{background:#ffe14d;outline:2px solid var(--ink)}
.rrow.fr{background:#ffd1e6}
.rrow .n{width:22px;text-align:center}.rrow .nm{flex:1;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rrow .tm{font-variant-numeric:tabular-nums;font-size:14px}

.stars{font-size:38px;letter-spacing:4px;line-height:1}

.stars span.on{opacity:1;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}

.newrec{color:#e0245e;font-weight:900;font-size:20px;animation:blink .35s infinite alternate}
.unl{width:100%;background:linear-gradient(#fff3b0,#ffd96b);border:3px dashed #ff9f1c;border-radius:18px;padding:6px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;animation:starIn .6s both}

.hi{width:100%;background:#2b2140;color:#fff;border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px}
.wins{font-size:24px;font-weight:900;display:flex;gap:10px;align-items:center;justify-content:center}
.wins b{font-size:34px;color:#e0245e}
.n1card .n1b{width:auto;min-width:0;max-width:100%}

<body>

<div id="hud">
  <div id="topbar"><button class="ib" id="pauseBtn" aria-label="pause">⏸</button><div class="pill" id="lapP"></div><div class="pill" id="timeP"></div><div class="grow"></div><button class="ib" id="muteBtn" aria-label="mute">🔊</button></div>

 if(ty==='cd'){if(!NT.host&&isInt(d.r,0,2)&&d.r===OL.r)olCount();return}
 if(ty==='rd'){if(NT.host||!isInt(d.r,1,2))return;const w=Array.isArray(d.w)&&d.w.length===2&&isInt(d.w[0],0,2)&&isInt(d.w[1],0,2)&&d.w[0]+d.w[1]===d.r?d.w:null;
  if(d.r===OL.r+1&&!OL.done){if(w)OL.w=w.slice();olLoad(d.r)}else if(d.r===OL.r&&OL.ph==='wait'){if(w)OL.w=w.slice();NT.send({t:'rdy',r:OL.r,d:selD(),k:selK()})}return}

 if(OL.ph==='race'&&NT.host&&now-OL.syT>4000){OL.syT=now;olSnapshot()}   // hazards heal after a stall: the guest rebuilds hers from this snapshot (item / hazard-removed messages lost in a dropped tail)
 if(OL.ph==='race'&&!NT.host&&G.me&&G.me.laps.length&&now-OL.lapT>1000){OL.lapT=now;olSendLaps()}   // lap times again and again (cumulative, the referee takes each lap once): a claim lost in a burst after a stall heals within a second
