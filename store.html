/* The game shop: pick which games live on the home screen. Everything is free; "getting" a game only adds it to the kid's library
   (catalog.js, localStorage 'annabelle-library'). This page is also the reference for the calm look – the rules are in docs/CALM-UI.md:
   one accent colour, flat white cards on a warm paper background, the emoji is the only colour of a tile, no looping motion, one list at a time. */
:root{--bg:#f5f2ec;--card:#fff;--ink:#2b3140;--soft:#5a6272;--line:#e3ded4;--acc:#34639f;--acc-d:#284f82;--tint:#e8eef7;--ok:#2c6e52;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{background:var(--bg)}
body{font-family:"Rubik","Varela Round","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;color:var(--ink);background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));overflow-x:hidden;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}
button,a{cursor:pointer;touch-action:manipulation}
button{border:0;background:none;padding:0;margin:0}
h1,h2,p,ul{margin:0;padding:0}ul{list-style:none}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:12px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
/* header */
.top{display:flex;align-items:center;gap:14px}
.home{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:16px;flex:none}
.top h1{font-size:24px;line-height:1.2;font-weight:700}
.top p{color:var(--soft);font-size:15px}
/* tabs: one view at a time */
.tabs{display:flex;gap:4px;background:#ebe6dc;border-radius:var(--r);padding:4px}
.tab{flex:1 1 auto;min-height:48px;border-radius:13px;font-weight:600;font-size:16px;color:var(--soft);padding:4px 8px;line-height:1.2;white-space:nowrap}
@media (max-width:379px){.tab{font-size:15px;padding:4px 5px}}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #2b314022}
/* text blocks */
.count{font-size:19px;font-weight:700}
.guide{color:var(--soft);font-size:15px;margin-top:2px}
h2{font-size:18px;font-weight:700;margin-top:6px}
.note{color:var(--soft);font-size:15px}
/* buttons */
.btn{min-height:52px;border-radius:var(--r);padding:8px 18px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.pri{background:var(--acc);color:#fff}
.btn.pri:active{background:var(--acc-d)}
.btn.sec{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.sec:active{background:var(--tint)}
.btn.sec[aria-pressed=true]{background:var(--tint);border-color:var(--acc)}
.btn[disabled]{opacity:.6;cursor:default}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1 1 150px;padding:8px 10px}
/* lists */
.list{display:grid;grid-template-columns:1fr;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;text-align:start}
button.row:active{background:var(--tint)}
.chip{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;line-height:1}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row.ar{flex-wrap:wrap}.row.ar .tx{flex:1 1 130px}
.ctl{display:flex;gap:8px;margin-inline-start:auto}
.nm{font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:break-word}
.mt{color:var(--soft);font-size:14px;line-height:1.3}
.st{color:var(--ok);font-size:14px;font-weight:600;flex:none;white-space:nowrap}
.go{color:var(--soft);font-size:20px;flex:none;line-height:1}
.leaf{letter-spacing:-2px;white-space:nowrap}.leaf i{font-style:normal;opacity:.22;filter:grayscale(1)}.leaf i.f{opacity:1;filter:none}
.mini{width:44px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:17px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center}
.mini.rm{width:auto;padding:0 12px;font-size:15px;font-weight:600}
.mini:active{background:var(--tint)}
.mini[disabled]{opacity:.3;cursor:default}
/* packs */
.pack{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.pack .hd{display:flex;align-items:center;gap:12px}
.pack .in{color:var(--soft);font-size:14px}
.pack .btn{min-height:48px;font-size:16px}
/* browse */
.search{display:flex;align-items:center;gap:8px;min-height:52px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;min-width:0;border:0;background:none;min-height:48px;font-size:17px;-webkit-user-select:text;user-select:text}
.search input:focus-visible{outline:none}
.search input::-webkit-search-cancel-button{display:none}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc{min-height:48px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:15px;padding:4px 6px;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:5px}
.cc[aria-pressed=true],.cc[aria-selected=true]{background:var(--tint);border-color:var(--acc);color:var(--acc-d)}
.fl{grid-template-columns:repeat(4,1fr)}
.fl .cc{flex-direction:column;gap:0;font-size:13px;min-height:54px}
.fl .cc span{font-size:18px;line-height:1.1}
.lbl{color:var(--soft);font-size:14px;font-weight:600;margin-bottom:-10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
/* footer: calm mode */
.foot{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:12px}
.foot .tx b{font-weight:600}
.sw{width:64px;height:44px;border-radius:999px;background:#c9c3b7;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:5px;inset-inline-start:5px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true]::after{inset-inline-start:25px}

.bar{position:fixed;inset-inline:0;bottom:calc(12px + env(safe-area-inset-bottom));margin:0 auto;width:min(calc(100% - 24px),520px);background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;z-index:20;font-size:15px}
[dir=rtl] .bar{padding:8px 14px 8px 8px}
.bar span{flex:1;min-width:0}
.bar button{min-height:44px;min-width:44px;border-radius:12px;padding:0 12px;font-weight:700;color:#fff}
.bar .un{background:#ffffff22}
.bar :focus-visible{outline-color:#fff}
/* detail sheet */
.back{position:fixed;inset:0;background:#2b314066;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:calc(100dvh - 24px);overflow:auto;border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;position:relative}
.sheet .x{position:absolute;top:10px;inset-inline-end:10px;width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.art{width:112px;height:112px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1;align-self:center;margin-top:6px}
.sheet h2{font-size:22px;text-align:center;margin:0}
.sheet .ds{text-align:center}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:14px;color:var(--soft);display:flex;flex-direction:column;justify-content:center;min-height:62px}
.fact b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{font-size:14px;color:var(--soft);background:#ebe6dc;border-radius:999px;padding:3px 10px}
.msg{text-align:center;color:var(--ok);font-weight:600;min-height:24px}
.sheet .btn{width:100%}
.prog{height:52px;border-radius:var(--r);background:var(--tint);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--acc-d)}
.prog i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:#c5d6ee;transition:width .8s linear}
.prog.go i{width:100%}
.prog span{position:relative}
@media (min-width:760px){
  body{padding-top:20px}
  .list{grid-template-columns:1fr 1fr}
  .chips{grid-template-columns:repeat(6,1fr)}
  .fl{grid-template-columns:repeat(4,1fr)}
  .acts .btn{flex:0 1 240px}
  .back{align-items:center}
  .sheet{border-radius:24px;max-height:calc(100dvh - 32px)}

@media (max-height:700px) and (min-width:760px){.art{width:84px;height:84px;font-size:48px;border-radius:22px}.sheet{gap:9px}}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
html.desk button:hover:not([disabled]),html.desk .home:hover{filter:brightness(.97)}

try{var u=JSON.parse(localStorage.getItem(UK)||'null');if(u&&typeof u==='object'){if(TABS.indexOf(u.tab)>=0)S.tab=u.tab;
 if(C.cats.some(function(c){return c.id===u.cat}))S.cat=u.cat;if(u.f&&typeof u.f==='object')FILTERS.forEach(function(k){if(u.f[k]===1)S.f[k]=1})}}catch(e){}
function remember(){try{localStorage.setItem(UK,JSON.stringify({tab:S.tab,cat:S.cat,f:S.f}))}catch(e){}}
C.ensure();

var view=D.getElementById('view'),tabsEl=D.getElementById('tabs'),bar=D.getElementById('bar'),back=D.getElementById('back'),sheet=D.getElementById('sheet');
D.title=TX.title;D.getElementById('ttl').textContent=TX.title;D.getElementById('sub').textContent=TX.sub;D.getElementById('homeT').textContent=TX.home;

/* ---------- pieces ---------- */
function chip(g,cls){var c=el('span',cls||'chip',g.emo);c.style.background=tint(g.grad[0]);c.setAttribute('aria-hidden','true');return c}
function leaves(g){/* more leaves = calmer */var s=el('span','leaf');s.setAttribute('role','img');s.setAttribute('aria-label',F(TX.leafA,{t:TX.cl[g.calm]}));
 for(var i=0;i<3;i++){var l=el('i',i<4-g.calm?'f':'','🍃');l.setAttribute('aria-hidden','true');s.appendChild(l)}return s}
function gameRow(g,meta,status){var r=btn('row');r.dataset.id=g.id;r.appendChild(chip(g));var tx=el('span','tx');tx.appendChild(el('span','nm',C.name(g.id,LG)));
 if(meta){var m=el('span','mt');if(typeof meta==='string')m.textContent=meta;else m.appendChild(meta);tx.appendChild(m)}r.appendChild(tx);
 if(status)r.appendChild(el('span','st',TX.have));r.onclick=function(){openSheet(g.id,r)};return r}
function paceMeta(g){var f=D.createDocumentFragment();f.appendChild(leaves(g));f.appendChild(D.createTextNode(' '+TX.cl[g.calm]+' · '+F(TX.minsV,{n:g.mins})));return f}

/* ---------- tabs ---------- */
function drawTabs(){tabsEl.textContent='';TABS.forEach(function(t){var b=btn('tab',TX.tabs[t]);b.setAttribute('role','tab');b.id='tab-'+t;b.dataset.tab=t;b.setAttribute('aria-selected',S.tab===t?'true':'false');b.tabIndex=S.tab===t?0:-1;
 b.onclick=function(){setTab(t,true)};tabsEl.appendChild(b)});view.setAttribute('aria-labelledby','tab-'+S.tab)}
tabsEl.addEventListener('keydown',function(e){var i=TABS.indexOf(S.tab),d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;if(LG==='he')d=-d;e.preventDefault();setTab(TABS[(i+d+TABS.length)%TABS.length],true)});
function setTab(t,focus){if(TABS.indexOf(t)<0)return;S.tab=t;S.arr=false;remember();draw();if(focus){var b=D.getElementById('tab-'+t);if(b)b.focus()}try{W.scrollTo(0,0)}catch(e){}}

/* ---------- "my games" ---------- */
function drawMine(){var ids=C.lib(),n=ids.length;
 var head=el('div');head.appendChild(el('p','count',n===0?TX.count0:n===1?TX.count1:F(TX.count,{n:n})));head.appendChild(el('p','guide',n>9?TX.gMany:n<6?TX.gFew:TX.gOk));view.appendChild(head);
 var acts=el('div','acts'),more=btn('btn pri','＋ '+TX.more);more.id='more';more.onclick=function(){setTab('you',true)};acts.appendChild(more);
 if(n>0){var ar=btn('btn sec',S.arr?'✓ '+TX.arrDone:'↕ '+TX.arr);ar.id='arr';ar.setAttribute('aria-pressed',S.arr?'true':'false');ar.onclick=function(){S.arr=!S.arr;draw();var b=D.getElementById('arr');if(b)b.focus()};acts.appendChild(ar)}
 view.appendChild(acts);
 var ul=el('ul','list');ul.id='mine';
 ids.forEach(function(id,i){var g=C.byId(id),li=el('li');
  if(!S.arr){li.appendChild(gameRow(g))}
  else{var r=el('div','row ar');r.dataset.id=id;r.appendChild(chip(g));var tx=el('span','tx');tx.appendChild(el('span','nm',C.name(id,LG)));r.appendChild(tx);
   var nm=C.name(id,LG),up=btn('mini up','▲'),dn=btn('mini dn','▼'),rm=btn('mini rm',TX.rm);
   up.setAttribute('aria-label',F(TX.up,{g:nm}));dn.setAttribute('aria-label',F(TX.down,{g:nm}));rm.setAttribute('aria-label',F(TX.rmA,{g:nm}));
   up.disabled=i===0;dn.disabled=i===n-1;
   up.onclick=function(){moveBy(id,-1,'up')};dn.onclick=function(){moveBy(id,1,'dn')};rm.onclick=function(){doRemove(id)};
   var ctl=el('span','ctl');ctl.appendChild(up);ctl.appendChild(dn);ctl.appendChild(rm);r.appendChild(ctl);li.appendChild(r)}
  ul.appendChild(li)});
 view.appendChild(ul)}
function moveBy(id,d,cls){var ids=C.lib(),i=ids.indexOf(id);if(i<0)return;C.move(id,i+d);draw();
 var r=view.querySelector('.row[data-id="'+id+'"]'),b=r&&r.querySelector('.'+cls);if(b&&b.disabled)b=r.querySelector(cls==='up'?'.dn':'.up');if(b)b.focus()}

/* ---------- "for you": at most 3 ideas + the packs ---------- */
function drawYou(){var sg=C.suggest(3),age=KA.kid().age;
 view.appendChild(el('h2',null,TX.youH));
 if(!sg.length)view.appendChild(el('p','note',TX.youNone));
 else{var ul=el('ul','list');ul.id='sugg';sg.forEach(function(s){var li=el('li');li.appendChild(gameRow(C.byId(s.id),TX.why[s.why==='age'&&age==null?'any':s.why]));ul.appendChild(li)});view.appendChild(ul)}
 view.appendChild(el('h2',null,TX.packsH));
 var pl=el('ul','list');pl.id='packs';
 C.packs.forEach(function(p){var ids=C.packIds(p.id);if(!ids.length)return;var miss=ids.filter(function(id){return !C.has(id)}),li=el('li','pack');li.dataset.pack=p.id;
  var hd=el('div','hd'),c=el('span','chip',p.emo);c.style.background='#ebe6dc';c.setAttribute('aria-hidden','true');hd.appendChild(c);
  var tx=el('span','tx');tx.appendChild(el('span','nm',p.n[LG]));tx.appendChild(el('span','mt',p.d[LG]));hd.appendChild(tx);li.appendChild(hd);
  li.appendChild(el('p','in',ids.map(function(id){return C.byId(id).emo+' '+C.name(id,LG)}).join(' · ')));
  var b=btn('btn sec',!miss.length?TX.packHave:miss.length===ids.length?TX.packAdd:miss.length===1?TX.packAdd1:F(TX.packAddN,{n:miss.length}));b.disabled=!miss.length;
  b.setAttribute('aria-label',p.n[LG]+': '+b.textContent);b.onclick=function(){doPack(p.id)};li.appendChild(b);pl.appendChild(li)});
 view.appendChild(pl)}

/* ---------- "all games": search, one category at a time, four filters ---------- */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-֑ͯ-ׇ]/g,'').replace(/[־\-'’"״׳]/g,' ').trim()}
function matches(g){if(S.f.calm&&g.calm!==1)return false;if(S.f.learn&&!g.learn)return false;if(S.f.together&&!(g.two||g.online))return false;if(S.f.short&&g.mins>3)return false;
 var q=norm(S.q);if(!q)return g.cat===S.cat;
 var hay=norm([g.n.he,g.n.fr,g.n.en,g.d[LG]].concat(g.tags.map(function(t){return C.tagName(t,LG)})).join(' '));return hay.indexOf(q)>=0}
var sTimer=0,sSent=false;
function drawAll(){
 var sb=el('label','search'),ic=el('span',null,'🔍'),inp=el('input');ic.setAttribute('aria-hidden','true');inp.type='search';inp.id='q';inp.placeholder=TX.search;inp.setAttribute('aria-label',TX.search);inp.autocomplete='off';inp.enterKeyHint='search';inp.maxLength=40;inp.value=S.q;
 inp.oninput=function(){S.q=inp.value;drawResults();drawCats();if(!sSent&&norm(S.q).length>=2){clearTimeout(sTimer);sTimer=setTimeout(function(){if(!sSent&&norm(S.q).length>=2){sSent=true;track('search')}},1200)}};
 sb.appendChild(ic);sb.appendChild(inp);view.appendChild(sb);
 var cw=el('div','chips');cw.id='cats';cw.setAttribute('role','group');cw.setAttribute('aria-label',TX.cats);view.appendChild(cw);
 var fw=el('div','chips fl');fw.id='filters';fw.setAttribute('role','group');fw.setAttribute('aria-label',TX.filt);
 [['calm','🍃'],['learn','🎓'],['together','👫'],['short','⏱️']].forEach(function(f){var b=btn('cc');b.dataset.f=f[0];var i=el('span',null,f[1]);i.setAttribute('aria-hidden','true');b.appendChild(i);b.appendChild(D.createTextNode(TX.f[f[0]]));
  b.setAttribute('aria-pressed',S.f[f[0]]?'true':'false');b.onclick=function(){if(S.f[f[0]])delete S.f[f[0]];else S.f[f[0]]=1;b.setAttribute('aria-pressed',S.f[f[0]]?'true':'false');remember();drawResults()};fw.appendChild(b)});
 view.appendChild(fw);
 var res=el('div');res.id='res';res.style.cssText='display:flex;flex-direction:column;gap:10px';view.appendChild(res);
 drawCats();drawResults()}
function drawCats(){var cw=D.getElementById('cats');if(!cw)return;var searching=!!norm(S.q),had=D.activeElement&&D.activeElement.dataset?D.activeElement.dataset.cat:null;cw.textContent='';
 C.cats.forEach(function(c){var b=btn('cc');b.dataset.cat=c.id;var i=el('span',null,c.emo);i.setAttribute('aria-hidden','true');b.appendChild(i);b.appendChild(D.createTextNode(c.n[LG]));
  b.setAttribute('aria-pressed',!searching&&S.cat===c.id?'true':'false');
  b.onclick=function(){S.cat=c.id;if(S.q){S.q='';var q=D.getElementById('q');if(q)q.value=''}remember();drawCats();drawResults();var nb=cw.querySelector('[data-cat="'+c.id+'"]');if(nb)nb.focus()};cw.appendChild(b)});
 if(had){var nb=cw.querySelector('[data-cat="'+had+'"]');if(nb)nb.focus()}}
function drawResults(){var res=D.getElementById('res');if(!res)return;res.textContent='';
 var gs=C.visible().filter(matches),n=gs.length,cnt=el('p','lbl',n===1?TX.res1:F(TX.res,{n:n}));cnt.id='resN';cnt.setAttribute('aria-live','polite');cnt.style.marginBottom='0';res.appendChild(cnt);
 if(!n){var em=el('div','empty');em.appendChild(el('p',null,TX.none));if(S.q||Object.keys(S.f).length){var cb=btn('btn sec',TX.clear);cb.id='clear';cb.onclick=function(){S.q='';S.f={};remember();draw();var q=D.getElementById('q');if(q)q.focus()};em.appendChild(cb)}res.appendChild(em);return}
 var ul=el('ul','list');ul.id='all';gs.forEach(function(g){var li=el('li');li.appendChild(gameRow(g,paceMeta(g),C.has(g.id)));ul.appendChild(li)});res.appendChild(ul)}

/* ---------- actions: instant, never a confirmation – always an undo ---------- */
function showBar(text,undo){S.undo=undo||null;D.getElementById('barT').textContent=text;var ub=D.getElementById('barU');ub.textContent=TX.undo;ub.hidden=!undo;D.getElementById('barX').setAttribute('aria-label',TX.closeA);bar.hidden=false}
function hideBar(){S.undo=null;bar.hidden=true}
D.getElementById('barU').onclick=function(){var f=S.undo;hideBar();if(f){f();draw()}};
D.getElementById('barX').onclick=hideBar;
function doAdd(id,quiet){if(!C.add(id))return false;C.precache([id]);track('add',id);if(!quiet){showBar(F(TX.tAdd,{g:C.name(id,LG)}),function(){C.remove(id)});draw()}return true}
function doRemove(id,quiet){var at=C.lib().indexOf(id);if(!C.remove(id))return false;track('remove',id);
 if(!quiet){showBar(F(TX.tRm,{g:C.name(id,LG)}),function(){C.add(id);if(at>=0)C.move(id,at)});draw();var f=view.querySelector('.rm')||D.getElementById('more');if(S.arr&&f)f.focus()}return true}
function doPack(pid){var ids=C.packIds(pid),done=C.addMany(ids);if(!done.length)return [];C.precache(ids);track('pack',pid);
 showBar(done.length===1?TX.tPack1:F(TX.tPack,{n:done.length}),function(){C.removeMany(done)});draw();var b=view.querySelector('[data-pack="'+pid+'"] .btn');if(b)b.focus();return done}

/* ---------- the detail sheet ---------- */
var opener=null,progT=0;
function openSheet(id,from){var g=C.byId(id);if(!g||!C.available(id)||g.parent)return false;opener=from||D.activeElement;S.sheet=id;hideBar();track('open',id);drawSheet('');back.hidden=false;D.body.style.overflow='hidden';
 var h=D.getElementById('shT');if(h)h.focus();return true}
function closeSheet(){if(!S.sheet)return;clearTimeout(progT);S.sheet=null;back.hidden=true;D.body.style.overflow='';draw();
 var o=opener&&opener.dataset&&opener.dataset.id?view.querySelector('.row[data-id="'+opener.dataset.id+'"]'):null;opener=null;if(o)o.focus()}
function drawSheet(msg,pop){var g=C.byId(S.sheet);if(!g)return;sheet.textContent='';var has=C.has(g.id);
 var x=btn('x','✕');x.id='shX';x.setAttribute('aria-label',TX.close);x.onclick=closeSheet;sheet.appendChild(x);
 var art=chip(g,'art'+(pop?' pop':''));sheet.appendChild(art);
 var h=el('h2',null,C.name(g.id,LG));h.id='shT';h.tabIndex=-1;sheet.appendChild(h);
 sheet.appendChild(el('p','ds',C.desc(g.id,LG)));
 var fa=el('div','facts');
 [[TX.age,F(TX.ageV,{a:g.ages[0],b:g.ages[1]})],[TX.mins,F(TX.minsV,{n:g.mins})]].forEach(function(f){var d=el('div','fact');d.appendChild(el('b',null,f[1]));d.appendChild(D.createTextNode(f[0]));fa.appendChild(d)});
 var pc=el('div','fact'),pb=el('b');pb.appendChild(leaves(g));pc.appendChild(pb);pc.appendChild(D.createTextNode(TX.cl[g.calm]));fa.appendChild(pc);sheet.appendChild(fa);
 var tg=el('div','tags');['isNew','learn','two','online'].forEach(function(k){if(g[k])tg.appendChild(el('span','tag',TX.tg[k]))});
 g.tags.slice(0,2).forEach(function(t){tg.appendChild(el('span','tag',C.tagName(t,LG)))});sheet.appendChild(tg);
 var m=el('p','msg',msg||'');m.id='shMsg';m.setAttribute('role','status');sheet.appendChild(m);
 if(has){var pl=el('a','btn pri',TX.play);pl.id='shPlay';pl.href=C.href(g.id);sheet.appendChild(pl);
  var rm=btn('btn sec',TX.remove);rm.id='shRm';rm.onclick=function(){if(doRemove(g.id,true)){drawSheet(TX.removed);var b=D.getElementById('shGet');if(b)b.focus()}};sheet.appendChild(rm);
  sheet.appendChild(el('p','note',TX.keep)).style.textAlign='center'}
 else{var gt=btn('btn pri',TX.get);gt.id='shGet';gt.onclick=function(){getNow(g.id,gt)};sheet.appendChild(gt)}}
/* the "download" moment: the game is added at once; the bar is ~0.8 s of feedback (skipped with reduced motion) */
function getNow(id,b){if(!doAdd(id,true))return;
 function done(){if(S.sheet!==id)return;drawSheet(TX.added,true);var p=D.getElementById('shPlay');if(p)p.focus()}
 if(reduced()){done();return}
 var pr=el('div','prog'),i=el('i'),sp=el('span',null,TX.getting);pr.id='shProg';pr.setAttribute('role','status');pr.appendChild(i);pr.appendChild(sp);b.replaceWith(pr);
 requestAnimationFrame(function(){requestAnimationFrame(function(){pr.classList.add('go')})});clearTimeout(progT);progT=setTimeout(done,820)}
back.addEventListener('click',function(e){if(e.target===back)closeSheet()});
D.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){e.preventDefault();closeSheet();return}
 if(e.key==='Tab'&&S.sheet){var f=sheet.querySelectorAll('button:not([disabled]),a[href]');if(!f.length)return;var a=f[0],z=f[f.length-1];
  if(e.shiftKey&&(D.activeElement===a||!sheet.contains(D.activeElement))){e.preventDefault();z.focus()}else if(!e.shiftKey&&D.activeElement===z){e.preventDefault();a.focus()}}});

/* ---------- calm mode ---------- */
var calmB=D.getElementById('calm');
function vibe(){try{var V=W.Vibe;if(!V)return;if(C.calm()){if(V.off)V.off()}else if(V.on)V.on()}catch(e){}}
function drawCalm(){var on=C.calm();calmB.setAttribute('aria-checked',on?'true':'false');calmB.setAttribute('aria-label',TX.calm);D.getElementById('calmT').textContent=TX.calm;D.getElementById('calmS').textContent=on?TX.calmOn:TX.calmOff}
calmB.onclick=function(){C.setCalm(!C.calm());drawCalm();vibe();track('calm',C.calm()?'on':'off')};
D.addEventListener('DOMContentLoaded',vibe);W.addEventListener('load',vibe);

function draw(){drawTabs();view.textContent='';if(S.tab==='mine')drawMine();else if(S.tab==='you')drawYou();else drawAll()}
C.onchange(function(why){if(why==='storage'){if(S.sheet)drawSheet('');else draw()}else if(why==='calm')drawCalm()});
W.addEventListener('pageshow',function(e){if(e.persisted){if(S.sheet)drawSheet('');else draw()}});
draw();drawCalm();

/* test hook */
W.__store={state:function(){return {tab:S.tab,cat:S.cat,filters:Object.keys(S.f),searching:!!norm(S.q),arrange:S.arr,sheet:S.sheet,undo:!!S.undo,lib:C.lib(),count:C.lib().length,calm:C.calm(),lang:LG}},
 add:function(id){return doAdd(id)},remove:function(id){return doRemove(id)},pack:function(n){return doPack(n)},open:function(id){return openSheet(id)},close:closeSheet,tab:function(t){setTab(t)}};
})();
</script>
</body>
