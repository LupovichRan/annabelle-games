  padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));overflow-x:hidden;-webkit-user-select:none;user-select:none}

.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.top h1{font-size:24px;line-height:1.2;font-weight:700}
.top p{color:var(--soft);font-size:15px}
/* tabs: one view at a time */
.tabs{display:flex;gap:4px;background:#ebe6dc;border-radius:var(--r);padding:4px}
.tab{flex:1 1 auto;min-height:48px;border-radius:13px;font-weight:600;font-size:16px;color:var(--soft);padding:4px 8px;line-height:1.2;white-space:nowrap}

.count{font-size:19px;font-weight:700}

.note{color:var(--soft);font-size:15px}

.btn{min-height:52px;border-radius:var(--r);padding:8px 18px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.pri{background:var(--acc);color:#fff}

.btn.sec[aria-pressed=true]{background:var(--tint);border-color:var(--acc)}

.acts{display:flex;gap:10px;flex-wrap:wrap}

.list{display:grid;grid-template-columns:1fr;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;text-align:start}
button.row:active{background:var(--tint)}
.chip{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;line-height:1}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row.ar{flex-wrap:wrap}.row.ar .tx{flex:1 1 130px}
.ctl{display:flex;gap:8px;margin-inline-start:auto}
.nm{font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:break-word}
.mt{color:var(--soft);font-size:14px;line-height:1.3}
.st{color:var(--ok);font-size:14px;font-weight:600;flex:none;white-space:nowrap}
.go{color:var(--soft);font-size:20px;flex:none;line-height:1}

.mini{width:44px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:17px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center}
.mini.rm{width:auto;padding:0 12px;font-size:15px;font-weight:600}
.mini:active{background:var(--tint)}
.mini[disabled]{opacity:.3;cursor:default}
/* packs */
.pack{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.pack .hd{display:flex;align-items:center;gap:12px}
.pack .in{color:var(--soft);font-size:14px}
.pack .btn{min-height:48px;font-size:16px}
/* browse */
.search{display:flex;align-items:center;gap:8px;min-height:52px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;min-width:0;border:0;background:none;min-height:48px;font-size:17px;-webkit-user-select:text;user-select:text}
.search input:focus-visible{outline:none}
.search input::-webkit-search-cancel-button{display:none}

.fl .cc{flex-direction:column;gap:0;font-size:13px;min-height:54px}
.fl .cc span{font-size:18px;line-height:1.1}

.lbl{color:var(--soft);font-size:14px;font-weight:600;margin-bottom:-10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.offer{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}

.row.ck[aria-checked=true]{background:var(--tint);border-color:var(--acc)}
.box{width:34px;height:34px;border-radius:10px;border:2px solid #8b93a3;background:#fff;color:transparent;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;line-height:1;flex:none}
.row.ck[aria-checked=true] .box{background:var(--acc);border-color:var(--acc);color:#fff}
.chips.qs{grid-template-columns:repeat(3,minmax(0,1fr))}
.done{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px #2b31401f}
.done .count{font-size:17px}
.done .acts{flex-wrap:nowrap}.done .acts .btn{flex:1 1 0;min-width:0}
/* footer: calm mode */
.foot{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:12px}
.foot .tx b{font-weight:600}
.sw{width:64px;height:44px;border-radius:999px;background:#c9c3b7;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:5px;inset-inline-start:5px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true]::after{inset-inline-start:25px}
/* undo bar: stays until the next action – no countdown */
.bar{position:fixed;inset-inline:0;bottom:calc(12px + env(safe-area-inset-bottom));margin:0 auto;width:min(calc(100% - 24px),520px);background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;z-index:20;font-size:15px}
[dir=rtl] .bar{padding:8px 14px 8px 8px}
.bar span{flex:1;min-width:0}
.bar button{min-height:44px;min-width:44px;border-radius:12px;padding:0 12px;font-weight:700;color:#fff}
.bar .un{background:#ffffff22}
.bar :focus-visible{outline-color:#fff}
/* detail sheet */
.back{position:fixed;inset:0;background:#2b314066;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:calc(100dvh - 24px);overflow:auto;border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;position:relative}
.sheet>*{flex-shrink:0} /* the sheet scrolls; nothing in it is squeezed (the 'adding' bar has overflow:hidden and would collapse) */
.sheet .x{position:absolute;top:10px;inset-inline-end:10px;width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.art{width:112px;height:112px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1;align-self:center;margin-top:6px}
.sheet h2{font-size:22px;text-align:center;margin:0}
.sheet .ds{text-align:center}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:14px;color:var(--soft);display:flex;flex-direction:column;justify-content:center;min-height:62px}
.fact b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{font-size:14px;color:var(--soft);background:#ebe6dc;border-radius:999px;padding:3px 10px}
.msg{text-align:center;color:var(--ok);font-weight:600;min-height:24px}
.sheet .btn{width:100%}
.prog{height:52px;border-radius:var(--r);background:var(--tint);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--acc-d)}
.prog i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:#c5d6ee;transition:width .8s linear}
.prog.go i{width:100%}
.prog span{position:relative}
/* about the game (gameinfo.js, loaded lazily): 3 pictures in fixed boxes, a summary, one line of facts, and sections that stay closed until asked */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;aspect-ratio:390/800;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.shot .se{font-size:34px;line-height:1;opacity:.55}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shot[disabled]{cursor:default}
.sheet.pics .art{width:72px;height:72px;font-size:42px;border-radius:20px;margin-top:0}
.about{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.about h3{margin:0;font-size:16px;font-weight:700}
.sum{font-size:16px}
.meta{color:var(--soft);font-size:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px}

.who{display:flex;flex-direction:column;gap:8px}
.who li{display:flex;flex-direction:column;font-size:15px;line-height:1.4}
.who b{font-weight:600}
.sp .btn{min-height:44px;font-size:15px;font-weight:600}

.view{position:fixed;inset:0;z-index:40;background:#20242eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));touch-action:pan-y}
.vbox{position:relative;height:min(calc(100dvh - 150px),calc((100vw - 24px)*800/390));aspect-ratio:390/800;border-radius:16px;overflow:hidden;background:#3a4050;flex:none}
.vbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.vtop{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font-size:15px;min-height:48px}
.vtop span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font-size:15px}
.vb{min-height:48px;min-width:104px;padding:0 14px;border-radius:14px;background:#ffffff22;color:#fff;font-weight:600;font-size:16px;flex:none}
.vb.x{min-width:48px}
.vb:active{background:#ffffff44}
.view :focus-visible{outline-color:#fff}
@media (min-width:760px){
  body{padding-top:20px}

  .chips{grid-template-columns:repeat(6,minmax(0,1fr))}
  .fl{grid-template-columns:repeat(4,minmax(0,1fr))}
  .acts .btn{flex:0 1 240px}
  .done{flex-direction:row;align-items:center;justify-content:space-between}
  .done .acts{flex:0 0 440px}
  .back{align-items:center}
  .sheet{border-radius:24px;max-height:calc(100dvh - 32px)}

  .sheet.pics{max-width:920px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);column-gap:22px;row-gap:12px;align-content:start;padding-top:18px}

@media (prefers-reduced-motion:no-preference){
  html[data-calm="0"] .art.pop{animation:pop .35s ease-out 1}

}

@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
html.desk button:hover:not([disabled]),html.desk .home:hover{filter:brightness(.97)}
