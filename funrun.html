let cfLast=0;
function cfTick(ts){const c=$('conf'),x=c.getContext('2d'),dt=Math.min(.05,(ts-(cfLast||ts))/1000);cfLast=ts;x.clearRect(0,0,c.width,c.height);
 for(let i=CF.length-1;i>=0;i--){const p=CF[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.l<=0||p.y>c.height+30){CF.splice(i,1);continue}x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.min(1,p.l);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}
 if(CF.length)requestAnimationFrame(cfTick);else{cfOn=false;cfLast=0;x.clearRect(0,0,c.width,c.height)}}
