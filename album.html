<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><!--pt--><script src="playtime.js" data-app="album"></script><!--/pt-->

<style>
/* Annabelle's album: stickers, daily gift, dress-up shop, per-game progress.
   Reads: localStorage 'annabelle-rewards' (via rewards.js) and, for the "Games" tab, the optional per-game keys
   'annabelle-<game>-best' (a number, or JSON with a numeric "best"/"score"). */
:root{--ink:#4a2f6e;--pink:#ff7ab8;--gold:#ffb84d;--card:#ffffffd9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Rubik","Varela Round","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe3f1,#e9e1ff 55%,#d9f1ff);background-attachment:fixed;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home{width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #a58bff;display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none;box-shadow:0 4px 0 #0002;flex:none}
h1{margin:0;flex:1;font-size:clamp(24px,6.4vw,40px);color:#ff5aa5;text-shadow:0 3px 0 #fff,0 5px 0 #ffb3d6;line-height:1.05;min-width:150px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:clamp(17px,4.6vw,22px);box-shadow:0 3px 0 #0002;display:flex;align-items:center;gap:6px;white-space:nowrap}
.langs{display:flex;gap:6px}.langs button{min-height:40px;padding:4px 12px;border-radius:999px;border:2px solid #cdbbff;background:#fff8;font-weight:800;font-size:14px}.langs button.sel{background:#fff;border-color:#7c5cff}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:stretch}
@media(max-width:560px){.hero{grid-template-columns:1fr}}
.me{background:var(--card);border-radius:26px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 #0001}
.me svg{width:clamp(130px,36vw,190px);height:auto;border-radius:26px;display:block}
.me b{font-size:16px}
.gift{background:linear-gradient(135deg,#fff3c4,#ffd9ec);border-radius:26px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 #0001;text-align:center;position:relative;overflow:hidden;border:3px solid #ffd27a}
.gift h2{margin:0;font-size:clamp(19px,5vw,26px)}
.chest{font-size:clamp(70px,20vw,110px);line-height:1;background:none;border:0;padding:0;filter:drop-shadow(0 8px 0 #0002)}
.chest.ready{animation:wob 1.1s ease-in-out infinite}.chest.open{animation:pop .6s ease-out}.chest.off{filter:grayscale(.7) drop-shadow(0 8px 0 #0002);opacity:.8}
@keyframes wob{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.08)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
.days{display:flex;gap:8px;justify-content:center}
.d{width:clamp(34px,9.5vw,46px);height:clamp(34px,9.5vw,46px);border-radius:50%;background:#fff9;border:3px dashed #e5c9a5;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,5vw,24px)}
.d.got{background:#fff;border:3px solid #ff9f43}.d.today{box-shadow:0 0 0 4px #ff7ab855}
.prize{display:none;font-weight:900;font-size:clamp(20px,5.4vw,28px)}.prize.on{display:block;animation:pop .6s}
.note{font-size:15px;font-weight:700;opacity:.85}
.tabs{display:flex;gap:8px;position:sticky;top:0;z-index:5;padding:6px 0;background:linear-gradient(#ffe9f4f0,#ffe9f400)}
.tab{flex:1;min-height:50px;border-radius:18px;border:3px solid #cdbbff;background:#fffc;font-weight:900;font-size:clamp(15px,4.2vw,20px);box-shadow:0 3px 0 #0002}
.tab.sel{background:linear-gradient(#a58bff,#7c5cff);color:#fff;border-color:#7c5cff}
.sec{display:none}.sec.on{display:block}
.gh{margin:14px 4px 6px;font-weight:900;font-size:clamp(16px,4.4vw,20px);color:#7c5cff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
.stk{aspect-ratio:1;border-radius:22px;border:3px solid #fff;background:var(--card);box-shadow:0 4px 0 #0001;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-weight:800;font-size:13px;line-height:1.1;text-align:center}
.stk .e{font-size:clamp(34px,9vw,48px);line-height:1}
.stk.lock .e{filter:brightness(0) opacity(.18)}.stk.lock{background:#ffffff80;border-style:dashed;border-color:#d3c4ee}
.stk.new{border-color:#ffb84d;animation:wob 1.6s ease-in-out 3}
.shopcats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.sc{flex:none;min-height:46px;padding:4px 16px;border-radius:999px;border:3px solid #cdbbff;background:#fffc;font-weight:800;font-size:16px}.sc.sel{background:#fff;border-color:#ff7ab8}
.shopwrap{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
@media(max-width:560px){.shopwrap{grid-template-columns:1fr;justify-items:center}}
.shopwrap .me{position:sticky;top:70px}
.it{border-radius:20px;border:3px solid #fff;background:var(--card);box-shadow:0 4px 0 #0001;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-weight:800;font-size:13px;min-height:100px;text-align:center}
.it .e{font-size:34px;line-height:1}.it.on{border-color:#ff7ab8;background:#fff}.it.own .pr{color:#2fb36a}.pr{font-weight:900;font-size:15px}
.it.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gm{border-radius:22px;border:3px solid #fff;background:var(--card);box-shadow:0 4px 0 #0001;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;text-align:center}
.gm .e{font-size:38px;line-height:1}.gm small{font-weight:700;opacity:.8;font-size:12.5px}
.sheet{position:fixed;inset:0;z-index:50;background:#2a164a99;display:none;align-items:center;justify-content:center;padding:20px}.sheet.on{display:flex}
.sheet .c{background:#fff;border-radius:28px;padding:22px 20px 18px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 0 #0003;border:4px solid #ffb84d}
.sheet .e{font-size:90px;line-height:1}.sheet h3{margin:6px 0;font-size:24px}.sheet p{margin:4px 0 12px;font-size:18px;font-weight:700}
.sheet button{min-height:50px;padding:6px 30px;border-radius:999px;border:0;background:linear-gradient(#a58bff,#7c5cff);color:#fff;font-weight:900;font-size:18px;box-shadow:0 4px 0 #4b32a8}
.spark{position:fixed;pointer-events:none;font-size:26px;z-index:60;animation:fly 1s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
/* laptop / big windows */
.desk .wrap{max-width:1100px}
@media(min-width:1500px){html.desk .wrap{max-width:1300px}html.desk .stk{font-size:15px}html.desk .it,html.desk .gm{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!--pwa--><link rel="manifest" href="manifests/album.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icons/album-192.png"><meta name="apple-mobile-web-app-title" content="האלבום של אנאבל"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icons/album-apple-180.png"><script src="pwa.js" data-app="album" data-slots='[]' defer></script><!--/pwa-->
<script src="desktop.js"></script>
<script src="rewards.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html" id="home" aria-label="home">🏠</a>
    <h1 id="ttl"></h1>
    <div class="pill" id="coins">💰 <b id="cn">0</b></div>
    <div class="langs" id="langs"></div>
  </div>
  <div class="hero">
    <div class="me"><div id="av"></div><b id="avN"></b></div>
    <div class="gift">
      <h2 id="gT"></h2>
      <button class="chest" id="chest" aria-label="gift">🎁</button>
      <div class="days" id="days"></div>
      <div class="prize" id="prize"></div>
      <div class="note" id="gN"></div>
    </div>
  </div>
  <div class="tabs" role="tablist"><button class="tab sel" data-t="stk" id="t1"></button><button class="tab" data-t="shop" id="t2"></button><button class="tab" data-t="games" id="t3"></button></div>
  <div class="sec on" id="s-stk"><div id="stkBox"></div></div>
  <div class="sec" id="s-shop">
    <div class="shopwrap"><div class="me"><div id="av2"></div></div>
      <div><div class="shopcats" id="cats"></div><div class="grid" id="items"></div><div class="note" id="shopNote" style="margin-top:8px"></div></div></div>
  </div>
  <div class="sec" id="s-games"><div class="grid" id="gamesBox"></div></div>
</div>
<div class="sheet" id="sheet"><div class="c"><div class="e" id="shE"></div><h3 id="shN"></h3><p id="shD"></p><button id="shX"></button></div></div>
<script>
(function(){
'use strict';
var R=window.AnnabelleRewards;
var $=function(i){return document.getElementById(i)};
var TX={
 he:{ttl:'האלבום של אנאבל',t1:'🏷️ סטיקרים',t2:'👗 לבוש',t3:'🎮 משחקים',gT:'המתנה היומית',open:'לחצי לפתיחה!',later:'חזרי מחר למתנה חדשה 🌙',streak:'ימים ברצף',youGot:'קיבלת',avN:'החתלתול שלי',
  stk:'סטיקרים',of:'מתוך',how:'איך משיגים?',ok:'הבנתי 👍',cats:{hat:'כובעים',bow:'צעיפים',glass:'משקפיים',color:'צבעים',bg:'רקעים'},buy:'קניתי!',need:'חסרים עוד {n} מטבעות',own:'שלי ✓',
  grp:{games:'משחקים ראשונים',wins:'ניצחונות',explore:'חקרנית',streak:'ימים ברצף',stars:'כוכבים',coins:'מטבעות',levels:'שלבים',combo:'קומבו',perfect:'מושלם',gift:'מתנות',shop:'קניות',misc:'עוד',rare:'נדירים ✨'},
  plays:'שיחקת',times:'פעמים',best:'שיא',stars:'כוכבים',play:'לשחק',pick:'לחצי על פריט כדי ללבוש',noItems:''},
 fr:{ttl:"L'album d'Annabelle",t1:'🏷️ Autocollants',t2:'👗 Habits',t3:'🎮 Jeux',gT:'Cadeau du jour',open:'Touche pour ouvrir !',later:'Reviens demain pour un autre cadeau 🌙',streak:'jours de suite',youGot:'Tu as reçu',avN:'Mon chaton',
  stk:'autocollants',of:'sur',how:'Comment l’obtenir ?',ok:'Compris 👍',cats:{hat:'Chapeaux',bow:'Nœuds',glass:'Lunettes',color:'Couleurs',bg:'Fonds'},buy:'Acheté !',need:'Il manque {n} pièces',own:'À moi ✓',
  grp:{games:'Premiers jeux',wins:'Victoires',explore:'Exploratrice',streak:'Jours de suite',stars:'Étoiles',coins:'Pièces',levels:'Niveaux',combo:'Combos',perfect:'Parfait',gift:'Cadeaux',shop:'Boutique',misc:'Autres',rare:'Rares ✨'},
  plays:'Parties',times:'fois',best:'Record',stars:'étoiles',play:'Jouer',pick:'Touche un article pour le porter',noItems:''},
 en:{ttl:"Annabelle's Album",t1:'🏷️ Stickers',t2:'👗 Dress-up',t3:'🎮 Games',gT:'Daily gift',open:'Tap to open!',later:'Come back tomorrow for a new gift 🌙',streak:'days in a row',youGot:'You got',avN:'My kitten',
  stk:'stickers',of:'of',how:'How to get it?',ok:'Got it 👍',cats:{hat:'Hats',bow:'Bows & scarves',glass:'Glasses',color:'Colours',bg:'Backgrounds'},buy:'Bought!',need:'{n} more coins needed',own:'Mine ✓',
  grp:{games:'First plays',wins:'Wins',explore:'Explorer',streak:'Streaks',stars:'Stars',coins:'Coins',levels:'Levels',combo:'Combos',perfect:'Perfect',gift:'Gifts',shop:'Shopping',misc:'More',rare:'Rare ✨'},
  plays:'Played',times:'times',best:'Best',stars:'stars',play:'Play',pick:'Tap an item to wear it',noItems:''}
};
function L(){return TX[R?R.lang():'he']}
var tab='stk',shopCat='hat',newIds={};
if(!R){document.body.innerHTML='<p style="padding:30px;font-size:22px">rewards.js missing</p>';return}
function langs(){var l=R.lang();$('langs').innerHTML=[['he','עברית'],['fr','FR'],['en','EN']].map(function(x){return '<button data-l="'+x[0]+'" class="'+(x[0]===l?'sel':'')+'">'+x[1]+'</button>'}).join('')}
$('langs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;try{localStorage.setItem('annabelle-lang',b.dataset.l)}catch(x){}render()});
function head(){var l=R.lang(),t=L();document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.title=t.ttl;$('ttl').textContent=t.ttl;$('t1').textContent=t.t1;$('t2').textContent=t.t2;$('t3').textContent=t.t3;$('gT').textContent=t.gT;$('avN').textContent=t.avN;$('shX').textContent=t.ok;$('cn').textContent=R.coins();langs()}
function gift(){var t=L(),s=R.dailyStatus(),ch=$('chest');
 $('days').innerHTML=s.days.map(function(d){return '<div class="d '+(d.got?'got':'')+(d.today?' today':'')+'">'+(d.got?'🔥':'·')+'</div>'}).join('');
 ch.className='chest '+(s.available?'ready':'off');
 $('gN').textContent=s.available?t.open:t.later+(s.streak?'  ·  🔥 '+s.streak+' '+t.streak:'');
 $('gN').style.fontWeight=s.available?'900':'700'}
function sparks(x,y,em){for(var i=0;i<14;i++){var e=document.createElement('div');e.className='spark';e.textContent=em[i%em.length];e.style.left=x+'px';e.style.top=y+'px';var a=Math.random()*6.28,r=60+Math.random()*120;e.style.setProperty('--dx',Math.cos(a)*r+'px');e.style.setProperty('--dy',Math.sin(a)*r-40+'px');document.body.appendChild(e);(function(el){setTimeout(function(){el.remove()},1000)})(e)}}
$('chest').addEventListener('click',function(){var s=R.dailyStatus(),t=L();if(!s.available)return;var r=R.claimDaily();if(!r)return;var ch=$('chest'),b=ch.getBoundingClientRect();
 ch.className='chest open';ch.textContent='🎉';sparks(b.left+b.width/2,b.top+b.height/2,['✨','💰','⭐','💖']);
 var p=$('prize'),sk=r.sticker?R.catalog().filter(function(x){return x.id===r.sticker})[0]:null;
 p.innerHTML=t.youGot+' 💰 +'+r.coins+(sk?'  '+sk.e+' <small>'+R.t(sk.n)+'</small>':'');p.className='prize on';
 if(sk)newIds[sk.id]=1;(r.extra||[]).forEach(function(i){newIds[i]=1});
 setTimeout(function(){ch.textContent='🎁';render();R.flush()},1700)});
function stickers(){var t=L(),cat=R.stickers(),box=$('stkBox'),have=cat.filter(function(s){return s.earned}).length,groups={},order=[];
 cat.forEach(function(s){if(!groups[s.g]){groups[s.g]=[];order.push(s.g)}groups[s.g].push(s)});
 var h='<div class="gh" style="text-align:center;font-size:clamp(18px,5vw,24px)">'+have+' '+t.of+' '+cat.length+' '+t.stk+'</div>';
 order.forEach(function(g){h+='<div class="gh">'+(t.grp[g]||g)+'</div><div class="grid">'+groups[g].map(function(s){return '<button class="stk '+(s.earned?'':'lock')+(newIds[s.id]?' new':'')+'" data-id="'+s.id+'"><span class="e">'+(s.earned?s.e:s.e)+'</span><span>'+(s.earned?R.t(s.n):'???')+'</span></button>'}).join('')+'</div>'});
 box.innerHTML=h}
$('stkBox').addEventListener('click',function(e){var b=e.target.closest('.stk');if(!b)return;var s=R.catalog().filter(function(x){return x.id===b.dataset.id})[0],has=R.has(s.id),t=L();
 $('shE').textContent=has?s.e:'❔';$('shN').textContent=has?R.t(s.n):'???';$('shD').textContent=(has?'':t.how+' ')+R.t(s.d);$('sheet').classList.add('on')});
$('shX').addEventListener('click',function(){$('sheet').classList.remove('on')});$('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))$('sheet').classList.remove('on')});
function avatars(){var a=R.avatarSVG(180);$('av').innerHTML=a;$('av2').innerHTML=R.avatarSVG(190)}
function shop(){var t=L(),items=R.shop(),kinds=['hat','bow','glass','color','bg'];
 $('cats').innerHTML=kinds.map(function(k){return '<button class="sc '+(k===shopCat?'sel':'')+'" data-k="'+k+'">'+t.cats[k]+'</button>'}).join('');
 $('items').innerHTML=items.filter(function(i){return i.kind===shopCat}).map(function(i){return '<button class="it '+(i.owned?'own':'')+(i.on?' on':'')+'" data-id="'+i.id+'"><span class="e">'+i.e+'</span><span>'+R.t(i.n)+'</span><span class="pr">'+(i.owned?(i.on?'✓':t.own):'💰 '+i.price)+'</span></button>'}).join('');
 $('shopNote').textContent=t.pick}
$('cats').addEventListener('click',function(e){var b=e.target.closest('.sc');if(!b)return;shopCat=b.dataset.k;shop()});
$('items').addEventListener('click',function(e){var b=e.target.closest('.it');if(!b)return;var id=b.dataset.id,it=R.shop().filter(function(x){return x.id===id})[0],t=L();
 if(it.owned){R.equip(id,!it.on);}
 else if(R.coins()>=it.price){if(R.buy(id)){R.equip(id,true);var r=b.getBoundingClientRect();sparks(r.left+r.width/2,r.top,['✨','💖','💰']);$('shopNote').textContent=t.buy;setTimeout(function(){R.flush()},900)}}
 else{b.classList.add('shake');$('shopNote').textContent=t.need.replace('{n}',it.price-R.coins());setTimeout(function(){b.classList.remove('shake')},450);return}
 render(true)});
function bestOf(g){try{var v=localStorage.getItem('annabelle-'+g+'-best');if(v===null)return 0;var n=Number(v);if(isFinite(n))return n;var o=JSON.parse(v);if(o&&typeof o==='object'){var m=o.best!=null?o.best:o.score;return isFinite(Number(m))?Number(m):0}}catch(e){}return 0}
function games(){var t=L(),st=R.get().stats,ids=Object.keys(R.GAMES);
 $('gamesBox').innerHTML=ids.map(function(g){var p=st.plays[g]||0,s=st.stars[g]||0,b=Math.max(st.best[g]||0,bestOf(g));
  return '<a class="gm" href="'+g+'.html"><span class="e">'+R.GAMES[g][0]+'</span><span>'+R.gname(g)+'</span><small>'+(p?t.plays+' '+p+' '+t.times:'—')+'</small><small>'+(s?'⭐ '+s:'')+(b?'  ·  '+t.best+' '+b:'')+'</small></a>'}).join('')}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;tab=b.dataset.t;render(true)});
function render(keepScroll){head();gift();avatars();
 [].forEach.call(document.querySelectorAll('.tab'),function(b){b.classList.toggle('sel',b.dataset.t===tab)});
 [].forEach.call(document.querySelectorAll('.sec'),function(s){s.classList.toggle('on',s.id==='s-'+tab)});
 if(tab==='stk')stickers();if(tab==='shop')shop();if(tab==='games')games()}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('sheet').classList.contains('on'))$('sheet').classList.remove('on');else location.href='index.html'}});
R.visitAlbum();
// stickers that arrived while playing glow once
try{R.get().pend.forEach(function(p){if(p.t==='sticker')newIds[p.id]=1})}catch(e){}
render();
window.__album={render:render,setTab:function(t){tab=t;render()}};
})();
</script>
</body>
