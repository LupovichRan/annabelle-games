(function(){var MK='annabelle-profiles',DK='annabelle-profdata-',EM=['🐱','🦁','🐯','🐼','🦊','🐰'];
var KEEP=/^annabelle-(lang|muted|music|turn|desk|installed|pwa.*|playtime.*|parent|profiles|profdata-.*|device|tq|telemetry)$/;
function q(i){return document.getElementById(i)}
function meta(){var m=null;try{m=JSON.parse(localStorage.getItem(MK)||'null')}catch(e){}
 if(m&&Array.isArray(m.list))m.list=m.list.filter(function(p){return p&&typeof p.id==='string'});
 if(!m||!Array.isArray(m.list)||!m.list.length||!m.list.some(function(p){return p.id===m.cur})){m={cur:'p1',list:[{id:'p1',name:'',emo:'🐱'}]};save(m)}return m}
function save(m){try{localStorage.setItem(MK,JSON.stringify(m))}catch(e){}}
function keys(){var ks=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if((/^annabelle-/.test(k)||/^soya-/.test(k))&&!KEEP.test(k))ks.push(k)}}catch(e){}return ks}
function snap(){var o={};keys().forEach(function(k){o[k]=localStorage.getItem(k)});return o}
function stash(m){try{localStorage.setItem(DK+m.cur,JSON.stringify(snap()))}catch(e){q('pfSt').textContent=pt().noroom;return false}return true}
function clearAll(){keys().forEach(function(k){localStorage.removeItem(k)})}
function load(id){var o=null;try{o=JSON.parse(localStorage.getItem(DK+id)||'null')}catch(e){}if(o)Object.keys(o).forEach(function(k){if(/^(annabelle|soya)-/.test(k)&&!KEEP.test(k))try{localStorage.setItem(k,String(o[k]))}catch(e){}})}
function sw(id,fresh){var m=meta();if(id===m.cur)return;if(!stash(m))return;clearAll();if(!fresh)load(id);m.cur=id;save(m);location.reload()}

  d.onclick=function(){if(!confirm(t.delQ.replace('{n}',nm)))return;var mm=meta();mm.list=mm.list.filter(function(x){return x.id!==p.id});save(mm);try{localStorage.removeItem(DK+p.id)}catch(e){}try{window.KidApp&&KidApp.audit&&KidApp.audit('profile_deleted','profile',null,'parent')}catch(e){}draw()};box.appendChild(d)}})}
