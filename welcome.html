  case 1:ans=r(2,7);cnt=pick(['🍎','⭐','🐟','🎈','🐱']);break;
  case 2:a=r(1,5);c=r(1,5);if(rnd(3)===0&&a!==c){if(a<c){d=a;a=c;c=d}ans=a-c;txt=a+' − '+c}else{ans=a+c;txt=a+' + '+c}break;
  case 3:if(rnd(2)){a=r(6,12);c=r(3,8);ans=a+c;txt=a+' + '+c}else{a=r(11,19);c=r(2,9);ans=a-c;txt=a+' − '+c}break;
