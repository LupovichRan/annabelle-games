*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#efe3ff;font-family:"Rubik","Varela Round",Arial,sans-serif;color:#3d2766;user-select:none;-webkit-user-select:none;touch-action:manipulation}

#menu{justify-content:center;gap:10px;padding:10px;overflow:auto}
h1{margin:0;font-size:clamp(26px,7vw,40px);color:#8a4fd8;text-shadow:0 3px 0 #0001;text-align:center}

.big.g{background:linear-gradient(#b8c1cc,#7d8794);box-shadow:0 4px 0 #555e69}
.big.y{background:linear-gradient(#5fd38d,#2fb36a);box-shadow:0 4px 0 #1d7c48}
.big.n{background:linear-gradient(#ff8a8a,#e23b3b);box-shadow:0 4px 0 #9a2020}
.rules{max-width:460px;background:#fff;border-radius:16px;padding:8px 12px;font-size:15px;line-height:1.35;box-shadow:0 3px 0 #0001}

.lbl2{font-weight:800;font-size:16px}
.rng .big{min-width:92px;min-height:48px;font-size:17px;background:#fff;color:#3d2766;border:3px solid #8a4fd8;box-shadow:0 3px 0 #0002}

.pill{flex:1;text-align:center;background:#fff;border-radius:999px;padding:8px 8px;font-weight:800;font-size:16px;box-shadow:0 3px 0 #0001;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.say{margin:8px 6px 2px;font-weight:800;font-size:clamp(18px,4.6vw,24px);text-align:center;flex:0 0 auto}
.sub{font-size:15px;opacity:.85;text-align:center;margin:2px 8px;flex:0 0 auto}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0;flex:0 0 auto}
.dots i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #8a4fd8}
.dots i.on{background:#8a4fd8}
.dots i.cur{transform:scale(1.35);background:#ffb35c;border-color:#e8862d}

.card{--c:#8a4fd8;background:#fff;border:4px solid var(--c);border-radius:16px;padding:8px;box-shadow:0 5px 0 #0002;direction:ltr;position:relative;transition:transform .2s,opacity .2s,filter .2s}
.card .g{display:grid;gap:4px;direction:ltr}

.pickwrap{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
.pickwrap .card{width:min(94vw,calc((var(--app-h,100vh) - 300px)*var(--ar,1)),520px)}
.yn{display:flex;gap:12px;justify-content:center;padding:6px 6px calc(var(--sab,6px) + 4px);width:100%;flex:0 0 auto}
.yn .big{flex:1;max-width:240px;min-height:60px;font-size:21px;white-space:nowrap;padding:8px 10px}.yn .big.g{flex:0 0 auto;font-size:16px}
.pickwrap .card.in{animation:cin .3s}
@keyframes cin{from{transform:translateX(-60px) rotate(-6deg);opacity:0}}

.bigemoji{font-size:clamp(80px,26vw,150px);line-height:1;filter:drop-shadow(0 6px 0 #0002)}
.float{animation:flo 1.6s ease-in-out infinite alternate}@keyframes flo{to{transform:translateY(-14px) rotate(4deg)}}
.pass{display:flex;align-items:center;gap:6px;font-size:clamp(54px,18vw,100px);direction:ltr}
.pass .ph{animation:pass 1.4s ease-in-out infinite}@keyframes pass{0%{transform:translateX(-40px) rotate(-10deg)}50%{transform:translateX(40px) rotate(10deg)}100%{transform:translateX(-40px) rotate(-10deg)}}
.pass .sp{animation:spk .7s infinite alternate;font-size:.5em}@keyframes spk{to{transform:scale(1.4) rotate(20deg);opacity:.5}}
.curtain{position:fixed;inset:0;z-index:25;display:flex;pointer-events:none}
.curtain i{flex:1;background:repeating-linear-gradient(90deg,#b0203f 0 18px,#8a1830 18px 36px);box-shadow:inset 0 0 40px #0006;transition:transform .7s cubic-bezier(.6,0,.2,1)}
.curtain.open i:first-child{transform:translateX(-101%)}.curtain.open i:last-child{transform:translateX(101%)}
.pickwrap .card.flip{animation:flipin .45s ease-out}

.pickwrap .card.bye{animation:flipout .22s ease-in forwards}
@keyframes flipout{to{transform:perspective(700px) rotateY(-90deg) scale(.8);opacity:0}}
.pickwrap .card.mark{box-shadow:0 0 0 6px #2fb36a,0 0 26px 8px #2fb36a88}
.pickwrap .card .tag{position:absolute;top:-14px;right:12px;background:#2fb36a;color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px;direction:rtl;animation:cin .2s}
.pickwrap .card{cursor:pointer}
#peek{min-height:44px;font-weight:900;font-size:26px;color:#8a4fd8;direction:ltr;background:#fff;border-radius:14px;padding:4px 14px;box-shadow:0 3px 0 #0002}
.mini{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:96vw}.mini .card{width:min(29vw,150px);padding:4px;border-width:3px;border-radius:12px;box-shadow:0 3px 0 #0002}.mini .card .g{gap:2px}.mini .card .g b{font-size:clamp(8px,2.4vw,14px);border-radius:5px}.mini .card[data-w="8"] .g b{font-size:clamp(6px,1.8vw,10px)}.pk{font-weight:800;color:#3d2766;margin-top:4px}.stage .hatbtn.sm{font-size:clamp(60px,18vw,90px)}
.hatbtn{background:none;border:none;font-size:clamp(90px,28vw,160px);line-height:1;padding:0;touch-action:none;-webkit-touch-callout:none;animation:flo 1.4s ease-in-out infinite alternate}
.sparks{position:fixed;inset:0;pointer-events:none;z-index:22}

.desk #menu{justify-content:safe center}

  sFinSay:"🎩 The magic is done!",sFinSub:"Now the magician reveals the number… 😉",sPeek:"🤫 Peek: ",sNone:"no cards",sPicked:"Chosen cards:",sAgain:"🔁 Another trick",
  range:"Up to which number?",comp:"🔮 Computer guesses",self:"🎭 Magic for a friend",
  think:"Think of a number from 1 to N",thinkS:"Don't tell me! 🤫",ready:"Got it! ▶",
  ask:"Is your number on this card?",yes:"Yes ✅",no:"No ❌",back:"◀ Back",card:"Card",
  drum:"Guessing... 🥁",your:"Your number is",wow:"Right? 🎉",
  howBtn:"❓ How does it work?",how:"How does it work? Every card starts with a special number in the corner (1, 2, 4, 8…). Every number is a sum of some of them – the right cards add up exactly!",
  reset:"🔁 All cards again",again:"🔁 Again",menu:"☰ Menu",
  selfSay:"Keep only the cards your number is on",selfSub:"Tap a card that does NOT have your number to put it away. Tap again to bring it back.",
  keep:"Kept ✔",drop:"Away ✖",done:"I'm done! 🎩",kept:"Kept",
  sumSay:"Now add the top-left numbers of the cards you kept",
  show:"Show me the number ✨",none:"No cards left – your number is… 0? 😄 Pick a number from 1",
  tryOther:"Try again",reveal:"Your number is"}};
const LANGS=[["he","עברית"],["fr","Français"],["en","English"]];
let lang="he";try{lang=localStorage.getItem("annabelle-lang")||"he"}catch(e){} if(!TX[lang])lang="he";
const t=k=>TX[lang][k];
const COLORS=["#8a4fd8","#e8862d","#2fb36a","#e23b3b","#2a8fd0","#d6479a"];
let bits=5,cards=[],mode="",order=[],idx=0,ans=[],keep=[];

let AC=null,muted=false;try{muted=localStorage.getItem("annabelle-muted")==="1"}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type="sine",v=.2,f2,delay=0){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(a.destination);o.start(n);o.stop(n+d)}
const SFX={
 click(){tone(520,.08,"triangle",.18)},
 swish(){tone(900,.18,"sine",.1,300)},
 yes(){tone(660,.1,"triangle",.22);tone(880,.16,"triangle",.22,null,.09)},
 no(){tone(300,.18,"sawtooth",.12,200)},
 back(){tone(420,.1,"triangle",.15,300)},
 away(){tone(400,.14,"sine",.18,180)},
 keep(){tone(500,.1,"sine",.18,800)},
 drum(){for(let i=0;i<14;i++)tone(110+i*6,.09,"square",.08+i*.006,70,i*.1)},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.28,"triangle",.22,null,i*.11));tone(2093,.5,"sine",.1,null,.6)}
};
function updMute(){$("muteBtn").textContent=muted?"🔇":"🔊"}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));$("kh").innerHTML=t("k_"+id)||""}
function maxN(){return (1<<bits)-1}

/* build the cards: card b holds every number 1..max whose bit b is set; the first one is 2^b */
function build(){
 cards=[];
 for(let b=0;b<bits;b++){const nums=[];for(let n=1;n<=maxN();n++)if(n&(1<<b))nums.push(n);cards.push({b,key:1<<b,nums,color:COLORS[b%COLORS.length]})}
}
function cardEl(c){
 const el=document.createElement("div");el.className="card";el.style.setProperty("--c",c.color);
 const cols=c.nums.length<=8?4:c.nums.length<=16?4:8; // 8 → 4×2, 16 → 4×4, 32 → 8×4
 const g=document.createElement("div");g.className="g";g.style.gridTemplateColumns="repeat("+cols+",1fr)";
 const big=window.AnnabelleDesk&&AnnabelleDesk.isDesk();
 const fs=cols===8?"clamp(11px,2.6vw,"+(big?26:18)+"px)":"clamp(16px,4.4vw,"+(big?38:26)+"px)";el.style.setProperty("--fs",fs);
 c.nums.forEach((n,i)=>{const b=document.createElement("b");b.textContent=n;g.appendChild(b)});
 el.appendChild(g);el.style.setProperty("--ar",cols/Math.ceil(c.nums.length/cols));
 return el;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- menu ---------- */
function drawMenu(){
 $("tTitle").textContent=t("title");document.title=t("title");
 $("rules").innerHTML=t("rules").map(r=>"<p>"+r+"</p>").join("");
 $("tRange").textContent=t("range");
 $("rng").innerHTML="";
 [[4,15],[5,31],[6,63]].forEach(([b,n])=>{const x=document.createElement("button");x.className="big"+(b===bits?" sel":"");x.textContent="1–"+n;x.dir="ltr";
  x.onclick=()=>{SFX.click();bits=b;save("annabelle-magic-bits",b);drawMenu()};$("rng").appendChild(x)});
 $("bComp").textContent=t("comp");$("bSelf").textContent=t("self");
 $("flags").innerHTML="";
 LANGS.forEach(([c,n])=>{const x=document.createElement("button");x.className="lang"+(c===lang?" sel":"");x.textContent=n;
  x.onclick=()=>{lang=c;save("annabelle-lang",c);document.documentElement.lang=c;document.documentElement.dir=c==="he"?"rtl":"ltr";drawMenu()};$("flags").appendChild(x)});
 document.documentElement.dir=lang==="he"?"rtl":"ltr";
 if($("menu").classList.contains("active"))$("kh").innerHTML=t("k_menu");
}
function toMenu(){$("res").classList.remove("on");stopConf();show("menu");drawMenu()}
window.toMenu=toMenu;
document.querySelectorAll(".homeBtn").forEach(b=>b.onclick=toMenu);

/* ---------- computer guesses ---------- */
function startComp(){
 mode="comp";build();order=shuffle(cards.map((_,i)=>i));idx=-1;ans=[];
 show("comp");thinkScreen();
}
function thinkScreen(){
 $("cInfo").textContent="🎩";
 $("cSay").textContent=t("think").replace("N",maxN());
 $("cDots").innerHTML="";
 $("cWrap").innerHTML='<div style="text-align:center"><div class="hat" style="font-size:90px">🤔</div><div class="sub" style="font-size:20px;font-weight:800">'+t("thinkS")+'</div></div>';
 $("cBtns").innerHTML="";const r=document.createElement("button");r.className="big";r.textContent=t("ready");r.onclick=()=>{SFX.click();idx=0;askCard()};$("cBtns").appendChild(r);
}
function askCard(){
 const n=order.length;
 $("cInfo").textContent=t("card")+" "+(idx+1)+"/"+n;
 $("cSay").textContent=t("ask");
 $("cDots").innerHTML=order.map((_,i)=>'<i class="'+(i<idx?"on":i===idx?"cur":"")+'"></i>').join("");
 const c=cards[order[idx]],el=cardEl(c);el.classList.add("in");SFX.swish();
 const w=$("cWrap");w.innerHTML="";w.appendChild(el);
 $("cBtns").innerHTML="";
 const bk=document.createElement("button");bk.className="big g";bk.style.minWidth="0";bk.textContent=t("back");bk.onclick=()=>{SFX.back();if(idx===0){thinkScreen();return}idx--;ans.pop();askCard()};
 const no=document.createElement("button");no.className="big n";no.textContent=t("no");no.onclick=()=>{SFX.no();answer(false)};
 const ye=document.createElement("button");ye.className="big y";ye.textContent=t("yes");ye.onclick=()=>{SFX.yes();answer(true)};
 $("cBtns").append(ye,no,bk);
}
function answer(v){
 ans[idx]=v;idx++;
 if(idx<order.length){askCard();return}
 // all answered → drum roll → reveal
 $("cBtns").innerHTML="";$("cSay").textContent=t("drum");
 $("cWrap").innerHTML='<div class="drum">🥁</div>';SFX.drum();
 setTimeout(()=>{
  const used=order.filter((ci,i)=>ans[i]).map(ci=>cards[ci]).sort((a,b)=>a.key-b.key);
  reveal(used,"comp");
 },1500);
}

/* ---------- reveal (shared) ---------- */
function reveal(used,from){
 const sum=used.reduce((s,c)=>s+c.key,0);
 const box=$("resBox");box.innerHTML="";
 if(sum===0){
  box.innerHTML='<h2>'+t("none")+'</h2>';
  const b=document.createElement("button");b.className="big";b.textContent=t("tryOther");b.onclick=()=>{$("res").classList.remove("on");from==="comp"?startComp():startSelf()};
  const nv=document.createElement("div");nv.id="resNav";box.append(b,nv);$("res").classList.add("on");return;
 }
 const h=document.createElement("h2");h.textContent=t("your");
 const num=document.createElement("div");num.id="num";num.className="pop";num.textContent=sum;
 const eq=document.createElement("div");eq.className="eq";
 eq.innerHTML=used.map(c=>'<em>'+c.key+'</em>').join(" + ")+(used.length>1?" = <em>"+sum+"</em>":"");
 const w=document.createElement("div");w.style.cssText="font-size:26px;font-weight:800";w.textContent=t("wow");
 const ex=document.createElement("div");ex.className="explain";ex.textContent=t("how");ex.style.display="none";eq.style.display="none";
 const hb=document.createElement("button");hb.className="big g";hb.style.minWidth="0";hb.textContent=t("howBtn");hb.onclick=()=>{SFX.click();const v=ex.style.display==="none"?"":"none";ex.style.display=v;eq.style.display=v};
 const row=document.createElement("div");row.className="row";
 const a=document.createElement("button");a.className="big";a.textContent=t("again");a.onclick=()=>{$("res").classList.remove("on");stopConf();from==="comp"?startComp():startSelf()};
 row.appendChild(a);
 const nv=document.createElement("div");nv.id="resNav";
 box.append(h,num,eq,w,hb,ex,row,nv);
 $("res").classList.add("on");confetti();SFX.win();
}

/* ---------- friend magic: think -> hand the phone over -> cards one at a time ---------- */
let sOrder=[],sIdx=0,sMarks=[],sStage="",peekT=null;
function sClear(){["sSay","sSub"].forEach(i=>$(i).textContent="");$("sDots").innerHTML="";$("sWrap").innerHTML="";$("sBtns").innerHTML=""}
function sBtn(txt,cls,fn){const b=document.createElement("button");b.className="big "+(cls||"");b.textContent=txt;b.onclick=fn;$("sBtns").appendChild(b);return b}
function startSelf(){
 mode="self";build();sOrder=shuffle(cards.map((_,i)=>i));sMarks=cards.map(()=>false);sIdx=0;
 show("self");sThink();
}
function sThink(){ // the thinker: pick a number, don't tell, press
 sStage="think";sClear();$("sInfo").textContent="💭";
 $("sSay").textContent=t("sThinkSay").replace("N",maxN());$("sSub").textContent=t("sThinkSub");
 $("sWrap").innerHTML='<div class="stage"><div class="bigemoji float">🤔</div><div class="bigemoji" style="font-size:44px">💭 ? ? ?</div></div>';
 sBtn(t("sThinkBtn"),"",()=>{SFX.click();sHandoff()});
}
function sHandoff(){ // hand the phone to the friend (the magician)
 sStage="hand";sClear();$("sInfo").textContent="📱➡️";SFX.swish();
 $("sSay").textContent=t("sHandSay");$("sSub").textContent=t("sHandSub");
 $("sWrap").innerHTML='<div class="stage"><div class="pass"><span class="sp">✨</span><span class="ph">📱</span><span class="sp">✨</span></div><div class="bigemoji float" style="font-size:70px">🧙</div></div>';
 sBtn(t("sHandBtn"),"o",()=>{SFX.drum();curtain(()=>{sIdx=0;sCard()})});
}
function curtain(then){ // theatre curtain closes, the step changes behind it, then it opens
 let c=document.querySelector(".curtain");if(c)c.remove();
 c=document.createElement("div");c.className="curtain open";c.innerHTML="<i></i><i></i>";document.body.appendChild(c);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{c.classList.remove("open");setTimeout(()=>{then();requestAnimationFrame(()=>c.classList.add("open"));setTimeout(()=>c.remove(),900)},760)}));
}
function sCard(){ // one card at a time; the previous ones are already hidden
 sStage="card";sClear();const n=sOrder.length,ci=sOrder[sIdx],c=cards[ci];
 $("sInfo").textContent="🃏 "+(sIdx+1)+"/"+n;$("sSay").textContent=t("sAsk");
 $("sDots").innerHTML=sOrder.map((_,i)=>'<i class="'+(i<sIdx?"on":i===sIdx?"cur":"")+'"></i>').join("");
 const el=cardEl(c);el.classList.add("flip");el.tabIndex=0;el.setAttribute("role","button");
 const paint=()=>{el.classList.toggle("mark",sMarks[ci]);let tg=el.querySelector(".tag");if(sMarks[ci]){if(!tg){tg=document.createElement("div");tg.className="tag";tg.textContent=t("sMark");el.appendChild(tg)}}else if(tg)tg.remove()};
 el.onclick=()=>{sMarks[ci]=!sMarks[ci];sMarks[ci]?SFX.keep():SFX.away();paint()};paint();
 $("sWrap").appendChild(el);SFX.swish();
 sBtn(sIdx===n-1?t("sLast"):t("sNext"),"y",sNextCard);
}
function sNextCard(){
 SFX.click();const el=$("sWrap").querySelector(".card");
 const go=()=>{sIdx++;if(sIdx>=sOrder.length)sFinish();else sCard()};
 if(el){el.classList.remove("flip");el.classList.add("bye");setTimeout(go,230)}else go();
}
function sFinish(){
 sStage="done";sClear();$("sInfo").textContent="🎩";
 $("sSay").textContent=t("sFinSay");$("sSub").textContent=t("sFinSub");
 $("sWrap").innerHTML='<div class="stage"><button class="hatbtn sm" id="hatBtn" aria-label="🎩">🎩</button><div id="peek" style="display:none"></div><div class="pk" id="pkT"></div><div class="mini" id="pkRow"></div></div>';
 {const ch=cards.filter((c,i)=>sMarks[i]).sort((a,b)=>a.key-b.key);$("pkT").textContent=ch.length?t("sPicked"):t("sNone");
  ch.forEach(c=>{const el=cardEl(c);el.dataset.w=c.nums.length>16?"32":"8";$("pkRow").appendChild(el)})}
 const hb=$("hatBtn"),tm={t:null};
 hb.addEventListener("pointerdown",e=>{e.preventDefault();clearTimeout(tm.t);tm.t=setTimeout(peek,650)});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>hb.addEventListener(ev,()=>clearTimeout(tm.t)));
 hb.addEventListener("contextmenu",e=>e.preventDefault());
 SFX.win();confetti();
 sBtn(t("sAgain"),"",()=>{stopConf();SFX.click();startSelf()});
}
function peek(){ // secret hint for the magician only: the corner numbers of the cards that were marked
 const ks=cards.filter((c,i)=>sMarks[i]).map(c=>c.key).sort((a,b)=>a-b),pk=$("peek");if(!pk)return;
 pk.textContent=t("sPeek")+(ks.length?ks.join(" + "):t("sNone"));pk.style.display="";SFX.keep();
 clearTimeout(peekT);peekT=setTimeout(()=>{if(pk)pk.style.display="none"},3000);
}

let cf=null,cfT=null;
function confetti(){
 const cv=$("conf");cv.width=innerWidth;cv.height=innerHeight;const x=cv.getContext("2d");
 const P=[];for(let i=0;i<110;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*6,c:COLORS[i%COLORS.length],a:Math.random()*6});
 const end=Date.now()+3500;cancelAnimationFrame(cf);
 (function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
  if(Date.now()<end)cf=requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})();
}
function stopConf(){cancelAnimationFrame(cf);const cv=$("conf");cv.getContext("2d").clearRect(0,0,cv.width,cv.height)}

// keyboard (laptop)
const isOn=id=>$(id).classList.contains("active");
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||(window.AnnabelleDesk&&AnnabelleDesk.typing(e)))return;
 const k=e.key,kk=k.length===1?k.toLowerCase():k,act=k==="Enter"||k===" ",btn=e.target&&e.target.closest&&e.target.closest("button,a,input"),card=e.target&&e.target.closest&&e.target.closest("#selfList .card");
 const click=el=>{if(el){e.preventDefault();el.click()}};
 if($("res").classList.contains("on")){if(act&&!btn)click($("resBox").querySelector("button.big:not(.g)"));else if(k==="Escape"){e.preventDefault();toMenu()}return}
 if(isOn("menu")){if(kk==="1")click($("bComp"));else if(kk==="2")click($("bSelf"));else if(kk==="r"){e.preventDefault();bits=bits>=6?4:bits+1;save("annabelle-magic-bits",bits);SFX.click();drawMenu()}return}
 if(k==="Escape"&&(isOn("comp")||isOn("self"))){e.preventDefault();toMenu();return}
 if(isOn("comp")){
  const ye=$("cBtns").querySelector(".big.y"),no=$("cBtns").querySelector(".big.n"),bk=$("cBtns").querySelector(".big.g"),rd=$("cBtns").querySelector(".big:not(.y):not(.n):not(.g)");
  const rtl=document.documentElement.dir==="rtl";
  if(ye){ if(kk==="y"||(act&&!btn))click(ye);else if(kk==="n")click(no);else if(k==="ArrowRight")click(rtl?ye:no);else if(k==="ArrowLeft")click(rtl?no:ye);else if(k==="Backspace")click(bk)}
  else if(rd&&act&&!btn)click(rd);
  return}
 if(isOn("self")){
  const st=sStage;
  if(btn)return; // a focused button handles Enter/Space itself
  if(st==="think"||st==="hand"){if(act)click($("sBtns").querySelector("button"));return}
  if(st==="card"){const rtl=document.documentElement.dir==="rtl";
   if(k===" "){e.preventDefault();click($("sWrap").querySelector(".card"))}
   else if(k==="Enter"||kk==="n"||k===(rtl?"ArrowLeft":"ArrowRight"))click($("sBtns").querySelector("button"));return}
  if(st==="done"){if(kk==="h"){e.preventDefault();peek()}else if(act)click($("sBtns").querySelector("button"))}
 }
});
document.addEventListener("click",e=>{if(e.detail>0&&window.AnnabelleDesk&&AnnabelleDesk.isDesk()){const b=e.target.closest&&e.target.closest("button");if(b)setTimeout(()=>b.blur(),0)}});
$("bComp").onclick=()=>{SFX.click();startComp()};$("bSelf").onclick=()=>{SFX.click();startSelf()};
$("muteBtn").addEventListener("click",()=>{muted=!muted;save("annabelle-muted",muted?"1":"0");updMute();if(!muted)SFX.click()});updMute();
const sb=+load("annabelle-magic-bits");if(sb>=4&&sb<=6)bits=sb;
drawMenu();
</script>
