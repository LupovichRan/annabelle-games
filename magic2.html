 ATK.card=card;ATK.col=pick.indexOf(card)%3;ATK.t0=performance.now();
 const box=$("aCols");box.innerHTML="";box.style.fontSize=[46,38,32,28][ATK.tier]+"px";
 for(let j=0;j<3;j++){const b=document.createElement("button");b.className="col";b.style.setProperty("--c",COL[j]);b.dataset.c=j;b.setAttribute("aria-label",t("col")+" "+(j+1));
  b.innerHTML='<span class="n">'+(j+1)+'</span>';
  for(let r=0;r<n/3;r++){const c=pick[r*3+j];const e=document.createElement("div");e.className="card";e.textContent=c.e;b.appendChild(e)}
  b.onclick=()=>atkPick(j);box.appendChild(b)}
 const tc=$("aTc");tc.textContent=card.e;tc.classList.remove("pop","shake");void tc.offsetWidth;tc.classList.add("pop");
 $("aTn").textContent=card.i>=0?NAMES[lang][card.i]:"";atkInfo();
}
function atkInfo(){$("aInfo").textContent="⭐ "+ATK.score+"  "+at("time")+" "+Math.ceil(Math.max(ATK.left,0))+(ATK.streak>=2?"  🔥"+ATK.streak:"")}
function atkFx(msg,bad){const f=$("aFx");f.textContent=msg;f.className=bad?"bad":"";clearTimeout(atkFx.t);atkFx.t=setTimeout(()=>{f.textContent=""},1100)}
function atkPick(j){
 if(!ATK.on||ATK.paused||ATK.lock)return;
 const el=document.querySelectorAll("#aCols .col")[j];if(!el)return;
 if(j===ATK.col){
  const fast=performance.now()-ATK.t0<2000,pts=ATK_N[ATK.tier]+Math.min(ATK.streak,10)*2+(fast?5:0);
  ATK.score+=pts;ATK.streak++;ATK.solved++;ATK.left=Math.min(90,ATK.left+2);
  SFX.pick();SFX.sparkle();{const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,10)}
  atkFx("+"+pts+(ATK.streak>=3?"  "+at("combo",{n:ATK.streak}):fast?"  "+at("fast"):""));
  const nt=ATK_AT.reduce((r,v,k)=>ATK.solved>=v?k:r,0);
  if(nt>ATK.tier){ATK.tier=nt;atkFx(at("tier",{n:ATK_N[nt]}));SFX.fan()}
  $("aMascot").textContent=rnd(["😸","😼","😺"])+"🔍";atkDeal(null);
 }else{
  ATK.streak=0;ATK.left-=3;SFX.no();atkFx(at("bad"),true);el.classList.add("bad");ATK.lock=true;
  const tc=$("aTc");tc.classList.remove("pop","shake");void tc.offsetWidth;tc.classList.add("shake");atkInfo();
  const tok=runTok;setTimeout(()=>{if(tok!==runTok||!ATK.on)return;ATK.lock=false;atkDeal(ATK.card)},350);
  if(ATK.left<=0)atkEnd();
 }
}
function atkTick(){
 if(!ATK.on)return;const now=performance.now();
 if(ATK.paused||document.hidden){ATK.last=now;if(document.hidden&&!ATK.paused)atkPause(true);return}
 ATK.left-=Math.min(now-ATK.last,250)/1000;ATK.last=now;
 const c=Math.ceil(Math.max(ATK.left,0));if(c!==ATK.sec){ATK.sec=c;if(c<=5&&c>0)SFX.click()}
 $("aTime").style.width=Math.max(0,Math.min(100,ATK.left/60*100))+"%";$("aTbar").classList.toggle("low",ATK.left<10);atkInfo();
 if(ATK.left<=0)atkEnd();
}
function atkPause(on){if(!ATK.on)return;ATK.paused=on;ATK.last=performance.now();$("aPov").classList.toggle("on",on);$("aPause").textContent=on?"▶":"⏸"}
function atkEnd(){
 if(!ATK.on)return;atkStop();stage="atkend";const sc=ATK.score;
 const tp=atkTop(),isBest=sc>0&&(!tp.length||sc>tp[0].s),d=new Date().toISOString().slice(0,10);
 let rank=-1;if(sc>0){tp.push({s:sc,n:ATK.solved,d,me:1});tp.sort((a,b)=>b.s-a.s||(b.me?1:0)-(a.me?1:0));rank=tp.findIndex(x=>x.me);try{localStorage.setItem(AKEY,JSON.stringify(tp.slice(0,5).map(x=>({s:x.s,n:x.n,d:x.d}))))}catch(e){}}
 const R_=RW();if(R_){R_.award({game:"magic2",event:"score",score:sc});if(sc>=250)R_.award({game:"magic2",event:"star",stars:sc>=900?3:sc>=500?2:1});if(isBest)R_.award({game:"magic2",event:"win"});R_.flush()}
 const box=$("resBox");box.innerHTML="";
 const h=document.createElement("h2");h.textContent=at("over");
 const num=document.createElement("div");num.id="num";num.textContent=sc;
 const sub=document.createElement("div");sub.className="eq";sub.textContent=at("solved")+": "+ATK.solved;
 box.append(h,num,sub);
 if(isBest||(rank>=0&&rank<5))box.appendChild(badgeEl([isBest?at("nb"):"🏅 #"+(rank+1)]));
 if(tp.length){const t5=document.createElement("div");t5.className="top5";t5.innerHTML="<h4>"+at("top")+"</h4>"+tp.slice(0,5).map((x,i)=>'<div class="'+(x.me&&i===rank?"me":"")+'"><span>'+["🥇","🥈","🥉","4.","5."][i]+" "+x.s+'</span><span>'+x.n+" "+at("solved")+"</span></div>").join("");box.appendChild(t5)}
 const row=document.createElement("div");row.className="row";const a=document.createElement("button");a.className="big y";a.textContent=at("again");a.onclick=()=>{startAtk()};row.appendChild(a);
 const nv=document.createElement("div");nv.id="resNav";box.append(row,nv);
 $("res").classList.add("on");if(sc>=250){SFX.win();confetti()}else SFX.no();
 atkBestDraw();
}
$("aPause").onclick=()=>atkPause(!ATK.paused);$("aPovB").onclick=()=>atkPause(false);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&ATK.on&&!ATK.paused)atkPause(true)});
window.__magic2={ATK,startAtk,atkPick,atkEnd,atkTop};

let cf=null;const PART=[];
const CC=["#e8862d","#2fb36a","#d6479a","#6a4fe0","#2a8fd0","#e23b3b"];
function pLoop(){const cv=$("conf"),x=cv.getContext("2d");x.clearRect(0,0,cv.width,cv.height);
 for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.life-=1/60;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a+=p.w;
  if(p.life<=0||p.y>cv.height+30){PART.splice(i,1);continue}
  x.save();x.globalAlpha=Math.max(0,Math.min(1,p.life*2));x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
  if(p.s===1){x.beginPath();for(let q=0;q<10;q++){const r=q%2?p.r*.45:p.r*1.2,an=q*Math.PI/5;x.lineTo(Math.cos(an)*r,Math.sin(an)*r)}x.fill()}
  else if(p.s===2){x.beginPath();x.arc(0,0,p.r*.7,0,7);x.fill()}else x.fillRect(-p.r,-p.r/2,p.r*2,p.r);
  x.restore()}
 cf=PART.length?requestAnimationFrame(pLoop):null}
function addP(o){PART.push(o);if(PART.length>260)PART.shift();if(!cf)cf=requestAnimationFrame(pLoop)}
function sizeConf(){const cv=$("conf");if(cv.width!==innerWidth||cv.height!==innerHeight){cv.width=innerWidth;cv.height=innerHeight}}
function confetti(){sizeConf();const cv=$("conf");for(let i=0;i<90;i++)addP({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,g:0,r:4+Math.random()*6,c:CC[i%CC.length],a:Math.random()*6,w:.15,s:i%3,life:5})}
function sparks(x,y,n=14){sizeConf();for(let i=0;i<n;i++){const an=Math.random()*7,sp=2+Math.random()*5;addP({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2,g:.18,r:3+Math.random()*5,c:i%3?CC[i%CC.length]:"#ffd23f",a:0,w:.2,s:1,life:.8+Math.random()*.5})}}
function stopConf(){PART.length=0;cancelAnimationFrame(cf);cf=null;const cv=$("conf");cv.getContext("2d").clearRect(0,0,cv.width,cv.height)}

/* keyboard */
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||(window.AnnabelleDesk&&AnnabelleDesk.typing&&AnnabelleDesk.typing(e)))return;
 const k=e.key;
 if(k==="m"||k==="M"){$("muteBtn").click();return}
 if(stage==="atk"){
  if(k==="Escape"){toMenu();return}
  if(k==="p"||k==="P"){e.preventDefault();atkPause(!ATK.paused)}
  else if(ATK.paused&&(k==="Enter"||k===" ")&&!(e.target.closest&&e.target.closest("button"))){e.preventDefault();atkPause(false)}
  else{const m={"1":0,"2":1,"3":2,ArrowLeft:0,ArrowDown:1,ArrowRight:2};if(k in m){e.preventDefault();atkPick(m[k])}}
  return}
 if($("res").classList.contains("on")){if(k==="Escape"){toMenu()}else if((k==="Enter"||k===" ")&&!(e.target.closest&&e.target.closest("button"))){e.preventDefault();const b=$("resBox").querySelector("button.big");b&&b.click()}return}
 if(stage==="menu"){if(k==="2"){$("bAtk").click();return}if(k==="Enter"||k===" "){if(!(e.target.closest&&e.target.closest("button"))){e.preventDefault();$("bPlay").click()}}return}
 if(k==="Escape"){toMenu();return}
 if(stage==="pick"){const m={"1":0,"2":1,"3":2,ArrowLeft:0,ArrowDown:1,ArrowRight:2};if(k in m){e.preventDefault();pick(m[k])}return}
 if(stage==="reveal"&&drumGo&&(k==="Enter"||k===" ")){e.preventDefault();drumGo();return}
 if(stage==="think"||stage==="done"){if(k==="Enter"||k===" "){if(!(e.target.closest&&e.target.closest("button"))){e.preventDefault();const b=$("btns").querySelector("button");b&&b.click()}}}
});
window.__m2={get deck(){return deck},get stage(){return stage}};
drawMenu();
</script>
