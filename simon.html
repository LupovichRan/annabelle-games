<style>
:root{--ink:#2a1a10;--cream:#fff4d6;--or:#ffb347;--col:820px}
@media (min-width:1700px) and (min-height:860px){:root{--col:1060px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:#1b1445;font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew",Arial,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
body{background:linear-gradient(#120c36 0,#241a63 45%,#3d2a7d 80%,#5a3688 100%)}
button,a{font-family:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation;background:none;padding:0;text-decoration:none}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;image-rendering:pixelated;background-size:384px 384px;animation:drift 80s linear infinite}
#sky2{background-size:512px 512px;animation-duration:140s;opacity:.7}
@keyframes drift{to{background-position:-1536px 384px}}
.ib{width:48px;height:48px;background:var(--cream);color:var(--ink);border:3px solid #000;box-shadow:0 4px 0 #000;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:6px}
.ib:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 #000}
.ib.off{opacity:.55}
#app{position:fixed;inset:0;display:flex;flex-direction:column;gap:6px;max-width:var(--col);margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
#top{display:flex;gap:8px;align-items:center;flex:none;direction:ltr}
#lvName{flex:1;min-width:0;text-align:center;background:#000a;border:2px solid #000;border-radius:6px;padding:4px 8px;font-weight:900;font-size:clamp(14px,4vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:34px;line-height:24px}
#scene{flex:none;display:flex;align-items:center;gap:10px;background:#0b082699;border:3px solid #000;border-radius:8px;padding:4px 10px;min-height:58px;box-shadow:inset 0 0 0 2px #ffffff1c}
#bed{position:relative;flex:none;min-width:58px;height:48px;font-size:38px;line-height:48px;text-align:center;direction:ltr}
#anim{display:inline-block;transition:transform .7s}
#anim.two{font-size:28px;letter-spacing:-4px}
#anim.sleep{transform:rotate(-78deg) translateX(-4px)}
#mood{position:absolute;top:-8px;right:-10px;font-size:20px;line-height:1}
#mood.zz{animation:zz 1.2s ease-in-out infinite}
@keyframes zz{50%{transform:translate(4px,-6px) scale(1.25)}}
#mid{flex:1;min-width:0}
#sub{font-weight:900;font-size:clamp(14px,4vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meter{display:flex;gap:3px;margin-top:5px;direction:ltr;align-items:center;min-height:12px}
#meter i{flex:1;height:10px;background:#ffffff2e;border:2px solid #000;border-radius:3px;max-width:36px}
#meter i.f{background:#8fe3ff;box-shadow:0 0 6px #8fe3ff}
#meter b{font-size:13px;margin-inline-start:4px;font-weight:400}
#side{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;direction:ltr}
#hearts{font-size:15px;white-space:nowrap;line-height:1.2}
#bot{font-size:26px;line-height:1;animation:wig .5s ease-in-out infinite alternate}
#bot.zz{animation:botout 1.6s forwards}
@keyframes wig{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-3px)}}
@keyframes botout{30%{transform:rotate(25deg) scale(1.3)}100%{transform:rotate(720deg) scale(.1) translateY(-40px);opacity:0}}
#turnRow{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px 12px;min-height:40px}
#turn{font-weight:900;font-size:clamp(17px,5vw,23px);padding:4px 16px;border:3px solid #000;border-radius:999px;background:#3a56c8;color:#fff;box-shadow:0 4px 0 #000;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
#turn.go{background:#35c95a;color:#052a10;animation:pulse .6s ease-in-out infinite alternate}
#turn.go.p0{background:#ff7d98}#turn.go.p1{background:#ffb347}
#turn.ok{background:#ffe14d;color:#3a2a00}
#turn.bad{background:#ff8f6b;color:#3a0c00}
#turn.nudge{animation:nudge .3s}
@keyframes pulse{to{transform:scale(1.07)}}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#dots{display:flex;gap:5px;direction:ltr;flex-wrap:wrap;justify-content:center;align-items:center;min-height:16px}
#dots i{width:14px;height:14px;border:2px solid #000;border-radius:50%;background:#ffffff3a;font-style:normal;transition:transform .1s}
#dots i.h{background:#9fb4ff}
#dots i.s{background:#ffe14d;transform:scale(1.45)}
#dots i.d{background:#35c95a}
#dots i.plus{background:#fff;color:#000;font-size:12px;font-weight:900;line-height:10px;text-align:center;animation:pulse .5s infinite alternate}
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;direction:ltr;touch-action:none}
#grid{display:grid;justify-content:center;align-content:center;padding-bottom:8px}
.pd{position:relative;border:4px solid #000;border-radius:18px;background:var(--c);box-shadow:0 8px 0 #000,inset 0 -12px 0 var(--cd),inset 0 8px 0 var(--c2);display:flex;align-items:center;justify-content:center;touch-action:none;padding:0;min-width:0;min-height:0}
body.dim .pd{filter:brightness(.72) saturate(.85)}
body.turn #grid{filter:drop-shadow(0 0 10px #7dff9a88)}
.pd.lit,body.dim .pd.lit{filter:brightness(1.12) saturate(1.3);background:radial-gradient(circle at 50% 46%,var(--c2) 0 38%,var(--c) 100%);box-shadow:0 8px 0 #000,0 0 0 5px #fff,0 0 36px 10px var(--c),inset 0 -12px 0 var(--c),inset 0 8px 0 #fff;z-index:2}
.pd.hint{animation:hint .55s ease-in-out infinite alternate}
.pd.bad{animation:bad .4s}
.pd.cur{outline:4px dashed #fff;outline-offset:3px}
@keyframes hint{to{box-shadow:0 8px 0 #000,0 0 0 6px #fff,0 0 26px 6px #fff,inset 0 -12px 0 var(--cd),inset 0 8px 0 var(--c2);filter:brightness(1.12)}}
@keyframes bad{20%{transform:translateX(-9px) rotate(-3deg)}50%{transform:translateX(9px) rotate(3deg)}80%{transform:translateX(-5px)}}
.pd canvas{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;pointer-events:none;display:block}
.pd .kb{position:absolute;top:8px;left:10px;display:none;background:#000a;color:#fff;border-radius:6px;padding:1px 7px;font:900 14px "Courier New",monospace}
.desk .pd .kb{display:block}
#banner{position:absolute;left:50%;top:46%;z-index:4;pointer-events:none;display:none;width:max-content;max-width:94%;text-align:center;background:var(--cream);color:var(--ink);border:4px solid #000;border-radius:10px;box-shadow:0 8px 0 #000,inset 0 0 0 3px #e0b878;padding:10px 18px}
#banner.on{display:block;animation:slide var(--d,2s) both}
#banner small{display:block;font-weight:900;font-size:15px;color:#c8590a;letter-spacing:1px}
#banner b{display:block;font-size:clamp(22px,6.5vw,34px);line-height:1.2}
#banner em{display:block;font-style:normal;font-size:clamp(15px,4.2vw,19px);margin-top:4px;line-height:1.3;white-space:normal}
#banner.boss{background:#ffd3d3;box-shadow:0 8px 0 #000,inset 0 0 0 3px #ff6b6b}
#banner.boss b{color:#b3002d}
#banner .be{font-size:clamp(44px,13vw,64px);line-height:1.1;display:block}
#banner.boss .be{animation:wig .25s infinite alternate}
#banner.out .be{animation:bossout 2.1s both}
@keyframes slide{0%{transform:translate(-170%,-50%) skewX(-10deg)}12%{transform:translate(-46%,-50%)}16%{transform:translate(-50%,-50%)}88%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(90%,-50%) skewX(10deg);opacity:0}}
@keyframes bossout{0%{transform:rotate(0) scale(1)}15%{transform:rotate(-20deg) scale(1.2)}30%{transform:rotate(20deg) scale(1.2)}45%{transform:rotate(0) scale(1.1) translateY(6px)}100%{transform:rotate(1080deg) scale(.15) translateY(-90px);opacity:.2}}
#ann{position:absolute;left:50%;top:34%;z-index:5;pointer-events:none;opacity:0;font-weight:900;font-size:clamp(38px,12vw,70px);color:#ffe14d;white-space:nowrap;text-shadow:3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000,0 6px 0 #b3002d;transform:translate(-50%,-50%)}
#ann.on{animation:ann .95s both}
@keyframes ann{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(4deg)}45%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}80%{opacity:1;transform:translate(-50%,-62%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
#toast{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:#000d;border:3px solid #ffd36b;border-radius:8px;padding:6px 14px;font-weight:900;font-size:clamp(15px,4.2vw,20px);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;max-width:94%;width:max-content;z-index:6}
#toast.on{opacity:1}
#strip{flex:none;display:none;gap:3px;justify-content:center;flex-wrap:wrap;direction:ltr;min-height:20px}
#strip i{width:13px;height:18px;border:2px solid #000;border-radius:4px}
#strip i.s{transform:scale(1.35);box-shadow:0 0 0 2px #fff}
#strip span{font-size:14px;opacity:.7}
#bar{flex:none;display:flex;gap:8px;justify-content:center;align-items:center;min-height:56px}
#bar .bt{width:auto;min-width:120px;margin:0;flex:0 1 auto;padding:6px 16px}
#bar .bt.sq{min-width:56px}
#bar small{font-weight:700;opacity:.75}
#fx{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100vw,var(--col));height:100%;z-index:30;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
#flash.on{animation:flash .28s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.ov{position:fixed;inset:0;top:calc(max(6px,env(safe-area-inset-top)) + 54px);display:none;align-items:center;justify-content:center;background:#080520b0;z-index:10;padding:10px 12px;overflow:auto}
body:not(.playing) #pauseBtn{visibility:hidden}
.ov.on{display:flex}
.card{background:var(--cream);color:var(--ink);border:4px solid #000;box-shadow:0 8px 0 #000,inset 0 0 0 3px #e0b878;border-radius:10px;padding:14px;max-width:520px;width:100%;max-height:100%;overflow:auto;text-align:center;touch-action:pan-y}
.card h1{margin:0 0 2px;font-size:clamp(26px,8vw,38px);color:#6a3fd0;text-shadow:2px 2px 0 #fff,3px 3px 0 #ffd36b}
.card h2{margin:0 0 8px;font-size:clamp(20px,6vw,28px)}
.card p{margin:6px 0;font-size:clamp(15px,4.2vw,19px);line-height:1.4}
.card p.subt{margin:0 0 8px;font-weight:700;opacity:.8}
.bt{display:block;width:100%;min-height:52px;margin:8px 0;background:var(--or);color:var(--ink);border:3px solid #000;box-shadow:0 5px 0 #000;border-radius:8px;font-size:clamp(17px,5vw,21px);font-weight:900;padding:8px 12px;transition:transform .06s}
.bt:active{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #000}
.bt:disabled{opacity:.45}
.bt.alt{background:#fff}
.bt.sm{display:inline-block;width:auto;min-width:52px;margin:4px;font-size:17px}
.bt small{display:block;font-size:13px;font-weight:700;opacity:.75}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.modes .bt{margin:0;min-height:66px;padding:6px 4px}
.bt.c2{background:#8fe3ff}.bt.c3{background:#ffa3c4}.bt.c4{background:#b8f08a}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row3{display:flex;gap:6px;margin:8px 0 2px}.row3 .bt{flex:1 1 0;min-width:0;margin:0;padding:4px 2px;font-size:clamp(13px,3.9vw,17px);line-height:1.15}
.chip{min-width:86px;min-height:48px;border:3px solid #000;background:#fff;border-radius:8px;font-weight:900;font-size:17px;box-shadow:0 4px 0 #000;padding:4px 10px;margin-top:6px}
.chip:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 #000}
.chip.sel{background:#7fd35a}
.bige{font-size:clamp(54px,17vw,88px);line-height:1.1;margin:4px 0}
.choir{display:flex;justify-content:center;gap:8px;direction:ltr;margin-bottom:2px}
.msc{width:56px;height:56px;image-rendering:pixelated;border:3px solid #000;border-radius:10px;animation:bob .9s ease-in-out infinite alternate;box-shadow:0 4px 0 #000}
@keyframes bob{from{transform:translateY(3px) rotate(-3deg)}to{transform:translateY(-5px) rotate(3deg)}}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;direction:ltr}
.lv{min-height:64px;border:3px solid #000;background:#fff;border-radius:8px;font-weight:900;font-size:19px;box-shadow:0 4px 0 #000;padding:4px 0;line-height:1.15}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.lv small{display:block;font-size:12px;letter-spacing:-1px}
.lv.lock{opacity:.4}
.lv.boss{background:#ffb3b3}
.zg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.za{background:#fff;border:3px solid #000;border-radius:8px;padding:4px 1px;font-size:11px;font-weight:700;min-height:66px;overflow:hidden}
.za b{display:block;font-size:30px;line-height:1.2;font-weight:400}
.za.no b{filter:grayscale(1) brightness(.2);opacity:.5}
.stars{font-size:clamp(34px,10vw,48px);letter-spacing:4px;direction:ltr}
.stars span{display:inline-block;animation:pop .45s both}
.panel{border:4px solid #000;background:#2a1f6a;color:#fff;border-radius:6px;padding:12px;margin:8px 0;min-height:120px}
.dots2{margin:6px 0;font-size:20px}
.hst{background:#120a2e;color:#ffe14d;border:3px solid #000;border-radius:6px;padding:6px 8px;font-family:"Courier New",monospace;font-weight:900;margin:8px 0;direction:ltr;box-shadow:inset 0 0 0 2px #ff6fb5}
.hst h4{margin:0 0 3px;color:#ff6fb5;letter-spacing:2px;font-size:16px;text-shadow:0 0 8px #ff6fb5}
.hst div{display:flex;justify-content:space-between;gap:8px;padding:1px 8px;font-size:15px}
.hst div.nn{justify-content:center;opacity:.6;font-size:13px}
.hst div.me{color:#fff;background:#ff6fb566;animation:me .5s steps(2) infinite}
.newrec{color:#e0193d;font-weight:900;font-size:clamp(22px,7vw,30px);letter-spacing:1px;animation:rec .45s steps(2) infinite;margin:4px 0;text-shadow:2px 2px 0 #ffe14d}
.scoreBig{font:900 clamp(60px,20vw,96px)/1 "Courier New",monospace;color:#6a3fd0;text-shadow:3px 3px 0 #ffd36b;direction:ltr}
.joinbox{display:flex;align-items:center;gap:10px;justify-content:center;background:#e8dcff;border:3px solid #000;border-radius:8px;padding:6px 10px;margin:8px 0;font-weight:900}
.joinbox canvas{width:56px;height:56px;image-rendering:pixelated;flex:none;border:3px solid #000;border-radius:8px}
.rays{position:relative;display:inline-block}
.rays{margin:14px 0}.rays:before{content:"";position:absolute;left:50%;top:50%;width:1.9em;height:1.9em;margin:-.95em 0 0 -.95em;border-radius:50%;background:radial-gradient(circle,#fff 0 46%,#fff0 50%),repeating-conic-gradient(#ffc93c 0 12deg,#fff0 12deg 24deg);animation:spin 7s linear infinite;z-index:0}
.rays span{position:relative;z-index:1;display:inline-block;animation:pop .6s both}
.keys{font-size:12px!important;opacity:.7;display:none}
.desk .keys{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}@keyframes me{50%{background:#ffe14d;color:#120a2e}}@keyframes rec{50%{color:#ff9d00;transform:scale(1.08)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .4s}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000014 3px 4px)}
@media (max-height:700px){#scene{min-height:50px}#bed{height:42px;font-size:32px;line-height:42px}#bar{min-height:50px}#bar .bt{min-height:46px}.msc{width:44px;height:44px}.modes .bt{min-height:58px}.card{padding:10px 14px}.chip{min-height:42px}}
@media (prefers-reduced-motion:reduce){.sky,.msc,#bot,.rays:before{animation:none}#banner.on{animation:none;transform:translate(-50%,-50%)}#ann{display:none}}
</style>
</head>

function drawFace(cx,i,st){ // st: 0 idle, 1 sing, 2 blink, 3 joy
  const F=FACE[i],p=F.pal;cx.clearRect(0,0,16,16);
  for(let y=0;y<16;y++){const r=F.rows[y];for(let x=0;x<8;x++){const ch=r[x];if(ch==='.')continue;cx.fillStyle=p[ch];cx.fillRect(x,y,1,1);cx.fillRect(15-x,y,1,1)}}
  const e=F.eye,lx=e.x,w=e.s==='owl'?3:2,rx=16-e.x-w,K=p.k;
  const px=(x,y,c,ww,hh)=>{cx.fillStyle=c;cx.fillRect(x,y,ww||1,hh||1)};
  if(st===2){if(e.s!=='patch'){px(lx,e.y+e.h-1,K,w);px(rx,e.y+e.h-1,K,w)}}
  else if(st===3){const c=e.s==='patch'?'#ffffff':K;[lx,rx].forEach(x=>{px(x,e.y,c,w);px(x-1,e.y+1,c);px(x+w,e.y+1,c)})}
  else if(e.s==='dark'){px(lx,e.y,K,2,e.h);px(rx,e.y,K,2,e.h);px(lx,e.y,'#fff');px(rx,e.y,'#fff')}
  else if(e.s==='patch'){px(lx,e.y,'#fff');px(rx,e.y,'#fff')}
  else{px(lx,e.y,'#ffd23f',3,3);px(rx,e.y,'#ffd23f',3,3);px(lx+1,e.y+1,K);px(rx+1,e.y+1,K)}
  const m=F.mouth;
  if(st===1){px(7,m.y,'#8a1030',2,2);px(7,m.y+1,'#ff7fa0',2,1)}
  else if(st===3){px(6,m.y,K);px(9,m.y,K);px(7,m.y+1,K,2,1)}
  else if(m.idle){px(7,m.y,K,2,1)}
}

/* ---------------- update ---------------- */
function update(dt){
  G.clock+=dt;G.pt+=dt;
  switch(G.ph){
  case 'intro':if(G.pt>=G.introDur){const f=G.introNext;G.introNext=null;hideBanner();if(f)f();else startShow('turn')}break;
  case 'show':
    while(G.ph==='show'&&G.pt>=G.nextAt){
      if(G.k<G.cur.length){const on=noteOn(G.k);lightPad(G.cur[G.k],on,true);notesFx(G.cur[G.k],1);G.k++;G.nextAt+=on+(G.k<G.cur.length?DIFF[G.diff].gap*G.speed:.05);drawDots()}
      else if(G.after==='duoRep')beginDuoRep();else beginTurn();
    }break;
  case 'turn':{G.idle+=dt;const H=hintT();if(H>0&&G.idle>=H&&G.hint<0)G.hint=G.expect[G.pos]}break;
  case 'good':if(G.pt>=DIFF[G.diff].good)nextRound();break;
  case 'oops':
    if(!G.oopsShown&&G.pt>=.45&&G.diff!=='hard'&&G.hearts>0){G.oopsShown=true;lightPad(G.want,.5,true,.7)}
    if(G.pt>=1.3){if(G.hearts>0)startShow('turn');else if(G.kind==='arcade')arcadeEnd();else fail()}break;
  case 'sleep':

    if(!G.chord&&G.lapK>=G.seq.length&&G.pt>=G.lapAt+.1){G.chord=true;SFX.chord();P.forEach((p,i)=>{if(i<G.n){p.lit=.5;p.bt=0;p.joy=.9}})}
    if(G.pt>=G.sleepDur)finishLevel();break;
  case 'duoPass':if(G.pt>=1){G.duo.turn^=1;beginDuoRep();updBar()}break;
  case 'duoEnd':
    if(!G.oopsShown&&G.pt>=.45){G.oopsShown=true;lightPad(G.want,.5,true,.7)}
    if(G.pt>=1.4)duoResult();break;
  case 'pplay':
    while(G.ph==='pplay'&&G.pt>=G.nextAt){
      if(G.k<G.pl.length){const it=G.pl[G.k];lightPad(it[0],it[2]||.3,true);notesFx(it[0],1);G.k++;G.nextAt+=G.k<G.pl.length?Math.max(.14,G.pl[G.k][1]):.5;drawStrip()}

    if(G.shake>0)G.shake-=dt;
  }

}

function render(){

    let s=1,y=0;
    if(play&&p.bt<.6)s=1+.1*Math.exp(-7*p.bt)*Math.cos(19*p.bt);
    if(play&&p.joy>0)y=-Math.abs(Math.sin(p.joy*11))*9;else if(play&&bob&&!lit)y=Math.sin(T*3.2+i*1.7)*2.2;
    const tr=(s!==1||y!==0)?'translateY('+y.toFixed(1)+'px) scale('+s.toFixed(3)+')':'';
    if(tr!==p.tr){p.tr=tr;p.el.style.transform=tr}
  }
  const sh=play&&G.shake>0?'translate('+((Math.random()-.5)*8).toFixed(1)+'px,'+((Math.random()-.5)*6).toFixed(1)+'px)':'';
  if(sh!==G._sh){G._sh=sh;$('stage').style.transform=sh}
  // menu mascots
  for(let i=0;i<mascots.length;i++){const m=mascots[i];if(T>m.nb+.13)m.nb=T+1.2+Math.random()*3;const sing=((T*1.6)|0)%mascots.length===i;const st=T>m.nb?2:sing?1:0;if(st!==m.st){m.st=st;drawFace(m.cx,m.i,st)}}
  // count-ups
  for(let i=counts.length-1;i>=0;i--){const c=counts[i],k=Math.min(1,(T-c.t0)/c.dur),v=Math.round(c.to*k);if(v!==c.last){c.last=v;c.el.textContent=v;if(k<1)SFX.tick()}if(k>=1)counts.splice(i,1)}
  // particles
  if(parts.length||fxDirty){
    fc.setTransform(dpr,0,0,dpr,0,0);fc.clearRect(0,0,fxW,fxH);fxDirty=parts.length>0;
    fc.textAlign='center';fc.textBaseline='middle';
    for(let i=0;i<parts.length;i++){const p=parts[i];fc.globalAlpha=Math.min(1,p.life*2.2);
      if(p.ch){if(p.em){fc.font=Math.round(p.s)+'px '+EF;fc.fillStyle='#fff';fc.fillText(p.ch,p.x,p.y)}else{fc.font='900 '+Math.round(p.s)+'px Arial,"Segoe UI Symbol","DejaVu Sans",sans-serif';fc.lineWidth=4;fc.lineJoin='round';fc.strokeStyle='#1b1445';fc.strokeText(p.ch,p.x,p.y);fc.fillStyle='#fff';fc.fillText(p.ch,p.x,p.y)}}
      else{fc.fillStyle=p.c;fc.fillRect(p.x|0,p.y|0,p.s,p.s)}}
    fc.globalAlpha=1;
  }
}
/* ---------------- flow: pause / mute ---------------- */
function focusBtn(id){if(window.AnnabelleDesk&&AnnabelleDesk.isDesk()){const e=$(id);if(e)setTimeout(()=>{try{e.focus({preventScroll:true})}catch(x){}},30)}}
function restart(){if(G.kind==='story')startLevel(G.lvl);else if(G.kind==='arcade')startArcade();else if(G.kind==='duo')start2p();else startPiano()}
function pause(){
  if(G.mode!=='play')return;
  G.mode='paused';P.forEach(p=>{p.lit=0});bodyCls();
  $('cPause').innerHTML='<h2>⏸ '+t('pause')+'</h2><button class="bt" id="bRes">▶ '+t('resume')+'</button><button class="bt alt" id="bRst">🔄 '+t('restart')+'</button><button class="bt alt" id="bMenu">🏠 '+t('menu')+'</button><p class="keys">'+t('keys')+'</p>';
  $('ovPause').classList.add('on');
  $('bRes').onclick=resume;$('bRst').onclick=restart;$('bMenu').onclick=showMenu;focusBtn('bRes');
}
function resume(){
  if(G.mode!=='paused')return;
  G.mode='play';$('ovPause').classList.remove('on');
  if(G.ph==='show')startShow(G.after);else if(G.ph==='pplay')endPianoPlay();else bodyCls();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
$('app').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&e.detail>0)b.blur()});
$('pauseBtn').onclick=()=>{ac();if(G.mode==='paused')resume();else pause()};
function applyMute(){$('muteBtn').textContent=muted?'🔇':'🔊';$('musBtn').classList.toggle('off',!music||muted)}
function toggleMute(){muted=!muted;ls.set('annabelle-muted',muted?'1':'0');applyMute();if(!muted)SFX.click()}
$('muteBtn').onclick=()=>{ac();toggleMute()};
$('musBtn').onclick=()=>{ac();startMusic();music=!music;ls.set(KEY+'-music',music?'1':'0');applyMute();SFX.click()};
/* ---------------- keyboard ---------------- */
function moveCursor(code){
  if(G.cursor<0||G.cursor>=G.n){G.cursor=0;return}
  const p=P[G.cursor],dc=code==='ArrowLeft'?-1:code==='ArrowRight'?1:0,dr=code==='ArrowUp'?-1:code==='ArrowDown'?1:0;
  let best=-1,bd=99;
  for(let i=0;i<G.n;i++){if(i===G.cursor)continue;const q=P[i],c=q.col-p.col,r=q.row-p.row;if((dc&&Math.sign(c)!==dc)||(dr&&Math.sign(r)!==dr))continue;const d=Math.abs(c)*(dc?1:3)+Math.abs(r)*(dr?1:3);if(d<bd){bd=d;best=i}}
  if(best>=0)G.cursor=best;
}
addEventListener('keydown',e=>{
  if(window.AnnabelleDesk&&AnnabelleDesk.typing(e))return;
  const c=e.code;
  if(e.repeat){if(G.mode==='play'&&/^(Arrow|Space|Digit|Numpad[1-6]|Key[QWEASDR])/.test(c))e.preventDefault();return}
  ac();
  if(c==='KeyM'){toggleMute();return}
  if(c==='KeyP'||c==='Escape'){if(G.mode==='play'){e.preventDefault();pause()}else if(G.mode==='paused'){e.preventDefault();resume()}return}
  if(G.mode!=='play')return;
  const ae=document.activeElement;if((c==='Space'||c==='Enter')&&ae&&ae.tagName&&/^(BUTTON|A)$/.test(ae.tagName))return; // a focused button keeps its normal behaviour
  let i=-1;const m=/^(?:Digit|Numpad)([1-6])$/.exec(c);if(m)i=+m[1]-1;else if(KEYMAP[c]!=null)i=KEYMAP[c];
  if(i>=0){e.preventDefault();if(i<G.n)press(i);return}
  if(c==='Space'||c==='KeyR'){e.preventDefault();if(G.kind==='piano')pianoPlay();else hear();return}
  if(c.indexOf('Arrow')===0){e.preventDefault();moveCursor(c);return}
  if(c==='Enter'&&G.cursor>=0){e.preventDefault();press(G.cursor)}
});
/* ---------------- menus ---------------- */
function setLang(l){lang=l;ls.set('annabelle-lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';document.title=t('title');['banner','ann','toast','turn','bar'].forEach(id=>{$(id).dir=l==='he'?'rtl':'ltr'})}
function langRow(){return '<div class="row">'+['he','fr','en'].map(l=>'<button class="chip'+(l===lang?' sel':'')+'" data-l="'+l+'">'+({he:'עברית',fr:'Français',en:'English'})[l]+'</button>').join('')+'</div>'}
function showMenu(){
  G.mode='menu';closeAll();setPhase('idle');hideBanner();toastOff();P.forEach(p=>{p.lit=0;p.joy=0});G.hint=-1;
  if(!boot)startMusic();
  const cur=clamp(SV.unlocked,1,LV.length),stt=Object.keys(SV.stars).reduce((a,k)=>a+(SV.stars[k]|0),0);
  let h='<div class="choir">'+[0,1,2,3].map(i=>'<canvas class="msc" width="16" height="16" data-f="'+i+'" style="background:'+PADS[i].c+';animation-delay:-'+(i*.45)+'s"></canvas>').join('')+'</div>'+
   '<h1>'+t('title')+'</h1><p class="subt">'+t('sub')+'</p><div class="modes">'+
   '<button class="bt" id="mStory">📖 '+t('mStory')+'<small>'+fmt(t('mStory2'),{n:cur})+(stt?' · ⭐ '+stt:'')+'</small></button>'+
   '<button class="bt c2" id="mArc">🕹️ '+t('mArc')+'<small>'+t('mArc2')+'</small></button>'+
   '<button class="bt c3" id="mDuo">👥 '+t('mDuo')+'<small>'+t('mDuo2')+'</small></button>'+
   '<button class="bt c4" id="mPiano">🎹 '+t('mPiano')+'<small>'+t('mPiano2')+'</small></button></div>'+
   '<div class="row">'+['easy','normal','hard'].map(d=>'<button class="chip'+(SV.diff===d?' sel':'')+'" data-d="'+d+'">'+t(d)+'</button>').join('')+'</div>'+
   '<div class="row3"><button class="bt sm alt" id="mLv">🗺️ '+t('levels')+'</button><button class="bt sm alt" id="mZoo">🐾 '+t('zoo')+'</button><button class="bt sm alt" id="mSt">📖 '+t('story')+'</button></div>'+
   hsTable(-1,innerHeight<700?3:5)+langRow()+'<p class="keys">'+t('keys')+'</p>';
  $('cMenu').innerHTML=h;$('ovMenu').classList.add('on');
  mascots=Array.from(document.querySelectorAll('#cMenu .msc')).map(c=>({cx:c.getContext('2d'),i:+c.dataset.f,st:-1,nb:G.rt+Math.random()*2}));
  const go=f=>()=>{ac();startMusic();SFX.click();f()};
  $('mStory').onclick=go(()=>{if(!SV.seen)showIntro(()=>startLevel(cur-1,SV.diff));else startLevel(cur-1,SV.diff)});
  $('mArc').onclick=go(()=>startArcade(SV.diff));$('mDuo').onclick=go(()=>start2p(SV.diff));$('mPiano').onclick=go(startPiano);
  document.querySelectorAll('#cMenu [data-d]').forEach(b=>b.onclick=()=>{ac();SV.diff=b.dataset.d;G.diff=SV.diff;save();SFX.click();showMenu()});
  $('mLv').onclick=go(showLevels);$('mZoo').onclick=go(showZoo);$('mSt').onclick=go(()=>showIntro(showMenu));
  document.querySelectorAll('#cMenu [data-l]').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);showMenu()});
  G.kind='story';G.lvl=cur-1;G.plan=[{a:0,b:1}];G.ri=0;G.won=false;G.hearts=G.maxHearts=DIFF[SV.diff].hearts;G.rep=DIFF[SV.diff].rep;ui();$('lvName').textContent='🎶 '+t('title');setTurn('wait','🎶');$('dots').innerHTML='';
}
function showIntro(done){
  G.mode='menu';closeAll();let i=0;
  const Pn=[['🌙🐇😨',t('i1'),'#2a1f6a'],['🤖🥁💥',t('i2'),'#6a1f3a'],['🐱🐯🐼🦜🎶',t('i3'),'#1f5a4a']];
  const draw=()=>{
    $('cIntro').innerHTML='<div class="panel pop" style="background:'+Pn[i][2]+'"><div class="bige" style="font-size:clamp(38px,12vw,64px)">'+Pn[i][0]+'</div><p>'+Pn[i][1]+'</p></div><div class="dots2">'+Pn.map((p,j)=>j===i?'●':'○').join(' ')+'</div><button class="bt" id="iN">'+(i<2?t('next'):t('go'))+'</button><button class="bt alt" id="iS">'+t('skip')+'</button>';
    $('ovIntro').classList.add('on');
    $('iN').onclick=()=>{SFX.click();if(i<2){i++;draw()}else fin()};$('iS').onclick=fin;focusBtn('iN');
  };
  const fin=()=>{SV.seen=true;save();$('ovIntro').classList.remove('on');done&&done()};
  draw();
}
function showLevels(){
  closeAll();G.mode='menu';
  let h='<h2>🗺️ '+t('levels')+'</h2><div class="lvgrid">';
  for(let i=1;i<=LV.length;i++){const lock=i>SV.unlocked,s=SV.stars[i]||0,L=LV[i-1];h+='<button class="lv'+(lock?' lock':'')+(L.boss?' boss':'')+'" data-i="'+i+'">'+(lock?'🔒':i+' '+(L.boss?'🤖':EM[L.a[0]]))+'<small>'+(s?'⭐'.repeat(s):'&nbsp;')+'</small></button>'}
  h+='</div><button class="bt alt" id="lB">◀ '+t('back')+'</button>';
  $('cLevels').innerHTML=h;$('ovLevels').classList.add('on');
  document.querySelectorAll('#cLevels .lv').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i>SV.unlocked)return;ac();startLevel(i-1,SV.diff)});
  $('lB').onclick=showMenu;
}
function showZoo(){
  closeAll();G.mode='menu';
  let h='<h2>🐾 '+t('zoo')+' ('+SV.zoo.length+'/'+ANIMALS.length+')</h2><div class="zg">';
  ANIMALS.forEach(a=>{const got=SV.zoo.includes(a);h+='<div class="za'+(got?'':' no')+'"><b>'+EM[a]+'</b>'+(got?esc(nm(a))+' 💤':'?')+'</div>'});
  h+='</div><button class="bt alt" id="zB">◀ '+t('back')+'</button>';
  $('cZoo').innerHTML=h;$('ovZoo').classList.add('on');$('zB').onclick=showMenu;
}
/* ---------------- layout + loop ---------------- */
function fit(){
  const r=fx.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);fxW=r.width;fxH=r.height;
  fx.width=Math.max(1,Math.round(fxW*dpr));fx.height=Math.max(1,Math.round(fxH*dpr));fxDirty=true;layout();
}
addEventListener('resize',fit);
function mkSky(id,seed,n){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
  const cols=['#ffffff','#ffe9a8','#a8d8ff','#ffffff88','#d8c0ff'];
  for(let i=0;i<n;i++){x.fillStyle=cols[(r()*cols.length)|0];const px=(r()*126)|0,py=(r()*126)|0;x.fillRect(px,py,1,1);if(r()<.18){x.fillRect(px-1,py,3,1);x.fillRect(px,py-1,1,3)}}
  try{$(id).style.backgroundImage='url('+c.toDataURL()+')'}catch(e){}
}
let last=0;
function loop(ts){
  const dt=Math.min(.1,(ts-last)/1000||0)*TS;last=ts;
  try{frame(dt);render()}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
/* ---------------- test hook ---------------- */
window.__simon={
  state(){const d=G.duo;return {mode:G.mode,kind:G.kind,phase:G.ph,pt:G.pt,lvl:G.lvl+1,diff:G.diff,pads:G.n,hearts:G.hearts,maxHearts:G.maxHearts,replays:G.rep===Infinity?-1:G.rep,
    seq:(G.kind==='duo'?d.seq:G.cur).slice(),full:G.seq.slice(),expect:(G.kind==='duo'?d.seq:G.expect).slice(),pos:G.pos,round:G.kind==='story'?G.ri+1:G.seq.length,rounds:G.kind==='story'?G.plan.length:0,
    canPress:G.mode==='play'&&(G.ph==='turn'||G.ph==='duoRep'||G.ph==='free'||(G.ph==='duoAdd'&&G.pt>=G.lock)),locked:!(G.mode==='play'&&(G.ph==='turn'||G.ph==='duoRep'||G.ph==='duoAdd'||G.ph==='free')),
    rev:G.rev,boss:G.boss,speed:G.speed,score:G.score,mist:G.mist,streak:G.streak,notes:G.notes,hint:G.hint,won:G.won,
    duo:{seq:d.seq.slice(),turn:d.turn,pts:d.pts.slice(),hear:d.hear.slice()},rec:G.rec.map(r=>r.slice()),lit:P.map(p=>p.lit>0),parts:parts.length}},
  start(l,d){startLevel((l||1)-1,d||SV.diff)},
  arcade(d){startArcade(d||SV.diff)},
  start2p(d){start2p(d||SV.diff)},
  piano(){startPiano()},
  press(i){return press(i)},
  hear(){return hear()},
  win(){if(G.mode==='paused')resume();if(G.mode!=='play')return;if(G.kind==='story'){G.won=true;finishLevel()}else if(G.kind==='arcade')arcadeEnd();else if(G.kind==='duo')duoResult()},
  lose(){if(G.mode==='paused')resume();if(G.mode!=='play')return;if(G.kind==='story')fail();else if(G.kind==='arcade')arcadeEnd();else if(G.kind==='duo')duoResult()},
  step(sec){const n=Math.max(1,Math.round((sec||0)*60));for(let i=0;i<n;i++)frame(1/60);render()},
  speed(x){TS=clamp(+x||1,.1,20)},
  audio(ctx){AC=ctx;MG=ctx.createGain();MG.connect(ctx.destination);muted=false},padSound(i,d){padSound(i,d||.4)},sfx(n){SFX[n]&&SFX[n]()},
  setScore(n){if(G.kind==='arcade'){while(G.seq.length<n+1)addArcNote(-1);G.score=n;ui()}},
  playRec(){return pianoPlay()},song(){return pianoSong()},clearRec(){pianoClear()},
  pause,resume,menu:showMenu,levels:showLevels,zoo:showZoo,intro(){showIntro(showMenu)},
  LV:LV.map(l=>({seq:l.seq.slice(),n:l.n,boss:l.boss||null})),save:()=>JSON.parse(JSON.stringify(SV))
};
/* ---------------- init ---------------- */
setLang(lang);applyMute();buildPads();mkSky('sky1',7,70);mkSky('sky2',99,40);
G.diff=SV.diff;setPads(4);fit();showMenu();boot=false;
requestAnimationFrame(loop);
setTimeout(fit,60);setTimeout(fit,400);
})();
