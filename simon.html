/* ---------------- update ---------------- */
function update(dt){
  if(G.kind==='online'){if(O.netp)return;G.clock+=dt;G.pt+=dt;olTick();olUpdate();if(G.ph!=='show')return}
  else{G.clock+=dt;G.pt+=dt}
  switch(G.ph){
  case 'intro':if(G.pt>=G.introDur){const f=G.introNext;G.introNext=null;hideBanner();if(f)f();else startShow('turn')}break;
  case 'show':
    while(G.ph==='show'&&G.pt>=G.nextAt){
      if(G.k<G.cur.length){const on=noteOn(G.k);lightPad(G.cur[G.k],on,true);notesFx(G.cur[G.k],1);G.k++;G.nextAt+=on+(G.k<G.cur.length?DF().gap*G.speed:.05);drawDots()}
      else if(G.kind==='online')olAfterShow();else if(G.after==='duoRep')beginDuoRep();else beginTurn();
    }break;
  case 'turn':{G.idle+=dt;const H=hintT();if(H>0&&G.idle>=H&&G.hint<0)G.hint=G.expect[G.pos]}break;
  case 'good':if(G.pt>=DIFF[G.diff].good)nextRound();break;
  case 'oops':
    if(!G.oopsShown&&G.pt>=.45&&G.diff!=='hard'&&G.hearts>0){G.oopsShown=true;lightPad(G.want,.5,true,.7)}
    if(G.pt>=1.3){if(G.hearts>0)startShow('turn');else if(G.kind==='arcade')arcadeEnd();else fail()}break;
  case 'sleep':
    while(G.lapK<G.seq.length&&G.pt>=G.lapAt){lightPad(G.seq[G.lapK],.13,true,.8);G.lapK++;G.lapAt+=.15}
    if(!G.chord&&G.lapK>=G.seq.length&&G.pt>=G.lapAt+.1){G.chord=true;SFX.chord();P.forEach((p,i)=>{if(i<G.n){p.lit=.5;p.bt=0;p.joy=.9}})}
    if(G.pt>=G.sleepDur)finishLevel();break;
  case 'duoPass':if(G.pt>=1){G.duo.turn^=1;beginDuoRep();updBar()}break;
  case 'duoEnd':
    if(!G.oopsShown&&G.pt>=.45){G.oopsShown=true;lightPad(G.want,.5,true,.7)}
    if(G.pt>=1.4)duoResult();break;
  case 'pplay':
    while(G.ph==='pplay'&&G.pt>=G.nextAt){
      if(G.k<G.pl.length){const it=G.pl[G.k];lightPad(it[0],it[2]||.3,true);notesFx(it[0],1);G.k++;G.nextAt+=G.k<G.pl.length?Math.max(.14,G.pl[G.k][1]):.5;drawStrip()}
      else endPianoPlay();
    }break;
  }
}
function frame(dt){
  G.rt+=dt;
  if(O.on&&G.mode==='result')olResultTick();
  if(G.mode==='play'){
    if(G.hitstop>0)G.hitstop-=dt;else update(dt);
    for(let i=0;i<P.length;i++){const p=P[i];if(p.lit>0)p.lit-=dt;p.bt+=dt;if(p.joy>0)p.joy-=dt;if(p.bad>0)p.bad-=dt}
    if(G.shake>0)G.shake-=dt;
  }

  if(O.fq.length){olFq();if(G.ph!==ph)return} // the friend's next press is due (it may end her turn or the round)
  if(!host&&!O.rdy&&!O.started&&(muted||!AC||AC.state==='running')){O.rdy=true;NT.send({t:'rdy'});olTapDone()} // my sound works: the host may start the countdown
  if(O.reveal>=0&&G.clock>=O.revAt){const r=O.reveal;O.reveal=-1;if(r<G.n)lightPad(r,.5,true,.7)} // after a slip: show which animal it was
  if(host&&Date.now()-NT.NET.last>2500)O.q0=G.clock; // the link was quiet just now: the friend may be late through no fault of hers
  if(host&&G.rt>=O.tqNext){O.tqNext=G.rt+(O.rtt<0&&O.tqI<8?.35:4);O.tqI=(O.tqI+1)%10000;O.tqT=performance.now();NT.send({t:'tq',i:O.tqI})} // measure the network delay
  let left=-1,lim=1,fr=false;
  if(O.mode==='race'){
    if(ph==='oTurn'||ph==='oWait'){
      lim=O.limit;left=lim-(G.clock-O.t0);fr=ph==='oWait';
      if(ph==='oTurn'&&left<=0){olSlipFx(-1,O.seq[G.pos]);olDoneA(false,true)}
      else if(host&&!O.res[1]&&linkOk()&&G.clock-Math.max(O.t0,O.q0>=O.goAt?O.q0+olShowDur(O.seq.length):0)>lim+OR.grace){O.res[1]={ok:false,ms:60000};O.ff=2;drawDots();hostCheck()} // the friend never answered: generous grace, counted again from the end of any network gap
      left=Math.max(0,left);
    }
  }else if(ph==='oRep'||ph==='oAdd'||ph==='oListen'){
    lim=OA.turn;left=lim-(G.clock-O.t0);fr=ph==='oListen';
    if(!fr){
      if(left<=OA.warn&&left>0){if(!O.warned){O.warned=true;toast('⏳ '+fmt(t('oWarn'),{n:OA.warn}),1800)}const s=Math.ceil(left);if(s!==O.tick){O.tick=s;tone(880,.05,'sine',.04)}} // gentle warning
      if(left<=0)olTimeout();
    }else if(host&&!O.fq.length&&linkOk()&&G.clock-Math.max(O.t0,O.q0)>lim+OA.grace+1.5+O.seq.length*OA.pace)hostSlip(1,O.fpos<O.seq.length?O.seq[O.fpos]:-1,1); // backstop only: normally the friend's own phone reports her time-out (her turn may start a little later than I think: she hears my presses one by one)
    left=Math.max(0,left);
  }
  if(G.mode==='play')olTimer(left,lim,fr);
}
function olUpdate(){
  switch(G.ph){
  case 'oPrep':if(!O.me&&G.pt>=OPREP){ // host: 3-2-1 starts at the same moment on both phones, once the friend's sound is unlocked (or after 6 s at most)
    if(O.frRdy||G.pt>=OPREP+6){NT.send({t:'cd'});olDefer(O.lag,olCount)}else if(!O.hint){O.hint=true;setTurn('wait','👆 '+t('oWaitTap'))}}break;
  case 'oCount':{
    const k=Math.min(3,Math.floor(G.pt/.72));
    if(k!==O.cdN){O.cdN=k;if(k<3){announce(String(3-k),'#8fe3ff');setTurn('wait','⏱ '+(3-k));tone(660,.09,'square',.05)}else{announce(t('oGo'),'#b8f08a');setTurn('go p'+O.me,t('oGo'));SFX.cue()}}
    if(G.pt>=3*.72+.55){if(O.me)setPhase('oIdle');else hostNext()}
  }break;
  case 'oRes':if(G.pt>=O.resDur){hideBanner();if(O.over)olOver();else if(O.me)setPhase('oIdle');else hostNext()}break;
  case 'oPass':if(G.pt>=.9)olTurnB();break;
  case 'oSync':if(!O.me&&G.pt>=1.5)hostGo(true);break;
  }
}
function olFrProg(d){
  if(!O.me&&O.mode==='race'){ // host: the guest's press stream so far (every message repeats all of it): it must continue what I had and follow the song
    if(!int(d.rd,1,999)||d.rd!==O.rd||O.resRd===O.rd||!Array.isArray(d.pr)||d.pr.length!==d.n||d.n>O.seq.length||!d.pr.every(v=>int(v,0,O.n-1)))return;
    if(d.n<O.gpr.length||!O.gpr.every((v,i)=>v===d.pr[i])||!d.pr.every((v,i)=>v===O.seq[i]))O.gbad=true;else O.gpr=d.pr.slice();
    if(O.gbad)return; // a press that is not in the song: no progress shown, and no "right" later
  }
  if(O.mode!=='race'||!int(d.rd,1,999)||d.rd!==O.rd||O.resRd===O.rd||!int(d.n,0,O.seq.length)||!int(d.f,0,2)||!['show','oTurn','oWait'].includes(G.ph)||(!O.me&&(d.n>0||d.f>0)&&olEarly()))return;O.fp=d.n;O.ff=d.f;olDots()}
function olData(d){ // every game message from the friend lands here (already authenticated by net1v1): validate everything
  if(!O.on||O.left||!d||typeof d!=='object')return;
  const ty=d.t,host=!O.me,race=O.mode==='race',ph=G.ph;
  if(ty==='em'){if(int(d.i,0,3)&&G.rt-O.emIn>=.9){O.emIn=G.rt;olBubble(1,d.i)}return}
  if(ty==='tq'){if(!host&&int(d.i,0,9999)&&G.rt-O.taAt>=.12){O.taAt=G.rt;NT.send({t:'ta',i:d.i})}return}
  if(ty==='ta'){if(host&&int(d.i,0,9999)&&d.i===O.tqI&&O.tqT>0){const r=performance.now()-O.tqT;O.tqT=0;if(r>=0&&r<4000){O.rtt=O.rtt<0?r:O.rtt*.7+r*.3;O.lag=clamp(O.rtt/2000,0,.35)}}return}
  if(ty==='ov'){if(host&&O.over)NT.setOver(true);return}
  if(ty==='rdy'){if(host&&!O.started)O.frRdy=true;return}
  if(host){ // from the guest: only her own input and her own result
    if(O.over||G.mode!=='play')return;
    if(ty==='r'){
      if(!race||!int(d.round,1,999)||d.round!==O.rd||O.resRd===O.rd||O.res[1]||typeof d.ok!=='boolean'||typeof d.ms!=='number'||!isFinite(d.ms)||!['show','oTurn','oWait'].includes(ph))return;
      const n=O.seq.length,ok=d.ok&&!olEarly()&&olVerified(d); // "right" before the song can even have finished playing on her phone is impossible: it counts as a slip. So is "right" without the proof: her actual presses, in order, equal to the song
      let ms=clamp(Math.round(d.ms),0,60000);if(ok)ms=olMs(d,n,ms);
      O.res[1]={ok:ok,ms:ms};O.ff=ok?1:2;if(ok)O.fp=n;drawDots();hostCheck();
    }else if(ty==='p')olFrProg(d);
    else if(ty==='k'||ty==='n'||ty==='h'||ty==='to')olTurnMsg(d);
    return;
  }
  // from the host (authoritative for the shared state): still check every field and that it fits what I know
  if(ty==='sy'){olApplySnap(d);return}
  if(O.over||G.mode!=='play')return;
  const tg=race?OR.target:OA.target;
  if(ty==='cd'){if(!O.started&&(ph==='oPrep'||ph==='oIdle'||ph==='oCount'))olCount()}
  else if(ty==='go'){
    if(!int(d.rd,O.rd+1,999)||!int(d.a,O.pts[0],tg-1)||!int(d.b,O.pts[1],tg-1))return;
    if(race){
      if(!Array.isArray(d.q)||d.q.length<1||d.q.length>OR.maxLen||!d.q.every(v=>int(v,0,O.n-1)))return;
      O.rd=d.rd;O.seq=d.q.slice();O.pts=[d.a,d.b];O.started=true;O.stage='round';O.defer=null;hideBanner();olRound();
    }else{
      if(!int(d.w,0,1)||!int(d.tn,0,99999))return;
      O.rd=d.rd;O.seq=[];O.turn=d.w;O.tn=d.tn;O.hear=[1,1];O.pts=[d.a,d.b];O.started=true;O.stage='round';O.defer=null;hideBanner();olRoundB();
    }
  }else if(ty==='rs'){
    if(!O.started||d.rd!==O.rd||O.resRd===O.rd||!int(d.a,0,tg)||!int(d.b,0,tg)||!int(d.ov,0,1)||!int(d.win,-1,1))return;
    const da=d.a-O.pts[0],db=d.b-O.pts[1],end=d.a>=tg||d.b>=tg;
    if(da<0||db<0||da+db>1||(!d.ov&&end)||(d.ov&&!end&&O.played+1<(race?OR.maxRd:OA.maxGames)&&d.rd<990))return; // scores only grow, one point at a time; the match ends only when it really can
    if(race){
      if(!['show','oTurn','oWait'].includes(ph)||!int(d.ho,0,1)||!int(d.go,0,1)||!int(d.w,-1,1)||!int(d.sb,-1,2)||!int(d.sa,O.stars[0],Math.min(99,O.stars[0]+1))||!int(d.sc,O.stars[1],Math.min(99,O.stars[1]+1)))return;
      if((d.w===0)!==(da===1)||(d.w===1)!==(db===1)||(d.w===1&&O.myOk!==true))return; // I can only score a round I really sang right
      if(!olWinOk(true,d.ov,d.a,d.b,d.sa,d.sc,d.win))return;
      olResA(d);
    }else{
      if(ph==='oPrep'||ph==='oCount'||!int(d.l,-1,1)||!int(d.y,0,2)||!int(d.wp,-1,O.n-1)||!int(d.n,0,OA.maxSong)||(d.l===1)!==(da===1)||(d.l===0)!==(db===1)||!olWinOk(false,d.ov,d.a,d.b,0,0,d.win))return;
      olResB(d);
    }
  }else if(ty==='p')olFrProg(d);
  else if(ty==='k'||ty==='n'||ty==='h')olTurnMsg(d);
}
function olSnap(st){NT.send({t:'sy',m:O.mode,rd:O.rd,a:O.pts[0],b:O.pts[1],sa:O.stars[0],sc:O.stars[1],pl:O.played,ov:O.over?1:0,win:O.win,st:st,q:O.mode==='add'&&st?O.seq.slice():[],tu:O.turn,tn:O.tn,h0:O.hear[0],h1:O.hear[1]})}
function olResume(){ // host: the connection is back -> send a complete snapshot, then replay the open round / turn
  if(!O.on||O.me||O.left)return;
  if(O.over||G.mode!=='play'){olSnap(0);return}
  O.defer=null;
  if(O.stage==='prep'){olSnap(0);olPrep();G.pt=OPREP-1}
  else if(O.stage==='res')olSnap(0);
  else if(O.mode==='race'){olSnap(0);O.res=[null,null];hideBanner();setPhase('oSync');setTurn('wait','🔌 '+t('oBack'));drawDots()}
  else{O.tn+=2;O.fq.length=0;olSnap(1);hideBanner();olTurnB(true);toast('🔌 '+t('oBack'),1600)} // the open turn starts again, and the girl on turn hears the song once more
}
function olApplySnap(d){ // guest: the host's snapshot after a reconnection
  if(O.over||G.mode!=='play')return;
  const race=O.mode==='race',tg=race?OR.target:OA.target,end=d.a>=tg||d.b>=tg;
  if(d.m!==O.mode||!int(d.rd,O.rd,999)||!int(d.a,O.pts[0],tg)||!int(d.b,O.pts[1],tg)||!int(d.sa,0,99)||!int(d.sc,0,99)||!int(d.pl,0,999)||!int(d.ov,0,1)||!int(d.win,-1,1)||!int(d.st,0,1)||!int(d.tu,0,1)||!int(d.tn,0,99999)||!int(d.h0,0,1)||!int(d.h1,0,1)||!Array.isArray(d.q)||d.q.length>OA.maxSong||!d.q.every(v=>int(v,0,O.n-1)))return;
  if((!d.ov&&end)||(d.ov&&!end&&d.pl<(race?OR.maxRd:OA.maxGames)&&d.rd<990)||!olWinOk(race,d.ov,d.a,d.b,d.sa,d.sc,d.win))return;
  if(d.b-O.pts[1]>1||(race&&d.b>O.pts[1]&&O.myOk!==true))return; // a snapshot can hand me at most the one point of a result I missed
  O.defer=null;O.fq.length=0;O.reveal=-1;O.myOk=null;O.rd=d.rd;O.pts=[d.a,d.b];O.stars=[d.sa,d.sc];O.played=d.pl;
  if(d.ov){O.resRd=O.rd;olSetOver(d.win);hideBanner();olOver();return}
  if(!race&&d.st===1){O.started=true;O.stage='round';O.seq=d.q.slice();O.turn=d.tu;O.tn=d.tn;O.hear=[d.h0,d.h1];hideBanner();olTurnB(true);toast('🔌 '+t('oBack'),1600);return} // the song may hold a note I never heard: if it is my turn it is played to me first
  if(['show','oTurn','oWait','oRep','oAdd','oListen','oPass','oPrep','oCount'].includes(G.ph)){hideBanner();setPhase('oIdle');setTurn('wait','🔌 '+t('oBack'))}
  ui();drawDots();
}
function olOver(){ // the match is decided: each girl sees her own result card
  if(G.mode==='result')return;

   '<div class="ovs"><div><span class="av">'+PL[me]+'</span>'+t('oYou')+'</div><b class="sn">'+O.pts[me]+'</b><b class="sn">:</b><b class="sn">'+O.pts[fr]+'</b><div><span class="av">'+PL[fr]+'</span>'+t('oFriend')+'</div></div>';
  if(O.mode==='race')h+='<p>⚡ '+t('oStars')+(lang==='fr'?' : ':': ')+t('oYou')+' '+O.stars[me]+' · '+t('oFriend')+' '+O.stars[fr]+'</p>';

    seq:(G.kind==='duo'?d.seq:G.cur).slice(),full:G.seq.slice(),expect:(G.kind==='duo'?d.seq:G.expect).slice(),pos:G.pos,round:G.kind==='story'?G.ri+1:G.seq.length,rounds:G.kind==='story'?G.plan.length:0,

  NT,tx:k=>t(k),online:showOnline,olCfg(m,n){if(OMODES.includes(m))OC.mode=m;if(int(n,4,6))OC.n=n},emote:i=>olEmote(i),olSnap,
  ol(){return {on:O.on,mode:O.mode,n:O.n,me:O.me,rd:O.rd,stage:O.stage,started:O.started,pts:O.pts.slice(),stars:O.stars.slice(),seq:O.seq.slice(),pos:G.pos,turn:O.turn,tn:O.tn,fp:O.fp,ff:O.ff,fpos:O.fpos,hear:O.hear.slice(),myOk:O.myOk,played:O.played,best:O.best,fq:O.fq.length,tapHint:O.tapH,
