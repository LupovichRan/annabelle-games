 if(!ANI[id])return false;let nw=false;
 if(S.rescued.indexOf(id)<0){S.rescued.push(id);nw=true;}
 let z=[];try{z=JSON.parse(ls.get(ZOOK)||"[]");if(!Array.isArray(z))z=[]}catch(e){z=[]}
 if(z.indexOf(id)<0){z.push(id);ls.set(ZOOK,JSON.stringify(z));}
 save();return nw;
}
const R=()=>window.AnnabelleRewards;
function award(o){try{o.game="tetris";R()&&R().award(o)}catch(e){}}
function flush(){try{R()&&R().flush&&R().flush()}catch(e){}}

/* ---------- audio ---------- */
let AC=null,master=null,muted=ls.get("annabelle-muted")==="1";
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}catch(e){}}if(AC&&AC.state==="suspended"){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,slide,delay){if(muted)return;const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}catch(e){}}
const N=n=>440*Math.pow(2,(n-69)/12);
const SFX={
 move(){tone(300,.04,"square",.05)},rot(){tone(520,.05,"square",.07);tone(700,.05,"square",.06,0,.04)},
 drop(){tone(120,.1,"triangle",.2,-60)},hold(){tone(400,.08,"triangle",.12,200)},
 line(n){[0,4,7,12,16].slice(0,2+n).forEach((s,i)=>tone(N(72+s),.12,"square",.09,0,i*.07))},
 rescue(){[76,79,83,88].forEach((s,i)=>tone(N(s),.14,"triangle",.14,0,.12+i*.08))},
 paw(){tone(300,.15,"triangle",.15,300);tone(500,.15,"triangle",.12,200,.1)},
 warn(){tone(200,.12,"square",.08);tone(200,.12,"square",.08,0,.18)},
 lose(){[67,64,60,55].forEach((s,i)=>tone(N(s),.2,"triangle",.14,0,i*.15))},
 win(){[72,76,79,84,79,84,88].forEach((s,i)=>tone(N(s),.16,"square",.09,0,i*.1))},
 click(){tone(600,.05,"square",.06)},tick(){tone(900,.05,"square",.06)},no(){tone(150,.12,"square",.07)}};
let musTimer=null,musStep=0;
const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
function musTick(){
 if(muted||!S.music||!G||screen!=="play"||paused)return;
 const c=CH[(musStep>>3)&3],s=musStep&7;
 const pat=[0,1,2,1,0,1,2,1];
 tone(N(c[pat[s]]+12),.14,"square",.035);
 if(s%4===0)tone(N(c[0]-12),.3,"triangle",.09);
 if(s===6)tone(N(c[2]+24),.1,"square",.02);
 musStep++;
}
function musStart(){if(!musTimer)musTimer=setInterval(musTick,170)}
function setMuteUI(){$("muteBtn").textContent=muted?"🔇":"🔊";$("musBtn").classList.toggle("off",!S.music);$("mMus").classList.toggle("off",!S.music)}
function toggleMute(){muted=!muted;ls.set("annabelle-muted",muted?"1":"0");setMuteUI();if(!muted)SFX.click()}
function toggleMusic(){S.music=!S.music;save();setMuteUI();ac();SFX.click()}

/* ---------- pieces ---------- */
const TYPES="IOTSZJL";
const SH={I:{n:4,c:[[0,1],[1,1],[2,1],[3,1]]},O:{n:2,c:[[0,0],[1,0],[0,1],[1,1]]},T:{n:3,c:[[0,1],[1,1],[2,1],[1,0]]},S:{n:3,c:[[0,2],[1,2],[1,1],[2,1]]},Z:{n:3,c:[[0,1],[1,1],[1,2],[2,2]]},J:{n:3,c:[[0,0],[0,1],[1,1],[2,1]]},L:{n:3,c:[[2,0],[0,1],[1,1],[2,1]]}};
// base, dark, light
const COL=[["#ffae4d","#b8661a","#ffd08a"],["#ffe79a","#b89a3a","#fff6cf"],["#aab8d6","#5a6a8f","#d6e0f5"],["#ff93c1","#b83f7c","#ffc4de"],["#d99468","#8a5230","#f0bd9c"],["#f4f1ee","#9a948f","#ffffff"],["#6b5b86","#2e2442","#9d8cc0"]];
const W=10,H=20;
function rotCells(cells,n,d){return cells.map(([x,y])=>d>0?[n-1-y,x]:[y,n-1-x])}
function mkPiece(t){const s=SH[t];return{t:TYPES.indexOf(t),k:t,n:s.n,cells:s.c.map(a=>a.slice()),x:Math.floor((W-s.n)/2),y:0}}

/* ---------- game state ---------- */
let G=null,screen="menu",paused=false;
const KICKS=[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1]];
function emptyBoard(){return Array.from({length:H},()=>Array(W).fill(null))}
function bag(){const a=TYPES.split("");for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawNext(){if(G.q.length<8)G.q.push(...bag());return G.q.shift()}
function collide(cells,px,py){for(const [cx,cy] of cells){const x=px+cx,y=py+cy;if(x<0||x>=W||y>=H)return true;if(y>=0&&G.board[y][x])return true}return false}
function gravMs(){return Math.max(.1,(0.95-(G.lvForSpeed-1)*0.065)*DIFF[G.diff].g)}

function newGame(mode,level,diff){
 const D=DIFF[diff],L=mode==="marathon"?LV[level-1]:null;
 G={mode,level,diff,board:emptyBoard(),q:[],hold:null,holdUsed:false,score:0,resc:0,quota:L?L.q:0,saves:mode==="marathon"?D.saves:99,savesUsed:0,paws:D.paws,pawsUsed:0,
  lvForSpeed:mode==="sprint"?3:level,animal:L?L.a:null,timeLeft:120,t:0,acc:0,lockT:0,lockMoves:0,lockDelay:D.lock,clearing:null,combo:0,
  particles:[],floaters:[],shake:0,banner:null,boss:L&&L.boss?{t:D.boss,warned:false}:null,freed:[],over:false,piece:null,flash:[],lines:0,hearts:0};
 G.grav=gravMs();
 if(L){const n=Math.round(L.rows*D.rows);for(let i=0;i<n;i++)addCageRow(true)}
 G.next=[];
 spawn();
 paused=false;screen="play";document.body.classList.add("play");
 hideAll();resize();updateHud();
 award({event:"play",level:mode==="marathon"?level:undefined});
 musStart();
}
function aniEmoji(){return G.mode==="marathon"?ANI[G.animal]:ANI[SPR_POOL[Math.floor(Math.random()*SPR_POOL.length)]]}
function addCageRow(init){
 const row=Array(W).fill(null),gap=Math.floor(Math.random()*W),ai=(gap+1+Math.floor(Math.random()*(W-1)))%W;
 for(let x=0;x<W;x++)if(x!==gap)row[x]={k:"cage",a:x===ai?aniEmoji():null,alt:(x+G.t*7|0)&1};
 if(G.board[0].some(Boolean)&&!init){return false}
 G.board.shift();G.board.push(row);
 if(G.piece&&collide(G.piece.cells,G.piece.x,G.piece.y)){G.piece.y--;if(collide(G.piece.cells,G.piece.x,G.piece.y)){G.piece.y++;sweepTop(true)}}
 return true;
}
function spawn(){
 const t=drawNext();G.piece=mkPiece(t);G.holdUsed=false;G.acc=0;G.lockT=0;G.lockMoves=0;
 G.next=G.q.slice(0,3);
 if(collide(G.piece.cells,G.piece.x,G.piece.y)){G.piece.y=-1;if(collide(G.piece.cells,G.piece.x,G.piece.y)){G.piece.y=0;overflow()}}
}
function overflow(){
 if(G.mode==="sprint"||G.saves>0){
  if(G.mode==="marathon"){G.saves--;G.savesUsed++}
  sweepTop(false);
  banner(T("sweep"));SFX.paw();
  G.piece=mkPiece(G.q.shift()||"T");G.next=G.q.slice(0,3);G.holdUsed=false;
  if(collide(G.piece.cells,G.piece.x,G.piece.y)){G.board=emptyBoard()}
 }else{
  G.piece=null;levelFail();
 }
}
function sweepTop(quiet){
 let cnt=0;
 for(let y=0;y<10;y++)for(let x=0;x<W;x++){const c=G.board[y][x];if(c){if(c.a){cnt++;G.freed.push(c.a)}burst((x+.5),(y+.5),c.k==="cage"?"#aab":COL[c.t||0][0],3);G.board[y][x]=null}}
 if(cnt){G.resc+=cnt;checkQuota()}
 G.shake=.5;
 if(!quiet){}
}
function banner(txt){G.banner={txt,t:2.2}}
function burst(bx,by,col,n,emoji){
 for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*4;G.particles.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:.7+Math.random()*.6,col,sz:.18+Math.random()*.15,e:emoji&&Math.random()<.4?emoji:null})}
}

/* ---------- actions ---------- */
function playing(){return G&&screen==="play"&&!paused&&!G.over&&!G.clearing&&G.piece}
function touchLock(){if(G.piece&&collide(G.piece.cells,G.piece.x,G.piece.y+1)&&G.lockMoves<14){G.lockT=0;G.lockMoves++}}
function tryMove(dx,dy){const p=G.piece;if(!p||collide(p.cells,p.x+dx,p.y+dy))return false;p.x+=dx;p.y+=dy;return true}
function move(dx){if(!playing())return;if(tryMove(dx,0)){SFX.move();touchLock()}}
function rotate(d){
 if(!playing())return;const p=G.piece;if(p.k==="O"){SFX.rot();return}
 const nc=rotCells(p.cells,p.n,d);
 for(const [kx,ky] of KICKS){if(!collide(nc,p.x+kx,p.y+ky)){p.cells=nc;p.x+=kx;p.y+=ky;SFX.rot();touchLock();return}}
}
function softDrop(){if(!playing())return;if(tryMove(0,1)){G.score+=1;G.acc=0}else{G.lockT+=.12}}
function ghostY(){const p=G.piece;let y=p.y;while(!collide(p.cells,p.x,y+1))y++;return y}
function hardDrop(){
 if(!playing())return;const p=G.piece,y=ghostY();G.score+=2*(y-p.y);
 for(const [cx,cy] of p.cells)burst(p.x+cx+.5,y+cy+1,COL[p.t][2],1);
 p.y=y;G.shake=Math.max(G.shake,.12);SFX.drop();lockPiece();
}
function holdPiece(){
 if(!playing()||G.holdUsed)return;
 const k=G.piece.k;
 if(G.hold){G.piece=mkPiece(G.hold)}else{G.piece=mkPiece(G.q.shift());G.next=G.q.slice(0,3);if(G.q.length<8)G.q.push(...bag())}
 G.hold=k;G.holdUsed=true;G.acc=0;G.lockT=0;G.lockMoves=0;SFX.hold();
 if(collide(G.piece.cells,G.piece.x,G.piece.y))overflow();
}
function usePaw(){
 if(!G||screen!=="play"||paused||G.over||G.mode==="sprint"&&false)return;
 if(G.paws<=0||G.clearing){SFX.no();banner(T("noPaw"));return}
 let row=-1,cage=false;
 for(let y=H-1;y>=0;y--){if(G.board[y].some(c=>c&&c.k==="cage")){row=y;cage=true;break}}
 if(row<0)for(let y=H-1;y>=0;y--){if(G.board[y].some(Boolean)){row=y;break}}
 if(row<0){SFX.no();return}
 G.paws--;G.pawsUsed++;
 clearRowsEffects([row],true);
 G.board.splice(row,1);G.board.unshift(Array(W).fill(null));
 if(G.piece&&collide(G.piece.cells,G.piece.x,G.piece.y)){G.piece.y--}
 SFX.paw();banner(T("saved"));updateHud();checkQuota();
}
function lockPiece(){
 const p=G.piece;
 for(let i=0;i<4;i++){const [cx,cy]=p.cells[i],x=p.x+cx,y=p.y+cy;if(y>=0)G.board[y][x]={k:"cat",t:p.t,i}}
 G.piece=null;
 const full=[];for(let y=0;y<H;y++)if(G.board[y].every(Boolean))full.push(y);
 if(!full.length){G.combo=0;spawn();return}
 G.combo++;G.lines+=full.length;
 const gain=clearRowsEffects(full,false);
 const base=[0,100,300,500,800][full.length]*G.lvForSpeed+50*(G.combo-1);
 G.score+=base;G.shake=.25+full.length*.08;
 SFX.line(full.length);if(gain>0)SFX.rescue();
 if(G.combo>=3)award({event:"combo",score:G.combo});
 G.clearing={rows:full,t:.3};
}
function clearRowsEffects(rows,isPaw){
 let gain=0;
 for(const y of rows){
  let cageAni=null;
  for(let x=0;x<W;x++){const c=G.board[y][x];if(c&&c.a)cageAni=c.a;if(c)burst(x+.5,y+.5,c.k==="cage"?"#c8c8d8":COL[c.t||0][0],2,"💖")}
  gain+=1+(cageAni?1:0);
  const e=cageAni||aniEmoji();G.freed.push(e);if(cageAni)G.freed.push(e);
  G.floaters.push({x:W/2,y:y+.5,vy:-1.6,t:1.4,txt:e,sz:1.6});
  G.floaters.push({x:W/2+1.6,y:y+.2,vy:-1.2,t:1.2,txt:"+"+(cageAni?2:1),sz:1,col:"#ffd24a"});
 }
 G.resc+=gain;
 return gain;
}
function finishClear(){
 const rows=G.clearing.rows.slice().sort((a,b)=>b-a);
 for(const y of rows){G.board.splice(y,1)}
 for(let i=0;i<rows.length;i++)G.board.unshift(Array(W).fill(null));
 G.clearing=null;
 updateHud();
 if(checkQuota())return;
 spawn();
}
function checkQuota(){
 if(G.mode==="marathon"&&!G.over&&G.resc>=G.quota){
  if(!G.clearing){levelWin();return true}
  G.winPending=true;
 }
 return !!G.over;
}

/* ---------- update ---------- */
function update(dt){
 G.t+=dt;
 if(G.mode==="sprint"&&!G.over){G.timeLeft-=dt;if(G.timeLeft<=0){G.timeLeft=0;endSprint();return}}
 if(G.clearing){G.clearing.t-=dt;if(G.clearing.t<=0){finishClear();if(G.over)return}}
 else if(G.piece&&!G.over){
  const grounded=collide(G.piece.cells,G.piece.x,G.piece.y+1);
  if(grounded){G.lockT+=dt;if(G.lockT>=G.lockDelay){lockPiece()}}
  else{G.lockT=0;G.acc+=dt;let g=G.grav;while(G.acc>=g){G.acc-=g;if(!tryMove(0,1)){G.acc=0;break}}}
 }
 if(G.winPending&&!G.clearing&&!G.over){G.winPending=false;levelWin();return}
 if(G.boss&&!G.over&&!G.clearing){
  G.boss.t-=dt;
  if(G.boss.t<=3&&!G.boss.warned){G.boss.warned=true;banner(T("warn"));SFX.warn()}
  if(G.boss.t<=0){
   const maxH=H-6;let hgt=0;for(let y=0;y<H;y++)if(G.board[y].some(Boolean)){hgt=H-y;break}
   G.boss.t=DIFF[G.diff].boss;G.boss.warned=false;
   if(hgt<=maxH){addCageRow(false);banner(T("cage"));SFX.no();G.shake=.2}
  }
 }
 for(const p of G.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=9*dt;p.life-=dt}
 G.particles=G.particles.filter(p=>p.life>0);
 for(const f of G.floaters){f.y+=f.vy*dt;f.t-=dt}
 G.floaters=G.floaters.filter(f=>f.t>0);
 if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
 if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
 updateHud();
}

/* ---------- hud ---------- */
function updateHud(){
 if(!G)return;
 const L=G.mode==="marathon";
 $("pillR").textContent=L?(ANI[G.animal]+" "+Math.min(G.resc,G.quota)+"/"+G.quota):("⏱ "+fmt(G.timeLeft)+"  "+G.resc+"🐾");
 $("pawBd").textContent=G.paws;$("pawBtn").classList.toggle("off",G.paws<=0);
}
function fmt(s){s=Math.ceil(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

/* ---------- results ---------- */
function starsFor(){const u=G.savesUsed+G.pawsUsed;return u===0?3:u<=1?2:1}
function levelWin(){
 if(G.over)return;G.over=true;
 const st=starsFor(),lv=G.level,old=S.stars[lv]||0,L=LV[lv-1];
 S.stars[lv]=Math.max(old,st);if(lv<10)S.unlocked=Math.max(S.unlocked,lv+1);
 if(G.score>S.best)S.best=G.score;
 const nw=addZoo(L.a);save();
 SFX.win();burst(W/2,H/2,"#ffd24a",30,"🎉");G.shake=.4;
 award({event:"levelClear",level:lv,score:G.score});
 if(st>old)award({event:"star",stars:st-old});
 award({event:"score",score:G.score});
 if(L.boss)award({event:"win",level:lv});
 flush();
 setTimeout(()=>{if(G&&G.over&&screen==="play")showResult(true,{st,nw,lv})},700);
}
function levelFail(){
 if(G.over)return;G.over=true;SFX.lose();
 award({event:"score",score:G.score});flush();
 setTimeout(()=>{if(G&&G.over&&screen==="play")showResult(false,{})},500);
}
function endSprint(){
 if(G.over)return;G.over=true;
 const th=DIFF[G.diff].stars,r=G.resc,st=r>=th[2]?3:r>=th[1]?2:r>=th[0]?1:0;
 const old=S.stars.s||0;S.stars.s=Math.max(old,st);
 if(r>S.sprintBest)S.sprintBest=r;if(G.score>S.best)S.best=G.score;
 const got=[];let pool=SPR_POOL.filter(a=>S.rescued.indexOf(a)<0);
 for(let i=0;i<Math.min(3,Math.floor(r/6));i++){if(!pool.length)break;const a=pool.splice(Math.floor(Math.random()*pool.length),1)[0];addZoo(a);got.push(a)}
 save();SFX.win();
 award({event:"score",score:G.score});if(st>old)award({event:"star",stars:st-old});if(r>=th[1])award({event:"levelClear",level:3});
 flush();
 setTimeout(()=>{if(G&&G.over&&screen==="play")showResult(true,{sprint:true,st,got})},400);
}
function starStr(n){return "⭐".repeat(n)+"☆".repeat(Math.max(0,3-n))}
function freedRow(){const u=[];for(const e of G.freed)if(u.length<14)u.push(e);return u.join("")||"🐾"}
function showResult(win,o){
 screen="result";hideAll();
 let h="";
 if(win&&o.sprint){
  h=`<h2>${T("sprintEnd")}</h2><div class="stars">${starStr(o.st)}</div><p>${T("rescued")}: <b>${G.resc}</b> 🐾 &nbsp; ${T("score")}: <b>${G.score}</b></p><p>${T("best")}: ${S.sprintBest}</p><div class="big">${freedRow()}</div>`;
  if(o.got&&o.got.length)h+=`<p>${T("newAni")}</p><div class="big">${o.got.map(a=>ANI[a]).join(" ")}</div>`;
  h+=`<button class="btn g primary" id="rA">${T("again")}</button><button class="btn s" id="rM">${T("menu")}</button>`;
 }else if(win){
  const L=LV[o.lv-1],fin=!!L.final;
  h=`<h2>${fin?T("finaleT"):T("great")}</h2><div class="big">${ANI[L.a]}</div><div class="stars">${starStr(o.st)}</div>`;
  h+=`<p>${fin?T("finaleS"):(o.nw?T("newAni")+" ":"")+NAMES[lang][L.a]+" 🏡"}</p><p>${T("score")}: <b>${G.score}</b></p>`;
  if(!fin)h+=`<button class="btn g primary" id="rN">${T("nextLv")}</button>`;
  h+=`<div class="row"><button class="btn b" id="rA">${T("again")}</button><button class="btn s" id="rM">${T("menu")}</button></div>`;
 }else{
  h=`<h2>${T("almost")}</h2><div class="big">${G.mode==="marathon"?ANI[G.animal]:"🐾"}</div><p>${T("almostT")}</p><button class="btn g primary" id="rA">${T("tryAgain")}</button><button class="btn s" id="rM">${T("menu")}</button>`;
 }
 $("reCard").innerHTML=h;show("result");
 const a=$("rA"),m=$("rM"),n=$("rN");
 if(a)a.onclick=()=>{SFX.click();G.mode==="sprint"?startSprint():startLevel(G.level)};
 if(m)m.onclick=()=>{SFX.click();toMenu()};
 if(n)n.onclick=()=>{SFX.click();showChapter(G.level+1)};
}

/* ---------- screens ---------- */
function hideAll(){document.querySelectorAll(".ov").forEach(o=>o.classList.remove("show"))}
function show(id){hideAll();$(id).classList.add("show")}
function toMenu(){G=null;paused=false;screen="menu";document.body.classList.remove("play");renderMenu();show("menu")}
window.toMenu=toMenu;
function startLevel(n){n=Math.max(1,Math.min(10,n|0));newGame("marathon",n,S.diff)}
function startSprint(){newGame("sprint",0,S.diff)}
function showChapter(n){
 n=Math.max(1,Math.min(10,n));const L=LV[n-1],c=TX[lang].ch[n-1]||TX.en.ch[n-1];
 screen="chapter";document.body.classList.remove("play");
 $("chCard").innerHTML=`<span class="tag">${T("chap")} ${n}</span>${L.boss?`<span class="tag" style="background:#ff7eb6;color:#fff">${T("bossB")}</span>`:""}<div class="big">${ANI[L.a]}${L.boss?"🤖":"🧱"}</div><h2>${c[0]}</h2><p>${c[1]}</p><p>${ANI[L.a]} × ${L.q}</p><button class="btn g primary" id="cGo">${T("go")}</button><button class="btn s" id="cBack">${T("back")}</button>`;
 show("chapter");
 $("cGo").onclick=()=>{ac();SFX.click();startLevel(n)};$("cBack").onclick=()=>{SFX.click();toMenu()};
}
function renderPanels(){
 $("panels").innerHTML=[["😺😸🐱","p1"],["🤖📦🐰","p2"],["🧱🐾🎉","p3"]].map(p=>`<div class="pn"><span class="pe">${p[0]}</span><span class="t">${T(p[1])}</span></div>`).join("");
}

function renderLevels(){
 let h=`<h2>${T("levels").replace("🗺 ","")}</h2><div class="grid">`;
 LV.forEach((L,i)=>{const n=i+1,lk=n>S.unlocked,s=S.stars[n]||0;h+=`<button class="lv${L.boss?" boss":""}${lk?" lk":""}" data-l="${n}">${lk?"🔒":ANI[L.a]}<span>${n}</span><small>${s?"⭐".repeat(s):"&nbsp;"}</small></button>`});

 let h=`<h2>${T("sanctT")}</h2><p>${T("sanctS").replace("{n}",n).replace("{m}",ZOO.length)}</p><div class="bar"><i style="width:${Math.round(n/ZOO.length*100)}%"></i></div><div class="grid" style="grid-template-columns:repeat(5,1fr);gap:6px">`;
 ZOO.forEach(id=>{const has=S.rescued.indexOf(id)>=0;h+=`<div class="an${has?"":" no"}"><span class="e">${ANI[id]}</span><small>${has?NAMES[lang][id]:"?"}</small></div>`});

 document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T(e.dataset.t));

 ["he","fr","en"].forEach(l=>{const b=document.createElement("button");b.dataset.lang=l;b.textContent=l==="he"?"עברית":l.toUpperCase();if(l===lang)b.className="sel";b.onclick=()=>{lang=l;ls.set("annabelle-lang",l);renderMenu();SFX.click()};$("langs").insertBefore(b,$("langs").firstChild)});
 $("resBtn").textContent=T("resume");$("pMenu").textContent=T("menu");$("stGo").textContent=T("go");$("stSkip").textContent=T("skip");
 setMuteUI();

function doPause(p){
 if(!G||screen!=="play"||G.over)return;
 paused=p;if(p){show("pause");$("pause").classList.add("show")}else{$("pause").classList.remove("show")}
}

/* ---------- input ---------- */
document.addEventListener("keydown",e=>{
 const c=e.code;
 if(c==="KeyM"){toggleMute();return}
 if(screen==="play"&&G){
  if(c==="KeyP"||c==="Escape"){e.preventDefault();doPause(!paused);return}
  if(paused){if(c==="Enter"||c==="Space"){e.preventDefault();doPause(false)}return}
  if(G.over)return;
  switch(c){
   case"ArrowLeft":move(-1);break;case"ArrowRight":move(1);break;case"ArrowDown":softDrop();break;
   case"ArrowUp":case"KeyX":rotate(1);break;case"KeyZ":rotate(-1);break;
   case"Space":hardDrop();break;case"KeyC":case"ShiftLeft":case"ShiftRight":holdPiece();break;
   case"KeyH":usePaw();break;default:return;
  }
  e.preventDefault();return;
 }
 if(c==="Enter"||c==="Space"){const b=document.querySelector(".ov.show .primary")||(screen==="menu"?$("bPlay"):null);if(b&&!(e.target&&e.target.tagName==="BUTTON")){e.preventDefault();b.click()}}
 if(c==="Escape"&&screen!=="menu"&&screen!=="result"){toMenu()}
});
// on-screen buttons with repeat
document.querySelectorAll(".cb").forEach(b=>{
 const a=b.dataset.a;let tm=null,iv=null;
 const act=()=>{ac();({left:()=>move(-1),right:()=>move(1),rot:()=>rotate(1),soft:softDrop,hard:hardDrop,hold:holdPiece})[a]()};
 const stop=()=>{b.classList.remove("dn");clearTimeout(tm);clearInterval(iv);tm=iv=null};
 b.addEventListener("pointerdown",e=>{e.preventDefault();b.classList.add("dn");try{b.setPointerCapture(e.pointerId)}catch(x){}act();if(a==="left"||a==="right"||a==="soft"){tm=setTimeout(()=>{iv=setInterval(act,a==="soft"?55:75)},230)}});
 ["pointerup","pointercancel","lostpointercapture","pointerleave"].forEach(ev=>b.addEventListener(ev,stop));
 b.addEventListener("contextmenu",e=>e.preventDefault());
});
// swipe gestures on the canvas
const cv=$("cv"),ctx=cv.getContext("2d");
let gp=null;
cv.addEventListener("pointerdown",e=>{if(!playing())return;ac();try{cv.setPointerCapture(e.pointerId)}catch(x){}gp={x:e.clientX,y:e.clientY,lx:e.clientX,t:performance.now(),moved:0}});
cv.addEventListener("pointermove",e=>{
 if(!gp||!G)return;const step=Math.max(14,L_.c*.95);
 gp.acc=(gp.acc||0)+(e.clientX-gp.lx);gp.lx=e.clientX;
 while(gp.acc>=step){move(1);gp.acc-=step;gp.moved=1}
 while(gp.acc<=-step){move(-1);gp.acc+=step;gp.moved=1}
});
function endGesture(e,cancel){
 if(!gp)return;const g=gp;gp=null;if(cancel||!G)return;
 const dx=e.clientX-g.x,dy=e.clientY-g.y,dt=performance.now()-g.t,cs=Math.max(14,L_.c);
 if(g.moved&&Math.abs(dy)<cs*2)return;
 if(Math.abs(dx)<cs*.8&&Math.abs(dy)<cs*.8){if(dt<350)rotate(1);return}
 if(Math.abs(dy)>Math.abs(dx)*1.2){if(dy>cs*1.5)hardDrop();else if(dy<-cs*1.5)holdPiece()}
}
cv.addEventListener("pointerup",e=>endGesture(e,false));
cv.addEventListener("pointercancel",e=>endGesture(e,true));

/* ---------- drawing ---------- */
let L_={c:24,ox:0,oy:0,w:300,h:500,dpr:1};
function resize(){
 const st=$("stage"),r=st.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
 const w=Math.max(100,r.width),h=Math.max(100,r.height);
 cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 const c=Math.floor(Math.min(w/14.9,h/20.3));
 L_={c,ox:Math.floor((w-c*14.9)/2),oy:Math.floor((h-c*20.3)/2),w,h,dpr};
}
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,200));
function drawCell(g,x,y,s,t,i,alpha){
 const col=COL[t],u=s/10;g.save();g.globalAlpha=alpha==null?1:alpha;
 g.fillStyle=col[1];g.fillRect(x,y,s,s);
 g.fillStyle=col[0];g.fillRect(x+u*.7,y+u*.7,s-u*1.4,s-u*1.4);
 g.fillStyle=col[2];g.fillRect(x+u*.7,y+u*.7,s-u*1.4,u*1.1);g.fillRect(x+u*.7,y+u*.7,u*1.1,s-u*1.4);
 const D="#2a1a33",P=(a,b,c,d,f)=>{g.fillStyle=f||D;g.fillRect(x+a*u,y+b*u,c*u,d*u)};
 if(i===1){ // cat face
  P(1.5,1.2,2,2,col[1]);P(6.5,1.2,2,2,col[1]);P(2,1.7,1,1,"#ffb5cf");P(7,1.7,1,1,"#ffb5cf");
  P(2.2,4,1.6,2);P(6.2,4,1.6,2);P(2.2,4,.8,.8,"#fff");P(6.2,4,.8,.8,"#fff");
  P(4.2,6.3,1.6,1,"#ff6fa0");P(3,7.5,1,.8);P(6,7.5,1,.8);P(4,8,2,.7);
 }else if(i===0){ // paw print
  g.globalAlpha*=.45;P(3.2,5.2,3.6,2.8);P(2,3.2,1.4,1.5);P(4.3,2.4,1.5,1.6);P(6.6,3.2,1.4,1.5);g.globalAlpha=alpha==null?1:alpha;
 }else if(i===2){ // stripes
  g.globalAlpha*=.38;P(0.7,2.5,4,1);P(5.3,4.5,4,1);P(1.5,7,4.5,1);g.globalAlpha=alpha==null?1:alpha;
 }else{ // tail
  g.globalAlpha*=.5;P(2.5,6.5,4,1.2);P(6.3,3,1.3,4.7);P(4,3,3.6,1.2);g.globalAlpha=alpha==null?1:alpha;P(4,3,1.2,1.2,col[2]);
 }
 g.restore();
}
function drawCage(g,x,y,s,a){
 const u=s/10;g.fillStyle="#3b3d52";g.fillRect(x,y,s,s);g.fillStyle="#6b6e8a";g.fillRect(x+u*.6,y+u*.6,s-u*1.2,s-u*1.2);
 g.fillStyle="#2a2c3e";for(let k=0;k<4;k++)g.fillRect(x+u*(1.5+k*2.4),y+u*.6,u*.9,s-u*1.2);
 g.fillStyle="#9296b8";g.fillRect(x+u*.6,y+u*.6,s-u*1.2,u*.9);
 if(a){g.fillStyle="#fff3";g.fillRect(x+u*1,y+u*1,s-u*2,s-u*2);g.font=Math.floor(s*.78)+"px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillStyle="#000";g.fillText(a,x+s/2,y+s/2+u*.4)}
}
function emojiAt(g,e,x,y,sz,a){g.save();g.globalAlpha=a==null?1:a;g.font=Math.floor(sz)+"px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(e,x,y);g.restore()}
function textAt(g,s,x,y,sz,col,al){g.font="900 "+Math.floor(sz)+"px Rubik,'Varela Round',Arial,sans-serif";g.textAlign=al||"center";g.textBaseline="middle";g.fillStyle=col||"#fff4e8";g.fillText(s,x,y)}
function drawMini(g,k,cx,cy,s,dim){
 const sh=SH[k],t=TYPES.indexOf(k);let mx=9,my=9,Mx=-1,My=-1;
 for(const [x,y] of sh.c){mx=Math.min(mx,x);Mx=Math.max(Mx,x);my=Math.min(my,y);My=Math.max(My,y)}
 const w=(Mx-mx+1)*s,h=(My-my+1)*s;
 sh.c.forEach(([x,y],i)=>drawCell(g,cx-w/2+(x-mx)*s,cy-h/2+(y-my)*s,s,t,i,dim?.45:1));
}
let lastT=performance.now();
function draw(){
 const g=ctx,c=L_.c,dpr=L_.dpr;
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,L_.w,L_.h);
 if(!G)return;
 let sx=0,sy=0;if(G.shake>0){sx=(Math.random()-.5)*G.shake*c*.5;sy=(Math.random()-.5)*G.shake*c*.5}
 g.save();g.translate(L_.ox+sx,L_.oy+sy);
 // board bg
 g.fillStyle="#0e0820";g.fillRect(-4,-4,c*W+8,c*H+8);
 g.fillStyle="#150c2e";g.fillRect(0,0,c*W,c*H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if((x+y)&1){g.fillStyle="#1a1038";g.fillRect(x*c,y*c,c,c)}
 g.strokeStyle="#8a6ee0";g.lineWidth=3;g.strokeRect(-2,-2,c*W+4,c*H+4);
 // cells
 const flashRows=G.clearing?G.clearing.rows:null;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const k=G.board[y][x];if(!k)continue;
  if(k.k==="cage")drawCage(g,x*c,y*c,c,k.a);else drawCell(g,x*c,y*c,c,k.t,k.i);
  if(flashRows&&flashRows.indexOf(y)>=0){g.fillStyle="rgba(255,255,255,"+(.3+.5*Math.abs(Math.sin(G.t*30)))+")";g.fillRect(x*c,y*c,c,c)}
 }
 // ghost + piece
 if(G.piece){
  const p=G.piece,gy=ghostY();
  g.strokeStyle=COL[p.t][2];g.lineWidth=2;g.globalAlpha=.7;
  for(const [cx,cy] of p.cells){g.strokeRect((p.x+cx)*c+2,(gy+cy)*c+2,c-4,c-4)}
  g.globalAlpha=.18;g.fillStyle=COL[p.t][0];for(const [cx,cy] of p.cells)g.fillRect((p.x+cx)*c+2,(gy+cy)*c+2,c-4,c-4);g.globalAlpha=1;
  p.cells.forEach(([cx,cy],i)=>{if(p.y+cy>=0)drawCell(g,(p.x+cx)*c,(p.y+cy)*c,c,p.t,i)});
 }
 // particles
 for(const p of G.particles){
  if(p.e){emojiAt(g,p.e,p.x*c,p.y*c,c*.6,Math.min(1,p.life*2))}
  else{g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.col;g.fillRect(p.x*c,p.y*c,p.sz*c,p.sz*c);g.globalAlpha=1}
 }
 for(const f of G.floaters){const a=Math.min(1,f.t);if(f.col){g.globalAlpha=a;textAt(g,f.txt,f.x*c,f.y*c,c*f.sz,f.col);g.globalAlpha=1}else emojiAt(g,f.txt,f.x*c,f.y*c,c*f.sz,a)}
 if(G.banner){const b=G.banner,a=Math.min(1,b.t*2);g.globalAlpha=a;g.fillStyle="#000a";g.fillRect(0,c*8,c*W,c*2);textAt(g,b.txt,c*W/2,c*9,c*(b.txt.length>16?.9:1.2),"#ffd24a");g.globalAlpha=1}
 g.restore();
 // side panel
 const px=L_.ox+c*W+c*.5+sx,pw=c*4.4,py=L_.oy+sy,cx=px+pw/2;
 const box=(y,h)=>{g.fillStyle="#2d1d52";g.fillRect(px,py+y*c,pw,h*c);g.strokeStyle="#6a4fb0";g.lineWidth=2;g.strokeRect(px+1,py+y*c+1,pw-2,h*c-2)};
 textAt(g,T("hold"),cx,py+.5*c,c*.7,"#ffd24a");box(1,3);
 if(G.hold)drawMini(g,G.hold,cx,py+2.5*c,c*.62,G.holdUsed);
 textAt(g,T("next"),cx,py+4.5*c,c*.7,"#ffd24a");box(5,8);
 G.next.forEach((k,i)=>drawMini(g,k,cx,py+(6.3+i*2.6)*c,c*(i?.5:.62)));
 textAt(g,T("score"),cx,py+13.8*c,c*.62,"#ffd24a");textAt(g,String(G.score),cx,py+14.6*c,c*.9);
 textAt(g,G.mode==="marathon"?T("level")+" "+G.level:T("sprintT"),cx,py+15.7*c,c*.7);
 // rescue bar
 if(G.mode==="marathon"){
  g.fillStyle="#0008";g.fillRect(px,py+16.4*c,pw,c*.7);g.fillStyle="#6ee7b7";g.fillRect(px,py+16.4*c,pw*Math.min(1,G.resc/G.quota),c*.7);
  emojiAt(g,ANI[G.animal],cx,py+17.7*c,c*.9);
 }else{
  textAt(g,fmt(G.timeLeft),cx,py+16.8*c,c*1.1,G.timeLeft<15?"#ff7eb6":"#fff4e8");
  emojiAt(g,"🐾",cx,py+17.9*c,c*.8);textAt(g,String(G.resc),cx+c*1.2,py+17.9*c,c*.9,"#6ee7b7");
 }
 // hearts, paws, boss
 if(G.mode==="marathon")emojiAt(g,"💖",px+c*.7,py+18.6*c,c*.7),textAt(g,"×"+G.saves,px+c*1.5,py+18.6*c,c*.65,"#fff4e8","left");
 emojiAt(g,"🐾",px+c*2.7,py+18.6*c,c*.7);textAt(g,"×"+G.paws,px+c*3.3,py+18.6*c,c*.65,"#fff4e8","left");
 if(G.boss){const w=G.boss.t<=3;emojiAt(g,"🤖",px+c*.7+(w?Math.sin(G.t*40)*2:0),py+19.6*c,c*.7);textAt(g,Math.ceil(G.boss.t)+"s",px+c*1.5,py+19.6*c,c*.6,w?"#ff7eb6":"#fff4e8","left")}
 // CRT scanlines
 g.fillStyle="rgba(0,0,0,.10)";for(let y=0;y<L_.h;y+=3)g.fillRect(0,y,L_.w,1);
}
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
 if(G&&(screen==="play")&&!paused&&!G.over)update(dt);
 else if(G&&G.over){for(const p of G.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=9*dt;p.life-=dt}G.particles=G.particles.filter(p=>p.life>0);if(G.shake>0)G.shake=Math.max(0,G.shake-dt)}
 if(G&&document.body.classList.contains("play"))draw();
}

/* ---------- test hook ---------- */
function snap(){
 if(!G)return{screen,paused};
 return{screen,paused,mode:G.mode,level:G.level,diff:G.diff,score:G.score,rescued:G.resc,quota:G.quota,saves:G.saves,paws:G.paws,over:G.over,clearing:!!G.clearing,hold:G.hold,next:G.next.slice(),
  piece:G.piece?{k:G.piece.k,x:G.piece.x,y:G.piece.y,cells:G.piece.cells.map(a=>a.slice())}:null,timeLeft:G.timeLeft,lines:G.lines,
  board:G.board.map(r=>r.map(c=>c?(c.k==="cage"?(c.a?"A":"C"):"#"):".").join(""))};
}
window.__tetris={
 state:snap,get G(){return G},get save(){return S},
 start(n,d){if(d&&DIFF[d]){S.diff=d}newGame("marathon",n||1,S.diff)},sprint(d){if(d&&DIFF[d])S.diff=d;startSprint()},
 win(){if(G&&G.mode==="marathon")levelWin()},lose(){if(G){G.saves=0;G.piece=null;levelFail()}},endSprint(){if(G&&G.mode==="sprint")endSprint()},
 move,rotate,hardDrop,hold:holdPiece,soft:softDrop,paw:usePaw,lock:()=>{if(G&&G.piece)lockPiece()},
 setPiece(k){if(G){G.piece=mkPiece(k);G.acc=0}},
 fillRows(k,gap){if(!G)return;for(let i=0;i<k;i++){const y=H-1-i;for(let x=0;x<W;x++)G.board[y][x]=x===gap?null:{k:"cat",t:(x+i)%7,i:(x+i)%4}}},
 fillTop(){if(!G)return;for(let y=0;y<H;y++)for(let x=0;x<W-1;x++)G.board[y][x]={k:"cat",t:2,i:1}},
 addCage(){if(G)addCageRow(false)},tick(sec){if(G)update(sec)},
 setLang(l){if(TX[l]){lang=l;ls.set("annabelle-lang",l);renderMenu()}},toMenu,pause:doPause,
 chapter:showChapter,story:showStory
};

/* ---------- init ---------- */
renderMenu();resize();requestAnimationFrame(frame);
if(window.ResizeObserver)new ResizeObserver(resize).observe($("stage"));
})();
