 const done=()=>{if(G===g0){G.fliers=Math.max(0,G.fliers-1);G.rescShown=Math.min(G.resc,G.rescShown+n);updateHud()}pill.classList.remove("bump");void pill.offsetWidth;pill.classList.add("bump");SFX.fly()};
 G.fliers++;
 let el=null;
 try{
  const r=cv.getBoundingClientRect(),x0=r.left+L_.ox+bx*L_.c,y0=r.top+L_.oy+by*L_.c,pr=pill.getBoundingClientRect(),x1=pr.left+pr.width/2,y1=pr.top+pr.height/2;
  el=document.createElement("span");el.className="fly";el.textContent=e;document.body.appendChild(el);
  const a=el.animate([{transform:`translate(${x0}px,${y0}px) scale(.3) rotate(0deg)`},{transform:`translate(${x0}px,${y0-L_.c*1.6}px) scale(1.7) rotate(-12deg)`,offset:.32},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)+ (y0-y1)*.35}px) scale(1.3) rotate(12deg)`,offset:.62},{transform:`translate(${x1}px,${y1}px) scale(.5) rotate(0deg)`}],{duration:950,delay:delay||0,fill:"both",easing:"ease-in-out"});
  let fin=false;const f=()=>{if(fin)return;fin=true;el.remove();done()};
  a.onfinish=f;a.oncancel=f;setTimeout(f,1400+(delay||0));
 }catch(x){if(el)el.remove();setTimeout(done,200)}
}

/* ---------- actions ---------- */
function playing(){return G&&screen==="play"&&!paused&&!G.over&&!G.clearing&&!G.bossDefeat&&G.piece}
function touchLock(){if(G.piece&&collide(G.piece.cells,G.piece.x,G.piece.y+1)&&G.lockMoves<14){G.lockT=0;G.lockMoves++}}
function tryMove(dx,dy){const p=G.piece;if(!p||collide(p.cells,p.x+dx,p.y+dy))return false;p.x+=dx;p.y+=dy;return true}
function move(dx){if(!playing())return;G.lookX=dx;G.lookT=.4;if(tryMove(dx,0)){SFX.move();touchLock()}}
function rotate(d){
 if(!playing())return;const p=G.piece;if(p.k==="O"){SFX.rot();return}
 const nc=rotCells(p.cells,p.n,d);
 for(const [kx,ky] of KICKS){if(!collide(nc,p.x+kx,p.y+ky)){p.cells=nc;p.x+=kx;p.y+=ky;SFX.rot();touchLock();return}}
}
function softDrop(){if(!playing())return;G.downT=.3;if(tryMove(0,1)){G.score+=1;G.acc=0}else{G.lockT+=.12}}
function ghostY(){const p=G.piece;let y=p.y;while(!collide(p.cells,p.x,y+1))y++;return y}
function hardDrop(){
 if(!playing())return;const p=G.piece,y=ghostY();G.score+=2*(y-p.y);
 for(const [cx,cy] of p.cells)burst(p.x+cx+.5,y+cy+1,COL[p.t][2],2);
 p.y=y;G.shake=Math.max(G.shake,.14);SFX.drop();lockPiece();
}
function holdPiece(){
 if(!playing()||G.holdUsed)return;
 const k=G.piece.k;
 if(G.hold){G.piece=mkPiece(G.hold)}else{G.piece=mkPiece(drawNext());G.next=G.q.slice(0,3)}
 G.hold=k;G.holdUsed=true;G.acc=0;G.lockT=0;G.lockMoves=0;SFX.hold();
 if(collide(G.piece.cells,G.piece.x,G.piece.y))overflow();
}
function usePaw(){
 if(!G||screen!=="play"||paused||G.over||G.bossDefeat)return;
 if(G.paws<=0||G.clearing){SFX.no();if(G.paws<=0)banner(T("noPaw"));return}
 let row=-1;
 for(let y=H-1;y>=0;y--){if(G.board[y].some(c=>c&&c.k==="cage")){row=y;break}}
 if(row<0)for(let y=H-1;y>=0;y--){if(G.board[y].some(Boolean)){row=y;break}}
 if(row<0){SFX.no();return}
 G.paws--;G.pawsUsed++;
 for(let x=0;x<W;x++){const c=G.board[row][x];if(c)burst(x+.5,row+.5,c.k==="cage"?"#c8c8d8":COL[c.t||0][0],4,"💖")}
 clearRowsEffects([row]);
 G.board.splice(row,1);G.board.unshift(Array(W).fill(null));
 if(G.piece&&collide(G.piece.cells,G.piece.x,G.piece.y)){G.piece.y--}
 SFX.paw();SFX.rescue();banner(T("saved"));juice(.05,.15);updateHud();checkQuota();
}
function lockPiece(){
 const p=G.piece;
 for(let i=0;i<4;i++){const [cx,cy]=p.cells[i],x=p.x+cx,y=p.y+cy;if(y>=0)G.board[y][x]={k:"cat",t:p.t,i}}
 G.piece=null;
 const full=[];for(let y=0;y<H;y++)if(G.board[y].every(Boolean))full.push(y);
 const n=full.length;
 if(!n){G.combo=0;spawn();return}
 G.combo++;G.lines+=n;
 const gain=clearRowsEffects(full);
 const lv=G.mode==="sprint"?3:G.level;
 G.score+=[0,100,300,500,800][n]*lv+50*(G.combo-1);
 G.shake=.22+n*.09;
 juice(n>=4?.14:n>=2?.08:.04,n>=3?.22:n===2?.1:0);
 SFX.line(n);if(gain>0)SFX.rescue();
 if(n>=2)pop(T("pops")[Math.min(2,n-2)],n>=4?"#ff7eb6":n===3?"#6ee7b7":"#ffd24a");
 else if(G.combo>=2)pop(T("combo").replace("{n}",G.combo),"#6ee7b7");
 if(G.combo>=3)award({event:"combo",score:G.combo});
 G.clearing={rows:full,t:0,dur:.5,popped:{}};
}
function clearRowsEffects(rows){
 let gain=0,i=0;
 for(const y of rows){
  let cageAni=null;
  for(let x=0;x<W;x++){const c=G.board[y][x];if(c&&c.a)cageAni=c.a}
  const n=1+(cageAni?1:0);gain+=n;
  const e=cageAni||aniEmoji();G.freed.push(e);if(cageAni)G.freed.push(e);
  flyAnimal(e,W/2,y+.5,n,120+i*110);i++;
  G.floaters.push({x:W/2+1.8,y:y+.3,vy:-1.3,t:1.2,txt:"+"+n,sz:1.05,col:"#ffd24a"});
 }
 G.resc+=gain;
 if(G.boss&&gain)G.boss.hit=.45;
 return gain;
}
function finishClear(){
 const rows=G.clearing.rows.slice().sort((a,b)=>b-a);
 for(const y of rows){G.board.splice(y,1)}
 for(let i=0;i<rows.length;i++)G.board.unshift(Array(W).fill(null));
 G.clearing=null;
 if(G.mode==="arcade"){
  const nl=1+Math.floor(G.lines/6);
  if(nl>G.level){
   G.level=nl;G.grav=gravMs();pop(T("lvUp").replace("{n}",nl),"#6ee7b7");SFX.levelup();juice(.05,.12);
   if(nl>=3&&nl%2===1&&stackH()<=10)addCageRow(false);
   if(nl%4===0&&G.paws<5)G.paws++;
   musStart(Math.max(120,170-(nl-1)*4));
  }
 }
 updateHud();
 if(checkQuota())return;
 spawn();
}
function checkQuota(){
 if(G.over||G.bossDefeat)return true;
 if(G.mode!=="marathon"||G.resc<G.quota)return false;
 if(G.clearing){G.winPending=true;return false}
 if(G.boss)startBossDefeat();else levelWin();
 return true;
}
function startBossDefeat(){
 G.piece=null;G.bossDefeat={t:0,dur:1.75,popped:false};G.bossSeen=true;
 juice(.14,.3);G.shake=.5;SFX.bonk();pop(T("bonk"),"#ff7eb6");
}

/* ---------- update ---------- */
function fxUpdate(dt){
 for(const p of G.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=9*dt;p.life-=dt}
 G.particles=G.particles.filter(p=>p.life>0);
 for(const f of G.floaters){f.y+=f.vy*dt;f.t-=dt}
 G.floaters=G.floaters.filter(f=>f.t>0);
 if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
 if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
 if(G.pop){G.pop.t+=dt;if(G.pop.t>=G.pop.dur)G.pop=null}
 if(G.boss){if(G.boss.hit>0)G.boss.hit-=dt;if(G.boss.jump>0)G.boss.jump-=dt}
}
function update(dt){
 G.t+=dt;
 if(G.introT>0)G.introT-=dt;
 if(G.lookT>0)G.lookT-=dt;
 if(G.downT>0)G.downT-=dt;
 if(G.mode==="sprint"){G.timeLeft-=dt;if(G.timeLeft<=0){G.timeLeft=0;endSprint();return}}
 if(G.bossDefeat){
  const b=G.bossDefeat;b.t+=dt;
  if(!b.popped&&b.t>=1.1){b.popped=true;burst(W/2,8,"#ffd24a",30,"🎉");burst(W/2,8,"#ff7eb6",22,"✨");SFX.pop();G.shake=.5;G.flashT=.22}
  if(b.t>=b.dur){G.bossDefeat=null;levelWin();return}
 }else if(G.clearing){
  const cl=G.clearing;cl.t+=dt;
  for(const y of cl.rows)for(let x=0;x<W;x++){const key=y*W+x;if(!cl.popped[key]&&cl.t>=.1+Math.abs(x-4.5)*.035+.08){cl.popped[key]=1;const c=G.board[y][x];burst(x+.5,y+.5,c&&c.k==="cat"?COL[c.t][0]:"#c8c8d8",3,"💖")}}
  if(cl.t>=cl.dur){finishClear();if(G.over)return}
 }else if(G.piece){
  const grounded=collide(G.piece.cells,G.piece.x,G.piece.y+1);
  if(grounded){G.lockT+=dt;if(G.lockT>=G.lockDelay){lockPiece()}}
  else{G.lockT=0;if(G.introT<=0){G.acc+=dt;const g=G.grav;while(G.acc>=g){G.acc-=g;if(!tryMove(0,1)){G.acc=0;break}}}}
 }
 if(G.over)return;
 if(G.winPending&&!G.clearing){G.winPending=false;if(checkQuota()&&G.over)return}
 if(G.boss&&!G.bossDefeat&&!G.clearing&&!G.over){
  const b=G.boss;b.t-=dt;
  if(b.t<=3&&!b.warned){b.warned=true;banner(T("warn").replace("🤖",b.e));SFX.warn()}
  if(b.t<=0){
   b.t=b.period;b.warned=false;
   if(stackH()<=H-6){b.jump=.5;addCageRow(false);banner(T("cage").replace("🤖",b.e));SFX.no();G.shake=.25}
  }
 }
 fxUpdate(dt);
 if(!G.fliers)G.rescShown=G.resc;
 updateHud();
}

function recBest(m){const prev=S.best,idx=addHi(G.score,m),rec=G.score>prev&&G.score>0;if(rec)S.best=G.score;return{idx,rec}}

function poolAnimals(n){

 for(let i=0;i<n;i++){if(!pool.length)break;const a=pool.splice(Math.floor(Math.random()*pool.length),1)[0];addZoo(a);got.push(a)}

document.addEventListener("keydown",e=>{
 const c=e.code;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(c==="KeyM"){toggleMute();return}
 if(screen==="play"&&G){
  if(c==="KeyP"||c==="Escape"){e.preventDefault();doPause(!paused);return}
  if(paused){if(c==="Enter"||c==="Space"){e.preventDefault();doPause(false)}return}
  if(G.over)return;
  switch(c){
   case"ArrowLeft":move(-1);break;case"ArrowRight":move(1);break;case"ArrowDown":softDrop();break;
   case"ArrowUp":case"KeyX":rotate(1);break;case"KeyZ":rotate(-1);break;
   case"Space":if(!e.repeat)hardDrop();break;case"KeyC":case"ShiftLeft":case"ShiftRight":holdPiece();break;
   case"KeyH":usePaw();break;default:return;
  }
  e.preventDefault();return;
 }
 if(c==="Enter"||c==="Space"){const b=document.querySelector(".ov.show .primary")||(screen==="menu"?$("bPlay"):null);if(b&&!(e.target&&e.target.tagName==="BUTTON")){e.preventDefault();b.click()}}
 if(c==="Escape"&&screen!=="menu"&&screen!=="result"&&screen!=="reveal"){toMenu()}
});

const cv=$("cv"),ctx=cv.getContext("2d");
let gp=null;
cv.addEventListener("pointerdown",e=>{if(!playing())return;ac();try{cv.setPointerCapture(e.pointerId)}catch(x){}gp={x:e.clientX,y:e.clientY,lx:e.clientX,t:performance.now(),moved:0,acc:0}});
cv.addEventListener("pointermove",e=>{
 if(!gp||!G)return;const step=Math.max(14,L_.c*.95);
 gp.acc+=(e.clientX-gp.lx);gp.lx=e.clientX;
 while(gp.acc>=step){move(1);gp.acc-=step;gp.moved=1}
 while(gp.acc<=-step){move(-1);gp.acc+=step;gp.moved=1}
});
function endGesture(e,cancel){
 if(!gp)return;const g=gp;gp=null;if(cancel||!G)return;
 const dx=e.clientX-g.x,dy=e.clientY-g.y,dt=performance.now()-g.t,cs=Math.max(14,L_.c);
 if(g.moved&&Math.abs(dy)<cs*2)return;
 if(Math.abs(dx)<cs*.8&&Math.abs(dy)<cs*.8){if(dt<350)rotate(1);return}
 if(Math.abs(dy)>Math.abs(dx)*1.2){if(dy>cs*1.5)hardDrop();else if(dy<-cs*1.5)holdPiece()}
}
cv.addEventListener("pointerup",e=>endGesture(e,false));
cv.addEventListener("pointercancel",e=>endGesture(e,true));

 const cw=Math.round(w*dpr),chh=Math.round(h*dpr);
 if(cv.width!==cw||cv.height!==chh){cv.width=cw;cv.height=chh}
 // wide: board + roomy side panel. slim (phones): board as big as possible + a slim info column.
 const cW=Math.floor(Math.min(w/14.9,(h-6)/20)),cS=Math.floor(Math.min((w-70)/10,(h-6)/20));
 const slim=cS>cW*1.06,c=Math.max(8,slim?cS:cW);
 const gap=slim?6:Math.round(c*.5),pw=slim?Math.min(w-c*10-gap-4,c*3):c*4.4,tot=c*10+gap+pw;
 L_={c,slim,pw,gap,ox:Math.max(2,Math.floor((w-tot)/2)),oy:Math.max(2,Math.floor((h-c*20)/2)),w,h,dpr};
 if(!scanPat){try{const p=document.createElement("canvas");p.width=2;p.height=3;const pg=p.getContext("2d");pg.fillStyle="rgba(0,0,0,.11)";pg.fillRect(0,0,2,1);scanPat=ctx.createPattern(p,"repeat")}catch(e){}}
}

function drawCell(g,x,y,s,t,i,alpha,f){
 const col=COL[t],u=s/10,A=alpha==null?1:alpha;g.save();g.globalAlpha=A;
 g.fillStyle=col[1];g.fillRect(x,y,s,s);
 g.fillStyle=col[0];g.fillRect(x+u*.7,y+u*.7,s-u*1.4,s-u*1.4);
 g.fillStyle=col[2];g.fillRect(x+u*.7,y+u*.7,s-u*1.4,u*1.1);g.fillRect(x+u*.7,y+u*.7,u*1.1,s-u*1.4);
 const D="#2a1a33",P=(a,b,c,d,fc)=>{g.fillStyle=fc||D;g.fillRect(x+a*u,y+b*u,c*u,d*u)};
 if(i===1){ // cat face (blinks, looks where it moves, smiles when its row is freed)
  const E=t===6?"#ffe14a":D,GL=t===6?D:"#fff";
  P(1.5,1.2,2,2,col[1]);P(6.5,1.2,2,2,col[1]);P(2,1.7,1,1,"#ffb5cf");P(7,1.7,1,1,"#ffb5cf");
  if(f&&f.happy){for(const ex of [2,6]){P(ex,4.9,.7,1.1,E);P(ex+.6,4.2,.8,.8,E);P(ex+1.3,4.9,.7,1.1,E)}}
  else if(f&&f.blink){P(2,5,2,.6,E);P(6,5,2,.6,E)}
  else{
   const lx=f&&f.lx||0,ly=f&&f.ly||0,ox=lx*.55,oy=ly*.5,gx=lx>0?1.1:lx<0?0:.15,gy=ly>0?1.25:.15;
   P(2+ox,4+oy,2,2.2,E);P(6+ox,4+oy,2,2.2,E);P(2+ox+gx,4+oy+gy,.9,.9,GL);P(6+ox+gx,4+oy+gy,.9,.9,GL);
  }
  P(4.2,6.6,1.6,1,"#ff6fa0");P(3,7.8,1,.7);P(6,7.8,1,.7);P(4,8.3,2,.6);
 }else if(i===0){ // paw print
  g.globalAlpha=A*.45;P(3.2,5.2,3.6,2.8);P(2,3.2,1.4,1.5);P(4.3,2.4,1.5,1.6);P(6.6,3.2,1.4,1.5);
 }else if(i===2){ // stripes
  g.globalAlpha=A*.38;P(0.7,2.5,4,1);P(5.3,4.5,4,1);P(1.5,7,4.5,1);
 }else{ // tail
  g.globalAlpha=A*.5;P(2.5,6.5,4,1.2);P(6.3,3,1.3,4.7);P(4,3,3.6,1.2);g.globalAlpha=A;P(4,3,1.2,1.2,col[2]);
 }
 g.restore();
}

function drawBoard(g){

 g.fillStyle="#0e0820";g.fillRect(-4,-4,c*W+8,c*H+8);
 g.fillStyle="#150c2e";g.fillRect(0,0,c*W,c*H);
 g.fillStyle="#1a1038";for(let y=0;y<H;y++)for(let x=(y&1)^1;x<W;x+=2)g.fillRect(x*c,y*c,c,c);
 g.strokeStyle="#8a6ee0";g.lineWidth=3;g.strokeRect(-2,-2,c*W+4,c*H+4);
 for(let y=0;y<H;y++){
  const inCl=cl&&cl.rows.indexOf(y)>=0;
  for(let x=0;x<W;x++){
   const k=G.board[y][x];if(!k)continue;
   if(inCl){ // the freed row: flash, then every block pops
    const q=(cl.t-(.1+Math.abs(x-4.5)*.035))/.22;
    if(q>=1)continue;
    const one=(px,py)=>{if(k.k==="cage"){drawCage(g,px,py,c,!!k.a);if(k.a)emojiAt(g,k.a,px+c/2,py+c/2,c*.85)}else drawCell(g,px,py,c,k.t,k.i,1,{happy:1})};

    else{const sc=q<.35?1+q*1.2:1.42*(1-(q-.35)/.65);g.save();g.translate((x+.5)*c,(y+.5)*c);g.rotate(q*(x<5?-1:1)*.7);g.scale(sc,sc);g.globalAlpha=1-q*.4;one(-c/2,-c/2);g.restore()}
   }else if(k.k==="cage"){drawCage(g,x*c,y*c,c,!!k.a);if(k.a)animals.push(x,y,k.a)}
   else drawCell(g,x*c,y*c,c,k.t,k.i,1,k.i===1?{blink:((x*31+y*17+Math.floor(G.t*3))%53)===0}:null);
  }
 }
 // trapped animals: big and wiggling
 for(let i=0;i<animals.length;i+=3){const x=animals[i],y=animals[i+1];g.save();g.translate((x+.5)*c,(y+.5)*c+c*.04);g.rotate(Math.sin(G.t*3+x*1.7)*.13);emojiAt(g,animals[i+2],0,0,c*.92);g.restore()}
 // ghost + piece
 if(G.piece){

  g.globalAlpha=.2;g.fillStyle=COL[p.t][0];for(const [cx,cy] of p.cells)if(gy+cy>=0)g.fillRect((p.x+cx)*c+2,(gy+cy)*c+2,c-4,c-4);g.globalAlpha=1;

 }
 for(const p of G.particles){
  if(p.e){emojiAt(g,p.e,p.x*c,p.y*c,c*.6,Math.min(1,p.life*2))}
  else{g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.col;g.fillRect(p.x*c,p.y*c,p.sz*c,p.sz*c);g.globalAlpha=1}
 }

 if(G.banner){const b=G.banner,a=Math.min(1,b.t*2);g.globalAlpha=a;g.fillStyle="#000b";g.fillRect(0,c*11,c*W,c*1.8);textAt(g,b.txt,c*W/2,c*11.9,c*.95,"#ffd24a","center",c*W-12);g.globalAlpha=1}

  textAt(g,lvTxt,cx,py+14.75*c,c*.65,"#cfc3ff");

  else if(G.mode==="sprint"){textAt(g,fmt(G.timeLeft),px+c*1.3,py+15.9*c,c*.95,G.timeLeft<15?"#ff7eb6":"#fff4e8");emojiAt(g,"🐾",px+c*2.9,py+15.9*c,c*.7);textAt(g,String(G.resc),px+c*3.4,py+15.9*c,c*.75,"#6ee7b7","left")}
  else{emojiAt(g,"🐾",px+c*1.3,py+15.9*c,c*.95);textAt(g,String(G.resc),px+c*2.1,py+15.9*c,c*.85,"#6ee7b7","left")}
  if(G.mode!=="sprint"){emojiAt(g,"💖",px+c*.6,py+17.6*c,c*.7);textAt(g,"×"+G.saves,px+c*1.15,py+17.6*c,c*.62,"#fff4e8","left")}
  emojiAt(g,"🐾",px+c*2.7,py+17.6*c,c*.7);textAt(g,"×"+G.paws,px+c*3.25,py+17.6*c,c*.62,"#fff4e8","left");
  if(b){bx=px+c*.9;by=py+19.05*c;bs=c*1.35;bar(px+c*1.9,py+18.75*c,pw-c*1.9,c*.4,1-G.resc/G.quota,"#ff7eb6");textAt(g,Math.ceil(b.t)+"s",px+c*1.9,py+19.55*c,c*.55,b.t<=3?"#ff7eb6":"#cfc3ff","left")}
 }
 if(b&&!(G.bossDefeat)&&!(G.over&&G.bossSeen)){ // the boss bobs, wiggles before throwing a cage, and gets bonked by each rescue
  const warn=b.t<=3,hit=b.hit>0;
  g.save();g.translate(bx+(warn?Math.sin(G.t*40)*2.5:0)+(hit?Math.sin(G.t*60)*4:0),by+Math.sin(G.t*2.5)*bs*.06-(b.jump>0?Math.sin(b.jump/.5*Math.PI)*bs*.5:0));
  if(hit)g.rotate(Math.sin(G.t*30)*.3);
  g.fillStyle=hit?"rgba(255,255,255,.5)":warn?"rgba(255,126,182,.35)":"rgba(255,255,255,.13)";g.beginPath();g.arc(0,0,bs*.62,0,6.3);g.fill();
  emojiAt(g,b.e,0,0,bs);if(b.crown)emojiAt(g,"👑",0,-bs*.62,bs*.5);
  if(hit)emojiAt(g,"💫",bs*.5,-bs*.45,bs*.45);
  if(warn)textAt(g,"!",-bs*.62,-bs*.4,bs*.6,"#ff7eb6");
  g.restore();
 }
}
function draw(){
 const g=ctx,c=L_.c,dpr=L_.dpr;
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,L_.w,L_.h);
 if(!G)return;
 let sx=0,sy=0;if(G.shake>0){sx=(Math.random()-.5)*G.shake*c*.5;sy=(Math.random()-.5)*G.shake*c*.5}
 g.save();g.translate(L_.ox+sx,L_.oy+sy);drawBoard(g);g.restore();
 drawPanel(g,sx,sy);
 if(scanPat){g.fillStyle=scanPat;g.fillRect(0,0,L_.w,L_.h)}
}
// menu mascot: bobbing cat block that blinks and looks around, with rescued friends hopping
const mc=$("masc"),mg=mc.getContext("2d");
(function(){const d=Math.min(2,window.devicePixelRatio||1);mc.width=220*d;mc.height=92*d;mg.setTransform(d,0,0,d,0,0)})();
function drawMascot(t){
 mg.clearRect(0,0,220,92);
 const s=30,bob=Math.sin(t*2.6)*4,x0=110-s*1.5,y0=92-s*2-6+bob,lk=Math.sin(t*.8),look=lk>.55?1:lk<-.55?-1:0;
 SH.T.c.forEach(([x,y],i)=>drawCell(mg,x0+x*s,y0+y*s,s,0,i,1,i===1?{lx:look,ly:0,blink:(t%2.7)<.13,happy:(t%9)>8.2}:null));
 emojiAt(mg,"🐰",x0-s*.9,92-22-Math.abs(Math.sin(t*3.2))*14,30);
 emojiAt(mg,"🐢",x0+s*3.9,92-20-Math.abs(Math.sin(t*2.1+1))*8,28);
 emojiAt(mg,"✨",x0+s*.3,y0+s*.2+Math.sin(t*4)*3,12+Math.sin(t*5)*4,.6+.4*Math.sin(t*5));
}
let lastT=performance.now();
function frame(t){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,Math.max(0,(t-lastT)/1000));lastT=t;
 if(G){
  if(G.flashT>0)G.flashT-=dt;
  if(screen==="play"&&!paused&&!G.over){if(G.hitstop>0)G.hitstop-=dt;else update(dt)}
  else if(G.over)fxUpdate(dt);
  if(document.body.classList.contains("play"))draw();
 }
 if(screen==="menu")drawMascot(t/1000);
}
// drifting background friends
(function(){const b=$("bg"),E=["🧱","🐾","⭐","🐱","🐰","💖","🧶","🐟"];for(let i=0;i<10;i++){const s=document.createElement("span");s.textContent=E[i%E.length];s.style.left=(4+i*9.6)+"%";s.style.animationDuration=(11+((i*7)%9))+"s";s.style.animationDelay=(-(i*3.7)%14)+"s";s.style.fontSize=(22+((i*5)%16))+"px";b.appendChild(s)}})();

/* ---------- test hook ---------- */
function snap(){
 if(!G)return{screen,paused};
 return{screen,paused,mode:G.mode,level:G.level,diff:G.diff,score:G.score,rescued:G.resc,shown:G.rescShown,quota:G.quota,saves:G.saves,paws:G.paws,over:G.over,clearing:!!G.clearing,hold:G.hold,next:G.next.slice(),
  piece:G.piece?{k:G.piece.k,x:G.piece.x,y:G.piece.y,cells:G.piece.cells.map(a=>a.slice())}:null,timeLeft:G.timeLeft,lines:G.lines,cages:G.cages,
  boss:G.boss?{e:G.boss.e,t:G.boss.t,hp:Math.max(0,G.quota-G.resc)}:null,bossDefeat:!!G.bossDefeat,bossSeen:G.bossSeen,pop:G.pop?G.pop.txt:null,layout:{c:L_.c,slim:L_.slim},
  board:G.board.map(r=>r.map(c=>c?(c.k==="cage"?(c.a?"A":"C"):"#"):".").join(""))};
}
window.__tetris={
 state:snap,get G(){return G},get save(){return S},
 start(n,d){if(d&&DIFF[d]){S.diff=d}newGame("marathon",n||1,S.diff)},sprint(d){if(d&&DIFF[d])S.diff=d;startSprint()},arcade(d){if(d&&DIFF[d])S.diff=d;startArcade()},
 win(){if(G&&G.mode==="marathon")levelWin()},lose(){if(G){G.saves=0;G.piece=null;if(G.mode==="arcade")endArcade();else levelFail()}},endSprint(){if(G&&G.mode==="sprint")endSprint()},endArcade(){if(G&&G.mode==="arcade")endArcade()},
 move,rotate,hardDrop,hold:holdPiece,soft:softDrop,paw:usePaw,lock:()=>{if(G&&G.piece)lockPiece()},
 setPiece(k){if(G){G.piece=mkPiece(k);G.acc=0}},setBossTimer(s){if(G&&G.boss)G.boss.t=s},
 fillRows(k,gap){if(!G)return;for(let i=0;i<k;i++){const y=H-1-i;for(let x=0;x<W;x++)G.board[y][x]=x===gap?null:{k:"cat",t:(x+i)%7,i:(x+i)%4}}},
 fillTop(){if(!G)return;for(let y=0;y<H;y++)for(let x=0;x<W-1;x++)G.board[y][x]={k:"cat",t:2,i:1}},
 addCage(){if(G)addCageRow(false)},tick(sec){if(G)update(sec)},
 setLang(l){if(TX[l]){lang=l;ls.set("annabelle-lang",l);renderMenu()}},toMenu,pause:doPause,
 chapter:showChapter,story:showStory,reveal(id){showReveals([id||"tiger"],toMenu)}
};

/* ---------- init ---------- */
renderMenu();resize();requestAnimationFrame(frame);
if(window.ResizeObserver)new ResizeObserver(resize).observe($("stage"));
})();
