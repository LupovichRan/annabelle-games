let level=1,hearts=3,score=0,streak=0,best=+ls.get("annabelle-cups-best")||0,ballCup=0,cupAt=[],X=[],sel=0,over=false;
let steps=[],stepI=0,stepT=0,swapLog=[],gapT=0,rv=null,resultT=0,wasCorrect=false,idleT=0,mood=0,moodK="";
const cfg=()=>{const e=mode==="easy";const n=level<=2?3:level<=5?4:5;return{n:e?Math.min(n,4):n,swaps:Math.min(e?12:18,Math.round((3+level*1.6)*(e?.75:1))),dur:Math.max(e?.5:.3,(.92-.06*level)*(e?1.4:1)),decoy:level>=4,dbl:level>=6&&!e,same:true}};
function layout(n){X=[];const sp=n===3?2.2:n===4?1.95:1.7;for(let i=0;i<n;i++)X.push((i-(n-1)/2)*sp)}
function buildCups(n){cups.forEach(c=>{scene.remove(c.g);scene.remove(c.blob)});cups=[];for(let i=0;i<n;i++)cups.push(mkCup(i));layout(n);cupAt=cups.map((c,i)=>i);cups.forEach((c,i)=>{c.slot=i;c.x=X[i];c.z=0;positionCup(c)});
 cups.forEach(c=>{const num=c.g.children[2];num.visible=false});buildPicks(n)}
function buildPicks(n){$("picks").innerHTML=Array.from({length:n},(_,i)=>`<button data-slot="${i}" aria-label="${t("cup")} ${i+1}">${i+1}</button>`).join("")}
function positionCup(c){c.g.position.set(c.x,c.lift*2.4+(c.jit?Math.sin(performance.now()/22)*.05*c.jit:0),c.z);c.blob.position.set(c.x,.07,c.z);c.blob.scale.setScalar(.95-c.lift*.12)}
/* ===== round flow ===== */
function say(s){$("cap").textContent=s||""}
function hud(){$("pHe").textContent=t("hearts").repeat(hearts)+"🤍".repeat(Math.max(0,3-hearts));$("pSc").textContent=t("score")+" "+score;$("pLv").textContent=t("lvl")+" "+level}
function startGame(){ac();over=false;level=1;hearts=3;score=0;streak=0;document.body.classList.add("play");$("menu").classList.remove("show");$("over").classList.remove("show");startRound();hud()}
function startRound(){const c=cfg();if(cups.length!==c.n)buildCups(c.n);else{layout(c.n);cupAt=cups.map((_,i)=>i);cups.forEach((q,i)=>{q.slot=i;q.x=X[i];q.z=0;q.lift=0;q.tl=0;q.jit=0;positionCup(q)})}
 cups.forEach((q,i)=>{const col=c.same?0xe23b6a:CCOL[i%5];q.g.children[0].material=M(col)});
 ballCup=Math.random()*c.n|0;ph="intro";pt=0;sel=0;steps=[];swapLog=[];rv=null;$("picks").classList.remove("show");say(t("watch"));hud();
 // build the swap plan (slot pairs, simultaneous pairs in one step)
 const n=c.n;let made=0;
 while(made<c.swaps){const a=Math.random()*n|0;let b=Math.random()*n|0;if(a===b)continue;
  if(c.decoy&&Math.random()<.25&&made+2<=c.swaps){steps.push({p:[[a,b]],d:c.dur*.7});steps.push({p:[[a,b]],d:c.dur*.7});made+=2;continue}
  if(c.dbl&&n>=4&&Math.random()<.3){const rest=[...Array(n).keys()].filter(k=>k!==a&&k!==b);const x=rest[Math.random()*rest.length|0],y=rest.filter(k=>k!==x)[Math.random()*(rest.length-1)|0];steps.push({p:[[a,b],[x,y]],d:c.dur*1.1});made+=2;continue}
  steps.push({p:[[a,b]],d:c.dur});made++}}
const sm=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
function updateGame(dt){
 idleT+=dt;
 // cups lift easing
 cups.forEach(c=>{const d=c.tl-c.lift;c.lift+=Math.max(-dt*4.5,Math.min(dt*4.5,d))});
 if(ph==="intro"){pt+=dt;const bc=cups[ballCup];
  if(pt<.4)bc.tl=0;else if(pt<1.9){if(bc.tl===0&&pt>=.4){bc.tl=1;SFX.lift()}}else if(pt<2.5){if(bc.tl===1){bc.tl=0;SFX.lower()}}
  else{ph="shuffle";stepI=0;stepT=0;gapT=.25;say(t("shuf"))}}
 else if(ph==="shuffle"){
  if(gapT>0){gapT-=dt}else{const s=steps[stepI];if(!s){ph="choose";pt=0;say(t("pick"));$("picks").classList.add("show");sel=0}else{
    if(stepT===0){s.p.forEach(([a,b],k)=>{swapLog.push([a,b]);SFX.swap(k+stepI%5)})}
    stepT+=dt;const u=Math.min(1,stepT/s.d),e=sm(u);
    cups.forEach(c=>{c.z=0;c.x=X[c.slot]});
    s.p.forEach(([a,b])=>{const ca=cupAt[a],cb=cupAt[b];const A=cups[ca],B=cups[cb];A.x=X[a]+(X[b]-X[a])*e;B.x=X[b]+(X[a]-X[b])*e;const arc=1.25*Math.sin(Math.PI*e);A.z=arc;B.z=-arc});
    if(u>=1){s.p.forEach(([a,b])=>{const ca=cupAt[a],cb=cupAt[b];cupAt[a]=cb;cupAt[b]=ca;cups[ca].slot=b;cups[cb].slot=a});cups.forEach(c=>{c.x=X[c.slot];c.z=0});stepI++;stepT=0;gapT=.06}}}}
 else if(ph==="reveal"){rv.t+=dt;const c=cups[rv.cup],bc=cups[ballCup];
  if(rv.t<1.0){c.jit=1}else{c.jit=0;if(c.tl===0){c.tl=1;SFX.lift();if(rv.ok){SFX.yes();confetti();mood=2.6;moodK="yes"}}}
  if(!rv.ok){if(rv.t>2.0&&bc.tl===0){bc.tl=1;SFX.lift();SFX.no();mood=2.2;moodK="no"}}
  const end=rv.ok?3.2:4.2;if(rv.t>end){endRound()}}
 else if(ph==="result"){resultT-=dt;if(resultT<=0){if(hearts<=0)gameOver();else startRound()}}
 // ball follows its cup
 const bc=cups[ballCup];const vis=!!bc&&(ph==="intro"||ph==="reveal")&&bc.lift>.55;ball.visible=vis;blobB.visible=vis;if(bc){ball.position.set(bc.x,.52+Math.abs(Math.sin(idleT*6))*(ph==="reveal"&&rv&&rv.ok?.25:0),bc.z);blobB.position.set(bc.x,.06,bc.z)}
 // selection highlight (hover / keyboard)
 cups.forEach(c=>{const hi=ph==="choose"&&cupAt[sel]===c.id;c.g.scale.setScalar(hi?1.07:1)});
 cups.forEach(positionCup);
}
function pickCupId(id){if(ph!=="choose")return;const ok=id===ballCup;ph="reveal";rv={cup:id,ok,t:0};$("picks").classList.remove("show");say("");SFX.drum();wasCorrect=ok;
 setTimeout(()=>{},0)}
function endRound(){const ok=rv.ok;say(pick(ok?t("yes"):t("no")));
 if(ok){streak++;score+=10+level*2+Math.min(streak,6)*2;level++;if(score>best){best=score;ls.set("annabelle-cups-best",String(best))}}else{streak=0;hearts--}hud();ph="result";resultT=1.6}
function gameOver(){over=true;ph="over";say("");$("picks").classList.remove("show");SFX.over();
 const nb=score>best-0&&score>0&&score>=best;$("oT").textContent=t("oT");$("oS").textContent=t("oS").replace("{l}",level).replace("{s}",score);$("oB").textContent=nb&&score>0?t("best"):t("bestIs").replace("{b}",best);$("over").classList.add("show")}
function toMenu(){paused=false;ph="menu";over=false;$("pause").classList.remove("show");$("over").classList.remove("show");$("picks").classList.remove("show");document.body.classList.remove("play");$("menu").classList.add("show");say("");ball.visible=false;blobB.visible=false;if(cups.length!==3)buildCups(3);else{layout(3);cupAt=[0,1,2];cups.forEach((c,i)=>{c.slot=i;c.x=X[i];c.z=0;c.lift=0;c.tl=0;c.jit=0})}drawTexts()}
window.toMenu=toMenu;
function doPause(on){if(ph==="menu"||ph==="over")return;paused=on;$("pause").classList.toggle("show",on)}
/* ============ confetti (2D overlay) ============ */
const cf=$("conf"),cx=cf.getContext("2d");let P=[],cfRun=false;
function confetti(){const w=cf.width=innerWidth,h=cf.height=innerHeight;P=[];const cols=["#ff5d73","#ffd23f","#5fd38d","#4aa8ff","#b07cff","#ff9f43"];for(let i=0;i<140;i++)P.push({x:w/2+(Math.random()-.5)*w*.3,y:h*.45,vx:(Math.random()-.5)*14,vy:-6-Math.random()*10,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%6]});if(!cfRun){cfRun=true;requestAnimationFrame(cfStep)}}
function cfStep(){cx.clearRect(0,0,cf.width,cf.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});P=P.filter(p=>p.y<cf.height+20);if(P.length)requestAnimationFrame(cfStep);else{cfRun=false;cx.clearRect(0,0,cf.width,cf.height)}}
/* ============ camera / mascot / render ============ */
let camD=14,vw=1,vh=1,lookY=3.3;
function resize(){vw=innerWidth;vh=innerHeight;if(glOK)R.setSize(vw,vh,false);cam.aspect=vw/vh;cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
function frameCam(dt){const n=cups.length||3,spread=(n-1)*(n===3?2.2:n===4?1.95:1.7)+3.4,tn=Math.tan(cam.fov*Math.PI/360)*cam.aspect;const want=Math.max(15,spread/2/tn*1.05);camD+=(want-camD)*Math.min(1,dt*3);
 cam.position.set(0,camD*.46,camD*.89);const ly=ph==="menu"?4.6:3.0;lookY+=(ly-lookY)*Math.min(1,dt*3);cam.lookAt(0,lookY,-1.2)}
function animMascot(dt){const tt=idleT;mas.position.y=MY+Math.abs(Math.sin(tt*2))*.04;head.rotation.z=Math.sin(tt*1.6)*.06;armL.rotation.z=.15+Math.sin(tt*1.7)*.05;armR.rotation.z=-.15;armR.rotation.x=Math.sin(tt*3)*.15;
 if(mood>0){mood-=dt;if(moodK==="yes"){mas.position.y=MY+Math.abs(Math.sin(tt*14))*.9;armL.rotation.z=2.4+Math.sin(tt*18)*.3;armR.rotation.z=-2.4-Math.sin(tt*18)*.3;head.rotation.z=Math.sin(tt*10)*.15}
  else{head.rotation.z=.3;armL.rotation.z=2.2;armL.rotation.x=0;head.rotation.x=.12}}else{head.rotation.x=0}
 if(ph==="shuffle"){armR.rotation.z=-.5+Math.sin(tt*9)*.6;armL.rotation.z=.5-Math.sin(tt*9)*.6}}
let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);if(document.hidden){last=now;return}const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)tick(dt);if(glOK)R.render(scene,cam)}
function tick(dt){updateGame(dt);animMascot(dt);frameCam(dt)
 if(ph==="menu"){const q=cups;q.forEach((c,i)=>{c.x=X[c.slot]+Math.sin(idleT*1.1+i)*.15;c.z=Math.cos(idleT*1.3+i)*.2;c.tl=Math.sin(idleT*1.8+i*2)>.85?.5:0})}}
if(glOK)requestAnimationFrame(frame);
/* ============ UI ============ */
function drawTexts(){document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";document.title=t("title");$("mT").textContent=t("title");$("mS").textContent=t("sub");$("playBtn").textContent=t("play");$("mEasy").textContent=t("easy");$("mNorm").textContent=t("norm");
 $("mEasy").classList.toggle("sel",mode==="easy");$("mNorm").classList.toggle("sel",mode==="norm");$("mEasy").classList.toggle("off",mode!=="easy");$("mNorm").classList.toggle("off",mode!=="norm");
 $("rules").textContent=t("rules");$("mBest").textContent=best?t("bestIs").replace("{b}",best):"";$("againBtn").textContent=t("again");$("oMenu").textContent=t("menu");$("pT").textContent=t("paused");$("resBtn").textContent=t("resume");$("pMenu").textContent=t("menu");
 $("flags").innerHTML=LANGS.map(([k,n])=>`<button class="lang ${k===lang?"sel":""}" data-lang="${k}">${n}</button>`).join("");hud();buildPicks(cups.length||3)}
function updMute(){$("muteBtn").textContent=muted?"🔇":"🔊"}
$("muteBtn").onclick=()=>{muted=!muted;ls.set("annabelle-muted",muted?"1":"0");updMute();if(!muted)SFX.click()};
document.addEventListener("click",e=>{const L=e.target.closest&&e.target.closest("[data-lang]");if(L){lang=L.dataset.lang;ls.set("annabelle-lang",lang);SFX.click();drawTexts()}});
$("mEasy").onclick=()=>{mode="easy";ls.set("annabelle-cups-mode","easy");SFX.click();drawTexts()};$("mNorm").onclick=()=>{mode="norm";ls.set("annabelle-cups-mode","norm");SFX.click();drawTexts()};
$("playBtn").onclick=()=>{SFX.click();startGame()};$("againBtn").onclick=()=>{SFX.click();startGame()};
$("oMenu").onclick=()=>{SFX.click();toMenu()};$("pMenu").onclick=()=>{SFX.click();toMenu()};$("homeBtn").onclick=()=>{SFX.click();toMenu()};
$("pauseBtn").onclick=()=>{SFX.click();doPause(true)};$("resBtn").onclick=()=>{SFX.click();doPause(false)};
$("picks").addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b)return;e.preventDefault();ac();pickSlot(+b.dataset.slot)});
function pickSlot(s){if(ph!=="choose"||s<0||s>=cups.length)return;sel=s;SFX.click();pickCupId(cupAt[s])}
/* tap/click a cup in 3D */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
cvEl.addEventListener("pointerdown",e=>{ac();if(ph!=="choose"||paused)return;ptr.set(e.clientX/vw*2-1,-(e.clientY/vh)*2+1);ray.setFromCamera(ptr,cam);const hit=ray.intersectObjects(cups.map(c=>c.g),true)[0];if(hit){let o=hit.object;while(o&&!cups.some(c=>c.g===o))o=o.parent;const c=cups.find(c=>c.g===o);if(c){e.preventDefault();SFX.click();pickCupId(c.id)}}});
cvEl.addEventListener("pointermove",e=>{if(ph!=="choose"||paused)return;ptr.set(e.clientX/vw*2-1,-(e.clientY/vh)*2+1);ray.setFromCamera(ptr,cam);const hit=ray.intersectObjects(cups.map(c=>c.g),true)[0];if(hit){let o=hit.object;while(o&&!cups.some(c=>c.g===o))o=o.parent;const c=cups.find(c=>c.g===o);if(c)sel=c.slot}});
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||(window.AnnabelleDesk&&AnnabelleDesk.typing(e)))return;
 if(e.code==="KeyM"){muted=!muted;ls.set("annabelle-muted",muted?"1":"0");updMute();return}
 if(e.code==="Escape"||e.code==="KeyP"){e.preventDefault();if(ph==="menu")return;if(ph==="over"){toMenu();return}doPause(!paused);return}
 const btn=e.target&&e.target.closest&&e.target.closest("button");
 if(ph==="menu"){if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();startGame()}return}
 if(ph==="over"){if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();startGame()}return}
 if(ph==="choose"&&!paused){const n=cups.length;
  if(/^[1-5]$/.test(e.key)&&+e.key<=n){e.preventDefault();pickSlot(+e.key-1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();sel=(sel+n-1)%n;SFX.tick()}else if(e.key==="ArrowRight"){e.preventDefault();sel=(sel+1)%n;SFX.tick()}
  else if((e.key==="Enter"||e.key===" ")&&!btn){e.preventDefault();pickSlot(sel)}}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&ph!=="menu"&&ph!=="over"&&!paused)doPause(true)});
/* ============ test hooks ============ */
window.__cups={step(sec){const n=Math.ceil(sec*30);for(let i=0;i<n;i++)tick(1/30);if(glOK)R.render(scene,cam)},
 start(m){if(m)mode=m;startGame()},
 info(){return{ph,level,hearts,score,streak,n:cups.length,ballCup,cupAt:[...cupAt],swapLog:swapLog.map(p=>[...p]),slotX:[...X],cupX:cups.map(c=>c.x),cupLift:cups.map(c=>c.lift),ballX:ball.position.x,ballVisible:ball.visible,rv:rv&&{...rv},steps:steps.length,over,mode,caption:$("cap").textContent}},
 pickSlot,pickCup:pickCupId,setMode(m){mode=m},setLevel(l){level=l},toMenu};
updMute();drawTexts();buildCups(3);toMenu();
</script>
