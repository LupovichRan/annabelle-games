function olLeft(){if(!OLN.on)return;ph="over";over=true;$("picks").classList.remove("show");$("obar").classList.remove("show");$("oT").textContent=NT.t("left");$("oS").textContent="👋";$("oB").textContent="";$("oG").textContent="";$("oStars").innerHTML="";$("againBtn").style.display="none";$("pause").classList.remove("show");$("over").classList.add("show")}
function olApplySwaps(list){ // rebuild the arrangement from the hider's full swap list (after a connection loss)
 const n=cups.length;cupAt=cups.map((_,i)=>i);for(const [a,b] of list){const x=cupAt[a];cupAt[a]=cupAt[b];cupAt[b]=x}cups.forEach(c=>{c.z=0});cupAt.forEach((id,sl)=>{cups[id].slot=sl;cups[id].x=X[sl]});steps=[];stepI=0;stepT=0;gapT=0;OLN.swl=list.map(p=>p.slice());OLN.sw=list.length}
function olResync(){if(!OLN.on)return;
 if(NT.host)NT.send({t:"sy",r:OLN.round,a:OLN.scores[0],b:OLN.scores[1]});
 if(OLN.imHider&&OLN.round>0){NT.send({t:"sl",l:OLN.swl,h:OLN.hid?1:0,d:OLN.done?1:0});if(OLN.lastRv&&(ph==="reveal"||ph==="result"))NT.send({t:"rv",c:OLN.lastRv.c,b:OLN.lastRv.b})}
 if(!OLN.imHider&&ph==="owaitrv"&&OLN.myPick>=0)NT.send({t:"pk",c:OLN.myPick})}
function olData(d){const ty=d.t,n=cups.length;
 if(ty==="hd"&&!OLN.imHider){if(ph==="owait"){OLN.hid=true;if(int(d.c,0,cups.length-1)){ballCup=d.c;ph="ohid";pt=0}else{ph="shuffle";stepI=0;stepT=0;gapT=.2}olUi()}}
 else if(ty==="sw"&&!OLN.imHider){if(ph==="shuffle"&&!OLN.done&&int(d.a,0,n-1)&&int(d.b,0,n-1)&&d.a!==d.b&&OLN.sw<MAXSW){steps.push({p:[[d.a,d.b]],d:Math.max(.3,.55-OLN.round*.03)});OLN.sw++;OLN.swl.push([d.a,d.b])}}
 else if(ty==="dn"&&!OLN.imHider){if(ph==="shuffle"&&OLN.sw>=1)OLN.done=true}
 else if(ty==="pk"&&OLN.imHider){if(ph==="choose"&&int(d.c,0,n-1)){NT.send({t:"rv",c:d.c,b:ballCup});olReveal(d.c,ballCup)}}
 else if(ty==="rv"&&!OLN.imHider){if(ph==="owaitrv"&&int(d.c,0,n-1)&&d.c===OLN.myPick&&int(d.b,0,n-1))olReveal(d.c,d.b)}
 else if(ty==="rd"&&!NT.host){if(int(d.r,2,OLN.ROUNDS)&&d.r===OLN.round+1&&(ph==="result"||ph==="reveal")){hud();olRound(d.r)}}
 else if(ty==="fin"&&!NT.host){if(OLN.round===OLN.ROUNDS&&(ph==="result"||ph==="reveal"))olFinish()}
 else if(ty==="sy"&&!NT.host){if(int(d.r,1,OLN.ROUNDS)&&int(d.a,0,OLN.ROUNDS)&&int(d.b,0,OLN.ROUNDS)&&d.r===OLN.round+1&&(ph==="result"||ph==="reveal")&&d.a+d.b<=d.r-1+0&&d.a+d.b===d.r-1){OLN.scores=[d.a,d.b];hud();olRound(d.r)}}
 else if(ty==="sl"&&!OLN.imHider){if(Array.isArray(d.l)&&d.l.length<=MAXSW&&d.l.every(p=>Array.isArray(p)&&p.length===2&&int(p[0],0,n-1)&&int(p[1],0,n-1)&&p[0]!==p[1])&&(d.h===0||d.h===1)&&(d.d===0||d.d===1)&&(ph==="owait"||ph==="shuffle"||ph==="choose")){
   if(d.h===1&&ph==="owait"){ph="shuffle";OLN.hid=true}
   if(d.l.length!==OLN.swl.length&&ph!=="choose"&&(steps.length-stepI<=0)){olApplySwaps(d.l)}
   if(d.d===1&&ph==="shuffle"&&OLN.sw>=1)OLN.done=true;olUi()}}}

 pickSlot,pickCup:pickCupId,setMode(m){mode=m},setLevel(l){level=l},toMenu};
