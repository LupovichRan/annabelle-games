<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><!--pt--><script src="playtime.js" data-app="runner"></script><!--/pt-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e2629a">
<title>המרוץ בסוואנה של אנאבל</title>
<style>
  :root{ --bg1:#ffe9a8; --bg2:#ffc7d9; --ink:#4a2c6b; --accent:#ff7a3d; --accent2:#7c5cff; --ok:#34c47c; --bad:#ff4d6d; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;}
  body{font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;color:var(--ink);
    background:#ffb36b;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation;}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .iconbtn{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #0002;font-size:23px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .1s;padding:0}
  .iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0002;}
  .corner{position:fixed;top:max(10px,env(safe-area-inset-top));inset-inline-end:12px;z-index:60;}
  .hidden{display:none !important}
  .ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:min(1.8vh,14px);
      padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));z-index:30;text-align:center;overflow-y:auto;touch-action:pan-y}
  .ov.show{display:flex}
  .menu{background:#fff7;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .dim{background:#fff5;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .title{padding:0 44px;font-size:clamp(30px,8vw,58px);font-weight:900;margin:0;color:#fff;text-shadow:0 4px 0 var(--accent),0 8px 0 #0002;line-height:1.1}
  .langs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .lang{padding:9px 16px;border-radius:999px;background:#fff8;font-size:19px;font-weight:700;box-shadow:0 3px 0 #0001;}
  .lang.sel{background:#fff;box-shadow:0 0 0 4px var(--accent2),0 4px 0 #0002;}
  .how{font-size:clamp(14px,3.8vw,19px);font-weight:700;max-width:560px;background:#fff9;border-radius:20px;padding:8px 16px;line-height:1.35}
  .ctrl{font-size:clamp(13px,3.5vw,17px);font-weight:700;max-width:560px;background:#fff6;border-radius:16px;padding:6px 14px;line-height:1.35}
  .label{font-size:clamp(16px,4.2vw,21px);font-weight:800;opacity:.85}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .big{font-size:clamp(21px,5.4vw,30px);font-weight:900;padding:13px 30px;border-radius:999px;color:#fff;box-shadow:0 6px 0 #0003;display:inline-flex;gap:10px;align-items:center;justify-content:center}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
  .go{background:linear-gradient(#5fd38d,#2fb36a)} .home{background:linear-gradient(#a58bff,#7c5cff)} .orange{background:linear-gradient(#ffb84d,#ff8a1f)}
  .chars{display:flex;gap:10px;justify-content:center}
  .ch{background:#fff9;border-radius:22px;padding:6px 6px 8px;width:clamp(96px,28vw,136px);display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #0001;font-weight:800;font-size:clamp(13px,3.6vw,17px);line-height:1.15}
  .ch svg{width:74%;height:auto}
  .ch.sel{background:#fff;box-shadow:0 0 0 4px var(--accent),0 5px 0 #0002;animation:wig 1.4s ease-in-out infinite}
  .ch.locked{filter:grayscale(.9);opacity:.6}
  .ch small{font-size:.8em;opacity:.85;font-weight:700}
  @keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .foes{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:560px}
  .foe{display:flex;flex-direction:column;align-items:center;font-size:clamp(11px,3vw,14px);font-weight:800;width:clamp(56px,15.5vw,86px);line-height:1.1}
  .foe canvas{width:clamp(46px,12vw,64px);height:clamp(46px,12vw,64px);animation:bob 2s ease-in-out infinite}
  .foe:nth-child(2n) canvas{animation-delay:.3s}.foe:nth-child(3n) canvas{animation-delay:.6s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
  .bestline{font-weight:900;font-size:clamp(17px,4.5vw,22px);color:#e8487f}

  #hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:max(6px,env(safe-area-inset-top)) 6px 6px;display:flex;align-items:center;gap:5px;
       background:linear-gradient(#ffffffa0,#ffffff50);border-bottom:3px solid #ffffffaa;box-shadow:0 4px 12px #0001}
  .pill{background:#fff;border-radius:999px;padding:4px 9px;font-size:clamp(15px,4.2vw,21px);font-weight:800;box-shadow:0 3px 0 #0002;white-space:nowrap;display:flex;align-items:center;gap:3px;height:42px}
  .pill b{color:var(--accent);font-size:1.1em}
  .grow{flex:1 0 auto;justify-content:center}
  #hud .iconbtn{width:42px;height:42px}
  .hearts svg{width:24px;height:24px;transition:transform .3s}
  .hearts svg.lost{opacity:.22;transform:scale(.8)}
  .pausebtn{font-size:0}
  .pausebtn::before,.pausebtn::after{content:"";width:6px;height:18px;border-radius:3px;background:var(--ink);margin:0 3px}
  #toast{position:fixed;left:50%;z-index:20;pointer-events:none;background:#fff;border-radius:22px;padding:6px 18px;font-size:clamp(18px,5vw,28px);font-weight:900;top:70px;
         box-shadow:0 0 0 4px var(--accent),0 6px 0 #0002;transform:translate(-50%,0) scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{transform:translate(-50%,0) scale(1)}
  .card{background:#fffffff2;border-radius:30px;padding:18px 20px;box-shadow:0 8px 0 #0002,0 0 0 5px #ffd36b;max-width:min(94vw,560px);display:flex;flex-direction:column;align-items:center;gap:10px}
  .card h2{margin:0;font-size:clamp(26px,7vw,44px);color:var(--accent);font-weight:900;line-height:1.15}
  .card h2.winT{color:var(--accent2);font-size:clamp(32px,9vw,58px);text-shadow:0 3px 0 #ffd36b,0 6px 0 #0001}
  .sub{font-size:clamp(18px,4.8vw,25px);font-weight:800}
  .rec{font-size:clamp(20px,5.5vw,30px);font-weight:900;color:#e8487f;animation:pulse .6s infinite alternate}
  .unl{font-size:clamp(17px,4.6vw,24px);font-weight:900;color:#2fb36a}
  @keyframes pulse{to{transform:scale(1.08)}}
  .tired svg{width:clamp(90px,26vw,140px);height:auto;animation:snooze 1.6s ease-in-out infinite}
  @keyframes snooze{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(4px)}}
  .jumpers svg{width:clamp(90px,26vw,140px);height:auto;animation:jump .6s ease-in-out infinite alternate}
  @keyframes jump{0%{transform:translateY(0) scale(1.1,.9)}100%{transform:translateY(-36px) scale(.95,1.05) rotate(8deg)}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
</style>
<!--pwa--><link rel="manifest" href="manifests/runner.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icons/runner-192.png"><meta name="apple-mobile-web-app-title" content="מרוץ סוואנה"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/runner-apple-180.png"><script src="pwa.js" data-app="runner" data-slots='[["#langs", "append"], ["#pause .card", "append"]]' defer></script><!--/pwa-->
</head>
<body>
<canvas id="cv"></canvas>
<button class="iconbtn corner" id="muteBtn" aria-label="sound">🔊</button>

<div id="hud" class="hidden">
  <button class="iconbtn pausebtn" id="pauseBtn" aria-label="pause"></button>
  <div class="pill"><span>🏁</span><b id="dist" dir="ltr">0</b><span id="tM"></span></div>
  <div class="pill grow">⭐<b id="score" dir="ltr">0</b></div>
  <div class="pill hearts" id="hearts"></div>
  <button class="iconbtn" id="muteBtn2" aria-label="sound">🔊</button>
</div>
<div id="toast"></div>

<section class="ov show menu" id="menu">
  <h1 class="title" id="tTitle"></h1>
  <div class="langs" id="langs"></div>
  <div class="label" id="tChoose"></div>
  <div class="chars" id="chars"></div>
  <button class="big go" id="playBtn"></button>
  <div class="bestline" id="bestLine"></div>
  <div class="how" id="tHow"></div>
  <div class="ctrl" id="tCtrl"></div>
  <div class="label" id="tWatch"></div>
  <div class="foes" id="foes"></div>
</section>

<section class="ov dim" id="pause">
  <div class="card">
    <h2 id="pauseTitle"></h2>
    <button class="big go" id="resumeBtn"></button>
    <div class="row"><button class="big orange" id="restartBtn"></button><button class="big home" id="pMenuBtn"></button></div>
  </div>
</section>

<section class="ov dim" id="over">
  <div class="card">
    <div class="tired" id="overHero"></div>
    <h2 id="overTitle"></h2>
    <div class="sub" id="overSub"></div>
    <div class="rec" id="overRec"></div>
    <div class="unl" id="overUnlock"></div>
    <div class="row"><button class="big go" id="againBtn"></button><button class="big home" id="oMenuBtn"></button></div>
  </div>
</section>
<canvas id="confetti"></canvas>

<script>
"use strict";
const ANIMALS = {
  cat:     {fur:"#a9a9b8",dark:"#6d6d80",muzzle:"#ecebf2",eye:"#8fd16b",nose:"#f29bb0",inner:"#f7b9c8",ears:"point",pattern:"tabby",bg:"#d9f2ff",voice:"meow",
            name:{he:"חתול",fr:"chat",en:"cat"},
            fact:{he:"חתולים ישנים בערך 12 עד 16 שעות ביום!",fr:"Les chats dorment environ 12 à 16 heures par jour !",en:"Cats sleep about 12 to 16 hours a day!"}},
  kitten:  {fur:"#ffb35c",dark:"#e8862d",muzzle:"#fff3e3",eye:"#6bb8ff",nose:"#ff8fab",inner:"#ffc2d1",ears:"point",pattern:"tabby",kitten:true,bg:"#ffe3f0",voice:"kitten",
            name:{he:"חתלתול",fr:"chaton",en:"kitten"},
            fact:{he:"גורי חתולים נולדים עם עיניים סגורות, והן נפתחות אחרי שבוע או שבועיים.",fr:"Les chatons naissent les yeux fermés : ils les ouvrent après une ou deux semaines.",en:"Kittens are born with their eyes closed. They open after about 1 to 2 weeks."}},
  lion:    {fur:"#f2b84b",dark:"#c98a2b",muzzle:"#fbe7bf",eye:"#c98a2b",nose:"#a8574a",inner:"#e0a050",ears:"round",pattern:"none",mane:"#b4612a",bg:"#fff1c2",voice:"roar",
            name:{he:"אריה",fr:"lion",en:"lion"},
            fact:{he:"את שאגת האריה אפשר לשמוע ממרחק של עד 8 קילומטרים!",fr:"Le rugissement du lion s'entend jusqu'à 8 kilomètres !",en:"A lion's roar can be heard up to 8 kilometres away!"}},
  lioness: {fur:"#e9b866",dark:"#c08a3a",muzzle:"#fbedcf",eye:"#d29a3a",nose:"#b0665a",inner:"#d9a05a",ears:"round",pattern:"none",bg:"#ffe7c7",voice:"roar2",
            name:{he:"לביאה",fr:"lionne",en:"lioness"},
            fact:{he:"הלביאות עושות את רוב הציד של הלהקה, ולעיתים קרובות הן צדות יחד כצוות.",fr:"Les lionnes font la plupart de la chasse, souvent en équipe.",en:"Lionesses do most of the hunting for the pride, often working as a team."}},
  tiger:   {fur:"#ff8c2b",dark:"#2b1d14",muzzle:"#fff6ea",eye:"#f2c230",nose:"#e07a7a",inner:"#fff",ears:"round",pattern:"stripes",bg:"#e3ffd9",voice:"roar",
            name:{he:"טיגריס",fr:"tigre",en:"tiger"},
            fact:{he:"הטיגריס הוא החתול הגדול ביותר בעולם, ואין שני טיגריסים עם אותם פסים!",fr:"Le tigre est le plus grand des félins, et deux tigres n'ont jamais les mêmes rayures !",en:"Tigers are the biggest cats in the world, and no two tigers have the same stripes!"}},
  leopard: {fur:"#f3c45e",dark:"#3a2a16",muzzle:"#fff5df",eye:"#9fcf5a",nose:"#d88a7a",inner:"#fff2d0",ears:"round",pattern:"rosettes",bg:"#fff6c9",voice:"growl",
            name:{he:"נמר",fr:"léopard",en:"leopard"},
            fact:{he:"נמרים מטפסים מצוין על עצים, ואפילו גוררים את הטרף שלהם למעלה אל הענפים.",fr:"Le léopard grimpe très bien aux arbres et y hisse même ses proies.",en:"Leopards are great climbers and even drag their prey up into the trees."}},
  cheetah: {fur:"#f1cf7a",dark:"#2a2116",muzzle:"#fff8e6",eye:"#d9a832",nose:"#2a2116",inner:"#fff3cf",ears:"round",pattern:"spots",tears:true,bg:"#ffe9d1",voice:"chirp",
            name:{he:"ברדלס",fr:"guépard",en:"cheetah"},
            fact:{he:"הברדלס הוא החיה המהירה ביותר ביבשה – הוא יכול לרוץ בערך 100 קמ״ש!",fr:"Le guépard est l'animal terrestre le plus rapide : il peut courir à environ 100 km/h !",en:"The cheetah is the fastest land animal – it can sprint at about 100 km/h!"}},
  jaguar:  {fur:"#e8a948",dark:"#2c1d10",muzzle:"#fff1d8",eye:"#e6c24a",nose:"#c46e5e",inner:"#ffe6b8",ears:"round",pattern:"jrosettes",bg:"#d6f5ef",voice:"roar2",
            name:{he:"יגואר",fr:"jaguar",en:"jaguar"},
            fact:{he:"יגוארים אוהבים מים, והם שחיינים מצוינים!",fr:"Le jaguar adore l'eau : c'est un excellent nageur !",en:"Jaguars love water and are excellent swimmers!"}},
  lynx:    {fur:"#c9a27a",dark:"#7a5a3c",muzzle:"#f6ece0",eye:"#d6b04a",nose:"#c07a6a",inner:"#f1dcc4",ears:"point",tufts:true,ruff:true,pattern:"freckles",bg:"#e8e1ff",voice:"lynx",
            name:{he:"שונר",fr:"lynx",en:"lynx"},
            fact:{he:"לשונר יש ציציות שחורות בקצות האוזניים, וכפות רגליים גדולות ופרוותיות שעוזרות לו ללכת על שלג.",fr:"Le lynx a des pinceaux de poils noirs au bout des oreilles et de grosses pattes poilues pour marcher sur la neige.",en:"Lynxes have black tufts on their ear tips and big furry paws that work like snowshoes."}},
  panther: {fur:"#2e2e3a",dark:"#1c1c25",muzzle:"#3b3b4a",eye:"#c6e84a",nose:"#15151c",inner:"#4a4a5c",ears:"round",pattern:"rosettes",whisker:"#e6e6f0",bg:"#ffd9e4",voice:"growl",
            name:{he:"פנתר שחור",fr:"panthère noire",en:"black panther"},
            fact:{he:"פנתר שחור הוא בדרך כלל נמר או יגואר עם פרווה כהה – במבט מקרוב אפשר לראות שיש לו כתמים!",fr:"Une panthère noire est en général un léopard ou un jaguar au pelage sombre : de près, on voit encore ses taches !",en:"A black panther is usually a leopard or jaguar with dark fur – up close you can still see its spots!"}},
  snowleopard:{fur:"#dfe3e6",dark:"#4d555c",muzzle:"#f7f8f9",eye:"#9fd0c4",nose:"#c99a9a",inner:"#f3e1e1",ears:"round",pattern:"rosettes",bg:"#dcecff",voice:"purr",
            name:{he:"נמר השלג",fr:"panthère des neiges",en:"snow leopard"},
            fact:{he:"נמר השלג מתעטף בזנב הארוך והפרוותי שלו כמו בצעיף כדי להתחמם.",fr:"La panthère des neiges s'enroule dans sa longue queue touffue comme dans une écharpe pour avoir chaud.",en:"Snow leopards wrap their long, fluffy tails around themselves like a scarf to keep warm."}},
  puma:    {fur:"#c99a66",dark:"#5a3e26",muzzle:"#fbf3ea",eye:"#d9b04a",nose:"#c47f73",inner:"#efd3b8",ears:"round",pattern:"puma",bg:"#f0ffd6",voice:"purr",
            name:{he:"פומה",fr:"puma",en:"puma (cougar)"},
            fact:{he:"לפומה יש הרבה שמות – קוגר ואריה הרים – והיא לא יכולה לשאוג, אבל היא מגרגרת כמו חתול!",fr:"Le puma a plusieurs noms (couguar, lion des montagnes). Il ne rugit pas, mais il ronronne comme un chat !",en:"The puma has many names – cougar, mountain lion – and it can't roar, but it purrs like a house cat!"}}
};
const KEYS = Object.keys(ANIMALS);

let uid = 0;
function face(key){
  const a = ANIMALS[key], id = "c"+(uid++);
  const d = a.dark, k = !!a.kitten;
  let s = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${key}">`;
  s += `<defs><clipPath id="${id}"><ellipse cx="50" cy="57" rx="34" ry="31"/></clipPath></defs>`;
  // mane
  if (a.mane){
    s += `<g fill="${a.mane}">`;
    for (let i=0;i<18;i++){const t=i/18*Math.PI*2; s+=`<circle cx="${(50+40*Math.cos(t)).toFixed(1)}" cy="${(55+38*Math.sin(t)).toFixed(1)}" r="10"/>`;}
    s += `<circle cx="50" cy="55" r="41"/></g><circle cx="50" cy="55" r="36" fill="#d4873a"/>`;
  }
  // ears
  const earL = a.ears==="point" ? "M17 46 L21 9 L46 30 Z" : "M19 44 Q12 14 42 27 Z";
  const inL  = a.ears==="point" ? "M23 38 L25 18 L38 30 Z" : "M24 38 Q21 22 37 29 Z";
  const mir = p => `<g transform="translate(100 0) scale(-1 1)">${p}</g>`;
  let ears = `<path d="${earL}" fill="${a.fur}" stroke="${d}" stroke-width="1.5" stroke-linejoin="round"/><path d="${inL}" fill="${a.inner}"/>`;
  if (a.tufts) ears += `<path d="M21 11 L19 0" stroke="#1d1d1d" stroke-width="3.5" stroke-linecap="round"/>`;
  if (key==="tiger"||key==="snowleopard"||key==="leopard"||key==="jaguar") ears += `<circle cx="27" cy="28" r="3" fill="#fff"/>`;
  s += ears + mir(ears);
  // lynx ruff
  if (a.ruff){ const r=`<path d="M18 58 L6 80 L16 76 L14 86 L30 78 Z" fill="${a.fur}" stroke="${d}" stroke-width="1"/>`; s += r + mir(r); }
  // head
  s += `<ellipse cx="50" cy="57" rx="34" ry="31" fill="${a.fur}"/>`;
  // pattern
  s += `<g clip-path="url(#${id})">${pattern(a)}</g>`;
  // muzzle
  s += `<ellipse cx="50" cy="78" rx="11" ry="7" fill="${a.muzzle}"/><ellipse cx="42" cy="71" rx="10.5" ry="8" fill="${a.muzzle}"/><ellipse cx="58" cy="71" rx="10.5" ry="8" fill="${a.muzzle}"/>`;
  if (a.pattern==="puma"){ s += `<ellipse cx="34" cy="71" rx="3" ry="5" fill="${d}" opacity=".7"/><ellipse cx="66" cy="71" rx="3" ry="5" fill="${d}" opacity=".7"/>`; }
  if (a.tears){ const t=`<path d="M37 60 Q35 68 40 75" stroke="${d}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`; s+=t+mir(t); }
  // eyes
  const er = k? [9,10] : [7,7.5];
  const eye = k
    ? `<ellipse cx="37" cy="53" rx="${er[0]}" ry="${er[1]}" fill="${a.eye}"/><circle cx="37" cy="54" r="5.5" fill="#1b1b1b"/><circle cx="34.5" cy="50.5" r="2.6" fill="#fff"/><circle cx="39" cy="57" r="1.2" fill="#fff"/>`
    : `<ellipse cx="37" cy="53" rx="${er[0]}" ry="${er[1]}" fill="${a.eye}" stroke="${key==="panther"?"#111":d}" stroke-width="1"/><ellipse cx="37" cy="53.5" rx="${a.ears==="point"?2.2:3.2}" ry="${a.ears==="point"?6:3.6}" fill="#1b1b1b"/><circle cx="35" cy="50.5" r="1.8" fill="#fff"/>`;
  s += eye + mir(eye);
  // nose & mouth
  s += `<path d="M44.5 64 Q50 62 55.5 64 L50 70 Z" fill="${a.nose}"/>`;
  s += `<path d="M50 70 L50 73 M50 73 Q46 77 42 74.5 M50 73 Q54 77 58 74.5" stroke="${key==="panther"?"#111":"#5a3a2a"}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  // whiskers
  const wc = a.whisker || "#6b5a50";
  const w = `<g stroke="${wc}" stroke-width="1.1" stroke-linecap="round" opacity=".8"><path d="M36 70 L10 65"/><path d="M36 73 L9 74"/><path d="M37 76 L12 82"/></g>`;
  s += w + mir(w);
  // kitten cheeks
  if (k) s += `<ellipse cx="27" cy="66" rx="5" ry="3" fill="#ff8fab" opacity=".55"/><ellipse cx="73" cy="66" rx="5" ry="3" fill="#ff8fab" opacity=".55"/>`;
  return s + `</svg>`;
}

function update(dt){

  slowF=Math.min(1,slowF+dt*.6);
  const target=SPD0+(SPDMAX-SPD0)*(1-Math.exp(-dist/1400));
  speed=target*slowF*(state==="fall"?Math.max(0,1-stateT*1.2):1);
  const dx=speed*dt; dist+=dx; bgOff+=dx;
  // player
  pl.ph+=dx*2.1; pl.roar=Math.max(0,pl.roar-dt); pl.inv=Math.max(0,pl.inv-dt); pl.magnet=Math.max(0,pl.magnet-dt); if(pl.shield>0) pl.shield=Math.max(0,pl.shield-dt);
  pl.flip=Math.max(0,pl.flip-dt*2.4); if(pl.tumble>0) pl.tumble=Math.max(0,pl.tumble-dt);
  pl.blink-=dt; if(pl.blink<-3) pl.blink=.15;
  if(!pl.onGround){ pl.vy-=G*dt; pl.y+=pl.vy*dt; if(pl.y<=0){ pl.y=0; pl.vy=0; pl.onGround=true; pl.jumps=0; if(state==="play") SFX.land(); dust(PX,0,4); if(pl.slideQ){ pl.slideQ=false; if(state==="play"&&pl.tumble<=0){ pl.slideT=0; slide(); } } } }

  // input pending tap
  if(ptr&&!ptr.done&&performance.now()-ptr.t>90){ ptr.done=true; ptr.jumped=true; jump(); }
  // spawn & move
  if(state==="play"){ nextSpawn-=dx; if(nextSpawn<=0) spawnPattern(); }
  const pcx=PX, pcy=pl.y+(sliding()?.22:.45);

      if(!o.passed&&o.x+o.w<PX-.35){ o.passed=true; if(!o.hit){ streak++; if(o.k==="croc"){ addFloat(o.x+o.w*.6,1.1,T[lang].zzz,"#2f7d32",1); SFX.snore(); } if(streak%8===0) toast(pick(T[lang].cheer),"#7c5cff"); } }
    }

  objs=objs.filter(o=>o.x>-4&&!o.got);
  parts.forEach(p=>{ p.life-=dt; p.x+=p.vx*dt-(p.fixed?0:dx*.3); p.y+=p.vy*dt; if(p.gr) p.vy-=G*p.gr*dt*.4; }); parts=parts.filter(p=>p.life>0);
  floats.forEach(f=>{ f.life-=dt; f.y+=dt*.9; f.x-=dx*.2; }); floats=floats.filter(f=>f.life>0);
  shakeT=Math.max(0,shakeT-dt);

  if(state==="fall"&&stateT>1.7) gameOver();
  updateHUDnum();
}

/* ============ RENDER ============ */
const sx=x=>x*U, sy=y=>GY-y*U;

function render(){

  for(const o of objs){ g.save(); if(o.col){ g.translate(sx(o.x),sy(o.y)); drawItem(o,U); } else { g.translate(sx(o.x),GY); if(o.k==="croc") o.peek=Math.abs(o.x+o.w/2-PX)<1.4&&pl.y>.4; drawObs(o,U); } g.restore(); }
  // coconut warning
  for(const o of objs) if(o.k==="coco"&&o.x>W/U-.3&&o.x<W/U+5){ const x=W-U*.55, y=sy(.35), p=1+Math.sin(gtime*14)*.1; circ(x,y,U*.32*p,"#ff4d6d"); g.fillStyle="#fff"; g.font=`900 ${U*.45}px Rubik,Arial,sans-serif`; g.textAlign="center"; g.textBaseline="middle"; g.fillText("!",x,y+1); }

  const blink=pl.inv>0&&pl.tumble<=0&&Math.floor(gtime*12)%2===0;
  g.save(); g.translate(sx(PX),sy(pl.y));
  const pose=state==="fall"&&pl.tumble<=0&&pl.onGround?"run":sliding()?"slide":!pl.onGround?"jump":"run";
  if(blink) g.globalAlpha=.45;
  let ph=pl.ph;
  if(pl.tumble>0){ const k=1-pl.tumble/TUMBLE; g.translate(0,-.45*U); g.rotate(-k*Math.PI*2); g.translate(0,.45*U); }
  else if(pl.flip>0){ const k=1-pl.flip; g.translate(0,-.45*U); g.rotate(k*Math.PI*2*(-1)); g.translate(0,.45*U); }
  else if(!pl.onGround) g.rotate(-Math.max(-.35,Math.min(.35,pl.vy*.025)));
  if(state==="fall"&&pl.tumble<=0) { ph=0; }
  if(pl.onGround&&!sliding()&&state==="play") g.translate(0,-Math.abs(Math.sin(pl.ph))*U*.06);
  drawRunner(hero,U,{pose,ph,roar:pl.roar>0,dizzy:pl.tumble>0||state==="fall",closed:pl.blink>0,sit:state==="fall"&&pl.tumble<=0});
  g.restore(); g.globalAlpha=1;
  const hcx=sx(PX+.45), hcy=sy(pl.y+(sliding()?.4:.85));
  if(pl.tumble>0||state==="fall"){ for(let i=0;i<3;i++){ const a=gtime*5+i*2.1; g.save(); g.translate(hcx+Math.cos(a)*U*.35-U*.2,hcy-U*.35+Math.sin(a)*U*.1); starPath(0,0,U*.1,U*.045); g.fillStyle="#ffd23f"; g.fill(); g.restore(); } }
  if(pl.roar>0){ g.strokeStyle="#ff7a3d"; g.lineWidth=U*.07; for(let i=0;i<3;i++){ const rr=U*(.4+i*.3+(.9-pl.roar)*1.2); g.globalAlpha=Math.min(1,pl.roar*1.5); g.beginPath(); g.arc(hcx+U*.3,hcy+U*.1,rr,-.7,.7); g.stroke(); } g.globalAlpha=1; }
  if(pl.shield>0){ const cx=sx(PX+.05), cy=sy(pl.y+(sliding()?.3:.5)), r=U*.85, fl=pl.shield<2&&Math.floor(gtime*8)%2;
    if(!fl){ g.globalAlpha=.35+Math.sin(gtime*6)*.08; circ(cx,cy,r,"#9fd8ff"); g.globalAlpha=1; g.strokeStyle="#3fa9ff"; g.lineWidth=U*.05; g.beginPath(); g.arc(cx,cy,r,0,7); g.stroke(); ell(cx-r*.4,cy-r*.45,r*.2,r*.1,"#ffffffaa",-.6); } }
  if(pl.magnet>0){ g.strokeStyle="#ff4d6d55"; g.lineWidth=U*.03; for(let i=0;i<2;i++){ const rr=U*(1+((gtime*1.5+i*.5)%1)*2.5); g.globalAlpha=1-((gtime*1.5+i*.5)%1); g.beginPath(); g.arc(sx(PX),sy(pl.y+.45),rr,0,7); g.stroke(); } g.globalAlpha=1; }
  // particles
  parts.forEach(p=>{ const a=p.life/p.max; g.globalAlpha=Math.min(1,a*1.5); const x=sx(p.x),y=sy(p.y),r=U*p.r;
    if(p.star){ starPath(x,y,r,r*.45); g.fillStyle=p.col; g.fill(); }
    else if(p.drop){ g.fillStyle=p.col; g.beginPath(); g.moveTo(x,y-r*1.6); g.quadraticCurveTo(x+r,y,x,y+r); g.quadraticCurveTo(x-r,y,x,y-r*1.6); g.fill(); }

    else circ(x,y,r,p.col); });

    g.direction=/^[+\d]/.test(f.txt)?"ltr":T[lang].dir; const x=Math.max(70,Math.min(W-70,sx(f.x))); g.strokeText(f.txt,x,sy(f.y)); g.fillStyle=f.col; g.fillText(f.txt,x,sy(f.y)); });
  g.globalAlpha=1;
  // power timers
  let ix=14; const iy=($("hud").offsetHeight||56)+U*.55;
  [["magnet",pl.magnet,9,"#ff4d6d"],["shield",pl.shield,12,"#3fa9ff"]].forEach(([k,v,max,c])=>{ if(v<=0) return; const r=U*.38; g.save(); g.translate(ix+r,iy); drawItem({k,x:0},U*.85); g.restore();

    g.globalAlpha=Math.min(1,goT*2); g.fillStyle="#ffffffee"; g.beginPath(); g.roundRect(W/2-w/2,y-U*.55,w,U*1.1,U*.55); g.fill(); g.strokeStyle="#ff7a3d"; g.lineWidth=4; g.stroke(); g.fillStyle="#ff7a3d"; g.fillText(t,W/2,y+2); g.globalAlpha=1; }
  g.direction="ltr";
  g.restore();

  const l=e.target.closest("[data-lang]"), ch=e.target.closest("[data-ch]");
  if(l){ lang=l.dataset.lang; localStorage.setItem("annabelle-lang",lang); SFX.click(); applyLang(); }
  if(ch){ const k=ch.dataset.ch; if(LS.best()>=CHAR_NEED[k]){ hero=k; localStorage.setItem("annabelle-runner-char",k); SFX.meow(); renderMenu(); } else SFX.click(); }
});
$("playBtn").onclick=()=>{ ac(); SFX.click(); startGame(); };
$("pauseBtn").onclick=()=>{ SFX.click(); pause(); };
$("resumeBtn").onclick=()=>{ SFX.click(); resume(); };
$("restartBtn").onclick=()=>{ SFX.click(); startGame(); };
$("pMenuBtn").onclick=$("oMenuBtn").onclick=()=>{ SFX.click(); toMenu(); };
$("againBtn").onclick=()=>{ SFX.click(); startGame(); };
function updateMute(){ $("muteBtn").textContent=$("muteBtn2").textContent=muted?"🔇":"🔊"; }
$("muteBtn").onclick=$("muteBtn2").onclick=()=>{ muted=!muted; localStorage.setItem("annabelle-muted",muted?"1":"0"); updateMute(); if(!muted) SFX.click(); };
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pause(); });

/* ============ INPUT ============ */
addEventListener("keydown",e=>{
  const c=e.code;
  if(c==="Space"||c==="ArrowUp"||c==="KeyW"){ e.preventDefault(); ac(); if(state==="menu"&&c==="Space"){ startGame(); return; } if(state==="over"&&c==="Space"){ startGame(); return; } if(!e.repeat) jump(); return; }
  if(c==="ArrowDown"||c==="KeyS"){ e.preventDefault(); if(!e.repeat) slide(true); return; }
  if(c==="KeyP"||c==="Escape"){ if(state==="paused") resume(); else pause(); }
  if(c==="Enter"&&(state==="menu"||state==="over")){ e.preventDefault(); ac(); startGame(); }
});
addEventListener("keyup",e=>{ if((e.code==="ArrowDown"||e.code==="KeyS")&&pl) pl.slideHold=false; });
let ptr=null;
cv.addEventListener("pointerdown",e=>{ ac(); if(state!=="play") return; e.preventDefault(); if(ptr&&!ptr.done){ ptr.done=true; jump(); } ptr={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),done:false}; });
addEventListener("pointermove",e=>{ if(!ptr||e.pointerId!==ptr.id) return; const dy=e.clientY-ptr.y, dx=e.clientX-ptr.x;
  if(dy>22&&dy>Math.abs(dx)&&!ptr.slid){ ptr.slid=true; ptr.done=true; slide(); }
  else if(dy<-22&&!ptr.done){ ptr.done=true; jump(); } });
addEventListener("pointerup",e=>{ if(ptr&&e.pointerId===ptr.id){ if(!ptr.done) jump(); ptr=null; } });
addEventListener("pointercancel",()=>{ ptr=null; });
document.addEventListener("touchmove",e=>{ if(!e.target.closest(".ov")) e.preventDefault(); },{passive:false});
document.addEventListener("touchstart",e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ============ CONFETTI ============ */
let confRaf=null;
function confetti(){
  const c=$("confetti"), x=c.getContext("2d"); c.width=innerWidth*DPR; c.height=innerHeight*DPR; x.setTransform(DPR,0,0,DPR,0,0);
  const cols=["#ff7a3d","#7c5cff","#34c47c","#ffd23f","#ff5d8f","#3fc5ff"];
  const P=Array.from({length:170},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight,vx:(Math.random()-.5)*2.5,vy:2+Math.random()*3,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.random()*cols.length|0],paw:Math.random()<.15}));
  let f=0; cancelAnimationFrame(confRaf);
  (function step(){ x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y>innerHeight+20&&f<420){p.y=-20;p.x=Math.random()*innerWidth;}
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); if(p.paw){x.font=`${p.s*2.4}px sans-serif`; x.fillText("🐾",0,0);} else {x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);} x.restore(); });
    f++; if(f<700) confRaf=requestAnimationFrame(step); else x.clearRect(0,0,innerWidth,innerHeight); })();
}
function stopConfetti(){ cancelAnimationFrame(confRaf); const c=$("confetti"); c.getContext("2d").clearRect(0,0,c.width,c.height); }

/* ============ LOOP ============ */
let lastT=0;
function frame(t){ const dt=Math.min(.05,(t-lastT)/1000||0); lastT=t; stats.frames++;
  try{ if(state!=="paused") update(dt); render(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame); }

/* ============ test hook ============ */
window.__run={
  info:()=>({state,hearts,dist,score,pts,speed,hero,U,GY,PX,W,H,player:pl&&{y:pl.y,vy:pl.vy,onGround:pl.onGround,jumps:pl.jumps,sliding:sliding(),tumble:pl.tumble,inv:pl.inv,shield:pl.shield,magnet:pl.magnet},
    objs:objs.map(o=>({k:o.k,x:o.x,y:o.y,hit:!!o.hit})),stats:{...stats}}),
  spawn:(k,x,y)=>{ const o=OB[k]?mkObs(k,x):{k,x,y,col:true,pw:k==="magnet"||k==="shield"}; objs.push(o); return objs.length; },
  clear:()=>{ objs=[]; }, test:TEST, setInv:v=>{ pl.inv=v; }, setDist:d=>{ dist=d; nextMile=Math.ceil((d+1)/250)*250; }
};

/* ============ BOOT ============ */
layout(); updateMute(); applyLang();
requestAnimationFrame(t=>{ lastT=t; frame(t); }); document.body.dataset.ready="1";
</script>
