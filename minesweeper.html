 const i=pool[Math.random()*pool.length|0];G.hints--;G.cells[i].f=false;open(i);$("grid").children[i].animate([{transform:"scale(1.4)",background:"#fff59d"},{transform:"scale(1)"}],{duration:600});SFX.dig();hud();checkWin()}
function toast(s,ms=1500){const d=document.createElement("div");d.className="toast";d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function dogWake(i){G.paused=true;holdT();if(G.lives<=0)G.over=true;SFX.bark();setTimeout(SFX.meow,300);
 const b=$("grid").children[i];b.classList.add("awake");$("wrap").classList.remove("wshake");void $("wrap").offsetWidth;$("wrap").classList.add("wshake");{const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,14,{sp:6,em:["💢","💤","❗"],s:22,life:40,g:.1})}
 const hb=document.createElement("div");hb.className="heartbreak";hb.textContent="💔";const r=$("hearts").getBoundingClientRect();hb.style.left=(r.left+r.width/2)+"px";hb.style.top=(r.top+r.height/2)+"px";document.body.appendChild(hb);setTimeout(()=>hb.remove(),1600);$("hearts").classList.add("shake");setTimeout(()=>$("hearts").classList.remove("shake"),700);
 const d=document.createElement("div");d.className="chase";d.textContent="🐈      🐕";document.body.appendChild(d);
 d.animate([{transform:"translateX(110vw)"},{transform:"translateX(-70vw)"}],{duration:3000,easing:"ease-in-out"}).onfinish=()=>d.remove();
 $("oopsT").textContent=pickf(FUN[lang].oops);$("oopsS").textContent=G.lives>0?t("lost").replace("N",G.lives):t("lastH");$("oopsBtn").textContent=t("cont");
 const g1=G;setTimeout(()=>{if(G===g1)$("oops").classList.add("on")},350);
 $("oopsBtn").onclick=()=>{SFX.click();$("oops").classList.remove("on");b.classList.remove("awake");G.paused=false;if(!document.hidden)freeT();act();if(G.lives<=0)lose();else{toast(pickf(FUN[lang].back),1700)}}}
function checkWin(){const closed=G.cells.map((c,i)=>i).filter(i=>!G.cells[i].dog&&!G.cells[i].o);if(closed.some(i=>!G.cells[i].f))return;
 closed.forEach(i=>{G.cells[i].f=false;G.cells[i].o=true;G.opened++;render(i)});
 G.over=true;G.sec=Math.floor((Date.now()-G.t0)/1000);hud();G.cells.forEach((c,i)=>{if(c.dog&&!c.o){c.f=true;render(i)}});
 const b=getBest(),nb_=b[G.mode]==null||G.sec<b[G.mode];if(nb_){b[G.mode]=G.sec;try{localStorage.setItem(BK,JSON.stringify(b))}catch(e){}}
 let topL=null;if(!/^s\d+$/.test(G.mode)){const T=getTop(),a=(T[G.mode]||[]).filter(x=>typeof x==="number");a.push(G.sec);a.sort((x,y)=>x-y);const ix=a.indexOf(G.sec);T[G.mode]=a.slice(0,5);try{localStorage.setItem(TK,JSON.stringify(T))}catch(e){}topL={a:T[G.mode],ix:ix<5?ix:-1}}
 const stars=starsFor(G.hits),sn=/^s\d+$/.test(G.mode)?+G.mode.slice(1):0,sm=getStars(),prev=sm[G.mode]||0;
 if(stars>prev){sm[G.mode]=stars;try{localStorage.setItem(SK,JSON.stringify(sm))}catch(e){}}
 const score=Math.max(50,700-G.sec*3)+stars*100+G.maxStreak*5;G.stars=stars;
 const level=sn||({tiny:1,easy:2,normal:3,hard:4,daily:5,pro:6,expert:7})[G.mode]||1;
 const R=RW();if(R){R.award({game:"minesweeper",event:"levelClear",level,score});if(stars>prev)R.award({game:"minesweeper",event:"star",stars:stars-prev});R.award({game:"minesweeper",event:"combo",score:G.maxStreak});R.award({game:"minesweeper",event:"score",score});R.award({game:"minesweeper",event:"win"});
  if(G.mode==="daily"){let dn=null;try{dn=localStorage.getItem(DK)}catch(e){}if(dn!==tdKey()){try{localStorage.setItem(DK,tdKey())}catch(e){}R.award({game:"minesweeper",event:"win",coins:10})}}}
 const g0=G;setTimeout(()=>{if(G!==g0)return;$("winT").textContent=t("winT");$("winS").innerHTML='<span class="dance">😸</span><span class="dance" style="animation-delay:.25s">🐟</span><span class="dance">😺</span><span class="dance" style="animation-delay:.25s">🐟</span>';
  $("winB").textContent=`⏱️ ${G.sec} ${t("sec")} · `+(nb_?t("newBest"):`${t("best")}: ${b[G.mode]} ${t("sec")}`);$("againBtn").textContent=t("again");
  $("winTop").innerHTML=topL?`${t("top")}: `+topL.a.map((v,i)=>i===topL.ix?`<b>${v}</b>`:v).join(" · ")+` ${t("sec")}`:"";
  $("winGoal").textContent=t("starRule");$("winStars").innerHTML=[1,2,3].map(i=>`<span class="${i<=stars?"":"no"}">★</span>`).join("");
  const nx=$("nextBtn");nx.style.display=sn&&sn<NSTG?"":"none";nx.textContent=t("nextS");
  $("win").classList.add("on");SFX.win();confetti();
  [...$("winStars").children].forEach((e,i)=>{if(i<stars)setTimeout(()=>{e.classList.add("got");SFX.star(i)},500+i*350)});
  R&&setTimeout(()=>R.flush(),1700)},500)}
function lose(){const R=RW();if(R){R.award({game:"minesweeper",event:"score",score:G.opened*5});}$("winStars").innerHTML="";$("winGoal").textContent="";$("winTop").textContent="";$("nextBtn").style.display="none";G.cells.forEach((c,i)=>{if(c.dog){c.o=true;render(i)}});$("winT").textContent=t("lose");$("winS").innerHTML='<span class="dance">🙀</span> 🐶🐶';$("winB").textContent="";$("againBtn").textContent=t("retry");$("win").classList.add("on");R&&R.flush()}
// input: tap + long press
let lp=null,lpFired=false;
let lastPT="touch";
$("grid").addEventListener("mousedown",e=>e.preventDefault());
$("grid").addEventListener("pointerdown",e=>{lastPT=e.pointerType;const b=e.target.closest(".tl");if(!b)return;lpFired=false;clearTimeout(lp);if(e.pointerType==="mouse")return;lp=setTimeout(()=>{lpFired=true;tap(+b.dataset.i,true);if(navigator.vibrate)navigator.vibrate(30)},450)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("grid").addEventListener(ev,()=>clearTimeout(lp)));
$("grid").addEventListener("click",e=>{const b=e.target.closest(".tl");if(!b)return;if(lpFired){lpFired=false;return}tap(+b.dataset.i)});
$("grid").addEventListener("contextmenu",e=>{e.preventDefault();const b=e.target.closest(".tl");if(b&&lastPT==="mouse")tap(+b.dataset.i,true)});
$("grid").addEventListener("auxclick",e=>{const b=e.target.closest(".tl");if(b&&e.button===1){e.preventDefault();tap(+b.dataset.i)}});
$("grid").addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const b=e.target.closest(".tl");$("grid").classList.remove("kb");if(b)setCur(+b.dataset.i)});
function setCur(i){if(!G||i===cur)return;const ch=$("grid").children,o=ch[cur];if(o)o.classList.remove("cur");cur=i;if(ch[i])ch[i].classList.add("cur")}
// keyboard (laptop)
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||(window.AnnabelleDesk&&AnnabelleDesk.typing(e)))return;
 const k=e.key,on=id=>$(id).classList.contains("on"),btn=e.target&&e.target.closest&&e.target.closest("button,a,input");
 const act=k==="Enter"||k===" ";
 if(on("oops")){if(act||k==="ArrowRight"||k==="ArrowLeft"){if(!btn||btn.id!=="oopsBtn"){e.preventDefault();$("oopsBtn").click()}}else if(k==="Escape"){e.preventDefault();$("oopsBtn").click();$("menuBtn").click()}return}
 if(on("win")){if(k==="r"||k==="R"){e.preventDefault();$("againBtn").click();return}if(act){if(!btn){e.preventDefault();$("againBtn").click()}}else if(k==="Escape"){e.preventDefault();toMenu()}return}
 if($("menu").classList.contains("active")){if(k==="6"){e.preventDefault();ac();SFX.click();openStages();return}const m=k==="7"?"pro":k==="8"?"expert":k==="1"?"easy":k==="2"?"normal":k==="3"?"tiny":k==="4"?"hard":k==="5"?"daily":null;if(m){e.preventDefault();ac();SFX.click();newGame(m)}return}
 if($("stages").classList.contains("active")){if(k==="Escape"){e.preventDefault();$("stBack").click()}else if(/^[0-9]$/.test(k)){const b=$("stGrid").children[k==="0"?9:+k-1];if(b)b.click()}return}
 if(!G||!$("game").classList.contains("active"))return;
 const kk=k.length===1?k.toLowerCase():k,rtl=document.documentElement.dir==="rtl";
 let dr=0,dc=0;
 if(kk==="ArrowUp"||kk==="w")dr=-1;else if(kk==="ArrowDown"||kk==="s")dr=1;else if(kk==="ArrowLeft"||kk==="a")dc=rtl?1:-1;else if(kk==="ArrowRight"||kk==="d")dc=rtl?-1:1;
 if(dr||dc){e.preventDefault();if(btn&&!btn.classList.contains("tl"))btn.blur();
  const r=Math.min(G.R-1,Math.max(0,Math.floor(cur/G.C)+dr)),c=Math.min(G.C-1,Math.max(0,cur%G.C+dc));
  $("grid").classList.add("kb");setCur(r*G.C+c);return}
 if(act){if(btn&&!btn.classList.contains("tl"))return;e.preventDefault();$("grid").classList.add("kb");tap(cur);return}
 if(kk==="x"){e.preventDefault();$("grid").classList.add("kb");tap(cur,true)}
 else if(kk==="f"){e.preventDefault();SFX.click();setFlag(!G.flagMode)}
 else if(kk==="h"){e.preventDefault();hint()}
 else if(kk==="r"){e.preventDefault();newGame(G.mode)}
 else if(k==="Escape"){e.preventDefault();$("menuBtn").click()}
});
document.addEventListener("click",e=>{if(e.detail>0&&window.AnnabelleDesk&&AnnabelleDesk.isDesk()){const b=e.target.closest&&e.target.closest("button");if(b)setTimeout(()=>b.blur(),0)}});
$("hintBtn").addEventListener("click",hint);
$("rstBtn").addEventListener("click",()=>{if(!G)return;SFX.click();newGame(G.mode)});
$("flagBtn").addEventListener("click",()=>{SFX.click();setFlag(!G.flagMode)});
window.__G=()=>G;window.__tap=tap;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));if(id==="game")fit()}
function fit(){if(!G)return;const w=$("wrap");const s=Math.floor(Math.min((w.clientWidth-12-3*(G.C-1))/G.C,(w.clientHeight-16-3*(G.R-1))/G.R));const g=$("grid");g.style.gridAutoRows=s+"px";g.style.gridTemplateColumns=`repeat(${G.C},${s}px)`;g.style.fontSize=Math.floor(s*.62)+"px"}
addEventListener("resize",fit);
window.toMenu=function(){$("win").classList.remove("on");$("oops").classList.remove("on");clearInterval(timer);G=null;applyLang();show("menu")};
$("menuBtn").addEventListener("click",()=>{SFX.click();toMenu()});
function confetti(){for(let k=0;k<4;k++)setTimeout(()=>burst(innerWidth*(.15+.23*k),innerHeight*.9,40,{cone:1.6,sp:15,g:.3,life:70,s:11,em:["🐟","🐾","⭐"],emP:.3}),k*160)}
$("nextBtn").addEventListener("click",()=>{const n=+G.mode.slice(1)+1;$("win").classList.remove("on");SFX.click();newGame("s"+n)});
function openStages(){const sm=getStars(),h=[];let curN=0;for(let n=1;n<=NSTG;n++){if(!sm["s"+n]&&!curN)curN=n}
 for(let n=1;n<=NSTG;n++){const un=n===1||sm["s"+(n-1)]>0,st=sm["s"+n]||0,q=STG[n-1];
  h.push(`<button class="stb${un?"":" lock"}${n===curN?" cur":""}" data-st="${n}" aria-label="${t("stg")} ${n}">${un?n:t("lock")}<small>${un?"★".repeat(st)+"☆".repeat(3-st):""}</small><sub>${q[0]}×${q[1]}</sub></button>`)}
 $("stGrid").innerHTML=h.join("");show("stages")}
$("bStages").addEventListener("click",()=>{ac();SFX.click();openStages()});
$("stBack").addEventListener("click",()=>{SFX.click();show("menu")});
$("stGrid").addEventListener("click",e=>{const b=e.target.closest(".stb");if(!b)return;const n=+b.dataset.st;if(b.classList.contains("lock")){SFX.lock();b.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],{duration:200});return}ac();SFX.click();newGame("s"+n)});
$("againBtn").addEventListener("click",()=>{const m=G.mode;$("win").classList.remove("on");newGame(m)});
document.addEventListener("click",e=>{const L=e.target.closest("[data-lang]"),M=e.target.closest("[data-mode]");
 if(L){lang=L.dataset.lang;localStorage.setItem("annabelle-lang",lang);SFX.click();applyLang()}
 if(M){ac();SFX.click();newGame(M.dataset.mode)}});
$("muteBtn").addEventListener("click",()=>{muted=!muted;localStorage.setItem("annabelle-muted",muted?"1":"0");updMute();if(!muted)SFX.click()});
applyLang();updMute();
</script>
