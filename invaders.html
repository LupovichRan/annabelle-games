function countUp(to){
 clearInterval(cntT);var el=$('cnt');if(!el)return;var v=0,st=Math.max(1,Math.ceil(to/36)),n=0;
 cntT=setInterval(function(){v=Math.min(to,v+st);el.textContent=v;if((n++)%3===0)tone(500+500*v/Math.max(1,to),.03,'square',.03);if(v>=to){clearInterval(cntT);if($('cnt')===el)el.style.color='#ffe45e'}},28);
}
function showResult(first){
 var g=G,n=g.lvl,w=g.win,h,names=Object.keys(g.seen);
 var gotE=names.map(function(a){return '<span title="'+an(a)+'" style="font-size:28px">'+EM[a]+'</span>'}).join(' ');
 var rec=g.rec?'<div class="rec">★ '+t('newRec')+' ★</div>':'';
 var sc='<p class="sub" style="font-size:20px;margin:4px 0">'+t('score')+': <span id="cnt" style="display:inline-block;min-width:2ch;direction:ltr">0</span></p>';
 if(g.mode==='arcade'){
  h='<div class="card"><h2>🕹 '+t('over')+'</h2>'+rec+sc+'<p>'+t('reached')+' '+g.wave+' · 🐾 '+(g.caught+g.helped)+'</p>'+(gotE?'<p>'+gotE+'</p>':'')+hsTable(g.rank)
   +'<button class="big pk" data-a="arcade">↻ '+t('again')+'</button><div class="row"><button class="big alt sm" data-a="levels" style="flex:1;margin:0">'+t('levels')+'</button><button class="big alt sm" data-a="menu" style="flex:1;margin:0">'+t('menu')+'</button></div></div>';
 }else if(w){
  var last=n>=12;
  h='<div class="card"><h2>'+(LV[n-1].boss?'👾 '+t('bossWin'):'🎉 '+t('win'))+'</h2>'+stars3(g.starsGot)+rec+sc+'<p>🐾 '+g.caught+'/'+g.released+(gotE?' · '+t('rescued')+': '+gotE:'')+'</p>'
   +(last?'<p style="font-size:18px;font-weight:800">'+t('fin')+'</p><p class="sub">'+t('finSub')+'</p>':'')
   +(last?'<button class="big" data-a="sanct">🐾 '+t('sanct')+'</button>':'<button class="big" data-a="next">▶ '+t('nextLevel')+'</button>')
   +'<div class="row"><button class="big alt sm" data-a="again" style="flex:1;margin:0">'+t('again')+'</button><button class="big alt sm" data-a="levels" style="flex:1;margin:0">'+t('levels')+'</button></div></div>';
 }else{
  h='<div class="card"><h2>😺 '+t('lose')+'</h2><p class="sub">'+t('loseSub')+'</p><div class="art" style="font-size:44px"><span>😺</span><span>🧶</span><span>🤖</span></div>'+sc
   +'<button class="big" data-a="again">↻ '+t('tryAgain')+'</button><div class="row"><button class="big alt sm" data-a="levels" style="flex:1;margin:0">'+t('levels')+'</button><button class="big alt sm" data-a="menu" style="flex:1;margin:0">'+t('menu')+'</button></div></div>';
 }
 openScr(h,true,function(){showResult(false)},'result');
 if(first===true){countUp(g.score);
  if(w)for(var i=0;i<g.starsGot;i++)(function(i){setTimeout(function(){SFX.star(i)},i*300+120)})(i);
  if(g.rec)setTimeout(function(){SFX.fanfare()},w?1000:300);
 }else{var el=$('cnt');if(el)el.textContent=g.score}
}
function pause(){
 if(G.scene!=='play'&&G.scene!=='clear')return;
 G.paused=true;
 openScr('<div id="pause" style="width:100%;display:flex"><div class="card"><h2>⏸ '+t('pause')+'</h2><button class="big" data-a="resume">▶ '+t('resume')+'</button><button class="big alt" data-a="again">↻ '+t('again')+'</button><button class="big alt" data-a="menu">'+t('menu')+'</button></div></div>',true,pause,'pause');
}
function quitRun(){if(G.paused&&G.mode==='arcade'&&G.score>0){addHi(G.score,'arcade');R('score',{score:G.score});Rflush()}}
function resume(){if(!G.paused)return;G.paused=false;closeScr();ensureAudio()}
document.addEventListener('click',function(ev){
 var b=ev.target.closest&&ev.target.closest('[data-a]');if(!b)return;
 var a=b.dataset.a,v=b.dataset.v;ensureAudio();SFX.click();
 switch(a){
 case'play':if(!save.seenStory){save.seenStory=true;doSave();showStory(0,function(){showBrief(clamp(save.unlocked,1,12))})}else showBrief(clamp(save.unlocked,1,12));break;
 case'arcade':startArcade(save.diff);break;
 case'levels':showLevels();break;
 case'sanct':showSanct();break;
 case'menu':quitRun();showMenu();break;
 case'story':showStory(0,showMenu);break;
 case'snext':if(storyI<2)showStory(storyI+1,storyNext);else(storyNext||showMenu)();break;
 case'sskip':(storyNext||showMenu)();break;
 case'rnext':showReveal(revList,revI+1);break;
 case'rall':showResult(true);break;
 case'lang':lang=v;store.s('annabelle-lang',lang);applyLang();if(cur)cur();break;
 case'diff':save.diff=v;doSave();if(cur)cur();break;
 case'lvl':if(+v>save.unlocked){toast('🔒 '+t('locked'));break}showBrief(+v);break;
 case'go':startLevel(+v,save.diff);break;
 case'next':showBrief(Math.min(12,G.lvl+1));break;
 case'again':quitRun();if(G.mode==='arcade')startArcade(G.diff);else startLevel(G.lvl,G.diff);break;
 case'resume':resume();break;
 }
});
/* ---------- input ---------- */
function setDrag(ev){var r=cv.getBoundingClientRect();drag=clamp((ev.clientX-r.left)/r.width*W,0,W)}
cv.addEventListener('pointerdown',function(ev){ensureAudio();if(G.scene==='play'||G.scene==='clear'){try{cv.setPointerCapture(ev.pointerId)}catch(e){}setDrag(ev)}});
cv.addEventListener('pointermove',function(ev){if(drag!==null)setDrag(ev)});
['pointerup','pointercancel','lostpointercapture'].forEach(function(e){cv.addEventListener(e,function(){drag=null})});
function hold(id,key){var b=$(id);
 function on(ev){ev.preventDefault();ensureAudio();touch[key]=true;b.classList.add('dn');try{b.setPointerCapture(ev.pointerId)}catch(e){}}
 function off(){touch[key]=false;b.classList.remove('dn')}
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(function(e){b.addEventListener(e,off)});
 b.addEventListener('contextmenu',function(e){e.preventDefault()})}
hold('bL','l');hold('bR','r');hold('fire','f');
window.addEventListener('keydown',function(e){
 if(window.AnnabelleDesk&&AnnabelleDesk.typing(e))return;
 var c=e.code;
 if(c==='ArrowLeft'||c==='KeyA'){keys.l=true;e.preventDefault()}
 else if(c==='ArrowRight'||c==='KeyD'){keys.r=true;e.preventDefault()}
 else if(c==='Space'||c==='ArrowUp'||c==='KeyW'){
  if((G.scene==='play'||G.scene==='clear')&&!G.paused){keys.f=true;e.preventDefault();ensureAudio();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
 }
 else if((c==='KeyP'||c==='Escape')&&!e.repeat){if(G.paused)resume();else pause()}
 else if(c==='KeyM'&&!e.repeat)toggleMute();
 else if(c==='Enter'&&!e.repeat&&scrEl.classList.contains('on')){var pb=scrEl.querySelector('.big');if(pb&&pb.tagName==='BUTTON'){e.preventDefault();pb.click()}}
});
window.addEventListener('keyup',function(e){var c=e.code;if(c==='ArrowLeft'||c==='KeyA')keys.l=false;else if(c==='ArrowRight'||c==='KeyD')keys.r=false;else if(c==='Space'||c==='ArrowUp'||c==='KeyW')keys.f=false});
window.addEventListener('blur',function(){keys={};touch.l=touch.r=touch.f=false});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause()});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
function toggleMute(){muted=!muted;store.s('annabelle-muted',muted?'1':'0');syncBtns();ensureAudio();if(!muted)SFX.click()}
function syncBtns(){$('muteBtn').textContent=muted?'🔇':'🔊';$('musBtn').classList.toggle('off',!save.music);$('muteBtn').classList.toggle('off',muted)}
$('muteBtn').onclick=toggleMute;
$('musBtn').onclick=function(){save.music=!save.music;doSave();syncBtns();ensureAudio();SFX.click()};
$('pauseBtn').onclick=function(){ensureAudio();if(G.paused)resume();else pause()};
function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
 $('hint').textContent=t('hint');setTitle();document.title=t('title')+' – '+t('sub');
 $('musBtn').title=t('musicOn');
}
/* ---------- loop ---------- */
var last=0;
function frame(ts){
 var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 try{update(dt);draw();if(scrName==='menu')drawMascot(ts/1000)}catch(e){console.error(e)}
 requestAnimationFrame(frame);
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,200)});
/* ---------- test hook ---------- */
window.__invaders={
 state:function(){var g=G,b=g.boss;return{scene:g.scene,screen:scrName,paused:!!g.paused,mode:g.mode,level:g.lvl,wave:g.wave||0,diff:g.diff,lives:g.lives,score:g.score,enemies:g.en?aliveCount():0,boss:b?b.hp:null,bossX:b?b.x:null,bossEnter:b?b.enter:null,bossDying:b?b.dying:null,flyer:!!g.flyer,yarn:g.yarn?g.yarn.length:0,pellets:g.pel?g.pel.length:0,animals:g.anim?g.anim.length:0,released:g.released,caught:g.caught,helped:g.helped,combo:g.combo,shield:g.shield,tri:g.tri,ufo:!!g.ufo,x:g.x,H:H,zoo:save.zoo.slice(),unlocked:save.unlocked,stars:save.stars,best:save.best,hi:save.hi.slice(),lang:lang,muted:muted,stars_got:g.starsGot,win:g.win,rec:g.rec,rank:g.rank,newF:g.newF?g.newF.slice():[]}},
 debug:function(){var g=G;return{x:g.x,shipY:shipY(),H:H,W:W,boss:g.boss?{x:g.boss.x,y:g.boss.y,hp:g.boss.hp}:null,ufo:g.ufo?{x:g.ufo.x,y:g.ufo.y}:null,pel:(g.pel||[]).map(function(p){return[p.x,p.y,p.vx,p.vy]}),anim:(g.anim||[]).map(function(a){return[a.x,a.y,a.sp]}),en:(g.en||[]).filter(function(e){return e.alive}).map(function(e){return[e.x,e.y,e.st]}),pow:(g.pow||[]).map(function(p){return[p.x,p.y,p.k]})}},
 start:function(n,d){startLevel(n,d)},
 arcade:function(d,w){startArcade(d);if(w>1){G.wave=w;setupWave(arcadeCfg(w));setTitle();waveBanner();startMusic()}},
 menu:function(){showMenu()},
 advance:function(sec){var n=Math.round(sec*60);for(var i=0;i<n;i++)update(1/60)},
 win:function(){if(G.en)G.en.forEach(function(e){if(e.alive)popEnemy(e)});if(G.boss&&!G.boss.dying){G.boss.hp=1;bossHit(true)}},
 lose:function(){if(G.scene==='play'){G.lives=1;G.inv=0;G.shield=0;hitShip()}},
 hit:function(){G.inv=0;return hitShip()},
 fire:function(){shoot()},
 moveTo:function(x){G.x=clamp(x,24,W-24)},
 spawnUfo:function(){G.ufo={x:W/2,y:UFOY,vx:0,hp:1,flash:0}},
 give:function(k){G.pow.push({k:k,x:G.x,y:shipY()-10,vy:10})},
 pause:pause,resume:resume,
 enemyPos:function(){var e=G.en.filter(function(a){return a.alive})[0];return e?{x:e.x,y:e.y}:null},
 finish:function(){if(G.anim){G.anim.forEach(function(a){rescue(a.sp)});G.anim=[]}if(G.scene==='play'||G.scene==='clear'){G.scene='clear';finishLevel(true)}}
};
/* ---------- boot ---------- */
buildSprites();syncBtns();applyLang();fit();
showMenu();
requestAnimationFrame(frame);
document.addEventListener('pointerdown',ensureAudio,{passive:true});
})();
</script>
<script src="retrofx.js" defer></script>
