if(g.mode==='net')banner('⚔ '+t('wave')+' '+g.wave+'/3',c.boss?'👾 '+t('boss'):t('rescue')+': '+EM[c.star]+' '+an(c.star),!!c.boss);
 else if(g.mode==='arcade')banner('🕹 '+t('arcade'),c.boss?'👾 '+t('boss'):t('wave')+' '+g.wave,!!c.boss);
 else banner(t('chap')+' '+g.lvl+' · '+t('ch')[g.lvl-1],c.boss?'👾 '+t('bossIn'):t('rescue')+': '+EM[c.star]+' '+an(c.star),!!c.boss);
}
function begin(){
 closeScr();setTitle();waveBanner();ensureAudio();startMusic();SFX.click();
 try{document.activeElement&&document.activeElement.blur()}catch(e){}
}
function startLevel(n,diff){
 n=clamp(n|0||1,1,12);diff=DIFF[diff]?diff:save.diff;fit();
 G=baseG(diff);G.lvl=n;G.mode='story';setupWave(LV[n-1]);
 if(n>=2&&save.zoo.indexOf('tiger')<0)G.ufoT=5;
 R('play',{level:n});begin();
}
function startArcade(diff){
 diff=DIFF[diff]?diff:save.diff;fit();
 G=baseG(diff);G.mode='arcade';G.lvl=0;G.wave=1;setupWave(arcadeCfg(1));
 R('play');begin();
}
/* ---------- gameplay ---------- */
function popFx(x,y,cols,n){for(var i=0;i<n;i++){var a=Math.random()*6.28,s=rnd(40,160);G.part.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,g:200,life:rnd(.5,1),max:1,col:pick(cols),sz:rnd(2,4.5),sh:'r'})}}
function bubFx(x,y,n){for(var i=0;i<n;i++)G.part.push({x:x+rnd(-10,10),y:y+rnd(-4,8),vx:rnd(-20,20),vy:rnd(-70,-30),g:-10,life:rnd(.8,1.5),max:1.5,col:'#bff6ff',sz:rnd(3,7),sh:'b'})}
function ftxt(x,y,s,col){G.txt.push({x:clamp(x,70,W-70),y:y,s:s,life:1.1,col:col||'#ffe45e'})}
function announce(s,col){G.ann={s:s,t:0,col:col||pick(['#ffe45e','#5ff0ff','#ff9ccd','#7dff9a'])}}
var CONF=['#ff6fb5','#ffe45e','#5ff0ff','#7dff9a','#c58bff','#fff'];
function spawnAnimal(sp,x,y,vx){G.released++;G.anim.push({sp:sp,x:clamp(x,22,W-22),y:y,vy:rnd(70,84),vx:vx||0,ph:rnd(0,6),b:0,age:0,col:pick(CONF.slice(0,5))})}
function needTiger(){return save.zoo.indexOf('tiger')<0&&!G.anim.some(function(a){return a.sp==='tiger'})}
function rescue(sp){
 if(G.net){G.seen[sp]=1;return}
 var isNew=addZoo(sp);if(isNew){G.newF.push(sp);toast('✨ '+t('newFriend')+': '+EM[sp]+' '+an(sp))}
 G.seen[sp]=1;
}
function hitShip(){
 if(G.inv>0||G.scene!=='play')return false;
 if(G.shield>0){G.shield=0;G.inv=.9;SFX.bonk();popFx(G.x,shipY(),['#7dff9a','#fff'],14);return false}
 G.lives--;G.hits++;G.inv=1.9;G.shake=.4;G.combo=0;G.stop=.07;G.flash=Math.max(G.flash,.3);SFX.hurt();popFx(G.x,shipY(),['#ff9a4d','#ffe45e','#fff'],16);
 if(G.lives<=0){G.scene='dead';G.deadT=0;SFX.lose()}
 return true;
}
function popEnemy(e){
 e.alive=false;G.score+=10+(4-Math.min(e.r,4))*2;if(G.net)netStreak();
 popFx(e.x,e.y-11,CONF,16);bubFx(e.x,e.y+16,5);SFX.pop();G.shake=Math.max(G.shake,.08);
 if(e.star)G.flash=Math.max(G.flash,.22);
 spawnAnimal(e.sp,e.x,e.y-11);
 if(Math.random()<G.D.pd)G.pow.push({k:Math.random()<.55?'fish':'heart',x:e.x,y:e.y,vy:70});
 if(G.cfg.rain&&G.rainT<0&&aliveCount()<=G.n0/2){G.rainT=0;G.rainN=0;toast('🐟 '+t('fishRain'))}
}
function aliveCount(){var n=0;for(var i=0;i<G.en.length;i++)if(G.en[i].alive)n++;return n}
function popUfo(){
 var u=G.ufo;if(!u)return;G.ufo=null;G.score+=150;popFx(u.x,u.y+16,CONF,28);SFX.ufo();ftxt(u.x,u.y+10,'+150 '+EM.tiger,'#ff9ccd');
 G.stop=.06;G.flash=Math.max(G.flash,.4);G.shake=.3;
 spawnAnimal('tiger',u.x,u.y+26);
}
function bossHit(force){
 var b=G.boss;if(!b||b.dying>0||(b.enter>0&&!force))return false;
 b.enter=0;b.hp--;b.flash=.25;G.score+=15;SFX.bonk();popFx(b.x+rnd(-30,30),b.y+rnd(-10,20),CONF,6);
 if(b.hp===Math.floor(b.max/2)){ftxt(b.x,b.y+72,'💢','#fff');G.shake=.3}
 if(b.hp>0&&b.hp%6===0)G.pow.push({k:Math.random()<.5?'fish':'heart',x:b.x,y:b.y+50,vy:75});
 if(b.hp<=0){b.hp=0;b.dying=1.7;b.popT=0;G.stop=.14;G.flash=.8;G.shake=.7;G.pel=[];G.score+=300;SFX.boss();announce(t('bonk'),'#ff6fb5')}
 return true;
}
function bossBurst(){
 var b=G.boss;if(!b)return;G.flash=.9;G.stop=.08;G.shake=.9;SFX.pop();SFX.pfft();
 for(var i=0;i<6;i++)popFx(b.x+rnd(-55,55),b.y+rnd(-50,30),CONF,24);bubFx(b.x,b.y,18);
 b.an.forEach(function(sp,i){spawnAnimal(sp,b.x+(i-(b.an.length-1)/2)*40,b.y-10,rnd(-25,25))});
 G.flyer={x:b.x,y:b.y+34,x0:b.x,t:0,rot:0};G.boss=null;G.pel=[];G.wasBoss=true;
}
function startClear(){
 var g=G;g.scene='clear';g.clearT=0;g.pel=[];g.sneak=[];SFX.win();
 if(g.mode==='story'&&g.lvl>=6&&!g.cfg.boss&&needTiger()){
  var ux=g.ufo?clamp(g.ufo.x,40,W-40):W/2;popFx(ux,50,CONF,24);spawnAnimal('tiger',ux,56);toast('🐯 '+t('tigerFree'));
 }
 g.ufo=null;
 for(var i=0;i<3;i++)popFx(rnd(60,300),rnd(100,300),CONF,18);
}
function finishLevel(win){
 if(G.scene==='result')return;
 var g=G;g.scene='result';
 var n=g.lvl,ratio=g.released?g.caught/g.released:1,st=0,res={rank:-1,rec:false};
 if(g.mode==='arcade'){win=false;res=addHi(g.score,'arcade');R('score',{score:g.score})}
 else if(win){st=1;if(ratio>=.5)st=2;if(ratio>=.75&&g.hits<=3)st=3;
  save.stars[n]=Math.max(save.stars[n]||0,st);save.bestLv[n]=Math.max(save.bestLv[n]||0,g.score);
  if(n<12)save.unlocked=Math.max(save.unlocked,n+1);doSave();res=addHi(g.score,'story');
  R('levelClear',{level:n,score:g.score});R('star',{stars:st});if(g.cfg.boss)R('win',{level:n});R('score',{score:g.score});
 }else{R('score',{score:g.score})}
 g.starsGot=st;g.win=win;g.rank=res.rank;g.rec=res.rec;
 if(g.maxCombo>=3)R('combo',{score:g.maxCombo});
 Rflush();
 var nf=g.newF.slice();
 if(nf.length)showReveal(nf,0);else showResult(true);
}
function update(dt){
 var g=G;if(g.paused)return;
 if(g.scene!=='play'&&g.scene!=='clear'&&g.scene!=='dead')return;
 g.flash=Math.max(0,g.flash-dt*3);
 if(g.stop>0){g.stop-=dt;return}
 g.t+=dt;var D=g.D,cfg=g.cfg,i,j,c,q;
 g.shake=Math.max(0,g.shake-dt);
 if(g.inv>0)g.inv-=dt;if(g.happy>0)g.happy-=dt;
 if(g.ann){g.ann.t+=dt;if(g.ann.t>1.25)g.ann=null}
 /* ship */
 if(g.scene!=='dead'){
  var dir=(keys.l||touch.l?-1:0)+(keys.r||touch.r?1:0),px0=g.x;
  g.x+=dir*235*dt;
  if(drag!==null){var d=drag-g.x,m=520*dt;g.x+=clamp(d,-m,m)}
  g.x=clamp(g.x,24,W-24);
  if(Math.abs(g.x-px0)>.5&&Math.random()<.5)g.part.push({x:g.x+(Math.random()<.5?-10:11),y:shipY()+22,vx:(px0-g.x)*20,vy:rnd(50,110),g:0,life:.3,max:.3,col:pick(['#ffb03b','#ff6f3b','#fff7b0']),sz:2,sh:'r'});
  g.cd-=dt;
  if((keys.f||touch.f)&&g.cd<=0&&g.scene==='play')shoot();
  if(g.shield>0)g.shield-=dt;if(g.tri>0)g.tri-=dt;
 }
 /* yarn */
 for(i=g.yarn.length-1;i>=0;i--){var y=g.yarn[i];y.y-=440*dt;y.x+=y.vx*dt;y.rot+=dt*12;
  if(y.y<-10||y.x<-10||y.x>W+10){if(g.net&&y.vx===0&&y.y<-10)g.streak=0;g.yarn.splice(i,1);continue}
  var used=false;
  for(j=0;j<g.en.length&&!used;j++){var e=g.en[j];if(!e.alive)continue;if(Math.abs(y.x-e.x)<22&&Math.abs(y.y-e.y)<31){popEnemy(e);used=true}}
  if(!used&&g.ufo&&Math.abs(y.x-g.ufo.x)<36&&Math.abs(y.y-(g.ufo.y+16))<28){g.ufo.hp--;g.ufo.flash=.2;SFX.bonk();used=true;if(g.ufo.hp<=0)popUfo()}
  if(!used&&g.boss&&!g.boss.dying&&g.boss.enter<=0&&Math.abs(y.x-g.boss.x)<58&&Math.abs(y.y-g.boss.y)<48){bossHit();used=true}
  if(!used&&g.sneak.length){for(var k2=0;k2<g.sneak.length;k2++){var sb=g.sneak[k2];if(Math.abs(y.x-sb.x)<20&&Math.abs(y.y-sb.y)<22){g.sneak.splice(k2,1);g.score+=25;popFx(sb.x,sb.y,['#ff6fb5','#fff','#ffe45e'],12);ftxt(sb.x,sb.y-10,'+25 🤖','#ff9ccd');SFX.pop();used=true;break}}}
  if(used)g.yarn.splice(i,1)}
 /* formation */
 if(g.scene==='play'||g.scene==='dead'){
  var al=aliveCount();
  if(g.en.length&&al>0){
   var spd=cfg.sp*D.spd*(1+1.4*(1-al/g.n0)),minC=99,maxC=-1,low=0,step=g.diff==='easy'?7:g.diff==='hard'?10:8;
   for(i=0;i<g.en.length;i++){q=g.en[i];if(!q.alive)continue;if(q.c<minC)minC=q.c;if(q.c>maxC)maxC=q.c}
   var ox0=(W-(cfg.c-1)*SPX)/2;
   g.fx+=g.dir*spd*dt;
   var left=ox0+g.fx+minC*SPX-20,right=ox0+g.fx+maxC*SPX+20;
   if(left<4){g.fx+=4-left;g.dir=1;g.fy+=step}else if(right>W-4){g.fx-=right-(W-4);g.dir=-1;g.fy+=step}
   for(i=0;i<g.en.length;i++){q=g.en[i];if(!q.alive)continue;
    if(q.st==='f'){q.x=ox0+q.c*SPX+g.fx;q.y=OY+q.r*SPY+g.fy+Math.sin(g.t*4+q.c)*1.5}
    else{q.dt+=dt;q.y+=(100+cfg.sp)*dt*D.spd;q.x=clamp(q.x0+Math.sin(q.dt*3)*70,22,W-22);
     if(q.y>H+34){q.st='f'}
     if(g.scene==='play'&&Math.abs(q.x-g.x)<28&&Math.abs(q.y-shipY())<34){if(hitShip()||g.inv>0){q.st='f'}}}
    if(q.st==='f'&&q.y+29>H-60)low=1;
    for(c=0;c<g.cush.length;c++)erodeRect(g.cush[c],q.x-18,q.y-28,36,57)}
   if(low&&g.scene==='play'){hitShip();g.fy=Math.max(0,g.fy-170);g.shake=.3;SFX.bonk()}
   if(g.scene==='play'){
    g.shootAcc+=cfg.sh*D.shoot*dt;
    if(g.shootAcc>=1){g.shootAcc=0;if(g.pel.length<D.pel){var cand={};for(i=0;i<g.en.length;i++){q=g.en[i];if(q.alive&&q.st==='f'&&(!cand[q.c]||q.r>cand[q.c].r))cand[q.c]=q}
     var arr=Object.keys(cand).map(function(k){return cand[k]});
     if(arr.length){var s;if(Math.random()<.4){s=arr[0];arr.forEach(function(a){if(Math.abs(a.x-g.x)<Math.abs(s.x-g.x))s=a})}else s=pick(arr);
      g.pel.push({x:s.x,y:s.y+30,vx:g.diff==='hard'?clamp((g.x-s.x)*.12,-30,30):0,vy:(108+cfg.sp*1.5)*(g.diff==='easy'?.85:g.diff==='hard'?1.15:1),rot:0})}}}
    if(cfg.dv){g.dvAcc+=cfg.dv*dt;if(g.dvAcc>=1){g.dvAcc=0;var dvn=0;g.en.forEach(function(a){if(a.alive&&a.st==='d')dvn++});
     if(dvn<2){var fc=g.en.filter(function(a){return a.alive&&a.st==='f'});if(fc.length>2){var dd=pick(fc);dd.st='d';dd.dt=0;dd.x0=dd.x;SFX.ufo()}}}}
   }
  }
  if(g.scene==='play'&&g.n0&&al===0&&!g.boss)startClear();
 }
 /* boss */
 if(g.boss){
  var b=g.boss;b.flash=Math.max(0,b.flash-dt);
  if(b.dying>0){b.dying-=dt;b.popT-=dt;if(b.popT<=0){b.popT=.17;popFx(b.x+rnd(-50,50),b.y+rnd(-55,40),CONF,8);SFX.pop()}if(b.dying<=0)bossBurst()}
  else if(b.enter>0){b.enter-=dt;var en=clamp(1-b.enter/1.7,0,1);b.y=-90+186*(1-Math.pow(1-en,3))}
  else if(g.scene==='play'){
   b.t+=dt;var half=b.hp<=b.max/2,sp=half?1.25:1;
   b.x=W/2+Math.sin(b.t*.75*sp*(g.diff==='hard'?1.2:g.diff==='easy'?.8:1))*(W/2-66);
   b.y=96+Math.sin(b.t*1.7)*6;
   b.cd-=dt;
   if(b.cd<=0){b.cd=(half?1.5:2.1)/D.shoot*(g.diff==='easy'?1.2:1)+.2;
    var nshots=half?5:3,spread=half?44:56;
    if(g.pel.length<D.pel+6)for(i=0;i<nshots;i++)g.pel.push({x:b.x,y:b.y+52,vx:(i-(nshots-1)/2)*spread*(g.diff==='easy'?.8:1),vy:105*(g.diff==='easy'?.85:g.diff==='hard'?1.15:1),rot:0});
    SFX.bonk()}
  }
 }
 if(g.flyer){var f=g.flyer;f.t+=dt;f.rot+=dt*(10+f.t*8);f.x=f.x0+Math.sin(f.t*9)*(40+f.t*70);f.y-=(40+f.t*260)*dt;
  if(Math.random()<.6)g.part.push({x:f.x,y:f.y,vx:rnd(-30,30),vy:rnd(10,60),g:0,life:.6,max:.6,col:'#bff6ff',sz:rnd(2,5),sh:'b'});
  if(f.t>1.6||f.y<-90)g.flyer=null}
 /* ufo */
 if(g.scene==='play'&&!cfg.boss&&!g.net){
  if(!g.ufo){g.ufoT-=dt;if(g.ufoT<=0&&aliveCount()>1){var from=Math.random()<.5,need=needTiger();g.ufo={x:from?-40:W+40,y:UFOY,vx:(from?1:-1)*(need?52:rnd(60,78)),hp:need?1:D.ufoHits,flash:0};g.ufoT=need?rnd(7,9):rnd(15,22);toast('🛸 '+t('ufo'));SFX.ufo()}}
  else{var u=g.ufo;u.x+=u.vx*dt;u.flash=Math.max(0,u.flash-dt);if(u.x<-60||u.x>W+60)g.ufo=null}
 }
 /* fish rain (surprise) */
 if(g.rainT>=0&&g.scene==='play'){g.rainT-=dt;if(g.rainT<=0&&g.rainN<6){g.rainN++;g.rainT=.5;g.pow.push({k:'fish',x:rnd(30,W-30),y:30,vy:80})}}
 /* sneaky bots sent by the friend */
 for(i=g.sneak.length-1;i>=0;i--){var sb2=g.sneak[i];sb2.t+=dt;sb2.y+=150*dt;sb2.x=clamp(sb2.x+clamp(g.x-sb2.x,-85*dt,85*dt)+Math.sin(sb2.t*5+sb2.ph)*40*dt,18,W-18);
  if(sb2.y>H+30){g.sneak.splice(i,1);continue}
  if(g.scene==='play'&&Math.abs(sb2.x-g.x)<24&&Math.abs(sb2.y-shipY())<26){popFx(sb2.x,sb2.y,['#ff6fb5','#fff'],10);g.sneak.splice(i,1);hitShip()}}
 /* pellets */
 for(i=g.pel.length-1;i>=0;i--){var p=g.pel[i];p.y+=p.vy*dt;p.x+=p.vx*dt;p.rot+=dt*8;
  if(p.y>H+10||p.x<-10||p.x>W+10){g.pel.splice(i,1);continue}
  var gone=false;
  for(c=0;c<g.cush.length&&!gone;c++)if(hitCush(g.cush[c],p.x,p.y)){gone=true;popFx(p.x,p.y,['#fff','#ffd6ec'],6)}
  if(!gone&&g.scene==='play'&&Math.abs(p.x-g.x)<15&&Math.abs(p.y-shipY())<16){gone=true;hitShip()}
  if(gone)g.pel.splice(i,1)}
 /* animals */
 for(i=g.anim.length-1;i>=0;i--){var a=g.anim[i];a.age+=dt;
  var mg=g.scene==='clear'&&g.clearT>1.2;
  if(mg){var ddx=g.x-a.x,ddy=shipY()-a.y,dl=Math.hypot(ddx,ddy)||1;a.x+=ddx/dl*280*dt;a.y+=ddy/dl*280*dt}
  else{a.y+=a.vy*dt;a.x+=Math.sin(a.age*2.6+a.ph)*16*dt+a.vx*dt;a.vx*=.97;a.x=clamp(a.x,22,W-22);
   if(a.vy<0)a.vy+=260*dt;
   if(Math.random()<dt*5)g.part.push({x:a.x+rnd(-14,14),y:a.y+rnd(-30,10),vx:0,vy:-12,g:0,life:.5,max:.5,col:'#fff',sz:2,sh:'r'});
   if(a.y>H-56&&a.vy>0){if(a.b<2){a.vy=-150;a.b++;SFX.boing()}else{g.helped++;g.combo=0;rescue(a.sp);ftxt(a.x,H-70,'🏃 '+EM[a.sp],'#cfd8ff');g.anim.splice(i,1);continue}}}
  if(g.scene!=='dead'&&Math.abs(a.x-g.x)<34&&Math.abs(a.y-shipY())<34){
   g.happy=.9;
   if(mg){g.caught++;g.score+=20;rescue(a.sp);popFx(a.x,a.y,CONF,8);SFX.catch();g.anim.splice(i,1);continue}
   g.caught++;g.combo++;var pts=50+Math.min(g.combo,10)*10;g.score+=pts;SFX.catch();rescue(a.sp);
   ftxt(a.x,a.y-24,'+'+pts+' '+EM[a.sp],'#7dff9a');popFx(a.x,a.y,CONF,12);
   var ci=g.combo===2?0:g.combo===4?1:g.combo===6?2:(g.combo>=9&&(g.combo-9)%3===0)?3:-1;
   if(ci>=0){announce(t('combo')[ci]);SFX.power();if(ci>=2)g.flash=Math.max(g.flash,.2)}
   if(g.net&&g.combo%4===0){g.shield=Math.max(g.shield,6);ftxt(g.x,shipY()-40,'💖 '+t('shield'),'#ff9ccd')}
   if(g.combo>(g.maxCombo||0))g.maxCombo=g.combo;
   g.anim.splice(i,1)}}
 /* powerups */
 for(i=g.pow.length-1;i>=0;i--){var w=g.pow[i];w.y+=w.vy*dt;
  if(w.y>H+12){g.pow.splice(i,1);continue}
  if(g.scene!=='dead'&&Math.abs(w.x-g.x)<30&&Math.abs(w.y-shipY())<30){
   if(w.k==='fish'){g.tri=12;ftxt(g.x,shipY()-40,'🐟 '+t('tri'),'#5ff0ff')}else{g.shield=10;if(g.lives<g.maxLives)g.lives++;ftxt(g.x,shipY()-40,'💖 '+t('shield'),'#ff9ccd')}
   g.happy=.6;SFX.power();popFx(w.x,w.y,CONF,12);g.pow.splice(i,1)}}
 /* particles / text */
 for(i=g.part.length-1;i>=0;i--){var q2=g.part[i];q2.life-=dt;if(q2.life<=0){g.part.splice(i,1);continue}q2.vy+=q2.g*dt;q2.x+=q2.vx*dt;q2.y+=q2.vy*dt}
 for(i=g.txt.length-1;i>=0;i--){var tx=g.txt[i];tx.life-=dt;tx.y-=26*dt;if(tx.life<=0)g.txt.splice(i,1)}
 /* flow */
 if(g.scene==='clear'){g.clearT+=dt;
  if((g.anim.length===0&&g.clearT>1.6&&!g.flyer)||g.clearT>9){
   g.anim.forEach(function(a){g.caught++;rescue(a.sp)});g.anim=[];
   if(g.net){netWaveDone(false)}

 document.body.classList.add('net');$('emoBar').classList.remove('cool');
 var diff=DIFF[NG.df]?NG.df:'easy';fit();
 G=baseG(diff);G.net=true;G.mode='net';G.wave=1;netSetup(1);G.scene='netwait';G.inv=0;
 setTitle();ensureAudio();startMusic();R('play');if(NT)NT.setOver(false);
 netBig('<div class="nb sm">⏳ '+nt('nWaitF')+'</div>');updNetPanel();toast(nt('nHow'));
 requestAnimationFrame(fit);
 if(role===0){var mid=NG.mid;setTimeout(function(){if(NG.on&&NG.mid===mid&&NG.phase==='wait')netBeginWave(1)},900)}
}
function netBeginWave(w){
 NG.wave=w;NG.done=[false,false];NG.myDone=false;NG.opDone=false;NG.wt=0;NG.advT=-1;
 var g=G;if(g.lives<=0)g.lives=2;
 netSetup(w);g.wave=w;g.out=false;g.scene='netcount';g.yarn=[];g.anim=[];g.pow=[];g.ufo=null;g.part=[];g.txt=[];g.sneak=[];g.pel=[];g.flyer=null;g.wasBoss=false;g.combo=0;g.streak=0;g.x=W/2;g.inv=1.5;g.clearT=0;g.deadT=0;g.flash=0;g.shake=0;g.stop=0;g.ann=null;
 NG.phase='count';NG.cdT=3;NG.cdN=4;setTitle();updNetPanel();startMusic();waveBanner();
 if(NG.role===0&&NT)NT.send({t:'nw',w:w});
}
function netSendWd(){if(NT)NT.send({t:'wd',w:NG.wave,s:Math.max(0,Math.min(99999,Math.floor(G.score))),o:G.out?1:0})}
function netWaitHtml(){
 return '<div class="nb sm">'+(G.out?'💤 '+nt('nOut'):'🎉 '+nt('nDone')+' ★ '+G.score)+'<br>⏳ '+nt('nWaitF')+'<br><span class="st" id="nbSt"></span></div>';
}
function netWaveDone(out){
 if(!NG.on||NG.phase!=='play')return;
 NG.phase='between';NG.myDone=true;NG.done[NG.role]=true;
 var g=G;g.out=!!out;g.scene='netwait';g.yarn=[];g.pel=[];g.sneak=[];g.anim=[];g.pow=[];
 SFX.win();netBig(netWaitHtml());updNetPanel();netSendWd();
}
function netEnd(){ // host: both finished the last wave
 var a=Math.floor(G.score),b=NG.op.s;if(NT)NT.send({t:'end',a:a,b:b});netMatchEnd(a,b);
}
function netMatchEnd(a,b){
 if(!G||!G.net||NG.phase==='done')return;
 NG.phase='done';NG.over=true;if(NT)NT.setOver(true);netBig('');G.scene='netwait';G.sneak=[];G.yarn=[];G.pel=[];
 var me=NG.role===0?a:b,fr=NG.role===0?b:a,w=me>fr?1:me<fr?-1:0;NG.res={a:a,b:b,me:me,fr:fr,w:w};
 if(NG.paid!==NG.mid){NG.paid=NG.mid;if(w>0)R('win');R('score',{score:me});Rflush()}
 if(w>0)SFX.fanfare();else if(w<0)SFX.lose();else SFX.win();
 openScr('<div class="card"><div style="font-size:56px;line-height:1.1">'+(w>0?'🏆':w<0?'😿':'🤝')+'</div><h2>'+(w>0?nt('nWin'):w<0?nt('nLose'):nt('nDraw'))+'</h2>'
  +'<div class="nres"><div class="nr me'+(w>0?' win':'')+'"><b>'+nt('nYou')+'</b><span>'+me+'</span></div><div class="nr fr'+(w<0?' win':'')+'"><b>'+nt('nFr')+'</b><span>'+fr+'</span></div></div>'
  +'<p id="nMsg">'+(w>0?nt('nWin2'):w<0?nt('nLose2'):nt('nDraw2'))+'</p>'
  +'<div class="row"><button class="big alt sm" id="nHome" style="flex:1;margin:0">🏠</button><button class="big sm" id="nAgain" style="flex:2;margin:0">🔁 '+nt('reBtn')+'</button></div></div>',true,null,'netres');
 $('nAgain').onclick=function(){if(!NT||!NG.on||NT.myRe)return;SFX.click();NT.rematch();$('nAgain').disabled=true;var m=$('nMsg');if(m)m.textContent=NT.t('waitRe')};
 $('nHome').onclick=function(){SFX.click();netToMenu()};
 updNetPanel();
}
function netLeft(){ // the friend left (or the link is gone for good): a kind card, never a frozen screen
 if(!(G&&G.net)||!NG.on)return;
 var had=NG.phase!=='done'&&NG.wave>0;NG.over=true;NG.phase='done';G.scene='netwait';G.sneak=[];G.yarn=[];G.pel=[];netBig('');
 openScr('<div class="card"><div style="font-size:54px">🐾</div><h2 id="nLeftT"></h2>'+(had?'<p><b>'+nt('nSoFar')+': '+nt('nYou')+' '+G.score+' · '+nt('nFr')+' '+NG.op.s+'</b></p>':'')
  +'<div class="row"><button class="big sm" id="nNew" style="flex:1;margin:0">🌐 '+nt('newRoom')+'</button><button class="big alt sm" id="nHome" style="flex:1;margin:0">🏠</button></div></div>',true,null,'netleft');
 $('nLeftT').textContent=NT?NT.t('left'):'';
 $('nNew').onclick=function(){SFX.click();netToMenu();if(NT)NT.showLobby()};
 $('nHome').onclick=function(){SFX.click();netToMenu()};
}
function netAskQuit(){
 SFX.click();
 openScr('<div class="card"><div style="font-size:48px">🏠</div><h2>'+nt('quitQ')+'</h2><div class="row"><button class="big sm" id="nStay" style="flex:1;margin:0">'+nt('stay')+'</button><button class="big alt sm" id="nQuit" style="flex:1;margin:0">'+nt('quit')+'</button></div></div>',true,null,'netquit');
 $('nStay').onclick=function(){SFX.click();closeScr()};$('nQuit').onclick=function(){SFX.click();netToMenu()};
}
function netToMenu(){
 var was=NG.on;
 if(was){NG.on=false;NG.phase='off';document.body.classList.remove('net');netBig('');if(NT)NT.leaveToMenu()}
 showMenu();if(was)requestAnimationFrame(fit);
}
function netStreak(){ // every 4 cage-balloons in a row without a miss: a sneaky bot for the friend (at most one per 2 s)
 var g=G;g.streak++;
 if(g.streak%4===0&&NG.on&&NG.phase==='play'&&NT){var n=performance.now();
  if(n-NG.sbT>=2000){NG.sbT=n;NT.send({t:'sb',n:g.streak%8===0?2:1});ftxt(g.x,shipY()-70,'🤖 '+nt('nSent'),'#ff9ccd');SFX.power()}}
}
function netLeft0(){var g=G;return g.boss?Math.max(0,Math.min(99,g.boss.hp)):Math.min(99,aliveCount())}
function updNetPanel(){
 if(!G||!G.net)return;
 var o=NG.op;$('nMeL').textContent=nt('nYou');$('nFrL').textContent=nt('nFr');
 $('nMeS').textContent='★ '+G.score+' ❤'+Math.max(0,G.lives);
 $('nFrS').textContent=o.seen?('★ '+o.s+' ❤'+o.l+' '+o.w+'/3'):'…';
 var key=o.seen?o.e:-1;
 if(key!==NG.dotsKey){NG.dotsKey=key;var h='';for(var i=0;i<Math.min(30,Math.max(0,key));i++)h+='<i></i>';$('nDots').innerHTML=h}
 var e=$('nbSt');if(e)e.textContent=o.seen?'★ '+o.s+'  ❤'+o.l:'';
}
function netTick(dt){
 if(!NG.on||!G||!G.net||NG.netp)return;
 var i;NG.mt+=dt;
 for(i=0;i<NG.emo.length;i++)NG.emo[i].t+=dt;NG.emo=NG.emo.filter(function(e){return e.t<1.8});
 if(NG.bigT>0){NG.bigT-=dt;if(NG.bigT<=0&&NG.phase==='play')netBig('')}
 var ph=NG.phase;
 if(ph==='count'){
  NG.cdT-=dt;var n=Math.ceil(NG.cdT-1e-6);
  if(NG.cdT<=0){NG.phase='play';G.scene='play';G.inv=1.2;NG.bigT=.8;netBig('<div class="nb go">'+t('go')+'</div>');SFX.power()}
  else if(n!==NG.cdN){NG.cdN=n;netBig('<div class="nb">'+n+'</div>');SFX.click()}
 }
 if(NG.phase==='play'||NG.phase==='between'){
  NG.wt+=dt;
  if(NG.phase==='play'&&NG.wt>=90&&(G.scene==='play'||G.scene==='clear'||G.scene==='dead'))netWaveDone(G.scene==='dead'||G.lives<=0);
  if(NG.role===0&&NG.phase==='between'&&!NG.done[1]&&NG.wt>=100)NG.done[1]=true; // a friend who never reports cannot hold the match
  if(NG.role===0&&NG.phase==='between'&&NG.done[0]&&NG.done[1]){
   if(NG.advT<0)NG.advT=1.6;NG.advT-=dt;
   if(NG.advT<=0){NG.advT=-1;if(NG.wave<3)netBeginWave(NG.wave+1);else netEnd()}}
 }
 if(NG.phase!=='done'&&NG.phase!=='wait'){
  NG.stT-=dt;if(NG.stT<=0){NG.stT=.33;if(NT)NT.send({t:'st',s:Math.max(0,Math.min(99999,Math.floor(G.score))),l:Math.max(0,Math.min(9,G.lives)),w:Math.max(1,Math.min(3,NG.wave||1)),e:netLeft0()})}
 }
 NG.uiT-=dt;if(NG.uiT<=0){NG.uiT=.15;updNetPanel()}
}
function showEmo(i,side){NG.emo.push({i:i,side:side,t:0});if(NG.emo.length>4)NG.emo.shift();if(side==='o')tone(880,.09,'triangle',.07,440)}
function sendEmo(i){
 var now=performance.now();if(!NT||!NG.on||!G||!G.net||NG.phase==='done'||!iN(i,0,3)||now-NG.emT<1000)return;
 NG.emT=now;NT.send({t:'em',i:i});showEmo(i,'p');SFX.click();
 var bar=$('emoBar');bar.classList.add('cool');setTimeout(function(){bar.classList.remove('cool')},1000);
}
function drawNetOver(){
 var i;for(i=0;i<NG.emo.length;i++){var e=NG.emo[i],a=Math.min(1,(1.8-e.t)*2),x=e.side==='o'?W*.78:W*.22,yy=H*.3-e.t*46,sc=e.t<.2?.4+e.t*3:1;
  cx.globalAlpha=Math.max(0,a);cx.fillStyle='#fff';cx.beginPath();cx.arc(x,yy,27*sc,0,6.3);cx.fill();cx.strokeStyle=e.side==='o'?'#5ff0ff':'#ff6fb5';cx.lineWidth=4;cx.stroke();
  cx.font=Math.round(32*sc)+'px '+EFONT;cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#000';cx.fillText(EMO_SET[e.i],x,yy+2);cx.globalAlpha=1}
}
/* ---- messages from the friend (already authenticated by net1v1, still treated as hostile) ---- */
function scoreOk(s){return iN(s,0,99999)&&s<=800+400*NG.mt}
function netMayAdvance(){return NG.wave===0||NG.phase==='between'||NG.wt>=88} // the host moves on only after I reported this wave (or the wave cap passed)
function netData(d){
 if(!NG.on||!d||typeof d!=='object'||typeof d.t!=='string'||!G||!G.net)return;
 var now=performance.now(),host=NG.role===0,o=NG.op,i;
 switch(d.t){
 case'em':if(iN(d.i,0,3)&&now-NG.emRx>500){NG.emRx=now;showEmo(d.i,'o')}break;
 case'st':
  if(!iN(d.l,0,9)||!iN(d.w,1,3)||!iN(d.e,0,99)||!scoreOk(d.s)||d.s<o.s||now-NG.stRx<120)return;
  NG.stRx=now;o.s=d.s;o.l=d.l;o.w=d.w;o.e=d.e;o.seen=true;break;
 case'wd':
  if(!iN(d.w,1,3)||!iN(d.o,0,1)||!scoreOk(d.s)||d.s<o.s||d.w!==NG.wave)return;
  o.s=d.s;o.seen=true;o.e=0;NG.opDone=true;if(host)NG.done[1]=true;break;
 case'sb':
  if(NG.phase!=='play'||G.scene!=='play'||!iN(d.n,1,2)||now-NG.sbRx<1800)return;NG.sbRx=now;
  for(i=0;i<d.n;i++)if(G.sneak.length<3)G.sneak.push({x:rnd(40,W-40),y:-24-i*60,t:0,ph:rnd(0,6)});
  ftxt(W/2,90,'⚠ 🤖 '+nt('nInc'),'#ff6fb5');SFX.ufo();break;
 case'nw': // guest: the host starts the next wave for both
  if(host||NG.phase==='done'||!iN(d.w,1,3)||d.w!==NG.wave+1||!netMayAdvance())return;netBeginWave(d.w);break;
 case'end':
  if(host||NG.phase==='done'||NG.wave<3||!iN(d.a,0,99999)||!iN(d.b,0,99999))return;netMatchEnd(d.a,d.b);break;
 case'full': // guest: after a connection pause the host sends one complete snapshot
  if(host||NG.phase==='done'||!iN(d.w,0,3)||!iN(d.ph,0,4)||!iN(d.a,0,99999)||!iN(d.b,0,99999)||!iN(d.dn,0,3))return;
  if(d.ph===4&&d.w===3&&NG.wave===3){netMatchEnd(d.a,d.b);return}
  if(d.w>NG.wave&&d.w<=3&&d.ph>=1&&d.ph<=3&&netMayAdvance())netBeginWave(d.w);
  else if(NG.phase==='between'&&NG.myDone&&d.w===NG.wave)netSendWd();
  break;
 }
}
function netFull(){ // host: after the connection is back, one complete snapshot
 if(!(G&&G.net&&NG.role===0&&NT))return;
 var ph={wait:0,count:1,play:2,between:3,done:4}[NG.phase]||0,r=NG.res||{a:0,b:0};
 NT.send({t:'full',w:NG.wave,ph:ph,a:Math.min(99999,Math.floor(G.score)),b:Math.min(99999,NG.op.s),dn:(NG.done[0]?1:0)+(NG.done[1]?2:0)});
 if(NG.phase==='done'&&NG.res)NT.send({t:'end',a:r.a,b:r.b});
 else if(NG.phase==='between'&&NG.myDone)netSendWd();
}

/* online matches keep running while the tab is in the background (the friend keeps playing) */
setInterval(function(){

},250);

 var r=NG.res;return{on:NG.on,role:NG.role,phase:NG.phase,wave:NG.wave,seed:NG.seed,df:NG.df,done:NG.done.slice(),myDone:NG.myDone,opDone:NG.opDone,wt:NG.wt,mt:NG.mt,cdT:NG.cdT,netp:NG.netp,over:NG.over,res:r?{a:r.a,b:r.b,me:r.me,fr:r.fr,w:r.w}:null,op:{s:NG.op.s,l:NG.op.l,w:NG.op.w,e:NG.op.e,seen:NG.op.seen},emo:NG.emo.map(function(e){return{i:e.i,side:e.side}}),
  score:G?G.score:0,lives:G?G.lives:0,scene:G?G.scene:'',out:G?!!G.out:false,sneak:G&&G.sneak?G.sneak.length:0,streak:G?G.streak:0,shield:G?G.shield:0,left:G&&G.net?netLeft0():0,
  sig:G&&G.net&&G.cfg?JSON.stringify([G.cfg.boss||0,G.cfg.r||0,G.cfg.c||0,G.cfg.star,(G.en||[]).map(function(e){return e.sp+(e.star?'*':'')}).join(',')]):'',ctx:!!G}
}

window.__invaders={
 NT:NT,NG:NG,net:netInfo,netEmote:sendEmo,pop:function(n){var c=0;(G.en||[]).forEach(function(e){if(e.alive&&c<n){c++;popEnemy(e)}})},
 state:function(){var g=G,b=g.boss;return{scene:g.scene,screen:scrName,paused:!!g.paused,mode:g.mode,level:g.lvl,wave:g.wave||0,diff:g.diff,lives:g.lives,score:g.score,enemies:g.en?aliveCount():0,boss:b?b.hp:null,bossX:b?b.x:null,bossEnter:b?b.enter:null,bossDying:b?b.dying:null,flyer:!!g.flyer,yarn:g.yarn?g.yarn.length:0,pellets:g.pel?g.pel.length:0,animals:g.anim?g.anim.length:0,released:g.released,caught:g.caught,helped:g.helped,combo:g.combo,shield:g.shield,tri:g.tri,ufo:!!g.ufo,x:g.x,H:H,zoo:save.zoo.slice(),unlocked:save.unlocked,stars:save.stars,best:save.best,hi:save.hi.slice(),lang:lang,muted:muted,stars_got:g.starsGot,win:g.win,rec:g.rec,rank:g.rank,newF:g.newF?g.newF.slice():[]}},
 debug:function(){var g=G;return{x:g.x,shipY:shipY(),H:H,W:W,boss:g.boss?{x:g.boss.x,y:g.boss.y,hp:g.boss.hp}:null,ufo:g.ufo?{x:g.ufo.x,y:g.ufo.y}:null,pel:(g.pel||[]).map(function(p){return[p.x,p.y,p.vx,p.vy]}),anim:(g.anim||[]).map(function(a){return[a.x,a.y,a.sp]}),en:(g.en||[]).filter(function(e){return e.alive}).map(function(e){return[e.x,e.y,e.st]}),pow:(g.pow||[]).map(function(p){return[p.x,p.y,p.k]})}},
 start:function(n,d){startLevel(n,d)},

buildSprites();syncBtns();applyLang();fit();
