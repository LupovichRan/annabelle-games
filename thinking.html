<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:linear-gradient(#9a86ff,#6a4be0 65%,#4b2fc0);font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew",Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}

 #menu{gap:12px}#mBtns{grid-template-columns:repeat(4,1fr);width:min(100%,1040px);gap:16px}.mb{min-height:140px;font-size:23px}.mb .e{font-size:48px}.mb small{font-size:14px}

}

<script>
(function(){'use strict';
const KEY='annabelle-thinking';
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/*GEN-START*/
/* ============ puzzle generators (pure: no DOM; every puzzle is verified to have exactly one valid option) ============ */
let RND=Math.random,UID=0;
const rnd=n=>Math.floor(RND()*n),rr=(a,b)=>a+rnd(b-a+1),pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1),x=a[i];a[i]=a[j];a[j]=x}return a}
const sample=(a,n)=>shuffle(a).slice(0,n),mod=(a,n)=>((a%n)+n)%n;
const TYPES=['matrix','analogy','series','odd','fold','cubes','balance','machine','mirror'];
const COLS=['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa'],C5=[0,1,2,3,4];
const SYM=['circle','square','star','diamond','hex','cross'],ASYM=['arrow','pac','heart','bolt','tri'],ALLS=SYM.concat(ASYM);
const SIZES=[.5,.75,1];
const POS={1:[[50,50]],2:[[27,50],[73,50]],3:[[50,27],[27,72],[73,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[24,24],[76,24],[50,50],[24,76],[76,76]],6:[[22,30],[50,30],[78,30],[22,70],[50,70],[78,70]]};
const BASER={1:40,2:21,3:19,4:19,5:15,6:13};
const r2=v=>Math.round(v*100)/100;
const starPts=(function(){const p=[];for(let i=0;i<10;i++){const r=i%2?.42:1,a=(-90+36*i)*Math.PI/180;p.push(r2(Math.cos(a)*r)+','+r2(Math.sin(a)*r))}return p.join(' ')})();
const hexPts=(function(){const p=[];for(let i=0;i<6;i++){const a=(60*i)*Math.PI/180;p.push(r2(Math.cos(a)*.95)+','+r2(Math.sin(a)*.95))}return p.join(' ')})();
function shapeEl(s,at){switch(s){
 case 'circle':return '<circle r="0.9" '+at+'/>';
 case 'square':return '<rect x="-0.8" y="-0.8" width="1.6" height="1.6" rx="0.1" '+at+'/>';
 case 'tri':return '<polygon points="0,-0.95 0.98,0.8 -0.98,0.8" '+at+'/>';
 case 'star':return '<polygon points="'+starPts+'" '+at+'/>';
 case 'diamond':return '<polygon points="0,-1 0.68,0 0,1 -0.68,0" '+at+'/>';
 case 'hex':return '<polygon points="'+hexPts+'" '+at+'/>';
 case 'heart':return '<path d="M0,0.92 C-1.15,0.05 -0.95,-1.05 0,-0.42 C0.95,-1.05 1.15,0.05 0,0.92Z" '+at+'/>';
 case 'cross':return '<polygon points="-0.3,-0.95 0.3,-0.95 0.3,-0.3 0.95,-0.3 0.95,0.3 0.3,0.3 0.3,0.95 -0.3,0.95 -0.3,0.3 -0.95,0.3 -0.95,-0.3 -0.3,-0.3" '+at+'/>';
 case 'arrow':return '<polygon points="0,-1 0.82,-0.12 0.3,-0.12 0.3,1 -0.3,1 -0.3,-0.12 -0.82,-0.12" '+at+'/>';
 case 'pac':return '<path d="M0.05,0 L0.8,-0.52 A0.95,0.95 0 1,0 0.8,0.52 Z" '+at+'/>';
 default:return '<polygon points="0.15,-1 -0.6,0.12 -0.08,0.12 -0.3,1 0.62,-0.25 0.1,-0.25 0.42,-1" '+at+'/>'}}
function figInner(f){const col=COLS[f.color];let defs='',fill;
 if(f.fill===0)fill='fill="'+col+'" stroke="#2b2350"';
 else if(f.fill===1)fill='fill="#fff" stroke="'+col+'"';
 else{const id='tp'+(++UID);defs='<defs><pattern id="'+id+'" width="0.36" height="0.36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="0.36" height="0.36" fill="#fff"/><rect width="0.17" height="0.36" fill="'+col+'"/></pattern></defs>';fill='fill="url(#'+id+')" stroke="'+col+'"'}
 const at=fill+' stroke-width="'+(f.fill===0?2.5:4)+'" vector-effect="non-scaling-stroke" stroke-linejoin="round"',r=BASER[f.count]*SIZES[f.size];
 return defs+POS[f.count].map(p=>'<g transform="translate('+p[0]+','+p[1]+') rotate('+(f.rot*90)+') scale('+r+')">'+shapeEl(f.shape,at)+'</g>').join('')}
const FA=['shape','color','fill','count','size','rot'];
const fkey=f=>FA.map(a=>f[a]).join('|');
function mutate(f,a,pool){const g=Object.assign({},f);for(let t=0;t<20;t++){
 if(a==='shape')g.shape=pick(pool&&pool.length>1?pool:(ASYM.indexOf(f.shape)>=0?ASYM:SYM));
 else if(a==='color')g.color=rnd(5);else if(a==='fill')g.fill=rnd(3);
 else if(a==='count')g.count=Math.max(1,Math.min(6,f.count+pick([-1,1,2,-2])));
 else if(a==='size')g.size=rnd(3);else g.rot=mod(f.rot+rr(1,3),4);
 if(g[a]!==f[a])return g}return g}
function valsOf(a,n,rotOn){if(a==='shape')return sample(rotOn?ASYM:ALLS,n);if(a==='color')return sample(C5,n);if(a==='fill'||a==='size')return sample([0,1,2],n);if(a==='count')return sample([1,2,3,4,5],n);return sample([0,1,2,3],n)}
function numOpts(ans,extra,spread){const set=new Set([ans]),out=[ans],sp=spread||[1,2,10];
 shuffle((extra||[]).filter(x=>Number.isInteger(x)&&x>=0)).forEach(c=>{if(out.length<4&&!set.has(c)){set.add(c);out.push(c)}});
 let g=0;while(out.length<4&&g++<300){const c=ans+pick([-1,1])*pick(sp)*rr(1,2);if(c>=0&&!set.has(c)){set.add(c);out.push(c)}}
 return out}
/* opts[0] is the answer unless keep is given (then opts stay in order and keep is the answer index) */
function pack(type,L,p,stem,opts,validFn,ex,keep,more){let O=opts,ci=keep;

  const m=bySkill(),g=el('div','skg');let worst=null,wr=1;
  TYPES.forEach(k=>{const x=m[k];if(!x)return;const rt=x.ok/x.n,d=el('div','skc '+(rt>=.99?'hi2':rt>=.5?'mid':'lo'));d.dataset.skill=k;d.appendChild(el('span',null,TINFO[k]+' '+t('ty_'+k)));d.appendChild(el('b',null,x.ok+'/'+x.n));g.appendChild(d);if(rt<wr){wr=rt;worst=k}});
  c.appendChild(g);c.appendChild(el('p',null,worst?t('tip',{s:TINFO[worst]+' '+t('ty_'+worst)}):t('allGood')));c.appendChild(hiTable(me));
  const r=el('div','row2');r.appendChild(btn('g',t('again'),()=>startRound('mock')));r.appendChild(btn('w',t('menu'),toMenu));c.appendChild(r)}
 else{win=G.ok>=Math.ceil(G.total/2);c.appendChild(el('div','big',TINFO[ty]));c.appendChild(el('h2',null,t('pracT')));c.appendChild(el('p',null,t('ty_'+ty)+' · '+t('level',{n:getLv(ty)})));c.appendChild(res());c.appendChild(statPills());
  const r=el('div','row2');r.appendChild(btn('g',t('again'),()=>startRound('prac',ty)));r.appendChild(btn('w',t('back'),()=>openMap('prac')));c.appendChild(r)}
 save();award(aw);flushR();track('game_end',{sec:Math.round(G.secs),score:G.score,win:win,mode:mode});
 showOv();if(win){SFX.fan();confetti()}else SFX.click()}
function pause(){if(SCR!=='play'||G.paused||G.phase==='done'||G.phase==='idle'||!G.mode)return;G.paused=true;const c=clear($('card'));c.appendChild(el('h2',null,'⏸ '+t('paused')));
 c.appendChild(btn('g',t('resume'),resume));const m=G.mode,ty=G.type,lv=G.level;c.appendChild(btn('w',t('restart'),()=>startRound(m,ty,lv)));
 if(m==='adv'||m==='prac')c.appendChild(btn('w',t('toMap'),()=>openMap(m)));c.appendChild(btn('w',t('menu'),toMenu));
 if(document.documentElement.classList.contains('desk')){const p=el('p',null,t('tipD'));p.style.fontSize='13px';p.style.opacity='.7';c.appendChild(p)}
 const ns=el('div');ns.id='navSlot';c.appendChild(ns);showOv()}
function resume(){if(!G.paused)return;G.paused=false;lastTs=0;hideOv();G.qT=performance.now()}
/* ============ clock ============ */
let lastTs=0;
setInterval(()=>{const now=performance.now(),dt=lastTs?Math.min(1,(now-lastTs)/1000):0;lastTs=now;if(SCR!=='play'||G.paused||!G.mode||G.phase==='done'||G.phase==='idle')return;
 G.secs+=dt;if(G.mode!=='mock')return;G.left-=dt;hud();if(G.left<=0){G.left=0;G.timeUp=true;finish()}},250);
/* ============ input wiring ============ */
$('pauseBtn').onclick=()=>{SFX.click();pause()};$('muteBtn').onclick=toggleMute;$('exB').onclick=()=>{SFX.click();cont()};$('hintBtn').onclick=hint;
$('mapBack').onclick=()=>{SFX.click();toMenu()};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
 if($('ov').classList.contains('on')){if(k==='Enter'||k===' '){const b=$('card').querySelector('.btn');if(b){e.preventDefault();b.click()}}else if((k==='p'||k==='P'||k==='פ'||k==='Escape')&&G.paused)resume();return}
 if(SCR!=='play')return;
 if(k==='p'||k==='P'||k==='פ'||k==='Escape'){pause();return}
 if(G.phase==='explain'){if(k==='Enter'||k===' '){e.preventDefault();cont()}return}
 if(G.phase!=='ask')return;
 if(k==='h'||k==='H'||k==='י')hint();else if(/^[1-6]$/.test(k)){const i=+k-1;if(i<G.q.opts.length)choose(i)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
let rsT=0;addEventListener('resize',()=>{fxSize();clearTimeout(rsT);rsT=setTimeout(()=>{if(SCR==='play'&&G.q&&G.phase!=='done')drawStem(G.phase==='explain')},60)});
document.addEventListener('pointerdown',()=>{ac()},{passive:true});
/* ============ boot ============ */
setLang(lang);fxSize();renderMenu();show('menu');
window.__thinking={
 state(){const q=G.q;return {screen:SCR,mode:G.mode,type:G.type||null,phase:G.phase,n:G.n|0,total:G.total|0,ok:G.ok|0,score:G.score|0,hints:G.hints|0,left:G.left||0,paused:!!G.paused,lang:lang,kidLevel:kidLevel(),
  q:q?{type:q.type,level:q.level,p:q.p,ci:q.ci,n:q.opts.length,keys:q.opts.map(o=>o.key),valid:q.valid.slice()}:null,save:JSON.parse(JSON.stringify(SV)),over:$('ov').classList.contains('on')}},
 gen(type,level){return makeQ(type,level||1)},
 answer(i){if(G.phase==='explain')cont();if(G.phase!=='ask')return false;const q=G.q;if(i===undefined||i===true)i=q.ci;else if(i===false)i=(q.ci+1)%q.opts.length;return choose(i)},
 start(mode,type,level){startRound(mode||'prac',type||TYPES[0],level)},
 next:cont,hint:hint,pause:pause,resume:resume,toMenu:toMenu,types:TYPES.slice(),verify:verify,
 setLang(l){setLang(l);if(SCR==='menu')renderMenu();else if(SCR==='play'&&G.q){renderQ()}},timeUp(){if(G.mode==='mock'){G.left=0}},reload(){SV=loadSave()}};
})();
</script>
