/* ---------------- AI ---------------- */
function predictX(b,yT){
  if(!b.vy)return b.x;const tt=(yT-b.y)/b.vy;if(tt<=0)return b.x;
  if(b.curve){ // follow the curved path (same maths as ballTick)
    let x=b.x,y=b.y,vx=b.vx,vy=b.vy,c=b.curve;const dt=1/40;
    for(let i=0;i<480;i++){
      if(c){const a=c*dt,cs=Math.cos(a),sn=Math.sin(a),nx=vx*cs-vy*sn,ny=vx*sn+vy*cs;if(ny*vy>0&&Math.abs(ny)>=b.speed*.5){vx=nx;vy=ny}else c=0;c*=Math.exp(-dt*CD);if(Math.abs(c)<.03)c=0}
      x+=vx*dt;y+=vy*dt;
      if(x<FL+BR){x=FL+BR;if(vx<0){vx=-vx;c*=-.4}}else if(x>FR-BR){x=FR-BR;if(vx>0){vx=-vx;c*=-.4}}
      if(vy<0?y<=yT:y>=yT)break;
    }
    return x;
  }
  const lo=FL+BR,span=FR-BR-lo;let m=(b.x+b.vx*tt-lo)%(2*span);if(m<0)m+=2*span;return lo+(m>span?2*span-m:m);
}
function planBot(){
  const a=O.ai;if(!a||G.kind!=='story')return;
  const e=G.diff==='easy',h=G.diff==='hard';
  const p=(e?.34:h?.07:.19)*(1-G.lvl*.035)*(O.bot.boss?.8:1)+G.rally*(e?.045:h?.01:.02)+(G.so-G.sp>=2?(e?.15:.05):0)+(e&&G.mercyLvl===G.lvl?G.mercy*.08:0);
  if(Math.random()<p){a.err=(Math.random()<.5?-1:1)*(O.w/2+BR+8+Math.random()*28);a.miss=true}
  else{a.err=(Math.random()-.5)*O.w*(e?.6:h?.25:.4);a.miss=false}
  a.react=(e?.42:h?.1:.24)*(O.bot.q==='nap'?1.4:1);
}
function ai(o,dt){
  const a=o.ai,B=o.bot,q=B.q,e=G.diff==='easy',h=G.diff==='hard';
  if(a.moodT>0){a.moodT-=dt;if(a.moodT<=0&&a.mood!=='sleep')a.mood='idle'}
  let b=null,bt=1e9;
  for(const k of G.balls){if(k.stuck||k.vy>=0)continue;const tt=(k.y-o.y)/(-k.vy);if(tt<bt){bt=tt;b=k}}
  const hy=o.y+PH/2+BR,m0=G.balls[0];
  if(q==='wall'){const tx=b?predictX(b,hy):W/2+((m0?m0.x:W/2)-W/2)*.6,m=(b?1600:300)*dt;o.x+=clamp(tx-o.x,-m,m);return}
  const maxV=(e?125:h?245:180)*B.spd*(G.v0/200)*(G.turbo?1.2:1);
  let tx=b?predictX(b,hy)+a.err:W/2+((m0?m0.x:W/2)-W/2)*.35;
  if(a.react>0){a.react-=dt;tx=a.last}else a.last=tx;
  if(q==='nap'){
    if(a.nap>0){a.nap-=dt;a.mood='sleep';if(a.nap<=0){a.mood='idle';a.napT=rnd(3,5.5)}return}
    a.napT-=dt;if(a.napT<=0&&G.phase==='rally'){a.nap=e?rnd(1.7,2.5):h?rnd(.6,.9):rnd(1,1.5);a.mood='sleep';SFX.zz();return}
  }
  if(q==='zig')tx+=Math.sin(G.time*5)*(e?44:34);
  if(q==='jitter')tx+=Math.sin(G.time*13)*16+Math.sin(G.time*7.3)*14;
  if(q==='copy'){const dd=P.y-o.y,cl=b?clamp(1-(b.y-o.y)/dd,0,1):0;tx=P.x+(tx-P.x)*Math.pow(cl,e?2.2:h?.9:1.5)}
  if(q==='slide'){const k=e?10:16,c=e?1.6:2.4;a.v+=((tx-o.x)*k-a.v*c)*dt;a.v=clamp(a.v,-maxV*1.6,maxV*1.6);o.x+=a.v*dt;if(o.x<FL+o.w/2-8||o.x>FR-o.w/2+8)a.v*=-.4;return}
  if(q==='hop'){a.hopT-=dt;if(a.hopT<=0){a.hopT=e?.5:h?.3:.4;const hop=e?52:h?80:64;a.gx=o.x+clamp(tx-o.x,-hop,hop);if(Math.abs(a.gx-o.x)>6)a.hopA=1}a.hopA=Math.max(0,a.hopA-dt*5);const m=700*dt;o.x+=clamp(a.gx-o.x,-m,m);return}
  const m=maxV*dt;o.x+=clamp(tx-o.x,-m,m);
}
function botShot(o,b,ang){
  const q=o.bot.q,e=G.diff==='easy',h=G.diff==='hard',dd=P.y-o.y;
  if(q==='wall'){const A=Math.min(.8,.3+G.returns*.012),r=(Math.random()*2-1)*A;return e?r*.6+Math.atan2(P.x-b.x,dd)*.4:r}
  if(e){ang=ang*.45+Math.atan2(P.x-b.x,dd)*.55}
  else if(h){const cn=P.x<W/2?FR-36:FL+36;ang=ang*.6+Math.atan2(cn-b.x,dd)*.4}
  if(q==='zig'){b.zig=e?16:h?28:18;b.zt=0}
  else if(q==='smash'&&Math.random()<(e?.35:.5)){b.fast=e?1.2:h?1.42:1.3;pop(t('boom'),b.x,o.y+46,'#ff5a2e',26);G.shake=.3;G.hitstop=.06;SFX.boom()}
  else if(q==='ghost'){b.ghostY=o.y+dd*(e?.38:h?.62:.5);b.ghostA=e?.4:h?.1:.2}
  else if(q==='curve'){const s=e?(Math.random()<.5?-1:1):(P.x>b.x?1:-1);b.curve=s*(e?rnd(.4,.6):h?rnd(.95,1.25):rnd(.6,.9))*(G.turbo?1.15:1)}
  return clamp(ang,-MAXA,MAXA);
}

function padTick(dt,frz){
  for(const p of [P,O]){

    const tw=p.bw*(p.bigT>0?1.5:1);p.w+=(tw-p.w)*Math.min(1,dt*10);
    if(p.rem){const m=2600*dt;p.x+=clamp((p.tx-p.x)*Math.min(1,dt*40),-m,m)} // online: the friend's paw follows her last report (no teleports)
    else if(p.human){
      if(p.kdir){p.kv+=(p.kdir*G.kspd-p.kv)*Math.min(1,dt*14);p.x+=p.kv*dt;p.tx=p.x}

function trail(b){const tr=b.trail,l=tr[tr.length-1];if(!l||Math.abs(l.x-b.x)+Math.abs(l.y-b.y)>5){tr.push({x:b.x,y:b.y});if(tr.length>24)tr.shift()}}
function rmBall(b){const i=G.balls.indexOf(b);if(i>=0)G.balls.splice(i,1)}
function ballTick(b,dt){
  b.sq=Math.max(0,b.sq-dt*7);
  if(b.stuck){const p=b.stuck;b.x=clamp(p.x+b.stOff,FL+BR,FR-BR);b.y=p.y-p.dir*(PH/2+BR);b.stT-=dt;b.rot+=dt*14;b.trail.length=0;if(b.stT<=0||p.rel){p.rel=false;b.stuck=null;b.stOff=b.x-p.x;hit(p,b)}return}
  const mul=(G.slowT>0?.55:1)*b.fast;
  if(b.curve){
    const a=b.curve*dt*mul,c=Math.cos(a),s=Math.sin(a),vx=b.vx*c-b.vy*s,vy=b.vx*s+b.vy*c;
    if(vy*b.vy>0&&Math.abs(vy)>=b.speed*.5){b.vx=vx;b.vy=vy}else b.curve=0;
    b.curve*=Math.exp(-dt*CD*mul);if(Math.abs(b.curve)<.03)b.curve=0;

  if(G.net>0&&b.vy>0&&!b.bonus){const ny=H-34;if(b.y+BR>=ny&&b.y-BR<ny+16){b.vy=-Math.abs(b.vy);b.y=ny-BR;G.net--;G.netFx=1;b.sq=1;b.sqA=0;pop(t('saved'),W/2,ny-40,'#ffd6e7',20);burst(b.x,ny,'✨',8);SFX.net();planBot()}}

function wallFx(b,x){b.sq=1;b.sqA=1;SFX.wall();burst(x,b.y,null,3)}
function collide(p,b){

function hit(p,b){

  if(G.kind==='net'){if(p===P)NG.hitP++;else NG.hitO++}
  let ang=off*MAXA;
  b.fast=1;b.zig=0;b.ghostY=null;b.curve=0;

  else ang=botShot(p,b,ang);

function drawMascot(){
  const c=$('masc');if(!c||!$('ovMenu').classList.contains('on'))return;
  const x=c.getContext('2d'),T=performance.now()/1000,u=4,bob=Math.round(Math.sin(T*3)*2),blink=(T%3.3)<.15;
  x.clearRect(0,0,c.width,c.height);
  const R=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a*u,b*u+bob,w*u,h*u)};
  R(7,2,5,6,'#000');R(18,2,5,6,'#000');R(8,3,3,5,'#ff9a2e');R(19,3,3,5,'#ff9a2e');R(9,4,1,3,'#ff8fb8');R(20,4,1,3,'#ff8fb8');
  R(5,6,20,16,'#000');R(6,7,18,14,'#ff9a2e');
  R(14,7,2,3,'#c25a0a');R(11,7,1,2,'#c25a0a');R(18,7,1,2,'#c25a0a');R(6,13,2,1,'#c25a0a');R(6,15,2,1,'#c25a0a');R(22,13,2,1,'#c25a0a');R(22,15,2,1,'#c25a0a');
  R(11,15,8,5,'#fff4d6');
  if(blink){R(9,12,3,1,'#000');R(18,12,3,1,'#000')}else{R(9,10,3,4,'#fff');R(18,10,3,4,'#fff');R(10,11,2,3,'#000');R(19,11,2,3,'#000')}
  R(14,15,2,1,'#ff5a8a');R(13,17,1,1,'#000');R(16,17,1,1,'#000');R(14,18,2,1,'#000');
  const sw=Math.sin(T*6),py=Math.round(sw*2);
  x.fillStyle='#000';x.fillRect(26*u,(15+py)*u,8*u,6*u);x.fillStyle='#ff9a2e';x.fillRect(27*u,(16+py)*u,6*u,4*u);x.fillStyle='#ff8fb8';x.fillRect(28*u,(17+py)*u,u,u);x.fillRect(30*u,(17+py)*u,u,u);x.fillRect(32*u,(17+py)*u,u,u);
  const by=(11-Math.abs(sw)*7.5)*u,bx=30*u;
  x.fillStyle='#000';x.beginPath();x.arc(bx,by,3.5*u,0,7);x.fill();x.fillStyle='#ff5a8a';x.beginPath();x.arc(bx,by,2.9*u,0,7);x.fill();
  x.strokeStyle='#c2244f';x.lineWidth=2;x.beginPath();x.arc(bx-9,by,13,-.6,.6);x.stroke();x.beginPath();x.arc(bx+9,by,13,2.54,3.74);x.stroke();
}

    db.sq=Math.max(0,db.sq-fdt*7);db.rot+=fdt*(st.wait>0?3:(5+Math.abs(st.vx)*.03)*(st.vx>=0?1:-1));
    if(!st.stuck&&!(st.wait>0))trail(db);
    out.push(db);
  }
  G.balls=out;for(const k in NG.latch)if(!out.some(b=>b.id===+k))delete NG.latch[k];
  for(const sw of S.pows){let w=G.pows.find(x=>x.id===sw.id);if(!w)w={id:sw.id,type:sw.type,x:sw.x,y:sw.y};else{const k=Math.min(1,fdt*18);w.x+=(sw.x-w.x)*k;w.y+=(sw.y-w.y)*k}pw.push(w)}
  G.pows=pw;
}
/* ---- emotes ---- */
function showEmo(i,side){NG.emo.push({i,side,t:0});if(NG.emo.length>4)NG.emo.shift();if(side==='o')tone(880,.09,'triangle',.09,1320)}
function sendEmo(i){
  const now=performance.now();if(!NT||!NG.on||G.kind!=='net'||!int(i,0,3)||now-NG.emT<1000)return;
  NG.emT=now;NT.send({t:'em',i});showEmo(i,'p');SFX.click();
  const bar=$('emoBar');bar.classList.add('cool');setTimeout(()=>bar.classList.remove('cool'),1000);
}
/* ---- end of an online match ---- */
function netScore(){const me=NG.role;return '<bdi>'+t('you')+' '+AV[me]+'</bdi>&nbsp;'+(G.sp|0)+' : '+(G.so|0)+'&nbsp;<bdi>'+AV[1-me]+' '+t('fr1')+'</bdi>'}
function finishNet(){
  if(G.mode==='result')return;G.mode='result';hideBanner();closeAll();
  const won=G.winner==='p';NG.over=true;if(NT)NT.setOver(true);
  if(NG.paidMid!==NG.mid){ // rewards for the local player only, once per match, through the normal guarded calls
    NG.paidMid=NG.mid;const aw=[];
    if(won&&performance.now()-NG.t0>12000)aw.push({event:'win'});
    if(G.bestRally>=5)aw.push({event:'combo',score:Math.min(99,G.bestRally)});
    aw.push({event:'score',score:clamp(G.sp|0,0,5)*3+Math.min(20,G.bestRally)});award(aw);
    SV.wn[won?0:1]++;save();
  }
  $('cRes').className='card';
  $('cRes').innerHTML='<div class="big pop">'+(won?'🏆':'😿🧶')+'</div><h2>'+(won?t('nWin'):t('nLose'))+'</h2><p class="scl">'+netScore()+'</p><p id="nMsg">'+(won?t('nWin2'):t('nLose2'))+'</p><button class="btn" id="bA">🔁 '+t('reBtn')+'</button><button class="btn alt" id="bH">🏠 '+t('menu')+'</button>'+(SV.wn[0]>0?'<p style="opacity:.7;font-size:15px">🏆 '+t('nWins')+': '+SV.wn[0]+'</p>':'');
  $('ovRes').classList.add('on');
  $('bA').onclick=()=>{if(!NT||!NG.on||NT.myRe)return;SFX.click();NT.rematch();$('bA').disabled=true;const m=$('nMsg');if(m)m.textContent=NT.t('waitRe')};
  $('bH').onclick=()=>{SFX.click();showMenu()};
}
function netLeft(){ // the friend left (or the link is gone for good): a kind card, never a frozen screen
  if(G.kind!=='net')return;
  const had=G.sp+G.so>0;NG.on=false;NG.over=true;G.mode='result';G.balls=[];G.pows=[];closeAll();hideBanner();
  $('cRes').className='card';
  $('cRes').innerHTML='<div class="big">🐾</div><h2 id="nLeftT"></h2>'+(had?'<p class="scl">'+netScore()+'</p>':'')+'<button class="btn b4" id="bN">🌐 '+t('newRoom')+'</button><button class="btn alt" id="bH">🏠 '+t('menu')+'</button>';
  $('nLeftT').textContent=NT?NT.t('left'):'';
  $('ovRes').classList.add('on');
  $('bN').onclick=()=>{SFX.click();showMenu();if(NT)NT.showLobby()};
  $('bH').onclick=()=>{SFX.click();showMenu()};
}
function netAskQuit(){
  SFX.click();
  $('cPause').innerHTML='<h2>🏠 '+t('quitQ')+'</h2><button class="btn" id="bRes">▶ '+t('stay')+'</button><button class="btn alt" id="bMenu">🏠 '+t('quit')+'</button>';
  $('ovPause').classList.add('on');
  $('bRes').onclick=()=>{SFX.click();$('ovPause').classList.remove('on')};$('bMenu').onclick=()=>{SFX.click();showMenu()};
}
const NT=window.Net1v1?Net1v1({pid:'annabelle-pong-',shareTxt:{he:TX.he.shareT,fr:TX.fr.shareT,en:TX.en.shareT},
  sfx:{join:()=>SFX.pow(),click:()=>SFX.click(),drop:()=>SFX.miss(),back:()=>SFX.net(),huh:()=>SFX.zz()},
  hideMenu(){closeAll()},showMenu(){showMenu()},onLink(){},
  makeStart(){return {g:'pong',v:1,m:NG.mid,sv:NG.sv}},
  cleanStart(d){return d&&typeof d==='object'&&d.g==='pong'&&d.v===1&&int(d.m,1,2147483646)&&(d.sv===0||d.sv===1)?{m:d.m,sv:d.sv}:null},
  onHostStart(){NG.mid=1+crypto.getRandomValues(new Uint32Array(1))[0]%2147483646;NG.sv=Math.random()<.5?1:0;netStart(0)},
  onGuestStart(c){NG.mid=c.m;NG.sv=c.sv;netStart(1)},
  onResume(){NG.lastRx=performance.now();NG.sendAt=0;if(NG.role===0){if(G.kind==='net'&&G.mode==='play'&&G.phase!=='end')NG.hold=true}else NG.off=null}, // host: replay the rally with a countdown, full state follows
  onData:netData,onLeft:netLeft,onPause(on){NG.netp=!!on;if(on){keys={};P.kdir=0}}}):null;
$('home').addEventListener('click',e=>{if(G.kind==='net'&&G.mode==='play'){e.preventDefault();netAskQuit()}});
document.querySelectorAll('#emoBar .ib').forEach(b=>b.onclick=()=>{ac();sendEmo(+b.dataset.e)});
addEventListener('pagehide',()=>{if(NT&&NG.on)try{NT.send({t:'bye'})}catch(e){}});
addEventListener('pageshow',e=>{if(e.persisted&&G.kind==='net')showMenu()});
/* ---------------- test hook ---------------- */
window.__pong={
  NT,
  net(){return {on:NG.on,role:NG.role,mid:NG.mid,hold:NG.hold,netp:NG.netp,over:NG.over,rtt:NG.rtt,seq:NG.seq,lastQ:NG.lastQ,selfX:NG.selfX,cl:NG.cl,phT:G.phT,srv:G.srv,emo:NG.emo.map(e=>({i:e.i,side:e.side})),latch:Object.keys(NG.latch).length,stat:Object.assign({},NG.stat),wn:SV.wn.slice(),H}},
  emote:sendEmo,
  state(){const r=cv.getBoundingClientRect();return {mode:G.mode,kind:G.kind,phase:G.phase,lvl:G.lvl+1,diff:G.diff,sp:G.sp,so:G.so,target:G.target,hearts:G.hearts,net:G.net,returns:G.returns,rally:G.rally,score:G.score,stars:G.stars,W,H,FL,FR,py:P.y,oy:O.y,px:P.x,pw:P.w,ox:O.x,ow:O.w,
    balls:G.balls.map(b=>({x:b.x,y:b.y,vx:b.vx,vy:b.vy,bonus:b.bonus,stuck:!!b.stuck,curve:b.curve,fast:b.fast,zig:b.zig,speed:b.speed})),pows:G.pows.map(w=>({x:w.x,y:w.y,type:w.type})),
    big:P.bigT,mag:P.magT,slow:G.slowT,obig:O.bigT,omag:O.magT,winner:G.winner,bot:O.bot?O.bot.id:null,mood:O.ai?O.ai.mood:null,turbo:G.turbo,ts:G.ts,v0:G.v0,vmax:G.vmax,crowd:G.crowd.length,rect:{l:r.left,t:r.top,w:r.width,h:r.height}}},
  start(l,d){startMatch('story',(l||1)-1,d)},
  start2p(){startMatch('2p',0)},
  arcade(d){startMatch('arcade',0,d)},
  begin,
  win(){if(G.mode==='ready')begin();if(G.mode!=='play')return;if(G.kind==='net'){if(NG.role===0&&G.phase!=='end'){G.sp=G.target;G.winner='p';G.balls=[];G.pows=[];G.phase='end';endStart()}return}if(G.kind==='story'){G.sp=G.target;G.winner='p';finishStory(true)}else if(G.kind==='2p'){G.sp=G.target;G.winner='p';finish2p()}else finishArcade()},
  lose(){if(G.mode==='ready')begin();if(G.mode!=='play')return;if(G.kind==='net'){if(NG.role===0&&G.phase!=='end'){G.so=G.target;G.winner='o';G.balls=[];G.pows=[];G.phase='end';endStart()}return}if(G.kind==='story'){G.so=G.target;G.winner='o';finishStory(false)}else if(G.kind==='2p'){G.so=G.target;G.winner='o';finish2p()}else{G.hearts=0;finishArcade()}},
  step(sec){if(G.mode==='ready')begin();const n=Math.max(1,Math.round((sec||DT)/DT));for(let i=0;i<n;i++)tick(DT)},
  setBall(o){if(G.mode==='ready')begin();if(G.mode!=='play')return false;if(!G.balls.length)G.balls=[mkBall()];G.phase='rally';const b=G.balls[0];Object.assign(b,o||{});if(o&&(o.vx!=null||o.vy!=null))b.speed=Math.max(G.v0*.5,Math.hypot(b.vx,b.vy));b.stuck=null;b.trail=[];return true},
  setPaddle(side,x){const p=side==='o'?O:P;p.x=p.tx=x},
  speed(m){G.ts=clamp(+m||1,.1,12)},
  spawnPower(type,x,y){return !!spawnPow(type,x,y)},
  give(type,side){const own=side==='o'?O:P;give(type,own,G.balls[0],W/2,midY())},
  score(p,o){G.sp=p|0;G.so=o|0;hud()},
  setReturns(n){G.returns=n|0;G.score=G.returns;hud()},
  pause,resume,menu:showMenu,
  save:()=>JSON.parse(JSON.stringify(SV)),
  BOTS:BOTS.map(b=>({id:b.id,q:b.q,an:b.an,boss:b.boss}))
};
/* ---------------- init ---------------- */
(function(){const d=$('drift'),E=['🧶','🐾','⭐','🐾','🧶','🐾','⭐','🧶'];let h='';E.forEach((e,i)=>{h+='<i style="left:'+(i*13-4)+'%;animation-duration:'+(11+i%4*3)+'s;animation-delay:-'+(i*2.3)+'s;font-size:'+(26+i%3*10)+'px">'+e+'</i>'});d.innerHTML=h})();
setLang(lang);applyMute();
startMatch('story',Math.min(9,SV.unlocked-1),SV.diff);boot=false;
showMenu();
requestAnimationFrame(loop);
setTimeout(()=>{fit();if(G.mode==='menu'){layout();buildCrowd();buildBg()}},80);
})();
