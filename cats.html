<style>
  :root{
    --bg1:#ffe9a8; --bg2:#ffc7d9; --ink:#4a2c6b; --accent:#ff7a3d; --accent2:#7c5cff; --ok:#34c47c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;}
  body{
    font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(circle at 20% 15%, #fff6d6 0 12%, transparent 13%),
               radial-gradient(circle at 85% 80%, #ffe0ee 0 10%, transparent 11%),
               linear-gradient(135deg,var(--bg1),var(--bg2));

  }
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,var(--sab,env(safe-area-inset-bottom)));}
  .screen.active{display:flex;}

  /* ---------- top bar ---------- */
  .iconbtn{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #0002;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .1s;}
  .iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0002;}
  .corner{position:absolute;top:max(10px,env(safe-area-inset-top));inset-inline-end:14px;z-index:5;}

  /* ---------- menu ---------- */
  #menu{align-items:center;justify-content:safe center;gap:1.6vh;overflow-y:auto;}
  .title{font-size:clamp(34px,6.5vw,66px);font-weight:900;margin:0;text-align:center;color:#fff;
    text-shadow:0 4px 0 var(--accent),0 8px 0 #0002;letter-spacing:1px;line-height:1.1}
  .heads{display:flex;gap:2vw;justify-content:center}
  .heads svg{width:clamp(56px,min(10vw,11vh),100px);height:auto;animation:bob 2.4s ease-in-out infinite;}
  .heads svg:nth-child(2){animation-delay:.3s}.heads svg:nth-child(3){animation-delay:.6s}.heads svg:nth-child(4){animation-delay:.9s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

  .lang.sel{background:#fff;box-shadow:0 0 0 4px var(--accent2),0 4px 0 #0002;}
  .label{font-size:clamp(18px,2.6vw,24px);font-weight:800;opacity:.85;margin-top:4px}
  .row{display:flex;gap:clamp(10px,2vw,22px);flex-wrap:wrap;justify-content:center}
  .mode{width:clamp(150px,24vw,230px);padding:14px 10px;border-radius:26px;background:#fff9;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:clamp(17px,2.2vw,22px);font-weight:800;transition:transform .12s}

  .mode.sel{background:#fff;box-shadow:0 0 0 5px var(--accent2),0 6px 0 #0002;transform:scale(1.04)}

  .level .t{font-size:18px;font-weight:800}
  .level .dots{display:grid;gap:3px;margin:4px 0}
  .level .dots i{width:9px;height:12px;border-radius:3px;background:#fff9}
  .level .best{font-size:16px;font-weight:700;background:#0002;border-radius:999px;padding:2px 10px;min-height:24px}
  .level .best.empty{background:none}
  .l15{background:linear-gradient(#b07cff,#7c3fe0)}
  .l3{background:linear-gradient(#4dc3ff,#1f8fe8)} .l6{background:linear-gradient(#5fd38d,#2fb36a)} .l10{background:linear-gradient(#ffb84d,#ff8a1f)} .l12{background:linear-gradient(#ff7aa8,#e8487f)}

  /* ---------- game ---------- */
  .bar{display:flex;align-items:center;gap:10px;height:64px;flex:none}
  .bar .spacer{flex:1}

  .pill b{color:var(--accent);font-size:1.15em}
  #board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:6px}
  #grid{display:grid;gap:var(--gap,10px)}

  .inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;}
  .card.up .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #0002;overflow:hidden}
  .back{background:var(--accent2);background-image:radial-gradient(circle at 50% 50%,#ffffff22 0 30%,transparent 31%),repeating-linear-gradient(45deg,#ffffff18 0 10px,transparent 10px 20px);border:4px solid #fff}
  .back svg{width:46%;height:46%;opacity:.95}
  .front{transform:rotateY(180deg);border:4px solid #fff}
  .front svg{width:88%;height:88%}
  .front.word{background:#fff;}
  .front.word span{font-size:clamp(10px,17cqi,46px);font-weight:900;text-align:center;line-height:1.1;padding:3%;overflow-wrap:normal;word-break:normal;hyphens:none;color:var(--ink)}
  .card:hover:not(.up) .inner{transform:scale(1.04)}
  .khint{display:none}
  .desk .khint{display:block;font-size:14px;font-weight:700;opacity:.85;text-align:center;line-height:1.5;max-width:92vw}

  .desk .khint{margin-top:2px}
  .level .stars{font-size:15px;letter-spacing:1px;min-height:20px;line-height:1}
  .xrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  .xbtn.sel{background:#fff;box-shadow:0 0 0 4px #3fc5ff,0 4px 0 #0002;color:#0a6aa8}
  .xbtn.dd{background:linear-gradient(#ffb84d,#ff8a1f);color:#fff;box-shadow:0 4px 0 #0002}
  .front.snd{background:#fff;font-size:clamp(26px,38cqi,56px);flex-direction:column;gap:2px}.front.snd svg{width:70%;height:auto;max-height:34%}
  .card.sndup .front.snd{animation:wob .5s}
  @keyframes wob{0%,100%{transform:rotateY(180deg)}30%{transform:rotateY(180deg) scale(1.12)}60%{transform:rotateY(180deg) scale(.95)}}
  #peekBtn{position:relative}#peekBtn small{position:absolute;right:-2px;bottom:-2px;background:#7c5cff;color:#fff;border-radius:999px;font-size:13px;font-weight:900;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center}
  #peekBtn.dis{filter:grayscale(1) opacity(.45);pointer-events:none}
  #game.onl #peekBtn,#game.onl #bestPill,#game.onl #movesPill{display:none}#oSc,#oTurn{display:none}#game.onl #oSc,#game.onl #oTurn{display:block}
  #oTurn{background:#fff;border-radius:999px;padding:8px 14px;font-size:clamp(15px,2.2vw,20px);font-weight:900;box-shadow:0 4px 0 #0002;white-space:nowrap}
  #oTurn.me{background:#34c47c;color:#fff;animation:pulse 1s infinite}
  #game.onl #grid.myturn .card:not(.up){filter:drop-shadow(0 0 6px #34c47c)}
  #game.onl #grid:not(.myturn) .card{cursor:default}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
  #fx span{position:absolute;font-size:22px;will-change:transform,opacity}
  #winStars{font-size:clamp(40px,8vw,70px);letter-spacing:6px;min-height:60px}#winStars span{display:inline-block;animation:starPop .5s cubic-bezier(.3,1.8,.5,1) both}@keyframes starPop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
  #winStars span.off{filter:grayscale(1) opacity(.4)}
  #win .goal{font-size:clamp(16px,2.4vw,22px);font-weight:800;background:#fff;border-radius:999px;padding:4px 16px}
  #win.show h2{animation:cardIn .5s cubic-bezier(.3,1.6,.5,1)}@keyframes cardIn{from{transform:scale(.5) translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .pill.pop{animation:pillPop .45s}@keyframes pillPop{40%{transform:scale(1.25) rotate(-3deg)}}
  .desk #grid.kb .card.cur{outline:5px solid #2a8fd0;outline-offset:5px;border-radius:22px}
  .desk .card:not(.up){cursor:pointer}.desk .card.up{cursor:default}
  .desk .iconbtn{width:62px;height:62px}
  .card.matched .front{box-shadow:0 0 0 5px var(--ok),0 0 22px 6px #34c47c88;}
  .card.matched{animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}70%{transform:scale(.97) rotate(2deg)}100%{transform:scale(1)}}
  .card.wiggle .inner{animation:wig .4s ease}
  @keyframes wig{0%,100%{transform:rotateY(180deg)}25%{transform:rotateY(180deg) rotate(-4deg)}75%{transform:rotateY(180deg) rotate(4deg)}}

  .card.glow{animation:glowp .5s ease-in-out infinite alternate;position:relative;z-index:2}
  @keyframes glowp{from{filter:drop-shadow(0 0 4px #ffd23f);transform:scale(1)}to{filter:drop-shadow(0 0 18px #ffb300);transform:scale(1.07)}}
  #silly{position:fixed;left:50%;top:76px;width:max-content;transform:translate(-50%,-14px) scale(.9);opacity:0;pointer-events:none;z-index:25;background:#fff;border-radius:999px;padding:8px 20px;font-size:clamp(18px,2.6vw,26px);font-weight:900;color:#7c5cff;box-shadow:0 5px 0 #0002;max-width:92vw;text-align:center;transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}
  #silly.show{opacity:1;transform:translate(-50%,0) scale(1)}
  /* pro / marathon */
  .pnote{font-size:14px;font-weight:700;opacity:.85;text-align:center;max-width:92vw;min-height:0}
  .xbtn.pro.sel{background:#2b2150;color:#fff;box-shadow:0 0 0 4px #ffd23f,0 4px 0 #0002}
  .xbtn.mar{background:linear-gradient(#ff6a8a,#e8487f);color:#fff;box-shadow:0 4px 0 #0002}
  .xbtn.mar small{font-size:.8em;opacity:.95;font-weight:800;margin-inline-start:4px}
  #mstrip{display:none;align-items:center;gap:10px;height:22px;flex:none;margin:0 4px}
  #game.pro #mstrip,#game.mar #mstrip{display:flex}
  #mbar{flex:1;height:12px;border-radius:99px;background:#fff9;box-shadow:inset 0 0 0 2px #fff;overflow:hidden;display:none}
  #game.mar #mbar{display:block}
  #mfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#34c47c,#8ad94a);border-radius:99px;transition:background .3s}
  #mfill.mid{background:linear-gradient(90deg,#ffb84d,#ff8a1f)}#mfill.low{background:linear-gradient(90deg,#ff5d5d,#e8487f)}
  #mtxt{font-size:15px;font-weight:900;white-space:nowrap;min-width:0}
  #game.pro:not(.mar) #mtxt{flex:1;text-align:center}
  .pro .inner,.mar .inner{transition-duration:.28s}
  .card.deal{animation:dealIn .32s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes dealIn{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  #winTop{display:none;background:#fff;border-radius:18px;padding:8px 14px;min-width:min(86vw,330px);box-shadow:0 5px 0 #0002;text-align:start}
  #win.mar #winTop{display:block}#win.mar #jumpers,#win.mar #winStars{display:none}
  #winTop h4{margin:0 0 4px;font-size:16px;text-align:center}
  #winTop ol{list-style:none;margin:0;padding:0}
  #winTop li{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:10px;font-weight:800;font-size:17px}
  #winTop li.me{background:#ffe9a8;box-shadow:0 0 0 2px #ffb300}
  #winTop li b{width:28px;text-align:center}#winTop li span{flex:1}#winTop li small{font-size:13px;opacity:.8;font-weight:700}

  /* fact toast */
  #fact{position:fixed;left:50%;bottom:max(14px,var(--sab,env(safe-area-inset-bottom)));transform:translate(-50%,calc(100% + 60px));visibility:hidden;pointer-events:none;width:min(92vw,720px);background:#fff;border-radius:24px;padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 0 #0002,0 0 0 5px #ffd36b;transition:transform .45s cubic-bezier(.3,1.4,.5,1);z-index:20;}
  #fact.show{transform:translate(-50%,0);visibility:visible}
  #fact{transition:transform .45s cubic-bezier(.3,1.4,.5,1),visibility .45s}
  #fact svg{width:70px;height:70px;flex:none}
  #fact .nm{font-size:22px;font-weight:900;color:var(--accent)}
  #fact .tx{font-size:clamp(16px,2.2vw,20px);font-weight:600;line-height:1.3}

  /* win */
  #win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;background:#fff5;backdrop-filter:blur(3px);z-index:30;text-align:center;padding:20px}
  #win.show{display:flex}
  #win h2{font-size:clamp(36px,7vw,72px);margin:0;color:#fff;text-shadow:0 4px 0 var(--accent2),0 8px 0 #0002}
  #win .sub{font-size:clamp(20px,3vw,30px);font-weight:800;background:#fff;border-radius:999px;padding:8px 24px;box-shadow:0 5px 0 #0002}
  #win .rec{font-size:clamp(22px,3.4vw,34px);font-weight:900;color:#e8487f;animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.1)}}
  .jumpers{display:flex;gap:1.5vw;justify-content:center;flex-wrap:wrap}
  .jumpers svg{width:clamp(56px,10vw,100px);height:auto;animation:jump .7s ease-in-out infinite alternate}
  @keyframes jump{0%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.1,.9)}100%{transform:translateY(-50px) scale(.95,1.05) rotate(6deg)}}
  .big{font-size:clamp(22px,3vw,30px);font-weight:900;padding:14px 30px;border-radius:999px;color:#fff;box-shadow:0 6px 0 #0003;display:inline-flex;gap:10px;align-items:center}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
  .go{background:linear-gradient(#5fd38d,#2fb36a)} .home{background:linear-gradient(#a58bff,#7c5cff)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
  /* phone fit: 3 level cards in one row, tighter on short screens */
  @media (max-width:600px){#levels{flex-wrap:wrap;gap:8px}.level{width:auto;flex:1 1 calc(33% - 8px);max-width:150px;padding:8px 4px 6px}.level .dots{display:none}.level .n{font-size:34px}.level .t{font-size:15px}.level .best{font-size:13px}.mode{width:calc(33% - 8px);min-width:0;padding:10px 4px;font-size:15px}.mode .pic{height:48px}.mode .pic svg{width:40px;height:40px}.mode .pic .word{font-size:15px;padding:6px 6px}#modes{flex-wrap:nowrap;gap:8px}.lbl{display:none}.bar{gap:6px}.bar .iconbtn{width:46px;height:46px;font-size:22px}.bar .pill{padding:6px 10px}.bar>div[style]{width:46px!important}#muteBtn{width:46px;height:46px;font-size:22px;top:max(19px,env(safe-area-inset-top))}#oTurn{padding:6px 8px;font-size:14px}#oSc{min-width:0;font-size:15px}#game.mar #musBtn{display:none}#fact{padding:8px 12px;gap:10px}#fact svg{width:48px;height:48px}#fact .nm{font-size:18px}#fact .tx{font-size:14px;line-height:1.25}.xbtn.mar small{display:none}}
  @media (max-height:700px){.mode{padding:8px 8px}.mode .pic{height:48px}.mode .pic svg{width:44px;height:44px}.label{margin-top:0}}

/*landscape-fit*/@media (orientation:landscape) and (max-height:500px){#menu{overflow-y:auto;justify-content:safe center;-webkit-overflow-scrolling:touch}}
/* desktop fit: bigger menus on tall windows */

@media (min-width:1100px) and (min-height:960px){.desk #menu{zoom:1.2}}

@media (max-width:600px){.lang{padding:7px 12px;font-size:17px}.langs{gap:7px}.xbtn{padding:8px 14px;font-size:17px;min-height:40px}.heads svg{width:36px}.level .n{font-size:30px}.level{padding:6px 4px 5px}.mode .pic{height:40px}.mode{padding:8px 4px;gap:3px}.label{font-size:17px;margin-top:0}.level>span:nth-child(4){display:none}.title{font-size:clamp(30px,8.5vw,44px);padding:0 46px}}

</style>

<script>
"use strict";
/* ============================================================
   DATA: animals, names (he/fr/en), facts
   ============================================================ */

function hostResolve(){
  if(!ON.on||!ON.host||ON.open.length!==2) return;
  if(netp){ setTimeout(hostResolve,500); return; }
  const [a,b]=ON.open, m=ON.deck[a].k===ON.deck[b].k;
  if(m) ON.sc[ON.turn]++; else ON.turn^=1;
  const done=found+(m?1:0)===pairs;
  NT.send({t:"rs",s:ON.seq++,m:m?1:0,tu:ON.turn,a:ON.sc[0],b:ON.sc[1],o:done?1:0});
  applyResolve(a,b,m,done,m?ON.turn^0:-1);
}
function applyResolve(a,b,m,done){
  const A=cards[a],B=cards[b]; ON.open=[]; ON.lock=false;
  if(m){ found++; streak++; setTimeout(()=>{ A.classList.add("matched"); B.classList.add("matched"); SFX.match(1); if(gm!=="voice") SFX.voice(ANIMALS[A.dataset.key].voice); spark(A); spark(B); showFact(A.dataset.key); },100); popPill("oSc"); }
  else { A.classList.add("wiggle"); B.classList.add("wiggle"); SFX.oops(); setTimeout(()=>{ A.classList.remove("up","wiggle","sndup"); B.classList.remove("up","wiggle","sndup"); },520); }
  updOnlineUi(false);
  if(done){ ON.over=true; updOnlineUi(true); const g=gid; setTimeout(()=>{ if(g===gid) onlineFinish(); },1300); }
}
function onlineFinish(){
  if(!ON.on) return; ON.over=true; NT.setOver(true);
  const t=T[lang], a=ON.sc[ON.me], b=ON.sc[ON.me^1];
  $("winTitle").textContent = a>b?t.win2:a<b?t.lose2:t.tie; $("winSub").textContent=t.onSub.replace("{a}",a).replace("{b}",b); $("winRec").textContent=""; $("winGoal").textContent="";
  const st=a>b?3:a===b?2:1; $("winStars").innerHTML=[0,1,2].map(i=>`<span class="${i<st?"":"off"}" style="animation-delay:${.3+i*.3}s">${i<st?"⭐":"☆"}</span>`).join("");
  for(let i=0;i<st;i++) setTimeout(()=>SFX.star(i),400+i*300);
  rw({event:"levelClear",level:pairs,score:a*100}); rw({event:"score",score:a*100}); rw({event:"star",stars:st}); if(a>b) rw({event:"win"});
  $("jumpers").innerHTML = shuffle(KEYS.slice()).slice(0,5).map((k,i)=>face(k).replace("<svg",`<svg style="animation-delay:${i*.12}s"`)).join("");
  hideFact(); $("againBtn").disabled=false; $("againBtn").style.display=""; $("againBtn").textContent=t.again; $("win").classList.add("show");
  if(a>=b){ SFX.win(); confetti(); } else SFX.oops();
  setTimeout(rwFlush,900);
}
function olLeft(){ if(!ON.on) return; ON.over=true; const t=T[lang]; $("winTitle").textContent=t.left; $("winSub").textContent="👋"; $("winRec").textContent=""; $("winGoal").textContent=""; $("winStars").innerHTML=""; $("jumpers").innerHTML=""; $("againBtn").style.display="none"; $("win").classList.add("show"); }
function olSnap(){
  if(!ON.on||!cards.length) return;
  if(ON.host){
    const ks=[],ds=[],st=[]; cards.forEach((el,i)=>{ const up=el.classList.contains("up"),mt=el.classList.contains("matched"); st.push(mt?2:up?1:0); ks.push(up||mt?KEYS.indexOf(ON.deck[i].k):-1); ds.push(up||mt?KD.indexOf(ON.deck[i].kind):0); });
    NT.send({t:"sy",s:ON.seq,tu:ON.turn,a:ON.sc[0],b:ON.sc[1],f:found,ks,ds,st});
  }
}
function olApplySnap(d){
  const n=cards.length;
  const arr=(a,lo,hi)=>Array.isArray(a)&&a.length===n&&a.every(v=>int(v,lo,hi));
  if(ON.host||!ON.on||!int(d.s,0,99999)||!int(d.tu,0,1)||!int(d.a,0,15)||!int(d.b,0,15)||!int(d.f,0,15)||!arr(d.ks,-1,KEYS.length-1)||!arr(d.ds,0,2)||!arr(d.st,0,2)) return;
  if(d.s===ON.rcv) return;
  found=d.f; ON.open=[]; ON.lock=false;
  cards.forEach((el,i)=>{ el.classList.remove("up","matched","wiggle","glow"); if(d.st[i]>0&&d.ks[i]>=0){ fillFront(el,KEYS[d.ks[i]],KD[d.ds[i]]); el.classList.add("up"); if(d.st[i]===2) el.classList.add("matched"); else ON.open.push(i); } });
  ON.turn=d.tu; ON.sc=[d.a,d.b]; ON.rcv=d.s; ON.lock=ON.open.length===2; updOnlineUi(true);
}
function olData(d){
  const ty=d.t, n=cards.length;
  if(ty==="mv"&&ON.host){ if(int(d.i,0,n-1)) hostFlip(d.i,1); }
  else if(ty==="fl"&&!ON.host){
    if(d.s!==ON.rcv||!int(d.i,0,n-1)||!int(d.k,0,KEYS.length-1)||!int(d.d,0,2)||ON.open.length>=2||ON.over) return;
    const el=cards[d.i]; if(el.classList.contains("up")||el.classList.contains("matched")) return;
    ON.rcv++; ON.pend=false; if(ON.open.length===0) hideFact();
    fillFront(el,KEYS[d.k],KD[d.d]); ON.open.push(d.i); revealCard(el);
    if(ON.open.length===2){ ON.lock=true; updOnlineUi(true); }
  }
  else if(ty==="rs"&&!ON.host){
    if(d.s!==ON.rcv||ON.open.length!==2||!(d.m===0||d.m===1)||!int(d.tu,0,1)||!int(d.a,0,15)||!int(d.b,0,15)||!(d.o===0||d.o===1)||ON.over) return;
    ON.rcv++; const [a,b]=ON.open, m=cards[a].dataset.key===cards[b].dataset.key;
    ON.turn=d.tu; ON.sc=[d.a,d.b]; applyResolve(a,b,m,d.o===1);
  }
  else if(ty==="sy"&&!ON.host) olApplySnap(d);
}
applyLang();
