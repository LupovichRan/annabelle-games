    else{SFX.oops();cap(t("miss"),"#fff");st="after";popA={delay:1.2,after:true};hook.visible=false;ropeM.visible=false;ctlUpdate()}}}
  else if(st==="reel")reelUpdate(dt);

 }
 // wave
 if(wv&&wv.active)waveUpdate(dt);

function reelUpdate(dt){const r=rl,a=r.a,F=Fe(),Rw=a.def.w;r.time+=dt;
 if(holdReel){r.ten+=dt*(.75+.5*Rw/F)*(1-.08*UP.rope);SFX.tick&&r.time-r.lastTick>.18&&(SFX.tick(),r.lastTick=r.time)}else r.ten-=dt*1.4;

 if(r.ten>=1){loseThrow(t("snap"),"#ff7a8a",true);return}
 if(holdReel&&r.ten>=.2){const mult=r.ten>=.8?1.4:1;r.p+=dt*(.18+.5*F/(F+Rw*1.2))*mult*(1+.12*UP.reel)*(pushT>0?.0:1)}else r.p-=dt*.04*Rw/F;
 if(pushT>0)pushT-=dt;
 if(r.p<=0){loseThrow(t("escaped"),"#fff",false);return}
 r.p=Math.min((wv||wvQ.length)?.9:1,r.p);   // the sea keeps the animal from arriving until every tsunami has passed
 // animal pos along the underground line to kitten
 const sx=a.x,sy=a.y,ex=KX+1.5,ey=-1.1,k=r.p,ax=sx+(ex-sx)*k,ay=sy+(ey-sy)*k+Math.sin(k*Math.PI)*.0;

 // waves: queue of tsunamis, each with a siren warning, an approach, a press and a retreat
 if(!wv&&wvQ.length){wvGap-=dt;if(wvGap<=0)newWave(wvQ.shift(),a)}
 if(r.p>=1){// caught!
  st="catch";popA={t:0,a,x0:ex,from:a.g.position.clone()};holdReel=false;$("gauges").classList.remove("on");clearWaves();ctlUpdate();pose("cheer",0);return}}
function newWave(ty,a){const T=TS[ty];wv={ty,T,t:0,state:"warn",active:true,res:null,xh:15};waveSeen=true;waveLog.push(ty);braceCh=0;holdBrace=false;
 SFX.siren(ty);SFX.rumble(T.warn+T.ap);cap(t(T.tx),"#8fe0ff");bannerShow(t(T.tx));$("gBl").textContent=t(T.hold?"gBrS":"gBr");$("gBrW").classList.remove("hide");ctlUpdate()}
function waveUpdate(dt){const a=rl&&rl.a;if(!a){clearWaves();return}const T=wv.T;wv.t+=dt;
 if(holdBrace)braceCh=Math.min(1,braceCh+dt*.7*T.rate);else braceCh=Math.max(0,braceCh-dt*(T.hold?.18:.3));
 $("gBrF").style.width=(braceCh*100)+"%";
 const xh=Math.max(a.g.position.x,KX+2)+.5;
 if(wv.state==="warn"){if(wv.t>=T.warn){wv.state="app";wv.t=0;wave.visible=true}}
 else if(wv.state==="app"){const k=Math.min(1,wv.t/T.ap);wv.x=15+(xh-15)*k;if(wv.t>=T.ap){wv.state="press";wv.t=0;
   if(braceCh<T.thr)waveFail(a,T);}}
 else if(wv.state==="press"){wv.x=xh+Math.sin(tm*30)*.06;if(!wv.res&&braceCh<.12)waveFail(a,T);
  if(wv.t>=T.win){if(!wv.res){wv.res="ok";SFX.splash();burst(a.g.position.x,2,40,7,waterM,10);cap(t("braced"),"#8fe0ff");const b=T.hold?3:2;score+=b;SV.coins+=b;save();hud();const f=sprite("😎",1.4);f.position.set(KX+1.5,3.8,.9);world.add(f);setTimeout(()=>world.remove(f),1500);bannerShow(t("bonus"))}
   wv.state="leave";wv.t=0}}
 else if(wv.state==="leave"){wv.x=xh-(wv.t/.9)*(xh+14);if(wv.t>=.9){const more=wvQ.length>0;wv=null;wave.visible=false;holdBrace=false;if(more){wvGap=.5+Math.random()*.7;$("gBrW").classList.add("hide")}else $("gBrW").classList.add("hide");ctlUpdate();return}}
 if(wave.visible){wave.position.set(wv.x,2.2,.5);wave.scale.set(T.sc*.9,T.sc*(1+Math.sin(tm*6)*.04),T.sc)}}
function waveFail(a,T){wv.res="fail";SFX.splash();SFX.boing();burst(a.g.position.x,2,40,7,waterM,10);cap(t("pushed"),"#ffd23f");rl.p=Math.max(.05,rl.p-(T.hold?.55:.45));rl.ten=0;pushT=.8;const f=sprite("😂",1.4);f.position.set(a.g.position.x,3.5,.9);world.add(f);setTimeout(()=>world.remove(f),1500)}
function popUpdate(dt){const p=popA;p.t+=dt;const k=Math.min(1,p.t/.9),a=p.a;
 a.g.position.set(p.from.x+(KX+2.6-p.from.x)*k,p.from.y+(G+.1-p.from.y)*Math.min(1,k*1.4)+Math.sin(k*Math.PI)*3.2,.9);a.g.rotation.y+=dt*6;
 hook.visible=false;ropeM.visible=false;
 if(k>=1&&!p.done){p.done=true;a.g.rotation.y=.2;a.g.rotation.z=0;const big=a.def.w>=7;SFX[big?"big":"catchS"]();burst(KX+2.6,2.2,big?60:26,big?9:6);cap(a.def.c[lang],"#fff7c4");
  score+=a.def.v;SV.coins+=a.def.v;SFX.coin();caught.push(a.def);SV.book[a.def.id]=(SV.book[a.def.id]|0)+1;save();hud();
  const f=sprite("+"+a.def.v+"⭐",1.6);f.position.set(KX+2.6,4.2,.9);world.add(f);setTimeout(()=>world.remove(f),1400)}
 if(p.done){p.t2=(p.t2||0)+dt;a.g.position.y=G+.1+Math.abs(Math.sin(p.t2*7))*.5*Math.max(0,1-p.t2/1.4);
  if(p.t2>1.5){dropAnimal(a);popA=null;throwsLeft--;hud();pose("rod");nextThrow()}}}
/* camera */
let camX=KX+3,camLook=new THREE.Vector3(),viewShift=0;
function camUpdate(dt){const asp=cam.aspect;const hero=(st==="menu"||st==="train"||st==="result"||st==="book"||st==="shop");
 let tp,tl;
 if(hero){const wide=asp>1.2;tp=new THREE.Vector3(KX+(wide?3.2:1.5),(wide?2.6:2.2),(wide?9.5:15.8));tl=new THREE.Vector3(KX+.2+(wide?1.2:0),(wide?1.6:1.5),0)}
 else{const vw=asp>=1.5?21:Math.max(9,Math.min(21,9+(asp-.45)*10));const vfov=cam.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vfov/2)*asp),d=vw/(2*Math.tan(hf/2));
  let fx=KX+4.5;if(st==="aim")fx=KX*.4+mx*.6;else if(rl)fx=(KX+rl.a.g.position.x)/2;else if(st==="toss"||st==="dig")fx=(KX+hook.position.x)/2;else if(st==="catch")fx=KX+3;
  const lo=XMIN-1+vw/2,hi=XMAX+1-vw/2;fx=hi<lo?(lo+hi)/2:Math.max(lo,Math.min(hi,fx));
  tp=new THREE.Vector3(fx,1.6+d*.07,d);tl=new THREE.Vector3(fx,-.9,0)}
 const k=Math.min(1,dt*3.2);cam.position.lerp(tp,k);camLook.lerp(tl,k);cam.lookAt(camLook);
 {const want=hero&&asp<1.2?innerHeight*.165:0;viewShift+=(want-viewShift)*Math.min(1,dt*4);const w=innerWidth,h=innerHeight;if(Math.abs(viewShift)>.5){cam.setViewOffset(w,h,0,viewShift,w,h)}else cam.clearViewOffset();cam.updateProjectionMatrix()}
 if(wv&&(wv.state==="app"||wv.state==="press")){const q=wv.state==="press"?1.6:.7;cam.position.x+=Math.sin(tm*60)*.05*q;cam.position.y+=Math.cos(tm*53)*.04*q}}

let tr=null;
function startTrain(){ac();st="train";setMode("menu");show("train");clearAnimals();marker.visible=false;hook.visible=false;ropeM.visible=false;tr={time:0,dur:12,good:0,miss:0,ph:0,rep:0,done:false,lift:0};$("bRep").disabled=false;trInfo();pose("lift",0)}

function trainUpdate(dt){if(!tr)return;kitten.rotation.y=.35;
 if(!tr.done){tr.time+=dt;tr.ph+=dt/1.1;const p=Math.abs(((tr.ph%2)+2)%2-1);tr.m=p;$("gm").style.left=(p*100)+"%";trInfo();if(tr.time>=tr.dur)trainEnd()}
 tr.lift=Math.max(0,tr.lift-dt*1.8);pose("lift",tr.lift)}
function repTap(){if(st!=="train"||!tr||tr.done)return;ac();const p=tr.m||0;
 if(p>=.35&&p<=.65){tr.good++;tr.lift=1;SFX.rep();burst(KX+.3,3.3,10,4);const f=sprite("💥",1.1);f.position.set(KX+.3,4.2,.9);world.add(f);setTimeout(()=>world.remove(f),500)}else{tr.miss++;SFX.oops();tr.lift=.35}trInfo()}

 if(S<MAXS){SV.xp+=g;while(S<MAXS&&SV.xp>=need(S)){SV.xp-=need(S);S++;lv=true}if(S>=MAXS)SV.xp=0;SV.str=S}

/* ----- loop ----- */
let last=performance.now(),paused=false;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(document.hidden)return;
 if(!paused)update(dt);else camUpdate(0);

$("againBtn").onclick=()=>{SFX.click();startRound()};$("rTrain").onclick=()=>{SFX.click();startTrain()};$("rMenu").onclick=()=>{SFX.click();toMenu()};
$("pauseBtn").onclick=()=>{SFX.click();doPause(!paused)};$("resBtn").onclick=()=>{SFX.click();doPause(false)};$("pMenu").onclick=()=>{SFX.click();paused=false;toMenu()};
