function refreshHeavy(){const F=F_(S);for(const a of animals){a.heavy=F<a.def.w*.55;if(a.heavy&&!a.lock){a.lock=sprite("💪",.9);world.add(a.lock)}if(!a.heavy&&a.lock){world.remove(a.lock);a.lock=null}}}
function spawnOne(){const F=F_(S),lo=-3.0,hi=Math.min(11.5,x0()+span()+1.2);
 const can=ANIM.filter(a=>F>=a.w*.55);const pool=Math.random()<.78&&can.length?can:ANIM;const def=pick(pool,a=>a.p);
 let x=lo,bestX=lo,bestD=-1;for(let k=0;k<40;k++){const f=Math.random(),bias=Math.min(1,def.w/24),u=Math.min(1,f*(1-bias*.6)+bias*.5*Math.random()+bias*.5*f);x=lo+(hi-lo)*u;const d=animals.reduce((m,a)=>Math.min(m,Math.abs(a.x-x)),9);if(d>bestD){bestD=d;bestX=x}if(d>1.7)break}
 mkAnimal(def,bestX)}

 $("bThrow").textContent=t("throwB");$("bReel").textContent=t("reelB");$("bBrace").textContent=t("braceB");$("gTl").textContent=t("gTen");$("gBl").textContent=t("gBr");
 $("trT").textContent=t("trT");$("trS").textContent=t("trS");$("bRep").textContent=t("rep");$("trBack").textContent=t("back");
 $("againBtn").textContent=t("again");$("rTrain").textContent=t("train");$("rMenu").textContent=t("menu");$("pT").textContent=t("paused");$("resBtn").textContent=t("resume");$("pMenu").textContent=t("menu");$("bkT").textContent=t("bookT");$("bkBack").textContent=t("back");

window.toMenu=toMenu;
function startRound(){ac();throwsLeft=TH;score=0;caught=[];waveSeen=false;reelCount=0;clearAnimals();fillAnimals();setMode("game");show(null);st="aim";mk=0;mkDir=1;hud();ctlUpdate();$("gauges").classList.remove("on");cap(t("gTen").split("–")[0]&&"🎯",'#fff');}
function nextThrow(){if(throwsLeft<=0){endRound();return}st="aim";mkDir=mkDir||1;fillAnimals();ctlUpdate();$("gauges").classList.remove("on");wave.visible=false;hook.visible=false;ropeM.visible=false;wv=null;rl=null;hud()}
function endRound(){st="result";const nb=score>SV.best;if(nb)SV.best=score;save();ctlUpdate();$("gauges").classList.remove("on");setMode("menu");clearAnimals();hook.visible=false;ropeM.visible=false;marker.visible=false;wave.visible=false;
 $("rT").textContent=t("rT");$("rS").textContent=t("rS",{n:caught.length,s:score})+(nb?"  "+t("best"):"");$("rA").textContent=caught.slice(0,14).map(a=>a.e).join("")||"🌱";show("res");SFX.big();flexT=0;burst(KX+1,2.5,50,7)}
function doThrow(){if(st!=="aim")return;ac();SFX.whoosh();mx=sweepX(mk);const s=HAND();toss={t:0,dur:.55,from:s.clone(),to:new THREE.Vector3(mx,G,.1)};st="toss";marker.visible=false;hook.visible=true;ctlUpdate();pose("pull")}
function startReel(a){rl={a,p:.12,ten:0,time:0,snapT:0,lastTick:0,slack:0,hitT:0};st="reel";reelCount++;$("gauges").classList.add("on");$("gBrW").classList.add("hide");

function loseThrow(msg,col,snap){SFX[snap?"snap":"boing"]();cap(msg,col);const a=rl&&rl.a;if(a){a.g.position.y=a.y;a.g.visible=true}rl=null;wv=null;hook.visible=false;ropeM.visible=false;holdReel=false;st="after";$("gauges").classList.remove("on");wave.visible=false;ctlUpdate();popA={delay:1.4,after:true}}
/* ----- update ----- */
const vTmp=new THREE.Vector3();
function update(dt){tm+=dt;
 // animals idle bob
 for(const a of animals){if(rl&&rl.a===a)continue;a.g.position.y=a.y+Math.sin(tm*1.6+a.ph)*.05;if(a.lock)a.lock.position.set(a.x,a.y+1.6+Math.sin(tm*3+a.ph)*.08,.9)}
 kitten.userData.tail.rotation.y=Math.sin(tm*2)*.3;
 stepParts(dt);
 if(popB>0)popB=Math.max(0,popB-dt*1.5);
 setBicep(S);
 if(st==="menu"||st==="book"){pose("flex",tm);kitten.rotation.y=.35+Math.sin(tm*.6)*.25;marker.visible=false}
 else if(st==="train"){trainUpdate(dt)}
 else if(st==="result"){flexT+=dt;pose("cheer",flexT);kitten.rotation.y=.4}
 else{kitten.rotation.y=.95;
  if(st==="aim"){pose("rod");mk+=mkDir*dt/1.5;if(mk>=1){mk=1;mkDir=-1}if(mk<=0){mk=0;mkDir=1}mx=sweepX(mk);marker.visible=true;marker.position.set(mx,0,.1);arrow.position.y=1.5+Math.sin(tm*8)*.2;beam.scale.y=5.6;beam.position.y=-2.5+.1;ring.position.y=G+.05;const s=HAND();hook.visible=true;hook.position.set(s.x,s.y-.9,s.z);beamTo(ropeM,s,hook.position);ropeM.visible=true;
   for(const a of animals)a.g.scale.setScalar(a.g.scale.x)}
  else if(st==="toss"){toss.t+=dt;const k=Math.min(1,toss.t/toss.dur);hook.position.lerpVectors(toss.from,toss.to,k);hook.position.y+=Math.sin(k*Math.PI)*3;hook.rotation.z+=dt*8;const s=HAND();beamTo(ropeM,s,hook.position);
   if(k>=1){SFX.thud();burst(toss.to.x,G+.2,18,4,dirtM);dig={t:0,dur:.7,x:toss.to.x};st="dig";hook.rotation.z=0}}
  else if(st==="dig"){dig.t+=dt;const k=Math.min(1,dig.t/dig.dur);hook.position.set(dig.x,G-k*2.4,.1);if(Math.random()<.4)burst(dig.x,G+.2,1,3,dirtM);const s=HAND();beamTo(ropeM,s,hook.position);
   if(k>=1){let best=null,bd=1e9;for(const a of animals){const d=Math.abs(a.x-dig.x);if(d<bd){bd=d;best=a}}
    if(best&&bd<=1.25){if(best.heavy){SFX.boing();cap(t("heavy"),"#ffd23f");burst(best.x,best.y+1,10,3,pCols);throwsLeft++;hud();st="after";popA={delay:1.3,after:true};hook.visible=false;ropeM.visible=false;ctlUpdate()}else{SFX.hook();burst(best.x,best.y,10,3,pCols);startReel(best)}}
    else{SFX.oops();cap(t("miss"),"#fff");st="after";popA={delay:1.2,after:true};hook.visible=false;ropeM.visible=false;ctlUpdate()}}}
  else if(st==="reel")reelUpdate(dt);
  else if(st==="catch"){popUpdate(dt)}
  else if(st==="after"){popA.delay-=dt;pose("rod");if(popA.delay<=0){popA=null;throwsLeft--;hud();nextThrow()}}
 }
 // wave
 if(wv&&wv.active)waveUpdate(dt);
 camUpdate(dt)}
function reelUpdate(dt){const r=rl,a=r.a,F=F_(S),Rw=a.def.w;r.time+=dt;
 if(holdReel){r.ten+=dt*(.75+.5*Rw/F);SFX.tick&&r.time-r.lastTick>.18&&(SFX.tick(),r.lastTick=r.time)}else r.ten-=dt*1.4;
 r.ten=Math.max(0,Math.min(1.05,r.ten));
 if(r.ten>.85&&holdReel&&r.time-r.snapT>.14){SFX.warnT();r.snapT=r.time}
 if(r.ten>=1){loseThrow(t("snap"),"#ff7a8a",true);return}
 if(holdReel&&r.ten>=.2){const mult=r.ten>=.8?1.4:1;r.p+=dt*(.18+.5*F/(F+Rw*1.2))*mult*(wv&&wv.pushT>0?.0:1)}else r.p-=dt*.04*Rw/F;
 if(wv&&wv.pushT>0)wv.pushT-=dt;
 if(r.p<=0){loseThrow(t("escaped"),"#fff",false);return}
 r.p=Math.min(1,r.p);
 // animal pos along the underground line to kitten
 const sx=a.x,sy=a.y,ex=KX+1.5,ey=-1.1,k=r.p,ax=sx+(ex-sx)*k,ay=sy+(ey-sy)*k+Math.sin(k*Math.PI)*.0;
 const jit=r.ten*.12*Math.sin(tm*40);a.g.position.set(ax+jit,ay,.1);a.g.rotation.y=-.9;a.g.rotation.z=Math.sin(tm*14)*r.ten*.1;
 hook.position.set(ax-.2,ay+.3,.2);const s=HAND();beamTo(ropeM,s,hook.position);hook.rotation.z=0;
 $("gTenM").style.left=Math.min(100,r.ten*100)+"%";$("gPrF").style.width=(r.p*100)+"%";
 // wave
 if(wv&&wv.state==="wait"){wv.sched-=dt;if(wv.sched<=0){wv.state="go";wv.active=true;wv.t=0;wv.hitDone=false;waveSeen=true;braceCh=0;holdBrace=false;wv.ax=a.x;SFX.siren();SFX.rumble();cap(t("warn"),"#8fe0ff");bannerShow(t("warn"));$("gBrW").classList.remove("hide");ctlUpdate()}}
 if(r.p>=1){// caught!
  st="catch";popA={t:0,a,x0:ex,from:a.g.position.clone()};holdReel=false;$("gauges").classList.remove("on");wv=null;wave.visible=false;ctlUpdate();pose("cheer",0);return}}
function waveUpdate(dt){wv.t+=dt;if(!wave.visible){wave.visible=true}
 const k=wv.t/wv.dur,x=15-k*28;wave.position.set(x,2.2,.5);wave.scale.set(1,1+Math.sin(tm*6)*.04,1);
 if(holdBrace)braceCh=Math.min(1,braceCh+dt*.7);else braceCh=Math.max(0,braceCh-dt*.3);
 $("gBrF").style.width=(braceCh*100)+"%";
 const a=rl&&rl.a;
 if(a&&!wv.hitDone&&x<=Math.max(a.g.position.x,KX+2)+.5){wv.hitDone=true;
  if(braceCh>=.5){SFX.splash();burst(a.g.position.x,2,40,7,waterM,10);cap(t("braced"),"#8fe0ff");score+=2;hud();const f=sprite("😎",1.4);f.position.set(KX+1.5,3.8,.9);world.add(f);setTimeout(()=>world.remove(f),1500);bannerShow(t("bonus"))}
  else{SFX.splash();SFX.boing();burst(a.g.position.x,2,40,7,waterM,10);cap(t("pushed"),"#ffd23f");rl.p=Math.max(.05,rl.p-.45);rl.ten=0;wv.pushT=.8;const f=sprite("😂",1.4);f.position.set(a.g.position.x,3.5,.9);world.add(f);setTimeout(()=>world.remove(f),1500)}}
 if(wv.t>=wv.dur+.3){wv.active=false;wave.visible=false;wv.state="done";$("gBrW").classList.add("hide");holdBrace=false;ctlUpdate()}}
function popUpdate(dt){const p=popA;p.t+=dt;const k=Math.min(1,p.t/.9),a=p.a;
 a.g.position.set(p.from.x+(KX+2.6-p.from.x)*k,p.from.y+(G+.1-p.from.y)*Math.min(1,k*1.4)+Math.sin(k*Math.PI)*3.2,.9);a.g.rotation.y+=dt*6;
 hook.visible=false;ropeM.visible=false;
 if(k>=1&&!p.done){p.done=true;a.g.rotation.y=.2;a.g.rotation.z=0;const big=a.def.w>=7;SFX[big?"big":"catchS"]();burst(KX+2.6,2.2,big?60:26,big?9:6);cap(a.def.c[lang],"#fff7c4");
  score+=a.def.v;caught.push(a.def);SV.book[a.def.id]=(SV.book[a.def.id]|0)+1;save();hud();
  const f=sprite("+"+a.def.v+"⭐",1.6);f.position.set(KX+2.6,4.2,.9);world.add(f);setTimeout(()=>world.remove(f),1400)}
 if(p.done){p.t2=(p.t2||0)+dt;a.g.position.y=G+.1+Math.abs(Math.sin(p.t2*7))*.5*Math.max(0,1-p.t2/1.4);
  if(p.t2>1.5){dropAnimal(a);popA=null;throwsLeft--;hud();pose("rod");nextThrow()}}}
/* camera */
let camX=KX+3,camLook=new THREE.Vector3();
function camUpdate(dt){const asp=cam.aspect;const hero=(st==="menu"||st==="train"||st==="result"||st==="book");
 let tp,tl;
 if(hero){const wide=asp>1.2;tp=new THREE.Vector3(KX+(wide?3.2:1.8),(wide?2.6:3.0),(wide?9.5:13.5));tl=new THREE.Vector3(KX+.2+(wide?1.2:0),(wide?1.6:.7),0)}
 else{const vw=asp>=1.5?21:Math.max(9,Math.min(21,9+(asp-.45)*10));const vfov=cam.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vfov/2)*asp),d=vw/(2*Math.tan(hf/2));
  let fx=KX+4.5;if(st==="aim")fx=KX*.4+mx*.6;else if(rl)fx=(KX+rl.a.g.position.x)/2;else if(st==="toss"||st==="dig")fx=(KX+hook.position.x)/2;else if(st==="catch")fx=KX+3;
  const lo=XMIN-1+vw/2,hi=XMAX+1-vw/2;fx=hi<lo?(lo+hi)/2:Math.max(lo,Math.min(hi,fx));
  tp=new THREE.Vector3(fx,1.6+d*.07,d);tl=new THREE.Vector3(fx,-.9,0)}
 const k=Math.min(1,dt*3.2);cam.position.lerp(tp,k);camLook.lerp(tl,k);cam.lookAt(camLook);

addEventListener("resize",resize);
/* ----- training ----- */
let tr=null;
function startTrain(){ac();st="train";setMode("menu");show("train");clearAnimals();marker.visible=false;hook.visible=false;ropeM.visible=false;tr={time:0,dur:12,good:0,miss:0,ph:0,rep:0,done:false,lift:0};$("bRep").disabled=false;trInfo();pose("lift",0)}
function trInfo(){$("trInfo").textContent=t("trInfo",{n:tr.good,t:Math.max(0,Math.ceil(tr.dur-tr.time))})}
function trainUpdate(dt){if(!tr)return;kitten.rotation.y=.35;
 if(!tr.done){tr.time+=dt;tr.ph+=dt/1.1;const p=Math.abs(((tr.ph%2)+2)%2-1);tr.m=p;$("gm").style.left=(p*100)+"%";trInfo();if(tr.time>=tr.dur)trainEnd()}

function repTap(){if(st!=="train"||!tr||tr.done)return;ac();const p=tr.m||0;
 if(p>=.35&&p<=.65){tr.good++;tr.lift=1;SFX.rep();burst(KX+.3,3.3,10,4);const f=sprite("💥",1.1);f.position.set(KX+.3,4.2,.9);world.add(f);setTimeout(()=>world.remove(f),500)}else{tr.miss++;SFX.oops();tr.lift=.35}trInfo()}
function trainEnd(){tr.done=true;$("bRep").disabled=true;let g=tr.good,lv=false;
 if(S<MAXS){SV.xp+=g;while(S<MAXS&&SV.xp>=need(S)){SV.xp-=need(S);S++;lv=true}if(S>=MAXS)SV.xp=0;SV.str=S}
 save();if(lv){popB=1;SFX.lvl();bannerShow(t("lvl",{n:S}));burst(KX+.3,3,50,7)}else SFX.catchS();

/* ----- loop ----- */
let last=performance.now(),paused=false;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(document.hidden)return;
 if(!paused)update(dt);else camUpdate(0);
 if(glOK)R.render(scene,cam)}
/* ----- pause ----- */
function doPause(on){if(!(st==="aim"||st==="toss"||st==="dig"||st==="reel"||st==="catch"||st==="after"||st==="train")&&on)return;paused=on;if(on){holdReel=false;holdBrace=false;show("pause")}else show(st==="train"?"train":null)}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&!paused)doPause(true)});
addEventListener("blur",()=>{holdReel=false;holdBrace=false});
/* ----- input ----- */
const press=(el,on,off)=>{el.addEventListener("pointerdown",e=>{e.preventDefault();ac();el.classList.add("on");try{el.setPointerCapture(e.pointerId)}catch(_){}on()});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>el.addEventListener(ev,()=>{el.classList.remove("on");off()}));el.addEventListener("contextmenu",e=>e.preventDefault())};
press($("bReel"),()=>{holdReel=true},()=>{holdReel=false});
press($("bBrace"),()=>{holdBrace=true;braceCh=Math.min(1,braceCh+.2);SFX.brace()},()=>{holdBrace=false});
$("bThrow").addEventListener("pointerdown",e=>{e.preventDefault();doThrow()});
$("bRep").addEventListener("pointerdown",e=>{e.preventDefault();repTap()});
$("playBtn").onclick=()=>{SFX.click();startRound()};$("trainBtn").onclick=()=>{SFX.click();startTrain()};$("bookBtn").onclick=()=>{SFX.click();st="book";drawBook();show("book")};
$("bkBack").onclick=()=>{SFX.click();toMenu()};$("trBack").onclick=()=>{SFX.click();toMenu()};
$("againBtn").onclick=()=>{SFX.click();startRound()};$("rTrain").onclick=()=>{SFX.click();startTrain()};$("rMenu").onclick=()=>{SFX.click();toMenu()};
$("pauseBtn").onclick=()=>{SFX.click();doPause(!paused)};$("resBtn").onclick=()=>{SFX.click();doPause(false)};$("pMenu").onclick=()=>{SFX.click();paused=false;toMenu()};
$("muteBtn").onclick=()=>{muted=!muted;ls.set("annabelle-muted",muted?"1":"0");updMute();if(!muted)SFX.click()};
document.addEventListener("click",e=>{const L=e.target.closest&&e.target.closest("[data-lang]");if(L){lang=L.dataset.lang;ls.set("annabelle-lang",lang);SFX.click();drawTexts();if(st==="book")drawBook()}});
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||(window.AnnabelleDesk&&AnnabelleDesk.typing(e)))return;
 if(e.code==="KeyM"){muted=!muted;ls.set("annabelle-muted",muted?"1":"0");updMute();return}
 if(e.code==="Escape"||e.code==="KeyP"){e.preventDefault();if(st==="menu"||st==="book"||st==="result"){return}doPause(!paused);return}
 if(st==="menu"){if(e.code==="Enter"||e.code==="Space"){e.preventDefault();$("playBtn").click()}else if(e.code==="KeyT")$("trainBtn").click();return}
 if(st==="result"){if(e.code==="Enter"||e.code==="Space"){e.preventDefault();$("againBtn").click()}return}
 if(paused)return;

 if(e.code==="Space"||e.code==="Enter"){e.preventDefault();ac();if(st==="aim"){if(!e.repeat)doThrow()}else if(st==="reel")holdReel=true}
 if(e.code==="KeyB"||e.code==="ShiftLeft"||e.code==="ShiftRight"){e.preventDefault();if(!e.repeat){holdBrace=true;braceCh=Math.min(1,braceCh+.2);SFX.brace()}}});
addEventListener("keyup",e=>{if(e.code==="Space"||e.code==="Enter")holdReel=false;if(e.code==="KeyB"||e.code==="ShiftLeft"||e.code==="ShiftRight")holdBrace=false});
/* test hooks */
window.__dr={get st(){return st},get S(){return S},get score(){return score},get throwsLeft(){return throwsLeft},get animals(){return animals.map(a=>({id:a.def.id,x:a.x,w:a.def.w,heavy:a.heavy}))},get ten(){return rl?rl.ten:null},get prog(){return rl?rl.p:null},get wave(){return !!(wv&&wv.active)},get braceCh(){return braceCh},get sv(){return SV},get glOK(){return glOK},
 setMarker(x){mk=Math.max(0,Math.min(1,(x-x0())/span()));mkDir=0;},forceWave(){waveForce=true},setS(n){S=n;SV.str=n;SV.xp=0;refreshHeavy();drawTexts()},caught:()=>caught.map(a=>a.id),span:()=>[x0(),x0()+span()],triangles:()=>R&&R.info.render.triangles};
updMute();drawTexts();
if(glOK){resize();cam.position.set(KX+2.2,2.6,9.5);camLook.set(KX+.2,1.2,0);requestAnimationFrame(loop)}
