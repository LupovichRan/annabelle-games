<script type="module">
import * as THREE from './vendor/three.module.min.js';
const $=id=>document.getElementById(id);
const pick=a=>a[Math.random()*a.length|0];
const fmt=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]);
let AC = null, muted = localStorage.getItem("annabelle-muted")==="1";
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(f, t0, dur, type="sine", vol=.2, f2=null){
  const c=ac(); if(!c||muted) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}
function noise(t0, dur, vol, filtF, q=1){
  const c=ac(); if(!c||muted) return null;
  const n=c.sampleRate*dur|0, b=c.createBuffer(1,n,c.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=b;
  const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=filtF; f.Q.value=q;
  const g=c.createGain(), t=c.currentTime+t0;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t+dur);
  return f;
}
function growlOsc(t0,dur,f1,f2,vol,cut){
  const c=ac(); if(!c||muted) return;
  const t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain(), lp=c.createBiquadFilter(), lfo=c.createOscillator(), lg=c.createGain();
  o.type="sawtooth"; o.frequency.setValueAtTime(f1,t); o.frequency.linearRampToValueAtTime(f2,t+dur);
  lp.type="lowpass"; lp.frequency.setValueAtTime(cut*0.5,t); lp.frequency.linearRampToValueAtTime(cut,t+dur*0.3); lp.frequency.linearRampToValueAtTime(cut*0.4,t+dur);
  lfo.frequency.value=28; lg.gain.value=vol*0.5; lfo.connect(lg).connect(g.gain);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*0.2); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp).connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t+dur+.05); lfo.stop(t+dur+.05);
}
function meow(base, t0=0, dur=.5){
  const c=ac(); if(!c||muted) return;
  const t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain(), bp=c.createBiquadFilter();
  o.type="sawtooth"; o.frequency.setValueAtTime(base,t); o.frequency.linearRampToValueAtTime(base*1.6,t+dur*.35); o.frequency.linearRampToValueAtTime(base*.9,t+dur);
  bp.type="bandpass"; bp.Q.value=4; bp.frequency.setValueAtTime(800,t); bp.frequency.linearRampToValueAtTime(2000,t+dur*.4); bp.frequency.linearRampToValueAtTime(900,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.06); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(bp).connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}


/* ============ SOUND EFFECTS ============ */
function boingSnd(){ const c=ac(); if(!c||muted) return; const t=c.currentTime, o=c.createOscillator(), g=c.createGain(), l=c.createOscillator(), lg=c.createGain();
  o.type="sine"; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(520,t+.07); o.frequency.exponentialRampToValueAtTime(210,t+.38);
  l.frequency.value=22; lg.gain.value=35; l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.4);
  o.connect(g).connect(c.destination); o.start(t); l.start(t); o.stop(t+.45); l.stop(t+.45); }
let chompI=0;
const SFX={
  click(){ tone(880,0,.06,"sine",.12); },
  jump(){ tone(400,0,.17,"triangle",.14,820); },
  jump2(){ tone(640,0,.14,"triangle",.13,1250); tone(950,.07,.12,"sine",.07,1600); },
  slide(){ noise(0,.38,.16,1500,1); },
  land(){ noise(0,.08,.08,500,1); },
  star(){ tone(1320,0,.08,"sine",.1); tone(1760,.06,.13,"sine",.09); },
  snack(){ chompI++; tone(chompI%2?560:420,0,.07,"triangle",.12,chompI%2?380:600); tone(500,.09,.07,"triangle",.1,330); },
  power(){ growlOsc(0,.9,115,62,.32,1000); noise(0,.9,.13,700); },
  hit(){ boingSnd(); noise(0,.15,.3,350,1); },
  splash(){ noise(0,.5,.35,3200,.7); for(let i=0;i<5;i++) tone(1300+Math.random()*900,.06+i*.07,.07,"sine",.08,500); },
  leaves(){ noise(0,.4,.18,4000,.5); boingSnd(); },
  bonk(){ tone(260,0,.12,"square",.08,120); boingSnd(); },
  shield(){ [784,988,1175,1568].forEach((f,i)=>tone(f,i*.06,.15,"sine",.09)); },
  pop(){ noise(0,.12,.25,2500,1); tone(900,0,.15,"sine",.1,300); },
  warn(){ tone(1000,0,.07,"square",.04); tone(1000,.12,.07,"square",.04); },
  mile(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.12,"square",.06)); },
  snore(){ tone(110,0,.6,"sawtooth",.03,90); },
  tryagain(){ [523,466,440].forEach((f,i)=>tone(f,i*.16,.25,"sine",.12)); },
  ready(){ [392,523,659].forEach((f,i)=>tone(f,i*.15,.14,"triangle",.12)); },
  win(){ [523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.13,.22,"square",.07)); [262,330,392].forEach(f=>tone(f,.9,.8,"triangle",.08)); },
  boing(){ boingSnd(); tone(700,.1,.1,"sine",.08,1100); },
  power2(){ [659,784,988,1319].forEach((f,i)=>tone(f,i*.07,.14,"sine",.1)); },
  meow(){ meow(560,0,.4); }
};

 he:{dir:"rtl",title:"המרוץ בסוואנה 3D",

function mkGround(){

    for(let i=0;i<260;i++){ x.fillStyle=`rgba(${150+rnd()*60|0},${110+rnd()*40|0},60,${.08+rnd()*.12})`; x.beginPath(); x.arc(rnd()*w,rnd()*h,2+rnd()*7,0,7); x.fill(); }

/* ============ obstacles / items ============ */
function clearObjs(){ for(const o of objs) scene&&o.mesh&&scene.remove(o.mesh); objs=[]; }
function addObs(k,lane,z,full){
  const d=OB[k]; let w=d.w; if(full) w=(k==="log"||k==="branch")?LANE*3+.8:w;
  const x=full?0:LX[lane], mesh=mkObsMesh(k,w); mesh.position.set(x,0,z); scene.add(mesh);
  const o={k,ob:true,x,z,w,d:d.d,h:d.h,y0:d.y0||0,mesh,vz:k==="coco"?7:0,t:Math.random()*5,lane}; objs.push(o); return o;
}
function addItem(k,x,y,z){ const mesh=mkItemMesh(k); mesh.position.set(x,y,z); scene.add(mesh); const o={k,col:true,x,y,z,mesh,pw:k==="magnet"||k==="shield"}; objs.push(o); return o; }
function wpick(pool){ let s=pool.reduce((a,b)=>a+b[1],0), r=Math.random()*s; for(const [k,w] of pool){ r-=w; if(r<=0) return k; } return pool[0][0]; }
function spawnPattern(){
  if(TEST.noSpawn){ nextSpawn=4; return; }
  const z=SPAWN_Z, lanes=[0,1,2].sort(()=>Math.random()-.5);
  if(dist>70&&dist-lastPower>200+Math.random()*120){ lastPower=dist; addItem(Math.random()<.5?"magnet":"shield",LX[lanes[0]],1.1,z); nextSpawn=speed*.9; return; }
  if(hearts<D.hmax&&dist-lastHeart>D.heartEvery&&dist>60){ lastHeart=dist+Math.random()*60; addItem("heart",LX[lanes[0]],1.1,z); nextSpawn=speed*.8; return; }
  const pool=[["rock",3],["log",3],["puddle",2.2]]; if(dist>60) pool.push(["branch",3]); if(dist>140) pool.push(["croc",2.5]); if(dist>220) pool.push(["coco",2]);
  const k=wpick(pool), air=2*JV/G*speed; let depth=1, free=lanes;
  if(k==="branch"){ const full=Math.random()<.45; addObs("branch",lanes[0],z,full); free=full?[]:lanes.slice(1); depth=1; }
  else if(k==="log"&&Math.random()<.3){ addObs("log",1,z,true); free=[]; }
  else { const n=(dist>120&&Math.random()<.4)?2:1; for(let i=0;i<n;i++) addObs(k,lanes[i],z-(k==="coco"?24:0),false); free=lanes.slice(n); depth=OB[k].d; }
  const itemKinds=()=>Math.random()<.22?(Math.random()<.5?"fish":"meat"):"star";
  if(k==="branch"){ for(let i=0;i<4;i++) addItem("star",LX[lanes[0]],.55,z-1.4+i*1.3); }
  else if(k!=="coco"&&Math.random()<.6){ const L=lanes[0]; for(let i=0;i<5;i++){ const f=(i/4)*2-1; addItem(itemKinds(),LX[L],.7+2.0*(1-f*f)*.62,z-air*.45*f); } }
  else if(free.length&&Math.random()<.7){ const L=free[0], n=4+(Math.random()*3|0); for(let i=0;i<n;i++) addItem(itemKinds(),LX[L],.8,z-i*1.1); }
  nextSpawn=Math.max(10,(depth+speed*(1.05+Math.random()*.75)+air*.3)*D.gap+(k==="coco"?5:0));
}

/* ============ gameplay ============ */
const sliding=()=>pl.slideT>0||(pl.slideHold&&pl.onGround);
function jump(){
  if(state!=="play"||pl.tumble>0) return;
  if(pl.onGround||(pl.coy>0&&pl.jumps===0)){ pl.vy=JV; pl.onGround=false; pl.coy=0; pl.jumps=1; pl.slideT=0; stats.jumps++; SFX.jump(); puff(pl.x,.05,0,5,0xf6d59a); }
  else if(pl.jumps<2){ pl.vy=JV2; pl.jumps=2; pl.flip=1; stats.doubleJumps++; SFX.jump2(); puff(pl.x,pl.y+.3,0,6,0xffffff); if(Math.random()<.25) floatTxt(pl.x,pl.y+1.9,0,T[lang].hop||"!","#7c5cff"); }
  else pl.jbuf=.14;   // jump buffering: a tap just before landing is remembered
}
function slide(hold){
  if(state!=="play"||pl.tumble>0) return;
  if(hold) pl.slideHold=true;
  if(!pl.onGround){ pl.vy=Math.min(pl.vy,-22); pl.slideQ=true; return; }
  if(pl.slideT<=0){ SFX.slide(); stats.slides++; puff(pl.x,.05,.3,6,0xf6d59a); }
  pl.slideT=.75;
}
function lane(d){
  if(state!=="play") return; const n=Math.max(0,Math.min(2,pl.lane+d)); if(n===pl.lane) return; pl.lane=n; stats.lane++; SFX.swish&&SFX.swish(); tone(520+n*90,0,.07,"triangle",.07,700+n*90);
}
function puff(x,y,z,n,col){ for(let i=0;i<n;i++){ const p=partPool.find(q=>q.life<=0); if(!p) return; p.life=p.max=.5+Math.random()*.3; p.m.visible=true; p.m.material.color.setHex(col); p.m.position.set(x+(Math.random()-.5)*.5,y,z+(Math.random()-.5)*.5); p.vx=(Math.random()-.5)*3; p.vy=1+Math.random()*2.5; p.vz=1+Math.random()*2; p.gr=6; p.m.scale.setScalar(.7+Math.random()*.8); } }
function spark(x,y,z,n,col){ for(let i=0;i<n;i++){ const p=partPool.find(q=>q.life<=0); if(!p) return; const a=Math.random()*6.28; p.life=p.max=.5; p.m.visible=true; p.m.material.color.setHex(col); p.m.position.set(x,y,z); p.vx=Math.cos(a)*3.5; p.vy=Math.sin(a)*3.5+1; p.vz=(Math.random()-.5)*3; p.gr=0; p.m.scale.setScalar(.8); } }
const _v=new THREE.Vector3();
function floatTxt(x,y,z,txt,col){ if(!camera) return; _v.set(x,y,z).project(camera); const el=document.createElement("div"); el.className="fl"; el.textContent=txt; el.style.color=col; el.style.left=((_v.x*.5+.5)*innerWidth)+"px"; el.style.top=((-_v.y*.5+.5)*innerHeight)+"px"; $("floats").appendChild(el); requestAnimationFrame(()=>el.classList.add("up")); setTimeout(()=>el.remove(),900); }

function hit(o){
  o.hit=true; if(TEST.god) return;
  if(pl.shield>0){ pl.shield=0; pl.inv=1.1; stats.shieldBlocks++; SFX.pop(); toast(T[lang].shieldSave,"#3fa9ff"); spark(pl.x,pl.y+.8,0,14,0x9fd8ff); return; }
  if(D.silly&&Math.random()<D.silly){ pl.inv=D.sillyInv; stats.sillies++; SFX.boing(); pl.roar=.5; floatTxt(pl.x,pl.y+1.9,0,"😄","#ff7a3d"); spark(pl.x,pl.y+.8,0,8,0xffd23f); toast(pick(T[lang].silly),"#ff7a3d"); return; }
  hearts--; stats.hits++; pl.tumble=D.tumble; pl.inv=D.inv; pl.slideT=0; pl.slideHold=false; slowF=D.slow; shakeT=.35; streak=0;
  if(pl.onGround){ pl.vy=7; pl.onGround=false; } else pl.vy=Math.max(pl.vy,3);
  ({puddle:SFX.splash,branch:SFX.leaves,coco:SFX.bonk}[o.k]||SFX.hit)();
  if(o.k==="puddle") puff(pl.x,.2,0,12,0x5ab8ff); if(o.k==="branch") puff(pl.x,1.2,0,10,0x5cc46a);
  toast(pick(T[lang].hit[o.k]),"#ff4d6d"); updateHUD(); if(hearts<=0){ state="fall"; stateT=0; }
}
function collect(o){
  o.got=true; stats.collected++; const px=o.x, py=o.y+.4;
  if(o.k==="heart"){ if(hearts<D.hmax) hearts++; SFX.power2(); toast(T[lang].extra,"#ff4d6d"); pl.roar=.6; floatTxt(o.x,py,o.z,"+💖","#ff4d6d"); updateHUD(); }
  else if(o.pw){ stats.powers++; pl.roar=.9; SFX.power(); toast(T[lang].power[o.k],"#ff7a3d"); if(o.k==="magnet") pl.magnet=9; else pl.shield=12; pts+=50; floatTxt(o.x,py,o.z,"+50","#ff7a3d"); }
  else if(o.k==="star"){ pts+=10; SFX.star(); floatTxt(o.x,py,o.z,"+10","#f2a800"); }
  else { pts+=25; SFX.snack(); floatTxt(o.x,py,o.z,"+25","#e8487f"); if(Math.random()<.3) toast(pick(T[lang].yum),"#34c47c"); }
  spark(px,o.y,o.z,6,o.k==="star"?0xffd23f:0xff9fbf);
  scene.remove(o.mesh);
}
function update(dt){
  gtime+=dt;
  if(state==="menu"){ return; }
  if(state!=="play"&&state!=="fall") return;
  stateT+=dt; if(goT>0) goT-=dt;
  slowF=Math.min(1,slowF+dt*.6);
  const target=D.spd0+(D.spdmax-D.spd0)*(1-Math.exp(-dist/D.ramp));
  speed=target*slowF*(state==="fall"?Math.max(0,1-stateT*1.2):1);
  const dx=speed*dt; dist+=dx;
  pl.ph+=dt*(7+speed*.85); pl.roar=Math.max(0,pl.roar-dt); pl.inv=Math.max(0,pl.inv-dt); pl.magnet=Math.max(0,pl.magnet-dt); if(pl.shield>0) pl.shield=Math.max(0,pl.shield-dt);
  pl.flip=Math.max(0,pl.flip-dt*2.4); if(pl.tumble>0) pl.tumble=Math.max(0,pl.tumble-dt);
  if(pl.jbuf>0) pl.jbuf-=dt;
  pl.x+=(LX[pl.lane]-pl.x)*(1-Math.exp(-dt*13));
  if(pl.onGround) pl.coy=.1; else if(pl.coy>0) pl.coy-=dt;
  if(!pl.onGround){ pl.vy-=G*dt; pl.y+=pl.vy*dt; if(pl.y<=0){ pl.y=0; pl.vy=0; pl.onGround=true; pl.jumps=0; if(state==="play") SFX.land(); puff(pl.x,.05,0,4,0xf6d59a);
    if(pl.jbuf>0&&state==="play"){ pl.jbuf=0; jump(); }
    if(pl.slideQ){ pl.slideQ=false; if(state==="play"&&pl.tumble<=0){ pl.slideT=0; slide(); } } } }
  if(pl.slideT>0) pl.slideT=Math.max(0,pl.slideT-dt);
  if(pl.onGround&&state==="play"&&Math.random()<dt*10) puff(pl.x,.04,.5,1,0xf6d59a);
  if(state==="play"){ nextSpawn-=dx; if(nextSpawn<=0) spawnPattern(); }
  const pcy=pl.y+.6;
  for(const o of objs){
    o.z+=dx+(o.vz||0)*dt; o.t+=dt;
    if(o.mesh){ o.mesh.position.z=o.z; }
    if(o.col&&!o.got){
      if(pl.magnet>0&&o.z>-14&&o.z<3){ const k=Math.min(1,dt*9); o.x+=(pl.x-o.x)*k; o.y+=(pcy-o.y)*k; o.z+= (0-o.z)*k*.5; o.mesh.position.set(o.x,o.y,o.z); }
      o.mesh.position.y=o.y+Math.sin(o.t*4)*.08; o.mesh.rotation.y=o.t*2.2;
      if(state==="play"){ const r=Math.hypot(pl.x-o.x,pcy-o.y,o.z); if(r<(.95+(D.margin||0))) collect(o); }
    }
    if(o.ob&&o.mesh){
      if(o.k==="coco"&&o.mesh.userData.roll) o.mesh.userData.roll.rotation.x+=(dx+o.vz*dt)/.42;
      if(o.k==="puddle"&&o.mesh.userData.ring){ o.mesh.userData.ring.scale.setScalar(1+((o.t*.8)%1)); }
      if(o.k==="croc"){ o.mesh.position.y=Math.sin(o.t*2)*.02; }
    }
    if(o.ob&&!o.hit&&state==="play"){
      const sl=sliding(), pb=pl.y, pt=pl.y+(sl?PHS:PH), m=(o.k==="puddle"?.2:.12)+D.margin;
      const oX=Math.abs(pl.x-o.x)<o.w/2+.36-m, oZ=Math.abs(o.z)<o.d/2+.3-m*.6, ob=o.y0, ot=o.y0+o.h;
      const oY=o.k==="puddle"?pb<.06:(pt>ob+.05&&pb<ot-.05);
      if(oX&&oZ&&oY&&pl.inv<=0) hit(o);
      if(o.k==="coco"&&o.z>-42&&o.z<-20&&gtime-lastWarn>1.2&&!o.warned){ o.warned=true; lastWarn=gtime; SFX.warn(); }
      if(!o.passed&&o.z-o.d/2>.4){ o.passed=true; if(!o.hit){ streak++; if(o.k==="croc"){ floatTxt(pl.x+(o.x-pl.x)*.5,1.4,.5,T[lang].zzz,"#2f7d32"); SFX.snore(); } if(streak%8===0) toast(pick(T[lang].cheer),"#7c5cff"); } }
    }
  }
  objs=objs.filter(o=>{ if(o.z>9||o.got){ if(!o.got&&o.mesh) scene.remove(o.mesh); return false; } return true; });
  shakeT=Math.max(0,shakeT-dt);
  score=Math.floor(dist)+pts;
  if(state==="play"&&dist>=nextMile){ toast(fmt(T[lang].mile,{d:nextMile}),"#34c47c"); SFX.mile(); nextMile+=250; }
  if(state==="fall"&&stateT>1.7) gameOver();
  updateHUDnum();
}

/* ============ animate + render ============ */
function animate(dt){
  const run=(state==="play"||state==="fall"||state==="paused");
  const spdv=run?speed:0;
  // scenery scroll
  const dz=(state==="play"||state==="fall")?spdv*dt:dt*2;
  groundTex.offset.y+=dz/9; grassTex.offset.y+=dz/10;
  for(const s of scenery){ s.m.position.z+=dz; if(s.m.position.z>9){ s.m.position.z-= s.k==="tree"?100:s.k==="tuft"?79:104; const base=s.k==="tree"?6:s.k==="tuft"?4.3:4.6; s.m.position.x=s.side*(base+Math.random()*(s.k==="tree"?14:10)); } }
  for(const c of clouds){ c.g.position.x+=c.v*dt; if(c.g.position.x>90) c.g.position.x=-90; }
  // particles
  for(const p of partPool){ if(p.life<=0) continue; p.life-=dt; if(p.life<=0){ p.m.visible=false; continue; } p.vy-=p.gr*dt; p.m.position.x+=p.vx*dt; p.m.position.y=Math.max(.02,p.m.position.y+p.vy*dt); p.m.position.z+=(p.vz+(run?spdv:0))*dt; p.m.material.opacity=Math.min(1,p.life/p.max*1.6); }
  // cat
  const P=catParts, cat=catG;
  if(state==="menu"){
    const t=gtime; cat.position.set(0,Math.abs(Math.sin(t*3))*.06,0); cat.rotation.set(0,Math.PI+Math.sin(t*.8)*.5,0); cat.scale.setScalar(1.1);
    P.body.rotation.set(0,0,0); P.body.position.set(0,0,0); P.head.rotation.set(0,Math.sin(t*1.6)*.15,0);
    P.legs.forEach(l=>l.p.rotation.x=0); P.tail.forEach((s,i)=>{s.rotation.z=Math.sin(t*3+i*.6)*.3;s.rotation.x=-.32});
    P.tailRoot.rotation.x=1.15; cat.visible=true; shieldMesh.visible=false; magnetMesh.visible=false;
    camera.position.set(0,1.5,6.2); camera.lookAt(0,-.15,0); camera.rotation.z=0; return;
  }
  if(!pl) return;
  const ph=pl.ph, air=!pl.onGround, sl=sliding()&&!air, tum=pl.tumble>0;
  cat.position.set(pl.x,pl.y,0); cat.rotation.set(0,0,0); cat.scale.setScalar(1.25);
  P.body.position.set(0,run&&pl.onGround&&!sl?Math.abs(Math.sin(ph))*.07:0,0);
  P.body.rotation.set(0,0,0);
  P.head.rotation.set(0,0,0);
  const sw=.9;
  P.legs.forEach((l,i)=>{ const f=l.front, s=(i===0||i===3)?1:-1; let a=Math.sin(ph)*sw*s; if(air) a=f?-.75:.7; if(sl) a=f?-1.1:1.1; if(state==="menu"||!run) a=0; l.p.rotation.x=a; });
  P.tail.forEach((s,i)=>{ s.rotation.z=Math.sin(ph*.5+i*.8)*.2; s.rotation.x=-.32; });
  P.tailRoot.rotation.x=1.2-(air?.3:0);
  if(sl){ cat.rotation.x=-.5; cat.scale.y=.95; cat.position.y=pl.y-.05; P.head.rotation.x=.35; }
  if(pl.flip>0){ cat.rotation.x=-(1-pl.flip)*Math.PI*2; cat.position.y=pl.y+.25; }
  if(tum){ const k=pl.tumble/D.tumble; cat.rotation.z=Math.sin(k*18)*.5*k; cat.rotation.x=-.25*k; }
  if(state==="fall"){ const k=Math.min(1,stateT*1.2); cat.rotation.z=k*1.45; cat.position.y=pl.y+.2*k; P.legs.forEach(l=>l.p.rotation.x=.4); }
  cat.visible=true;
  if(pl.inv>0&&state==="play") cat.visible=Math.floor(gtime*12)%2===0||pl.inv>D.inv-.25;
  shieldMesh.visible=pl.shield>0&&(pl.shield>2||Math.floor(gtime*8)%2===0); shieldMesh.position.set(pl.x,pl.y+.7,0);
  magnetMesh.visible=pl.magnet>0; magnetMesh.position.set(pl.x,pl.y+.7,0); magnetMesh.rotation.set(Math.PI/2,0,0); magnetMesh.scale.setScalar(1+((gtime*1.5)%1)*.8); magnetMesh.material.opacity=.5*(1-((gtime*1.5)%1));
  // camera: behind and above, looking down the track
  const tx=pl.x*.6, ty=3.8+pl.y*.35, sh=shakeT>0?shakeT:0;
  camera.position.x+=(tx-camera.position.x)*(1-Math.exp(-dt*7)); camera.position.y+=(ty-camera.position.y)*(1-Math.exp(-dt*7)); camera.position.z=7.2;
  camera.position.x+=Math.sin(gtime*70)*sh*.12; camera.position.y+=Math.cos(gtime*63)*sh*.1;
  camera.lookAt(pl.x*.4,.7+pl.y*.2,-10);
  camera.rotation.z=(pl.x-LX[pl.lane])*.04;
}
function render(){ renderer.render(scene,camera); }
function resize(){
  DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
  if(!renderer) return; renderer.setPixelRatio(DPR); renderer.setSize(W,H,false);
  camera.aspect=W/H; camera.fov=W<H?(menuLike()?58:72):62; camera.updateProjectionMatrix();
}
const menuLike=()=>state==="menu";
addEventListener("resize",resize);

/* ============ HUD / UI ============ */
let lastHud="";
function updateHUD(){ $("hearts").innerHTML=Array.from({length:D.hmax},(_,i)=>HEART(i<hearts?"":"lost")).join(""); lastHud=""; updateHUDnum(); }
function updateHUDnum(){ const s=Math.floor(dist)+"|"+score+"|"+Math.ceil(pl?pl.magnet:0)+"|"+Math.ceil(pl?pl.shield:0)+"|"+(goT>0); if(s===lastHud) return; lastHud=s; $("dist").textContent=Math.floor(dist); $("score").textContent=score;
  const pw=$("powers"); pw.innerHTML=(pl&&pl.magnet>0?'<span class="pw m">🧲 '+Math.ceil(pl.magnet)+'</span>':"")+(pl&&pl.shield>0?'<span class="pw s">🛡️ '+Math.ceil(pl.shield)+'</span>':"");
  const gb=$("goBanner"); gb.textContent=T[lang].go; gb.classList.toggle("on",state==="play"&&goT>0); }
let toastT=null;
function toast(txt,col){ const el=$("toast"); el.textContent=txt; el.dir="auto"; el.style.boxShadow=`0 0 0 4px ${col},0 6px 0 #0002`; el.style.color=col; el.style.top=(($("hud").offsetHeight||56)+8)+"px";
  el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1500); }
function applyLang(){ const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir; document.title=t.title;
  $("tTitle").textContent=t.title; $("tHow").textContent=t.how; $("tCtrl").textContent=t.ctrl; $("keysMenu").textContent=$("keysPause").textContent=t.keys; $("playBtn").textContent=t.play; $("tChoose").textContent=t.choose; $("tM").textContent=t.m; $("go2d").textContent=t.d2;
  $("pauseTitle").textContent=t.paused; $("resumeBtn").textContent=t.resume; $("restartBtn").textContent=t.restart; $("pMenuBtn").textContent=t.menu; $("againBtn").textContent=t.again; $("oMenuBtn").textContent=t.menu; renderMenu(); }
function renderMenu(){ const t=T[lang], best=LS.best();
  $("langs").innerHTML=LANGS.map(([k,l])=>`<button class="lang ${k===lang?"sel":""}" data-lang="${k}" dir="auto">${l}</button>`).join("");
  $("chars").innerHTML=CHAR_KEYS.map(k=>{ const lock=best<CHAR_NEED[k]; return `<button class="ch ${k===hero?"sel":""} ${lock?"locked":""}" data-ch="${k}"><span class="em">${HERO[k].emoji}</span><span>${t.chars[k]}</span>${lock?`<small>${fmt(t.lock,{n:CHAR_NEED[k]})}</small>`:""}</button>`; }).join("");
  $("tDiffT").textContent=t.diffT; $("diffs").innerHTML=["easy","normal"].map(k=>`<button class="lang ${k===diff?"sel":""}" data-diff="${k}" dir="auto">${t["diff_"+k]}</button>`).join("");
  $("bestLine").textContent=LS.best3()?`🏆 ${t.best}: ${LS.best3()}`:""; }
document.addEventListener("click",e=>{
  const df=e.target.closest("[data-diff]"); if(df){ setDiff(df.dataset.diff); SFX.click(); renderMenu(); return; }
  const l=e.target.closest("[data-lang]"), ch=e.target.closest("[data-ch]");
  if(l){ lang=l.dataset.lang; sset("annabelle-lang",lang); SFX.click(); applyLang(); }
  if(ch){ const k=ch.dataset.ch; if(LS.best()>=CHAR_NEED[k]){ hero=k; sset("annabelle-runner-char",k); SFX.meow(); renderMenu(); if(scene) buildCat(); } else SFX.click(); }
});
$("playBtn").onclick=()=>{ ac(); SFX.click(); startGame(); };
$("pauseBtn").onclick=()=>{ SFX.click(); pause(); };
$("resumeBtn").onclick=()=>{ SFX.click(); resume(); };
$("restartBtn").onclick=()=>{ SFX.click(); startGame(); };
$("pMenuBtn").onclick=$("oMenuBtn").onclick=()=>{ SFX.click(); toMenu(); };
$("againBtn").onclick=()=>{ SFX.click(); startGame(); };
function updateMute(){ $("muteBtn").textContent=$("muteBtn2").textContent=muted?"🔇":"🔊"; }
$("muteBtn").onclick=$("muteBtn2").onclick=()=>{ muted=!muted; sset("annabelle-muted",muted?"1":"0"); updateMute(); if(!muted) SFX.click(); };
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pause(); });
/* ============ CONFETTI ============ */
let confRaf=null;
function confetti(){
  const c=$("confetti"), x=c.getContext("2d"); c.width=innerWidth*DPR; c.height=innerHeight*DPR; x.setTransform(DPR,0,0,DPR,0,0);
  const cols=["#ff7a3d","#7c5cff","#34c47c","#ffd23f","#ff5d8f","#3fc5ff"];
  const P=Array.from({length:170},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight,vx:(Math.random()-.5)*2.5,vy:2+Math.random()*3,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.random()*cols.length|0],paw:Math.random()<.15}));
  let f=0; cancelAnimationFrame(confRaf);
  (function step(){ x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y>innerHeight+20&&f<420){p.y=-20;p.x=Math.random()*innerWidth;}
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); if(p.paw){x.font=`${p.s*2.4}px sans-serif`; x.fillText("🐾",0,0);} else {x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);} x.restore(); });
    f++; if(f<700) confRaf=requestAnimationFrame(step); else x.clearRect(0,0,innerWidth,innerHeight); })();
}
function stopConfetti(){ cancelAnimationFrame(confRaf); const c=$("confetti"); c.getContext("2d").clearRect(0,0,c.width,c.height); }



/* ============ FLOW ============ */
const PRIMARY={menu:"playBtn",pause:"resumeBtn",over:"againBtn"};
function show(id){ ["menu","pause","over"].forEach(o=>$(o).classList.toggle("show",o===id));
  if(window.AnnabelleDesk&&AnnabelleDesk.isDesk()){ if(id&&PRIMARY[id]) setTimeout(()=>{ try{ $(PRIMARY[id]).focus({preventScroll:true}); }catch(_){} },30); else if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); } }
function startGame(){ resetRun(); stopConfetti(); state="play"; stateT=0; show(null); $("hud").classList.remove("hidden"); $("muteBtn").classList.add("hidden"); resize(); updateHUD(); SFX.ready(); camera.position.set(0,3.8,7.2); }
function toMenu(){ state="menu"; stopConfetti(); clearObjs(); pl=null; $("hud").classList.add("hidden"); $("muteBtn").classList.remove("hidden"); $("powers").innerHTML=""; $("goBanner").classList.remove("on"); renderMenu(); show("menu"); resize(); }
function pause(){ if(state==="play"||state==="fall"){ prevState=state; state="paused"; show("pause"); } }
function resume(){ if(state==="paused"){ state=prevState; show(null); } }
function gameOver(){
  state="over"; const t=T[lang], prev=LS.best(), rec=score>LS.best3();
  if(rec) sset("annabelle-runner3d-best",score);
  const newly=CHAR_KEYS.filter(k=>prev<CHAR_NEED[k]&&score>=CHAR_NEED[k]);
  $("overHero").className=rec?"jumpers":"tired"; $("overHero").innerHTML='<span style="font-size:clamp(70px,22vw,110px)">'+HERO[hero].emoji+'</span>';
  $("overTitle").textContent=rec?t.win:t.overT; $("overTitle").className=rec?"winT":"";
  $("overSub").textContent=fmt(t.overS,{d:Math.floor(dist),s:score});
  $("overRec").textContent=rec?t.rec:""; $("overUnlock").textContent=newly.length?fmt(t.unlock,{c:newly.map(k=>t.chars[k]).join(", ")}):"";
  $("againBtn").textContent=t.again; $("oMenuBtn").textContent=t.menu;
  show("over"); if(rec){ SFX.win(); confetti(); } else SFX.tryagain();
}

/* ============ INPUT ============ */
addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||(window.AnnabelleDesk&&AnnabelleDesk.typing(e))) return;
  const c=e.code, onBtn=e.target&&e.target.closest&&e.target.closest("button,a");
  if(c==="KeyM"){ if(!e.repeat){ muted=!muted; sset("annabelle-muted",muted?"1":"0"); updateMute(); if(!muted) SFX.click(); } return; }
  if(c==="KeyP"||c==="Escape"){ e.preventDefault(); if(e.repeat) return; if(state==="paused") resume(); else if(state==="over") toMenu(); else pause(); return; }
  if(c==="Space"||c==="Enter"){
    if(onBtn) return; e.preventDefault(); ac();
    if(state==="menu"||state==="over"){ if(!e.repeat) startGame(); return; }
    if(state==="paused"){ if(!e.repeat) resume(); return; }
    if(c==="Space"&&!e.repeat) jump(); return; }
  if(c==="ArrowUp"||c==="KeyW"){ e.preventDefault(); ac(); if(state==="play"&&!e.repeat) jump(); return; }
  if(c==="ArrowDown"||c==="KeyS"){ e.preventDefault(); if(!e.repeat) slide(true); return; }
  if(c==="ArrowLeft"||c==="KeyA"){ if(state==="play"){ e.preventDefault(); if(!e.repeat) lane(-1); } return; }
  if(c==="ArrowRight"||c==="KeyD"){ if(state==="play"){ e.preventDefault(); if(!e.repeat) lane(1); } return; }
});
addEventListener("keyup",e=>{ if((e.code==="ArrowDown"||e.code==="KeyS")&&pl) pl.slideHold=false; });
addEventListener("blur",()=>{ if(pl) pl.slideHold=false; if(window.AnnabelleDesk&&AnnabelleDesk.isDesk()) pause(); });
let ptr=null;
cv.addEventListener("pointerdown",e=>{ ac(); if(state!=="play") return; e.preventDefault(); ptr={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),done:false}; });
addEventListener("pointermove",e=>{ if(!ptr||e.pointerId!==ptr.id||ptr.done) return; const dx=e.clientX-ptr.x, dy=e.clientY-ptr.y, th=Math.max(26,Math.min(44,innerWidth*.07));
  if(Math.abs(dx)>th&&Math.abs(dx)>Math.abs(dy)){ ptr.done=true; lane(dx>0?1:-1); }
  else if(dy>th&&dy>Math.abs(dx)){ ptr.done=true; slide(); }
  else if(dy<-th&&Math.abs(dy)>Math.abs(dx)){ ptr.done=true; jump(); } });
addEventListener("pointerup",e=>{ if(ptr&&e.pointerId===ptr.id){ if(!ptr.done) jump(); ptr=null; } });
addEventListener("pointercancel",()=>{ ptr=null; });
document.addEventListener("dblclick",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ============ LOOP ============ */
let lastT=0;
function frame(t){ const dt=Math.min(.05,(t-lastT)/1000||0); lastT=t;
  try{ if(state!=="paused") update(dt); animate(dt); render(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame); }

window.__run3={
  info:()=>({state,hearts,dist,score,pts,speed,hero,lane:pl&&pl.lane,x:pl&&pl.x,player:pl&&{y:pl.y,vy:pl.vy,onGround:pl.onGround,jumps:pl.jumps,sliding:sliding(),tumble:pl.tumble,inv:pl.inv,shield:pl.shield,magnet:pl.magnet,jbuf:pl.jbuf},
    objs:objs.map(o=>({k:o.k,x:o.x,y:o.y,z:o.z,hit:!!o.hit})),stats:{...stats},tris:renderer?renderer.info.render.triangles:0,calls:renderer?renderer.info.render.calls:0}),
  spawn:(k,lane,z)=>{ if(OB[k]){ const full=lane===-1; addObs(k,full?1:lane,z,full); } else addItem(k,LX[lane],1.0,z); },
  step:(n,dt=1/60)=>{ for(let i=0;i<n;i++){ if(state!=="paused") update(dt); } animate(dt); },
  clear:()=>clearObjs(), test:TEST, setInv:v=>{pl.inv=v}, setDiff, setDist:d=>{dist=d;nextMile=Math.ceil((d+1)/250)*250}, THREE
};

/* ============ BOOT ============ */
updateMute();
if(boot()){ applyLang(); requestAnimationFrame(t=>{ lastT=t; frame(t); }); document.body.dataset.ready="1"; }
else { applyLang(); document.body.dataset.ready="nogl"; }

</script>
</body>
