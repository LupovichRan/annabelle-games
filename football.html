 if(muted)return;const a=ac();if(!a)return;const n=a.currentTime+delay,len=Math.ceil(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),dat=buf.getChannelData(0);

 const g=a.createGain();g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+Math.min(.02,d/4));g.gain.exponentialRampToValueAtTime(.0008,n+d);s.connect(fl).connect(g).connect(a.destination);s.start(n)}
