<script>
"use strict";
try{ if(window.self!==window.top||/(^|\.)aired\.sh$/.test(location.hostname)) document.documentElement.classList.add("hosted"); }catch(e){ document.documentElement.classList.add("hosted"); }
let AC = null, muted = localStorage.getItem("annabelle-muted")==="1";
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(f, t0, dur, type="sine", vol=.2, f2=null){
  const c=ac(); if(!c||muted) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}
function noise(t0, dur, vol, filtF, q=1){
  const c=ac(); if(!c||muted) return null;
  const n=c.sampleRate*dur|0, b=c.createBuffer(1,n,c.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=b;
  const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=filtF; f.Q.value=q;
  const g=c.createGain(), t=c.currentTime+t0;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*0.25); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t+dur);
  return f;
}
function growlOsc(t0,dur,f1,f2,vol,cut){
  const c=ac(); if(!c||muted) return;
  const t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain(), lp=c.createBiquadFilter(), lfo=c.createOscillator(), lg=c.createGain();
  o.type="sawtooth"; o.frequency.setValueAtTime(f1,t); o.frequency.linearRampToValueAtTime(f2,t+dur);
  lp.type="lowpass"; lp.frequency.setValueAtTime(cut*0.5,t); lp.frequency.linearRampToValueAtTime(cut,t+dur*0.3); lp.frequency.linearRampToValueAtTime(cut*0.4,t+dur);
  lfo.frequency.value=28; lg.gain.value=vol*0.5; lfo.connect(lg).connect(g.gain);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*0.2); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp).connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t+dur+.05); lfo.stop(t+dur+.05);
}
function meow(base, t0=0, dur=.5){
  const c=ac(); if(!c||muted) return;
  const t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain(), bp=c.createBiquadFilter();
  o.type="sawtooth"; o.frequency.setValueAtTime(base,t); o.frequency.linearRampToValueAtTime(base*1.6,t+dur*.35); o.frequency.linearRampToValueAtTime(base*.9,t+dur);
  bp.type="bandpass"; bp.Q.value=4; bp.frequency.setValueAtTime(800,t); bp.frequency.linearRampToValueAtTime(2000,t+dur*.4); bp.frequency.linearRampToValueAtTime(900,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.06); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(bp).connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}

function load(){
  try{ const o=JSON.parse(localStorage.getItem(SKEY)||"null"); if(!o||o.v!==1||!Array.isArray(o.cats)) return null;
    const f=freshState(); const st=Object.assign(f,o,{rainT:0});
    st.stats=Object.assign(freshState().stats,o.stats||{});
    st.cats=f.cats.map(fc=>Object.assign(fc,(o.cats.find(x=>x.id===fc.id)||{})));
    const away=Math.max(0,(Date.now()-(o.t||Date.now()))/1000);
    if(away>30){ const k=Math.min(30,away/60*2); st.cats.forEach(c=>{ c.hun=Math.max(Math.min(c.hun,30),c.hun-k); c.thi=Math.max(Math.min(c.thi,30),c.thi-k); });
      st.bowls.forEach(b=>{ if(b.kind==="water") b.dirty=Math.min(1,b.dirty+Math.min(.4,away/3600)); }); }
    return st; }catch(e){ return null; }
}

/* ===================== LAYOUT ===================== */
function layout(){
  DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR|0; cv.height=H*DPR|0;
  const hud=$("hud"), tl=$("tools");
  TOPH=hud.classList.contains("hidden")?60:hud.offsetHeight; BOTH=tl.classList.contains("hidden")?76:tl.offsetHeight;
  const sh=H-TOPH-BOTH;
  U=clamp(Math.min(W/9,sh/12.5),24,64);
  GY=TOPH+sh*.27; WALLT=GY-U*1.7; FLOOR=H-BOTH;
  AX=U*.9; AW=W-U*1.8; AY=GY+U*1.3; AH=Math.max(U*2,FLOOR-U*.4-AY);
  const mw=Math.min(W*.68,U*7.4);
  MAT={x:U*.45,y:FLOOR-U*2.35,w:mw,h:U*1.35};
  BUSH={x:W-U*1.2,y:GY+U*1.55,r:U*1.2}; BUSH2={x:U*1.0,y:GY+U*.7,r:U*.95};
  BENCH={x:W*.56,y:GY+U*.95,w:Math.min(U*3.6,W*.4)};
  BED={x:W*.3,y:AY+AH*.22}; YARN={x:W*.6,y:AY+AH*.5}; MOUSE={x:W*.38,y:AY+AH*.42};
  { const fx=MAT.x+MAT.w+U*.12, fw=W-U*.08-fx, hs=clamp(fw/(U*3.8),.42,1); HOUSE={x:fx+fw/2,y:FLOOR-U*.75,s:hs}; } LAMP={x:W*.84,y:GY+U*.25}; TREE={x:U*1.5};
  $("hint").style.bottom=(H-MAT.y+U*.75)+"px";
  placeTop();
}
addEventListener("resize",layout);
const toScr=(nx,ny)=>({x:AX+nx*AW,y:AY+ny*AH});
const fromScr=(x,y)=>({x:(x-AX)/AW,y:(y-AY)/AH});
function bowlPos(i){ return {x:MAT.x+U*.9+i*(MAT.w-U*1.8)/3,y:MAT.y+MAT.h*.58}; }
function bowlSpot(i,c){ const b=bowlPos(i); return {x:b.x-U*.72*DEF[c.id].size,y:b.y-U*.28}; }
function hideSpot(c){ return {x:BUSH.x-U*.15+(c.id==="midnight"?-U*.5:0),y:BUSH.y-U*.12}; }
function houseSlot(i){ return {x:HOUSE.x+(i-1)*U*.95*HOUSE.s,y:HOUSE.y-U*.12}; }
function boxScr(b){ return toScr(b.nx,b.ny); }
function catScr(c){ if(c.bench) return {x:BENCH.x+(c.id==="midnight"?0:U),y:BENCH.y-U*.6}; return toScr(c.nx,c.ny); }
function depth(y){ return clamp((y-GY)/(FLOOR-GY),0,1); }
function catSize(c){ const p=catScr(c); return U*.95*DEF[c.id].size*(.8+.34*depth(c.bench?BENCH.y:p.y)); }
function catCenter(c){ const p=catScr(c), s=catSize(c); return {x:p.x,y:p.y-s*(c.st==="sleep"?.4:.9),r:s*1.05}; }
function isNight(){ return S.tod>=.8; }
function phaseOf(t){ return t<.25?0:t<.62?1:t<.8?2:3; }
function shyLow(c){ const d=DEF[c.id]; return d.shy&&c.trust<d.shy; }
function present(){ return S.cats.filter(c=>c.present); }
function catById(id){ return S.cats.find(c=>c.id===id); }

let purrN=null, rainN=null;
function loopNoise(freq,type){ const c=ac(); if(!c) return null;
  const n=c.sampleRate*2|0, b=c.createBuffer(1,n,c.sampleRate), ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=Math.random()*2-1;
  const src=c.createBufferSource(); src.buffer=b; src.loop=true; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; const gn=c.createGain(); gn.gain.value=0;
  src.connect(f); return {c,src,f,gn}; }
function purrSet(v){ if(muted||state!=="play") v=0; if(!purrN&&v<=0) return; const c=ac(); if(!c) return;
  if(!purrN){ const N=loopNoise(320,"lowpass"); if(!N) return; const am=c.createGain(); am.gain.value=.5; const lfo=c.createOscillator(); lfo.frequency.value=23; const lg=c.createGain(); lg.gain.value=.5;
    lfo.connect(lg).connect(am.gain); N.f.connect(am).connect(N.gn).connect(c.destination); const o=c.createOscillator(); o.type="sine"; o.frequency.value=48; const og=c.createGain(); og.gain.value=.25; o.connect(og).connect(am);
    N.src.start(); lfo.start(); o.start(); purrN=N; }
  purrN.gn.gain.setTargetAtTime(v*.5,c.currentTime,.1); }
function rainSet(v){ if(muted||state!=="play") v=0; if(!rainN&&v<=0) return; const c=ac(); if(!c) return;
  if(!rainN){ const N=loopNoise(1800,"lowpass"); if(!N) return; N.f.connect(N.gn).connect(c.destination); N.src.start(); rainN=N; }
  rainN.gn.gain.setTargetAtTime(v*.07,c.currentTime,.4); }

let toastT=null, hintT=null, tipT=null;
function toast(txt,col="#ff7a3d"){ const el=$("toast"); el.textContent=txt; el.dir="auto"; el.style.boxShadow=`0 0 0 4px ${col},0 6px 0 #0002`; el.style.color=col;
  el.style.top=Math.max(TOPH+8,GY-U*.2)+"px"; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2300); }
function hint(txt){ const el=$("hint"); el.textContent=txt; el.dir="auto"; el.classList.add("show"); clearTimeout(hintT); hintT=setTimeout(()=>el.classList.remove("show"),2600); }
function showTip(k,force){ if(!S||(!force&&S.tipsSeen[k])) return false; S.tipsSeen[k]=1; tipShownAt=S.play;
  const el=$("tip"); el.textContent="💡 "+L().tips[k]; el.dir="auto"; el.dataset.k=k; el.classList.remove("hidden"); placeTop(); clearTimeout(tipT); tipT=setTimeout(()=>el.classList.add("hidden"),9000); return true; }
function placeTop(){ const card=$("card"), tip=$("tip"); card.style.top=(TOPH+6)+"px";
  tip.style.top=(card.classList.contains("hidden")?TOPH+6:TOPH+12+card.offsetHeight)+"px"; }
$("tip").onclick=()=>$("tip").classList.add("hidden");
const NEEDS=[["hun","🍗"],["thi","💧"],["hap","😊"],["cln","✨"]];
function buildCard(){ $("cBars").innerHTML=NEEDS.map(([k,e])=>`<div class="bitem">${e}<span id="nl_${k}"></span><div class="bar"><i id="nb_${k}"></i></div></div>`).join(""); }
function barCol(v){ return v<30?"#ff6b81":v<60?"#ffc14d":"#45c97c"; }
function selectCat(c){ if(!c) return; const first=sel!==c.id; sel=c.id; $("card").classList.remove("hidden"); refreshCard(true); placeTop();
  if(first&&c.id==="snow") showTip("eartip"); }
function refreshCard(full){ const c=sel&&catById(sel); if(!c){ $("card").classList.add("hidden"); return; }
  const t=L(); if(full){ $("cName").textContent=cname(c); NEEDS.forEach(([k])=>$("nl_"+k).textContent=t.needs[k]); drawPortrait($("cardCv"),c); }
  NEEDS.forEach(([k])=>{ const v=Math.round(c[k]); const b=$("nb_"+k); b.style.width=v+"%"; b.style.background=barCol(v); });
  const n=Math.round(c.trust/20); $("cTrust").textContent="💗".repeat(n)+"🤍".repeat(5-n); $("cTrust").title=t.trust;
  const bd=$("cBadge"); bd.classList.toggle("hidden",!c.scratch); bd.textContent=t.scratchB; }
$("cClose").onclick=()=>{ sel=null; $("card").classList.add("hidden"); placeTop(); };

function addHearts(n,x,y){ S.hearts+=n; $("hearts").textContent=S.hearts; const p=$("heartPill"); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); SFX.heart();
  if(x!=null) floats.push({x,y,txt:"+"+n+" ❤️",col:"#ff4d8d",life:1.3,max:1.3}); }
function updateHUD(){ $("hearts").textContent=S.hearts; const ph=phaseOf(S.tod); $("dayIcon").textContent=["🌅","☀️","🌇","🌙"][ph]+(S.rainT>0?"🌧️":""); $("dayTxt").textContent=fmt(L().day,{d:S.day}); }

/* ===================== ACTIONS ===================== */
function hitCat(x,y){ let best=null,bd=1e9; for(const c of present()){ const q=catCenter(c); const d=Math.hypot(q.x-x,q.y-y); if(d<q.r*1.05&&d<bd){ bd=d; best=c; } } return best; }
function hitBowl(x,y){ for(let i=0;i<4;i++){ const b=bowlPos(i); if(Math.hypot(b.x-x,(b.y-y)*1.3)<U*.85) return i; } return -1; }
function inYard(x,y){ return x>U*.4&&x<W-U*.4&&y>AY-U*.2&&y<FLOOR-U*.15; }
function burst(x,y,n,col,k="spark",sp=2.5){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=U*sp*(.4+Math.random()*.6); parts.push({k,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-U,life:.8,max:.8,r:U*(.07+Math.random()*.06),col}); } }
function wakeHungry(kind){ present().forEach(c=>{ if((c.st==="idle"||c.st==="hide"||c.st==="wet"&&S.owned.station)&&(kind==="food"?c.hun<70:c.thi<70)) c.stT=c.wait; }); }
function fillFood(i,type){ const b=S.bowls[i], p=bowlPos(i);
  if(b.lvl>.92&&b.type===type&&b.dirty<.3&&!b.tip){ hint(L().m.full); return; }
  Object.assign(b,{lvl:1,type,dirty:0,tip:0,age:0}); S.stats.fills++;
  (type==="wet"?SFX.wet:SFX.dry)(); toast(L().m[type==="wet"?"filledWet":"filledDry"],"#e8862d");
  for(let k=0;k<10;k++) parts.push({k:"kib",x:p.x+rnd(-U*.3,U*.3),y:p.y-U*rnd(1,1.6),vx:0,vy:U*rnd(1,3),life:.45,max:.45,r:U*.07,col:type==="wet"?"#a5523a":"#b07a3a"});
  wakeHungry("food"); if(S.stats.fills===2) showTip("spot"); if(type==="wet") setTimeout(()=>showTip("wetold"),4000); if(S.stats.fills===4) showTip("food"); }
function fillWater(i){ const b=S.bowls[i], p=bowlPos(i);
  if(b.lvl>.92&&b.dirty<.25&&!b.tip){ hint(L().m.full); return; }
  Object.assign(b,{lvl:1,dirty:0,tip:0}); S.stats.fills++; SFX.water(); toast(L().m.filledWater,"#2a8fd0");
  for(let k=0;k<12;k++) parts.push({k:"drop",x:p.x+rnd(-U*.25,U*.25),y:p.y-U*rnd(.9,1.5),vx:rnd(-U,U)*.3,vy:U*rnd(1.5,3),life:.45,max:.45,r:U*.08,col:"#8fd8ff"});
  wakeHungry("water"); if(!showTip("water")) showTip("milk"); }
function treat(c){ const t=L(), q=catCenter(c); selectCat(c);
  if(shyLow(c)){ hint(msg("aidShy",c)); showTip("adult"); startle(c); return; }
  if(!c.scratch){ hint(msg("healthy",c)); return; }
  c.scratch=false; c.bandageT=25; c.st="treat"; c.stT=0; c.then=null; c.trust=Math.min(100,c.trust+6); c.hap=Math.min(100,c.hap+15); S.stats.treats++;
  SFX.heal(); burst(q.x,q.y,14,"#9fe3ff"); toast(msg("fixed",c),"#34c47c"); addHearts(3,q.x,q.y-q.r); catMeow(c,true); if(S.stats.treats===1) setTimeout(()=>showTip("adult"),2500); }
function placeBox(x,y){ const p=fromScr(x,clamp(y,AY,AY+AH)); if(S.boxes.length>=3){ const old=S.boxes.shift(); present().forEach(c=>{ if(c.boxId===old.id){ c.boxId=null; c.st="idle"; c.stT=0; c.wait=1; } if(c.then&&c.then.boxId===old.id) c.then=null,c.st="idle"; }); }
  S.boxes.push({id:S.boxSeq++,nx:clamp(p.x,0,1),ny:clamp(p.y,0,1)}); S.stats.boxes++; SFX.box(); burst(x,y,8,"#e8c08a","dust",1.5);
  if(S.rainT>0) present().forEach(c=>{ if(c.st==="wet") c.stT=c.wait; }); }
function sweepAt(x,y){ let n=0; S.mess=S.mess.filter(m=>{ const p=toScr(m.nx,m.ny); if(Math.hypot(p.x-x,p.y-y)<U*.8){ n++; burst(p.x,p.y,5,"#cbb89a","dust",1.2); return false; } return true; });
  if(n){ SFX.sweep(); S.sweepN+=n; S.stats.sweeps+=n; if(S.sweepN>=3){ S.sweepN-=3; addHearts(1,x,y-U*.5); }
    if(!S.mess.length){ toast(L().m.swept,"#34c47c"); showTip("spot"); } } return n; }
function startle(c){ if(c.st==="flee") return; const h=hideSpot(c); c.boxId=null; c.bed=false; c.bench=false; walkTo(c,h.x,h.y,{st:"hide",wait:3},2.8); c.st="flee"; c.hideT=3; c.blinkT=0;
  SFX.startle(); if(S.play-c.lastToast>6){ c.lastToast=S.play; hint(msg("shy",c)); } showTip("pickup"); }
function applyAt(x,y,tl){
  const t=L(), cat=hitCat(x,y), bi=hitBowl(x,y);
  if(tl==="dry"||tl==="wet"){ if(bi>=0&&S.bowls[bi].kind==="food") fillFood(bi,tl); else if(bi>=0) hint(t.m.waterBowl); else if(cat) selectCat(cat); else hint(t.hints[tl]); }
  else if(tl==="water"){ if(bi>=0&&S.bowls[bi].kind==="water") fillWater(bi); else if(bi>=0) hint(t.m.foodBowl); else if(cat) selectCat(cat); else hint(t.hints.water); }
  else if(tl==="aid"){ if(cat) treat(cat); else hint(t.m.notCat); }
  else if(tl==="box"){ if(cat) selectCat(cat); else if(bi<0&&inYard(x,y)) placeBox(x,y); else hint(t.m.tapGround); }
  else if(tl==="broom"){ if(!sweepAt(x,y)){ if(cat) selectCat(cat); else hint(S.mess.length?t.hints.broom:t.m.nothing); } }
  else if(cat) selectCat(cat);
}

/* ===================== CAT AI ===================== */
function walkTo(c,sx,sy,then,spd=1){ const p=fromScr(sx,sy); c.tx=p.x; c.ty=p.y; c.st="walk"; c.stT=0; c.then=then; c.spd=spd; c.bench=false; }
function setSt(c,st,wait){ c.st=st; c.stT=0; c.wait=wait==null?rnd(2,5):wait; }
function bowlBusy(i,c){ return present().some(o=>o!==c&&((o.st==="eat"||o.st==="drink"||o.st==="knock")&&o.bowl===i||o.then&&o.then.bowl===i)); }
function findBowl(kind,c){ let best=-1,bd=1e9; const p=catScr(c);
  S.bowls.forEach((b,i)=>{ if(b.kind!==kind||b.tip||b.lvl<.05||bowlBusy(i,c)) return; if(kind==="water"&&b.dirty>.7) return; if(kind==="food"&&b.dirty>.85) return;
    const q=bowlPos(i), d=Math.hypot(q.x-p.x,q.y-p.y); if(d<bd){ bd=d; best=i; } }); return best; }
function dirtyWaterOnly(){ return S.bowls.some(b=>b.kind==="water"&&!b.tip&&b.lvl>=.05&&b.dirty>.7); }
function seekShelter(c){
  if(S.owned.house){ for(let i=0;i<3;i++){ if(!present().some(o=>o!==c&&(o.slot===i&&o.st==="shelter"||o.then&&o.then.slot===i))){ const q=houseSlot(i); walkTo(c,q.x,q.y,{st:"shelter",slot:i,wait:999},2); return true; } } }
  let best=null,bd=1e9; const p=catScr(c);
  for(const b of S.boxes){ if(present().some(o=>o!==c&&(o.boxId===b.id&&o.st==="box"||o.then&&o.then.boxId===b.id))) continue; const q=boxScr(b), d=Math.hypot(q.x-p.x,q.y-p.y); if(d<bd){ bd=d; best=b; } }
  if(best){ const q=boxScr(best); walkTo(c,q.x,q.y,{st:"box",boxId:best.id,wait:999},2); return true; }
  return false; }
function clearSpot(c){ c.boxId=null; c.slot=-1; c.bed=false; c.bench=false; c.bowl=-1; }
function think(c){
  const d=DEF[c.id]; clearSpot(c); c.thought=null;
  const raining=S.rainT>0;
  if(raining){ if(S.owned.station&&c.hun<55&&!shyLow(c)){ const b=findBowl("food",c); if(b>=0){ const q=bowlSpot(b,c); walkTo(c,q.x,q.y,{st:"eat",bowl:b},1.6); return; } }
    if(seekShelter(c)) return; setSt(c,"wet",1.5); return; }
  if(shyLow(c)&&!(c.hun<60&&findBowl("food",c)>=0&&!ptr.down)){ const h=hideSpot(c); const p=catScr(c);
    if(Math.hypot(p.x-h.x,p.y-h.y)>U*.3) walkTo(c,h.x,h.y,{st:"hide",wait:3}); else setSt(c,"hide",3); return; }
  const tryFood=()=>{ if(c.hun<62){ const b=findBowl("food",c); if(b>=0){ const q=bowlSpot(b,c); walkTo(c,q.x,q.y,{st:"eat",bowl:b},1.2); return true; } c.thought="🐟"; } return false; };
  const tryWater=()=>{ if(c.thi<62){ const b=findBowl("water",c); if(b>=0){ const q=bowlSpot(b,c); walkTo(c,q.x,q.y,{st:"drink",bowl:b},1.2); return true; } c.thought=dirtyWaterOnly()?"🤢":"💧"; } return false; };
  if(c.thi<c.hun){ if(tryWater()||tryFood()) return; } else { if(tryFood()||tryWater()) return; }
  if(isNight()&&Math.random()<.7){ if(S.owned.bed&&!present().some(o=>o!==c&&(o.bed||o.then&&o.then.bed))){ walkTo(c,BED.x,BED.y+1,{st:"sleep",bed:true,wait:999}); return; }
    if(d.benchy){ walkTo(c,BENCH.x,AY,{st:"sleep",bench:true,wait:999}); return; } setSt(c,"sleep",999); return; }
  if(d.clumsy&&S.play>S.knockNext){ const i=S.bowls.findIndex((b,j)=>b.kind==="water"&&b.lvl>.3&&!b.tip&&!bowlBusy(j,c)); if(i>=0){ S.knockNext=S.play+rnd(100,160); const q=bowlSpot(i,c); walkTo(c,q.x,q.y,{st:"knock",bowl:i,wait:2.2},1.3); return; } }
  if(S.boxes.length&&Math.random()<.22){ const free=S.boxes.filter(b=>!present().some(o=>o!==c&&(o.boxId===b.id||o.then&&o.then.boxId===b.id))); if(free.length){ const b=pick(free), q=boxScr(b); walkTo(c,q.x,q.y,{st:"box",boxId:b.id,wait:rnd(8,14)}); return; } }
  if(d.kitten&&Math.random()<.5&&!isNight()){ setSt(c,"chase",rnd(5,8)); if(S.play-c.lastToast>40){ c.lastToast=S.play; hint(msg("butterfly",c)); } return; }
  const toys=["yarn","mouse"].filter(k=>S.owned[k]);
  if(toys.length&&Math.random()<(d.playful||d.kitten?.5:.25)){ const k=pick(toys), q=k==="yarn"?YARN:MOUSE; walkTo(c,q.x-U*.9,q.y,{st:"play",toy:k,wait:rnd(5,8)}); return; }
  if(d.benchy&&Math.random()<.4){ walkTo(c,BENCH.x,AY,{st:"sleep",bench:true,wait:rnd(10,18)}); return; }
  if(Math.random()<.45){ setSt(c,"idle",rnd(2.5,6)); return; }
  const q=toScr(rnd(.05,.95),rnd(.05,.75)); walkTo(c,q.x,q.y,{st:"idle"});
}
function onArrive(c){ const t=c.then||{st:"idle"}; c.then=null; setSt(c,t.st,t.wait);
  if(t.bowl!=null){ c.bowl=t.bowl; c.dir=bowlPos(t.bowl).x>catScr(c).x?1:-1; c.ate=0; c.knocked=false; }
  if(t.boxId!=null){ c.boxId=t.boxId; c.dir=1; if(S.rainT>0){ hint(msg("shelter",c)); addHearts(1,catScr(c).x,catScr(c).y-U*2); c.trust=Math.min(100,c.trust+3); showTip("shelter"); }
    else if(!S.seen.box){ S.seen.box=1; toast(msg("inBox",c),"#b07a3a"); catMeow(c,true); } }
  if(t.slot!=null){ c.slot=t.slot; if(S.rainT>0) hint(msg("house",c)); }
  if(t.bed){ c.bed=true; if(!S.seen.bed){ S.seen.bed=1; hint(msg("bed",c)); } }

  if(t.toy){ c.toy=t.toy; c.dir=1; if(!S.seen.play){ S.seen.play=1; hint(msg("play",c)); } }
  if(t.st==="eat"||t.st==="drink"){ const b=S.bowls[c.bowl]; if(t.st==="drink"&&b.dirty>.7){ setSt(c,"idle",2); c.thought="🤢"; if(S.play-c.lastToast>10){ c.lastToast=S.play; hint(msg("dirty",c)); } showTip("water"); } }
}
function arrive(c){ if(c.present) return; c.present=true; c.met=true; initCat(c); const p=fromScr(W+U*1.5,AY+AH*rnd(.1,.4)); c.nx=p.x; c.ny=p.y;
  const q=toScr(rnd(.55,.8),rnd(.15,.45)); walkTo(c,q.x,q.y,{st:"idle",wait:1}); if(DEF[c.id].scratch) c.scratch=true;
  toast(msg("newCat",c),"#7c5cff"); SFX.chime(); setTimeout(()=>catMeow(c),400); }

function updCat(c,dt){
  const d=DEF[c.id]; c.stT+=dt; c.moving=false;
  if(c.blinkT>0) c.blinkT-=dt; if(c.blinkCD>0) c.blinkCD-=dt; if(c.bandageT>0) c.bandageT-=dt; if(c.jump>0) c.jump-=dt; if(c.mouthT>0) c.mouthT-=dt; c.meowCD-=dt;
  if(c.st!=="pet") c.purr=Math.max(0,c.purr-dt*2);
  const k=isNight()?.6:1;
  c.hun=Math.max(15,c.hun-dt*.5*k); c.thi=Math.max(15,c.thi-dt*.62*k); c.hap=Math.max(15,c.hap-dt*(.2+(S.mess.length>8?.25:0)+(c.scratch?.1:0))); c.cln=Math.max(20,c.cln-dt*.12);

      if(dd<=step+.5){ c.nx=c.tx; c.ny=c.ty; if(c.st==="flee") c.st="walk"; onArrive(c); } else { c.nx+=dx/dd*step/AW; c.ny+=dy/dd*step/AH; if(Math.abs(dx)>2) c.dir=dx>0?1:-1; c.phase+=dt*9*Math.min(1.6,c.spd); c.moving=true; }
      if(S.rainT>0&&c.then&&c.then.st!=="box"&&c.then.st!=="shelter"&&c.then.st!=="eat"&&c.then.st!=="hide"&&c.stT>.3) think(c);
      break; }
    case "idle": if(c.stT>c.wait) think(c); break;
    case "eat": { const b=S.bowls[c.bowl];
      if(!b||b.lvl<=.01||b.tip||c.hun>=99.5||b.dirty>.85){ if(b&&b.dirty>.85&&c.ate<5) hint(L().m.dirtyFood);
        if(c.ate>12){ S.stats.meals++; const p=catScr(c); addHearts(2,p.x,p.y-U*2); if(S.play-c.lastToast>8){ c.lastToast=S.play; hint(msg("ate",c)); } }
        setSt(c,"idle",rnd(1.5,3)); c.bowl=-1; break; }
      const r=dt*(b.type==="wet"?26:20); c.hun=Math.min(100,c.hun+r); c.ate+=r; b.lvl=Math.max(0,b.lvl-dt*.11); b.dirty=Math.min(1,b.dirty+dt*.01*(S.owned.station?.5:1));
      c.hap=Math.min(100,c.hap+dt*2); c.trust=Math.min(100,c.trust+dt*(d.shy?1.4:.5));
      if((c.stT*2.2|0)!==((c.stT-dt)*2.2|0)) SFX.nom();
      if(Math.random()<dt*.35&&S.mess.length<16){ const p=bowlPos(c.bowl), m=fromScr(p.x+rnd(-U*.9,U*.9),p.y+rnd(-U*.2,U*.45)); S.mess.push({nx:m.x,ny:m.y,k:"crumb",r:rnd(.6,1)}); }
      break; }
    case "drink": { const b=S.bowls[c.bowl];
      if(!b||b.lvl<=.01||b.tip||c.thi>=99.5){ if(c.ate>12){ S.stats.drinks++; const p=catScr(c); addHearts(1,p.x,p.y-U*2); if(S.play-c.lastToast>8){ c.lastToast=S.play; hint(msg("drank",c)); } if(S.stats.drinks===1) setTimeout(()=>showTip("milk"),3000); }
        setSt(c,"idle",rnd(1.5,3)); c.bowl=-1; break; }
      const r=dt*28; c.thi=Math.min(100,c.thi+r); c.ate+=r; b.lvl=Math.max(0,b.lvl-dt*.1); b.dirty=Math.min(1,b.dirty+dt*.008*(S.owned.station?.5:1));
      if((c.stT*4|0)!==((c.stT-dt)*4|0)) SFX.lap(); break; }
    case "knock": if(c.stT>1&&!c.knocked){ c.knocked=true; const b=S.bowls[c.bowl]; if(b&&!b.tip){ b.tip=1; b.lvl=0; const p=bowlPos(c.bowl); SFX.clang(); burst(p.x,p.y-U*.2,14,"#8fd8ff","drop",2); S.puddle={x:p.x,y:p.y,a:1}; toast(msg("knock",c),"#2a8fd0"); catMeow(c); } }
      if(c.stT>2.2){ setSt(c,"idle",1.5); c.bowl=-1; } break;
    case "pet": if(ptr.cat!==c){ setSt(c,"idle",rnd(1.5,3)); } break;
    case "treat": if(c.stT>1.4) setSt(c,"idle",2); break;
    case "sleep": c.hap=Math.min(100,c.hap+dt*(c.bed?3:1)); if(Math.random()<dt*.8){ const q=catCenter(c); parts.push({k:"z",x:q.x+U*.3,y:q.y-U*.4,vx:U*.3,vy:-U*.5,life:1.6,max:1.6,r:U*.3,col:"#7c5cff"}); }
      if((!isNight()&&c.stT>c.wait)||(!isNight()&&c.wait>900&&c.stT>6)||S.rainT>0&&!c.bed) { c.bench=false; think(c); } break;
    case "play": c.hap=Math.min(100,c.hap+dt*6); if(Math.random()<dt*2) c.jump=.3; if(c.stT>c.wait){ setSt(c,"idle",2); c.toy=null; } break;
    case "chase": { const q=bfGround(), p=catScr(c), dx=q.x-p.x, dy=q.y-p.y, dd=Math.hypot(dx,dy);

    case "box": c.hap=Math.min(100,c.hap+dt*1.5); if(S.rainT<=0&&c.wait>900) c.wait=c.stT+rnd(5,10); if(S.rainT<=0&&c.stT>c.wait){ c.boxId=null; think(c); } break;

    case "wet": c.hap=Math.max(15,c.hap-dt*.6); if(Math.random()<dt*3){ const q=catCenter(c); parts.push({k:"drop",x:q.x+rnd(-q.r,q.r)*.6,y:q.y,vx:0,vy:U*2,life:.4,max:.4,r:U*.05,col:"#8fc8ff"}); }

}

/* ===================== BUTTERFLY / WORLD ===================== */
function bfGround(){ return toScr(bf.nx,bf.ny); }
function bfFlee(){ bf.tx=clamp(bf.nx+rnd(-.5,.5),.05,.95); bf.ty=clamp(bf.ny+rnd(-.4,.4),.05,.8); }
function updWorld(dt){
  // butterfly
  bf.t+=dt; const dx=bf.tx-bf.nx, dy=bf.ty-bf.ny, dd=Math.hypot(dx,dy);
  if(dd<.03) bfFlee(); else { bf.nx+=dx/dd*dt*.09; bf.ny+=dy/dd*dt*.12; }
  bf.h=1.2+Math.sin(bf.t*2.3)*.4;
  // time of day
  const ph0=phaseOf(S.tod); S.tod+=dt/DAYLEN;
  if(S.tod>=1){ S.tod-=1; S.day++; S.bowls.forEach(b=>{ if(b.kind==="water"&&b.lvl>0) b.dirty=Math.max(b.dirty,.75); }); toast(fmt(L().m.newDay,{d:S.day}),"#ff9f1c"); SFX.chime(); if(!showTip("water")) {} }
  const ph=phaseOf(S.tod); if(ph!==ph0){ if(ph===2) hint(L().m.evening); if(ph===3) hint(L().m.night); updateHUD(); }
  // arrivals
  S.cats.forEach(c=>{ if(!c.present&&S.play>=DEF[c.id].arrive) arrive(c); });
  // rain
  if(S.rainT>0){ S.rainT-=dt; S.bowls.forEach(b=>{ if(!S.owned.station&&b.lvl>0) b.dirty=Math.min(1,b.dirty+dt*.006); });
    if(S.rainT<=0){ S.rainT=0; S.nextRain=rnd(120,190); toast(L().m.rainEnd,"#34c47c"); updateHUD(); present().forEach(c=>{ if(c.st==="wet") c.stT=c.wait; }); } }
  else { S.nextRain-=dt; if(S.nextRain<=0) startRain(); }
  // scratch events
  S.scratchNext-=dt; if(S.scratchNext<=0){ S.scratchNext=rnd(150,230); const can=present().filter(c=>!c.scratch&&!shyLow(c)&&c.st!=="sleep"); if(can.length){ const c=pick(can); c.scratch=true; hint(msg("scratch",c)); } }
  // leaves fall into the feeding corner
  S.leafNext-=dt; if(S.leafNext<=0){ S.leafNext=rnd(14,26); if(S.mess.length<16){ const m=fromScr(MAT.x+rnd(0,MAT.w),MAT.y+rnd(-U*.4,MAT.h+U*.2)); S.mess.push({nx:m.x,ny:m.y,k:"leaf",r:rnd(.7,1.1),rot:rnd(0,6)}); } }
  if(S.mess.length>=7&&!S.seen.messy){ S.seen.messy=1; hint(L().hints.broom); showTip("spot",true); }
  // bowls: wet food goes off, water slowly gets dusty
  S.bowls.forEach(b=>{ if(b.lvl<=0) return; if(b.kind==="food"&&b.type==="wet"){ b.age=(b.age||0)+dt; if(b.age>45) b.dirty=Math.min(1,b.dirty+dt*.012); } else b.dirty=Math.min(1,b.dirty+dt*(b.kind==="water"?.0016:.0008)*(S.owned.station?.5:1)); });
  if(S.puddle){ S.puddle.a-=dt*.08; if(S.puddle.a<=0) S.puddle=null; }
  // periodic tips
  if(S.play-tipShownAt>55){ const k=TIP_ORDER.find(k=>!S.tipsSeen[k]&&(k!=="eartip"||catById("snow").present)); if(k) showTip(k); else tipShownAt=S.play; }
}
function startRain(){ S.rainT=rnd(24,32); toast(L().m.rain,"#5a7bd8"); SFX.rainStart(); updateHUD(); present().forEach(c=>{ if(!["box","shelter","pet","treat"].includes(c.st)) { c.bench=false; think(c); } }); setTimeout(()=>showTip("shelter"),2500); }

/* ===================== MAIN UPDATE ===================== */
function update(dt){
  gtime+=dt;
  parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.k!=="heart"&&p.k!=="z") p.vy+=U*5*dt; else p.vx*=.97; p.life-=dt; }); parts=parts.filter(p=>p.life>0);
  floats.forEach(f=>{ f.y-=U*1.1*dt; f.life-=dt; }); floats=floats.filter(f=>f.life>0);
  if(state!=="play"){ purrSet(0); rainSet(0); return; }
  S.play+=dt;
  updWorld(dt);
  present().forEach(c=>updCat(c,dt));
  // petting / brushing
  const c=ptr.cat;
  if(c&&ptr.down){ const a=ptr.rub/U; ptr.rub=0; const d=DEF[c.id]; const q=catCenter(c);
    if(ptr.tool==="pet"){ c.purr=Math.min(1,c.purr+a*.9); c.purr=Math.max(0,c.purr-dt*.5);

      if(c.rubBank>7){ c.rubBank=0; addHearts(1,q.x,q.y-q.r); S.stats.pets++; if(S.stats.pets===1) hint(msg("purr",c)); if(S.stats.pets===6) showTip("hands"); }
      if(c.trust>=40&&c.rubTot>3.5&&c.blinkCD<=0&&c.purr>.4){ c.blinkT=1.6; c.blinkCD=6; if(!S.seen.blink){ S.seen.blink=1; toast(msg("blink",c),"#ff4d8d"); showTip("blink"); } } }
    else if(ptr.tool==="brush"){ c.cln=Math.min(100,c.cln+a*9); c.hap=Math.min(100,c.hap+a*(d.brushy?6:3)); c.trust=Math.min(100,c.trust+a*.5); c.purr=Math.min(1,c.purr+a*(d.brushy?.8:.4)); c.purr=Math.max(0,c.purr-dt*.5); c.rubBank+=a;
      if(a>0&&Math.random()<a*4) parts.push({k:"tuft",x:q.x+rnd(-q.r,q.r)*.7,y:q.y+rnd(-q.r,q.r)*.4,vx:rnd(-U,U)*.6,vy:-U*rnd(.3,1),life:1,max:1,r:U*rnd(.06,.11),col:d.fur});
      if(a>0&&(gtime*6|0)!==((gtime-dt)*6|0)) SFX.brush();
      if(c.rubBank>8){ c.rubBank=0; addHearts(1,q.x,q.y-q.r); S.stats.brush++; if(c.cln>95&&S.play-c.lastToast>8){ c.lastToast=S.play; hint(msg("brushed",c)); } } }
  }
  // shy cats: calm finger nearby
  ptr.spd*=Math.pow(.02,dt); ptr.calm=null;
  if(ptr.down&&(ptr.tool==="pet"||ptr.tool==="brush")){
    for(const s of present()){ if(!shyLow(s)||s.st==="flee") continue; const q=catCenter(s), dd=Math.hypot(q.x-ptr.x,q.y-ptr.y);
      if(dd<U*4.3){ if(ptr.spd>U*7){ startle(s); continue; } if(ptr.cat) continue;

  if(S.play<1){ setTimeout(()=>{ if(state==="play") hint(L().hints.pet); },900); } }
function toMenu(){ save(); state="menu"; ptr.cat=null; $("hud").classList.add("hidden"); $("tools").classList.add("hidden"); $("card").classList.add("hidden"); $("tip").classList.add("hidden"); $("muteBtn").classList.remove("hidden"); sel=null; renderMenu(); show("menu"); layout(); }
function pause(){ if(state==="play"){ prevState="play"; state="paused"; ptr.cat=null; ptr.down=false; show("pause"); $("resetBtn").dataset.sure=""; $("resetBtn").textContent=L().reset; save(); } }
function resume(){ if(state==="paused"){ state="play"; show(null); } }

document.addEventListener("click",e=>{
  const l=e.target.closest("[data-lang]"), b=e.target.closest("[data-buy]");
  if(l){ lang=l.dataset.lang; localStorage.setItem("annabelle-lang",lang); SFX.click(); applyLang(); }
  if(b) buy(b.dataset.buy);
});

$("pauseBtn").onclick=()=>{ SFX.click(); pause(); };
$("resumeBtn").onclick=()=>{ SFX.click(); resume(); };

$("resetBtn").onclick=()=>{ const r=$("resetBtn"); if(!r.dataset.sure){ r.dataset.sure="1"; r.textContent=L().resetSure; SFX.click(); return; }
  localStorage.removeItem(SKEY); S=freshState(); S.cats.forEach(initCat); sel=null; parts=[]; floats=[]; $("card").classList.add("hidden"); SFX.chime(); toMenu(); };

$("shopBtn").onclick=()=>{ SFX.click(); openOv("shop"); };
$("alClose").onclick=$("shClose").onclick=()=>{ SFX.click(); closeOv(); };
function updateMute(){ $("muteBtn").textContent=$("muteBtn2").textContent=muted?"🔇":"🔊"; }
$("muteBtn").onclick=$("muteBtn2").onclick=()=>{ muted=!muted; localStorage.setItem("annabelle-muted",muted?"1":"0"); updateMute(); if(!muted) SFX.click(); else { purrSet(0); rainSet(0); } };

/* ===================== INPUT ===================== */
// tools: tap to select, or drag a tool onto the scene
let drag=null;
$("tools").addEventListener("pointerdown",e=>{ const b=e.target.closest(".tool"); if(!b) return; e.preventDefault(); ac();
  drag={k:b.dataset.tool,x0:e.clientX,y0:e.clientY,id:e.pointerId,moved:false}; try{ b.setPointerCapture(e.pointerId); }catch(_){} setTool(drag.k); });
$("tools").addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==drag.id) return; if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>18){ drag.moved=true; const gh=$("ghost"); gh.textContent=TOOLS.find(x=>x[0]===drag.k)[1]; gh.classList.remove("hidden"); gh.style.left=e.clientX+"px"; gh.style.top=e.clientY+"px"; } });
function endDrag(e){ if(!drag||e.pointerId!==drag.id) return; $("ghost").classList.add("hidden"); const d=drag; drag=null;
  if(d.moved&&state==="play"&&e.type==="pointerup"&&e.clientY<FLOOR){ const y=e.clientY-(e.pointerType==="touch"?U*.4:0); applyAt(e.clientX,y,d.k); } }
$("tools").addEventListener("pointerup",endDrag); $("tools").addEventListener("pointercancel",endDrag);

cv.addEventListener("pointerdown",e=>{ ac(); if(state!=="play") return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  Object.assign(ptr,{down:true,id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,spd:0,still:0,cat:null,rub:0,moved:0,tool,lt:performance.now()});
  const x=e.clientX,y=e.clientY;
  if(tool==="pet"||tool==="brush"){ const c=hitCat(x,y);
    if(c){ selectCat(c); if(shyLow(c)){ startle(c); return; }
      ptr.cat=c; if(["walk","idle","chase","play","hide","wet","creep","treat"].includes(c.st)){ c.st="pet"; c.stT=0; c.then=null; c.boxId=null; c.bed=false; }
      if(DEF[c.id].chatty&&Math.random()<.5) catMeow(c,true); return; }
    return; }
  applyAt(x,y,tool);
});
cv.addEventListener("pointermove",e=>{ if(!ptr.down||e.pointerId!==ptr.id) return; const now=performance.now(), dx=e.clientX-ptr.lx, dy=e.clientY-ptr.ly, d=Math.hypot(dx,dy), dt=Math.max(8,now-ptr.lt);
  ptr.spd=ptr.spd*.5+(d/(dt/1000))*.5; if(d>U*.12) ptr.still=0; ptr.lx=e.clientX; ptr.ly=e.clientY; ptr.x=e.clientX; ptr.y=e.clientY; ptr.lt=now; ptr.moved+=d;
  if(ptr.cat){ const q=catCenter(ptr.cat); if(Math.hypot(q.x-ptr.x,q.y-ptr.y)<q.r*1.6) ptr.rub+=d; }
  else if(ptr.tool==="broom") sweepAt(ptr.x,ptr.y);
  else if((ptr.tool==="pet"||ptr.tool==="brush")&&!ptr.cat){ const c=hitCat(ptr.x,ptr.y); if(c&&!shyLow(c)&&ptr.moved>U*.3){ ptr.cat=c; selectCat(c); if(["walk","idle","chase","play","wet","treat"].includes(c.st)){ c.st="pet"; c.stT=0; c.then=null; } } }
});

addEventListener("keydown",e=>{ const c=e.code;

  if(c==="KeyM"){ $("muteBtn2").click(); return; }
  if((c==="Enter"||c==="Space")&&state==="menu"){ e.preventDefault(); startPlay(); return; }

/* ===================== CONFETTI ===================== */
let confRaf=null;
function confetti(n=150){ const c=$("confetti"), x=c.getContext("2d"); c.width=innerWidth*DPR; c.height=innerHeight*DPR; x.setTransform(DPR,0,0,DPR,0,0);
  const cols=["#ff7a3d","#7c5cff","#34c47c","#ffd23f","#ff5d8f","#3fc5ff"];
  const P=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2.5,vy:2+Math.random()*3,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.random()*cols.length|0],paw:Math.random()<.15}));
  let f=0; cancelAnimationFrame(confRaf);
  (function step(){ x.clearRect(0,0,innerWidth,innerHeight); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); if(p.paw){x.font=`${p.s*2.4}px sans-serif`; x.fillText("🐾",0,0);} else {x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);} x.restore(); });
    f++; if(f<260) confRaf=requestAnimationFrame(step); else x.clearRect(0,0,innerWidth,innerHeight); })(); }

/* ===================== LOOP ===================== */
let lastT=0, frames=0;
function frame(t){ const dt=Math.min(.05,(t-lastT)/1000||0); lastT=t; frames++;
  try{ if(!TEST.freeze) update(dt); render(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame); }

/* ===================== TEST HOOK ===================== */
window.__sc={
  info:()=>({ptr:{down:ptr.down,cat:ptr.cat&&ptr.cat.id,still:ptr.still,spd:ptr.spd,tool:ptr.tool,x:ptr.x,y:ptr.y},state,tool,sel,hearts:S.hearts,day:S.day,tod:S.tod,play:S.play,rain:S.rainT,owned:{...S.owned},boxes:S.boxes.length,mess:S.mess.length,tipsSeen:Object.keys(S.tipsSeen),stats:{...S.stats},frames,U,W,H,
    bowls:S.bowls.map(b=>({...b})),cats:S.cats.map(c=>({id:c.id,present:c.present,st:c.st,hun:c.hun,thi:c.thi,hap:c.hap,cln:c.cln,trust:c.trust,scratch:c.scratch,purr:c.purr,pos:catScr(c),center:catCenter(c),bowl:c.bowl,boxId:c.boxId}))}),
  step:(sec)=>{ for(let i=0;i<sec*20;i++) update(.05); },
  bowlPos, setTool:k=>setTool(k,true), arrive:id=>arrive(catById(id)), set:(id,o)=>Object.assign(catById(id),o), setS:o=>Object.assign(S,o),
  setBowl:(i,o)=>Object.assign(S.bowls[i],o), rain:()=>startRain(), think:id=>think(catById(id)), save, test:TEST, buy, toScr,
  placeCat:(id,nx,ny,st)=>{ const c=catById(id); c.nx=nx; c.ny=ny; clearSpot(c); setSt(c,st||"idle",st==="hide"?3:30); c.then=null; }
};

/* ===================== BOOT ===================== */
S=load()||freshState(); S.cats.forEach(initCat);
buildCard(); layout(); updateMute(); applyLang();
S.cats.forEach(c=>{ if(c.present&&shyLow(c)){ const h=hideSpot(c), p=fromScr(h.x,h.y); c.nx=p.x; c.ny=p.y; setSt(c,"hide",2); } });
requestAnimationFrame(t=>{ lastT=t; frame(t); }); document.body.dataset.ready="1";

</script>

    if(J.town>=TOWNS.length){ card(r.i,t().win,`${SH}<button class="jb go" id="jyA">${t().adopt}</button>`); $("jyA").onclick=adoption; return; }
    const keys=Object.keys(PERKS), ch=[0,1,2].map(n=>keys[(r.i+n)%4]);
    card(r.i,t().win,`${SH}<div class="jsub">${t().gift}</div><div class="jcards">${ch.map(p=>`<button class="jcard" data-p="${p}"><div class="fr">🎁</div><div class="bk"><b>${PERKS[p].e}</b>${PERKS[p][lg()]}<small>${PERKS[p].d[lg()]}</small></div></button>`).join("")}</div><div class="jtip"><span>💡</span><span>${t().perkH}</span></div>`);
    const cs=[...$("jyPanel").querySelectorAll(".jcard")]; let picked=false;
    cs.forEach((c,n)=>setTimeout(()=>{ c.classList.add("flip"); beep(700+n*150,.1,"sine",.12,1400); },1300+n*350));
    cs.forEach(c=>c.onclick=()=>{ if(picked||!c.classList.contains("flip")) return; picked=true; c.classList.add("pick"); cs.forEach(x=>x!==c&&x.classList.add("dim")); beep(523,.1,"triangle",.15); setTimeout(()=>beep(784,.2,"triangle",.15),110); try{ confetti(90); }catch(e){} J.perks.push(c.dataset.p); sv(); setTimeout(()=>mapView(true),1100); });
  } else { card(r.i,t().lose,`<div style="font-size:54px">😿⏱️</div><div class="jtip" style="background:#fff3d6"><span>🥣</span><span>${t().bagH}</span></div><button class="jb go" id="jyAg">${t().retry}</button>`); $("jyAg").onclick=()=>play(r.i); } }
function adoption(){ stop(); bg(0); $("jyBg").innerHTML+='<text x="200" y="120" font-size="60" text-anchor="middle">🎈🏡🎈</text>';
  bar(`<button class="pl" id="jyX">${t().back}</button><span class="pl">${t().adopt}</span>`); $("jyX").onclick=close;
  const kits=J.kits.slice(0,8); let pick=-1, done={};
  const draw=()=>{ const n=Object.keys(done).length;
    if(n>=kits.length){ snd("heart"); panel(`<h2>${t().cert}</h2><div style="border:4px double #ffc14d;border-radius:14px;padding:12px;font-size:17px">🏅 ${f(t().certT,{n:kits.length})}<div style="font-size:30px">${kits.map(k=>k.split(":")[2]).join("")}💞</div></div><button class="jb go" id="jyN">${t().reset}</button>`); $("jyN").onclick=()=>{ J={town:0,perks:[],kits:[],stars:[]}; sv(); mapView(false); }; return; }
    panel(`<h2>${t().adopt}</h2><div style="font-size:14px">${t().adoptH}</div><div class="jgrid">${kits.map((k,i)=>{ const [nm,tr,e]=k.split(":"); return `<button data-k="${i}" class="${pick==i?"sel":""} ${done[i]?"done":""}"><span style="font-size:22px">${done[i]?"🏠":e}</span><br>${nm} ${["🧶","💤","🐟"][tr]}</button>`; }).join("")}</div><div class="jgrid f3">${FAM.map((F,i)=>`<button data-f="${i}"><span style="font-size:26px">${F.e}</span><br>${F.h[lg()]}</button>`).join("")}</div><div id="jyMsg" style="min-height:22px"></div>`);
    $("jyPanel").querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{ if(done[el.dataset.k]) return; pick=+el.dataset.k; snd("click"); draw(); });
    $("jyPanel").querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{ if(pick<0) return; const tr=+kits[pick].split(":")[1]; if(tr===+el.dataset.f){ done[pick]=1; pick=-1; snd("heart"); draw(); const m=$("jyMsg"); if(m) m.textContent=t().home+" 💗💗💗"; } else $("jyMsg").textContent=t().wrong; }); };
  draw(); }
const btn=document.createElement("button"); btn.className="big"; btn.id="journeyBtn"; btn.style.cssText="background:#ffc14d;font-size:19px;padding:10px 18px";
$("playBtn").after(btn); btn.onclick=()=>{ snd("click"); open(); };
const lbl=()=>{ btn.textContent=t().btn+(J.town?` (${Math.min(J.town,5)}/5)`:""); }; lbl();
document.addEventListener("click",e=>{ if(e.target.closest("[data-lang]")) setTimeout(lbl,0); });
window.__jy={open,adoption,mapView,state:()=>J,set:o=>{Object.assign(J,o);sv();},win:()=>run&&(run.fed=run.goal-1,run.goal&&end(true))};
})();
</script>
