<style>
:root{--ink:#27324a;--pk:#ff6f91;--ye:#ffd23f;--gr:#3ecf7a;--tl:#2bb5ab;--cream:#fffbe8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:linear-gradient(#7fdfd3,#2bb5ab 60%,#1f8f9c);font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew",Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button,a{font-family:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation;background:none;padding:0;text-decoration:none}
svg{direction:ltr;display:block}svg text{font-family:inherit;font-weight:900}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.ib{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 4px 0 #0003;font-size:21px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .06s}

.pill{background:#fff;border-radius:999px;padding:4px 10px;font-weight:900;font-size:clamp(13px,3.8vw,16px);box-shadow:0 3px 0 #0003;white-space:nowrap;min-height:34px;display:inline-flex;align-items:center;gap:4px;direction:ltr}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:max(8px,env(safe-area-inset-top)) 10px calc(var(--sab,6px) + 8px)}
.scr.on{display:flex}
.scr.tabbed{padding-bottom:calc(var(--sab,6px) + 72px)}
.wrap{width:min(100%,820px);flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.btn{min-height:50px;border-radius:18px;padding:8px 16px;font-weight:900;font-size:clamp(16px,4.4vw,19px);box-shadow:0 5px 0 #0003;transition:transform .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;text-align:center;line-height:1.15}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #0003}
.btn.g{background:var(--gr);color:#073b1c}.btn.y{background:var(--ye)}.btn.p{background:#ffc2d4}.btn.b{background:#bfe6ff}
.btn:disabled{opacity:.45;box-shadow:0 2px 0 #0003}
.hdr{display:flex;align-items:center;gap:8px;flex:none;min-height:46px}
.hdr h2{margin:0;flex:1;min-width:0;font-size:clamp(18px,5vw,24px);font-weight:900;color:#fff;text-shadow:0 2px 0 #0005;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* critter art */
.cr{display:inline-block;position:relative;line-height:0;flex:none}
.cr svg{width:100%;height:100%;overflow:visible}
.cr .cb{animation:cbob 2.6s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:60px 108px}
.cr .fl .cb{animation-name:cflt}
@keyframes cbob{50%{transform:scale(1.035,.965)}}
@keyframes cflt{50%{transform:translateY(-5px)}}
.cr .ey{animation:cblk 4.4s infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
@keyframes cblk{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.cr .tl{animation:cwag 1.7s ease-in-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:0% 90%}
@keyframes cwag{50%{transform:rotate(9deg)}}
.cr .wg{animation:cwng 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 70%}
@keyframes cwng{50%{transform:rotate(-13deg) scaleY(.9)}}
.cr .gl{animation:cglw 1.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes cglw{50%{filter:brightness(1.35) drop-shadow(0 0 4px #fff8)}}
.cr .sp{animation:cspn 4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes cspn{to{transform:rotate(360deg)}}
.cr .au{animation:ctw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cr .au:nth-child(2){animation-delay:-.7s}.cr .au:nth-child(3){animation-delay:-1.4s}
@keyframes ctw{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.cr.sil svg{filter:brightness(0);opacity:.26}.cr.sil *{animation:none!important}
.cr.hop{animation:hop .5s ease-out}
@keyframes hop{30%{transform:translateY(-16%) rotate(-5deg)}60%{transform:translateY(0)}80%{transform:translateY(-6%)}}
/* title */
#title{justify-content:center;gap:10px;overflow:hidden}
#tHero{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:clamp(96px,24vh,170px);direction:ltr}

#tTitle{font-size:clamp(32px,9.5vw,56px);font-weight:900;color:#fff;text-shadow:0 4px 0 var(--ink),0 0 18px #fff8;margin:0;text-align:center;line-height:1.05}

#langs{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:2px}
#flags{display:flex;gap:6px}

/* intro */
#intro .wrap{justify-content:center;gap:12px}

.bub{background:#fff;border-radius:20px;padding:12px 14px;font-weight:800;font-size:clamp(16px,4.4vw,19px);line-height:1.35;box-shadow:0 5px 0 #0002;flex:1;min-width:0}

#inC{display:flex;justify-content:center;gap:8px;min-height:0}
.stc{flex:1;max-width:190px;background:#fff;border-radius:22px;padding:8px 4px 10px;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:2px;border:4px solid transparent;font-weight:900;min-width:0}

/* map */
.box{flex:1;min-height:90px;position:relative;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 #0003,inset 0 0 0 4px #fff;background:#8fd8f5;direction:ltr}
.box>svg.bg{position:absolute;inset:0;width:100%;height:100%}

.node.cur .o{border-color:var(--ye);animation:pls 1.6s ease-in-out infinite}

.hs:nth-of-type(2n) .i{animation-delay:-.6s}
.hs .q{position:absolute;top:-2px;right:0;font-size:17px;background:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #0003;font-weight:900}
.hs.who{width:auto;height:auto;flex-direction:column;gap:0;border-radius:18px;padding:2px}

@keyframes rus{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-5deg)}60%{transform:rotate(0)}}

#rInfo,#gInfo{flex:none;background:#fff;border-radius:16px;padding:7px 12px;font-weight:800;font-size:clamp(14px,3.9vw,16.5px);box-shadow:0 4px 0 #0002;text-align:center;line-height:1.3;min-height:36px}
#rQ{font-size:15px;min-height:44px;padding:4px 12px}
/* meet */
#meetBox{align-items:center;justify-content:center;display:flex;flex-direction:column}
#meetBox .cr{height:min(62%,260px);aspect-ratio:1;position:relative}
#mName{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none}
.tag{background:#fff;border-radius:14px;padding:4px 10px;font-weight:900;font-size:clamp(14px,4vw,17px);box-shadow:0 3px 0 #0003;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tag small{font-weight:800;opacity:.75;font-size:.82em}
#mHearts{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 12px;font-size:22px;box-shadow:0 3px 0 #0003;white-space:nowrap;letter-spacing:2px}
#mHearts .h{display:inline-block;opacity:.25;filter:grayscale(1);transition:all .3s}#mHearts .h.on{opacity:1;filter:none;transform:scale(1.15)}#mHearts .h.half{opacity:.65;filter:grayscale(.4)}
.say{flex:none;background:#fff;border-radius:16px;padding:7px 12px;font-weight:800;font-size:clamp(14.5px,4vw,17px);box-shadow:0 4px 0 #0002;text-align:center;line-height:1.3;min-height:44px;display:flex;align-items:center;justify-content:center}
.panel{flex:none;min-height:clamp(196px,34vh,236px);display:flex;flex-direction:column;gap:7px;justify-content:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .btn{min-height:48px;font-size:clamp(15px,4.1vw,18px);padding:6px 8px}
/* battle */
#bArena .fs{position:absolute;width:46%;height:min(64%,calc(100% - 70px));display:flex;align-items:flex-end;justify-content:center;transition:transform .25s,opacity .4s}
#bArena .fs.op{bottom:4%;right:2%}#bArena .fs.me{bottom:4%;left:2%}
#bArena .fs .cr{height:100%;aspect-ratio:1;max-width:100%}

#bArena .fs.me .cr svg{transform:scaleX(-1)}
.fs.atk.me{transform:translate(24%,-4%)}.fs.atk.op{transform:translate(-24%,-4%)}
.fs.hit{animation:shk .35s}.fs.out{opacity:0;transform:translateY(20%) scale(.7)}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.inf{position:absolute;background:#fffffff2;border-radius:16px;padding:6px 9px;box-shadow:0 4px 0 #0003;width:min(47%,250px);font-weight:900;font-size:clamp(13px,3.7vw,15.5px);line-height:1.2}
.inf.op{top:8px;right:8px}.inf.me{top:8px;left:8px}
.inf .r1{display:flex;justify-content:space-between;gap:4px;white-space:nowrap}.inf .r1 span:first-child{overflow:hidden;text-overflow:ellipsis}
.bar{height:11px;border-radius:99px;background:#dfe6ee;overflow:hidden;margin:4px 0 3px;direction:ltr}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(#7be39b,#34c36f);transition:width .45s}
.bar.mid i{background:linear-gradient(#ffe27a,#ffc233)}.bar.low i{background:linear-gradient(#ffb199,#ff7f66)}
.bar.xp i{background:linear-gradient(#a8d5ff,#5aa9ff)}
.inf .r2{display:flex;justify-content:space-between;align-items:center;min-height:17px;font-size:13px}
.inf .dots{letter-spacing:1px;font-size:10px}
.pop{position:absolute;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #0008;pointer-events:none;animation:popu 1s ease-out forwards;z-index:5;white-space:nowrap}
@keyframes popu{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-46px) scale(1);opacity:0}}
.mv{min-height:52px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #0003;font-weight:900;font-size:clamp(14px,3.9vw,16.5px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;line-height:1.15;border-bottom:5px solid var(--ec,#ccc);text-align:center}

.mv:active{transform:translateY(3px)}.mv:disabled{opacity:.4}
.row3{display:flex;gap:8px}.row3>*{flex:1}
/* question */
.qz{display:flex;flex-direction:column;gap:6px;height:100%;justify-content:center}
.qz .qt{background:#fff;border-radius:14px;padding:5px 10px;font-weight:900;font-size:clamp(14px,3.9vw,16.5px);text-align:center;line-height:1.25;box-shadow:0 3px 0 #0002}
.qz .qt small{display:block;font-size:11.5px;color:#c2185b;font-weight:900}

/* team / book / garden */
.lst{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:grid;gap:8px;align-content:start;padding:2px 2px 8px}
#teamL{grid-template-columns:1fr 1fr}
.tc{background:#fff;border-radius:20px;box-shadow:0 5px 0 #0003;padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;min-width:0;position:relative}
.tc .cr{width:min(84%,150px);aspect-ratio:1}
.tc .nm{font-size:clamp(15px,4.2vw,18px);white-space:nowrap}
.tc .bar{width:86%}
.tc.empty{background:#ffffff66;box-shadow:none;border:3px dashed #fff;justify-content:center;color:#fff;font-size:15px;text-align:center;min-height:120px;text-shadow:0 1px 0 #0005}
.tc .ld{position:absolute;top:6px;inset-inline-start:8px;font-size:17px}
#bookL{grid-template-columns:repeat(4,1fr)}
.bc{background:#fff;border-radius:16px;box-shadow:0 4px 0 #0003;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:12px;min-width:0;position:relative;min-height:74px}

.bc.un{background:#ffffffb0}
#gBox .gcr{position:absolute;width:24%;max-width:124px;aspect-ratio:1;transform:translate(-50%,-100%);animation:wand var(--wt,9s) ease-in-out infinite alternate;animation-delay:var(--wd,0s)}
#gBox .gcr .cr{width:100%;height:100%}
@keyframes wand{from{margin-left:-5%}to{margin-left:5%}}
#gBox .slot{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;font-size:34px;display:flex;align-items:center;justify-content:center;line-height:1}
#gBox .slot.e{border:3px dashed #fff;color:#fff;font-size:24px;font-weight:900;background:#ffffff33}
/* overlay */
.ov{position:fixed;inset:0;background:#0b2a3cb0;display:none;align-items:center;justify-content:center;z-index:40;padding:12px}
.ov.on{display:flex}
.card{background:var(--cream);border-radius:26px;padding:14px 14px 16px;width:min(100%,430px);max-height:100%;overflow-y:auto;touch-action:pan-y;box-shadow:0 10px 0 #0004;display:flex;flex-direction:column;align-items:stretch;gap:9px;text-align:center;animation:cin .22s ease-out}

.card h3{margin:0;font-size:clamp(20px,5.6vw,25px);font-weight:900;line-height:1.15}
.card p{margin:0;font-weight:700;font-size:clamp(15px,4.1vw,17px);line-height:1.35}
.card .big{font-size:52px;line-height:1}
.card .art{align-self:center;width:min(46%,170px);aspect-ratio:1}
.card .rw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.card .rw .pill{box-shadow:0 2px 0 #0002;background:#fff;direction:inherit;unicode-bidi:plaintext;white-space:normal;text-align:center;line-height:1.2}
.card .stg{display:flex;justify-content:center;align-items:flex-end;gap:4px;direction:ltr}
.card .stg .cr{width:30%;max-width:104px;aspect-ratio:1}.card .stg .cr:nth-child(1){width:22%}.card .stg .cr:nth-child(3){width:26%}
.card .stg span.ar{font-size:18px;align-self:center;opacity:.6}
.card .mvl{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:13.5px;font-weight:800}
.card .mvl div{background:#fff;border-radius:12px;padding:5px 6px;border-bottom:4px solid var(--ec,#ccc);line-height:1.2}
.card .mvl div.lk{opacity:.55}
.card .qz .qb{color:var(--ink);text-shadow:none}
.card .qhost{min-height:200px}
.evo{position:relative;align-self:center;width:min(60%,210px);aspect-ratio:1}
.evo .cr{position:absolute;inset:0}
.evo.go .cr{animation:evo 1.6s ease-in-out}

.whl{align-self:center;width:min(78%,250px);aspect-ratio:1}
.dgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

function calcDmg(A,D,mv,boost){const m=MV[mv];let d=m.pw*(1+.07*A.lv)*(.86+.08*A.sp.st[1])*effMul(m.el,D.sp.el)*(boost?1.5:1)*(A.s.pump?1.3:1)*(A.s.dizzy?.7:1)*(.93+Math.random()*.14);if(m.el===A.sp.el)d*=1.1;if(D.s.guard)d*=.5;return Math.max(1,Math.round(d))}
function mvScore(A,D,mv){const m=MV[mv];if(m.pw&&!m.fx)return m.pw*effMul(m.el,D.sp.el)*(m.el===A.sp.el?1.1:1);const base=m.pw*effMul(m.el,D.sp.el);
 switch(m.fx){case 'dizzy':return base+(D.s.dizzy?0:8);case 'sleepy':return D.s.sleepy||D.s.woke?0:10;case 'pump':return A.s.pump?0:9;case 'guard':return A.s.guard?0:7;case 'regen':return A.s.regen||A.e>A.max*.8?1:8;case 'heal':return A.e<A.max*.35?12:1}return base}

async function perform(side,a){const other=side==='me'?'op':'me',A=cur(side),D=cur(other);
 if(a.t==='switch'){if(side==='me')M.mi=a.i;else M.oi=a.i;putF(side);upInf();SFX.pop();bSay(side==='me'?t('goMe',{a:nameOf(cur(side).key)}):t('sends',{b:nameOf(cur(side).key)}));await wait(800);return}

 if(m.pw){cls(side,'atk',260);await wait(260);const eff=effMul(m.el,D.sp.el),d=calcDmg(A,D,a.mv,boost);if(D.s.guard)D.s.guard=0;D.e=Math.max(0,D.e-d);SFX.hit();cls(other,'hit',360);pop(other,'−'+d);

async function checkTired(){for(const s of ['op','me']){const f=cur(s);if(f.e>0)continue;cls(s,'out');bSay(tc('tired',f.key));await wait(1000);const team=s==='me'?M.me:M.op;

async function doTurn(act,boost){const oa=aiPick(),seq=[];if(act.t!=='move')seq.push(['me',act]);if(oa.t==='switch')seq.push(['op',oa]);
