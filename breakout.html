function musTick(){if(muted||!musicOn||document.hidden||!AC)return;const bar=(musStep>>3)&3,k=musStep&7,ch=ARP[bar];
 tone(N(ch[[0,1,2,1,0,1,2,1][k]]),.11,"square",.035);if(k%4===0)tone(N(ch[0]-24),.28,"triangle",.07);if(k===7&&bar%2)tone(N(ch[2]+12),.1,"square",.03);musStep++}

function clamp(v,a,b){return v<a?a:v>b?b:v}
function normalize(b){const l=Math.hypot(b.dx,b.dy)||1;b.dx/=l;b.dy/=l;
 const mn=.3;if(Math.abs(b.dy)<mn){b.dy=(b.dy<0||b.dy===0?-1:1)*mn;const l2=Math.hypot(b.dx,b.dy);b.dx/=l2;b.dy/=l2}}
function rectHit(b,rx,ry,rw,rh,r){
 const qx=clamp(b.x,rx,rx+rw),qy=clamp(b.y,ry,ry+rh);let ex=b.x-qx,ey=b.y-qy;const d2=ex*ex+ey*ey;if(d2>=r*r)return false;
 if(d2<1e-6){ // centre inside: push out along shortest axis
  const l=b.x-rx,rr=rx+rw-b.x,tp=b.y-ry,bt=ry+rh-b.y,m=Math.min(l,rr,tp,bt);
  if(m===tp){ex=0;ey=-1}else if(m===bt){ex=0;ey=1}else if(m===l){ex=-1;ey=0}else{ex=1;ey=0}b.x+=ex*(m+r);b.y+=ey*(m+r)}
 else{const d=Math.sqrt(d2);ex/=d;ey/=d;b.x=qx+ex*(r+.01);b.y=qy+ey*(r+.01)}
 const dot=b.dx*ex+b.dy*ey;if(dot<0){b.dx-=2*dot*ex;b.dy-=2*dot*ey}return true}
function clearAll(){ // test hook + boss defeat: bonk every cage

function stepBall(b,dt){
 const r=7,sp=ballSpeed(),dist=sp*dt,n=Math.max(1,Math.ceil(dist/3.5)),st=dist/n;
 for(let i=0;i<n;i++){
  b.x+=b.dx*st;b.y+=b.dy*st;
  if(b.x<r){b.x=r;b.dx=Math.abs(b.dx);SFX.bounce();normalize(b)}
  else if(b.x>W-r){b.x=W-r;b.dx=-Math.abs(b.dx);SFX.bounce();normalize(b)}
  if(b.y<TOP+r){b.y=TOP+r;b.dy=Math.abs(b.dy);SFX.bounce();normalize(b)}
  // bricks
  for(const k of G.bricks){if(!k.alive)continue;
   if(b.y<k.y-r-1||b.y>k.y+BH+r+1||b.x<k.x-r-1||b.x>k.x+BW+r+1)continue;
   if(rectHit(b,k.x+1,k.y+1,BW-2,BH-2,r)){k.hp--;k.flash=.15;G.hits++;normalize(b);
    if(k.hp<=0)breakBrick(k);else{SFX.clank();shake(1.5,.08);burst(b.x,b.y,["#ccc","#fff"],4,80,.3);G.score+=5}
    break}}
  // boss
  const bo=G.boss;if(bo&&bo.alive&&bo.cd<=0){
   if(rectHit(b,bo.x,bo.y,bo.w,bo.h,r)){bo.hp--;bo.flash=.25;bo.cd=.12;normalize(b);SFX.boss();shake(5,.25);G.score+=30;
    burst(b.x,b.y,["#ffd36b","#fff","#ff7eb6"],12,160,.7);
    if(bo.hp%3===0)dropCap(bo.x+bo.w/2,bo.y+bo.h);
    if(bo.hp<=0){bo.alive=false;clearAll();G.falls.push({x:bo.x+bo.w/2,y:bo.y+bo.h/2,em:aEm(G.def.a),vy:50,run:0,vx:0,hop:0,id:G.def.a});for(let q=0;q<4;q++)burst(bo.x+Math.random()*bo.w,bo.y+Math.random()*bo.h,["#ffd36b","#ff7eb6","#7bc67b","#4aa3df"],14,220,1.2)}
    break}}
  // paddle (generous)
  if(b.dy>0&&b.y+r>=PADY&&b.y<PADY+PADH&&Math.abs(b.x-G.px)<=G.pw/2+r+3){
   const tt2=clamp((b.x-G.px)/(G.pw/2+4),-1,1),a=tt2*1.05;

   if(G.sticky>0){b.stuck=true;b.off=clamp(b.x-G.px,-G.pw/2+8,G.pw/2-8);break}
   normalize(b)}
  // net
  if(G.net&&b.dy>0&&b.y+r>=NETY){b.y=NETY-r;b.dy=-Math.abs(b.dy);G.net=false;SFX.net();burst(b.x,NETY,["#b79bff","#fff"],10,100,.5);normalize(b)}
  if(b.y>H+r)return false}
 return true}
function update(dt){
 if(!G)return;G.t+=dt;
 const D=dif();
 // paddle keys
 const kv=(keys.R-keys.L)*340*dt;if(kv)G.px+=kv;
 G.pw+=(G.pwT-G.pw)*Math.min(1,dt*10);G.px=clamp(G.px,G.pw/2+4,W-G.pw/2-4);
 if(G.wide>0){G.wide-=dt;if(G.wide<=0){G.pwT=D.pw}}
 if(G.slow>0)G.slow-=dt;if(G.sticky>0){G.sticky-=dt;if(G.sticky<=0){for(const b of G.balls)if(b.stuck&&G.state!=="ready"){b.stuck=false;b.dy=-1;b.dx=0}}}

 const bo=G.boss;if(bo&&bo.alive){bo.ph+=dt;bo.x=W/2-bo.w/2+Math.sin(bo.ph*(D.bossSpd/55))*(W/2-bo.w/2-12);if(bo.flash>0)bo.flash-=dt;if(bo.cd>0)bo.cd-=dt}
 if(G.state==="play"||G.state==="ready"){
  for(let i=G.balls.length-1;i>=0;i--){const b=G.balls[i];
   if(b.stuck){b.x=clamp(G.px+b.off,8,W-8);b.y=PADY-8;continue}
   b.trail.push(b.x,b.y);if(b.trail.length>12)b.trail.splice(0,2);
   if(!stepBall(b,dt))G.balls.splice(i,1)}
  if(G.state==="play"&&G.balls.length===0)loseLife();
  else if(G.state==="ready"&&G.balls.length===0){G.balls.push(newBall(true))}
  if(G.state!=="dead")checkClear()}
 // falling animals
 for(let i=G.falls.length-1;i>=0;i--){const f=G.falls[i];
  if(!f.run){f.y+=f.vy*dt;f.vy=Math.min(110,f.vy+30*dt);
   if(G.state!=="clear"&&G.state!=="dead"&&f.y+9>=PADY-2&&f.y-9<=PADY+PADH&&Math.abs(f.x-G.px)<G.pw/2+12){G.falls.splice(i,1);G.caught++;G.score+=50;SFX.catch();burst(f.x,PADY,["#ffd36b","#fff","#ff7eb6"],12,130,.6);G.msgs.push({txt:t("caught"),t:.8,max:.8,small:1});

   if(f.y>=FLOOR){f.run=1;f.vx=(f.x<W/2?-1:1)*(70+Math.random()*30)}}
  else{f.x+=f.vx*dt;f.hop+=dt*14;if(f.x<-20||f.x>W+20)G.falls.splice(i,1)}}
 for(let i=G.caps.length-1;i>=0;i--){const c=G.caps[i];c.y+=c.vy*dt;
  if(G.state!=="clear"&&G.state!=="dead"&&c.y+10>=PADY&&c.y-10<=PADY+PADH&&Math.abs(c.x-G.px)<G.pw/2+14){G.caps.splice(i,1);applyPU(c.type);burst(c.x,PADY,[PUCOL[c.type],"#fff"],10,120,.5);continue}
  if(c.y>H+20)G.caps.splice(i,1)}
 for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue}p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}

}

function drawPaw(){

 // toe beans
 const n=Math.max(3,Math.round(w/22)),sp=w/n;cx.fillStyle="#2a1a0e";
 for(let i=0;i<n;i++){const bx=x+sp*(i+.5);cx.fillRect(bx-6,y-9,12,10);cx.fillStyle="#ffb347";cx.fillRect(bx-5,y-8,10,9);cx.fillStyle="#ff7eb6";cx.fillRect(bx-3,y-6,6,5);cx.fillStyle="#2a1a0e"}
 // sticky glow
 if(G.sticky>0){cx.fillStyle="#ffd36b";cx.globalAlpha=.6+.3*Math.sin(G.t*10);cx.fillRect(x,y-3,w,3);cx.globalAlpha=1}
}
function drawBall(b){
 for(let i=0;i<b.trail.length;i+=2){cx.globalAlpha=i/b.trail.length*.35;cx.fillStyle="#ff7eb6";const s=3+i/4;cx.fillRect(b.trail[i]-s/2|0,b.trail[i+1]-s/2|0,s,s)}cx.globalAlpha=1;
 const x=b.x|0,y=b.y|0;cx.fillStyle="#2a1a0e";cx.beginPath();cx.arc(x,y,8.5,0,6.3);cx.fill();
 cx.fillStyle="#ff5fa2";cx.beginPath();cx.arc(x,y,7,0,6.3);cx.fill();
 cx.strokeStyle="#ffc2de";cx.lineWidth=2;cx.beginPath();cx.arc(x,y,4.5,.3,3.6);cx.stroke();cx.beginPath();cx.moveTo(x-6,y+1);cx.lineTo(x+5,y-3);cx.stroke();
 cx.fillStyle="#fff";cx.fillRect(x-4,y-5,2,2)}
function drawBoss(bo){
 const x=bo.x|0,y=bo.y|0,w=bo.w,h=bo.h,fl=bo.flash>0;
 cx.fillStyle="#2a1a0e";cx.fillRect(x-3,y-3,w+6,h+6);
 cx.fillStyle=fl?"#fff":"#8aa0c0";cx.fillRect(x,y,w,h);cx.fillStyle=fl?"#fff":"#b5c6e0";cx.fillRect(x,y,w,6);cx.fillStyle="#6a7fa0";cx.fillRect(x,y+h-6,w,6);
 // antenna
 cx.fillStyle="#2a1a0e";cx.fillRect(x+w/2-2,y-16,4,14);cx.fillStyle=(G.t*4|0)%2?"#ff3b6b":"#ffd36b";cx.fillRect(x+w/2-5,y-22,10,8);
 // eyes
 cx.fillStyle="#fff";cx.fillRect(x+16,y+10,24,16);cx.fillRect(x+w-40,y+10,24,16);cx.fillStyle="#2a1a0e";const ex=Math.sin(G.t*3)*4;cx.fillRect(x+24+ex,y+14,8,8);cx.fillRect(x+w-32+ex,y+14,8,8);
 // silly mouth
 cx.fillStyle="#2a1a0e";cx.fillRect(x+w/2-18,y+32,36,5);cx.fillRect(x+w/2-18,y+30,4,3);cx.fillRect(x+w/2+14,y+30,4,3);
 // belly cage with animal
 cx.fillStyle="#2a1a0e";cx.fillRect(x+w/2-22,y+h-30,44,26);cx.fillStyle="#fff1c9";cx.fillRect(x+w/2-20,y+h-28,40,22);
 cx.font="20px "+EF;cx.textAlign="center";cx.textBaseline="middle";cx.fillStyle="#000";cx.fillText(aEm(G.def.a),x+w/2,y+h-16);
 cx.fillStyle="#6a7fa0";for(let i=0;i<5;i++)cx.fillRect(x+w/2-18+i*9,y+h-28,3,22);
 // wheels
 cx.fillStyle="#2a1a0e";cx.fillRect(x+6,y+h,22,8);cx.fillRect(x+w-28,y+h,22,8);
 // hp bar
 const hy2=y+h+12;cx.fillStyle="#2a1a0e";cx.fillRect(x,hy2,w,8);cx.fillStyle="#7bc67b";cx.fillRect(x+1,hy2+1,(w-2)*Math.max(0,bo.hp)/bo.max,6)}
function render(){
 if(!G)return;
 cx.setTransform(scale*dpr,0,0,scale*dpr,0,0);cx.imageSmoothingEnabled=false;
 let ox=0,oy=0;if(shakeT>0){ox=(Math.random()-.5)*shakeM*2;oy=(Math.random()-.5)*shakeM*2}
 cx.save();cx.translate(ox,oy);cx.drawImage(bgFor(G.n),0,0);
 for(const k of G.bricks)if(k.alive)cage(k);
 if(G.boss&&G.boss.alive)drawBoss(G.boss);
 if(G.net){cx.strokeStyle="#fff";cx.globalAlpha=.8;cx.lineWidth=1;cx.fillStyle="#b79bff";cx.fillRect(0,NETY,W,3);for(let x=0;x<W;x+=12){cx.beginPath();cx.moveTo(x,NETY);cx.lineTo(x+6,NETY+10);cx.lineTo(x+12,NETY);cx.stroke()}cx.globalAlpha=1}
 // falling / running animals
 cx.textAlign="center";cx.textBaseline="middle";
 for(const f of G.falls){cx.font="20px "+EF;cx.fillStyle="#000";const hy=f.run?-Math.abs(Math.sin(f.hop))*7:0;cx.fillText(f.em,f.x,f.y+hy);if(f.run){cx.font="9px "+EF;cx.fillText("🐾",f.x-Math.sign(f.vx)*14,f.y+8)}else{cx.fillStyle="#fffa";cx.fillRect(f.x-1,f.y-16,2,5)}}
 for(const c of G.caps){cx.fillStyle="#2a1a0e";cx.fillRect(c.x-13,c.y-11,26,22);cx.fillStyle=PUCOL[c.type];cx.fillRect(c.x-11,c.y-9,22,18);cx.fillStyle="#fff6";cx.fillRect(c.x-11,c.y-9,22,4);cx.font="13px "+EF;cx.fillStyle="#000";cx.fillText(PUEM[c.type],c.x,c.y+1)}
 for(const b of G.balls)drawBall(b);
 if(G.state!=="clear"&&G.state!=="dead")drawPaw();
 for(const p of G.parts){cx.globalAlpha=Math.min(1,p.life/p.max*1.6);cx.fillStyle=p.c;cx.fillRect(p.x|0,p.y|0,p.s,p.s)}cx.globalAlpha=1;
 cx.restore();
 // HUD strip
 cx.fillStyle="#2a1a0ee0";cx.fillRect(0,0,W,TOP-4);cx.fillStyle="#ffd36b";cx.fillRect(0,TOP-6,W,2);
 const L=G.lives;for(let i=0;i<Math.min(L,8);i++)heart(8+i*17,10,2.2,true);
 cx.font="bold 16px monospace";cx.textAlign="right";cx.textBaseline="middle";cx.fillStyle="#fff";cx.fillText(String(G.score).padStart(5,"0"),W-8,15);
 // timers
 let tx=W/2-20;cx.font="12px "+EF;cx.textAlign="left";
 for(const [k,v,m] of [["wide",G.wide,14],["slow",G.slow,10],["sticky",G.sticky,15]]){if(v>0){cx.fillStyle=PUCOL[k];cx.fillRect(tx,24,22*v/m,3);cx.fillStyle="#fff";cx.fillText(PUEM[k],tx,14);tx+=28}}
 if(G.net){cx.fillStyle="#fff";cx.fillText("🕸️",tx,14)}
 // messages
 for(const m of G.msgs){const a=Math.min(1,m.t/.4,(m.max-m.t)/.15+.2);cx.globalAlpha=a;cx.font=(m.small?"bold 15px":"bold 18px")+" Rubik,Arial,sans-serif";cx.textAlign="center";const y=m.small?PADY-34:H/2+40;
  const tw=cx.measureText(m.txt).width+22;cx.fillStyle="#2a1a0ecc";cx.fillRect(W/2-tw/2,y-15,tw,30);cx.fillStyle="#ffd36b";cx.fillText(m.txt,W/2,y);cx.globalAlpha=1}
 if(G.state==="ready"&&G.balls.length&&Math.floor(G.t*2)%2===0){cx.font="26px "+EF;cx.textAlign="center";cx.fillStyle="#000";cx.fillText("👆",G.px,PADY-40)}
}
/* ===================== LOOP ===================== */
let last=0,acc=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(mode==="play"&&G&&!document.hidden){acc+=dt;let s=0;while(acc>=1/120&&s<10){update(1/120);acc-=1/120;s++}if(s>=10)acc=0}
 else acc=0;
 if(G&&(mode==="play"||mode==="result"||mode==="pause"))render()}
function resize(){
 const st=$("stage"),r=st.getBoundingClientRect();if(!r.width||!r.height)return;
 const s=Math.min((r.width-16)/W,(r.height-16)/H);scale=Math.max(.3,s);dpr=Math.min(2,window.devicePixelRatio||1);
 const cw=Math.floor(W*scale),ch=Math.floor(H*scale);scale=cw/W;cv.style.width=cw+"px";cv.style.height=ch+"px";cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr)}
addEventListener("resize",resize);if(window.visualViewport)visualViewport.addEventListener("resize",resize);
/* ===================== INPUT ===================== */
let ptr=null;
const stage=$("stage");
stage.addEventListener("pointerdown",e=>{if(mode!=="play"||!G)return;ptr={id:e.pointerId,x0:e.clientX,y0:e.clientY,lx:e.clientX,t:performance.now(),moved:0,touch:e.pointerType!=="mouse"};try{stage.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
stage.addEventListener("pointermove",e=>{if(mode!=="play"||!G)return;
 if(e.pointerType==="mouse"){const r=cv.getBoundingClientRect();G.px=clamp((e.clientX-r.left)/scale,G.pw/2+4,W-G.pw/2-4);if(ptr&&e.pointerId===ptr.id)ptr.moved+=Math.abs(e.movementX||0);return}
 if(!ptr||e.pointerId!==ptr.id)return;const dx=e.clientX-ptr.lx;ptr.lx=e.clientX;ptr.moved+=Math.abs(dx);G.px=clamp(G.px+dx/scale*1.35,G.pw/2+4,W-G.pw/2-4)});
function pend(e){if(!ptr||(e.pointerId!==ptr.id))return;const p=ptr;ptr=null;if(mode==="play"&&G&&p.moved<12&&performance.now()-p.t<500)launch()}
stage.addEventListener("pointerup",pend);stage.addEventListener("pointercancel",()=>{ptr=null});
function hold(id,key){const b=$(id);const on=e=>{keys[key]=1;b.classList.add("on");unlockAudio();e.preventDefault()},off=()=>{keys[key]=0;b.classList.remove("on")};
 b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off)}
hold("bL","L");hold("bR","R");
$("bGo").addEventListener("pointerdown",e=>{e.preventDefault();unlockAudio();launch()});
addEventListener("keydown",e=>{
 if(window.AnnabelleDesk&&AnnabelleDesk.typing(e))return;const c=e.code;
 if(c==="ArrowLeft"||c==="KeyA"){keys.L=1;e.preventDefault()}
 else if(c==="ArrowRight"||c==="KeyD"){keys.R=1;e.preventDefault()}
 else if(c==="Space"||c==="ArrowUp"){e.preventDefault();if(mode==="play"){if(!launch())togglePause()}else if(mode==="pause")resumeGame()}
 else if(c==="KeyP"||c==="Escape"){if(mode==="play")togglePause();else if(mode==="pause")resumeGame()}
 else if(c==="KeyM"){muted=!muted;ls.set("annabelle-muted",muted?"1":"0");setBtns()}
 else if(c==="Enter"){if(mode==="pause")resumeGame()}});
addEventListener("keyup",e=>{const c=e.code;if(c==="ArrowLeft"||c==="KeyA")keys.L=0;if(c==="ArrowRight"||c==="KeyD")keys.R=0});
addEventListener("blur",()=>{keys.L=keys.R=0});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&mode==="play")togglePause(true)});
function togglePause(force){if(mode!=="play"&&!force)return;if(mode!=="play")return;mode="pause";showScreen("pause")}
function resumeGame(){if(mode!=="pause")return;mode="play";showScreen(null)}
$("pauseBtn").onclick=()=>{if(mode==="play")togglePause();else if(mode==="pause")resumeGame()};

/* ===================== SCREENS ===================== */
const SCREENS=["intro","menu","levels","zoo","how","pause","result"];
function showScreen(name){for(const s of SCREENS)$(s).classList.toggle("on",s===name);if(name&&name!=="pause"&&name!=="result"&&mode==="play")mode=name;
 if(name&&["intro","menu","levels","zoo","how"].includes(name))mode=name}
function stars(n){return"⭐".repeat(n)+"☆".repeat(3-n)}
function drawTexts(){
 const r=document.documentElement;r.lang=lang;r.dir=lang==="he"?"rtl":"ltr";document.title=t("title");
 $("inT").textContent=t("inT");$("in1").textContent=t("in1");$("in2").textContent=t("in2");$("in3").textContent=t("in3");$("inGo").textContent=t("go");$("inSkip").textContent=t("skip");
 $("mT").textContent=t("title");$("mSub").textContent=t("sub");$("mPlay").textContent=S.unl>1||S.animals.length?t("cont"):t("play");$("mLv").textContent=t("levels");$("mZoo").textContent=t("zoo");$("mHow").textContent=t("how");
 $("dif").innerHTML=[["easy","🐱"],["normal","🐯"],["hard","🦁"]].map(([k,e])=>`<button data-d="${k}" class="${S.diff===k?"sel":""}"><b>${e}</b>${t(k)}</button>`).join("");
 $("langs").querySelectorAll(".lg").forEach(x=>x.remove());
 const lg=document.createDocumentFragment();for(const [k,n] of LANGS){const b=document.createElement("button");b.className="lg"+(k===lang?" sel":"");b.dataset.lang=k;b.textContent=n;lg.appendChild(b)}$("langs").prepend(lg);
 $("lT").textContent=t("levels");$("lBack").textContent=t("back");$("zT").textContent=t("zooT");$("zBack").textContent=t("back");$("hT").textContent=t("how");$("hBack").textContent=t("back");
 $("pT").textContent=t("pause");$("pRes").textContent=t("resume");$("pRetry").textContent=t("retry");$("pMenu").textContent=t("menu");$("rMenu").textContent=t("menu");
 $("hList").innerHTML=[1,2,3,4,5,6].map(i=>`<div class="pan"><span class="em">${["👆","🧶","🐾","🔒","🏃","⏸"][i-1]}</span><span>${t("h"+i)}</span></div>`).join("")+`<div class="pan" style="font-size:14px"><span class="em">✨</span><span>${["wide","multi","slow","sticky","net"].map(k=>t("pu_"+k)).join(" · ")}</span></div>`;
 if(G&&mode!=="menu")$("title").textContent=t("lvl")+" "+G.n+" "+aEm(G.def.a)+(G.def.boss?" 🤖":"");else $("title").textContent=t("title");
 buildLevels();buildZoo();setBtns()}
function buildLevels(){$("lGrid").innerHTML=LV.map((d,i)=>{const n=i+1,lock=n>S.unl,st=S.stars[n]||0;return`<button class="lvb ${lock?"lock":""} ${d.boss?"boss":""}" data-lv="${n}" ${lock?"disabled":""}><span class="em">${lock?"🔒":d.boss?"🤖":aEm(d.a)}</span>${n}<span class="st">${lock?"":stars(st)}</span></button>`}).join("")}
function buildZoo(){$("zGrid").innerHTML=ZOO_ALL.map(id=>{const f=S.animals.includes(id);return`<div class="zc ${f?"":"no"}"><span class="em">${ANI[id][0]}</span>${f?aName(id):"?"}</div>`}).join("");$("zCount").textContent=S.animals.length+" / "+ZOO_ALL.length+" "+t("found")}
document.addEventListener("click",e=>{
 const L=e.target.closest&&e.target.closest("[data-lang]");if(L){lang=L.dataset.lang;ls.set("annabelle-lang",lang);SFX.click();drawTexts();return}
 const D=e.target.closest&&e.target.closest("[data-d]");if(D){S.diff=D.dataset.d;save();SFX.click();drawTexts();return}
 const V=e.target.closest&&e.target.closest("[data-lv]");if(V&&!V.disabled){SFX.click();G=null;startLevel(+V.dataset.lv)}});
function setMenu(){G=G&&mode==="play"?G:G;mode="menu";showScreen("menu");drawTexts()}
window.toMenu=function(){if(G)G.carry=0;mode="menu";showScreen("menu");drawTexts()};
$("mPlay").onclick=()=>{SFX.click();G=null;startLevel(Math.min(S.unl,NLV))};
$("mLv").onclick=()=>{SFX.click();buildLevels();showScreen("levels")};
$("mZoo").onclick=()=>{SFX.click();buildZoo();showScreen("zoo")};
$("mHow").onclick=()=>{SFX.click();showScreen("how")};
for(const id of["lBack","zBack","hBack"])$(id).onclick=()=>{SFX.click();showScreen("menu")};
$("inGo").onclick=$("inSkip").onclick=()=>{SFX.click();S.intro=1;save();showScreen("menu");drawTexts()};
$("pRes").onclick=()=>{SFX.click();resumeGame()};
$("pRetry").onclick=()=>{SFX.click();const n=G.n;G.carry=G.scoreStart;startLevel(n)};
$("pMenu").onclick=()=>{SFX.click();toMenu()};
$("rMenu").onclick=()=>{SFX.click();toMenu()};
$("rRetry").onclick=()=>{SFX.click();const n=G.n;G.carry=G.scoreStart;startLevel(n)};
$("rNext").onclick=()=>{SFX.click();const won=G.won,n=G.n;if(won&&n<NLV){const c=G.score;G.carry=c;startLevel(n+1)}else if(won){toMenu()}else{G.carry=G.scoreStart;startLevel(n)}};
function showResult(win){
 mode="result";G.won=win;
 const n=G.n;
 if(win){
  const stN=G.lost===0?3:G.lost<=2?2:1;G.score+=100*Math.max(0,G.lives);
  const prev=S.stars[n]||0;if(stN>prev)S.stars[n]=stN;if(n+1>S.unl&&n<NLV)S.unl=n+1;if(n===NLV&&S.unl<NLV)S.unl=NLV;
  if(G.score>S.best)S.best=G.score;
  const fresh=addZoo(G.def.a);let bonusTxt="";
  if(G.caught>=3&&G.def.b){const f2=addZoo(G.def.b);bonusTxt=aEm(G.def.b)+" "+aName(G.def.b)+(f2?" ✨":"")}
  save();
  R("levelClear",{level:n,score:G.score});R("star",{stars:stN});if(G.def.boss)R("win");R("score",{score:G.score});
  if(n===NLV){R("win")}
  $("rEm").textContent=aEm(G.def.a)+(bonusTxt?" "+aEm(G.def.b):"");$("rT").textContent=n===NLV?t("finT"):t("clear");$("rStars").textContent=stars(stN);
  $("rTxt").textContent=n===NLV?t("fin"):aName(G.def.a)+" "+t("freed");$("rNote").textContent=(bonusTxt?bonusTxt+" · ":"")+"🏆 "+G.score;
  $("rNext").style.display="";$("rNext").textContent=n===NLV?t("menu"):t("next");
  $("rRetry").style.display="";$("rRetry").textContent=t("retry");
 }else{
  R("score",{score:G.score});
  $("rEm").textContent="🐾";$("rT").textContent=t("again");$("rStars").textContent="";$("rTxt").textContent=t("againTxt");$("rNote").textContent="🏆 "+G.score;
  $("rNext").style.display="";$("rNext").textContent=t("retry");$("rRetry").style.display="none"}
 showScreen("result");RF();buildLevels();buildZoo();drawTexts()}
function boot(){
 drawTexts();setBtns();resize();
 requestAnimationFrame(ts=>{last=ts;frame(ts)});
 if(!S.intro){showScreen("intro")}else{showScreen("menu")}
 new ResizeObserver(resize).observe($("stage"));
}
/* ===================== TEST HOOK ===================== */
window.__breakout={
 state(){return G?{mode,level:G.n,score:G.score,lives:G.lives,lost:G.lost,state:G.state,bricks:G.bricks.filter(b=>b.alive).length,balls:G.balls.length,stuck:G.balls.filter(b=>b.stuck).length,boss:G.boss?{hp:G.boss.hp,alive:G.boss.alive}:null,caps:G.caps.length,falls:G.falls.length,caught:G.caught,pw:Math.round(G.pw),wide:G.wide>0,slow:G.slow>0,sticky:G.sticky>0,net:G.net,px:G.px,ball:G.balls[0]?{x:G.balls[0].x,y:G.balls[0].y,dx:G.balls[0].dx,dy:G.balls[0].dy}:null}:{mode}},
 start(n,diff){if(diff){S.diff=diff;save()}G=null;startLevel(n||1)},
 launch,
 win(){if(G&&mode==="play"){clearAll();if(G.boss)G.boss.alive=false;G.balls.length=0;winLevel()}},
 lose(){if(G&&mode==="play"){G.lives=1;G.balls.length=0;G.state="play";loseLife()}},
 powerup(type){if(G)applyPU(type)},
 drop(type){if(G)dropCap(G.px,PADY-30,type)},
 setX(x){if(G)G.px=x},
 step(sec){const n=Math.round(sec*120);for(let i=0;i<n;i++)update(1/120)},
 save(){return JSON.parse(JSON.stringify(S))},
 zoo(){try{return JSON.parse(ls.get("annabelle-retro-zoo")||"[]")}catch(e){return[]}},
 levels:NLV,
 setLang(l){lang=l;ls.set("annabelle-lang",l);drawTexts()}};
boot();
