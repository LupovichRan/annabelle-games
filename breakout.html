<style>
:root{--ink:#3b2a14;--pk:#ff7eb6;--or:#ffb347;--bg:#2b1d4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:var(--bg);font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew",Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button,a{font-family:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation;background:none;padding:0;text-decoration:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,var(--sab,6px))}
#bar{display:flex;gap:8px;align-items:center;flex:none;padding-bottom:6px}
.ib{width:48px;height:48px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 4px 0 #0005;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none;border:3px solid #ffd36b;transition:transform .07s}

#wrap{position:relative;flex:none;line-height:0;border-radius:10px;box-shadow:0 0 0 4px #ffd36b,0 0 0 8px #0006;overflow:hidden}

#banner{position:absolute;left:0;right:0;top:47%;display:flex;justify-content:center;pointer-events:none;line-height:1.2;transform:translateX(-112%);transition:transform .4s cubic-bezier(.2,1.35,.4,1)}

#banner>div{background:#2a1a0e;color:#ffd36b;border:4px solid #ffd36b;border-radius:16px;padding:10px 18px;font:900 clamp(19px,5.6vw,26px)/1.25 Rubik,Arial;text-align:center;box-shadow:0 6px 0 #0006;max-width:92%}

#ctrl{flex:none;display:flex;gap:10px;justify-content:center;padding-top:8px;direction:ltr}
.cb{width:84px;height:62px;border-radius:18px;background:#ffb347;color:var(--ink);font-size:30px;font-weight:900;box-shadow:0 5px 0 #a8641a;border:3px solid #fff8;display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .07s}

.cb.go{width:110px;background:#ff7eb6;box-shadow:0 5px 0 #b3427d}
.desk #ctrl{display:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(#ffffff1c 2px,#0000 3px) 0 0/16px 16px,#2b1d4aee;z-index:5;padding:12px;overflow:auto;touch-action:pan-y;animation:bgdrift 5s linear infinite}
@keyframes bgdrift{to{background-position:32px 32px,0 0}}
.scr.on{display:flex}
#drift{position:absolute;inset:0;overflow:hidden;pointer-events:none}

@keyframes floatUp{to{transform:translateY(-118vh) rotate(50deg)}}
.card{position:relative;z-index:1;background:#fff6e5;color:var(--ink);border-radius:22px;border:4px solid #ffd36b;box-shadow:0 8px 0 #0006;padding:14px 16px 16px;width:min(100%,460px);max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.card h1{margin:0;font-size:clamp(26px,8vw,38px);line-height:1.05;color:#d6336c;text-shadow:3px 3px 0 #ffd36b}
.card h2{margin:0;font-size:clamp(20px,6vw,28px);color:#d6336c}
.btn{min-height:52px;min-width:132px;padding:8px 16px;border-radius:16px;background:#ff7eb6;color:#fff;font:900 20px/1.1 "Rubik",Arial;box-shadow:0 5px 0 #b3427d;border:3px solid #fff9;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 2px 0 #0003;transition:transform .07s}
.btn:active{transform:translateY(4px) scale(1.05,.9);box-shadow:0 1px 0 #b3427d}
.btn.alt{background:#4aa3df;box-shadow:0 5px 0 #26709e}

.btn.gr{background:#7bc67b;box-shadow:0 5px 0 #3f8a3f}
.btn.gr:active{box-shadow:0 1px 0 #3f8a3f}
.btn.arc{background:#8a5cf0;box-shadow:0 5px 0 #5731b3}
.btn.arc:active{box-shadow:0 1px 0 #5731b3}
.btn.sm{min-width:0;min-height:48px;font-size:17px;padding:6px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.dif button{flex:1 1 0;min-width:84px;min-height:54px;border-radius:14px;background:#fff;border:3px solid #ddd;font:800 15px/1.1 "Rubik",Arial;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .07s}
.dif button:active{transform:scale(1.05,.9)}
.dif button.sel{border-color:#ff7eb6;background:#ffe0ee;box-shadow:0 0 0 3px #ff7eb655}
.dif button b{font-size:22px}
#langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;width:100%;align-items:center}
#langs button.lg{min-width:48px;min-height:48px;border-radius:14px;background:#fff;border:3px solid #ddd;font:800 14px Rubik,Arial;color:var(--ink);padding:4px 10px}
#langs button.lg.sel{border-color:#ff7eb6;background:#ffe0ee}
#mHome{width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #ffb347;display:inline-flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 0 #0002}
.mcols{display:flex;flex-direction:column;gap:9px;width:100%;align-items:center}
.mcol{display:flex;flex-direction:column;gap:9px;width:100%;align-items:center;min-width:0}
#masc{display:flex;align-items:flex-end;justify-content:center;gap:6px;direction:ltr;height:78px}
#masc svg{animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%}
#masc .eye{transform-box:fill-box;transform-origin:center;animation:blinkEye 3.6s infinite}
#masc .yarn{font-size:34px;line-height:1;animation:yb .8s cubic-bezier(.3,0,.7,1) infinite alternate}

@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes blinkEye{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes yb{from{transform:translateY(0) rotate(0)}to{transform:translateY(-34px) rotate(200deg)}}
@keyframes wig{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.panels{display:flex;flex-direction:column;gap:8px;width:100%}
.pan{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(15px,4.4vw,19px);line-height:1.25;text-align:start;box-shadow:3px 3px 0 #0004;animation:pop .35s both}

.pan:nth-child(2){animation-delay:.25s;background:#fff1c9}.pan:nth-child(3){animation-delay:.5s;background:#dff3ff}

.grid{display:grid;gap:8px;width:100%}
.grid.lv,.grid.zoo{grid-template-columns:repeat(4,1fr)}
.lvb{min-height:68px;border-radius:14px;background:#fff;border:3px solid #ffb347;color:var(--ink);font:900 15px Rubik,Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:transform .07s}

.lvb.lock{opacity:.45;border-color:#bbb;background:#eee}
.lvb.boss{border-color:#d6336c;background:#ffe0ee}
.lvb .st{font-size:11px;letter-spacing:-1px;min-height:13px}
.lvb .em{font-size:24px;line-height:1.1}
.zc{background:#fff;border:3px solid #ffb347;border-radius:12px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;gap:2px;padding:3px}
.zc .em{font-size:32px;line-height:1.1}
.zc.no{background:#ddd;border-color:#bbb;color:#888}
.zc.no .em{filter:brightness(0) opacity(.35)}
.big{font-size:64px;line-height:1.1}
.stars{font-size:38px;letter-spacing:4px;min-height:0;direction:ltr}
.stars span{display:inline-block;animation:starPop .45s cubic-bezier(.2,1.6,.4,1) both}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes starPop{from{transform:scale(0) rotate(-140deg);opacity:0}}
.sub{font-weight:700;font-size:16px;margin:0}
.score{font:900 26px "Courier New",monospace;color:#2a1a0e;background:#ffd36b;border-radius:10px;padding:2px 14px;direction:ltr;border:3px solid #2a1a0e}
.rec{font:900 22px/1.15 "Courier New",monospace;color:#d6336c;letter-spacing:1px;animation:blink .5s steps(2) infinite;display:none;direction:ltr}
.rec small{display:block;font:900 18px Rubik,Arial;letter-spacing:0}
.rec.on{display:block}
@keyframes blink{50%{opacity:.2}}
.hi{width:100%;max-width:330px;background:#1b1230;border:3px solid #ffd36b;border-radius:12px;padding:6px 10px 8px;direction:ltr;font:700 14px/1.4 "Courier New",monospace;color:#9effa0;text-align:left;box-shadow:inset 0 0 0 2px #000a}
.hi:empty{display:none}
.hi .hd{text-align:center;color:#ffd36b;letter-spacing:1px;font-weight:900;margin-bottom:2px;font-size:13px}
.hi .r{display:flex;gap:8px;align-items:center;white-space:nowrap;padding:0 4px;border-radius:6px}
.hi .r .k{width:22px;color:#ff7eb6}.hi .r .s{flex:1;letter-spacing:2px;color:#fff}.hi .r .d{font-size:11px;opacity:.75}
.hi .r.me{background:#ffd36b40;animation:blink .6s steps(2) infinite}
.rv{overflow:hidden;padding-top:20px}
.rv>*{position:relative;z-index:1}
.rv .rays{position:absolute;z-index:0;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:repeating-conic-gradient(#ffd36b66 0 12deg,#0000 12deg 24deg);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vem{font-size:112px;line-height:1.15}
.rv.go .vem{animation:reveal 1s cubic-bezier(.2,1.5,.4,1) both}
@keyframes reveal{0%{transform:scale(0) rotate(-200deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
.vname{font:900 34px/1.1 Rubik,Arial;color:#2a1a0e;background:#ffd36b;border-radius:14px;padding:4px 18px;border:3px solid #2a1a0e}
@media (max-height:560px){.card{padding:8px 12px;gap:6px}.big{font-size:40px}.pan .em{font-size:30px}.vem{font-size:70px}}
@media (min-width:760px) and (max-height:800px){#menu .card{width:min(100%,740px)}.mcols{flex-direction:row;align-items:center;gap:16px}.mcol{flex:1 1 0}}
</style>

 const stN=G.lost===0?3:G.lost<=2?2:1,before=G.score;G.score+=100*Math.max(0,G.lives);
 if(stN>(S.stars[n]||0))S.stars[n]=stN;if(n<NLV&&n+1>S.unl)S.unl=n+1;
 const fresh=[];if(addZoo(G.def.a))fresh.push(G.def.a);let bonus=null;
 if(G.caught>=3&&G.def.b){bonus=G.def.b;if(addZoo(bonus))fresh.push(bonus)}
 const rank=recordHi(G.score,"story",G.runPrev);G.runPrev=Math.max(G.runPrev,G.score);save();
 R("levelClear",{level:n,score:G.score});R("star",{stars:stN});if(G.def.boss||n===NLV)R("win");R("score",{score:G.score});
 const fin=n===NLV,go=()=>{
  fillResult({em:aEm(G.def.a)+(bonus?" "+aEm(bonus):""),title:fin?t("finT"):t("clear"),stars:stN,txt:fin?t("fin"):aName(G.def.a)+" "+t("freed"),note:bonus?"🎁 "+aEm(bonus)+" "+aName(bonus):"",
   score:G.score,from:before,rec:fin&&rank===0,hi:fin?rank:undefined,next:fin?t("arc"):t("next"),retry:true});
  showScreen("result");if(fin)SFX.fanfare();RF();buildLevels();buildZoo()};
 if(fresh.length)showReveal(fresh,go);else go()}
function boot(){
 const dr=$("drift"),ems=["🧶","🐾","🐰","🦊","🐼","🐧","🦉","🐢","🧶","🐾","🦁","🐨"];
 dr.innerHTML=ems.map((e,i)=>`<span style="left:${(i*8.3+3)%96}%;animation-duration:${9+(i*5)%8}s;animation-delay:-${(i*2.7)%12}s;font-size:${24+(i*7)%18}px">${e}</span>`).join("");
 drawTexts();setBtns();resize();
 requestAnimationFrame(ts=>{last=ts;frame(ts)});
 if(!S.intro){mode="intro";showScreen("intro")}else{mode="menu";showScreen("menu")}
 if(window.ResizeObserver)new ResizeObserver(resize).observe(stage)}
/* ===================== TEST HOOK ===================== */
window.__breakout={
 state(){const scr=SCREENS.find(s=>$(s).classList.contains("on"))||null;
  return G?{mode,screen:scr,arcade:G.arc,wave:G.wave,level:G.n,score:G.score,lives:G.lives,lost:G.lost,state:G.state,won:G.won,bricks:G.bricks.filter(b=>b.alive).length,balls:G.balls.length,stuck:G.balls.filter(b=>b.stuck).length,
   boss:G.boss?{hp:G.boss.hp,alive:G.boss.alive,dying:G.boss.dying>0,x:G.boss.x+G.boss.w/2,y:G.boss.y+G.boss.h/2}:null,caps:G.caps.length,falls:G.falls.length,caught:G.caught,pw:Math.round(G.pw),wide:G.wide>0,slow:G.slow>0,sticky:G.sticky>0,net:G.net,px:G.px,W,H,PADY,
   ball:G.balls[0]?{x:G.balls[0].x,y:G.balls[0].y,dx:G.balls[0].dx,dy:G.balls[0].dy}:null}:{mode,screen:scr}},
 start(n,diff){if(diff&&DIF[diff]){S.diff=diff;save()}startLevel(n||1,0,0)},
 startArcade(diff,wave){if(diff&&DIF[diff]){S.diff=diff;save()}startArcade(wave)},
 launch,
 win(){if(G&&mode==="play"){clearAll();if(G.boss)G.boss.alive=false;winLevel()}},
 lose(){if(G&&mode==="play"){G.lives=1;G.balls.length=0;G.state="play";loseLife()}},
 powerup(type){if(G)applyPU(type)},
 drop(type){if(G)dropCap(G.px,PT-40,type)},
 setX(x){if(G)G.px=x},
 step(sec){const n=Math.round(sec*120);for(let i=0;i<n&&mode==="play";i++)update(STEP)},
 save(){return JSON.parse(JSON.stringify(S))},
 zoo(){try{return JSON.parse(ls.get("annabelle-retro-zoo")||"[]")}catch(e){return[]}},
 levels:NLV,layouts(){return{story:LV.map(d=>d.L),arcade:ARC}},
 setLang(l){if(TX[l]){lang=l;ls.set("annabelle-lang",l);drawTexts()}}};
boot();
</script>
