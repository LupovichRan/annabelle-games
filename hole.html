$("muteBtn").onclick=()=>{muted=!muted;ls.set("annabelle-muted",muted?"1":"0");updMute();if(!muted){ac();SFX.click()}};
function doPause(on){if(!G||G.over||!G.started)return;G.paused=on;J.on=false;if(on){$("pT").textContent=T("paused");$("resBtn").textContent=T("resume");$("pRestart").textContent=T("again");$("pMenu").textContent=T("maps");$("pause").classList.add("show")}else $("pause").classList.remove("show")}
$("pauseBtn").onclick=()=>{ac();SFX.click();doPause(true)};$("resBtn").onclick=()=>{SFX.click();doPause(false)};
$("pMenu").onclick=()=>{SFX.click();$("pause").classList.remove("show");openPicker(G?G.m:null)};
function toMenu(){document.body.classList.remove("play");G=null;["mission","over","pause","picker"].forEach(i=>$(i).classList.remove("show"));$("menu").classList.add("show");J.on=false;$("hint").textContent="";$("cap").textContent="";drawTexts()}
window.toMenu=toMenu;
function openPicker(m){ac();SFX.click();G=null;document.body.classList.remove("play");["menu","mission","over","pause"].forEach(i=>$(i).classList.remove("show"));$("picker").classList.add("show");if(m!=null)buildStages(m);else buildMaps()}
function pickBack(){SFX.click();if($("stgTiles").style.display!=="none")buildMaps();else toMenu()}
$("pkBack").onclick=pickBack;
function buildMaps(){$("pkT").textContent=T("pickMap");$("pkBack").textContent=T("back");$("mapTiles").style.display="";$("stgTiles").style.display="none";const el=$("mapTiles");el.innerHTML="";
 MAPS.forEach((M,i)=>{const b=document.createElement("button");b.className="tile"+(mapOpen(i)?"":" lock");b.style.background="linear-gradient("+M.pal.c0+","+M.pal.c1+")";b.innerHTML='<span class="ic">'+M.ic+'</span><span>'+T("maps0")[i]+'</span><span class="st">'+"★".repeat(mapStars(i))+"☆".repeat(12-mapStars(i))+"</span>";
  b.onclick=()=>{if(!mapOpen(i)){SFX.hint();return}SFX.click();buildStages(i)};el.appendChild(b)});
 $("mapTiles").querySelectorAll(".st").forEach(s=>s.style.fontSize="12px")}
function buildStages(m){mapSel=m;$("pkT").textContent=T("maps0")[m];$("mapTiles").style.display="none";const el=$("stgTiles");el.style.display="";el.innerHTML="";const sts=stagesFor(m);
 sts.forEach((st,s)=>{const b=document.createElement("button");const open=stageOpen(m,s);b.className="tile"+(open?"":" lock");const icon={size:"🕳️",collect:MAPS[m].coll?{yarn:"🧶",milk:"🥛",fish:"🐟",cupcake:"🧁",present:"🎁",shell:"🐚"}[MAPS[m].coll]:"🕳️",gold:"✨",rescue:"🐱",zone:"📍",combo:"🔥",race:"🏁"}[st.goal.type];
  b.innerHTML='<span class="ic">'+icon+'</span><span>'+T("stage")+" "+(s+1)+'</span><span class="st">'+(diff===3?"💀 "+"★".repeat(xstars(m,s))+"☆".repeat(3-xstars(m,s)):"★".repeat(stars(m,s))+"☆".repeat(3-stars(m,s)))+'</span>';b.onclick=()=>{if(!open){SFX.hint();return}SFX.click();startStage(m,s,diff)};el.appendChild(b)});
 const e=document.createElement("button");e.className="tile endl"+(stars(m,0)>0?"":" lock");e.innerHTML='<span>'+T("endless")+'</span><span class="tl">'+T("best")+": "+(SV.e[m]||0)+'</span>';e.onclick=()=>{if(stars(m,0)<=0){SFX.hint();return}SFX.click();startStage(m,-1,diff)};el.appendChild(e);$("pkBack").textContent=T("back")}
$("playBtn").onclick=()=>openPicker();
$("dailyBtn").onclick=()=>{ac();SFX.click();startStage(dailyMap(),-2,diff)};
$("musBtn").onclick=()=>{ac();musicSet(!musicOn);SFX.click()};musicSet(musicOn);
let dHT=0;document.querySelectorAll("#dRow .big").forEach(b=>b.onclick=()=>{const d=+b.dataset.d;if(d===3&&!xOK()){SFX.hint();const h=$("dHint");h.textContent=T("xLock");h.style.display="";clearTimeout(dHT);dHT=setTimeout(()=>{h.style.display="none"},4500);return}$("dHint").style.display="none";diff=d;ls.set("annabelle-hole-diff",String(diff));SFX.click();drawTexts()});
$("goBtn").onclick=begin;
function quick(m,s,df){cancelAnimationFrame(cf);{const c=$("conf");c.getContext("2d").clearRect(0,0,c.width,c.height)}startStage(m,s,df);begin();showHint("");showCap(G.goalTxt,2.6)}
$("nextBtn").onclick=()=>{SFX.click();if(G&&G.s>=0&&G.s<3)quick(G.m,G.s+1,G.df)};$("againBtn").onclick=()=>{SFX.click();if(G)quick(G.m,G.s,G.df)};
$("pRestart").onclick=()=>{SFX.click();if(G){$("pause").classList.remove("show");quick(G.m,G.s,G.df)}};$("oMenu").onclick=()=>{SFX.click();openPicker(G?G.m:null)};
document.addEventListener("click",e=>{const L=e.target.closest&&e.target.closest("[data-lang]");if(L){lang=L.dataset.lang;ls.set("annabelle-lang",lang);SFX.click();drawTexts();if($("picker").classList.contains("show"))($("stgTiles").style.display!=="none"?buildStages(mapSel):buildMaps())}});
function drawTexts(){document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";document.title=T("title");$("mT").textContent=T("title");$("mS").textContent=T("sub");$("playBtn").textContent=T("play");$("rules").textContent=T("rules");$("dailyBtn").textContent=dailyDone()?T("dailyDone")+" "+"★".repeat(SV.dd.stars||0):T("daily");
 document.querySelectorAll("#dRow .big").forEach(b=>{b.textContent=+b.dataset.d===3&&!xOK()?"🔒 "+T("d3").replace("💀 ",""):T("d"+b.dataset.d);b.classList.toggle("sel",+b.dataset.d===diff);b.classList.toggle("off",+b.dataset.d!==diff)});
 $("flags").innerHTML=[["he","עברית"],["fr","Français"],["en","English"]].map(a=>'<button class="lang '+(a[0]===lang?"sel":"")+'" data-lang="'+a[0]+'">'+a[1]+"</button>").join("");$("nglT").textContent=T("title")}
/* ================= boot ================= */
(function(){try{const t=document.createElement("canvas").getContext("2d");if(!t)throw 0}catch(e){glOK=false;$("nogl").classList.add("show")}})();
updMute();drawTexts();requestAnimationFrame(frame);
/* test hooks */
window.__hole={start:(m,s,d)=>{startStage(m,s,d==null?1:d);begin()},begin:begin,step(sec){const n=Math.ceil(sec*60);for(let i=0;i<n;i++)update(1/60);if(G)render()},get G(){return G},info(){return G&&{m:G.m,s:G.s,R:G.me.R,prog:G.prog,goal:G.goal,left:G.left,over:G.over,ok:G.ok,stars:G.stars,score:G.score,objs:G.objs.filter(o=>o.alive).length,riv:G.riv.map(r=>r.R),hz:G.hz.length,combo:G.maxCombo,paused:G.paused,zoneLeft:G.zoneLeft,tier:G.tier}},
 tp(x,y){G.me.x=x;G.me.y=y},setR(R){G.me.R2=R*R;G.me.R=R},eat(f){for(const o of G.objs)if(o.alive&&!o.sw&&(!f||f(o))){G.me.x=o.x;G.me.y=o.y;G.me.R2=Math.max(G.me.R2,(o.r+8)*(o.r+8)/.81);G.me.R=Math.sqrt(G.me.R2);update(1/60);}},SV:()=>SV,saveKey:KEY,X:()=>X,xKey:"annabelle-hole-v2",OBJ,MAPS,stagesFor,openPicker,toMenu,pickBack};
})();
</script>
</body>
</html>
