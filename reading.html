[1,'לְמִיצִי יֵשׁ כַּדּוּר אָדֹם. מִיצִי רָצָה אַחֲרֵי הַכַּדּוּר. הַכַּדּוּר נָפַל לַמַּיִם.',[['מָה הַצֶּבַע שֶׁל הַכַּדּוּר?','אָדֹם','כָּחֹל','יָרֹק'],['לְאָן נָפַל הַכַּדּוּר?','לַמַּיִם','לַסַּל','לַמִּטָּה']]],
[1,'הַגּוּר פּוּף קָטָן וְלָבָן. הוּא אוֹהֵב לִשְׁתּוֹת חָלָב. בַּלַּיְלָה הוּא יָשֵׁן בַּסַּל.',[['מָה פּוּף אוֹהֵב לִשְׁתּוֹת?','חָלָב','מִיץ','תֵּה'],['אֵיפֹה פּוּף יָשֵׁן?','בַּסַּל','בַּגַּן','עַל הָעֵץ']]],
[1,'הַדָּג שָׂט בַּיָּם. בָּא גַּל גָּדוֹל. הַדָּג קָפַץ מֵעַל הַגַּל.',[['אֵיפֹה שָׂט הַדָּג?','בַּיָּם','בַּנָּהָר','בַּכּוֹס'],['מִי קָפַץ מֵעַל הַגַּל?','הַדָּג','הַצָּב','הַסּוּס']]],
[2,'הַחֲתוּלָה שׁוֹשִׁי טִפְּסָה עַל עֵץ גָּבוֹהַּ. הִיא רָאֲתָה שָׁם קֵן שֶׁל צִפּוֹר. בַּקֵּן הָיוּ שָׁלוֹשׁ בֵּיצִים קְטַנּוֹת. שׁוֹשִׁי יָרְדָה בְּשֶׁקֶט כְּדֵי לֹא לְהַפְרִיעַ.',[['עַל מָה טִפְּסָה שׁוֹשִׁי?','עַל עֵץ','עַל גַּג','עַל הַר'],['כַּמָּה בֵּיצִים הָיוּ בַּקֵּן?','שָׁלוֹשׁ','שְׁתַּיִם','חָמֵשׁ']]],
[2,'הַכֶּלֶב בּוֹבִּי מָצָא עֶצֶם בַּגִּנָּה. הוּא חָפַר בּוֹר וְשָׂם בּוֹ אֶת הָעֶצֶם. לְמָחֳרָת הוּא שָׁכַח אֵיפֹה הַבּוֹר. בּוֹבִּי חִפֵּשׂ וְחִפֵּשׂ עַד שֶׁמָּצָא.',[['מָה מָצָא בּוֹבִּי בַּגִּנָּה?','עֶצֶם','כַּדּוּר','נַעַל'],['מָה שָׁכַח בּוֹבִּי?','אֵיפֹה הַבּוֹר','אֵיפֹה הַבַּיִת','אֵיפֹה הַמַּיִם']]],
[2,'יָרַד גֶּשֶׁם חָזָק. הָאַרְנָב רָץ מַהֵר לַמְּחִלָּה שֶׁלּוֹ. בַּמְּחִלָּה הָיָה חַם וְיָבֵשׁ. הָאַרְנָב אָכַל גֶּזֶר וְנִרְדַּם.',[['לָמָּה רָץ הָאַרְנָב לַמְּחִלָּה?','כִּי יָרַד גֶּשֶׁם','כִּי הָיָה לַיְלָה','כִּי בָּא שׁוּעָל'],['מָה אָכַל הָאַרְנָב?','גֶּזֶר','תַּפּוּחַ','לֶחֶם']]],
[3,'שלושה גורי חתולים נולדו באביב. לגור הראשון קראו שלג, כי הפרווה שלו לבנה. לשני קראו פחם, כי הוא שחור כולו. השלישי היה ג\'ינג\'י, ולכן קראו לו גזר. אמא חתולה ליקקה את שלושתם באהבה.',[['כמה גורים נולדו?','שלושה','שניים','ארבעה'],['למה קראו לגור השחור פחם?','כי הוא שחור כולו','כי הוא אוהב חום','כי הוא נולד בלילה'],['מה הצבע של גזר?','ג\'ינג\'י','לבן','אפור']]],
[3,'הצב והחילזון החליטו לערוך תחרות ריצה. שניהם הלכו לאט מאוד. אחרי שעה הם התקדמו רק מטר אחד. בסוף הם צחקו, התיישבו יחד ואכלו חסה.',[['מי השתתף בתחרות?','הצב והחילזון','הצב והארנב','החילזון והנמלה'],['מה עשו השניים בסוף?','אכלו חסה יחד','הלכו לישון','רבו זה עם זה']]],
[3,'הינשוף הצעיר פחד לעוף בלילה. אמו אמרה לו שהעיניים שלו רואות היטב בחושך. הוא פרש כנפיים וניסה. פתאום ראה את כל היער מלמעלה, והפחד נעלם.',[['ממה פחד הינשוף הצעיר?','לעוף בלילה','לאכול לבד','לשחות בנהר'],['מה ראה הינשוף מלמעלה?','את כל היער','את הים','את העיר']]],
[3,'כל בוקר החתול מוקה מחכה ליד החלון. כשהשמש מגיעה לשטיח, הוא נשכב בדיוק במקום החם. כשהשמש זזה, גם מוקה זז איתה. כך הוא מטייל בבית כל היום בלי להתאמץ.',[['היכן מחכה מוקה בבוקר?','ליד החלון','ליד הדלת','מתחת למיטה'],['מדוע מוקה זז ממקום למקום?','כי הוא עוקב אחרי השמש','כי הוא מחפש אוכל','כי מפריעים לו']]],
[4,'הנמלים גילו פירור עוגה ענקי ליד הספסל. נמלה אחת לא הצליחה להרים אותו לבדה. היא קראה לחברותיה, ויחד הן סחבו את הפירור עד הקן. מאז הן יודעות: מה שקשה לאחת, קל לרבות.',[['מה מצאו הנמלים?','פירור עוגה','גרגיר חיטה','עלה ירוק'],['מה אפשר ללמוד מהסיפור?','שיחד מצליחים יותר','שעוגה היא לא בריאה','שנמלים אוהבות לישון']]],
[4,'השועל ראה אשכול ענבים גבוה על הגפן. הוא קפץ שוב ושוב, אך לא הצליח להגיע אליו. בסוף הלך משם ואמר: ממילא הענבים האלה חמוצים. האמת היא שהוא פשוט התבייש להודות שלא הצליח.',[['מה רצה השועל?','ענבים','תפוחים','דבש'],['מדוע אמר השועל שהענבים חמוצים?','כי התבייש שלא הצליח','כי טעם אותם','כי הוא לא אוהב פירות']]],
[4,'בסתיו הסנוניות עפות לארצות חמות. הן עוברות אלפי קילומטרים בלי מפה ובלי מצפן. המדענים חושבים שהן מתמצאות בעזרת השמש, הכוכבים והשדה המגנטי של כדור הארץ. באביב הן חוזרות, לעיתים בדיוק לאותו הקן.',[['לאן עפות הסנוניות בסתיו?','לארצות חמות','לקוטב הצפוני','להרים המושלגים'],['מה עוזר לסנוניות למצוא את הדרך?','השמש והכוכבים','מפה ומצפן','ציפורים אחרות']]],
[4,'החתלתולה לונה נתקעה על ענף גבוה ולא העזה לרדת. הגורים האחרים ייללו מלמטה, אבל זה לא עזר. אז טיפסה אמא, והראתה ללונה איך יורדים לאחור, צעד אחר צעד. לונה חיקתה אותה והגיעה בשלום לקרקע.',[['מה הייתה הבעיה של לונה?','היא לא העזה לרדת מהענף','היא הלכה לאיבוד ביער','היא הייתה רעבה'],['איך ירדה לונה בסוף?','לאחור, צעד אחר צעד','בקפיצה אחת גדולה','על הגב של אמא']]]

T:[
[1,'Mimi a une balle rouge. Mimi court après la balle. La balle tombe dans l\'eau.',[['De quelle couleur est la balle ?','rouge','bleue','verte'],['Où tombe la balle ?','dans l\'eau','dans le panier','sous le lit']]],
[1,'Le chaton Flocon est petit et blanc. Il aime boire du lait. La nuit, il dort dans un panier.',[['Que boit Flocon ?','du lait','du jus','du thé'],['Où dort Flocon ?','dans un panier','dans le jardin','sur le toit']]],
[1,'Le petit poisson nage dans la mer. Une grosse vague arrive. Le poisson saute par-dessus la vague.',[['Où nage le poisson ?','dans la mer','dans un bol','dans la rivière'],['Qui saute par-dessus la vague ?','le poisson','la tortue','le canard']]],
[2,'La chatte Noisette grimpe dans un grand arbre. Là-haut, elle découvre un nid. Dans le nid, il y a trois petits œufs. Noisette redescend sans bruit pour ne pas déranger.',[['Où grimpe Noisette ?','dans un arbre','sur un toit','sur un mur'],['Combien d\'œufs y a-t-il dans le nid ?','trois','deux','cinq']]],
[2,'Le chien Biscuit trouve un os dans le jardin. Il creuse un trou et cache son os dedans. Le lendemain, il ne sait plus où est le trou. Biscuit cherche partout et finit par le retrouver.',[['Que trouve Biscuit ?','un os','une balle','une chaussure'],['Qu\'a oublié Biscuit ?','où est le trou','où est sa niche','où est sa gamelle']]],
[2,'Il pleut très fort. Le lapin file dans son terrier. Là, il fait chaud et sec. Le lapin croque une carotte et s\'endort.',[['Pourquoi le lapin file-t-il dans son terrier ?','parce qu\'il pleut','parce qu\'il fait nuit','parce qu\'un renard arrive'],['Que mange le lapin ?','une carotte','une pomme','du pain']]],
[3,'Trois chatons sont nés au printemps. Le premier s\'appelle Neige, car son pelage est tout blanc. Le deuxième s\'appelle Charbon, parce qu\'il est noir de la tête aux pattes. Le troisième est roux : on l\'a appelé Carotte. Leur maman les lèche tous les trois avec tendresse.',[['Combien de chatons sont nés ?','trois','deux','quatre'],['Pourquoi le chaton noir s\'appelle-t-il Charbon ?','à cause de sa couleur','parce qu\'il aime la chaleur','parce qu\'il est né la nuit'],['De quelle couleur est Carotte ?','roux','blanc','gris']]],
[3,'La tortue et l\'escargot décident de faire la course. Tous deux avancent tout doucement. Au bout d\'une heure, ils n\'ont parcouru qu\'un mètre. Finalement, ils éclatent de rire et partagent une feuille de salade.',[['Qui fait la course ?','la tortue et l\'escargot','la tortue et le lièvre','l\'escargot et la fourmi'],['Que font-ils à la fin ?','ils partagent une salade','ils vont dormir','ils se disputent']]],
[3,'Le jeune hibou avait peur de voler la nuit. Sa mère lui a expliqué que ses yeux voient très bien dans le noir. Alors il a ouvert ses ailes et s\'est lancé. D\'en haut, il a découvert toute la forêt, et sa peur s\'est envolée.',[['De quoi le jeune hibou avait-il peur ?','de voler la nuit','de manger seul','de nager'],['Qu\'a-t-il découvert d\'en haut ?','toute la forêt','la mer','la ville']]],
[3,'Chaque matin, le chat Moka attend près de la fenêtre. Dès que le soleil touche le tapis, il s\'allonge pile à l\'endroit chaud. Quand le soleil se déplace, Moka se déplace aussi. C\'est ainsi qu\'il fait le tour de la maison sans se fatiguer.',[['Où Moka attend-il le matin ?','près de la fenêtre','près de la porte','sous le lit'],['Pourquoi Moka change-t-il de place ?','il suit le soleil','il cherche à manger','on le dérange']]],
[4,'Les fourmis ont trouvé une énorme miette de gâteau près du banc. Une fourmi seule n\'arrivait pas à la soulever. Elle a appelé ses compagnes et, ensemble, elles l\'ont portée jusqu\'à la fourmilière. Depuis, elles le savent : ce qui est lourd pour une seule est léger pour plusieurs.',[['Qu\'ont trouvé les fourmis ?','une miette de gâteau','un grain de blé','une feuille verte'],['Quelle est la leçon de l\'histoire ?','ensemble, on est plus fort','le gâteau est mauvais pour la santé','les fourmis aiment dormir']]],
[4,'Un renard aperçoit une belle grappe de raisin, tout en haut de la vigne. Il saute encore et encore, sans jamais l\'atteindre. Il finit par s\'éloigner en grognant : « De toute façon, ces raisins sont trop verts. » En vérité, il avait surtout honte d\'avoir échoué.',[['Que voulait le renard ?','du raisin','des pommes','du miel'],['Pourquoi dit-il que les raisins sont trop verts ?','il a honte d\'avoir échoué','il les a goûtés','il n\'aime pas les fruits']]],
[4,'En automne, les hirondelles s\'envolent vers les pays chauds. Elles parcourent des milliers de kilomètres sans carte ni boussole. Les scientifiques pensent qu\'elles se guident grâce au soleil, aux étoiles et au champ magnétique de la Terre. Au printemps, elles reviennent, parfois exactement dans le même nid.',[['Où vont les hirondelles en automne ?','vers les pays chauds','vers le pôle Nord','vers les montagnes enneigées'],['Qu\'est-ce qui aide les hirondelles à s\'orienter ?','le soleil et les étoiles','une carte et une boussole','les autres oiseaux']]],
[4,'La petite chatte Luna est coincée sur une haute branche et n\'ose plus descendre. Les autres chatons miaulent d\'en bas, mais cela ne l\'aide pas. Alors sa mère grimpe et lui montre comment descendre à reculons, une patte après l\'autre. Luna l\'imite et retrouve la terre ferme, saine et sauve.',[['Quel est le problème de Luna ?','elle n\'ose pas descendre','elle s\'est perdue dans la forêt','elle a faim'],['Comment Luna descend-elle ?','à reculons, pas à pas','d\'un grand bond','sur le dos de sa mère']]]
]},

  pendT=setTimeout(()=>{if(spoke&&!CFG.fast&&Q===q&&TTS.busy()){q.waitSay=true;pendT=setTimeout(nextQ,6000)}else nextQ()},CFG.fast?20:(Q.story||Q.kind==='tiles'?1100:850))}
 else{SFX.bad();pendT=setTimeout(openTeach,CFG.fast?20:700)}}
function openTeach(){pendT=0;if(!Q||!R||R.done)return;teachOpen=true;const c=$('cTeach'),q=Q,long=Array.from(q.explain).length>26;c.textContent='';
 c.appendChild(h('p',{text:'🐱 '+t('teach')}));
 const say=q.sayAfter||(q.story?null:q.say);
 const sent=q.rung==='cloze'||q.rung==='order',ex=sent?wspans(h('div',{cls:'exp'+(long?' long':''),id:'exp'}),q.explain):h('div',{cls:'exp'+(long?' long':''),id:'exp',text:fx(q.explain)});
 c.appendChild(h('div',{cls:'teachw'},[ex,say?spkBtn(sent?q.explain:say,'tw',{kind:sent?'sentence':q.sayK||'word',els:sent?ex._w:null}):null]));
 c.appendChild(h('button',{cls:'btn g',id:'tOk',text:t('gotit'),click:()=>{gest=true;SFX.click();nextQ()}}));

function finish(){if(!R||R.done)return;R.done=true;Q=null;clearTimeout(pendT);clearTimeout(flT);closeTeach();const n=R.plan.length,pct=R.ok/Math.max(1,n),st=pct>=.85?3:pct>=.6?2:pct>=.35?1:0,p=P(),res={mode:R.mode,st:st,ok:R.ok,n:n,rung:R.rung,level:R.level};
 if(R.maxC>=3)award({event:'combo',score:R.maxC});
 if(R.mode==='ladder'){const k=R.rung+'.'+R.level,old=star(R.rung,R.level);if(st>old){p.st[k]=st;res.gain=st-old}
  if(st>0){award({event:'levelClear',level:R.rung});if(res.gain)award({event:'star',stars:res.gain,level:R.rung});if(st===3)award({event:'win',level:R.rung});track('level',{level:R.level,rung:R.rung,stars:st})}
  if(R.level===p.mx&&p.mx<4){let c=0;for(let r=1;r<=NR;r++)if(star(r,R.level)>0)c++;if(c>=6){p.mx++;p.lv=p.mx;res.lvUp=p.mx}}
  if(st===0&&R.level>1&&R.level===p.lv){p.lv=R.level-1;res.lvDown=p.lv}
  res.top=st>0&&R.rung===NR}
 else{if(pct>=.9)p.ad=clamp(p.ad+.5,-1.5,1.5);else if(pct<.5)p.ad=clamp(p.ad-.5,-1.5,1.5);
  if(R.mode==='daily'&&st>0){const td=today();if(SV.streak[1]!==td){SV.streak=[SV.streak[1]===td-1?SV.streak[0]+1:1,td];res.streakUp=true}award({event:'star',stars:st});award({event:'win'})}
  else if(st>0)award({event:'levelClear'})}
 save();track('game_end',{sec:Math.round((Date.now()-R.t0)/1000),score:R.ok,win:st>0,mode:R.mode,rung:R.rung,level:R.level});
 R.res=res;renderRes(res);flushR()}

function renderMenu(){const c=$('cMenu'),p=P();c.textContent='';const L=h('div'),Rr=h('div');

 const md=h('div',{cls:'modes'});
 md.appendChild(h('button',{cls:'mode m1',id:'bLadder','data-mode':'ladder',click:()=>{gest=true;SFX.click();openMap(false)}},[h('b',{text:'🧗'}),h('span',null,[t('mLadder'),h('small',{text:t('ladT')})])]));
 md.appendChild(h('button',{cls:'mode m2',id:'bDaily','data-mode':'daily',click:()=>{gest=true;SFX.click();startRound('daily')}},[h('b',{text:'📅'}),h('span',{text:t('mDaily')}),h('small',{text:dailyDone()?'✅ '+t('doneT'):t('mix')})]));
 md.appendChild(h('button',{cls:'mode m3',id:'bFree','data-mode':'free',click:()=>{gest=true;SFX.click();openMap(true)}},[h('b',{text:'🎯'}),h('span',{text:t('mFree')}),h('small',{text:t('mFreeS')})]));
 Rr.appendChild(md);
 Rr.appendChild(h('div',{id:'langs'},h('span',{id:'flags'},['he','fr','en'].map(l=>h('button',{cls:l===lang?'sel':'','data-lang':l,text:l==='he'?'עב':l.toUpperCase(),click:()=>{gest=true;setLang(l);SFX.click();renderMenu();hud()}})))));
 const vb=voiceBtn('bVoice');if(vb)Rr.appendChild(h('div',{id:'voiceRow'},vb));
 c.appendChild(L);c.appendChild(Rr)}
function toMenu(){clearTimeout(pendT);clearTimeout(flT);if(R)R.done=true;Q=null;TTS.stop();closeAll();$('banner').classList.remove('on');$('fx').textContent='';renderMenu();show('scMenu')}
window.toMenu=toMenu;
function openMap(free){mapFree=!!free;const p=P(),hd=$('mapHead'),g=$('lad');hd.textContent='';g.textContent='';if(!selLv||selLv>p.mx)selLv=p.lv;
 if(free)hd.appendChild(h('div',{text:'🎯 '+t('freeT')}));
 else{hd.appendChild(h('div',{text:'🧗 '+t('ladT')}));
  hd.appendChild(h('div',{id:'lvRow'},[1,2,3,4].map(k=>{const un=k<=p.mx;return h('button',{cls:'lvch'+(k===selLv?' sel':'')+(un?'':' lock'),'data-lv':k,'aria-label':t('lvl')+' '+k,click:()=>{gest=true;if(!un){SFX.bad();pop('🔒');banner(t('lockedLv'));return}SFX.click();selLv=k;openMap(false)}},[h('span',{text:t('lvl')+' '+k}),h('small',{text:un?'⭐ '+lvStars(k)+'/'+NR*3:'🔒'})])})))}
 let top=0;for(let r=1;r<=NR;r++)if(rungOpen(r,selLv))top=r;else break;let curEl=null;
 for(let r=NR;r>=1;r--){const un=free||rungOpen(r,selLv),st=free?0:star(r,selLv),isCur=!free&&r===top;
  const kids=[h('span',{cls:'no',text:String(r)}),h('b',{text:RI[r-1][0]}),h('span',{cls:'nm',text:rname(r)})];
  if(isCur)kids.push(h('span',{cls:'cat',text:'🐱'}));
  if(!free)kids.push(h('i',null,un?['★'.repeat(st),h('u',{text:'★'.repeat(3-st)})]:['🔒']));
  const b=h('button',{cls:'rg'+(!un?' lock':st?' done':'')+(isCur?' cur':''),'data-rung':r,'aria-label':t('rung')+' '+r+': '+rname(r),click:()=>{gest=true;if(!un){SFX.bad();pop('🔒');banner(t('locked'));return}SFX.click();startRound(free?'free':'ladder',r,selLv)}},kids);
  if(isCur)curEl=b;g.appendChild(b)}
 show('scMap');const w=$('ladWrap');w.scrollTop=0;if(curEl){const a=curEl.offsetTop-w.offsetTop-(w.clientHeight-curEl.offsetHeight)/2;w.scrollTop=Math.max(0,a)}}
function renderRes(res){const c=$('cRes'),st=res.st,lad=res.mode==='ladder';c.textContent='';let next=0;
 c.appendChild(h('div',{cls:'huge',text:st<=0?'💪':res.top?'🏆':res.mode==='daily'?'📅':lad?RI[res.rung-1][0]:'🎯'}));
 c.appendChild(h('h2',{id:'rT',text:t('r'+Math.max(0,st))}));
 const sr=h('div',{cls:'stars',id:'rStars'});for(let i=0;i<3;i++){const s=h('span',{cls:i<st?'':'off',text:'⭐'});s.style.animationDelay=(.25+i*.3)+'s';sr.appendChild(s);if(i<st)setTimeout(()=>SFX.star(i),250+i*300)}c.appendChild(sr);
 c.appendChild(h('p',{id:'rOf',text:t('of',{a:res.ok,b:res.n})+(lad?' · '+t('lvl')+' '+res.level:'')}));
 if(res.mode==='daily'&&st>0){c.appendChild(h('p',{text:t('dailyDone')}));c.appendChild(h('p',{text:'🔥 '+(streakNow()>1?t('streak',{n:streakNow()}):'1')}))}
 if(res.lvUp)c.appendChild(h('p',{id:'rUp',text:'🎉 '+t('lvUp',{n:res.lvUp})}));
 else if(res.top)c.appendChild(h('p',{text:'🐱 '+t('top')}));
 if(res.lvDown)c.appendChild(h('p',{id:'rDown',text:'🐾 '+t('lvDown',{n:res.lvDown})}));
 if(st>0)setTimeout(()=>{SFX.win();confetti()},350);
 if(lad&&st>0&&res.rung<NR)next=res.rung+1;
 if(next)c.appendChild(h('button',{cls:'btn g',id:'rNext',text:t('next'),click:()=>{SFX.click();startRound('ladder',next,res.level)}}));
 c.appendChild(h('button',{cls:'btn'+(next?' w':' g'),id:'rAgain',text:'↻ '+t('again'),click:()=>{SFX.click();startRound(res.mode,res.rung||1,res.lvDown||res.level)}}));
 if(res.mode!=='daily')c.appendChild(h('button',{cls:'btn w',id:'rMap',text:(lad?'🧗 ':'🎯 ')+(lad?t('ladder'):t('mFree')),click:()=>{SFX.click();closeAll();selLv=lad?(res.lvUp||res.lvDown||res.level):selLv;openMap(!lad)}}));
 c.appendChild(h('button',{cls:'btn w',id:'rMenu',text:'☰ '+t('menu'),click:()=>{SFX.click();toMenu()}}));
 $('ovRes').classList.add('on')}
function pause(){if(!R||R.done||R.paused||cur!=='scPlay')return;R.paused=true;TTS.stop();const c=$('cPause');c.textContent='';c.appendChild(h('h2',{text:'⏸ '+t('paused')}));
 c.appendChild(h('button',{cls:'btn g',id:'pRes',text:'▶ '+t('resume'),click:()=>{SFX.click();resume()}}));c.appendChild(h('button',{cls:'btn w',id:'pQuit',text:'☰ '+t('quit'),click:()=>{SFX.click();toMenu()}}));{const vb=voiceBtn('pVoice');if(vb)c.appendChild(h('div',{id:'voiceRow'},vb))}c.appendChild(h('div',{id:'navSlot'}));$('ovPause').classList.add('on')}

/* ---- input ---- */
$('bBack').onclick=()=>{gest=true;SFX.click();if(cur==='scPlay')pause();else toMenu()};

$('bMute').onclick=()=>{gest=true;muted=!muted;ls.set('annabelle-muted',muted?'1':'0');applyMute();SFX.click()};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{gest=true},true));
document.addEventListener('visibilitychange',()=>{if(document.hidden){TTS.stop();pause()}});
addEventListener('pagehide',()=>TTS.stop());
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
 if(k==='Escape'){if(R&&R.paused)resume();else if(cur==='scPlay')pause();return}
 if($('ovRes').classList.contains('on')||$('ovPause').classList.contains('on'))return;
 if(teachOpen){if(k==='Enter'||k===' '){e.preventDefault();nextQ()}return}
 if(cur!=='scPlay'||!Q||Q.done)return;
 if(Q.kind==='choice'){const n=+k;if(n>=1&&n<=Q.opts.length){e.preventDefault();choose(n-1)}}
 else if(Q.kind==='tiles'){const n=+k;if(n>=1&&n<=Q.tileEls.length){e.preventDefault();tapTile(Q.tileEls[n-1])}}});

/* ---- test hook ---- */
function flushPend(){if(teachOpen||pendT)nextQ()}
function pub(q){if(!q)return null;const o={};['rung','n','skill','variant','level','lang','kind','ask','emoji','big','text','pre','post','story','question','opts','correct','units','tiles','join','answer','explain','say','sayAfter','sayK','flash','key'].forEach(k=>{if(q[k]!==undefined)o[k]=Array.isArray(q[k])?q[k].slice():q[k]});
 if(q.kind==='tiles'&&q.tileEls){const used={};o.order=q.units.map(u=>{for(let i=0;i<q.tiles.length;i++)if(!used[i]&&q.tiles[i]===u){used[i]=1;return i}return -1});o.pos=q.pos}o.done=!!q.done;return o}
window.__reading={
 state(){const p=P();return{screen:cur,lang:lang,mode:R?R.mode:null,rung:R?R.rung:0,level:R?R.level:0,itemLevel:R&&!R.done?itemLevel():0,i:R?R.i:0,total:R?R.plan.length:0,ok:R?R.ok:0,done:R?R.done:true,paused:R?R.paused:false,teach:teachOpen,res:R?R.res||null:null,
  lv:p.lv,mx:p.mx,ad:p.ad,start:startLevel(),stars:JSON.parse(JSON.stringify(p.st)),starsAll:starsAll(),streak:SV.streak.slice(),dailyDone:dailyDone(),tts:TTS.ok,ttsOn:TTS.on(),said:TTS.log,muted:muted}},
 voc:NK,
 gen(rung,level,lang2,hint){return pub(C.gen(rung,level,lang2||lang,hint))},
 item(){return pub(Q)},
 answer(i){flushPend();if(!Q||Q.done||!R||R.done)return false;if(Q.kind==='choice'){if(Q.flash&&!Q.hidden)hideFlash();choose(i==null?Q.correct:i)}else{tapTile(Q.tileEls[i==null?pub(Q).order[Q.pos]:i])}return true},
 start(mode,rung,level){gest=true;startRound(mode,rung,level);return true},
 next(){flushPend()},
 win(){let g=0;while(R&&!R.done&&g++<400){flushPend();if(!R||R.done)break;this.answer()}flushPend();return R?R.res:null},
 pause:pause,resume:resume,toMenu:toMenu,openMap:openMap,setLang(l){setLang(l);renderMenu();hud()},
 cfg(o){for(const k in o)CFG[k]=o[k];refreshSpk();return CFG},
 save(){return SV},reload(){SV=load();selLv=0;renderMenu()},core:C};
