<!--
  KITTY CITY (city.html) – a kind life / money simulator. Play coins only: no real money, no purchases, no ads, no links out.
  The job is PLAYING GAMES: on every open the page compares AnnabelleRewards.get().stats (plays / wins per game id) with its own
  snapshot and pays a salary for what was played since (read-only: this page never writes the rewards save, it only calls
  AnnabelleRewards.award({game:'city',...}) for goals, the same way mathquest.html does).

  SAVE FORMAT – localStorage 'annabelle-city' (per profile, like every annabelle-* save; other pages may READ it):
  { v:1, seed, day (city day, 1..), real:'YYYY-MM-DD' (last real day a city day passed), skips:{d,n} ("next day" presses today),
    cash, sav (integer coins), savF (interest fraction 0..9999), auto (0|10|20|30 % of salary auto-saved), score (trust 0..100),
    job:{init, snap:{p:{game:plays}, w:{game:wins}}, worked (paid plays ever -> career), date, mult, used, usedW, by, byW (daily caps),
         slips:[{d,p,l,w,g,t,s,r,n,o,m}] (day, plays, learning plays, wins, gross, tax, auto-saved, loan catch-up, net, over cap, pay %)},
    home:{id 0..6, own, miss, dep}, mort:null|{bal,rate (per 10000 per day),pay,orig,int,miss,day}, loan:null|{same},
    px:{assetId:[prices in hundredths of a coin, last 60 days]}, pf:{assetId:{q,c (cost)}},
    own:{itemId: city day bought}, slots:[itemId|''] x16 (home view), hat, car,
    goals:{goalId: day reached}, tips:{tipId:1}, tx:[{d,k,a,b,x?}] (day, kind, amount, cash balance after, item) last 150,
    nw:[net worth per day, last 90], st:{slips,bought,sold,trades,divs,loansDone,mortDone,cashHome,earned,taxes,interest,bizInc,divInc},
    sum:{nw, cash, lvl (career 0..5), home, own, day}   <- the small READ API for other pages (launcher tile, album...) }
  Everything is validated on load (Eng.sane): numbers finite + clamped, money is integer coins >= 0, unknown ids dropped.
  Tests: window.__city = {state(), pay(), nextDay(), buy(id), act(name,args), go(screen)};  window.__cityToday = 'YYYY-MM-DD' overrides the date.

function fin(x){return typeof x==='number'&&isFinite(x)}
function ci(x,lo,hi,d){if(typeof x!=='number')x=typeof x==='string'&&x!==''?Number(x):NaN;if(!isFinite(x))return d===undefined?lo:d;x=Math.round(x);return x<lo?lo:x>hi?hi:x}
function isObj(o){return !!o&&typeof o==='object'&&!Array.isArray(o)}
function has(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
const GID=/^[a-z0-9_-]{1,40}$/i,DATE=/^\d{4}-\d{2}-\d{2}$/;
function rnd(seed,day,i){let t=(seed^Math.imul(day+7919,0x9E3779B1)^Math.imul(i+1,0x85EBCA6B))>>>0;return function(){t=(t+0x6D2B79F5)>>>0;let r=Math.imul(t^t>>>15,1|t);r=(r+Math.imul(r^r>>>7,61|r))^r;return((r^r>>>14)>>>0)/4294967296}}
function dayDiff(a,b){if(!DATE.test(a)||!DATE.test(b))return 1;const p=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));const d=Math.round((p(b)-p(a))/864e5);return fin(d)?d:1}

 const S=fresh(isObj(o)&&fin(o.seed)?o.seed:seed);if(!isObj(o))return S;

 if(isObj(o.skips)){S.skips.d=typeof o.skips.d==='string'&&DATE.test(o.skips.d)?o.skips.d:'';S.skips.n=ci(o.skips.n,0,99,0)}
 S.cash=ci(o.cash,0,M,0);S.sav=ci(o.sav,0,M,0);S.savF=ci(o.savF,0,9999,0);S.auto=[0,10,20,30].indexOf(o.auto)>=0?o.auto:0;S.score=ci(o.score,0,100,50);
 const J=isObj(o.job)?o.job:{},j=S.job;j.init=J.init?1:0;j.worked=ci(J.worked,0,1e7,0);j.date=typeof J.date==='string'&&DATE.test(J.date)?J.date:'';j.mult=ci(J.mult,1,CFG.CARRY,1);
 j.used=ci(J.used,0,1e4,0);j.usedW=ci(J.usedW,0,1e4,0);
 const cmap=(src,max)=>{const out={};let n=0;if(isObj(src))for(const k in src)if(has(src,k)&&GID.test(k)&&!(k in Object.prototype)&&fin(src[k])&&n++<300)out[k]=ci(src[k],0,max,0);return out};
 if(isObj(J.snap)){j.snap.p=cmap(J.snap.p,1e9);j.snap.w=cmap(J.snap.w,1e9)}j.by=cmap(J.by,1e4);j.byW=cmap(J.byW,1e4);
 if(Array.isArray(J.slips))j.slips=J.slips.filter(isObj).slice(-30).map(s=>({d:ci(s.d,1,1e6,1),p:ci(s.p,0,999,0),l:ci(s.l,0,999,0),w:ci(s.w,0,999,0),g:ci(s.g,0,M,0),t:ci(s.t,0,M,0),s:ci(s.s,0,M,0),r:ci(s.r,0,M,0),n:ci(s.n,0,M,0),o:ci(s.o,0,9999,0),m:ci(s.m,100,1000,100)}));
 const H=isObj(o.home)?o.home:{};S.home.id=ci(H.id,0,HOMES.length-1,0);S.home.own=!!H.own&&S.home.id>0;S.home.miss=ci(H.miss,0,CFG.GRACE,0);S.home.dep=S.home.own?0:ci(H.dep,0,HOMES[S.home.id].dep,0);
 const debt=(d,maxBal,rlo,rhi)=>{if(!isObj(d))return null;const bal=ci(d.bal,0,maxBal,0);if(bal<=0)return null;const rate=ci(d.rate,rlo,rhi,rlo),minPay=Math.round(bal*rate/10000)+1;
  return {bal:bal,rate:rate,pay:ci(d.pay,minPay,bal+minPay,minPay),orig:ci(d.orig,bal,M,bal),int:ci(d.int,0,M,0),miss:ci(d.miss,0,99,0),day:ci(d.day,1,1e6,1)}};
 S.mort=S.home.own?debt(o.mort,HOMES[S.home.id].price,10,100):null;if(S.mort)S.mort.miss=Math.min(S.mort.miss,CFG.GRACE-1);
 S.loan=debt(o.loan,CAREER[CAREER.length-1].loan*2,20,300);
 if(isObj(o.px)){let ok=true;const px={};ASSETS.forEach(A=>{const a=o.px[A.id];if(!Array.isArray(a)||!a.length||a.length>CFG.HIST||!a.every(v=>fin(v)&&v>=1&&v<=1e9&&v===Math.round(v)))ok=false;else px[A.id]=a.slice()});if(ok)S.px=px}
 if(isObj(o.pf))ASSETS.forEach(A=>{const p=o.pf[A.id];if(isObj(p)){const q=ci(p.q,0,1e6,0);if(q>0)S.pf[A.id]={q:q,c:ci(p.c,0,M,0)}}});
 if(isObj(o.own))ITEMS.forEach(i=>{if(has(o.own,i.id)&&fin(o.own[i.id]))S.own[i.id]=ci(o.own[i.id],1,1e6,1)});
 if(Array.isArray(o.slots)){const seen={},cap=HOMES[S.home.id].slots;for(let i=0;i<16;i++){const id=o.slots[i];if(i<cap&&typeof id==='string'&&has(IT,id)&&PLACE[IT[id].cat]&&S.own[id]!==undefined&&!seen[id]){S.slots[i]=id;seen[id]=1}}}
 S.hat=typeof o.hat==='string'&&has(IT,o.hat)&&IT[o.hat].cat==='hat'&&S.own[o.hat]!==undefined?o.hat:'';
 S.car=typeof o.car==='string'&&has(IT,o.car)&&IT[o.car].cat==='car'&&S.own[o.car]!==undefined?o.car:'';
 if(isObj(o.goals))GOALS.forEach(g=>{if(has(o.goals,g.id)&&fin(o.goals[g.id]))S.goals[g.id]=ci(o.goals[g.id],1,1e6,1)});
 if(isObj(o.tips))for(const k in o.tips)if(has(o.tips,k)&&/^[a-z]{1,12}$/.test(k))S.tips[k]=1;
 if(Array.isArray(o.tx))S.tx=o.tx.filter(isObj).slice(-CFG.TXMAX).map(x=>{const r={d:ci(x.d,1,1e6,1),k:typeof x.k==='string'&&/^[a-z]{1,8}$/.test(x.k)?x.k:'misc',a:ci(x.a,-M,M,0),b:ci(x.b,0,M,0)};if(typeof x.x==='string'&&/^[a-z0-9]{1,12}$/.test(x.x))r.x=x.x;return r});
 if(Array.isArray(o.nw))S.nw=o.nw.filter(fin).slice(-90).map(v=>ci(v,-M,M*4,0));
 if(isObj(o.st))for(const k in S.st)S.st[k]=ci(o.st[k],0,M,0);
 summary(S);return S}

function career(S){let l=0;for(let i=0;i<CAREER.length;i++)if(S.job.worked>=CAREER[i].at)l=i;return l}
function placed(S){let n=0;const cap=HOMES[S.home.id].slots;for(let i=0;i<cap;i++)if(S.slots[i])n++;return n}
function held(S){let n=0;for(const k in S.pf)if(S.pf[k].q>0)n++;return n}
function price(S,id){const h=S.px[id];return h[h.length-1]}
function tx(S,k,a,x){const r={d:S.day,k:k,a:a,b:S.cash};if(x)r.x=x;S.tx.push(r);if(S.tx.length>CFG.TXMAX)S.tx.splice(0,S.tx.length-CFG.TXMAX)}
function add(S,n){S.cash=Math.min(CFG.MAXM,S.cash+Math.max(0,Math.round(n)))}
function bump(S,n){S.score=Math.max(0,Math.min(100,S.score+n))}

/* ---------- market ---------- */
function stepMarket(S,d){
 let sum=0,n=0;
 ASSETS.forEach((A,i)=>{if(A.kind==='index')return;const h=S.px[A.id];let p=h[h.length-1];
  if(A.kind==='bond')p=Math.round(p*(1+A.drift/10000));
  else{const r=rnd(S.seed,d,i),z=(r()+r()+r()-1.5)*2,trend=A.base*100*Math.pow(1+A.drift/10000,d);
   const ret=A.drift/10000+A.vol/10000*z+0.025*Math.log(trend/p);
   p=Math.round(p*Math.exp(ret));p=Math.max(Math.round(trend*.3),Math.min(Math.round(trend*3.5),p));sum+=p/(A.base*100);n++}
  if(!fin(p)||p<1)p=A.base*100;p=Math.min(p,1e9);
  h.push(p);if(h.length>CFG.HIST)h.shift()});
 const ih=S.px.idx;let ip=Math.round(10000*sum/Math.max(1,n));if(!fin(ip)||ip<1)ip=10000;ih.push(Math.min(ip,1e9));if(ih.length>CFG.HIST)ih.shift()}
function pfValue(S){let v=0;for(const k in S.pf)v+=Math.floor(S.pf[k].q*price(S,k)/100);return v}
function invBuy(S,id,q){if(!has(AS,id))return {ok:false,err:'bad'};q=ci(q,0,1e6,0);if(q<1)return {ok:false,err:'bad'};
 const cost=Math.ceil(q*price(S,id)/100);if(cost>S.cash)return {ok:false,err:'cash',need:cost-S.cash};
 const p=S.pf[id]||(S.pf[id]={q:0,c:0});if(p.q+q>1e6)return {ok:false,err:'bad'};S.cash-=cost;p.q+=q;p.c+=cost;S.st.trades++;tx(S,'inv',-cost,id);return {ok:true,cost:cost,q:q}}
function invSell(S,id,q){const p=S.pf[id];q=ci(q,0,1e6,0);if(!p||q<1||q>p.q)return {ok:false,err:'bad'};
 const got=Math.floor(q*price(S,id)/100),c=Math.round(p.c*q/p.q);p.q-=q;p.c-=c;if(p.q<=0)delete S.pf[id];add(S,got);S.st.trades++;tx(S,'invs',got,id);return {ok:true,got:got,gain:got-c,q:q}}

/* ---------- debts: fixed daily payment, interest on what is still owed ---------- */
function annuity(P,bp,n){const r=bp/10000;return Math.max(Math.round(P*r)+1,Math.ceil(P*r/(1-Math.pow(1+r,-n))))}
function sched(bal,bp,pay){const out=[];let g=0;while(bal>0&&g++<500){const it=Math.round(bal*bp/10000);let p=Math.min(pay,bal+it),pr=p-it;if(pr<1)pr=1;bal-=pr;out.push([it,pr])}return out}
function quote(P,bp,n){const pay=annuity(P,bp,n),sc=sched(P,bp,pay);let it=0;sc.forEach(r=>it+=r[0]);return {amt:P,rate:bp,pay:pay,n:sc.length,interest:it,total:P+it,sched:sc}}
function mortRate(S){return S.score>=70?30:S.score>=40?40:50}
function loanRate(S){return S.score>=70?80:S.score>=40?100:120}
function loanLimit(S){const b=CAREER[career(S)].loan;return Math.round(b*(S.score>=70?1.25:S.score>=40?1:.5)/10)*10}
function loanQuote(S,amt,term){return quote(amt,loanRate(S),term)}
function mortQuote(S,hid,down,term){const P=HOMES[hid].price,dn=Math.ceil(P*down/100),q=quote(P-dn,mortRate(S),term);q.down=dn;q.price=P;return q}
function loanTake(S,amt,term){amt=ci(amt,0,1e6,0);if(S.loan)return {ok:false,err:'has'};if(LTERMS.indexOf(term)<0||amt<20||amt>loanLimit(S))return {ok:false,err:'bad'};
 const q=loanQuote(S,amt,term);S.loan={bal:amt,rate:q.rate,pay:q.pay,orig:amt,int:0,miss:0,day:S.day};add(S,amt);tx(S,'loan',amt);return {ok:true,q:q}}
function payDebt(S,key,p){/* one scheduled payment already taken from the kid: split it */const m=S[key],it=Math.round(m.bal*m.rate/10000);let pr=p-it;if(pr<1)pr=1;m.bal-=pr;m.int+=it;if(m.bal<=0){S[key]=null;return true}return false}
function due(S,key){const m=S[key];if(!m)return 0;return Math.min(m.pay,m.bal+Math.round(m.bal*m.rate/10000))}
function loanRepay(S,amt){const l=S.loan;if(!l)return {ok:false,err:'bad'};amt=Math.min(ci(amt,0,1e9,0),l.bal,S.cash);if(amt<1)return {ok:false,err:'cash'};
 S.cash-=amt;l.bal-=amt;tx(S,'loanp',-amt);let done=false;if(l.bal<=0){S.loan=null;S.st.loansDone++;bump(S,10);done=true}else l.miss=0;return {ok:true,paid:amt,done:done}}
function mortExtra(S,amt){const m=S.mort;if(!m)return {ok:false,err:'bad'};amt=Math.min(ci(amt,0,1e9,0),m.bal,S.cash);if(amt<1)return {ok:false,err:'cash'};
 S.cash-=amt;m.bal-=amt;tx(S,'mortx',-amt);let done=false;if(m.bal<=0){S.mort=null;S.st.mortDone++;bump(S,10);done=true}else m.miss=0;return {ok:true,paid:amt,done:done}}

/* ---------- housing ---------- */
function moveTo(S,id,own,dep){S.home={id:id,own:!!own,miss:0,dep:dep||0};const cap=HOMES[id].slots;for(let i=cap;i<16;i++)S.slots[i]=''}
function homeEquity(S){if(!S.home.own)return S.home.dep;return Math.max(0,HOMES[S.home.id].price-(S.mort?S.mort.bal:0))}
function leaveValue(S){/* what the kid gets back when moving out now */if(!S.home.own)return S.home.dep;const P=HOMES[S.home.id].price;return Math.max(0,P-Math.floor(P*CFG.SELL_FEE/100)-(S.mort?S.mort.bal:0))}
function leave(S){const back=leaveValue(S);if(S.home.own){S.mort=null;/* never leaves a debt behind */if(back>0){add(S,back);tx(S,'homes',back,'h'+S.home.id)}}
 else if(back>0){add(S,back);tx(S,'depb',back)}return back}
function rentHome(S,id){const H=HOMES[id];if(!H||(!H.rent)||(S.home.id===id&&!S.home.own))return {ok:false,err:'bad'};
 const back=leaveValue(S);if(S.cash+back<H.dep)return {ok:false,err:'cash',need:H.dep-S.cash-back};
 leave(S);S.cash-=H.dep;if(H.dep)tx(S,'dep',-H.dep,'h'+id);moveTo(S,id,false,H.dep);return {ok:true,back:back}}
function buyHome(S,id,down,term){const H=HOMES[id];if(!H||!H.price||(S.home.id===id&&S.home.own))return {ok:false,err:'bad'};
 const back=leaveValue(S);
 if(!term){if(S.cash+back<H.price)return {ok:false,err:'cash',need:H.price-S.cash-back};leave(S);S.cash-=H.price;tx(S,'home',-H.price,'h'+id);moveTo(S,id,true);S.st.cashHome++;return {ok:true,back:back}}
 if(DOWNS.indexOf(down)<0||MTERMS.indexOf(term)<0)return {ok:false,err:'bad'};
 const q=mortQuote(S,id,down,term);if(S.cash+back<q.down)return {ok:false,err:'cash',need:q.down-S.cash-back};
 leave(S);S.cash-=q.down;tx(S,'down',-q.down,'h'+id);moveTo(S,id,true);S.mort={bal:q.amt,rate:q.rate,pay:q.pay,orig:q.amt,int:0,miss:0,day:S.day};return {ok:true,q:q,back:back}}

/* ---------- shop ---------- */
function itemValue(S,id){const it=IT[id];if(!it||S.own[id]===undefined)return 0;let pct=RES[it.cat];if(it.cat==='car')pct=Math.max(40,80-2*Math.max(0,S.day-S.own[id]));return Math.floor(it.price*pct/100)}
function buyItem(S,id){if(!has(IT,id))return {ok:false,err:'bad'};const it=IT[id];if(S.own[id]!==undefined)return {ok:false,err:'has'};if(S.cash<it.price)return {ok:false,err:'cash',need:it.price-S.cash};
 S.cash-=it.price;S.own[id]=S.day;S.st.bought++;tx(S,'buy',-it.price,id);
 if(PLACE[it.cat]){const cap=HOMES[S.home.id].slots;for(let i=0;i<cap;i++)if(!S.slots[i]){S.slots[i]=id;break}}
 if(it.cat==='hat'&&!S.hat)S.hat=id;if(it.cat==='car')S.car=id;return {ok:true,price:it.price}}
function sellItem(S,id){if(!has(IT,id)||S.own[id]===undefined)return {ok:false,err:'bad'};if(IT[id].cat==='pet')return {ok:false,err:'pet'};
 const v=itemValue(S,id);delete S.own[id];for(let i=0;i<16;i++)if(S.slots[i]===id)S.slots[i]='';if(S.hat===id)S.hat='';
 if(S.car===id){S.car='';ITEMS.forEach(i=>{if(i.cat==='car'&&S.own[i.id]!==undefined)S.car=i.id})}
 add(S,v);S.st.sold++;tx(S,'sell',v,id);return {ok:true,got:v,loss:IT[id].price-v}}
function place(S,slot,id){slot=ci(slot,0,15,0);if(slot>=HOMES[S.home.id].slots)return {ok:false,err:'bad'};
 if(!id){S.slots[slot]='';return {ok:true}}if(!has(IT,id)||!PLACE[IT[id].cat]||S.own[id]===undefined)return {ok:false,err:'bad'};
 for(let i=0;i<16;i++)if(S.slots[i]===id)S.slots[i]='';S.slots[slot]=id;return {ok:true}}
function wear(S,id){if(!id){S.hat='';return {ok:true}}if(!has(IT,id)||S.own[id]===undefined)return {ok:false,err:'bad'};
 if(IT[id].cat==='hat')S.hat=S.hat===id?'':id;else if(IT[id].cat==='car')S.car=id;else return {ok:false,err:'bad'};return {ok:true}}
function bizIncome(S){let n=0;ITEMS.forEach(i=>{if(i.inc&&S.own[i.id]!==undefined)n+=i.inc});return n}
function itemsValue(S){let v=0;for(const id in S.own)v+=itemValue(S,id);return v}

/* ---------- bank ---------- */
function deposit(S,amt){amt=Math.min(ci(amt,0,1e9,0),S.cash);if(amt<1)return {ok:false,err:'cash'};S.cash-=amt;S.sav=Math.min(CFG.MAXM,S.sav+amt);tx(S,'savin',-amt);return {ok:true,amt:amt}}
function withdraw(S,amt){amt=Math.min(ci(amt,0,1e9,0),S.sav);if(amt<1)return {ok:false,err:'cash'};S.sav-=amt;add(S,amt);tx(S,'savout',amt);return {ok:true,amt:amt}}
function setAuto(S,p){if([0,10,20,30].indexOf(p)<0)return {ok:false,err:'bad'};S.auto=p;return {ok:true}}
function grow(amount,days){/* savings projection with daily compounding */let a=amount,f=0;const out=[a];for(let d=0;d<days;d++){const acc=f+a*CFG.SAV_BP;a+=Math.floor(acc/10000);f=acc%10000;out.push(a)}return out}
function netWorth(S){return S.cash+S.sav+pfValue(S)+homeEquity(S)+itemsValue(S)-(S.loan?S.loan.bal:0)}
function breakdown(S){return {cash:S.cash,sav:S.sav,inv:pfValue(S),home:homeEquity(S),items:itemsValue(S),loan:S.loan?S.loan.bal:0,mort:S.mort?S.mort.bal:0}}
function summary(S){S.sum={nw:netWorth(S),cash:S.cash,lvl:career(S),home:S.home.id,own:S.home.own?1:0,day:S.day}}

/* ---------- the job: salary for games played since the last visit ---------- */
function pay(S,stats,today){
 const J=S.job,P=isObj(stats)&&isObj(stats.plays)?stats.plays:{},W=isObj(stats)&&isObj(stats.wins)?stats.wins:{};
 const val=(o,g)=>has(o,g)&&fin(o[g])?ci(o[g],0,1e9,0):0;
 const games=[];for(const g in P)if(has(P,g)&&GID.test(g)&&g!=='city'&&g!=='misc'&&!(g in Object.prototype))games.push(g);
 for(const g in W)if(has(W,g)&&GID.test(g)&&g!=='city'&&g!=='misc'&&!(g in Object.prototype)&&games.indexOf(g)<0)games.push(g);
 games.sort((a,b)=>(LEARN[b]|0)-(LEARN[a]|0)||(a<b?-1:1));
 const snapNow=()=>{const p={},w={};games.slice(0,300).forEach(g=>{p[g]=val(P,g);w[g]=val(W,g)});J.snap={p:p,w:w}};
 if(!DATE.test(today))today='2000-01-01';
 if(!J.init){J.init=1;snapNow();J.date=today;J.mult=1;add(S,CFG.GIFT);tx(S,'gift',CFG.GIFT);summary(S);return {gift:CFG.GIFT}}
 if(J.date!==today){J.mult=Math.max(1,Math.min(CFG.CARRY,dayDiff(J.date,today)));J.date=today;J.used=0;J.usedW=0;J.by={};J.byW={}}
 let np=0,nl=0,nw=0,over=0;const capD=CFG.CAP_DAY*J.mult,capG=CFG.CAP_GAME*J.mult;
 games.forEach(g=>{
  const dp=Math.max(0,val(P,g)-(J.snap.p[g]|0)),dw=Math.max(0,val(W,g)-(J.snap.w[g]|0));
  const ap=Math.max(0,Math.min(dp,capG-(J.by[g]|0),capD-J.used)),aw=Math.max(0,Math.min(dw,capG-(J.byW[g]|0),capD-J.usedW));
  if(ap){J.by[g]=(J.by[g]|0)+ap;J.used+=ap;if(LEARN[g])nl+=ap;else np+=ap}
  if(aw){J.byW[g]=(J.byW[g]|0)+aw;J.usedW+=aw;nw+=aw}
  over+=dp-ap});
 snapNow();
 if(np+nl+nw===0)return over>0?{rest:over}:null;
 const lvl0=career(S),mult=CAREER[lvl0].mult;
 const gross=Math.round((np*CFG.PLAY+nl*CFG.LEARN+nw*CFG.WIN)*mult/100),tax=Math.floor(gross*CFG.TAX/100);let left=gross-tax,rep=0;
 if(S.loan&&S.loan.miss>=CFG.GRACE){rep=Math.min(S.loan.bal,Math.floor(left*CFG.GARN/100));left-=rep;S.loan.bal-=rep;if(S.loan.bal<=0){S.loan=null;S.st.loansDone++}}
 const sv=Math.floor(left*S.auto/100),net=left-sv;S.sav=Math.min(CFG.MAXM,S.sav+sv);add(S,net);
 J.worked+=np+nl;S.st.slips++;S.st.earned=Math.min(CFG.MAXM,S.st.earned+gross);S.st.taxes=Math.min(CFG.MAXM,S.st.taxes+tax);
 const slip={d:S.day,p:np,l:nl,w:nw,g:gross,t:tax,s:sv,r:rep,n:net,o:over,m:mult};J.slips.push(slip);if(J.slips.length>30)J.slips.shift();
 tx(S,'sal',net);const lvl1=career(S);summary(S);
 return Object.assign({lvlUp:lvl1>lvl0?lvl1:0},slip)}
function avgPay(S){const s=S.job.slips.slice(-5);if(!s.length)return 0;let t=0;s.forEach(x=>t+=x.n);return Math.round(t/s.length)}

/* ---------- a new city day ---------- */
function bills(S){const H=HOMES[S.home.id];return {home:S.home.own?due(S,'mort'):H.rent,loan:due(S,'loan'),own:S.home.own}}
function billTotal(S){const b=bills(S);return b.home+b.loan}
function payBill(S,amt){if(S.cash>=amt){S.cash-=amt;return 1}if(S.cash+S.sav>=amt){S.sav-=amt-S.cash;S.cash=0;return 2}return 0}
function advance(S){
 S.day=Math.min(1e6,S.day+1);const ev=[];
 /* savings interest (kept exact with a fraction counter, so even a few coins grow) */
 if(S.sav>0){const acc=S.savF+S.sav*CFG.SAV_BP,it=Math.floor(acc/10000);S.savF=acc%10000;if(it>0){S.sav=Math.min(CFG.MAXM,S.sav+it);S.st.interest+=it;ev.push({k:'int',a:it})}}
 stepMarket(S,S.day);
 if(S.day%CFG.DIV_EVERY===0){let tot=0;for(const id in S.pf){const A=AS[id];if(A&&A.div){tot+=Math.floor(S.pf[id].q*price(S,id)*A.div/1e6)}}
  if(tot>0){add(S,tot);S.st.divs++;S.st.divInc+=tot;tx(S,'div',tot);ev.push({k:'div',a:tot})}}
 const bi=bizIncome(S);if(bi>0){add(S,bi);S.st.bizInc+=bi;tx(S,'biz',bi);ev.push({k:'biz',a:bi})}
 /* home */
 const H=HOMES[S.home.id];
 if(S.home.own){if(S.mort){const p=due(S,'mort'),r=payBill(S,p);
   if(r){tx(S,'mort',-p);bump(S,1);const done=payDebt(S,'mort',p);ev.push({k:'mort',a:-p,sv:r===2});if(done){S.st.mortDone++;bump(S,10);ev.push({k:'mortdone'})}else S.mort.miss=0}
   else{S.mort.miss++;bump(S,-6);if(S.mort.miss>=CFG.GRACE){const eq=homeEquity(S);S.mort=null;add(S,eq);tx(S,'homes',eq,'h'+H.id);moveTo(S,0,false,0);ev.push({k:'moved',a:eq})}else ev.push({k:'mortmiss',n:CFG.GRACE-S.mort.miss})}}}
 else{const r=payBill(S,H.rent);
  if(r){tx(S,'rent',-H.rent);S.home.miss=0;if(H.id>0)bump(S,1);ev.push({k:'rent',a:-H.rent,sv:r===2})}
  else if(H.id===0)ev.push({k:'rentfree'});
  else{S.home.miss++;bump(S,-6);if(S.home.miss>=CFG.GRACE){const dep=S.home.dep;add(S,dep);if(dep)tx(S,'depb',dep);moveTo(S,0,false,0);ev.push({k:'moved',a:dep})}else ev.push({k:'rentmiss',n:CFG.GRACE-S.home.miss})}}
 /* loan: a missed payment only waits (no extra interest, no spiral) */
 if(S.loan){const p=due(S,'loan'),r=payBill(S,p);
  if(r){tx(S,'loanp',-p);bump(S,1);const done=payDebt(S,'loan',p);ev.push({k:'loanp',a:-p,sv:r===2});if(done){S.st.loansDone++;bump(S,10);ev.push({k:'loandone'})}else S.loan.miss=0}
  else{S.loan.miss=Math.min(99,S.loan.miss+1);bump(S,-6);ev.push({k:'loanmiss'})}}
 /* market news: the biggest mover */
 let best=null;ASSETS.forEach(A=>{if(A.kind!=='stock')return;const h=S.px[A.id],c=h.length>1?(h[h.length-1]-h[h.length-2])/h[h.length-2]:0;if(!best||Math.abs(c)>Math.abs(best.c))best={id:A.id,c:c}});
 if(best&&held(S)>0)ev.push({k:'mkt',x:best.id,pc:Math.round(best.c*1000)/10});
 S.nw.push(netWorth(S));if(S.nw.length>90)S.nw.shift();summary(S);
 return {day:S.day,ev:ev}}
function skipsLeft(S,today){return S.skips.d===today?Math.max(0,CFG.SKIPS-S.skips.n):CFG.SKIPS}
function canSkip(S,today){if(skipsLeft(S,today)<1)return {ok:false,err:'limit'};const need=billTotal(S);if(S.cash+S.sav<need&&!(S.home.id===0&&!S.loan))return {ok:false,err:'bills',need:need-S.cash-S.sav};return {ok:true}}
function skip(S,today){const c=canSkip(S,today);if(!c.ok)return c;if(S.skips.d!==today)S.skips={d:today,n:0};S.skips.n++;const r=advance(S);r.ok=true;return r}
/* called when the page opens: one city day per real calendar day */
function open(S,today){if(!DATE.test(today))return null;if(!S.real){S.real=today;if(!S.nw.length)S.nw.push(netWorth(S));return null}if(S.real===today)return null;S.real=today;return advance(S)}

function happy(S){const cap=HOMES[S.home.id].slots;let pets=0;for(let i=0;i<cap;i++)if(S.slots[i]&&IT[S.slots[i]].cat==='pet')pets++;return Math.max(1,Math.min(5,Math.round((HOMES[S.home.id].comfort+placed(S)*.6+pets*.6+(S.home.own?1:0))/2.4)))}

const TIPS=[
 {id:'budget',e:'🧮',t:['תקציב','Le budget','Budget'],b:['תקציב הוא תוכנית לכסף: כמה נכנס, כמה יוצא וכמה נשאר. קודם משלמים את מה שחייבים (שכר דירה), אחר כך חוסכים קצת, ורק אז קונים מה שרוצים.','Un budget, c\'est un plan pour ton argent : ce qui entre, ce qui sort, ce qui reste. On paie d\'abord ce qu\'on doit (le loyer), puis on épargne un peu, et ensuite on achète ce qui fait plaisir.','A budget is a plan for your money: what comes in, what goes out, what is left. First pay what you must (rent), then save a little, and only then buy what you want.']},
 {id:'interest',e:'🐷',t:['ריבית וחיסכון','Intérêts et épargne','Interest and savings'],b:['כששמים כסף בחיסכון, הבנק מוסיף עליו קצת בכל יום — זאת ריבית. הריבית מצטרפת לחיסכון, ולמחרת גם היא מרוויחה ריבית. ככה כדור שלג קטן הופך לגדול!','Quand tu mets de l\'argent en épargne, la banque en ajoute un peu chaque jour : ce sont les intérêts. Ils rejoignent ton épargne et rapportent à leur tour. Une petite boule de neige devient grande !','When you put money in savings, the bank adds a little every day — that is interest. The interest joins your savings and earns interest too. A small snowball becomes a big one!']},
 {id:'loan',e:'🤝',t:['הלוואה','Le prêt','Loans'],b:['הלוואה היא כסף שהבנק נותן עכשיו, ומחזירים אותו בתשלומים — עם תוספת שנקראת ריבית. לווים 100, מחזירים בערך 112. כדאי ללוות רק למשהו חשוב, ורק כמה שבאמת אפשר להחזיר.','Un prêt, c\'est de l\'argent que la banque donne maintenant et qu\'on rend petit à petit, avec un supplément : les intérêts. On emprunte 100, on rend environ 112. Emprunte seulement pour une chose importante, et seulement ce que tu peux rendre.','A loan is money the bank gives you now, and you pay it back bit by bit — plus an extra called interest. Borrow 100, return about 112. Borrow only for something important, and only what you can really pay back.']},
 {id:'mortgage',e:'🏠',t:['משכנתה','Le crédit maison','Mortgage'],b:['בית הוא יקר, אז משלמים חלק עכשיו (מקדמה) והבנק מלווה את השאר. כל יום מחזירים תשלום קבוע: חלק ממנו ריבית וחלק מקטין את החוב. מקדמה גדולה יותר = פחות ריבית. כשהחוב נגמר — הבית כולו שלך!','Une maison coûte cher : on paie une partie maintenant (l\'apport) et la banque prête le reste. Chaque jour on rend la même somme : une part d\'intérêts et une part qui réduit la dette. Plus l\'apport est grand, moins il y a d\'intérêts. Quand la dette est finie, la maison est à toi !','A house costs a lot, so you pay a part now (the down payment) and the bank lends the rest. Every day you pay the same amount: part is interest, part shrinks the debt. A bigger down payment = less interest. When the debt is gone, the house is all yours!']},
 {id:'rentbuy',e:'🔑',t:['לשכור או לקנות?','Louer ou acheter ?','Rent or buy?'],b:['בשכירות משלמים מעט בכל יום ואפשר לעבור בקלות — אבל הדירה אף פעם לא נהיית שלך. בקנייה משלמים הרבה יותר, ובסוף יש לך בית ששווה כסף. אין תשובה אחת נכונה: זה תלוי כמה כסף יש וכמה זמן רוצים להישאר.','En location, on paie peu chaque jour et on déménage facilement, mais le logement n\'est jamais à toi. En achetant, on paie beaucoup plus, et à la fin on possède une maison qui a de la valeur. Pas de réponse unique : cela dépend de ton argent et du temps que tu veux rester.','Renting costs little each day and moving is easy — but the flat never becomes yours. Buying costs much more, and in the end you own a home that is worth money. There is no single right answer: it depends on your money and how long you want to stay.']},
 {id:'invest',e:'📈',t:['השקעות','Investir','Investing'],b:['מי שקונה מניה מקבל חלק קטן מחברה. אם החברה מצליחה המחיר עולה, ולפעמים היא גם מחלקת דיבידנד. אבל המחיר יכול גם לרדת! משקיעים רק כסף שלא צריך מחר, ובסבלנות.','Acheter une action, c\'est posséder un petit morceau d\'une entreprise. Si elle réussit, le prix monte, et parfois elle verse un dividende. Mais le prix peut aussi baisser ! On investit seulement l\'argent dont on n\'a pas besoin demain, et avec patience.','Buying a stock means owning a tiny piece of a company. If the company does well the price goes up, and sometimes it pays a dividend. But the price can go down too! Invest only money you do not need tomorrow, and be patient.']},
 {id:'risk',e:'🧺',t:['סיכון ופיזור','Risque et diversification','Risk and diversification'],b:['מניה שיכולה לעלות הרבה יכולה גם לרדת הרבה — זה הסיכון. אגרת חוב בטוחה אבל עולה לאט. הסוד: לא לשים את כל הביצים בסל אחד. כשמפזרים בין כמה חברות, או קונים קרן מדד, ירידה של אחת כמעט לא מורגשת.','Une action qui peut beaucoup monter peut aussi beaucoup baisser : c\'est le risque. Une obligation est sûre mais monte lentement. Le secret : ne pas mettre tous ses œufs dans le même panier. En répartissant entre plusieurs entreprises, ou avec un fonds indiciel, la chute d\'une seule se sent à peine.','A stock that can rise a lot can also fall a lot — that is risk. A bond is safe but grows slowly. The secret: do not put all your eggs in one basket. Spread over several companies, or buy an index fund, and one fall hardly hurts.']},
 {id:'tax',e:'🏛️',t:['מסים','Les impôts','Taxes'],b:['מכל משכורת, חלק קטן הולך לעיר — זה מס. במסים בונים דברים שכולם נהנים מהם: פארק, כבישים, בית ספר וכבאית. כולם נותנים קצת, וכולם מרוויחים.','Sur chaque salaire, une petite part va à la ville : c\'est l\'impôt. Il sert à construire ce dont tout le monde profite : le parc, les routes, l\'école, les pompiers. Chacun donne un peu, tout le monde y gagne.','From every salary, a small part goes to the city — that is tax. Taxes build things everyone enjoys: the park, roads, the school, the fire truck. Everyone gives a little, everyone gains.']},
 {id:'resale',e:'♻️',t:['ערך במכירה חוזרת','La valeur de revente','Resale value'],b:['חפץ חדש שווה את המחיר שלו רק בחנות. ברגע שקונים אותו הוא ״משומש״, ואם מוכרים — מקבלים פחות. כלי רכב מאבדים ערך בכל יום. עסק, לעומת זאת, מכניס כסף בכל יום. לפני שקונים שואלים: זה יעלה לי כסף או יביא לי כסף?','Un objet neuf vaut son prix seulement en boutique. Dès qu\'on l\'achète il est « d\'occasion », et si on le revend, on reçoit moins. Les véhicules perdent de la valeur chaque jour. Un commerce, lui, rapporte chaque jour. Avant d\'acheter, demande-toi : ça me coûte ou ça me rapporte ?','A new thing is worth its price only in the shop. Once bought it is "used", and if you sell it you get less. Vehicles lose value every day. A business, however, brings in money every day. Before buying, ask: will this cost me money or earn me money?']},

 const p=$('panel'),y=p.scrollTop;$('holder').appendChild($('extras'));p.textContent='';ap(p,(SCR[scr]||SCR.map)());p.scrollTop=y;
 drawMap()}

/* ---------- salary + day when the page opens / comes back ---------- */
function work(first){const td=today(),sl=Eng.pay(S,rstats(),td),rep=Eng.open(S,td);
 if(sl&&sl.gift){dlg(c=>{ap(c,[h('div','hero','🏙️'),h('h2','',t('wT')),h('p','',t('wB1')),h('p','',t('wB2')),h('p','',t('wB3')),h('div','cd',kv('🎁 '+t('wGift'),h('span','big',coin(sl.gift,{sign:1,cls:'pos'})))),okBtn(t('wGo'))])});ev('salary',{gift:sl.gift})}
 else if(sl&&sl.n!==undefined){slipDlg(sl,true);SFX.coin();ev('salary',{n:sl.n,p:sl.p+sl.l,w:sl.w,lvl:Eng.career(S)});audit('city_salary','job',{n:sl.n})}
 else if(sl&&sl.rest&&!first)toast(t('rest'));
 if(rep){news(rep);ev('day',{skip:0})}
 if(sl||rep||first)after()}
function boot(){setLang(lang);load();buildTabs();document.body.setAttribute('data-scr',scr);
 $('me').addEventListener('click',()=>{SFX.tap();go('job')});
 $('ov').addEventListener('click',e=>{if(e.target===$('ov')&&$('card').querySelector('.btn.w'))closeDlg()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dOpen)closeDlg()});
 let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawMap,120)});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')work(false);else save()});
 window.addEventListener('pagehide',()=>{save();track('game_end',{sec:Math.round((Date.now()-t0)/1000),score:Eng.netWorth(S),win:false})});
 window.addEventListener('storage',e=>{if(e.key==='annabelle-lang'&&e.newValue&&TX[e.newValue]){setLang(e.newValue);buildTabs();render()}});
 render();work(true);
 if(repaired)toast(t('repaired'));
 award([{event:'play'}]);track('game_start',{mode:'city',level:Eng.career(S)+1});
 setTimeout(drawMap,300)}
window.__city={state:()=>JSON.parse(JSON.stringify(S)),pay:()=>{const r=Eng.pay(S,rstats(),today());after();return r},nextDay:()=>{const r=Eng.skip(S,today());after();return r},
 buy:id=>{const r=Eng.buyItem(S,id);after();return r},act:(name,args)=>{if(typeof Eng[name]!=='function')return null;const r=Eng[name].apply(null,[S].concat(args||[]));after();return r},go:go,eng:Eng};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
