 SFX.click();rsArm(false);$("win").classList.remove("on");const m=G.mode;newGame(m)});
function cupWin(w){ // cup flow: win = next match (stars by kittens left), loss or draw = kindly replay the same match
 const c=cpGet(),r=G.cr,R=RW();let left=0;for(const row of G.b)for(const q of row)if(q&&q.p===0)left++;
 if(w===0){
  const stars=left>=8?3:left>=5?2:1;c.stars[r]=Math.max(c.stars[r]||0,stars);if(r>=c.done)c.done=r+1;
  const before=c.skins,fin=r===4;c.skins=Math.max(c.skins,Math.min(5,r+2));if(fin){c.cups++;c.skins=5}cpSave(c);
  $("winT").textContent=fin?t("cupWon"):winYouT();$("winS").innerHTML=(fin?"🏆🦁🏆":"🧡🦁🧡")+`<div style="font-size:22px;margin-top:4px">${"⭐".repeat(stars)+"☆".repeat(3-stars)} · ${left} ${t("kleft")}${c.skins>before?"<br>"+t("unl"):""}${G.byPts?"<br>"+t("byPts")+" "+G.byPts[0]+"–"+G.byPts[1]:""}</div>`;
  $("againBtn").textContent=fin?t("cupAgain"):t("cupNext");$("againBtn").dataset.lg="next";
  if(R){R.award({game:"checkers",event:"levelClear",level:r+1,score:left*10});R.award({game:"checkers",event:"star",stars});R.award({game:"checkers",event:"win",coins:fin?20:undefined});R.award({game:"checkers",event:"score",score:left*10})}
 }else{
  $("winT").textContent=w<0?t("drawT"):t("cupLose");$("winS").innerHTML=(w<0?"🤝":"🐱💪")+(G.byPts?`<div style="font-size:18px;margin-top:4px">${t("byPts")} ${G.byPts[0]}–${G.byPts[1]}</div>`:"");$("againBtn").textContent=t("cupRetry");$("againBtn").dataset.lg="retry";if(R)R.award({game:"checkers",event:"score",score:left*10})}
}
function showWin(w){let s;if(G.online)s=w===G.me?t("winOn"):t("loseOn");else s=resText(w);$("winT").textContent=s;$("winS").textContent=w<0?"🤝":w?"🤍🦁🤍":"🧡🦁🧡";$("againBtn").style.display="";delete $("againBtn").dataset.lg;musicStop();
 if(G.byPts&&G.mode!=="cup"){const d=document.createElement("div");d.style.cssText="font-size:18px;margin-top:4px";d.textContent=t("byPts")+" "+G.byPts[0]+"–"+G.byPts[1];$("winS").appendChild(d)}
 if(!G.online&&G.mode!=="two"&&G.mode!=="cup")recWin(G.mode,w===0);
 if(G.mode==="cup")cupWin(w);
 else if(RW()){const R=RW(),mine=G.online?w===G.me:G.mode!=="two"&&w===0;if(mine){let left=0;for(const row of G.b)for(const q of row)if(q&&q.p===(G.online?G.me:0))left++;const mult=G.mode==="hard"?2:1;R.award({game:"checkers",event:"win"});R.award({game:"checkers",event:"score",score:left*10*mult});const st=left>=8?3:left>=5?2:1;R.award({game:"checkers",event:"star",stars:st})}}
 $("win").classList.add("on");if(w<0)SFX.back();else if(G.online?w===G.me:(G.mode==="two"||!w)){SFX.win();confetti();if(G.cr===4&&!w)setTimeout(confetti,1500)}else SFX.lose();
 if(RW())setTimeout(()=>RW().flush(),500)}
function confetti(){const cv=$("conf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;const P=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,v:2+Math.random()*3,c:`hsl(${Math.random()*360},90%,60%)`,a:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.fillRect(p.x+Math.sin(p.a)*8,p.y,8,12)});if(++n<220)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})()}
$("againBtn").addEventListener("click",()=>{const lg=$("againBtn").dataset.lg;delete $("againBtn").dataset.lg;if(lg){if(lg==="next"){const c=cpGet();cupR=c.done>=5?0:c.done;if(c.done>=5){c.done=0;cpSave(c)}}$("win").classList.remove("on");newGame("cup");return}if(G.online){if(!NV||NV.myRe||!NV.gameOn)return;NV.rematch();$("winT").textContent=t("waitRe");$("againBtn").style.display="none";return}const m=G.mode;$("win").classList.remove("on");newGame(m)});

 if(M){ac();SFX.click();if(M.dataset.mode==="cup"){const c=cpGet();cupR=c.done>=5?0:c.done;if(c.done>=5){c.done=0;cpSave(c)}}newGame(M.dataset.mode)}});

// ---- online play: the shared module net1v1.js does the connection (room code + secret link, host approval, mutual HMAC, lobby, retry, telemetry) ----
// What stays here: the validation of every game message, the host-authoritative board resync, and the saved game that survives a reload (key SK).
var NV=null;
const NQ={q:[],pumping:false};   // the friend's moves waiting to be played
const SK="annabelle-ck-session";
function netSend(o){if(NV)NV.send(o)}
// --- everything from the network is untrusted: validate & rebuild it, never use it as-is ---
const int=(x,lo,hi)=>Number.isInteger(x)&&x>=lo&&x<=hi;
function cleanYarn(y){if(!Array.isArray(y)||y.length>2)return null;const o=[];for(const q of y){if(!Array.isArray(q)||q.length!==2||!int(q[0],0,7)||!int(q[1],0,7))return null;o.push([q[0],q[1]])}return o}
function cleanState(s){
 if(!s||typeof s!=="object"||!int(s.turn,0,1)||typeof s.bonus!=="boolean"||typeof s.over!=="boolean"||!int(s.seq,0,1e6)||!Array.isArray(s.b)||s.b.length!==8)return null;
 const ids=new Set(),b=[];
 for(const row of s.b){if(!Array.isArray(row)||row.length!==8)return null;const r=[];
  for(const c of row){if(c===null){r.push(null);continue}if(!c||typeof c!=="object"||!int(c.p,0,1)||!int(c.k,0,1)||!int(c.id,0,63)||ids.has(c.id))return null;ids.add(c.id);r.push({p:c.p,k:c.k,id:c.id})}b.push(r)}
 const y=cleanYarn(s.yarn);if(!y)return null;
 let ch=null;if(s.chain!==null&&s.chain!==undefined){if(!Array.isArray(s.chain)||s.chain.length!==2||!int(s.chain[0],0,7)||!int(s.chain[1],0,7))return null;ch=[s.chain[0],s.chain[1]]}
 return {b,turn:s.turn,yarn:y,bonus:s.bonus,chain:ch,over:s.over,seq:s.seq};
}
// --- saved game state (survives reloads / app being killed) ---
function snap(){return {b:G.b,turn:G.turn,yarn:G.yarn,bonus:G.bonus,chain:G.chain,over:G.over,seq:G.seq||0}}
function saveSess(){if(!G||!G.online)return;if(G.over){clearSess();return}try{localStorage.setItem(SK,JSON.stringify({code:NV.NET.code,key:NV.NET.key,host:NV.host,me:G.me,ts:Date.now(),s:snap()}))}catch(e){}}
function clearSess(){try{localStorage.removeItem(SK)}catch(e){}}
function commit(){if(!G)return;G.seq=(G.seq||0)+1;if(G.online)saveSess()}
function applyState(s){
 G.b=s.b;G.turn=s.turn;G.yarn=s.yarn;G.bonus=s.bonus;G.chain=s.chain;G.seq=s.seq;G.sel=null;G.busy=false;G.over=false;G.pendBonus=false;NQ.q=[];
 $("win").classList.remove("on");$("againBtn").style.display="";draw();updTurn();if(s.over)checkEnd();saveSess();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pumpNet(){
 if(NQ.pumping)return;NQ.pumping=true;const g=G;
 while(NQ.q.length&&G===g){
  const m=NQ.q.shift();while(G===g&&G.busy)await sleep(40);if(G!==g)break;
  const L=legal(G.b,G.turn,G.chain,G.bonus),mv=G.turn!==G.me&&!G.over?L.find(x=>x.fr===m.fr&&x.fc===m.fc&&x.r===m.r&&x.c===m.c):null;
  if(!mv){NQ.q=[];if(NV.host)sendState();else netSend({t:"resync"});break} // boards disagree → host's board wins
  await doMove(mv);if(G===g&&!G.over&&G.turn===G.me&&!G.bonus)SFX.turn();
 }
 NQ.pumping=false;
}
function sendHello(){const g=G;(function w(){if(G!==g||!NV||!NV.connected)return;if(G.busy){setTimeout(w,80);return}netSend({t:"hi",seq:G.seq||0})})()}
function sendState(){const g=G;(function w(){if(G!==g||!NV||!NV.connected)return;if(G.busy){setTimeout(w,80);return}netSend({t:"state",s:snap()})})()}
function showLeft(){ // the friend left on purpose
 clearSess();if(!G)return;G.over=true;$("winT").textContent=t("left");$("winS").textContent="👋";$("againBtn").style.display="none";$("win").classList.add("on")}
function onNetData(d){ // only after net1v1 authenticated the friend; still treated as hostile: types, ranges, order, who is the host
 if(!d||typeof d!=="object"||!G||!G.online||!NV)return;const host=NV.host;
 if(d.t==="hi"){ // after a reconnect both sides compare move counts; the HOST's board is the truth
  if(!int(d.seq,-1,1e6))return;
  const mine=G.seq||0;
  if(mine>d.seq||(host&&mine<d.seq))sendState();
  else if(mine===d.seq)G.paused=false;
 }
 else if(d.t==="state"&&!host){ // only the friend adopts a board, and only the host's
  const cs=cleanState(d.s);if(!cs)return;
  applyState(cs);G.paused=false;
 }
 else if(d.t==="resync"){if(host)sendState()}
 else if(d.t==="move"&&!G.paused&&d.m&&typeof d.m==="object"&&NQ.q.length<64&&int(d.m.fr,0,7)&&int(d.m.fc,0,7)&&int(d.m.r,0,7)&&int(d.m.c,0,7)){NQ.q.push({fr:d.m.fr,fc:d.m.fc,r:d.m.r,c:d.m.c});pumpNet()}
 else if(d.t==="yarn"&&!host&&cleanYarn(d.y)){const g=G,yy=cleanYarn(d.y);(function ap(){if(G!==g)return;if(G.busy){setTimeout(ap,100);return}G.yarn=yy;draw();saveSess()})()}
}
function resumeSession(){ // after a reload: the saved game comes back paused, the module reconnects with the saved game secret (mutual HMAC)
 let r=null;try{r=JSON.parse(localStorage.getItem(SK))}catch(e){}
 const cs=r&&r.s?cleanState(r.s):null,N=NV&&NV.NET;
 if(!N||!r||!cs||!/^\d{6}$/.test(r.code||"")||!/^[0-9a-f]{32}$/.test(r.key||"")||!(Date.now()-r.ts<2*3600e3)){clearSess();return false}
 N.code=r.code;N.key=r.key;N.host=!!r.host;
 newGame("online",cs.yarn);const s=cs;
 G.b=s.b;G.turn=s.turn;G.yarn=s.yarn;G.bonus=s.bonus;G.chain=s.chain;G.seq=s.seq;G.sel=null;G.over=false;G.paused=true;draw();updTurn();
 if(s.over)checkEnd();
 N.gameOn=true;N.over=false;N.last=0;   // the module sees a match whose line has been silent for long: pause card, reconnect loop, mutual proof, then onResume
 return true;
}
applyLang();updMute();
const LK=(()=>{const q=new URLSearchParams(location.search).get("room")||"";let sv=null;try{sv=JSON.parse(localStorage.getItem(SK))}catch(e){}
 const link=/^\d{6}$/.test(q),same=link&&!!sv&&sv.code===q&&!sv.host;   // same: the invitation of the game this phone was already in (a reload): resumed, not joined again
 if(same)try{history.replaceState(null,"",location.pathname)}catch(e){}
 return {join:link&&!same,sv:!!sv}})();
NV=window.Net1v1?Net1v1({pid:"annabelle-ck-",shareTxt:{he:TX.he.shareTxt,fr:TX.fr.shareTxt,en:TX.en.shareTxt},
 sfx:{join:()=>SFX.join(),click:()=>SFX.click(),drop:()=>SFX.drop(),back:()=>SFX.back(),huh:()=>SFX.drop()},
 hideMenu(){},showMenu(){toMenu()},
 makeStart(){return {y:G.yarn}},cleanStart(d){const y=cleanYarn(d.y);return y?{y}:null},
 onHostStart(){NQ.q=[];newGame("online")},
 onGuestStart(c){NQ.q=[];newGame("online",c.y)},
 onResume(){sendHello()},   // the line is back (after the mutual HMAC proof): both sides compare move counts
 onData:onNetData,onLeft:showLeft,
 onPause(on){if(G&&G.online){G.paused=!!on;if(on)saveSess()}}}):null;
$("bOnline").addEventListener("click",()=>{SFX.click();if(NV)NV.showLobby()});
window.__ck={get NT(){return NV},get NET(){return NV&&NV.NET},NQ,cleanState,cleanYarn,applyState,draw};
if(LK.join)clearSess();else if(LK.sv)resumeSession();
</script>
