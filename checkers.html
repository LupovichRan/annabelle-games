<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff6d6;font-family:"Rubik","Varela Round",Arial,sans-serif;color:#5a3b1a;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}
#menu{justify-content:center;gap:10px;padding:10px;overflow:auto}
h1{margin:0;font-size:clamp(26px,7vw,40px);color:#e8862d;text-shadow:0 3px 0 #0001;text-align:center}
.heads{font-size:38px;line-height:1}
.langs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.lang{min-height:44px;padding:4px 14px;border-radius:999px;border:2px solid #e8862d;background:#fff;font:800 16px Rubik,Arial;color:#5a3b1a}
.lang.sel{background:#e8862d;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{min-height:56px;min-width:140px;padding:8px 18px;border-radius:18px;border:none;background:linear-gradient(#ffb35c,#f08a24);color:#fff;font:800 19px Rubik,Arial;box-shadow:0 4px 0 #b65f10}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b65f10}
.big.g{background:linear-gradient(#b8c1cc,#7d8794);box-shadow:0 4px 0 #555e69}
.big.p{background:linear-gradient(#c58cf0,#9050c8);box-shadow:0 4px 0 #5e2e8a}
.rules{max-width:460px;background:#fff;border-radius:16px;padding:8px 12px;font-size:15px;line-height:1.35;box-shadow:0 3px 0 #0001}
.rules p{margin:3px 0}
#game{padding:6px}
.bar{display:flex;align-items:center;gap:8px;width:100%;max-width:900px;flex:0 0 auto}
.iconbtn{width:48px;height:48px;border-radius:50%;border:2px solid #e8862d;background:#fff;font-size:22px;flex:0 0 auto}
.pill{flex:1;text-align:center;background:#fff;border-radius:999px;padding:8px 10px;font-weight:800;font-size:16px;box-shadow:0 3px 0 #0001;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;gap:10px}
#boardBox{position:relative}
svg#board{display:block;border-radius:14px;box-shadow:0 6px 0 #8a5a2b}
.sq{cursor:pointer}
.hl{fill:#7dff9b;opacity:.55;pointer-events:none;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.85}}
.selr{fill:none;stroke:#ffe14d;stroke-width:5;pointer-events:none}
.pc{transition:transform .32s ease;pointer-events:none}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tail{transform-box:fill-box;transform-origin:0% 50%}
.wag .tail{animation:wag .5s 3 alternate ease-in-out}
@keyframes wag{to{transform:rotate(35deg)}}
.yarn{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bub{position:absolute;background:#fff;border:3px solid #e8862d;border-radius:16px;padding:6px 10px;font-weight:800;font-size:16px;white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none;animation:pop .25s;z-index:5}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.3)}}
.side{display:flex;flex-direction:column;gap:8px;align-items:center}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0006;z-index:20}
#win.on{display:flex}
#win .card{background:#fff6d6;border-radius:22px;padding:16px;text-align:center;max-width:90vw;display:flex;flex-direction:column;gap:10px;align-items:center}
#win h2{margin:0;font-size:28px;color:#e8862d}
#conf{position:fixed;inset:0;pointer-events:none;z-index:21}
.corner{position:fixed;top:8px;left:8px;z-index:10}
.dance{display:inline-block;animation:dn .6s infinite alternate}@keyframes dn{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#lobby{justify-content:center;gap:12px;padding:10px;overflow:auto}
.lobpane{display:none;flex-direction:column;align-items:center;gap:10px}
.lobpane.on{display:flex}
#lobCode{font-size:clamp(40px,13vw,72px);font-weight:900;letter-spacing:.12em;color:#e8862d;direction:ltr;text-shadow:0 4px 0 #0002;line-height:1}
#lobIn{width:min(80vw,300px);height:70px;border-radius:18px;border:3px solid #e8862d;background:#fff;text-align:center;font:900 34px Rubik,Arial;color:#5a3b1a;letter-spacing:.12em;direction:ltr;user-select:text;-webkit-user-select:text}
#lobCd{font-weight:900;font-size:26px;color:#e8862d;direction:ltr;min-height:32px}#lobCd.low{color:#e23b3b;animation:pulse2 .6s infinite alternate}@keyframes pulse2{to{transform:scale(1.12)}}
#lobStatus,#lobWait{font-weight:800;font-size:18px;text-align:center;min-height:24px}
#pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;z-index:40}#pause.on{display:flex}
#pause .card{background:#fff6d6;border-radius:22px;padding:18px;text-align:center;max-width:90vw;display:flex;flex-direction:column;gap:10px;align-items:center}#pause h2{margin:0;font-size:24px;color:#e8862d}
a.big{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(#5fd38d,#2fb36a);box-shadow:0 4px 0 #1d7c48}

function placeYarn(){const e=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2&&!G.b[r][c])e.push([r,c]);G.yarn=[];for(let i=0;i<2&&e.length;i++)G.yarn.push(e.splice(Math.random()*e.length|0,1)[0])}

  if(G&&G.online)sendHello();else if(NET.host)startOnlineHost();else netSend({t:"hello",seq:-1})};
 const op=()=>{if(opened||gen!==NET.gen)return;opened=true;
  c.to=setTimeout(()=>{if(!c.authed){NET.pend.delete(c);try{c.close()}catch(e){}}},10000);
  if(NET.key){try{c.send({t:"ch",n:c.myN})}catch(e){}}   // mutual challenge-response (HMAC with the game secret)
  else if(c.authed&&NET.host)finish()};
 c.on("open",op);
 c.on("data",async d=>{
  if(gen!==NET.gen||!d||typeof d!=="object")return;
  if(d.t==="ch"&&NET.key&&typeof d.n==="string"&&/^[0-9a-f]{32}$/.test(d.n)){const h=await hmac(NET.key,"R"+(NET.host?"h":"g")+d.n);try{c.send({t:"pr",h})}catch(e){}return}
  if(d.t==="pr"&&NET.key&&typeof d.h==="string"){if(c.authed)return;const want=await hmac(NET.key,"R"+(NET.host?"g":"h")+c.myN);if(gen!==NET.gen)return;if(d.h===want){c.authed=true;finish()}else{NET.pend.delete(c);try{c.close()}catch(e){}}return}
  if(!c.authed){ // first contact of a joining friend: take the game secret from the host's first "start"
   if(d.t==="start"&&!NET.host&&!NET.key&&typeof d.k==="string"&&/^[0-9a-f]{32}$/.test(d.k)&&cleanYarn(d.y)){NET.key=d.k;c.authed=true;clearTimeout(c.to);NET.last=Date.now();onNetData(d)}
   return}
  if(NET.conn!==c)return;
  NET.last=Date.now();onNetData(d)});
 const gone=()=>{NET.pend.delete(c);if(gen===NET.gen&&NET.conn===c)onNetClose()};
 c.on("close",gone);c.on("error",gone);
 if(c.open)op();
}
function startOnlineHost(){stopCd();NET.q=[];SFX.join();if(!NET.key)NET.key=rnd(16);newGame("online");netSend({t:"start",y:G.yarn,k:NET.key})}
function sendHello(){const g=G;(function w(){if(G!==g||!NET.conn)return;if(G.busy){setTimeout(w,80);return}netSend({t:"hello",seq:G.seq||0})})()}
function sendState(){const g=G;(function w(){if(G!==g||!NET.conn)return;if(G.busy){setTimeout(w,80);return}netSend({t:"state",s:snap()})})()}
function onNetData(d){
 if(!d||typeof d!=="object")return;
 if(d.t==="start"&&!NET.host){const y=cleanYarn(d.y);if(!y||d.k!==NET.key)return;NET.q=[];SFX.join();setPaused(false);newGame("online",y)}
 else if(d.t==="hello"){
  if(!int(d.seq,-1,1e6))return;
  const mine=G&&G.online?(G.seq||0):-1;
  if(mine>d.seq)sendState();
  else if(mine===d.seq&&mine>=0)setPaused(false);
 }
 else if(d.t==="state"){
  const cs=cleanState(d.s);if(!cs)return;
  if(G&&G.online&&NET.host&&cs.seq<(G.seq||0))return; // the host's board is authoritative: never go backwards
  if(!G||!G.online){NET.q=[];newGame("online")}
  applyState(cs);setPaused(false);
 }
 else if(d.t==="resync"){if(NET.host)sendState()}
 else if(d.t==="move"&&G&&G.online&&!G.paused&&d.m&&typeof d.m==="object"&&NET.q.length<64&&int(d.m.fr,0,7)&&int(d.m.fc,0,7)&&int(d.m.r,0,7)&&int(d.m.c,0,7)){NET.q.push({fr:d.m.fr,fc:d.m.fc,r:d.m.r,c:d.m.c});pumpNet()}
 else if(d.t==="yarn"&&G&&G.online&&cleanYarn(d.y)){const g=G,yy=cleanYarn(d.y);(function ap(){if(G!==g)return;if(G.busy){setTimeout(ap,100);return}G.yarn=yy;draw();saveSess()})()}
 else if(d.t==="rematch"){SFX.click();NET.oppRe=true;maybeRematch()}
 else if(d.t==="bye"){const had=G&&G.online;if(had)SFX.drop();clearSess();netClose();setPaused(false);
  if(had){G.over=true;$("winT").textContent=t("left");$("winS").textContent="👋";$("againBtn").style.display="none";$("win").classList.add("on")}else lobFail()}
}
function maybeRematch(){if(NET.host&&NET.myRe&&NET.oppRe&&NET.conn){NET.myRe=NET.oppRe=false;startOnlineHost()}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pumpNet(){
 if(NET.pumping)return;NET.pumping=true;const g=G;
 while(NET.q.length&&G===g){
  const m=NET.q.shift();while(G===g&&G.busy)await sleep(40);if(G!==g)break;
  const L=legal(G.b,G.turn,G.chain,G.bonus),mv=G.turn!==G.me&&!G.over?L.find(x=>x.fr===m.fr&&x.fc===m.fc&&x.r===m.r&&x.c===m.c):null;
  if(!mv){NET.q=[];if(NET.host)sendState();else netSend({t:"resync"});break} // boards disagree → host's board wins
  await doMove(mv);if(G===g&&!G.over&&G.turn===G.me&&!G.bonus)SFX.turn();
 }
 NET.pumping=false;
}
// --- disconnect: pause, keep the saved state, keep trying; resync by move count when the friend is back ---
function onNetClose(){
 if(!G||!G.online){if(NET.conn||NET.peer)lobFail();return}
 const c=NET.conn;NET.conn=null;try{c&&c.close()}catch(e){}
 if(G.over){netClose();$("winT").textContent=t("left");$("winS").textContent="👋";$("againBtn").style.display="none";$("win").classList.add("on");return}
 if(NET.paused&&!NET.host){return}
 setPaused(true);saveSess();if(!NET.host)guestLoop();
}
function guestLoop(){
 clearTimeout(NET.rt);if(!NET.paused||NET.host||!G||!G.online)return;const gen=NET.gen;
 function tryConnect(){if(gen!==NET.gen||!NET.paused||!NET.peer)return;if(NET.conn&&NET.conn.open)return;
  if(NET.conn){const o=NET.conn;NET.conn=null;try{o.close()}catch(e){}}
  try{attach(NET.peer.connect(PID+NET.code,{reliable:true}),gen)}catch(e){}}
 function go(){if(gen!==NET.gen||!NET.paused)return;const p=NET.peer;
  if(!p||p.destroyed||p.disconnected||!p.open){
   try{p&&p.destroy()}catch(e){}
   loadPeer().then(()=>{if(gen!==NET.gen||!NET.paused)return;const np=new Peer(undefined,PEER_CFG);NET.peer=np;
    np.on("open",()=>{if(gen===NET.gen&&NET.paused)tryConnect()});np.on("error",()=>{})}).catch(()=>{});
  }else tryConnect();
  NET.rt=setTimeout(go,4500)}
 go();
}
function netKick(){ // phone woke up / network is back: retry right away
 if(!G||!G.online)return;
 if(NET.paused){if(NET.host){const p=NET.peer;if(p&&p.disconnected&&!p.destroyed)try{p.reconnect()}catch(e){}}else guestLoop()}
 else netSend({t:"ping"});
}
setInterval(()=>{if(!G||!G.online||NET.paused)return;netSend({t:"ping"});if(NET.conn&&Date.now()-NET.last>10000)onNetClose()},3000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")netKick()});addEventListener("online",netKick);
function resumeSession(){
 let r=null;try{r=JSON.parse(localStorage.getItem(SK))}catch(e){}
 const cs=r&&r.s?cleanState(r.s):null;
 if(!r||!cs||!/^\d{6}$/.test(r.code||"")||!/^[0-9a-f]{32}$/.test(r.key||"")||!(Date.now()-r.ts<2*3600e3)){clearSess();return false}
 NET.code=r.code;NET.key=r.key;NET.host=!!r.host;NET.me=r.me===1?1:0;
 newGame("online",cs.yarn);const s=cs;
 G.b=s.b;G.turn=s.turn;G.yarn=s.yarn;G.bonus=s.bonus;G.chain=s.chain;G.seq=s.seq;G.sel=null;G.over=false;draw();updTurn();
 setPaused(true);if(s.over)checkEnd();
 const gen=NET.gen;
 loadPeer().then(()=>{if(gen!==NET.gen)return;if(NET.host)hostPeer(r.code,gen,true);else guestLoop()}).catch(()=>{});
 return true;
}
$("pauseLeave").addEventListener("click",()=>{SFX.click();toMenu()});
$("bOnline").addEventListener("click",()=>{SFX.click();showLobby()});
$("bCreate").addEventListener("click",()=>{SFX.click();createRoom()});
$("bJoin").addEventListener("click",()=>{SFX.click();lobPane("lobJoin");$("lobStatus").textContent="";$("lobIn").value="";$("lobIn").focus()});
$("bGo").addEventListener("click",()=>{const c=$("lobIn").value.replace(/\D/g,"");if(c.length===6){SFX.click();joinRoom(c)}});
$("lobIn").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,6)});
$("lobBack").addEventListener("click",()=>{SFX.click();toMenu()});
applyLang();updMute();
{const q=new URLSearchParams(location.search).get("room")||"";let sv=null;try{sv=JSON.parse(localStorage.getItem(SK))}catch(e){}
 if(/^\d{6}$/.test(q)&&!(sv&&sv.code===q&&!sv.host)){clearSess();setTimeout(()=>{showLobby();joinRoom(q)},0)}else if(sv)resumeSession()}
</script>
