.arrow{width:72px;height:72px}

.logo .l2{margin-top:6px;font-size:clamp(14px,min(4vw,2.6dvh),19px);font-weight:800;color:#fff;background:rgba(122,53,16,.75);border-radius:999px;padding:3px 14px}

.lang.sel{background:#fff;box-shadow:0 0 0 3px var(--accent),0 3px 0 #0002}

.go{background:linear-gradient(#6fe39b,#25a85e)}.home{background:linear-gradient(#b39bff,#7c5cff)}.orange{background:linear-gradient(#ffc163,#ff8a1f)}

.rot{font-size:14px;font-weight:800;color:#fff;background:#0004;border-radius:999px;padding:4px 12px}

  RIDE.logs.forEach(lx=>{ if(!inView(lx-30,lx+30)) return; c.fillStyle="#7a4a26"; c.strokeStyle="#3d2010"; c.lineWidth=1.8; rrect(c,lx-16,G-24,32,25,8); c.fill(); c.stroke(); ell(c,lx+14,G-11.5,6,12,0); fs(c,"#e0b07a","#3d2010",1.4); ell(c,lx+14,G-11.5,2.6,5,0); fs(c,null,"#a8703e",1); });
  // ostrich
  const o=rideO; if(o&&inView(o.x-60,o.x+60)&&!(o.st==="gone"&&o.x>LEN)){ c.save(); c.translate(o.x,o.y); const riding=o.st==="ride";
    if(o.stum>0) c.rotate(Math.sin(tm*30)*.06);
    drawOstrich(c,tm,riding||o.st==="gone",o.duck&&riding,riding?{m:o.duck?"duck":"sit",t:tm,ph:0,blink:P.blink>0,sq:0}:null); c.restore();
    if(o.st==="wait"&&!o.done){ c.save(); c.globalAlpha=.6+Math.sin(tm*5)*.3; c.fillStyle="#fff7c0"; c.translate(o.x,G-118+Math.sin(tm*5)*3); c.beginPath(); c.moveTo(-7,-8); c.lineTo(7,-8); c.lineTo(0,2); c.closePath(); c.fill(); c.restore(); } }
  // enemies
  EN.forEach(e=>{ if(e.st==="gone"||!inView(e.x-30,e.x+30)) return; c.save(); c.translate(e.x,e.y+(e.yo||0)); if(e.st==="dead") c.rotate(e.rot); if(e.st==="flee") c.globalAlpha=Math.max(0,e.fade);
    c.scale(e.dir>0?1:-1,1);
    if(e.k==="beetle") drawBeetle(c,tm+e.x,e.st); else if(e.k==="lizard") drawLizard(c,tm+e.x,e.st,e.pause); else drawPorc(c,tm,e.st);
    c.restore();
    if(e.st==="stun"){ for(let i=0;i<3;i++){ const a=tm*5+i*2.1; c.font="9px sans-serif"; c.textAlign="center"; c.fillText("⭐",e.x+Math.cos(a)*12,e.y-24+Math.sin(a)*3); } } });
  // bugs & paws
  BUGS.forEach(b=>{ if(!b.got&&inView(b.x,b.x)) drawBug(c,b.x,b.y,tm+b.ph,b.heal); });
  PAWS.forEach(w=>{ if(!w.got&&inView(w.x,w.x)) drawPaw(c,w.x,w.y,tm); });
  // butterflies
  FLIES.forEach(f=>{ if(!inView(f.x-60,f.x+60)) return; const x=f.x+Math.sin(tm*.6+f.ph)*50, y=f.y+Math.sin(tm*1.3+f.ph)*18, w=Math.abs(Math.sin(tm*14+f.ph));
    c.fillStyle=f.c; ell(c,x-3*w,y,3.6*w+.4,2.8,-.4); c.fill(); ell(c,x+3*w,y,3.6*w+.4,2.8,.4); c.fill(); c.fillStyle="#3a1c0a"; c.fillRect(x-.6,y-2,1.2,4); });
  // boss
  if(BOSS){ const B=BOSS; c.save(); c.translate(B.x,B.y); if(B.inv>0&&Math.floor(B.inv*14)%2===0) c.globalAlpha=.5; c.scale(B.face,1); drawHyena(c,tm,B); c.restore(); c.globalAlpha=1;
    if(B.st==="tell"){ c.font="bold 26px sans-serif"; c.textAlign="center"; c.fillStyle="#ff3b30"; c.strokeStyle="#fff"; c.lineWidth=4; const yy=B.y-74+Math.sin(tm*30)*2; c.strokeText("!",B.x,yy); c.fillText("!",B.x,yy); }
    if(B.st==="tired"||B.st==="dizzy"||B.st==="stunned"){ for(let i=0;i<3;i++){ const a=tm*5+i*2.1; c.font="12px sans-serif"; c.textAlign="center"; c.fillText(B.st==="tired"?"💦":"⭐",B.x+B.face*28+Math.cos(a)*16,B.y-62+Math.sin(a)*4); }
      c.save(); c.globalAlpha=.6+Math.sin(tm*8)*.3; c.fillStyle="#fff7c0"; c.translate(B.x+B.face*10,B.y-94+Math.sin(tm*6)*3); c.beginPath(); c.moveTo(-8,-9); c.lineTo(8,-9); c.lineTo(0,2); c.closePath(); c.fill(); c.restore(); } }
  BONES.forEach(b=>{ c.save(); c.translate(b.x,b.y); drawBone(c,b.a); c.restore(); });
}
function drawFX(){ const c=ctx;
  FX.forEach(f=>{ const u=f.t/f.life;
    if(f.k==="dust"){ c.fillStyle=f.col+(.55*(1-u))+")"; circ(c,f.x,f.y,f.r*(1+u)); c.fill(); }
    else if(f.k==="spark"){ c.fillStyle=f.col; c.globalAlpha=1-u; c.save(); c.translate(f.x,f.y); c.rotate(f.t*8); c.fillRect(-f.r,-f.r*.35,f.r*2,f.r*.7); c.fillRect(-f.r*.35,-f.r,f.r*.7,f.r*2); c.restore(); c.globalAlpha=1; }
    else if(f.k==="ring"){ c.strokeStyle=f.col+(.85*(1-u))+")"; c.lineWidth=6*(1-u)+1; circ(c,f.x,f.y,f.R*(.15+.85*Math.sqrt(u))); c.stroke(); }
    else if(f.k==="conf"||f.k==="leaf"){ c.save(); c.translate(f.x,f.y); c.rotate(f.rot); c.fillStyle=f.col; c.globalAlpha=Math.min(1,(1-u)*3); if(f.k==="leaf"){ ell(c,0,0,4,2,0); c.fill(); } else c.fillRect(-3,-1.6,6,3.2); c.restore(); c.globalAlpha=1; } });
  c.textAlign="center"; c.textBaseline="middle"; POP.forEach(p=>{ c.globalAlpha=1-p.t/.9; c.font="bold 13px sans-serif"; c.lineWidth=3; c.strokeStyle="rgba(90,40,10,.8)"; c.strokeText(p.txt,p.x,p.y); c.fillStyle=p.col; c.fillText(p.txt,p.x,p.y); }); c.globalAlpha=1;
}
/* ---------- HUD ---------- */
function heart(c,x,y,s,full){ c.save(); c.translate(x,y); c.scale(s/20,s/20); c.beginPath(); c.moveTo(0,7); c.bezierCurveTo(-13,-1,-9,-11,0,-5); c.bezierCurveTo(9,-11,13,-1,0,7); c.closePath();
  c.fillStyle=full?"#ff3d6e":"rgba(255,255,255,.35)"; c.fill(); c.lineWidth=2.4; c.strokeStyle="#7a1f2e"; c.stroke(); if(full){ c.fillStyle="rgba(255,255,255,.7)"; ell(c,-4.5,-3.5,2.4,1.6,-.5); c.fill(); } c.restore(); }
let lastRoarP=-1;
function drawHUD(){ const c=ctx; c.setTransform(DPR,0,0,DPR,0,0); if(state!=="play"&&state!=="pause") return;
  const x0=INS.l+12, y0=INS.t+12, k=Math.min(1.15,Math.max(.85,Math.min(W,H)/420));
  c.save(); c.translate(x0,y0); c.scale(k,k);
  rrect(c,-6,-6,198,64,16); c.fillStyle="rgba(70,30,10,.38)"; c.fill();
  for(let i=0;i<3;i++) heart(c,12+i*26,12,22,i<P.hearts);
  // bug count
  drawBug(c,104,12,0,false); c.font="900 17px Rubik,Arial,sans-serif"; c.textAlign="left"; c.textBaseline="middle"; c.lineWidth=3.5; c.strokeStyle="#5a2e12"; const bt="×"+stats.bugs; c.strokeText(bt,114,13); c.fillStyle="#fff"; c.fillText(bt,114,13);
  // roar meter
  const m=P.roarM; rrect(c,22,34,92,14,7); c.fillStyle="rgba(255,255,255,.3)"; c.fill(); if(m>0){ rrect(c,22,34,92*m,14,7); const g=c.createLinearGradient(22,0,114,0); g.addColorStop(0,"#ff9a1f"); g.addColorStop(1,m>=1?"#ffe14a":"#ffc04a"); c.fillStyle=g; c.fill(); }
  rrect(c,22,34,92,14,7); c.lineWidth=2; c.strokeStyle=m>=1?"#fff3a0":"#5a2e12"; c.stroke(); c.font="18px sans-serif"; c.textAlign="center"; c.fillText("🦁",10,41);
  // paws
  for(let i=0;i<3;i++){ c.save(); c.translate(132+i*21,41); c.scale(.68,.68); drawPaw(c,0,0,1.6,!stats.paws[i]); c.restore(); }
  c.restore();
  if(BOSS&&BOSS.st!=="run"&&!(BOSS.st==="defeat")){ const bw=Math.min(220,W*.5), bx=(W-bw)/2, by=INS.t+(portrait?118:14)+(W<560&&!portrait?50:0);
    c.font="20px sans-serif"; c.textAlign="center"; c.fillText("😤",bx-14,by+9); rrect(c,bx,by,bw,16,8); c.fillStyle="rgba(70,30,10,.5)"; c.fill();
    for(let i=0;i<3;i++){ if(i<BOSS.hp){ rrect(c,bx+3+i*(bw-6)/3,by+3,(bw-6)/3-3,10,5); c.fillStyle="#ff5d4a"; c.fill(); } } rrect(c,bx,by,bw,16,8); c.strokeStyle="#fff"; c.lineWidth=2; c.stroke(); }
  // roar button meter
  const pr=Math.round((1-m)*100); if(pr!==lastRoarP){ lastRoarP=pr; $("roarCd").style.setProperty("--p",pr+"%"); $("bRoar").classList.toggle("full",m>=1); }
}
/* ---------- frame ---------- */
function render(){ const c=ctx; c.direction="ltr";
  drawSky(); drawLayers();
  const sx=shk?(Math.random()-.5)*shk:0, sy=shk?(Math.random()-.5)*shk:0;
  c.setTransform(S*DPR,0,0,S*DPR,(-cam.x*S+sx)*DPR,(-cam.y*S+sy)*DPR);
  drawDecorBack(); drawCanopyTrees(); drawSpecialTrees();
  drawTerrain(); ROCKS.forEach(drawRock);
  if(wallUp>0){ const w=ARENA_WALL; drawRock([w[0],w[1]+(1-wallUp)*w[3],w[2],w[3]*wallUp+30,"wall"]); }
  ONEWAY.forEach(drawOneway); drawDecorFront(); SIGNS.forEach(drawSign); CPS.forEach(drawCheckpoint);
  drawEntities(); if(P&&state!=="menu") drawPlayer(); drawFX();
  if(cine&&cine.flare){ c.setTransform(DPR,0,0,DPR,0,0); c.fillStyle="rgba(255,236,170,"+(cine.flare*.18)+")"; c.fillRect(0,0,W,H); }
  if(state==="play"&&P&&P.hearts===1&&!cine){ c.setTransform(DPR,0,0,DPR,0,0); const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.75); g.addColorStop(0,"rgba(255,0,40,0)"); g.addColorStop(1,"rgba(255,0,40,"+(.16+Math.sin(tm*5)*.06)+")"); c.fillStyle=g; c.fillRect(0,0,W,H); }
  drawHUD();
}
/* ===== UI, input, loop ===== */
const OVS=["menu","pause","over","win"];
function showOv(id){ OVS.forEach(o=>$(o).classList.toggle("show",o===id)); const play=!id; $("pad").classList.toggle("hidden",!play&&id!=="pause"); $("topb").classList.toggle("hidden",!play); resize(); }
function applyLang(){ const L=t(); document.documentElement.lang=lang; document.documentElement.dir=L.dir; document.title=L.title;
  $("tTitle").textContent=L.title; $("tSub").textContent=L.sub; $("playBtn").textContent=L.play;
  const best=lsGet(BEST_KEY), bp=lsGet(PAWS_KEY); $("tBest").innerHTML=(best?"<span>"+L.best.replace("{n}",best)+"</span>":"")+(bp?"<span>"+L.pawsBest.replace("{n}",bp)+"</span>":"");
  $("tTip").innerHTML=L.tip+(matchMedia("(pointer:fine)").matches?"<br><small>"+L.keys+"</small>":""); $("tRot").textContent=L.rot;
  $("tPause").textContent=L.pause; $("resumeBtn").textContent=L.resume; $("pCpBtn").textContent=L.fromCp; $("restartBtn").textContent=L.restart; $("pMenuBtn").textContent=L.menu;
  $("tOver").textContent=L.over; $("tOverS").textContent=L.overS; $("cpBtn").textContent=L.retry; $("againBtn").textContent=L.restart; $("oMenuBtn").textContent=L.menu;
  $("tWin").textContent=L.win; $("tWinS").textContent=L.winS; $("wAgainBtn").textContent=L.again; $("wMenuBtn").textContent=L.menu;
  const box=$("langs"); box.querySelectorAll(".lang").forEach(b=>b.remove());
  Object.keys(LN).forEach(k=>{ const b=document.createElement("button"); b.className="lang"+(k===lang?" sel":""); b.textContent=LN[k]; b.onclick=()=>{ lang=k; lsSet("annabelle-lang",k); SFX.click(); applyLang(); }; box.insertBefore(b,box.querySelector(".an-nav")); });
  $("muteBtn").textContent=muted?"🔇":"🔊"; }
function startGame(fromCp){ ac(); SFX.click(); resetLevel(!!fromCp); state="play"; showOv(null); $("pad").classList.remove("ride"); playSong("savanna"); tempoMul=1; songName="savanna";
  if(!fromCp) setTimeout(()=>{ if(state==="play") hint("run"); },700); }
window.toMenu=function(){ state="menu"; stopSong(); showOv("menu"); applyLang(); };
function pauseGame(){ if(state!=="play") return; state="pause"; showOv("pause"); $("pad").classList.add("hidden"); $("pCpBtn").classList.toggle("hidden",!cp); releaseAll(); }
function resumeGame(){ if(state!=="pause") return; state="play"; showOv(null); ac(); }
function gameOver(){ if(state!=="play") return; state="over"; stopSong(); showOv("over"); $("pad").classList.add("hidden"); releaseAll(); }
function finishWin(){ const s=stats, paws=s.paws.filter(Boolean).length, total=BUGS.filter(b=>!b.heal).length+BUGS.filter(b=>b.heal).length;
  const sec=Math.round(s.time), score=s.bugs*10+paws*250+s.foes*50+1000+P.hearts*200+Math.max(0,420-sec)*5;
  const stars=1+(s.bugs>=total*.5?1:0)+(paws>=2?1:0);
  const best=lsGet(BEST_KEY), rec=score>best; if(rec) lsSet(BEST_KEY,score); if(paws>lsGet(PAWS_KEY)) lsSet(PAWS_KEY,paws);
  state="win"; showOv("win"); $("pad").classList.add("hidden");
  const L=t(); $("stats").innerHTML=`<span>${L.bugsL}</span><b>${s.bugs} / ${total}</b><span>${L.pawsL}</span><b>${paws} / 3</b><span>${L.timeL}</span><b>${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}</b><span>${L.scoreL}</span><b>${score}</b>`;
  $("tRec").textContent=rec?L.rec:"";
  const st=$("stars").children; for(let i=0;i<3;i++){ st[i].className="star"; ((i)=>setTimeout(()=>{ st[i].className="star "+(i<stars?"on":"off"); if(i<stars) SFX.bug(i*2); },350+i*380))(i); }
  window.__lionResult={score,stars,paws,bugs:s.bugs,total,time:sec};
}
/* buttons */
$("playBtn").onclick=()=>startGame(false);
$("resumeBtn").onclick=resumeGame; $("pCpBtn").onclick=()=>startGame(true); $("restartBtn").onclick=()=>{ cp=null; startGame(false); };
$("pMenuBtn").onclick=toMenu; $("oMenuBtn").onclick=toMenu; $("wMenuBtn").onclick=toMenu;
$("cpBtn").onclick=()=>startGame(!!cp); $("againBtn").onclick=()=>{ cp=null; startGame(false); }; $("wAgainBtn").onclick=()=>{ cp=null; startGame(false); };
$("pauseBtn").onclick=pauseGame; $("muteBtn").onclick=()=>{ setMuted(!muted); $("muteBtn").textContent=muted?"🔇":"🔊"; ac(); };
/* keyboard */
const KM={ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r",Space:"j",ArrowUp:"j",KeyW:"j",KeyZ:"j",KeyX:"roar",KeyK:"roar",ShiftLeft:"roar",ArrowDown:"roll",KeyS:"roll",KeyC:"roll"};
function press(k,v){ if(v&&!keys[k]){ if(k==="j") jEdge=1; if(k==="roar") roarEdge=1; if(k==="roll") rollEdge=1; } keys[k]=v?1:0; }
function releaseAll(){ Object.keys(keys).forEach(k=>keys[k]=0); document.querySelectorAll(".pb.on").forEach(b=>b.classList.remove("on")); }
addEventListener("keydown",e=>{ if(e.code==="Escape"||e.code==="KeyP"){ state==="play"?pauseGame():state==="pause"&&resumeGame(); return; }
  if(state==="menu"&&(e.code==="Enter"||e.code==="Space")){ e.preventDefault(); startGame(false); return; }
  const k=KM[e.code]; if(k&&state==="play"){ e.preventDefault(); if(!e.repeat) ac(); press(k,1); } });
addEventListener("keyup",e=>{ const k=KM[e.code]; if(k) press(k,0); });
/* touch: d-pad (slide between arrows) + action buttons */
const dpadPtr=new Map();
function dpadUpdate(){ let l=0,r=0; const mid=$("bR").getBoundingClientRect().left-4; dpadPtr.forEach(x=>{ if(x<mid) l=1; else r=1; }); keys.l=l; keys.r=r; $("bL").classList.toggle("on",!!l); $("bR").classList.toggle("on",!!r); }
const dp=$("dpad");
dp.addEventListener("pointerdown",e=>{ e.preventDefault(); ac(); try{ dp.setPointerCapture(e.pointerId); }catch(_){} dpadPtr.set(e.pointerId,e.clientX); dpadUpdate(); });
dp.addEventListener("pointermove",e=>{ if(dpadPtr.has(e.pointerId)){ dpadPtr.set(e.pointerId,e.clientX); dpadUpdate(); } });
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>dp.addEventListener(ev,e=>{ dpadPtr.delete(e.pointerId); dpadUpdate(); }));
[["bJ","j"],["bRoar","roar"],["bRoll","roll"]].forEach(([id,k])=>{ const b=$(id), ptrs=new Set();
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); ac(); try{ b.setPointerCapture(e.pointerId); }catch(_){} ptrs.add(e.pointerId); press(k,1); b.classList.add("on"); });
  const up=e=>{ ptrs.delete(e.pointerId); if(!ptrs.size){ press(k,0); b.classList.remove("on"); } };
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,up)); b.addEventListener("contextmenu",e=>e.preventDefault()); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pauseGame(); });
addEventListener("resize",resize); addEventListener("load",()=>setTimeout(resize,50)); addEventListener("orientationchange",()=>setTimeout(resize,200));
/* title cub */
const tc=$("tcub"), tctx=tc.getContext("2d");
function drawTitle(){ const c=tctx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,360,300);
  const g=c.createRadialGradient(180,150,10,180,150,150); g.addColorStop(0,"rgba(255,246,200,.95)"); g.addColorStop(.45,"rgba(255,200,110,.6)"); g.addColorStop(1,"rgba(255,160,90,0)"); c.fillStyle=g; c.fillRect(0,0,360,300);
  c.save(); c.translate(180,150); c.rotate(tm*.15); c.fillStyle="rgba(255,240,180,.35)"; for(let i=0;i<10;i++){ c.rotate(TAU/10); c.beginPath(); c.moveTo(0,0); c.lineTo(170,-14); c.lineTo(170,14); c.closePath(); c.fill(); } c.restore();
  circ(c,180,150,70); const sg=c.createLinearGradient(0,80,0,220); sg.addColorStop(0,"#fff6c8"); sg.addColorStop(1,"#ffb84a"); c.fillStyle=sg; c.fill();
  c.fillStyle="#b9733d"; c.beginPath(); c.moveTo(20,300); c.quadraticCurveTo(60,236,150,232); c.lineTo(250,226); c.quadraticCurveTo(290,224,320,250); c.lineTo(340,300); c.closePath(); c.fill();
  c.fillStyle="#8fbf3c"; c.beginPath(); c.moveTo(56,252); c.quadraticCurveTo(120,226,250,224); c.quadraticCurveTo(296,224,316,246); c.lineTo(310,252); c.quadraticCurveTo(200,236,60,258); c.fill();
  drawTuft(c,90,250,1.1,tm,1); drawTuft(c,300,238,.9,tm,3); drawTuft(c,250,232,1,tm,2);
  const cyc=tm%6, roar=cyc>4.2&&cyc<5.1, R=roar?Math.sin((cyc-4.2)/.9*PI):0;
  c.save(); c.translate(178,232); c.scale(3.1,3.1); drawCub(c,{m:roar?"roar":"idle",t:tm,blink:(tm%3.3)<.13,roar:R,sq:0}); c.restore();
  if(roar){ c.strokeStyle="rgba(255,250,220,"+(.8*R)+")"; c.lineWidth=5; circ(c,240,150,30+(cyc-4.2)*120); c.stroke(); }
  for(let i=0;i<3;i++){ const x=60+i*120+Math.sin(tm*.8+i)*30, y=70+Math.sin(tm*1.4+i*2)*16, w=Math.abs(Math.sin(tm*12+i)); c.fillStyle=["#ff7ab8","#7ad0ff","#ffe066"][i]; ell(c,x-5*w,y,6*w+.5,4.6,-.4); c.fill(); ell(c,x+5*w,y,6*w+.5,4.6,.4); c.fill(); }
}
/* loop */
let last=performance.now(), acc=0;
function frame(now){ const d=Math.min(.1,(now-last)/1000); last=now;
  if(state==="play"){ acc+=d; let n=0; while(acc>=STEP&&n<6){ step(STEP); acc-=STEP; n++; } if(n===6) acc=0; }
  else { tm+=d; acc=0; if(state==="menu"){ cam.x=(150+tm*28)%(LEN-VW-300); cam.y=camNeutral(); } }
  render(); if(state==="menu") drawTitle();
  requestAnimationFrame(frame); }
/* test hook */
window.__lion={ get state(){ return state; }, get P(){ return P; }, get boss(){ return BOSS; }, get stats(){ return stats; }, get cam(){ return cam; }, keys, press, step:(n)=>{ for(let i=0;i<(n||1);i++) step(STEP); },
  tp:(x,y)=>{ P.x=x; P.y=y==null?G:y; P.vx=0; P.vy=0; P.mode="normal"; P.on=false; cam.x=Math.max(0,x-VW*.45); }, info:()=>({state,x:Math.round(P.x),y:Math.round(P.y),mode:P.mode,hearts:P.hearts,bugs:stats&&stats.bugs,boss:BOSS&&{st:BOSS.st,hp:BOSS.hp,x:Math.round(BOSS.x)},cp,S,VW,VH}),
  setCp:(x,y)=>{ cp={x,y:y||G}; }, start:startGame, hearts:(n)=>{ P.hearts=n; }, rideO:()=>rideO, monkey:()=>monkey };
/* init */
resize(); resetLevel(false); applyLang(); requestAnimationFrame(frame);
