<style>
:root{--ink:#22314d;--tl:#1f8a8a;--pk:#e0457b;--or:#ffb347;--cream:#fff7e6;--gr:#39b36a;--bl:#3d8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:linear-gradient(160deg,#bfeee6,#cfe3ff 55%,#e6d4ff);font-family:"Rubik","Varela Round","IBM Plex Sans Hebrew",Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button,a{font-family:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation;background:none;padding:0;text-decoration:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:var(--sab,8px)}
.scr.on{display:flex}
.ib{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 4px 0 #0003;font-size:21px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .06s}
.ib:active{transform:translateY(3px) scale(.92);box-shadow:0 1px 0 #0003}.ib.off{opacity:.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 16px;border-radius:18px;background:var(--or);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-weight:900;font-size:clamp(16px,4.6vw,20px);color:var(--ink);transition:transform .06s;line-height:1.15;text-align:center}
.btn:active,.btn.dn{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 var(--ink)}
.btn.g{background:#7be08f}.btn.w{background:#fff}.btn.p{background:#ffb3d1}.btn.b{background:#9fd0ff}.btn.sm{min-height:44px;font-size:15px;padding:6px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{filter:grayscale(.7);opacity:.6}
/* hub */
#hub{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;align-items:center}
#hubIn{width:100%;max-width:1040px;padding:4px 12px 18px;display:flex;flex-direction:column;gap:10px}
#hTop{display:flex;align-items:center;gap:8px}
#hTop h1{flex:1;margin:0;font-size:clamp(19px,5.6vw,30px);line-height:1.1;font-weight:900;text-align:start}
#hTop small{display:block;font-size:clamp(12px,3.4vw,15px);font-weight:700;opacity:.8;margin-top:2px}
#masc{width:74px;height:74px;flex:none;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
#hStats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{background:#fff;border-radius:999px;padding:5px 12px;font-weight:900;font-size:clamp(13px,3.8vw,17px);box-shadow:0 3px 0 #0002;white-space:nowrap;display:flex;align-items:center;gap:4px}
#daily{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#fff2a8,#ffd1e6);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:8px 12px;text-align:start;width:100%}
#daily .e{font-size:38px;flex:none}#daily b{display:block;font-size:clamp(16px,4.6vw,20px)}#daily span{font-size:clamp(12px,3.5vw,15px);font-weight:700}
#daily .go{margin-inline-start:auto;font-size:26px;flex:none}#daily.done{background:linear-gradient(90deg,#d3f8d8,#e6fff0)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:8px 6px 8px;min-height:118px;transition:transform .06s;overflow:hidden}
.stc:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.stc .e{font-size:40px;line-height:1.1;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.stc b{font-size:clamp(14px,4vw,18px);line-height:1.15;text-align:center}
.stc .s{font-size:13px;font-weight:900;direction:ltr;letter-spacing:1px}
.stc .lv{position:absolute;top:5px;inset-inline-end:7px;font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:999px;padding:2px 7px;direction:ltr}
.stc .bar{width:86%;height:8px;border-radius:9px;background:#0001;overflow:hidden;direction:ltr}.stc .bar i{display:block;height:100%;background:var(--gr);border-radius:9px}
#qCard{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,#2b2a66,#5a3ea8);color:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:10px 12px;text-align:start;width:100%}
#qCard .e{font-size:44px;animation:bob 1.6s ease-in-out infinite}#qCard b{display:block;font-size:clamp(18px,5vw,23px)}#qCard span{font-size:clamp(12px,3.5vw,15px);font-weight:700;opacity:.9}
.hs{background:#241640;color:#8dffb0;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-family:"Courier New",monospace;font-weight:700;direction:ltr;width:100%}
.hsT{color:#ffd23f;letter-spacing:2px;font-size:15px;text-align:center}
.hsR{display:flex;justify-content:space-between;font-size:15px;line-height:1.35}.hsR span:nth-child(2){flex:1;text-align:center}
.hsR.cur{color:#fff;animation:blink .5s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
.hsE{color:#b9a8d8;font-size:13px;text-align:center;padding:3px 0}
#langs{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
#flags button{font-size:15px;font-weight:900;min-width:44px;min-height:44px;border-radius:999px;background:#fff;border:2px solid var(--ink);margin:0 2px;padding:0 10px}#flags button.on{background:var(--or)}
/* lab */
#lab,#quiz{align-items:center}
.col{width:100%;max-width:820px;display:flex;flex-direction:column;flex:1;min-height:0;padding:0 8px;gap:6px}
.bar{display:flex;align-items:center;gap:6px;direction:ltr;flex:none}
.bar .ttl{flex:1;min-width:0;text-align:center;font-weight:900;font-size:clamp(15px,4.3vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dots{display:flex;gap:5px;justify-content:center;direction:ltr;flex:none}
#dots button{width:34px;height:30px;border-radius:10px;background:#fff;border:2px solid var(--ink);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;position:relative}
#dots button::after{content:"";position:absolute;inset:-9px -3px}
#dots button.cur{background:var(--or);transform:scale(1.12)}#dots button.done{background:#c9f5d2;font-size:9px;letter-spacing:-1px;color:#b97a00}#dots button.lock{opacity:.4}
#goal{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;font-weight:800;font-size:clamp(14px,4vw,18px);line-height:1.25;text-align:center;flex:none;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px}
#goal.pop{animation:gpop .5s}@keyframes gpop{40%{transform:scale(1.05)}}
#stage{position:relative;flex:1;min-height:120px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#eaf6ff}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:8px;right:8px;top:8px;background:#fffbe0;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:clamp(13px,3.8vw,17px);text-align:center;line-height:1.3;opacity:0;transform:translateY(-12px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:3}
#toast.on{opacity:1;transform:none}#toast.hint{background:#e3f0ff;pointer-events:auto}
#toast .btn{margin:6px auto 0;display:inline-flex}
#pop{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:clamp(28px,8.5vw,50px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;z-index:4;opacity:0}
#pop.on{animation:popUp 1s cubic-bezier(.2,1.5,.4,1) both}@keyframes popUp{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.15) rotate(3deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-40px) scale(.9)}}
#ctl,#ask{flex:none;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
#ask{display:none;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:8px 10px;animation:askIn .3s cubic-bezier(.3,1.5,.5,1)}@keyframes askIn{from{transform:translateY(30px);opacity:0}}
body.asking #ask{display:flex}body.asking #ctl{display:none}
#ask .q{font-weight:900;font-size:clamp(15px,4.3vw,19px);text-align:center;line-height:1.25}
#ask .tag{font-size:12px;font-weight:900;color:var(--pk);text-align:center;letter-spacing:.5px}
#ask .os{display:grid;gap:7px;grid-template-columns:1fr}#ask .os.two{grid-template-columns:1fr 1fr}
#ask .btn{min-height:48px;font-size:clamp(14px,4.1vw,18px);padding:5px 10px}
#ask .btn.ok{background:#7be08f}#ask .btn.no{background:#ffc9c9}
.row{display:flex;align-items:center;gap:6px;direction:ltr}
.row label{font-weight:900;font-size:clamp(13px,3.7vw,16px);min-width:74px;text-align:center;line-height:1.15}
.row output{font-weight:900;font-size:clamp(13px,3.7vw,16px);min-width:66px;text-align:center;background:#fff;border-radius:10px;padding:4px 4px;border:2px solid var(--ink);direction:ltr}
.row .pm{width:44px;height:44px;border-radius:12px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:22px;font-weight:900;flex:none;display:flex;align-items:center;justify-content:center}
.row .pm:active{transform:translateY(3px);box-shadow:none}
.row.lock{opacity:.55}.row.lock input,.row.lock .pm{pointer-events:none}
input[type=range]{flex:1;min-width:0;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:none;direction:ltr}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:9px;background:#fff;border:3px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--or);border:3px solid var(--ink);margin-top:-13px;box-shadow:0 3px 0 #0003}
input[type=range]::-moz-range-track{height:10px;border-radius:9px;background:#fff;border:3px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--or);border:3px solid var(--ink)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btns .btn{flex:1;min-width:110px}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{min-width:52px;min-height:48px;padding:3px 9px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip i{font-style:normal;font-size:24px}.chip.on{background:var(--or);transform:translateY(-3px)}.chip.used{opacity:.45}
.info{font-weight:800;font-size:clamp(13px,3.7vw,16px);text-align:center;line-height:1.25}
/* overlays */
.ov{position:fixed;inset:0;background:#22314dcc;display:none;align-items:center;justify-content:center;padding:12px;z-index:30;overflow-y:auto;touch-action:pan-y}
.ov.on{display:flex}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:14px 16px;width:min(100%,440px);max-height:100%;overflow-y:auto;text-align:center;animation:cardIn .45s cubic-bezier(.3,1.6,.5,1)}@keyframes cardIn{from{transform:scale(.6) translateY(40px);opacity:0}}
.card h2{margin:2px 0 6px;font-size:clamp(21px,6vw,28px)}
.card p{margin:6px 0;font-weight:700;font-size:clamp(15px,4.2vw,18px);line-height:1.4}
.card .btn{margin:8px 0;width:100%}
.stars{font-size:clamp(34px,10vw,46px);direction:ltr;line-height:1.1}
.stars span{display:inline-block;animation:starPop .5s cubic-bezier(.3,1.8,.5,1) both}.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes starPop{from{transform:scale(0) rotate(-90deg)}}
.stars span.off{filter:grayscale(1) opacity(.3)}
.why{background:#fff;border:3px dashed var(--tl);border-radius:16px;padding:8px 10px;margin:8px 0;text-align:start}
.why h3{margin:0 0 4px;font-size:clamp(15px,4.2vw,18px);color:var(--tl)}
.why p{margin:3px 0;font-size:clamp(14px,4vw,17px)}
.why canvas{display:block;width:100%;max-width:300px;height:96px;margin:4px auto 0}
.why .fx{direction:ltr;text-align:center;font-weight:900;background:#eef7ff;border-radius:10px;padding:4px;font-size:15px;margin-top:4px}
.verdict{font-weight:900!important;color:var(--pk)}
.rec{color:var(--pk);font-weight:900;font-size:clamp(20px,6vw,28px);animation:blink .45s steps(2) infinite;margin:4px 0}
.scl{font-size:clamp(34px,10vw,48px)!important;font-weight:900;direction:ltr;margin:2px 0!important}
/* quiz */
#qStage{position:relative;height:clamp(110px,22vh,190px);flex:none;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#141233}
#qcv{position:absolute;inset:0;width:100%;height:100%}
#qQ{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 12px;font-weight:900;font-size:clamp(17px,4.9vw,24px);line-height:1.3;text-align:center;flex:1;min-height:70px;display:flex;align-items:center;justify-content:center}
#qOs{display:grid;grid-template-columns:1fr;gap:8px;flex:none}
#qOs .btn{min-height:54px;background:#fff}#qOs .btn.ok{background:#7be08f}#qOs .btn.no{background:#ffc9c9}
#qX{min-height:52px;flex:none;background:#fffbe0;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:clamp(13px,3.8vw,16px);line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;visibility:hidden}
#qX.on{visibility:visible}
.pips{display:inline-flex;gap:2px;direction:ltr;vertical-align:middle}.pips i{width:8px;height:8px;border-radius:50%;background:#d9d4ea;display:block}.pips i.on{background:#39b36a}
#qCard .mem{display:flex;gap:10px;margin-top:4px;direction:ltr;flex-wrap:wrap}#qCard .mem span{display:inline-flex;align-items:center;gap:3px;opacity:1}#qCard .pips i{background:#ffffff44}#qCard .pips i.on{background:#8dffb0}
html[dir=rtl] #qCard .mem{justify-content:flex-end}
.crs{display:flex;flex-direction:column;gap:5px;margin:8px 0}.crT{font-weight:900;font-size:14px;opacity:.75}
.cr{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;text-align:start;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:900;font-size:14.5px}
.cr small{grid-column:1/3;font-weight:700;font-size:12.5px;opacity:.8}.cr .upm{color:#1f8a4a}
.nx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}.card .nx .btn{margin:0;font-size:15px;padding:6px 8px;min-height:50px}.card .nx .btn:first-child{grid-column:1/3;font-size:clamp(16px,4.6vw,20px)}.card .nx .btn:last-child:nth-child(2){grid-column:1/3}
#qQ{flex-direction:column;gap:4px}#qQ .rv{font-size:12.5px;font-weight:900;color:var(--pk)}
#qNext,#qSkip{display:none;flex:none}#quiz.warm #qSkip{display:flex}#quiz.warm #qStage,#quiz.warm #qTime,#quiz.warm #qPause{display:none}
#qTime.low{background:#ff5a6e;color:#fff;animation:blink .5s steps(2) infinite}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:44}#flash.on{animation:fl .35s}@keyframes fl{0%{opacity:.8}100%{opacity:0}}
body.shake #stage,body.shake #qStage{animation:shk .3s}@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
@media (min-width:760px){
.desk #grid{grid-template-columns:repeat(4,1fr)}
.desk #hubIn{display:grid;grid-template-columns:1.25fr 1fr;gap:10px 14px;align-items:start}
.desk #hTop,.desk #grid,.desk #langs{grid-column:1/-1}.desk #hStats{grid-column:1/-1}
.desk #lab .col{max-width:1100px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);grid-template-rows:auto auto auto 1fr;gap:6px 12px}
.desk #lab .bar{grid-column:1/-1}.desk #dots{grid-column:1/-1}
.desk #stage{grid-column:1;grid-row:3/5;min-height:0}
.desk #goal{grid-column:2;grid-row:3;align-self:start}
.desk #ctl,.desk #ask{grid-column:2;grid-row:4;align-self:start}
.desk #quiz .col{max-width:760px}.desk #qOs{grid-template-columns:1fr 1fr}
}
@media (max-height:700px){.stc{min-height:96px;padding:5px}.stc .e{font-size:32px;width:48px;height:48px}#masc{width:58px;height:58px}.card{padding:10px 14px}}
@media (max-width:360px){.row label{min-width:60px}.row output{min-width:56px}}
@media (prefers-reduced-motion:reduce){#masc,#qCard .e{animation:none}}
</style>

 /* nodal analysis: comps = [{a,b,R}] resistors and [{a,b,V,r}] batteries (+ terminal at a). Returns node voltages and currents. */
 solve(n,comps){const G=[],I=new Array(n).fill(0);for(let k=0;k<n;k++){G.push(new Array(n).fill(0));G[k][k]=1e-9}
  comps.forEach(c=>{const g=1/(c.V!==undefined?c.r:c.R);G[c.a][c.a]+=g;G[c.b][c.b]+=g;G[c.a][c.b]-=g;G[c.b][c.a]-=g;if(c.V!==undefined){I[c.a]+=c.V*g;I[c.b]-=c.V*g}});
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(G[r][c])>Math.abs(G[p][c]))p=r;[G[c],G[p]]=[G[p],G[c]];[I[c],I[p]]=[I[p],I[c]];const d=G[c][c];if(Math.abs(d)<1e-14)continue;
   for(let r=c+1;r<n;r++){const f=G[r][c]/d;if(!f)continue;for(let k=c;k<n;k++)G[r][k]-=f*G[c][k];I[r]-=f*I[c]}}
  const v=new Array(n).fill(0);for(let r=n-1;r>=0;r--){let s=I[r];for(let k=r+1;k<n;k++)s-=G[r][k]*v[k];v[r]=Math.abs(G[r][r])<1e-14?0:s/G[r][r]}
  return{v:v,i:comps.map(c=>c.V!==undefined?(c.V-(v[c.a]-v[c.b]))/c.r:(v[c.a]-v[c.b])/c.R)}},

  for(let b=0;b<=(maxB||6);b++){let bt=1e9,what=null;
   mirrors.forEach(m=>{const c=Math.cos(m.a*D2R)*m.len/2,s=Math.sin(m.a*D2R)*m.len/2,t=seg(p,d,[m.x-c,m.y-s],[m.x+c,m.y+s]);if(t!==null&&t<bt){bt=t;what=m}});

   [[0,0,10,0],[10,0,10,10],[10,10,0,10],[0,10,0,0]].forEach(w=>{const t=seg(p,d,[w[0],w[1]],[w[2],w[3]]);if(t!==null&&t<bt){bt=t;what='edge'}});
   if(tgt){const fx=p[0]-tgt.x,fy=p[1]-tgt.y,B=fx*d[0]+fy*d[1],C=fx*fx+fy*fy-tgt.r*tgt.r,D=B*B-C;if(D>=0){const t=-B-Math.sqrt(D);if(t>1e-6&&t<bt){bt=t;what='tgt'}}}

WHY.shadow={t:["איך נוצר צל","Comment naît une ombre","How a shadow forms"],a:["אור נע בקו ישר ולא יכול לעבור דרך גוף אטום, ולכן מאחורי הגוף נשאר אזור חשוך: צל.|כשהמנורה נמוכה הקרניים שטוחות יותר, והצל מתארך.","La lumière va en ligne droite et ne traverse pas un objet opaque : derrière lui reste une zone sombre, l'ombre.|Quand la lampe est basse, les rayons sont plus rasants et l'ombre s'allonge.","Light travels in a straight line and cannot pass through a solid object, so a dark area is left behind it: a shadow.|When the lamp is low the rays are flatter and the shadow gets longer."],fx:U('shadow = d × h ÷ (H − h)'),
 d(g){line(g,10,84,290,84,'#22314d',2);emo(g,'💡',40,20,20);box(g,120,54,14,30,3,'#5b6577','#22314d',2);line(g,40,20,220,84,'#e8a800',2,[4,4]);line(g,134,84,220,84,'#22314d',6)}};
WHY.noon={t:["צל של צהריים","L'ombre de midi","The noon shadow"],a:["כשהאור מגיע ישר מלמעלה הצל נופל ממש מתחת לגוף, והוא קצר מאוד.|לכן בצהריים, כשהשמש גבוהה בשמיים, הצל שלנו הכי קצר, ובבוקר ובערב הוא ארוך.","Quand la lumière arrive droit d'en haut, l'ombre tombe juste sous l'objet et elle est très courte.|C'est pourquoi à midi, quand le Soleil est haut, notre ombre est la plus courte ; le matin et le soir elle est longue.","When light comes straight down, the shadow falls right under the object and is very short.|That is why at noon, when the Sun is high, our shadow is shortest, and in the morning and evening it is long."],

WHY.similar={t:["משולשים דומים","Les triangles semblables","Similar triangles"],a:["הקרן שעוברת בראש הפסל יוצרת שני משולשים בעלי אותה צורה: אחד גדול מהמנורה ואחד קטן מהפסל.|לכן אפשר לחשב את אורך הצל מראש, בלי למדוד.","Le rayon qui passe par le sommet de la statue dessine deux triangles de même forme : un grand depuis la lampe, un petit depuis la statue.|On peut donc calculer la longueur de l'ombre à l'avance, sans mesurer.","The ray past the top of the statue makes two triangles of the same shape: a big one from the lamp and a small one from the statue.|So the shadow length can be worked out in advance, without measuring."],fx:U('shadow ÷ h = d ÷ (H − h)'),
